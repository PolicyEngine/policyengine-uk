# Workflow that checks a pull request's changelog fragments.
#
# towncrier writes a fragment to CHANGELOG.md only when it is named
# <slug>.<type>.md with a type configured in pyproject.toml, and never reads
# or deletes any other file in changelog.d. This fails a pull request that
# adds or changes such a file, or an empty fragment
# (.github/check_changelog_fragments.py). It has no path filter, so it
# reports on every pull request and can be a required check. It also runs for
# merge queue groups, so a queue never waits on it. Dependency-only updates
# are recognized by the checker's full semantic diff on both event types;
# the job still validates every added/changed fragment, including bot PRs.

name: Changelog
on:
  pull_request:
    branches:
      - main
  merge_group:

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run. Merge groups are never cancelled.
concurrency:
  group: pr-changelog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  Fragments:
    name: Changelog fragments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # The merge commit and its parents: the base branch and the PR head.
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check changelog fragments
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # A pull request's checkout is its merge into main, whose first
          # parent is main. A merge group's base can be several commits back.
          base=HEAD^1
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE"
            base=$MERGE_GROUP_BASE
          fi
          python .github/check_changelog_fragments.py --base "$base" --head HEAD
