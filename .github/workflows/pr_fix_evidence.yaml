# Fix pull requests must change an executable test and name the test that
# reproduces the bug (.github/check_fix_pr.py; docs/engineering/skills/github-prs.md).
#
# pull_request_target is safe here because the job never executes, installs or
# imports code from the PR. The base checkout supplies the trusted checker,
# which reads the PR's files as data from git objects.
#
# It also reports on merge queue groups (merge_group), so a branch rule can
# require it with a merge queue on: a group passes, because each pull
# request's evidence was checked on the pull request before it could join
# the queue, and a group has no pull request text to check.

name: Fix evidence
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: fix-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  Fix-evidence:
    name: Fix evidence
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Merge queue group
        if: github.event_name == 'merge_group'
        run: echo "Each pull request in this group passed Fix evidence before it joined the queue."
      - name: Check out the trusted base branch
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The repository is public, so the fetches below need no token.
          persist-credentials: false
      - name: Collect pull request evidence
        id: evidence
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A fresh directory keeps metadata writes away from any PR paths.
          evidence_dir=$(mktemp -d "$RUNNER_TEMP/fix-evidence.XXXXXX")
          printf 'directory=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"
          # PR text stays in environment variables so shell syntax in it cannot run.
          printf '%s' "$PR_TITLE" > "$evidence_dir/title.txt"
          printf '%s' "$PR_BODY" > "$evidence_dir/body.md"
          python3 -c 'import json, os; print("\n".join(json.loads(os.environ["PR_LABELS_JSON"])), end="")' > "$evidence_dir/labels.txt"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          # Fetch the event's immutable head too in case the PR changed again.
          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          merge_base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
          git diff --name-status --no-renames -z "$merge_base" "$PR_HEAD_SHA" > "$evidence_dir/changes.bin"
      - name: Set up uv for the trusted checker
        if: github.event_name == 'pull_request_target'
        uses: astral-sh/setup-uv@v8.1.0
      - name: Check fix evidence
        if: github.event_name == 'pull_request_target'
        env:
          EVIDENCE_DIR: ${{ steps.evidence.outputs.directory }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --no-project --with pyyaml==6.0.2 python .github/check_fix_pr.py \
            --title-file "$EVIDENCE_DIR/title.txt" --body-file "$EVIDENCE_DIR/body.md" \
            --labels-file "$EVIDENCE_DIR/labels.txt" --changes-file "$EVIDENCE_DIR/changes.bin" \
            --repo-root . --head-sha "$PR_HEAD_SHA" \
            --summary-file "$GITHUB_STEP_SUMMARY"
