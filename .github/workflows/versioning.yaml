# The release workflow: version, build, test and publish policyengine-uk.
#
# Invariant: the files on PyPI are the files whose checks passed. On a push to
# main that adds changelog fragments:
#
# 1. Versioning makes the version commit on the latest main and pushes it,
#    retrying if main moves (.github/prepare_release.py). One run at a time.
# 2. Build checks out that exact commit, builds the wheel and sdist once, and
#    checks that they hold exactly that commit's files
#    (.github/release_artifacts.py check-dist). It attests their provenance.
# 3. Lint, Compat (install the wheel with the latest dependencies on every
#    supported Python) and Test (the full suite, test-suite.yaml, on the
#    installed wheel in the locked environment) check those files.
# 4. Publish runs only if all of them passed. It uploads the same files,
#    after checking that PyPI has no different files for that version, then
#    confirms PyPI serves exactly them and tags the version commit.
#
# Before this, Publish needed only Versioning and checked out moving main: on
# 11 October 2026 it uploaded 2.126.6 while the merge's Test job was still
# running (runs 38136097710 and 38136097762), and Versioning failed 20 times
# in two weeks when two runs raced to push.
#
# A failed run can be re-run from the Actions page: Build's files are kept, so
# a re-run tests and publishes the same bytes. To release a version commit
# whose run is gone, dispatch this workflow with its SHA.
#
# Pull requests that change the release machinery (the files under
# pull_request.paths) run steps 2 and 3 on the PR's own commit, without
# versioning or publishing.

name: Versioning updates

on:
  push:
    branches:
      - main
    paths:
      - changelog.d/**
      - pyproject.toml
  workflow_dispatch:
    inputs:
      release-sha:
        description: >
          Release this existing version commit on main (full SHA) instead of
          versioning main. Leave empty to version and release main.
        required: false
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/versioning.yaml
      - .github/workflows/test-suite.yaml
      - .github/actions/**
      - .github/prepare_release.py
      - .github/release_artifacts.py
      - .github/publish-git-tag.sh
      - .github/bump_version.py
      - .github/check_test_shards.py
      - .github/pytest_outcome_log.py
      - .github/test_outcome_allowlist.toml

permissions:
  contents: read

jobs:
  Versioning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The version commit itself (pushed with GITHUB_TOKEN, so it does not
    # normally trigger workflows) never starts another release.
    if: github.event_name != 'push' || github.event.head_commit.message != 'Update package version'
    # One versioning run at a time, never cancelled once started. A run that
    # is still queued is replaced by a newer one; that is safe, because each
    # run versions the latest main, fragments and all.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('release-dry-run-{0}', github.event.pull_request.number) || 'release-versioning' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Make the version commit
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ inputs.release-sha }}
        run: |
          set -euo pipefail
          version_at() {
            git show "$1:pyproject.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'
          }
          if [ "$EVENT" = pull_request ]; then
            # A dry run on the PR's merge commit: build and test it as it is.
            sha=$(git rev-parse HEAD)
            {
              echo "release=true"
              echo "publish=false"
              echo "sha=$sha"
              echo "version=$(version_at "$sha")"
            } | tee -a "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_SHA" ]; then
            # Re-release an existing version commit on main.
            git fetch --no-tags origin main
            if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release-sha must be a full 40-character commit SHA"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD; then
              echo "::error::$RELEASE_SHA is not on main"
              exit 1
            fi
            subject=$(git log -1 --format=%s "$RELEASE_SHA")
            if [ "$subject" != "Update package version" ]; then
              echo "::error::$RELEASE_SHA is not a version commit ('$subject')"
              exit 1
            fi
            {
              echo "release=true"
              echo "publish=true"
              echo "sha=$RELEASE_SHA"
              echo "version=$(version_at "$RELEASE_SHA")"
            } | tee -a "$GITHUB_OUTPUT"
          else
            # The towncrier the lockfile pins, without installing the package.
            towncrier=$(uv export --frozen --extra dev --no-hashes --no-header | grep -E '^towncrier==' | cut -d' ' -f1)
            python3 .github/prepare_release.py \
              --towncrier "uvx --from $towncrier towncrier" \
              --github-output "$RUNNER_TEMP/release.txt"
            committed=$(grep '^committed=' "$RUNNER_TEMP/release.txt" | tail -n 1 | cut -d= -f2)
            {
              echo "release=$committed"
              echo "publish=$committed"
              grep -E '^(sha|version)=' "$RUNNER_TEMP/release.txt"
            } | tee -a "$GITHUB_OUTPUT"
          fi

  Build:
    name: Release build
    needs: Versioning
    if: needs.Versioning.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      wheel-sha256: ${{ steps.check.outputs.wheel-sha256 }}
      sdist-sha256: ${{ steps.check.outputs.sdist-sha256 }}
    steps:
      - name: Checkout the version commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.Versioning.outputs.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Build the wheel and sdist once
        run: uv build --python 3.13 --out-dir dist
      - name: Check they hold exactly the version commit's files
        id: check
        env:
          VERSION: ${{ needs.Versioning.outputs.version }}
          SHA: ${{ needs.Versioning.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          python3 .github/release_artifacts.py check-dist --dist dist \
            --version "$VERSION" --sha "$SHA" \
            --manifest-out release/manifest.json --sums-out release/SHA256SUMS
          cat release/SHA256SUMS
          echo "wheel-sha256=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist-sha256=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload the release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Attest the release files' provenance
        if: needs.Versioning.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

  Lint:
    # Check names here start with "Release" so a branch rule that requires
    # the pull request workflow's "Test / Result" or "Lint" cannot be met by
    # this workflow's checks of the same name.
    name: Release lint
    needs: Versioning
    if: needs.Versioning.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the version commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.Versioning.outputs.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Check formatting
        run: uvx ruff format --check .

  Compat:
    # What a user gets: the wheel, with the newest dependencies it allows,
    # on each supported Python.
    needs: Build
    name: Release install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Install the wheel
        env:
          WHEEL_SHA256: ${{ needs.Build.outputs.wheel-sha256 }}
        run: |
          set -euo pipefail
          echo "$WHEEL_SHA256  $(ls dist/*.whl)" | sha256sum --check
          uv pip install --system dist/*.whl
      - name: Smoke-import
        run: |
          cd "$RUNNER_TEMP"
          python -c "import importlib.metadata as m, policyengine_uk; print('import OK', m.version('policyengine-uk'), policyengine_uk.__file__)"

  Test:
    name: Release test
    needs: [Versioning, Build]
    uses: ./.github/workflows/test-suite.yaml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ needs.Versioning.outputs.sha }}
      dist-artifact: release-dist
      wheel-sha256: ${{ needs.Build.outputs.wheel-sha256 }}
    secrets:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}

  Publish:
    # Runs only when every check above passed, and never for a pull request.
    name: Publish
    needs: [Versioning, Build, Lint, Compat, Test]
    if: needs.Versioning.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout the version commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.Versioning.outputs.sha }}
      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Check these are the files that were built and tested
        env:
          VERSION: ${{ needs.Versioning.outputs.version }}
          SHA: ${{ needs.Versioning.outputs.sha }}
          WHEEL_SHA256: ${{ needs.Build.outputs.wheel-sha256 }}
          SDIST_SHA256: ${{ needs.Build.outputs.sdist-sha256 }}
        run: |
          set -euo pipefail
          echo "$WHEEL_SHA256  dist/policyengine_uk-$VERSION-py3-none-any.whl" | sha256sum --check
          echo "$SDIST_SHA256  dist/policyengine_uk-$VERSION.tar.gz" | sha256sum --check
          python3 .github/release_artifacts.py check-dist --dist dist \
            --version "$VERSION" --sha "$SHA"
      - name: Check what PyPI already has for this version
        id: pypi
        env:
          VERSION: ${{ needs.Versioning.outputs.version }}
        run: |
          set -euo pipefail
          # absent or partial: upload. complete: a re-run after a successful
          # upload; nothing to do. conflict (exit 3): PyPI has other bytes
          # under this version, so stop.
          state=$(python3 .github/release_artifacts.py pypi-state --dist dist --version "$VERSION" | tee /dev/stderr | head -n 1)
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI
        if: steps.pypi.outputs.state != 'complete'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI }}
          packages-dir: dist/
          # Safe only because the step above found no different file under
          # this version: it skips a file a failed earlier attempt uploaded.
          skip-existing: true
      - name: Check PyPI serves exactly these files
        env:
          VERSION: ${{ needs.Versioning.outputs.version }}
        run: |
          python3 .github/release_artifacts.py pypi-state --dist dist \
            --version "$VERSION" --require complete --wait 600
      - name: Tag the version commit
        env:
          VERSION: ${{ needs.Versioning.outputs.version }}
          SHA: ${{ needs.Versioning.outputs.sha }}
          WHEEL_SHA256: ${{ needs.Build.outputs.wheel-sha256 }}
          SDIST_SHA256: ${{ needs.Build.outputs.sdist-sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "policyengine-uk $VERSION"
            echo
            echo "Built, tested and published by $RUN_URL"
            echo
            echo "$WHEEL_SHA256  policyengine_uk-$VERSION-py3-none-any.whl"
            echo "$SDIST_SHA256  policyengine_uk-$VERSION.tar.gz"
          } > "$RUNNER_TEMP/tag-message.txt"
          .github/publish-git-tag.sh "$VERSION" "$SHA" "$RUNNER_TEMP/tag-message.txt"
