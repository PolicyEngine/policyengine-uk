# The test suite, as one reusable workflow: pull requests and main pushes
# (pr_code_changes.yaml and code_changes.yaml) run it on the source tree, and
# the release workflow (versioning.yaml) runs it on the wheel it is about to
# publish. All three run the same jobs in the same locked environment.
#
# Jobs: the YAML policy tests (which also list every Python test), the Python
# tests split over six runners, and Result, which fails unless every listed
# Python test ran in exactly one shard and passed, apart from the outcomes
# accepted in .github/test_outcome_allowlist.toml. A caller that names its job
# Test gets the checks "Test / YAML", "Test / Python K/6" and "Test / Result";
# "Test / Result" is the one to require.
#
# Runners. These jobs, and the check jobs that pull requests, merge queue
# groups, main pushes and releases wait on, run on today's GitHub-hosted
# labels unless a repository variable names another runner (Settings >
# Secrets and variables > Actions > Variables):
#   CI_RUNNER_ARM     instead of ubuntu-24.04-arm: these jobs, Changes, Tested
#   CI_RUNNER_X64     instead of ubuntu-latest: Lint, the install checks, Docs
#   CI_RUNNER_EVENTS  optional: event names separated by commas, no spaces,
#                     such as merge_group,push. Only those events use the
#                     variables. Empty means every event.
# Delete a variable to go back to today's label for the next run. The jobs
# that make the version commit, build and publish a release, the
# fix-evidence check (pull_request_target) and aggregate impact always keep
# GitHub-hosted runners. Each job that can move has a read-only
# GITHUB_TOKEN, since the organisation's default token can write. These jobs
# read the licensed dataset, so point the variables only at runners where
# that data may be processed, such as the organisation's GitHub-hosted
# larger runners. test_ci_runner_variables.py holds the workflows to this.

name: Test suite

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test. Empty for the commit the caller runs on.
        type: string
        default: ""
      dist-artifact:
        description: >
          Name of an artifact in the caller's run holding the wheel to test.
          Empty to test the checked-out source tree.
        type: string
        default: ""
      wheel-sha256:
        description: The sha256 the wheel in dist-artifact must have.
        type: string
        default: ""
      require-data:
        description: >
          Fail Result if the run had no dataset credentials, instead of
          accepting the microsimulation tests as skipped. For main, merge
          queue groups and releases; pull requests from forks and Dependabot
          have no credentials.
        type: boolean
        default: false
      skip:
        description: >
          Run nothing and pass Result. For pull requests that change no
          code (pr_code_changes.yaml), so the required check still reports.
        type: boolean
        default: false
    secrets:
      HUGGING_FACE_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  YAML:
    name: YAML
    if: ${{ !inputs.skip }}
    # Linux arm64 keeps the CPU architecture of the macOS runners the tests
    # used to run on. GitHub-hosted macOS runners are scarce, so PR runs
    # queued for hours; the parameter tree and every test result are
    # identical on both.
    runs-on: ${{ vars.CI_RUNNER_ARM != '' && (vars.CI_RUNNER_EVENTS == '' || contains(format(',{0},', vars.CI_RUNNER_EVENTS), format(',{0},', github.event_name))) && vars.CI_RUNNER_ARM || 'ubuntu-24.04-arm' }}
    # About 4 minutes on 10 October (run 38085920460).
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: "google-github-actions/auth@v3"
        with:
          workload_identity_provider: "projects/322898545428/locations/global/workloadIdentityPools/policyengine-research-id-pool/providers/prod-github-provider"
          service_account: "policyengine-research@policyengine-research.iam.gserviceaccount.com"
      - name: Install the test environment
        id: env
        uses: ./.github/actions/test-environment
        with:
          dist-artifact: ${{ inputs.dist-artifact }}
          wheel-sha256: ${{ inputs.wheel-sha256 }}
      - name: Run the YAML tests
        env:
          TESTS: ${{ steps.env.outputs.tests }}
        run: policyengine-core test "$TESTS/policy" -c policyengine_uk
      - name: List the Python tests
        id: collect
        # Keep Result's coverage audit available after a policy YAML failure.
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        # Every Python test, collected without --shard, in the environment
        # the shards use. Result checks that the shards ran each of these
        # exactly once.
        env:
          HF_TOKEN_VALUE: ${{ secrets.HUGGING_FACE_TOKEN }}
          TESTS: ${{ steps.env.outputs.tests }}
          ROOTDIR: ${{ steps.env.outputs.rootdir }}
          POLICYENGINE_UK_REQUIRE_TEST_DATA: ${{ inputs.require-data && '1' || '' }}
        run: |
          # Only export token if non-empty (avoids 'Bearer ' error for Dependabot PRs)
          if [ -n "$HF_TOKEN_VALUE" ]; then
            export HUGGING_FACE_TOKEN="$HF_TOKEN_VALUE"
          fi
          pytest "$TESTS" --rootdir "$ROOTDIR" -c pyproject.toml \
            --collect-only -q -p no:cacheprovider > collected.txt
          tail -n 1 collected.txt
      - name: Upload the list of Python tests
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-collected
          path: collected.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  Python:
    # Shard K of N runs the tests whose node id hashes to K (--shard in
    # policyengine_uk/tests/conftest.py), so each test is in exactly one
    # shard. N is the number of jobs this matrix makes: to add a shard, add
    # a number to the list.
    #
    # The slowest tests, listed with their CI durations in
    # policyengine_uk/tests/shard_durations.toml, are dealt out by duration
    # instead of hashed. With the hash alone, over 95 runs on 24 October
    # shard 2/5 averaged 57 minutes (up to 70) and shard 1/5 49: a 22-minute
    # property test and several of 4 to 7 minutes had hashed to shard 2.
    # .github/test_durations.py regenerates the table from shard logs.
    #
    # Four shards, not three, for memory: each pytest-xdist worker's memory
    # grows with the tests it runs, and with three shards of four workers
    # the 16 GB runners peaked at 15.6 GB, 283 MB short of running out
    # (run 38156967136; two shards of an earlier run lost their runners).
    # With four, each worker runs about a quarter fewer tests.
    #
    # Five, not four, for time: on 20 and 21 October shard 1/4 took 50 to
    # 52 minutes on unrelated pull requests, close to the timeout. A pull
    # request adding about a fifth more parameters (#1855) hit the timeout
    # on shard 1/4 twice, and its other shards took 48 to 59 minutes (run
    # 39568525017).
    #
    # Six, not five, for both. On 26 October a pull request's shards took
    # 63 to 75 minutes, and the 75-minute limit cancelled shard 4/5 (run
    # 40308966462, first attempt); a merge queue run that evening took 66
    # to 69 (run 40406434741). The same evening one pull request lost
    # shards 2/5, 3/5 and 5/5 to memory at 15.6 to 15.9 GB (run
    # 40393666784), and the merge queue run for #2105 lost shard 2/5 at
    # 15.5 GB (run 40395541241). With six, the listed slow tests come to
    # about 134 minutes of worker time per shard instead of 161, and each
    # worker runs about a sixth fewer tests.
    name: Python ${{ matrix.shard }}/${{ strategy.job-total }}
    if: ${{ !inputs.skip }}
    runs-on: ${{ vars.CI_RUNNER_ARM != '' && (vars.CI_RUNNER_EVENTS == '' || contains(format(',{0},', vars.CI_RUNNER_EVENTS), format(',{0},', github.event_name))) && vars.CI_RUNNER_ARM || 'ubuntu-24.04-arm' }}
    # The shards took 15, 20 and 15 minutes on 10 October (run
    # 38085920460), and up to 52 minutes with four shards on 21 October.
    # With five shards they took 45 to 59 minutes on 23 October (runs
    # 40027855419, 40027962439, 40029283977, 40032765600, 40034704845).
    # In merge-queue run 40034703741, shard 4/5's tests all passed in
    # 59m32s and the 60-minute limit then cancelled the job during its
    # Codecov upload, which took that pull request out of the queue.
    # 75 minutes leaves room for a slow runner and still stops a hung shard.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: "google-github-actions/auth@v3"
        with:
          workload_identity_provider: "projects/322898545428/locations/global/workloadIdentityPools/policyengine-research-id-pool/providers/prod-github-provider"
          service_account: "policyengine-research@policyengine-research.iam.gserviceaccount.com"
      - name: Install the test environment
        id: env
        uses: ./.github/actions/test-environment
        with:
          dist-artifact: ${{ inputs.dist-artifact }}
          wheel-sha256: ${{ inputs.wheel-sha256 }}
      - name: Run the tests
        env:
          HF_TOKEN_VALUE: ${{ secrets.HUGGING_FACE_TOKEN }}
          TESTS: ${{ steps.env.outputs.tests }}
          ROOTDIR: ${{ steps.env.outputs.rootdir }}
          MODE: ${{ steps.env.outputs.mode }}
          # The tests' own mandatory-data mode (conftest.py): a test that
          # needs the dataset fails, rather than skips, when it is missing.
          POLICYENGINE_UK_REQUIRE_TEST_DATA: ${{ inputs.require-data && '1' || '' }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          OUTCOMES: outcomes-${{ matrix.shard }}.jsonl
          # Measure coverage with sys.monitoring instead of the C trace
          # function: the same lines are reported, at less cost per line.
          COVERAGE_CORE: sysmon
        run: |
          if [ -n "$HF_TOKEN_VALUE" ]; then
            export HUGGING_FACE_TOKEN="$HF_TOKEN_VALUE"
          fi
          # Log memory each minute, so a runner lost to memory pressure
          # ("The runner has received a shutdown signal") shows it.
          (while sleep 60; do
            free -m | awk 'NR == 2 { print "memory: " $3 " MB used, " $7 " MB available" }'
          done) &
          trap 'kill $! 2>/dev/null' EXIT
          coverage=()
          if [ "$MODE" = source ]; then
            coverage=(--cov=policyengine_uk --cov-report=xml)
          fi
          # .github/pytest_outcome_log.py records each test's outcome for
          # Result. xfail_strict makes an xfail marker without strict= fail
          # when its test passes, so a fixed bug cannot hide behind it.
          # Four pytest-xdist workers, one per core. Their memory grows with
          # each test they run (#2330): with three shards they peaked at
          # 15.6 GB of the runner's 16 GB (run 38156967136).
          PYTHONPATH="$GITHUB_WORKSPACE/.github" pytest "$TESTS" \
            --rootdir "$ROOTDIR" -c pyproject.toml -p no:cacheprovider \
            -p pytest_outcome_log --outcome-log="$OUTCOMES" \
            -o xfail_strict=true --maxfail=0 -v \
            -n 4 --dist worksteal --shard "$SHARD" "${coverage[@]}"
      - name: Upload the test outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-outcomes-${{ matrix.shard }}
          path: outcomes-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload coverage to Codecov
        if: ${{ steps.env.outputs.mode == 'source' }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  Result:
    # One result for the whole suite. It fails if a test job failed, or if
    # the shards did not run every listed Python test exactly once with an
    # accepted outcome.
    name: Result
    needs: [YAML, Python]
    if: ${{ !cancelled() }}
    # The shards' runners, not ubuntu-latest: on 10 October this 5-second
    # job waited 32 minutes for an ubuntu-latest runner after the shards
    # had finished (run 38085920460).
    runs-on: ${{ vars.CI_RUNNER_ARM != '' && (vars.CI_RUNNER_EVENTS == '' || contains(format(',{0},', vars.CI_RUNNER_EVENTS), format(',{0},', github.event_name))) && vars.CI_RUNNER_ARM || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    steps:
      - name: Nothing to test
        if: ${{ inputs.skip }}
        run: echo "This pull request changes no code, so no tests ran."
      - name: Check that every test job passed
        if: ${{ !inputs.skip }}
        run: |
          echo "YAML: ${{ needs.YAML.result }}; Python: ${{ needs.Python.result }}"
          test "${{ needs.YAML.result }}" = success
          test "${{ needs.Python.result }}" = success
      - name: Checkout repo
        if: ${{ !inputs.skip && !cancelled() }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github
      - name: Download the test lists and outcomes
        if: ${{ !inputs.skip && !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: test-*
          merge-multiple: true
      - name: Check that every Python test ran in exactly one shard and passed
        # Runs even when a test job failed, so its report names the failed
        # tests.
        if: ${{ !inputs.skip && !cancelled() }}
        env:
          MODE: ${{ inputs.dist-artifact == '' && 'source' || 'wheel' }}
          DATA: ${{ secrets.HUGGING_FACE_TOKEN != '' && 'present' || 'absent' }}
          REQUIRE_DATA: ${{ inputs.require-data }}
        run: |
          if [ "$REQUIRE_DATA" = true ] && [ "$DATA" != present ]; then
            echo "::error::This run must have the dataset credentials (HUGGING_FACE_TOKEN), so its microsimulation tests run; it has none."
            exit 1
          fi
          python3 .github/check_test_shards.py --collected collected.txt \
            --outcomes outcomes-*.jsonl \
            --allowlist .github/test_outcome_allowlist.toml \
            --mode "$MODE" --data "$DATA"
