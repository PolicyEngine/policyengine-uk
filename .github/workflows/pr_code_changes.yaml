# Workflow that runs on code changes to a pull request.

name: Code changes
on:
  pull_request:
    branches:
      - main

    paths:
      - policyengine_uk/**
      - tests/**
      - .github/**
      - pyproject.toml
      - uv.lock
      - hatch_build.py
      - Makefile
  workflow_dispatch:

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run instead of letting it hold runners. Manual dispatches are
# grouped by ref and never cancelled.
concurrency:
  group: pr-code-changes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Python-Compat:
    name: Install + smoke-import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install package
        run: uv pip install --system .
      - name: Smoke-import
        run: python -c "import policyengine_uk; print('import OK')"
      - name: Check the installed package reports this commit
        # Outside the checkout, so Python imports the installed wheel, which
        # hatch_build.py built from this clean checkout.
        working-directory: ${{ runner.temp }}
        run: |
          python - "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" <<'EOF'
          import sys
          from policyengine_uk import build_metadata

          head = sys.argv[1]
          git_sha = build_metadata.get_runtime_metadata()["git_sha"]
          print(f"{build_metadata.PACKAGE_ROOT}: git_sha={git_sha}")
          assert "site-packages" in build_metadata.PACKAGE_ROOT.parts
          assert git_sha == head, f"expected {head}"
          EOF
  Release-Build:
    name: Release build records the commit
    runs-on: ubuntu-latest
    steps:
      # The Publish job in versioning.yaml, without the tag and the upload.
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
            python-version: '3.13'
      - name: Install package
        run: uv pip install -e .[dev] --system
      - name: Install policyengine
        run: uv pip install policyengine --system
      - name: Install Wheel and Pytest
        run: pip3 install wheel setuptools pytest==5.4.3
      - name: Build package
        run: make
      - name: Build a wheel from the sdist
        # make builds the release wheel from the checkout. Check the sdist
        # still builds the same package, as building the wheel from it once did.
        run: uv build --wheel --out-dir "$RUNNER_TEMP/from-sdist" dist/*.tar.gz
      - name: Check the wheel records this commit
        run: >-
          python .github/check_release_build.py dist "$(git rev-parse HEAD)"
          "$RUNNER_TEMP/from-sdist"
  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
        - uses: actions/checkout@v6
        - name: Install uv
          uses: astral-sh/setup-uv@v8.1.0
        - name: Check formatting
          run: uvx ruff format --check .
  Test:
      # Linux arm64 keeps the CPU architecture of the macOS runners this job
      # used to run on. GitHub-hosted macOS runners are scarce, so PR runs
      # queued for hours; the parameter tree and every test result are
      # identical on both.
      runs-on: ubuntu-24.04-arm
      # The whole job takes about 18 minutes (YAML tests 2, pytest 15, the
      # rest under 1). More than three times that means a run is hung or
      # the suite needs attention, so fail it rather than wait for the
      # 6-hour GitHub limit.
      timeout-minutes: 60
      permissions:
        contents: "read"
        id-token: "write"
      steps:
          - name: Checkout repo
            uses: actions/checkout@v6
          - name: Install uv
            uses: astral-sh/setup-uv@v8.1.0

          - name: Set up Python
            uses: actions/setup-python@v6
            with:
                python-version: '3.13'
          - uses: "google-github-actions/auth@v3"
            with:
              workload_identity_provider: "projects/322898545428/locations/global/workloadIdentityPools/policyengine-research-id-pool/providers/prod-github-provider"
              service_account: "policyengine-research@policyengine-research.iam.gserviceaccount.com"

          - name: Install package
            run: uv pip install -e .[dev] --system
          - name: Install policyengine
            run: uv pip install policyengine --system
          - name: UV sync
            run: uv sync --extra dev
          - name: Run tests with coverage
            run: |
              # Only export token if non-empty (avoids 'Bearer ' error for Dependabot PRs)
              if [ -n "$HF_TOKEN_VALUE" ]; then
                export HUGGING_FACE_TOKEN="$HF_TOKEN_VALUE"
              fi
              # Four pytest-xdist workers, one per core; together they peak at
              # about 9 GB of the runner's 16 GB.
              make test PYTEST_ARGS="-n 4 --dist worksteal"
            env:
              HF_TOKEN_VALUE: ${{ secrets.HUGGING_FACE_TOKEN }}
          - name: Upload coverage to Codecov
            uses: codecov/codecov-action@v6
            with:
              files: ./coverage.xml
              fail_ci_if_error: false
              verbose: true
          - name: Test documentation builds
            run: make documentation
