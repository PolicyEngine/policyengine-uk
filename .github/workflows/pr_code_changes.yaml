# Workflow that runs on code changes to a pull request.

name: Code changes
on:
  pull_request:
    branches:
      - main

    paths:
      - policyengine_uk/**
      - tests/**
      - .github/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run instead of letting it hold runners. Manual dispatches are
# grouped by ref and never cancelled.
concurrency:
  group: pr-code-changes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Installs the package with the newest dependency releases on PyPI,
  # ignoring uv.lock, on every supported Python, so an upstream release that
  # breaks installation or import shows up here first. Lint and Test below
  # install from uv.lock.
  Python-Compat:
    name: Install + smoke-import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install package
        run: uv pip install --system .
      - name: Smoke-import
        run: python -c "import policyengine_uk; print('import OK')"
  Lint:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - name: Install uv
          uses: astral-sh/setup-uv@v8.1.0
        - name: Install locked dependencies
          run: uv sync --locked --extra dev
        - name: Check formatting
          run: uv run --no-sync ruff format --check .
  Test:
      # Linux arm64 keeps the CPU architecture of the macOS runners this job
      # used to run on. GitHub-hosted macOS runners are scarce, so PR runs
      # queued for hours; the parameter tree and every test result are
      # identical on both.
      runs-on: ubuntu-24.04-arm
      # The whole job takes about 18 minutes (YAML tests 2, pytest 15, the
      # rest under 1). More than three times that means a run is hung or
      # the suite needs attention, so fail it rather than wait for the
      # 6-hour GitHub limit.
      timeout-minutes: 60
      permissions:
        contents: "read"
        id-token: "write"
      steps:
          - name: Checkout repo
            uses: actions/checkout@v6
          - name: Install uv
            uses: astral-sh/setup-uv@v8.1.0

          - name: Set up Python
            uses: actions/setup-python@v6
            with:
                python-version: '3.13'
          - uses: "google-github-actions/auth@v3"
            with:
              workload_identity_provider: "projects/322898545428/locations/global/workloadIdentityPools/policyengine-research-id-pool/providers/prod-github-provider"
              service_account: "policyengine-research@policyengine-research.iam.gserviceaccount.com"

          # Install exactly what uv.lock pins into .venv and run everything from
          # it, so a new release of policyengine-core or any other dependency
          # cannot change what this job tests until the lock is updated.
          # --locked fails if pyproject.toml changed without `uv lock`.
          - name: Install locked dependencies
            run: uv sync --locked --extra dev
          - name: Run tests with coverage
            run: |
              # Only export token if non-empty (avoids 'Bearer ' error for Dependabot PRs)
              if [ -n "$HF_TOKEN_VALUE" ]; then
                export HUGGING_FACE_TOKEN="$HF_TOKEN_VALUE"
              fi
              # Four pytest-xdist workers, one per core; together they peak at
              # about 9 GB of the runner's 16 GB.
              uv run --no-sync make test PYTEST_ARGS="-n 4 --dist worksteal"
            env:
              HF_TOKEN_VALUE: ${{ secrets.HUGGING_FACE_TOKEN }}
          - name: Upload coverage to Codecov
            uses: codecov/codecov-action@v6
            with:
              files: ./coverage.xml
              fail_ci_if_error: false
              verbose: true
          - name: Test documentation builds
            run: uv run --no-sync make documentation
