# Workflow that runs on code changes to a pull request.

name: Code changes
on:
  pull_request:
    branches:
      - main

    paths:
      - policyengine_uk/**
      - tests/**
      - .github/**
      - pyproject.toml
      - uv.lock
      - Makefile
  workflow_dispatch:

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run instead of letting it hold runners. Manual dispatches are
# grouped by ref and never cancelled.
concurrency:
  group: pr-code-changes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Python-Compat:
    name: Install + smoke-import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install package
        run: uv pip install --system .
      - name: Smoke-import
        run: python -c "import policyengine_uk; print('import OK')"
  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
        - uses: actions/checkout@v6
        - name: Install uv
          uses: astral-sh/setup-uv@v8.1.0
        - name: Check formatting
          run: uvx ruff format --check .
  Docs:
    name: Test documentation builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package
        run: uv pip install -e .[dev] --system
      - name: Install policyengine
        run: uv pip install policyengine --system
      - name: Test documentation builds
        run: make documentation
  # The YAML tests, the Python tests on three runners, and the check that
  # every test ran once and passed, in the locked environment. As one job
  # they took 59 minutes on 10 October 2026 (run 38075384588), and runs were
  # cancelled at a 60-minute limit (issues #2099 and #2257). The release
  # workflow runs the same suite on the wheel it publishes. Require
  # "Test / Result".
  Test:
    uses: ./.github/workflows/test-suite.yaml
    permissions:
      contents: read
      id-token: write
    secrets:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
