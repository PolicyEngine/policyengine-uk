# Workflow that runs on code changes to the main branch.

name: Code changes
on:
  push:
    branches:
      - main

    paths:
      - policyengine_uk/**
      - tests/**
      - .github/**
  workflow_dispatch:

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - name: Install uv
          uses: astral-sh/setup-uv@v8.1.0
        - name: Check formatting
          run: uvx ruff format --check .
  Test:
      # Linux arm64 keeps the CPU architecture of the macOS runners this job
      # used to run on. GitHub-hosted macOS runners are scarce, so PR runs
      # queued for hours; the parameter tree and every test result are
      # identical on both.
      runs-on: ubuntu-24.04-arm
      permissions:
        contents: "read"
        id-token: "write"
      steps:
          - name: Checkout repo
            uses: actions/checkout@v6
          - name: Install uv
            uses: astral-sh/setup-uv@v8.1.0

          - name: Set up Python
            uses: actions/setup-python@v6
            with:
                python-version: '3.13'
          - uses: "google-github-actions/auth@v3"
            with:
              workload_identity_provider: "projects/322898545428/locations/global/workloadIdentityPools/policyengine-research-id-pool/providers/prod-github-provider"
              service_account: "policyengine-research@policyengine-research.iam.gserviceaccount.com"
              
          - name: Install package
            run: uv pip install -e .[dev] --system
          - name: Install policyengine
            run: uv pip install policyengine --system
          - name: Install JB
            run: uv pip install "jupyter-book>=2.0.0a0" --system
          - name: UV sync
            run: uv sync --extra dev
          - name: Run tests with coverage
            run: |
              # Only export token if non-empty (defensive against missing secrets)
              if [ -n "$HF_TOKEN_VALUE" ]; then
                export HUGGING_FACE_TOKEN="$HF_TOKEN_VALUE"
              fi
              # Four pytest-xdist workers, one per core; together they peak at
              # about 9 GB of the runner's 16 GB.
              make test PYTEST_ARGS="-n 4 --dist worksteal"
            env:
              HF_TOKEN_VALUE: ${{ secrets.HUGGING_FACE_TOKEN }}
          - name: Upload coverage to Codecov
            uses: codecov/codecov-action@v6
            with:
              files: ./coverage.xml
              fail_ci_if_error: false
              verbose: true
