# Workflow that runs on code changes to the main branch.

name: Code changes
on:
  push:
    branches:
      - main

    paths:
      - policyengine_uk/**
      - tests/**
      - .github/**
  workflow_dispatch:

# This workflow only lints and tests (versioning, publishing and the docs
# deploy are separate workflows), so when a newer commit lands on main the
# older run's result is superseded. Cancel it instead of letting a 50-minute
# Test job hold a shared runner. From 2026-10-06 to 10-08, 8 of 17 push runs
# were superseded mid-run and finishing them used 357 runner-minutes.
concurrency:
  group: code-changes-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
        - uses: actions/checkout@v6
        - name: Install uv
          uses: astral-sh/setup-uv@v8.1.0
        - name: Check formatting
          run: uvx ruff format --check .
  # The tests run as four jobs: the YAML policy tests, and the Python tests
  # split over three runners. As one job they took 59 minutes on 10 October
  # 2026 (run 38075384588: 2.6 minutes of YAML tests, then 55.8 minutes of
  # pytest on four workers), and runs were cancelled at a 60-minute limit
  # (issues #2099 and #2257).
  Test-YAML:
      name: Test (YAML)
      # Linux arm64 keeps the CPU architecture of the macOS runners this job
      # used to run on. GitHub-hosted macOS runners are scarce, so PR runs
      # queued for hours; the parameter tree and every test result are
      # identical on both.
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 30
      permissions:
        contents: "read"
        id-token: "write"
      steps:
          - name: Checkout repo
            uses: actions/checkout@v6
          - name: Install uv
            uses: astral-sh/setup-uv@v8.1.0

          - name: Set up Python
            uses: actions/setup-python@v6
            with:
                python-version: '3.13'
          - uses: "google-github-actions/auth@v3"
            with:
              workload_identity_provider: "projects/322898545428/locations/global/workloadIdentityPools/policyengine-research-id-pool/providers/prod-github-provider"
              service_account: "policyengine-research@policyengine-research.iam.gserviceaccount.com"

          - name: Install package
            run: uv pip install -e .[dev] --system
          - name: Install policyengine
            run: uv pip install policyengine --system
          - name: Install JB
            run: uv pip install "jupyter-book>=2.0.0a0" --system
          - name: UV sync
            run: uv sync --extra dev
          - name: Run YAML tests
            run: make test-yaml
          - name: List the Python tests
            # Every Python test, collected without --shard. The Test job
            # checks that the shards below ran each of these exactly once.
            run: |
              # Only export token if non-empty (defensive against missing secrets)
              if [ -n "$HF_TOKEN_VALUE" ]; then
                export HUGGING_FACE_TOKEN="$HF_TOKEN_VALUE"
              fi
              pytest policyengine_uk/tests --collect-only -q -p no:cacheprovider > collected.txt
              tail -n 1 collected.txt
            env:
              HF_TOKEN_VALUE: ${{ secrets.HUGGING_FACE_TOKEN }}
          - name: Upload the list of Python tests
            uses: actions/upload-artifact@v7
            with:
              name: test-collected
              path: collected.txt
              if-no-files-found: error
              overwrite: true
              retention-days: 7
  Test-Python:
      # Shard K of N runs the tests whose node id hashes to K (--shard in
      # policyengine_uk/tests/conftest.py), so each test is in exactly one
      # shard. N is the number of jobs this matrix makes: to add a shard, add
      # a number to the list.
      name: Test (Python ${{ matrix.shard }}/${{ strategy.job-total }})
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 60
      strategy:
        fail-fast: false
        matrix:
          shard: [1, 2, 3]
      permissions:
        contents: "read"
        id-token: "write"
      steps:
          - name: Checkout repo
            uses: actions/checkout@v6
          - name: Install uv
            uses: astral-sh/setup-uv@v8.1.0

          - name: Set up Python
            uses: actions/setup-python@v6
            with:
                python-version: '3.13'
          - uses: "google-github-actions/auth@v3"
            with:
              workload_identity_provider: "projects/322898545428/locations/global/workloadIdentityPools/policyengine-research-id-pool/providers/prod-github-provider"
              service_account: "policyengine-research@policyengine-research.iam.gserviceaccount.com"

          - name: Install package
            run: uv pip install -e .[dev] --system
          - name: Install policyengine
            run: uv pip install policyengine --system
          - name: Install JB
            run: uv pip install "jupyter-book>=2.0.0a0" --system
          - name: UV sync
            run: uv sync --extra dev
          - name: Run tests with coverage
            run: |
              # Only export token if non-empty (defensive against missing secrets)
              if [ -n "$HF_TOKEN_VALUE" ]; then
                export HUGGING_FACE_TOKEN="$HF_TOKEN_VALUE"
              fi
              # Four pytest-xdist workers, one per core; together they peak at
              # about 9 GB of the runner's 16 GB.
              make test-python PYTEST_ARGS="-n 4 --dist worksteal --shard ${{ matrix.shard }}/${{ strategy.job-total }} --junitxml=junit-${{ matrix.shard }}.xml"
            env:
              HF_TOKEN_VALUE: ${{ secrets.HUGGING_FACE_TOKEN }}
              # Measure coverage with sys.monitoring instead of the C trace
              # function: the same lines are reported, at less cost per line.
              COVERAGE_CORE: sysmon
          - name: Upload the test results
            if: ${{ !cancelled() }}
            uses: actions/upload-artifact@v7
            with:
              name: test-junit-${{ matrix.shard }}
              path: junit-${{ matrix.shard }}.xml
              if-no-files-found: error
              overwrite: true
              retention-days: 7
          - name: Upload coverage to Codecov
            uses: codecov/codecov-action@v6
            with:
              files: ./coverage.xml
              fail_ci_if_error: false
              verbose: true
  Test:
      # One result for the whole suite. It fails if any test job failed, or
      # if the shards did not run every collected Python test exactly once.
      needs: [Test-YAML, Test-Python]
      if: ${{ !cancelled() }}
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
          - name: Checkout repo
            uses: actions/checkout@v6
          - name: Download the test lists and results
            uses: actions/download-artifact@v8
            with:
              pattern: test-*
              merge-multiple: true
          - name: Check that every Python test ran in exactly one shard
            run: python3 .github/check_test_shards.py --collected collected.txt --junit junit-*.xml
          - name: Check that every test job passed
            run: |
              echo "YAML: ${{ needs.Test-YAML.result }}; Python: ${{ needs.Test-Python.result }}"
              test "${{ needs.Test-YAML.result }}" = success
              test "${{ needs.Test-Python.result }}" = success
