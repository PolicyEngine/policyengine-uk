# Workflow that runs on code changes to the main branch.

name: Code changes
on:
  push:
    branches:
      - main

    # The same paths as the pull request workflow: a dependency, lockfile
    # or Makefile change alters what the tests run against.
    paths:
      - policyengine_uk/**
      - tests/**
      - .github/**
      - pyproject.toml
      - uv.lock
      - Makefile
  workflow_dispatch:

# This workflow only lints and tests (versioning, publishing and the docs
# deploy are separate workflows), so when a newer commit lands on main the
# older run's result is superseded. Cancel it instead of letting a 50-minute
# Test job hold a shared runner. From 2026-10-06 to 10-08, 8 of 17 push runs
# were superseded mid-run and finishing them used 357 runner-minutes.
concurrency:
  group: code-changes-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    # The release workflow tests each version commit itself, on the wheel it
    # publishes. Version commits only trigger this workflow when the GitHub
    # App pushes them (see versioning.yaml); skip them.
    if: github.event.head_commit.message != 'Update package version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
        - uses: actions/checkout@v6
        - name: Install uv
          uses: astral-sh/setup-uv@v8.1.0
        - name: Check formatting
          run: uvx ruff format --check .
  # The same suite as pull requests (test-suite.yaml), on the merged commit.
  Test:
    if: github.event.head_commit.message != 'Update package version'
    uses: ./.github/workflows/test-suite.yaml
    permissions:
      contents: read
      id-token: write
    secrets:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
