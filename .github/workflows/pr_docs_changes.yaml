# Workflow that runs on code changes to a pull request.

name: Docs changes
on:
  pull_request:
    branches:
      - main

    paths:
      - docs/**
      - .github/**
  workflow_dispatch:

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run instead of letting it hold runners. Manual dispatches are
# grouped by ref and never cancelled.
concurrency:
  group: pr-docs-changes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Test:
      runs-on: ubuntu-latest
      name: Test documentation builds
      timeout-minutes: 30
      steps:
          - name: Checkout repo
            uses: actions/checkout@v6
          # The environment the tests use: uv.lock with the dev extra (which
          # includes jupyter-book), so a new release cannot change the build.
          - name: Install the locked environment
            uses: ./.github/actions/test-environment
          - name: Test documentation builds
            run: make documentation