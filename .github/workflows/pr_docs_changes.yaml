# Workflow that runs on code changes to a pull request.

name: Docs changes
on:
  pull_request:
    branches:
      - main

    paths:
      - docs/**
      - .github/**
  workflow_dispatch:

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run instead of letting it hold runners. Manual dispatches are
# grouped by ref and never cancelled.
concurrency:
  group: pr-docs-changes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Test:
      runs-on: ubuntu-latest
      name: Test documentation builds
      steps:
          - name: Checkout repo
            uses: actions/checkout@v6
          - name: Install uv
            uses: astral-sh/setup-uv@v8.1.0

          - name: Set up Python
            uses: actions/setup-python@v6
            with:
                python-version: '3.13'
              
          - name: Install package
            run: uv pip install -e .[dev] --system
          - name: Install policyengine
            run: uv pip install policyengine --system
          - name: Install JB
            run: uv pip install "jupyter-book>=2.0.0a0" --system
          - name: Test documentation builds
            run: make documentation