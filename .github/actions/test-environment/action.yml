name: Test environment
description: >
  Install the locked test environment (uv.lock, with the dev extra) and the
  policyengine-uk to test: the checked-out source tree, or a built wheel.
  Puts the environment's bin directory first on PATH and says where the tests
  are.

inputs:
  dist-artifact:
    description: >
      Name of an artifact holding the built wheel. Empty to test the
      checked-out source tree instead.
    default: ""
  wheel-sha256:
    description: The sha256 the wheel in dist-artifact must have.
    default: ""

outputs:
  mode:
    description: "source or wheel"
    value: ${{ steps.install.outputs.mode }}
  tests:
    description: The policyengine_uk/tests directory to run.
    value: ${{ steps.install.outputs.tests }}
  rootdir:
    description: The pytest rootdir, so node ids start with policyengine_uk/tests.
    value: ${{ steps.install.outputs.rootdir }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Download the wheel
      if: ${{ inputs.dist-artifact != '' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.dist-artifact }}
        path: ${{ runner.temp }}/dist
    - name: Install the locked environment and policyengine-uk
      id: install
      shell: bash
      env:
        DIST_ARTIFACT: ${{ inputs.dist-artifact }}
        WHEEL_SHA256: ${{ inputs.wheel-sha256 }}
      run: |
        set -euo pipefail
        if [ -z "$DIST_ARTIFACT" ]; then
          # The source tree, installed editable into .venv with the locked
          # dependencies. --frozen installs uv.lock exactly as committed.
          uv sync --frozen --extra dev --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          {
            echo "mode=source"
            echo "tests=policyengine_uk/tests"
            echo "rootdir=$PWD"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # The wheel the release will publish, and nothing else.
        shopt -s nullglob
        wheels=("$RUNNER_TEMP"/dist/*.whl)
        if [ "${#wheels[@]}" -ne 1 ]; then
          echo "::error::expected one wheel in $DIST_ARTIFACT, found ${#wheels[@]}"
          exit 1
        fi
        wheel="${wheels[0]}"
        actual=$(sha256sum "$wheel" | cut -d' ' -f1)
        if [ -z "$WHEEL_SHA256" ] || [ "$actual" != "$WHEEL_SHA256" ]; then
          echo "::error::$(basename "$wheel") has sha256 $actual; expected '$WHEEL_SHA256'"
          exit 1
        fi
        echo "Testing $(basename "$wheel") (sha256 $actual)"

        # The locked dependencies, without the project, in an environment
        # outside the checkout. The wheel goes in on top, without resolving
        # anything else.
        venv="$RUNNER_TEMP/venv"
        UV_PROJECT_ENVIRONMENT="$venv" uv sync --frozen --extra dev --no-install-project --python 3.13
        uv pip install --python "$venv/bin/python" --no-deps "$wheel"

        # Remove the checkout's copy of the package, so nothing can import
        # the source tree instead of the wheel.
        rm -rf policyengine_uk

        # Confirm from an empty directory (Python puts the current directory
        # on sys.path) that the import is the installed wheel.
        mkdir -p "$RUNNER_TEMP/empty"
        package=$(cd "$RUNNER_TEMP/empty" && "$venv/bin/python" - "$venv" <<'EOF'
        import importlib.metadata
        import pathlib
        import sys

        import policyengine_uk

        package = pathlib.Path(policyengine_uk.__file__).resolve().parent
        venv = pathlib.Path(sys.argv[1]).resolve()
        if venv not in package.parents:
            sys.exit(f"policyengine_uk was imported from {package}, not {venv}")
        print(package)
        EOF
        )
        installed=$("$venv/bin/python" -c 'import importlib.metadata as m; print(m.version("policyengine-uk"))')
        echo "Installed policyengine-uk $installed at $package"
        echo "$venv/bin" >> "$GITHUB_PATH"
        {
          echo "mode=wheel"
          echo "tests=$package/tests"
          echo "rootdir=$(dirname "$package")"
        } >> "$GITHUB_OUTPUT"
