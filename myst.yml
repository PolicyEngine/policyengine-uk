version: 1
project:
  title: PolicyEngine UK documentation
  authors:
    - name: PolicyEngine
  copyright: "2024"
  github: https://github.com/policyengine/policyengine-uk
  repository:
    url: https://github.com/policyengine/policyengine-uk
    branch: master
    path: docs/book
  toc:
    - file: docs/book/index.md
    - title: Usage
      children:
      - file: docs/book/usage/getting-started.md
      - file: docs/book/usage/simulations.md
      - file: docs/book/usage/scenarios.md
      - file: docs/book/usage/dynamics.md
    # Pages listed by `file:` keep their place in a section. A `pattern:` entry
    # adds, at its own place, any other Markdown page in a section's folder, so a
    # new page needs no change here. The patterns match only Markdown, so each
    # notebook needs its own `file:` entry, and
    # policyengine_uk/tests/code_health/test_docs_toc.py fails when one has none.
    - title: Assumptions
      children:
      - file: docs/book/assumptions/growthfactors.md
      - file: docs/book/assumptions/water-bills.md
      - pattern: docs/book/assumptions/*.md
    - title: Validation
      children:
      - file: docs/book/validation/hbai.md
      - file: docs/book/validation/spi-validation.ipynb
      - file: docs/book/validation/student-loan-repayments.ipynb
      - file: docs/book/validation/validation.ipynb
      - pattern: docs/book/validation/*.md
    - title: Policy
      children:
      - file: docs/engineering/excise-duties.md
      - file: docs/engineering/gambling-duties.md
      - file: docs/engineering/bus-fares.md
      - file: docs/engineering/vat-coverage.md
      - pattern: docs/book/policy/*.md
    - title: Programmes
      children:
      - file: docs/book/programs/contrib/ubi-center/carbon-tax.ipynb
      - file: docs/book/programs/gov/dwp/pension-credit.ipynb
      - file: docs/book/programs/gov/hmrc/stamp-duty.ipynb
      - pattern: docs/book/programs/gov/*/*.md
      - file: docs/book/programs/gov/dcms/bbc/tv-licence.ipynb
      - file: docs/book/programs/gov/dfe/care-to-learn.ipynb
      - file: docs/book/programs/gov/dfe/extended-childcare-entitlement.ipynb
      - file: docs/book/programs/gov/dfe/targeted-childcare-entitlement.ipynb
      - file: docs/book/programs/gov/dfe/universal-childcare-entitlement.ipynb
      - file: docs/book/programs/gov/dwp/housing-benefit.ipynb
      - file: docs/book/programs/gov/dwp/PIP.ipynb
      - file: docs/book/programs/gov/dwp/universal-credit.ipynb
      - file: docs/book/programs/gov/hmrc/child-benefit.ipynb
      - file: docs/book/programs/gov/hmrc/fuel-duty.ipynb
      - file: docs/book/programs/gov/hmrc/income-tax.ipynb
      - file: docs/book/programs/gov/hmrc/national-insurance.ipynb
      - file: docs/book/programs/gov/hmrc/tax-free-childcare.ipynb
      - file: docs/book/programs/gov/ofgem/energy-price-guarantee.ipynb
      - file: docs/book/programs/gov/revenue_scotland/land-and-buildings-transaction-tax.ipynb
      - file: docs/book/programs/gov/wra/land-transaction-tax.ipynb
site:
  options:
    logo: docs/book/logo.png
  template: book-theme
  extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.viewcode
    - sphinx.ext.napoleon
    - sphinx_math_dollar
    - sphinx.ext.mathjax
  config:
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    html_theme: furo
    pygments_style: default
    html_css_files:
      - style.css
  execute:
    execute_notebooks: off
