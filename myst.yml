version: 1
project:
  title: PolicyEngine UK documentation
  authors:
    - name: PolicyEngine
  copyright: "2024"
  github: https://github.com/policyengine/policyengine-uk
  repository:
    url: https://github.com/policyengine/policyengine-uk
    branch: master
    path: docs/book
  toc:
    - file: docs/book/index.md
    - title: Usage
      children:
      - file: docs/book/usage/getting-started.md
      - file: docs/book/usage/simulations.md
      - file: docs/book/usage/scenarios.md
      - file: docs/book/usage/dynamics.md
    # Pages listed by `file:` keep their place at the top of a section. Any other
    # Markdown page in a section's folder is added after them by `pattern:`, so a
    # new page needs no change here. Notebooks are not pattern-matched.
    - title: Assumptions
      children:
      - file: docs/book/assumptions/growthfactors.md
      - file: docs/book/assumptions/water-bills.md
      - pattern: docs/book/assumptions/*.md
    - title: Validation
      children:
      - file: docs/book/validation/hbai.md
      - pattern: docs/book/validation/*.md
    - title: Policy
      children:
      - file: docs/engineering/excise-duties.md
      - file: docs/engineering/bus-fares.md
      - pattern: docs/book/policy/*.md
    - title: Programmes
      children:
      - pattern: docs/book/programs/gov/*/*.md
site:
  options:
    logo: docs/book/logo.png
  template: book-theme
  extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.viewcode
    - sphinx.ext.napoleon
    - sphinx_math_dollar
    - sphinx.ext.mathjax
  config:
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    html_theme: furo
    pygments_style: default
    html_css_files:
      - style.css
  execute:
    execute_notebooks: off
