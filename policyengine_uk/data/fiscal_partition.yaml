overlap_guards:
  - id: sdlt_payer_split
    kind: payer_split
    heads: [sdlt_household, sdlt_corporate]
    property: >-
      Neither head reads the other. gov.hmrc.stamp_duty.abolish zeroes both,
      so abolition lowers each total by exactly their sum. With a dataset,
      weighted sdlt_corporate equals the corporate SDLT revenue statistics.
      (Issue 2159: expected_sdlt used to add corporate_sdlt.)
  - id: property_transaction_tax_geography
    kind: geographic_exclusivity
    heads: [sdlt_household, land_transaction_tax, land_and_buildings_transaction_tax]
    property: At most one is non-zero for any household (England and Northern Ireland, Wales, Scotland).
  - id: local_tax_geography
    kind: geographic_exclusivity
    heads: [council_tax, domestic_rates]
    property: >-
      No household has both. Both are inputs, so this is a property of the
      data, checked on the certified dataset.
  - id: vat_level_and_change
    kind: level_and_change
    heads: [vat, vat_change]
    property: Never in the same total. vat_change reads vat.
  - id: employer_nics_level_and_incidence
    kind: level_and_change
    heads: [nics_employer, employer_nics_response_capital, employer_nics_response_consumer]
    property: The level is only in gov_tax; the response incidence is only in household_tax.
  - id: corporate_incidence_allocations
    kind: shared_allocation_key
    heads: [business_rates, sdlt_corporate, corporate_incident_tax_change, carbon_tax, land_value_tax]
    property: >-
      Each allocates a different receipt by shareholding; none reads another.
      corporate_tax_incidence sums two of them and is excluded.
  - id: private_school_vat_level_and_change
    kind: level_and_change
    heads: [private_school_vat, private_school_vat_change]
    property: >-
      Never in the same total: the level is in gov_tax and the change in
      household_tax, as for vat and vat_change. private_school_vat_change
      reads private_school_vat.
  - id: private_school_vat_and_vat
    kind: overlapping_base
    heads: [vat, private_school_vat]
    property: >-
      Grossed-up consumption VAT is fitted to receipts including school-fee
      VAT. vat keeps gross VAT less the fees' official share of receipts
      (gov.simulation.vat.private_school_share_of_receipts), then gov_tax
      adds private_school_vat. vat reads neither attendance nor fees, so
      school-specific exemption and contributed rate reforms move only the
      school head, and a standard-rate change moves each head on its own
      base. At current law combined receipts change by the weighted school
      charge less the share of weighted gross VAT. Both baseline measures
      hold this simulation's fee, attendance and share assumptions fixed.
      See test_private_school_vat_receipts.py and
      docs/engineering/vat-coverage.md.
  - id: council_tax_gross_and_reduction
    kind: gross_and_net
    heads: [council_tax]
    property: >-
      The tax totals hold gross council tax, and the spending totals hold
      Council Tax Reduction (council_tax_benefit). Never add
      council_tax_less_benefit, and compare with the OBR row net of the
      reduction. gov.contrib.abolish_council_tax drops council tax from the
      tax totals and council_tax_benefit from the spending totals together.
  - id: child_benefit_charge
    kind: gross_and_net
    heads: [income_tax]
    property: >-
      income_tax includes the High Income Child Benefit Charge, so benefits
      must be counted gross of it; child_benefit_less_tax_charge is excluded.
  - id: unallocated_budget_changes
    kind: level_and_change
    heads: [corporate_incident_tax_change, consumer_incident_tax_change]
    property: >-
      These allocate a lump-sum revenue change. A change in a tax that has
      its own head must be made through that head's parameters, not entered
      here as well.
  - id: eligibility_reads
    kind: read_not_inclusion
    heads: [tv_licence, private_school_vat, private_school_vat_change]
    property: >-
      These heads reach other heads of the same total only through
      eligibility or imputation (see each head's reads). Raising the other
      head by a small amount leaves them unchanged on the test population.
      For the private school heads that check is vacuous: attendance is
      imputed only on a dataset (on a situation it is zero or an input), so
      a tax change moves them only through re-imputed attendance on the
      microdata (policyengine-uk-data issue 568).

