# Fiscal partition: how the model's tax and spending totals divide into heads.
#
# Each tax head is one receipt (a row of the OBR's current receipts table,
# split by who pays or where it is charged when the model splits it) and
# names the one variable that measures the household's share of it. Heads
# are mutually exclusive: no head's value contains another head's value, and
# no variable is summed twice in a total.
#
# The heads were specified from the OBR receipts classification and from each
# variable's formula, not copied from the model's own lists
# (GOV_TAX_VARIABLES, HOUSEHOLD_TAX_VARIABLES,
# PRE_BUDGET_CHANGE_HOUSEHOLD_TAX_VARIABLES). policyengine_uk/tests/
# test_fiscal_partition.py checks the two against each other and checks the
# accounting properties below on simulated households.
# policyengine_uk/tests/aggregate_impact/test_aggregate_impact_partition.py
# checks closure for every total without data, and the aggregate-impact
# report checks the accounting properties on the certified dataset.
#
# Spending heads divide gov_spending and household_benefits the same way:
# one benefit or service per head, one variable each.
#
# Consumers (tests, the per-PR aggregate impact report) read this file
# directly. Bump schema_version on any change to field meanings.
#
# Fields
#   tax_heads[]:
#     id                one per head
#     label             sentence-case name
#     variable          the one model variable that measures the head
#     entity            household or person
#     obr_line          the row of OBR EFO November 2025 Table A.5 ("Current
#                       receipts") the head belongs to, or
#                       not_an_obr_current_receipt (see sources)
#     obr_table_3_1     the line of EFO Table 3.1 ("Public sector receipts
#                       as a share of GDP") that holds it, where the table's
#                       footnotes say so; null where they don't (see sources)
#     report_group      grouping for reports
#     payer             who bears it in the model: household (the household
#                       or its members pay it directly), employer, consumer
#                       incidence (allocated by consumption), corporate
#                       incidence (allocated by shareholding), or mixed
#     totals            the totals that include it
#     sign              nonnegative (at current-law parameter values, for
#                       non-negative inputs) or any (a change measure)
#     zero_at_baseline  expected: current-law parameters make it zero for
#                       every household (a reform-only head)
#     reads             other heads this head's formula reaches, with the
#                       route; reads that change eligibility, not inclusion
#   exclusions[]: variables that must never be summed alongside the heads.
#     kind: component (summed or read inside `head`), measure_within (an
#     analytical decomposition already inside `head` through its inputs),
#     composite (spans several heads), duplicate (same value as `head`),
#     baseline_measure, assessment (a tax amount worked out for a means test,
#     a ceiling or a record, not a payment), change_measure (a wage change
#     that already sits inside the incomes a head taxes).
#   model_double_counts[]: known violations still in the model: a variable a
#     total lists although the head variable `contained_in` already adds it.
#     None since the #2159 fix gave corporate_sdlt its own head.
#   uncovered_receipts[]: rows of Table A.5 the model has no household
#     measure for. With the heads' obr_line values they account for every
#     tax row of the table.
#   overlap_guards[]: the places double counting could occur, and the
#     property the tests check for each. overlapping_base records a receipt
#     allocation between heads sharing an imputed base. The report also
#     checks the geographic_exclusivity guards on the certified dataset.
#   spending_heads[]: as tax_heads, without obr_line, obr_table_3_1 and
#     payer, plus caseload (default true): whether reports count recipients.
schema_version: 1

sources:
  obr_table_3_1: >-
    OBR, Economic and fiscal outlook, March 2026, Table 3.1. Its footnotes put
    capital gains tax, inheritance tax, property transaction taxes and stamp
    taxes on shares in "Capital taxes", and council tax in "PSNB-neutral
    receipts". They do not place vehicle excise duty, the licence fee or
    Northern Ireland domestic rates. Read 2026-10-11 from
    https://obr.uk/efo/economic-and-fiscal-outlook-march-2026/
  obr_line: >-
    OBR, Economic and fiscal outlook, November 2025, Table A.5 ("Current
    receipts"): its tax rows, from "Income tax" to "Other taxes". Footnote 3
    puts the high-value council tax surcharge in "Council tax"; footnote 4
    puts stamp duty land tax, the devolved property transaction taxes and
    the annual tax on enveloped dwellings in "Property transaction taxes".
    Read 2026-10-11 from
    https://obr.uk/efo/economic-and-fiscal-outlook-november-2025/
  council_tax: >-
    OBR, "Council tax" (tax by tax, spend by spend): council tax receipts add
    a forecast of Northern Irish domestic rates to Great Britain's, and are
    net of discounts and reduction schemes. Read 2026-10-11 from
    https://obr.uk/forecasts-in-depth/tax-by-tax-spend-by-spend/council-tax/
  student_loans: >-
    Student loan repayments are not a row of Table A.5. In the March 2026
    EFO only the interest accrued on the loans enters receipts, in "Interest
    and dividend receipts".
  independent_specification: >-
    A second specification was written from Table A.5 and the variables'
    formulas by a reviewer who was not shown the model's lists or this file
    (2026-10-11). It chose the same variable for every head here except
    where noted on the head, and supplied the uncovered rows and several of
    the exclusions and guards. It listed the change measures (vat_change,
    the employer NI response incidence and the two unallocated tax changes)
    as exclusions from a total of levels; here they are heads of the totals
    that use them, zero at current law.
  gambling_duties: >-
    OBR, Economic and fiscal outlook, November 2025, Table A.5, footnote 5,
    includes betting and gaming duties within Other HMRC taxes. This head
    measures only supplied household gambling bases; the other components
    of that receipts row remain unmodelled. No Table 3.1 allocation is
    claimed. https://obr.uk/docs/dlm_uploads/OBR_Economic_and_fiscal_outlook_November_2025.pdf#page=195

totals:
  gov_tax:
    label: Government tax revenue in respect of the household
    description: Receipts at their level, including employer-paid taxes and VAT.
    dropped_when:
      gov.contrib.abolish_council_tax:
        - council_tax
        - high_value_council_tax_surcharge
  household_tax:
    label: Taxes borne by the household
    description: >-
      Taxes subtracted from household net income. VAT and employer NI enter
      only as reform-induced changes (vat_change, private_school_vat_change
      and the employer NI response incidence), because baseline VAT and
      employer NI are not deducted from the incomes the model starts from.
    dropped_when:
      gov.contrib.abolish_council_tax:
        - council_tax
        - high_value_council_tax_surcharge
  pre_budget_change_household_tax:
    label: Taxes borne by the household, pre-budget-change definition
    description: >-
      A fixed earlier definition of household_tax used by
      pre_budget_change_household_net_income. It omits heads added since
      (alcohol, tobacco and vehicle excise duties, private school VAT, the
      high value council tax surcharge, student loan repayments, and the
      incidence-change heads).
    dropped_when:
      gov.contrib.abolish_council_tax:
        - council_tax

  gov_spending:
    label: Government spending in respect of the household
    description: >-
      Cash benefits, childcare and student support, and public services in
      kind (NHS, education, transport subsidies).
    dropped_when:
      gov.contrib.abolish_council_tax:
        - council_tax_benefit
  household_benefits:
    label: Benefits received by the household
    description: >-
      The benefit side of household net income. It is gov_spending without the
      contributed budget-change line, which is not paid to households.
    dropped_when:
      gov.contrib.abolish_council_tax:
        - council_tax_benefit

tax_heads:
  # Income and earnings
  - id: income_tax
    label: Income tax
    variable: income_tax
    entity: person
    obr_line: Income tax
    obr_table_3_1: Income tax
    report_group: income_tax
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
  - id: nics_individual
    label: National Insurance (employee and self-employed)
    variable: national_insurance
    entity: person
    obr_line: National insurance contributions
    obr_table_3_1: NICs
    report_group: national_insurance
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
  - id: nics_employer
    label: National Insurance (employer)
    variable: ni_employer
    entity: person
    obr_line: National insurance contributions
    obr_table_3_1: NICs
    report_group: national_insurance
    payer: employer
    totals: [gov_tax]
    sign: nonnegative
  - id: employer_nics_response_capital
    label: Employer NI change borne by capital
    variable: employer_ni_response_capital_incidence
    entity: person
    obr_line: National insurance contributions
    obr_table_3_1: NICs
    report_group: national_insurance
    payer: corporate incidence
    totals: [household_tax]
    sign: any
    zero_at_baseline: expected
  - id: employer_nics_response_consumer
    label: Employer NI change borne by consumers
    variable: employer_ni_response_consumer_incidence
    entity: person
    obr_line: National insurance contributions
    obr_table_3_1: NICs
    report_group: national_insurance
    payer: consumer incidence
    totals: [household_tax]
    sign: any
    zero_at_baseline: expected
  - id: capital_gains_tax
    label: Capital gains tax
    variable: capital_gains_tax
    entity: person
    obr_line: Capital gains tax
    obr_table_3_1: Capital taxes
    report_group: capital_taxes
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
  - id: student_loan_repayments
    label: Student loan repayments
    variable: student_loan_repayments
    entity: person
    obr_line: not_an_obr_current_receipt
    obr_table_3_1: null
    obr_line_note: >-
      A financial transaction: repayments reduce the student loan book, not
      borrowing, so they are outside current receipts. The model counts them
      in gov_tax and household_tax; reports should show them separately. The
      independent specification left them out of both tax totals.
    report_group: financial_transactions
    payer: household
    totals: [gov_tax, household_tax]
    sign: nonnegative

  # Consumption
  - id: vat
    label: VAT excluding private school fees
    variable: vat
    entity: household
    obr_line: Value added tax
    obr_table_3_1: Value added tax
    report_group: vat
    payer: consumer incidence
    totals: [gov_tax]
    sign: nonnegative
    data_note: >-
      Grossed-up VAT on recorded consumption less private school fees'
      official share of VAT receipts, which the separate school head counts,
      plus VAT on energy bills. The share is below one, so the allocation
      keeps the sign of the grossed-up amount. Negative for 76 households on
      policyengine-uk-data 1.58.0 (enhanced_frs_2024_25) in every year from
      2025 to 2030, -£72m weighted in 2026: full_rate_vat_consumption is
      negative there because the dataset's consumption (44 households) or
      full_rate_vat_expenditure_rate (32 households) is negative.
      policyengine-uk-data issue 565. Measured 2026-10-11.
  - id: vat_change
    label: Change in VAT from its baseline
    variable: vat_change
    entity: household
    obr_line: Value added tax
    obr_table_3_1: Value added tax
    report_group: vat
    payer: consumer incidence
    totals: [household_tax, pre_budget_change_household_tax]
    sign: any
    zero_at_baseline: expected
    reads:
      - head: vat
        route: vat_change adds vat and subtracts baseline_vat
        why: a change measure built from the level; the two are never in the same total
  # Standard-rated from 1 January 2025: Finance Act 2025 s.47 inserts VATA
  # 1994 Sch 9 Part 3, taking private school education, vocational training
  # and closely related board and lodging out of the Group 6 exemption, for
  # supplies on or after that date (s.49). Before it the head is zero unless
  # the contributed reform rate is set.
  - id: private_school_vat
    label: VAT on private school fees
    variable: private_school_vat
    entity: household
    obr_line: Value added tax
    obr_table_3_1: Value added tax
    report_group: vat
    payer: household
    totals: [gov_tax]
    sign: nonnegative
    reads:
      - head: income_tax
        route: private_school_vat -> attends_private_school -> income_tax
        why: attendance is imputed from income; it decides who attends, not how much tax is counted
      - head: nics_individual
        route: private_school_vat -> attends_private_school -> (net income) -> national_insurance
        why: as above
      - head: council_tax
        route: private_school_vat -> attends_private_school -> household_benefits -> council_tax_benefit -> council_tax
        why: as above
  - id: private_school_vat_change
    label: Change in private school VAT from its baseline
    variable: private_school_vat_change
    entity: household
    obr_line: Value added tax
    obr_table_3_1: Value added tax
    report_group: vat
    payer: household
    totals: [household_tax]
    sign: any
    zero_at_baseline: expected
    reads:
      - head: private_school_vat
        route: private_school_vat_change adds private_school_vat and subtracts baseline_private_school_vat
        why: a change measure built from the level; the two are never in the same total
      - head: income_tax
        route: private_school_vat_change -> private_school_vat -> attends_private_school -> income_tax
        why: attendance is imputed from income; it decides who attends, not how much tax is counted
      - head: nics_individual
        route: private_school_vat_change -> private_school_vat -> attends_private_school -> (net income) -> national_insurance
        why: as above
      - head: council_tax
        route: private_school_vat_change -> private_school_vat -> attends_private_school -> household_benefits -> council_tax_benefit -> council_tax
        why: as above
  - id: fuel_duty
    label: Fuel duties
    variable: fuel_duty
    entity: household
    obr_line: Fuel duties
    obr_table_3_1: Fuel duties
    report_group: excise_duties
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
  - id: alcohol_duty
    label: Alcohol duties
    variable: alcohol_duty
    entity: household
    obr_line: Alcohol duties
    obr_table_3_1: Alcohol and tobacco duties
    report_group: excise_duties
    payer: household
    totals: [gov_tax, household_tax]
    sign: nonnegative
    data_note: >-
      Zero for every household on policyengine-uk-data 1.58.0
      (enhanced_frs_2024_25) in every year from 2025 to 2030, measured
      2026-10-11. Issue 1872.
  - id: tobacco_duty
    label: Tobacco duties
    variable: tobacco_duty
    entity: household
    obr_line: Tobacco duties
    obr_table_3_1: Alcohol and tobacco duties
    report_group: excise_duties
    payer: household
    totals: [gov_tax, household_tax]
    sign: nonnegative
    data_note: >-
      Zero for every household on policyengine-uk-data 1.58.0
      (enhanced_frs_2024_25) in every year from 2025 to 2030, measured
      2026-10-11. Issue 1873.
  - id: vehicle_excise_duty
    label: Vehicle excise duties
    variable: vehicle_excise_duty
    entity: household
    obr_line: Vehicle excise duties
    obr_table_3_1: null
    report_group: excise_duties
    payer: household
    totals: [gov_tax, household_tax]
    sign: nonnegative
    data_note: >-
      Zero for every household on policyengine-uk-data 1.58.0
      (enhanced_frs_2024_25) in every year from 2025 to 2030, measured
      2026-10-11. Issue 1874.
  - id: gambling_duty
    label: Betting and gaming duties
    variable: gambling_duty
    entity: household
    obr_line: Other HMRC taxes
    obr_line_note: >-
      Betting and gaming duties belong to this row under November 2025 Table
      A.5 footnote 5. This head provides partial row coverage only; other
      Other HMRC taxes remain unmodelled.
    obr_table_3_1: null
    report_group: excise_duties
    payer: household
    totals: [gov_tax, household_tax]
    sign: nonnegative
    data_note: >-
      Calculated from supplied nonnegative attributed dutiable bases only.
      Missing inputs default to zero; this does not establish population
      data adoption or calibrated receipts. Casino incidence uses a fixed
      UK cash receipts/GB game yield proxy reviewed under issue 2587.
      This head does not measure the residual Other HMRC taxes components.
  - id: tv_licence
    label: TV licence fee
    variable: tv_licence
    entity: household
    obr_line: Licence fee receipts
    obr_table_3_1: null
    report_group: other_receipts
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
    reads:
      - head: income_tax
        route: tv_licence -> tv_licence_discount -> pension_credit -> pension_credit_income -> income_tax
        why: the over-75 discount depends on Pension Credit receipt, a means test on net income
      - head: nics_individual
        route: tv_licence -> tv_licence_discount -> pension_credit -> pension_credit_income -> national_insurance
        why: as above

  # Property
  - id: council_tax
    label: Council tax
    variable: council_tax
    entity: household
    obr_line: Council tax
    obr_line_note: >-
      Gross of Council Tax Reduction. The OBR's receipts are net of discounts
      and reduction schemes; the model counts the reduction as spending
      (council_tax_benefit) instead. Compare with the OBR row net of it. The
      independent specification chose the net variable,
      council_tax_less_benefit.
    obr_table_3_1: PSNB-neutral receipts
    report_group: local_taxes
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
  - id: high_value_council_tax_surcharge
    label: High value council tax surcharge
    variable: high_value_council_tax_surcharge
    entity: household
    obr_line: Council tax
    obr_table_3_1: PSNB-neutral receipts
    report_group: local_taxes
    payer: household
    totals: [gov_tax, household_tax]
    sign: nonnegative
  - id: domestic_rates
    label: Northern Ireland domestic rates
    variable: domestic_rates
    entity: household
    obr_line: Council tax
    obr_table_3_1: null
    obr_line_note: >-
      The OBR adds Northern Irish domestic rates to its council tax receipts
      (see sources).
    report_group: local_taxes
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
  - id: business_rates
    label: Business rates
    variable: business_rates
    entity: household
    obr_line: Business rates
    obr_table_3_1: Business rates
    report_group: business_rates
    payer: corporate incidence
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
    data_note: >-
      Allocates each nation's published non-domestic rates outturn (England
      and Wales local and central rating lists, Scotland, Northern Ireland),
      projected with OBR receipts (gov.hmrc.business_rates.statistics). In
      2026-27 the England, Scotland and Wales series total £37.26bn against
      £37.41bn on the OBR's Business rates line (receipts Table 3.8).
      Northern Ireland's £0.78bn (LPS non-domestic rates paid) compares with
      £0.40bn on the OBR's "Northern Ireland business rates" line, which the
      OBR records under other taxes (Table 3.2). Measured 2026-10-11.
  - id: sdlt_household
    label: Stamp duty land tax on the household's own purchases
    variable: expected_sdlt
    entity: household
    obr_line: Property transaction taxes
    obr_table_3_1: Capital taxes
    report_group: property_transaction_taxes
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
    data_note: >-
      policyengine-uk-data 1.58.0 calibrates stamp_duty_land_tax to the OBR's
      total SDLT, which includes the companies' share that sdlt_corporate
      allocates by shareholding (policyengine-uk-data issue 564). In 2026-27
      the two heads total £23.29bn against the OBR's £18.15bn, measured
      2026-10-11.
  - id: sdlt_corporate
    label: Stamp duty land tax paid by companies
    variable: corporate_sdlt
    entity: household
    obr_line: Property transaction taxes
    obr_table_3_1: Capital taxes
    report_group: property_transaction_taxes
    payer: corporate incidence
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
  - id: land_transaction_tax
    label: Land transaction tax (Wales)
    variable: expected_ltt
    entity: household
    obr_line: Property transaction taxes
    obr_table_3_1: Capital taxes
    report_group: property_transaction_taxes
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
    data_note: >-
      Equal to land_transaction_tax, with no property sale rate scaling
      (issue 2246). On policyengine-uk-data 1.58.0 (enhanced_frs_2024_25),
      £0.070bn in 2026, all on main-residence purchases: no Welsh record has
      an additional-dwelling or non-residential purchase or a rent charge.
      Measured 2026-10-11 on model 2.126.8, before the Welsh rate updates
      (issue 1796); these are historical figures.
  - id: land_and_buildings_transaction_tax
    label: Land and buildings transaction tax (Scotland)
    variable: expected_lbtt
    entity: household
    obr_line: Property transaction taxes
    obr_table_3_1: Capital taxes
    report_group: property_transaction_taxes
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
    data_note: >-
      Equal to land_and_buildings_transaction_tax, with no property sale rate
      scaling (issue 2246). On policyengine-uk-data 1.58.0
      (enhanced_frs_2024_25) in 2026, £0.385bn on main-residence purchases.
      Before PR 2241 (issue 2238) it is £2.310bn: the main-residence purchase
      flag also charges £15.2bn of other residential property as
      additional-dwelling purchases. Measured 2026-10-11.

  # Reform-only heads
  - id: corporate_incident_tax_change
    label: Unspecified tax change borne by capital
    variable: corporate_incident_tax_revenue_change
    entity: household
    obr_line: not_an_obr_current_receipt
    obr_table_3_1: null
    obr_line_note: A lump-sum revenue change allocated by shareholding.
    report_group: incidence_changes
    payer: corporate incidence
    totals: [gov_tax, household_tax]
    sign: any
    zero_at_baseline: expected
  - id: consumer_incident_tax_change
    label: Unspecified tax change borne by consumers
    variable: consumer_incident_tax_revenue_change
    entity: household
    obr_line: not_an_obr_current_receipt
    obr_table_3_1: null
    obr_line_note: A lump-sum revenue change allocated by consumption.
    report_group: incidence_changes
    payer: consumer incidence
    totals: [gov_tax, household_tax]
    sign: any
    zero_at_baseline: expected
  - id: wealth_tax
    label: Wealth tax
    variable: wealth_tax
    entity: household
    obr_line: not_an_obr_current_receipt
    obr_table_3_1: null
    obr_line_note: A hypothetical tax.
    report_group: hypothetical_taxes
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
    zero_at_baseline: expected
  - id: non_primary_residence_wealth_tax
    label: Wealth tax excluding the main residence
    variable: non_primary_residence_wealth_tax
    entity: household
    obr_line: not_an_obr_current_receipt
    obr_table_3_1: null
    obr_line_note: A hypothetical tax.
    report_group: hypothetical_taxes
    payer: household
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
    zero_at_baseline: expected
  - id: land_value_tax
    label: Land value tax
    variable: LVT
    entity: household
    obr_line: not_an_obr_current_receipt
    obr_table_3_1: null
    obr_line_note: A hypothetical tax.
    report_group: hypothetical_taxes
    payer: mixed
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
    zero_at_baseline: expected
  - id: carbon_tax
    label: Carbon tax
    variable: carbon_tax
    entity: household
    obr_line: not_an_obr_current_receipt
    obr_table_3_1: null
    obr_line_note: A hypothetical tax.
    report_group: hypothetical_taxes
    payer: mixed
    totals: [gov_tax, household_tax, pre_budget_change_household_tax]
    sign: nonnegative
    zero_at_baseline: expected

exclusions:
  # Property transaction taxes
  - {variable: stamp_duty_land_tax, kind: component, head: sdlt_household, note: "The liability expected_sdlt reads; zero under gov.hmrc.stamp_duty.abolish because sdlt_liable is then false."}
  - {variable: sdlt_on_transactions, kind: component, head: sdlt_household}
  - {variable: sdlt_on_rent, kind: component, head: sdlt_household}
  - {variable: sdlt_on_residential_property_transactions, kind: component, head: sdlt_household}
