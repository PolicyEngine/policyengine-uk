# Regression fixtures for microsimulation reform impacts.
# These expected impacts are derived from current model output and are used to
# catch unintended behavior changes. They are not external fiscal estimates
# unless a reform entry is explicitly annotated otherwise.
#
# Each impact is the change in weighted gov_balance in 2029, in £bn, on the
# dataset below, which must be the one tests/certified_dataset.yaml pins.
# `receipts` keeps every earlier value with the model and data that produced
# it, so a change of dataset and a change of model stay separable. Tests ran
# on whatever enhanced FRS was latest until 2026-04-05, then on uk-data 1.40.3
# (enhanced_frs_2023_24), and from 2026-10-11 on the certified 1.58.0 pair. The
# 2026-10-11 receipts on 1.40.3 show how much of each move is the data rather
# than the model.
