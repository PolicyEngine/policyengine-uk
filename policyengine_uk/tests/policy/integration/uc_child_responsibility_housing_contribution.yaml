# UC Regs 2013 Sch 4 para 16(2)(i), reg 4: own-family responsibility, strict under-5 age.
# Source-derived 2026 annual contribution: 12 x 96.55 = 1,158.60.
# Unchanged single-over-25 standard allowance: 12 x 424.90 = 5,098.80.
# With no earnings/capital/debt and nonbinding cap, renter UC = standard + council rent - contributions.
# The non-dependant family does not claim UC; legal roles and membership, rather than forced awards/ages/exemptions, establish responsibility.

- name: UC housing contribution - non-claiming parent of a four-year-old is exempt
  period: 2026
  absolute_error_margin: 0.02
  input:
    people:
      renter:
        age: 60
        is_household_head: true
        is_claimant_or_partner: true
      parent:
        age: 30
        is_claimant_or_partner: true
      child:
        age: 4
        is_claimant_or_partner: false
    benunits:
      renter_family:
        members:
        - renter
        would_claim_uc: true
        claims_all_entitled_benefits: false
      parent_family:
        members:
        - parent
        - child
        would_claim_uc: false
        claims_all_entitled_benefits: false
    households:
      household:
        members:
        - renter
        - parent
        - child
        rent: 6000
        tenure_type: RENT_FROM_COUNCIL
        region: NORTH_WEST
  output:
    uc_non_dep_deduction_exempt:
    - false
    - true
    - false
    uc_individual_non_dep_deduction:
    - 0
    - 0
    - 0
    uc_non_dep_deductions:
    - 0
    - 0
    uc_housing_costs_element:
    - 6000
    - 0
    universal_credit:
    - 11098.8
    - 0
