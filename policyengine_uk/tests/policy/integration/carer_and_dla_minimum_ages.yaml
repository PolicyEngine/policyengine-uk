# Conditional age-boundary cash cases, with the existing annual age/rate convention.
# Positive carers otherwise meet the qualifying-care/disability/duration conditions,
# have no earnings/overlapping personal benefit, and are not in full-time education.
# Report-only adult cases retain an existing input proxy, not a waiver of care rules.
# DLA care categories assume the separate needs/duration conditions; infant care is
# not automatic. No final amount, pre-overlap, earnings or eligibility is supplied.
- name: Reported Carers Allowance cannot pay a fifteen year old
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      caree:
        age: 50
        pip_dl_category: STANDARD
      carer:
        age: 15
        care_hours: 0
        carers_allowance_reported: 4000
    benunits:
      family:
        members:
        - caree
        - carer
    households:
      home:
        members:
        - caree
        - carer
        country: ENGLAND
  output:
    carers_allowance:
    - 0
    - 0
    carer_support_payment:
    - 0
    - 0
