# Reg4 age16 AND reg14 earnings; Sch2para4 favourable penny.
# Natural pay and annual-constant-earnings approximation; no eligibility/award overrides.
- name: Combined underage low earnings
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 15
    employment_income: 8000
    care_hours: 40
    carers_allowance_reported: 0
    country: SCOTLAND
  output:
    carer_support_payment_pre_overlap: 0
    carer_support_payment: 0
