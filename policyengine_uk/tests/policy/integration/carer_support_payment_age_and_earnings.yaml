    people:
      young:
        age: 15
        employment_income: 8000
        care_hours: 40
      high:
        age: 16
        employment_income: 10608.52
        care_hours: 40
      low:
        age: 16
        employment_income: 8000
        care_hours: 40
    benunits:
      b1:
        members: [young]
      b2:
        members: [high]
      b3:
        members: [low]
    households:
      home:
        members: [young, high, low]
        country: SCOTLAND
  output:
    carer_support_payment_pre_overlap: [0, 0, 4495.4]
    carer_support_payment: [0, 0, 4495.4]
