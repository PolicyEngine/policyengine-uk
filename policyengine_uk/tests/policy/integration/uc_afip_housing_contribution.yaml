- name: Case 7, a non-dependant couple without a qualifying benefit bears two contributions.
  period: 2026
  absolute_error_margin: 0.02
  input:
    people:
      renter:
        age: 40
        is_household_head: true
        is_claimant_or_partner: true
      non_dependant:
        age: 25
        is_claimant_or_partner: true
        employment_income: 20_000
      non_dependant_partner:
        age: 25
        is_claimant_or_partner: true
        employment_income: 20_000
    benunits:
      renter_family:
        members: [renter]
        would_claim_uc: true
        claims_all_entitled_benefits: false
      non_dependant_family:
        members: [non_dependant, non_dependant_partner]
        would_claim_uc: false
        claims_all_entitled_benefits: false
    households:
      household:
        members: [renter, non_dependant, non_dependant_partner]
        rent: 6_000
        tenure_type: RENT_FROM_COUNCIL
        region: NORTH_WEST
  output:
    # 2 x 1,158.60 = 2,317.20; 6,000 - 2,317.20 = 3,682.80; 5,098.80 + 3,682.80 = 8,781.60.
    uc_non_dep_deductions: [2_317.2, 0]
    uc_housing_costs_element: [3_682.8, 0]
    universal_credit: [8_781.6, 0]

