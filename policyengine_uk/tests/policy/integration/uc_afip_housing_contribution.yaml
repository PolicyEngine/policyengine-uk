# Under UC Regs 2013 Sch 4 para 16(2)(d), DWP deducts no housing cost
# contribution for a non-dependant "in receipt of attendance allowance", and
# the Secretary of State defines that term in reg 2 to include armed forces
# independence payment (head (f)). Under para 16(2)(e), DWP deducts none for a
# non-dependant who receives the PIP daily living component.
# 2026-27 amounts, from legislation.gov.uk:
# - Standard allowance, single claimant aged 25 or over (reg 36): 12 x 424.90 = 5,098.80.
# - Housing cost contribution (Sch 4 para 14(1)), one flat amount with no
#   earnings bands: 12 x 96.55 = 1,158.60.
# The renter has no earnings or capital and pays the council 6,000 a year, so
# UC = 5,098.80 + 6,000 - contributions.
# The non-dependant's own family does not claim UC. Any amount of AFIP in
# payment qualifies: £9,000 stands for any positive amount.

- name: Case 1, a non-dependant with no qualifying benefit bears a contribution.
  period: 2026
  absolute_error_margin: 0.02
  input:
    people:
      renter:
        age: 40
        is_household_head: true
        is_claimant_or_partner: true
      non_dependant:
        age: 25
        is_claimant_or_partner: true
        employment_income: 20_000
    benunits:
      renter_family:
        members: [renter]
        would_claim_uc: true
        claims_all_entitled_benefits: false
      non_dependant_family:
        members: [non_dependant]
        would_claim_uc: false
        claims_all_entitled_benefits: false
    households:
      household:
        members: [renter, non_dependant]
        rent: 6_000
        tenure_type: RENT_FROM_COUNCIL
        region: NORTH_WEST
  output:
    uc_non_dep_deduction_exempt: [false, false]
    uc_individual_non_dep_deduction: [0, 1_158.6]
    uc_non_dep_deductions: [1_158.6, 0]
    uc_housing_costs_element: [4_841.4, 0]
    universal_credit: [9_940.2, 0]

