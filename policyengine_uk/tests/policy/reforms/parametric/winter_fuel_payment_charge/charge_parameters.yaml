# Reforms to the winter fuel payment charge parameters
# (gov.hmrc.income_tax.charges.winter_fuel_payment).

- name: A higher income threshold - total income under it is not charged
  period: 2025
  input:
    gov.hmrc.income_tax.charges.winter_fuel_payment.income_threshold: 50_000
    age: 70
    country: ENGLAND
    total_income: 45_000
    pension_credit: 0
  output:
    winter_fuel_payment: 200
    winter_fuel_payment_charge: 0

- name: A higher income threshold - total income over it is charged
  period: 2025
  input:
    gov.hmrc.income_tax.charges.winter_fuel_payment.income_threshold: 50_000
    age: 70
    country: ENGLAND
    total_income: 50_001
    pension_credit: 0
  output:
    winter_fuel_payment: 200
    winter_fuel_payment_charge: 200

- name: Repealing the charge leaves the payment with everyone
  period: 2025
  input:
    gov.hmrc.income_tax.charges.winter_fuel_payment.in_effect: false
    age: 70
    country: ENGLAND
    total_income: 50_000
    pension_credit: 0
  output:
    winter_fuel_payment: 200
    winter_fuel_payment_charge: 0

- name: Charging a universal payment for the 2024 qualifying week
  period: 2024
  input:
    gov.dwp.winter_fuel_payment.eligibility.require_benefits: false
    gov.hmrc.income_tax.charges.winter_fuel_payment.in_effect: true
    age: 70
    country: ENGLAND
    total_income: 50_000
    pension_credit: 0
  output:
    winter_fuel_payment: 200
    winter_fuel_payment_charge: 200

- name: Tax credits do not exempt a person from the charge
  # Charging the 2024 qualifying week's payments: a tax credit award of at
  # least £26 entitled a person to that payment (SI 2024/869 reg. 2(2)(b)
  # (ii)), but tax credits are not among the relevant benefits of ITEPA 2003
  # s.681I(5), so the person is charged.
  period: 2024
  input:
    gov.hmrc.income_tax.charges.winter_fuel_payment.in_effect: true
    age: 70
    country: ENGLAND
    total_income: 50_000
    pension_credit: 0
    tax_credits: 1_000
  output:
    is_on_winter_fuel_payment_relevant_benefit: true
    winter_fuel_payment: 200
    winter_fuel_payment_charge: 200
