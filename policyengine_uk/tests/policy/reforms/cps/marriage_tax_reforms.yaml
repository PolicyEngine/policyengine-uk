# CPS Marriage Tax Reforms (Centre for Policy Studies)
# Covers two structural reforms:
#   - expanded_ma_reform: extends Marriage Allowance eligibility to higher/additional
#     band earners (normally ineligible under ITA 2007 s. 55B).
#   - marriage_neutral_it_reform: allows married couples to have income tax computed
#     on equally split income if that yields a lower combined liability.
#
# The module-level reform instances are built with no child-age / education filters,
# so they apply to every married couple in these tests.

- name: Expanded MA — single higher-rate earner still has no Marriage Allowance
  period: 2024
  absolute_error_margin: 1
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.expanded_ma_reform
  input:
    gov.hmrc.income_tax.allowances.marriage_allowance.takeup_rate: 1.0
    people:
      adult:
        age: 35
        employment_income: 60_000
    benunits:
      benunit:
        members: [adult]
        is_married: false
    households:
      household:
        members: [adult]
  output:
    marriage_allowance: 0

- name: Expanded MA — married higher-rate earner gets Marriage Allowance from low-earner spouse
  period: 2024
  absolute_error_margin: 10
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.expanded_ma_reform
  input:
    gov.hmrc.income_tax.allowances.marriage_allowance.takeup_rate: 1.0
    people:
      high_earner:
        age: 35
        employment_income: 60_000
      low_earner:
        age: 33
        employment_income: 10_000
    benunits:
      benunit:
        members: [high_earner, low_earner]
        is_married: true
    households:
      household:
        members: [high_earner, low_earner]
  output:
    # Low earner's unused PA (12,570 − 10,000 = 2,570) is capped at PA × ma_rate
    # = 12,570 × 0.1 = 1,257, then rounded up to the nearest £10 → 1,260.
    # Low earner's partner has no unused PA to transfer, so low_earner's MA is 0.
    marriage_allowance: [1260, 0]

- name: Expanded MA — explicit Marriage Allowance take-up input drives the reform
  period: 2024
  absolute_error_margin: 10
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.expanded_ma_reform
  input:
    gov.hmrc.income_tax.allowances.marriage_allowance.takeup_rate: 0.0
    people:
      high_earner:
        age: 35
        employment_income: 60_000
        would_claim_marriage_allowance: true
      low_earner:
        age: 33
        employment_income: 10_000
        would_claim_marriage_allowance: true
    benunits:
      benunit:
        members: [high_earner, low_earner]
        is_married: true
    households:
      household:
        members: [high_earner, low_earner]
  output:
    marriage_allowance: [1260, 0]

- name: Marriage-neutral IT — single person's adjusted net income is unchanged by the reform
  period: 2024
  absolute_error_margin: 1
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.marriage_neutral_it_reform
  input:
    people:
      adult:
        age: 35
        employment_income: 50_000
    benunits:
      benunit:
        members: [adult]
        is_married: false
    households:
      household:
        members: [adult]
  output:
    # has_spouse is False → split_income == original income → reform returns the
    # unadjusted net income (taxable_employment_income ≈ employment_income here).
    adjusted_net_income: 50_000

- name: Marriage-neutral IT — married couple splits unequal income
  period: 2024
  absolute_error_margin: 1
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.marriage_neutral_it_reform
  input:
    people:
      high_earner:
        age: 35
        employment_income: 60_000
      low_earner:
        age: 33
        employment_income: 10_000
    benunits:
      benunit:
        members: [high_earner, low_earner]
        is_married: true
    households:
      household:
        members: [high_earner, low_earner]
  output:
    adjusted_net_income: [35_000, 35_000]

- name: Expanded MA — explicit no-claim input suppresses the reform even with full take-up rate
  period: 2024
  absolute_error_margin: 10
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.expanded_ma_reform
  input:
    gov.hmrc.income_tax.allowances.marriage_allowance.takeup_rate: 1.0
    people:
      high_earner:
        age: 35
        employment_income: 60_000
        would_claim_marriage_allowance: false
      low_earner:
        age: 33
        employment_income: 10_000
        would_claim_marriage_allowance: false
    benunits:
      benunit:
        members: [high_earner, low_earner]
        is_married: true
    households:
      household:
        members: [high_earner, low_earner]
  output:
    marriage_allowance: [0, 0]

- name: Marriage-neutral income tax — a dependant's income stays out of the couple's split
  # Only the spouses' incomes are pooled: (60,000 + 10,000) / 2 = 35,000 each,
  # which lowers their combined tax. The 19-year-old dependant at school keeps
  # their own 8,000. Previously the dependant counted as a third adult, which
  # blocked the split.
  period: 2024
  absolute_error_margin: 1
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.marriage_neutral_it_reform
  input:
    people:
      high_earner:
        age: 45
        is_parent: true
        employment_income: 60_000
      low_earner:
        age: 45
        is_parent: true
        employment_income: 10_000
      student:
        age: 19
        current_education: UPPER_SECONDARY
        employment_income: 8_000
    benunits:
      benunit:
        members: [high_earner, low_earner, student]
        is_married: true
    households:
      household:
        members: [high_earner, low_earner, student]
  output:
    adjusted_net_income: [35_000, 35_000, 8_000]

# A supplied adjusted net income took precedence over this reform before
# #2253 moved its override to net_income; it still sets the taxable base.
- name: Marriage-neutral IT — a supplied adjusted net income still sets the taxable base
  period: 2026
  absolute_error_margin: 1
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.marriage_neutral_it_reform
  input:
    people:
      earner:
        age: 40
        adjusted_net_income: 50_000
        personal_allowance: 12_570
        marriage_allowance: 0
      spouse:
        age: 40
        adjusted_net_income: 0
        personal_allowance: 12_570
        marriage_allowance: 0
    benunits:
      benunit:
        members: [earner, spouse]
        is_married: true
    households:
      household:
        members: [earner, spouse]
        region: NORTH_WEST
  output:
    net_income: [50_000, 0]
    earned_taxable_income: [37_430, 0]
    income_tax: [7_486, 0]

- name: Marriage-neutral IT — supplied ANI restores pension relief to the taxable base
  period: 2024
  absolute_error_margin: 0.01
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.marriage_neutral_it_reform
  input:
    people:
      supplied:
        age: 45
        employment_income: 150_000
        personal_pension_contributions: 60_000
        adjusted_net_income: 90_000
    benunits:
      supplied_family:
        members: [supplied]
        is_married: false
    households:
      supplied_household:
        members: [supplied]
        region: LONDON
  output:
    net_income: 150_000
    adjusted_net_income: 90_000
    pension_contributions_relief: 60_000
    personal_allowance: 12_570
    income_tax: 23_432

- name: Marriage-neutral IT — a supplied adjusted net income gets the grossed-up gift back
  period: 2026
  absolute_error_margin: 1
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.marriage_neutral_it_reform
  input:
    people:
      earner:
        age: 40
        adjusted_net_income: 49_000
        gift_aid: 800
        personal_allowance: 12_570
        marriage_allowance: 0
      spouse:
        age: 40
        adjusted_net_income: 0
        personal_allowance: 12_570
        marriage_allowance: 0
    benunits:
      benunit:
        members: [earner, spouse]
        is_married: true
    households:
      household:
        members: [earner, spouse]
        region: NORTH_WEST
  output:
    # ANI already has the £1,000 grossed-up gift deducted (s.58), so net
    # income is £50,000; the raised basic rate limit gives no relief here.
    net_income: [50_000, 0]
    adjusted_net_income: [49_000, 0]
    earned_taxable_income: [37_430, 0]
    income_tax: [7_486, 0]
