# Couple-only Carer’s Allowance and Carer Support Payment regressions (#2028).
# SSCBA 1992 s70(7ZA) and SSI 2023/302 reg5(3) prevent two relevant
# entitlements for the same cared-for person. These synthetic households use
# the model’s qualifying-caring proxy; they do not establish a disability
# award or reproduce individual election/discretion decisions.
# The recorded-award/head fallback is a model convention, not legal priority.
# Different-target defaults and authoritative directly supplied awards remain
# covered by carer_premium.yaml. Base cases explicitly decline UC; the two
# UC controls align both programmes on the elder carer. Cross-programme
# allocation where an election differs from the UC elder default is outside
# this couple-allowance fix.
# The annual rate oracle is 86.45 * 52 = 4,495.40 (current model parameter /
# DWP published 2026-27 table; CSP enacted by SSI 2026/170 reg12(3)(a)).
# Premium: 48.15 * 52 = 2,503.80. UC carer element: 209.34 * 12 = 2,512.08.

- name: England default same-person couple has one award
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        care_hours: 35
      person2:
        age: 38
        care_hours: 35
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
  output:
    is_claimant_or_partner: [true, true]
    partners_care_for_same_severely_disabled_person: true
    carers_allowance_pre_overlap: [4495.4, 0]
    carers_allowance: [4495.4, 0]
    carer_support_payment_pre_overlap: [0, 0]
    carer_support_payment: [0, 0]
    is_entitled_to_carer_benefit: [true, false]
    carer_premium: 2503.8
    universal_credit: 0

