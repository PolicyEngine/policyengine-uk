# Income Support in a young person's own right ends qualifying young person
# status for Pension Credit (SPC Regs 2002 reg. 4A(5)), Child Benefit (Child
# Benefit (General) Regulations 2006 reg. 8(2)(a)) and Child Tax Credit (CTC
# Regs 2002 reg. 5(4)(c)). Universal Credit's list (UC Regs 2013 reg. 5(5))
# names Universal Credit, Employment and Support Allowance and Jobseeker's
# Allowance only, but SI 2014/1230 reg. 28 leaves a young person entitled to
# an existing benefit, Income Support among them, out of the Universal Credit
# test as well. The reg. 5 status alone stays.
#
# Pension Credit and Child Tax Credit read is_on_income_support: the benefit
# unit's calculated award, for whichever of the claimant and partner receives
# it, and the person's own report for any other member. Child Benefit reads
# receives_income_support_in_own_right, the person's own report, because the
# family's Income Support reads the Child Benefit test.
#
# Income Support stopped paying on 31 March 2026
# (gov/dwp/income_support/active.yaml), so reported receipt counts to 2025-26.
# 2025-26 amounts: Child Benefit eldest child £26.05 a week; Pension Credit
# first-child addition £78.10 a week. CTC child element £3,455 in 2024-25; the
# element needs an existing claim that a Universal Credit claim has not ended
# (is_CTC_eligible), so the CTC cases give the parent a reported award and the
# family no Universal Credit claim.

- name: Case 1, a 17-year-old at school with no Income Support is every programme's qualifying young person.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      grandparent:
        age: 70
        is_claimant_or_partner: true
      student:
        age: 17
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [grandparent, student]
  output:
    receives_income_support_in_own_right: [false, false]
    is_qualifying_young_person_for_pension_credit: [false, true]
    is_qualifying_young_person_for_child_benefit: [false, true]
    is_qualifying_young_person_for_universal_credit: [false, true]
    # 78.10 * 52.
    child_minimum_guarantee_addition: 4_061.20
    # 26.05 * 52.
    child_benefit_entitlement: 1_354.60

- name: Case 2, reported Income Support of their own ends it for Pension Credit, Child Benefit and Universal Credit, not under reg. 5 alone.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      grandparent:
        age: 70
        is_claimant_or_partner: true
      student:
        age: 17
        current_education: UPPER_SECONDARY
        income_support_reported: 3_000
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [grandparent, student]
  output:
    receives_income_support_in_own_right: [false, true]
    is_qualifying_young_person_for_pension_credit: [false, false]
    is_qualifying_young_person_for_child_benefit: [false, false]
    is_qualifying_young_person_under_universal_credit_regulation_5: [false, true]
    is_qualifying_young_person_for_universal_credit: [false, false]
    child_minimum_guarantee_addition: 0
    child_benefit_entitlement: 0
    is_child_or_young_person_for_legacy_benefits: [false, false]

- name: Case 3, the same for Child Tax Credit in 2024-25.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        child_tax_credit_reported: 1
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      student:
        age: 17
        current_education: UPPER_SECONDARY
        income_support_reported: 3_000
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, student]
        would_claim_uc: false
  output:
    is_on_income_support: [false, true]
    is_qualifying_young_person_for_child_tax_credit: [false, false]
    CTC_child_element: 0

- name: Case 4, without it the Child Tax Credit child element is paid.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        child_tax_credit_reported: 1
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      student:
        age: 17
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, student]
        would_claim_uc: false
  output:
    is_qualifying_young_person_for_child_tax_credit: [false, true]
    CTC_child_element: 3_455

- name: Case 5, it ends the 16-year-old's status too, which has no education condition.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      grandparent:
        age: 70
        is_claimant_or_partner: true
      school_leaver:
        age: 16
        current_education: NOT_IN_EDUCATION
        income_support_reported: 3_000
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [grandparent, school_leaver]
  output:
    is_qualifying_young_person_for_pension_credit: [false, false]
    is_qualifying_young_person_for_child_benefit: [false, false]
    is_qualifying_young_person_under_universal_credit_regulation_5: [false, true]
    is_qualifying_young_person_for_universal_credit: [false, false]

- name: Case 6, a report of Income Support after it stopped paying does not count.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandparent:
        age: 70
        is_claimant_or_partner: true
      student:
        age: 17
        current_education: UPPER_SECONDARY
        income_support_reported: 3_000
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [grandparent, student]
  output:
    receives_income_support_in_own_right: [false, false]
    is_qualifying_young_person_for_pension_credit: [false, true]
    is_qualifying_young_person_for_child_benefit: [false, true]
    is_qualifying_young_person_under_universal_credit_regulation_5: [false, true]
    is_qualifying_young_person_for_universal_credit: [false, true]

- name: Case 7, the Child Benefit input can be set directly; it does not decide Pension Credit or Child Tax Credit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      grandparent:
        age: 70
        is_claimant_or_partner: true
      student:
        age: 17
        current_education: UPPER_SECONDARY
        receives_income_support_in_own_right: true
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [grandparent, student]
  output:
    # No Income Support reported or calculated.
    is_on_income_support: [false, false]
    is_qualifying_young_person_for_pension_credit: [false, true]
    is_qualifying_young_person_for_child_tax_credit: [false, true]
    is_qualifying_young_person_for_child_benefit: [false, false]
    is_qualifying_young_person_for_universal_credit: [false, true]

# Case 8, 2019-20 amounts: standard minimum guarantee £167.25 a week; severe
# disability addition £65.85 a week; PIP daily living standard rate £58.70 a
# week; Income Support personal allowance for a single person aged 18 to 24
# £57.90 a week; winter fuel payment £200; colour TV licence £154.50.

- name: Case 8, a student-carer on Income Support of their own is not the pensioner's qualifying young person, so the pensioner gets no severe disability addition.
  period: 2019
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        pip_dl_category: STANDARD
        state_pension: 5_000
      student:
        # An orphan in full-time non-advanced education with an existing
        # Income Support claim (IS Regs 1987 reg. 13(2)(c)), caring for the
        # pensioner 35 hours a week without Carer's Allowance.
        age: 18
        current_education: UPPER_SECONDARY
        care_hours: 35
        would_claim_carers_allowance: false
        income_support_reported: 3_000
    benunits:
      pensioner_unit:
        members: [pensioner]
        would_claim_uc: false
      student_unit:
        members: [student]
        would_claim_uc: false
    households:
      household:
        members: [pensioner, student]
        # DWP first paid cost-of-living payments in 2022.
        cost_of_living_support_payment: 0
  output:
    # The student claims Income Support for their own benefit unit: no
    # income, so the award is the personal allowance, 57.90 x 52 = 3,010.80.
    income_support: [0, 3_010.80]
    is_on_income_support: [false, true]
    # Reg. 4A(5): not a qualifying young person, so not disregarded under
    # Schedule I para. 2(2)(f), and the pensioner does not live alone.
    is_qualifying_young_person_for_pension_credit: [false, false]
    severe_disability_minimum_guarantee_addition: [0, 0]
    # 167.25 x 52 = 8,697, less the State Pension 5,000.
    pension_credit: [3_697, 0]
    # State Pension 5,000 + PIP 58.70 x 52 = 3,052.40 + Pension Credit 3,697
    # + Income Support 3,010.80 + winter fuel payment 200, less TV licence
    # 154.50: 14,805.70. The cost-of-living payment is set to zero.
    household_net_income: 14_805.70
