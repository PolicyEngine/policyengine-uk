# A benefit unit's claimant or partner is never its own child or qualifying
# young person for Child Benefit (SSCBA 1992 ss.141, 143(1); Child Benefit
# (General) Regulations 2006 regs 12-13), Child Tax Credit (CTC Regs 2002
# reg. 3(1) Rule 1, Cases G-H) or Pension Credit (SPC Regs 2002 Sch. IIA
# para. 3). Rates: Child Benefit eldest child £27.05 a week in 2026-27
# (gov/hmrc/child_benefit/amount/eldest.yaml); Pension Credit child addition
# £69.98 and first-child addition £81.07 a week in 2026-27
# (gov/dwp/pension_credit/guarantee_credit/child/addition.yaml,
# .../child/first/addition.yaml); CTC child element £3,455 a year in 2024-25
# (gov/dwp/tax_credits/child_tax_credit/elements/child_element.yaml).

- name: Case 1, a lone 17-year-old at school is a qualifying young person but not their own.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [young_person]
  output:
    is_qualifying_young_person_for_child_benefit: true
    is_qualifying_young_person_for_pension_credit: true
    is_child_or_qualifying_young_person_for_child_benefit: false
    is_child_or_qualifying_young_person_for_pension_credit: false
    child_benefit_entitlement: 0
    child_minimum_guarantee_addition: 0

- name: Case 2, a lone parent aged 17 at school gets Child Benefit and the Pension Credit child addition for the baby only.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 17
        current_education: UPPER_SECONDARY
        is_parent: true
        is_claimant_or_partner: true
      baby:
        age: 1
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, baby]
  output:
    is_child_or_qualifying_young_person_for_child_benefit: [false, true]
    is_child_or_qualifying_young_person_for_pension_credit: [false, true]
    # The baby is the only, so eldest, child: 27.05 * 52.
    child_benefit_entitlement: 1_406.60
    # Born after 6 April 2017, so the standard addition: 69.98 * 52.
    child_minimum_guarantee_addition: 3_638.96

- name: Case 3, no Child Benefit or Pension Credit child addition for a partner aged 18 at school.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 18
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
  output:
    is_qualifying_young_person_for_child_benefit: [false, true]
    is_child_or_qualifying_young_person_for_child_benefit: [false, false]
    is_child_or_qualifying_young_person_for_pension_credit: [false, false]
    child_benefit_entitlement: 0
    child_minimum_guarantee_addition: 0

- name: Case 4, a parent's 17-year-old at school stays the family's qualifying young person.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    is_child_or_qualifying_young_person_for_child_benefit: [false, true]
    is_child_or_qualifying_young_person_for_pension_credit: [false, true]
    child_benefit_entitlement: 1_406.60
    # Born before 6 April 2017 and the eldest: 81.07 * 52.
    child_minimum_guarantee_addition: 4_215.64

- name: Case 5, Child Tax Credit counts no child element for a lone 17-year-old at school.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [young_person]
  output:
    is_qualifying_young_person_for_child_tax_credit: true
    is_child_or_qualifying_young_person_for_child_tax_credit: false
    is_responsible_for_child_or_qualifying_young_person_for_child_tax_credit: false
    CTC_child_element: 0

- name: Case 6, Child Tax Credit counts one child element for a parent's 17-year-old at school.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    is_child_or_qualifying_young_person_for_child_tax_credit: [false, true]
    is_responsible_for_child_or_qualifying_young_person_for_child_tax_credit: true
    CTC_child_element: 3_455

- name: Case 7, Child Tax Credit counts the baby but not the parent aged 17 at school.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 17
        current_education: UPPER_SECONDARY
        is_parent: true
        is_claimant_or_partner: true
      baby:
        age: 1
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, baby]
  output:
    is_child_or_qualifying_young_person_for_child_tax_credit: [false, true]
    CTC_child_element: 3_455
