# Carer premium for the legacy means-tested benefits.
# IS Regs 1987 Sch 2 para 14ZA(1): "the condition is that the claimant or his
# partner is, or both of them are, entitled to a carer's allowance ... or
# carer support payment". Para 15(7): "£48.15 in respect of each person who
# satisfied the condition specified in paragraph 14ZA" (from 6 April 2026;
# £46.40 from 7 April 2025). The same condition and per-person amount are in
# JSA Regs 1996 Sch 1 para 17 and Part IV (8), ESA Regs 2008 Sch 4 paras 8 and
# 11(3), HB Regs 2006 Sch 3 para 17 and Part 4 (8), HB (SPC) Regs 2006 Sch 3
# paras 9 and 12(4), and the English and Welsh council tax reduction rules.
# The model uses the rate in force on 30 April of the simulation year, so
# 2025 uses £46.40 and 2026 uses £48.15; the premium is weekly x 52.

- name: Carer premium for a single claimant entitled to Carer's Allowance
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        receives_carer_benefit: true
    benunits:
      family:
        members: [claimant]
  output:
    carer_premium: 48.15 * 52

- name: Carer premium once when only the partner cares
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
      partner:
        age: 38
        care_hours: 35
    benunits:
      family:
        members: [claimant, partner]
  output:
    is_claimant_or_partner: [true, true]
    carer_premium: 48.15 * 52

- name: Carer premium twice when the claimant and partner both care (para 15(7))
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        receives_carer_benefit: true
      partner:
        age: 38
        receives_carer_benefit: true
    benunits:
      family:
        members: [claimant, partner]
  output:
    carer_premium: 2 * 48.15 * 52

- name: Carer premium twice for two caring partners at the April 2025 rate
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        care_hours: 40
      partner:
        age: 38
        care_hours: 35
    benunits:
      family:
        members: [claimant, partner]
  output:
    carer_premium: 2 * 46.40 * 52

- name: No carer premium for a qualifying young person who cares
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 45
        is_parent: true
      young_person:
        age: 17
        is_in_non_advanced_education: true
        care_hours: 35
    benunits:
      family:
        members: [parent, young_person]
  output:
    is_claimant_or_partner: [true, false]
    is_child_or_young_person_for_legacy_benefits: [false, true]
    is_carer_for_benefits: [false, true]
    num_carers: 1
    carer_premium: 0

- name: No carer premium for a child under 16 who cares
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 35
        is_parent: true
      child:
        age: 14
        care_hours: 40
    benunits:
      family:
        members: [parent, child]
  output:
    is_claimant_or_partner: [true, false]
    carer_premium: 0

- name: Lone parent carer with a caring young person gets one premium
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        is_parent: true
        receives_carer_benefit: true
      young_person:
        age: 18
        is_in_non_advanced_education: true
        care_hours: 35
    benunits:
      family:
        members: [parent, young_person]
  output:
    num_carers: 2
    carer_premium: 48.15 * 52

- name: Two caring partners and a caring young person get two premiums (was #420)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 45
        is_parent: true
        receives_carer_benefit: true
      partner:
        age: 44
        is_parent: true
        care_hours: 35
      young_person:
        age: 17
        is_in_non_advanced_education: true
        care_hours: 35
    benunits:
      family:
        members: [claimant, partner, young_person]
  output:
    num_carers: 3
    carer_premium: 2 * 48.15 * 52

- name: Two caring partners' premiums enter the legacy applicable amounts
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        receives_carer_benefit: true
      partner:
        age: 38
        receives_carer_benefit: true
    benunits:
      family:
        members: [claimant, partner]
        disability_premium: 0
        enhanced_disability_premium: 0
        severe_disability_premium: 0
  output:
    benefits_premiums: 2 * 48.15 * 52
