# The non-dependant condition of the LHA shared accommodation rate, by scheme.
#
# Universal Credit: a specified renter has "no person [who] is a non-dependant
# in relation to the renter" (UC Regs 2013 Sch 4 para 28(4)), using para 9 and
# the UC qualifying young person (reg 5). The renter must also not be
# responsible for a child or qualifying young person (para 28(3)).
#
# Housing Benefit: the shared rate applies to "a young individual who has no
# non-dependant residing with him" (HB Regs 2006 reg 13D(2)(a)(i)), using reg 3
# and the Child Benefit young person (reg 19). A young individual is a single
# claimant, so not a lone parent responsible for a child or young person
# (reg 2(1)).
#
# A 16-year-old is a dependant only within each scheme's young person test.
# Outside it, they are a non-dependant. Either way the renter misses the shared
# rate. The cases with a 16-year-old set
# is_before_first_september_following_16th_birthday to false for every person,
# so that neither UC reg 5(1)(a) nor Child Benefit (General) Regs 2006 reg 4
# holds: a 16-year-old in education is a young person through education alone.
#
# Bedrooms: everyone aged 16 or over other than the claimant or partner has a
# bedroom (UC Sch 4 para 10(1)(b)-(c); HB reg 13D(3)(b)), so 1 + 1 = 2: C.

- name: A 16-year-old who has left education is a non-dependant under both schemes
  period: 2026
  input:
    people:
      parent:
        age: 33
        is_household_head: true
        is_claimant_or_partner: true
        is_before_first_september_following_16th_birthday: false
      son:
        age: 16
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        is_before_first_september_following_16th_birthday: false
    benunits:
      family:
        members: [parent, son]
    households:
      home:
        members: [parent, son]
  output:
    is_benefit_unit_non_dependant_for_universal_credit: [false, true]
    is_benefit_unit_non_dependant_for_legacy_benefits: [false, true]
    # UC: not a qualifying young person, so a non-dependant (para 9(2)).
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    universal_credit_renter_has_non_dependant: true
    is_lha_shared_accommodation_rate_specified_renter: false
    LHA_category: C
    # HB: not a Child Benefit qualifying young person, so the parent is a
    # single claimant under 35, but the son is a non-dependant residing with
    # them: not 13D(2)(a)(i), and 2 bedrooms: C.
    is_single_person: true
    is_housing_benefit_young_individual: true
    housing_benefit_has_non_dependant: true
    housing_benefit_LHA_category: C

- name: A 16-year-old in full-time education is a dependant under both schemes
  period: 2026
  input:
    people:
      parent:
        age: 33
        is_household_head: true
        is_claimant_or_partner: true
        is_before_first_september_following_16th_birthday: false
      son:
        age: 16
        is_claimant_or_partner: false
        current_education: UPPER_SECONDARY
        # As the previous case but in education: that alone makes him a
        # young person.
        is_before_first_september_following_16th_birthday: false
    benunits:
      family:
        members: [parent, son]
    households:
      home:
        members: [parent, son]
  output:
    is_benefit_unit_non_dependant_for_universal_credit: [false, false]
    is_benefit_unit_non_dependant_for_legacy_benefits: [false, false]
    # UC: responsible for a qualifying young person (para 28(3)).
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: true
    universal_credit_renter_has_non_dependant: false
    is_lha_shared_accommodation_rate_specified_renter: false
    LHA_category: C
    # HB: a lone parent, not a single claimant, so not a young individual.
    is_single_person: false
    is_housing_benefit_young_individual: false
    housing_benefit_has_non_dependant: false
    housing_benefit_LHA_category: C

- name: A 19-year-old past the UC terminal date is a UC non-dependant but an HB young person
  period: 2026
  input:
    people:
      parent:
        age: 34
        is_household_head: true
        is_claimant_or_partner: true
      daughter:
        age: 19
        is_claimant_or_partner: false
        current_education: POST_SECONDARY
        age_started_or_accepted_current_education_or_training: 18
        is_before_universal_credit_qualifying_young_person_terminal_date: false
    benunits:
      family:
        members: [parent, daughter]
    households:
      home:
        members: [parent, daughter]
  output:
    # UC reg 5(1)(b): a qualifying young person only up to the 1 September
    # after the 19th birthday, which has passed: a non-dependant.
    is_benefit_unit_non_dependant_for_universal_credit: [false, true]
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    universal_credit_renter_has_non_dependant: true
    is_lha_shared_accommodation_rate_specified_renter: false
    LHA_category: C
    # Child Benefit (General) Regs 2006 reg 3(4): in non-advanced education
    # begun before 19, so a young person (HB reg 19) in the parent's family:
    # not a non-dependant (reg 3(2)(a)), but the parent is a lone parent.
    is_benefit_unit_non_dependant_for_legacy_benefits: [false, false]
    housing_benefit_has_non_dependant: false
    is_single_person: false
    is_housing_benefit_young_individual: false
    housing_benefit_LHA_category: C

- name: A looked-after 17-year-old in education placed with a renter is not a non-dependant
  period: 2026
  input:
    people:
      renter:
        age: 28
        is_household_head: true
        is_claimant_or_partner: true
      placed:
        age: 17
        is_claimant_or_partner: false
        current_education: POST_SECONDARY
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [renter, placed]
    households:
      home:
        members: [renter, placed]
  output:
    # UC: a qualifying young person no one is responsible for (reg 4(6)(a))
    # is not a non-dependant (Sch 4 para 9(2)(g)). The renter is a foster
    # parent, so excepted from the shared rate anyway (para 29(9A)).
    is_child_or_young_person_placed_with_family: [false, true]
    is_benefit_unit_non_dependant_for_universal_credit: [false, false]
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    universal_credit_renter_has_non_dependant: false
    lha_renter_meets_foster_parent_condition: true
    is_lha_shared_accommodation_rate_specified_renter: false
    # HB: a young person placed by a local authority is not a member of the
    # household (reg 21(3)(a)) and not a non-dependant (reg 3(2)(c)).
    is_benefit_unit_non_dependant_for_legacy_benefits: [false, false]
    housing_benefit_has_non_dependant: false

- name: A looked-after 17-year-old who has left education is a UC foster child but an HB non-dependant
  period: 2026
  input:
    people:
      renter:
        age: 28
        is_household_head: true
        is_claimant_or_partner: true
      placed:
        age: 17
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [renter, placed]
    households:
      home:
        members: [renter, placed]
  output:
    # UC: not a qualifying young person, but a looked-after person under 18
    # placed with the renter, so the renter's foster child (para 9(3), with
    # the foster parent definition in reg 2) and not a non-dependant (para
    # 9(2)(c); is_lha_foster_child). This is the model's reading; the WRA
    # 2012 s.40 definition of a child (under 16) would make them a
    # non-dependant. HB: not a young person (reg 19), so reg 21(3) and reg
    # 3(2)(c) do not apply: a non-dependant.
    is_lha_foster_child: [false, true]
    is_child_or_young_person_placed_with_family: [false, false]
    is_benefit_unit_non_dependant_for_universal_credit: [false, false]
    is_benefit_unit_non_dependant_for_legacy_benefits: [false, true]
    universal_credit_renter_has_non_dependant: false
    housing_benefit_has_non_dependant: true

- name: A foster child under 16 is a non-dependant under neither scheme
  period: 2026
  input:
    people:
      renter:
        age: 28
        is_household_head: true
        is_claimant_or_partner: true
      foster_child:
        age: 9
        is_claimant_or_partner: false
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [renter, foster_child]
    households:
      home:
        members: [renter, foster_child]
  output:
    # UC Sch 4 para 9(2)(c); HB reg 3(2)(c) with reg 21(3)(a).
    is_benefit_unit_non_dependant_for_universal_credit: [false, false]
    is_benefit_unit_non_dependant_for_legacy_benefits: [false, false]
    universal_credit_renter_has_non_dependant: false
    housing_benefit_has_non_dependant: false

- name: A joint tenant's adult son counts for that tenant only in the HB shared rate test and in one UC claim
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        is_household_head: true
        is_claimant_or_partner: true
      son:
        age: 22
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        household_benefits_individual_non_dep_deduction: 400
      sharer:
        age: 28
        is_claimant_or_partner: true
    benunits:
      head_family:
        members: [head, son]
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
    households:
      home:
        members: [head, son, sharer]
        rent: 18_000
        tenure_type: RENT_PRIVATELY
  output:
    # UC: the son is the head's non-dependant and already counted in the
    # head's claim, so not the sharer's (Sch 4 para 9(2)(f)). The sharer is a
    # specified renter: A. Head: 1 + son = 2: C.
    universal_credit_renter_has_non_dependant: [true, false]
    is_lha_shared_accommodation_rate_specified_renter: [false, true]
    LHA_category: [C, A]
    # HB: housing_benefit_has_non_dependant counts a non-dependant within a
    # joint occupier's own benefit unit for that occupier only; the
    # non_dependant_normally_resides_with input covers other families'
    # non-dependants, not his. The size criteria agree: 2 bedrooms for the
    # head (C), 1 for the sharer. The model presumes that a family liable for
    # a share of the rent lacks exclusive use of self-contained accommodation
    # (housing_benefit_shares_accommodation), so with 1 bedroom the sharer
    # gets A under 13D(2)(a)(ii) whether or not the son resides with them.
    # 13D(2)(a)(i) gives A too: the sharer, a single claimant under 35, is a
    # young individual with no non-dependant residing with them. The next
    # case rebuts the presumption, so that (a)(i) alone decides.
    housing_benefit_shares_accommodation: [true, true]
    housing_benefit_LHA_allowed_bedrooms: [2, 1]
    housing_benefit_has_non_dependant: [true, false]
    is_housing_benefit_young_individual: [false, true]
    housing_benefit_LHA_category: [C, A]
    # The deduction formula instead treats him as every joint occupier's and
    # apportions his deduction by the shares of the rent (reg 74(5)): half
    # of 400 each. Reg 3(1) and (4) give one residence test for both, so
    # this split is an open question (whether he normally resides with the
    # sharer is a question of fact the model has no input for).
    housing_benefit_non_dep_deductions: [200, 200]

- name: A joint tenant with exclusive use gets the HB shared rate only because the other tenant's adult son is not their non-dependant
  period: 2026
  input:
    people:
      head:
        age: 45
        is_household_head: true
        is_claimant_or_partner: true
      son:
        age: 22
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
      sharer:
        age: 28
        is_claimant_or_partner: true
    benunits:
      head_family:
        members: [head, son]
        # As the presumption gives: an input for one family replaces the
        # formula for every family.
        housing_benefit_shares_accommodation: true
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
        # The presumption rebutted: the sharer has, for example, an
        # exclusive bedroom and sitting room (13D(2)(b)(i)).
        housing_benefit_shares_accommodation: false
    households:
      home:
        members: [head, son, sharer]
        rent: 18_000
        tenure_type: RENT_PRIVATELY
  output:
    # 13D(2)(a)(ii) cannot apply, since (b)(i) is met. The sharer gets A only
    # under (a)(i): a young individual with no non-dependant residing with
    # them, which holds because the model counts the son for his own family
    # only (as the previous case). Were he the sharer's non-dependant too,
    # (a)(i) would fail and the sharer would get the one-bedroom rate (B)
    # under (b), or C if the size criteria counted him.
    housing_benefit_shares_accommodation: [true, false]
    housing_benefit_LHA_allowed_bedrooms: [2, 1]
    housing_benefit_has_non_dependant: [true, false]
    is_housing_benefit_young_individual: [false, true]
    housing_benefit_LHA_category: [C, A]

- name: A lodger's adult son is the householder's HB non-dependant but counts in the lodger's UC claim
  period: 2026
  input:
    people:
      householder:
        age: 30
        is_household_head: true
        is_claimant_or_partner: true
      lodger:
        age: 35
        is_claimant_or_partner: true
        rent_paid_as_lodger: 5_200
      lodger_son:
        age: 22
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
    benunits:
      householder_family:
        members: [householder]
      lodger_family:
        members: [lodger, lodger_son]
    households:
      home:
        members: [householder, lodger, lodger_son]
        rent: 9_000
        tenure_type: RENT_PRIVATELY
  output:
    # UC: the lodger is liable on a commercial basis (Sch 4 para 9(2)(d));
    # the son is a non-dependant in the lodger's claim, so not the
    # householder's (para 9(2)(f)). The householder is a specified renter: A.
    universal_credit_renter_has_non_dependant: [false, true]
    is_lha_shared_accommodation_rate_specified_renter: [true, false]
    # HB: reg 3(2)(e)(i) excludes only the lodger, who pays the householder,
    # so the son resides with the householder as a non-dependant (reg 3(1),
    # (4)), and with the lodger as a member of their benefit unit outside
    # their family. The householder is a young individual, but not one with
    # no non-dependant (13D(2)(a)(i)).
    housing_benefit_has_non_dependant: [true, true]
    is_housing_benefit_young_individual: [true, false]

- name: A lodger's adult son who pays the householder himself is no one's non-dependant
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 30
        is_household_head: true
        is_claimant_or_partner: true
      lodger:
        age: 25
        is_claimant_or_partner: true
        rent_paid_as_lodger: 4_000
      lodger_son:
        age: 22
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        rent_paid_as_lodger: 2_000
        employment_income: 20_000
    benunits:
      householder_family:
        members: [householder]
      lodger_family:
        members: [lodger, lodger_son]
    households:
      home:
        members: [householder, lodger, lodger_son]
        rent: 9_000
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # Unlike the previous case, the son pays the householder for his own
    # room. The model takes the payment to be commercial
    # (pays_rent_to_householder); a non-commercial one would keep him a
    # non-dependant (HB reg 3(3) with reg 9).
    pays_rent_to_householder: [false, true, true]
    is_benefit_unit_non_dependant_for_universal_credit: [false, false, false]
    is_benefit_unit_non_dependant_for_legacy_benefits: [false, false, false]
    # UC: he is liable on a commercial basis for his occupation, "whether to
    # the renter, joint renters or another person" (Sch 4 para 9(2)(d)), so
    # he is neither the lodger's nor the householder's non-dependant. Both
    # are specified renters: A.
    universal_credit_renter_has_non_dependant: [false, false]
    is_lha_shared_accommodation_rate_specified_renter: [true, true]
    LHA_category: [A, A]
    # HB: he pays the householder (reg 3(2)(e)(i)), and he and the lodger are
    # each separately liable to the landlord, so he does not reside with the
    # lodger (reg 3(4)). Both are young individuals with no non-dependant:
    # A (13D(2)(a)(i)).
    housing_benefit_has_non_dependant: [false, false]
    is_housing_benefit_young_individual: [true, true]
    housing_benefit_LHA_category: [A, A]
    # The deductions already left him out.
    uc_non_dep_deductions: [0, 0]
    housing_benefit_non_dep_deductions: [0, 0]

- name: A household head in the claimant's benefit unit is not the claimant's non-dependant
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 25
        is_claimant_or_partner: true
      head:
        age: 40
        is_household_head: true
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        employment_income: 20_000
    benunits:
      family:
        members: [claimant, head]
    households:
      home:
        members: [claimant, head]
        rent: 9_000
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # The inputs can put the household head, the householder in whose name
    # the home is rented, in a benefit unit whose claimant is someone else.
    # The model takes the head to be liable for the dwelling. UC: liable for
    # their own occupation (Sch 4 para 9(2)(d)), and the person the
    # claimant's liability is owed to where the claimant pays them (para
    # 9(2)(e)). HB: liable with the claimant (reg 3(2)(d)) or the person the
    # claimant pays (reg 3(2)(e)(ii)). Either way not a non-dependant, so the
    # claimant, single and under 35, gets A under both schemes.
    is_resolved_household_head: [false, true]
    is_benefit_unit_non_dependant_for_universal_credit: [false, false]
    is_benefit_unit_non_dependant_for_legacy_benefits: [false, false]
    universal_credit_renter_has_non_dependant: false
    is_lha_shared_accommodation_rate_specified_renter: true
    LHA_category: A
    housing_benefit_has_non_dependant: false
    is_housing_benefit_young_individual: true
    housing_benefit_LHA_category: A
    uc_non_dep_deductions: 0
    housing_benefit_non_dep_deductions: 0

- name: A lodger on attendance allowance whose adult son pays the householder keeps the severe disability premium
  period: 2026
  input:
    people:
      householder:
        age: 30
        is_household_head: true
        is_claimant_or_partner: true
      lodger:
        age: 25
        is_claimant_or_partner: true
        rent_paid_as_lodger: 4_000
        attendance_allowance: 5_000
      lodger_son:
        age: 22
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        rent_paid_as_lodger: 2_000
        employment_income: 20_000
    benunits:
      householder_family:
        members: [householder]
      lodger_family:
        members: [lodger, lodger_son]
    households:
      home:
        members: [householder, lodger, lodger_son]
        rent: 9_000
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # As the case of the lodger's son who pays the householder, but the
    # lodger receives attendance allowance. The son pays the householder
    # (HB reg 3(2)(e)(i), 3(4)), so he is not a non-dependant aged 18 or
    # over for the severe disability premium either (Sch 3 para
    # 14(2)(a)(ii)). The premium applies, so the shared rate does not
    # (13D(2)(a)): the lodger's category follows the size criteria, C. UC's
    # own exception for attendance allowance (Sch 4 para 29(5)) makes the
    # lodger's UC category B.
    housing_benefit_has_non_dependant: [false, false]
    housing_benefit_severe_disability_premium_applies: [false, true]
    housing_benefit_LHA_category: [A, C]
    is_lha_shared_accommodation_rate_specified_renter: [true, false]
    LHA_category: [A, B]

- name: A claimant on PIP daily living with the household head in their benefit unit keeps the severe disability premium
  period: 2026
  input:
    people:
      claimant:
        age: 25
        is_claimant_or_partner: true
        pip_dl: 5_000
      head:
        age: 40
        is_household_head: true
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        employment_income: 20_000
    benunits:
      family:
        members: [claimant, head]
    households:
      home:
        members: [claimant, head]
        rent: 9_000
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # As the case of the household head in the claimant's benefit unit, but
    # the claimant receives the PIP daily living component. The head is not
    # the claimant's non-dependant (HB reg 3(2)(d) or (e)(ii)), so no
    # non-dependant aged 18 or over resides with the claimant and the
    # severe disability premium applies (Sch 3 para 14). The shared rate
    # does not (13D(2)(a)): HB category C. UC's own exception for the PIP
    # daily living component (Sch 4 para 29(5)) makes the UC category B.
    housing_benefit_has_non_dependant: false
    housing_benefit_severe_disability_premium_applies: true
    housing_benefit_LHA_category: C
    is_lha_shared_accommodation_rate_specified_renter: false
    LHA_category: B

- name: A looked-after 16-year-old school leaver stops a young single HB claimant's shared rate
  period: 2026
  input:
    people:
      claimant:
        age: 30
        is_household_head: true
        is_claimant_or_partner: true
        is_before_first_september_following_16th_birthday: false
      placed:
        age: 16
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        is_looked_after_by_local_authority: true
        is_before_first_september_following_16th_birthday: false
    benunits:
      family:
        members: [claimant, placed]
    households:
      home:
        members: [claimant, placed]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # HB: not a Child Benefit qualifying young person, so neither in the
    # claimant's family nor placed under reg 21(3): a non-dependant (reg 3).
    # The claimant is a young individual with a non-dependant, so not
    # 13D(2)(a)(i); 2 bedrooms (13D(3)(b)): C.
    is_child_or_young_person_placed_with_family: [false, false]
    is_benefit_unit_non_dependant_for_legacy_benefits: [false, true]
    housing_benefit_has_non_dependant: true
    is_housing_benefit_young_individual: true
    housing_benefit_LHA_category: C
    # UC: the renter's foster child (para 9(2)(c)), and the renter meets the
    # foster parent condition (para 29(9A)): not a specified renter.
    is_lha_foster_child: [false, true]
    universal_credit_renter_has_non_dependant: false
    is_lha_shared_accommodation_rate_specified_renter: false
