# Reg 9(1)(a)(ii) came into force on 28 November 2018 (SI 2018/1130 regs 1
# and 3(a)). Before then a third or later child got the element only through
# their own exception under regs 10 to 14. In 2017-18 the individual element
# is 2,780 a child.

- name: Before 28 November 2018 - with two adopted children, a third birth child gets no element
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
      adopted_1:
        age: 6
        date_of_birth: 20110301
        child_limit_adoption_exception: true
      adopted_2:
        age: 4
        date_of_birth: 20130301
        child_limit_adoption_exception: true
      child:
        age: 0
        date_of_birth: 20170501
    benunits:
      benunit:
        members: [parent, adopted_1, adopted_2, child]
        would_claim_uc: false
        claims_all_entitled_benefits: true
  output:
    is_CTC_child_limit_exception: [false, false, false, false]
    is_CTC_child_element_included: [false, true, true, false]
    # 2 x 2,780.
    CTC_child_element: 5_560

- name: From 2019-20 - with two adopted children, the third birth child gets the element (reg 9(1)(a)(ii))
  period: 2019
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 37
      adopted_1:
        age: 8
        date_of_birth: 20110301
        child_limit_adoption_exception: true
      adopted_2:
        age: 6
        date_of_birth: 20130301
        child_limit_adoption_exception: true
      child:
        age: 2
        date_of_birth: 20170501
    benunits:
      benunit:
        members: [parent, adopted_1, adopted_2, child]
        would_claim_uc: false
        claims_all_entitled_benefits: true
  output:
    is_CTC_child_limit_exception: [false, false, false, true]
    is_CTC_child_element_included: [false, true, true, true]
    # 3 x 2,780.
    CTC_child_element: 8_340

# Reg 9(6): children with the same date are ordered so that the element is
# included for as many as possible, whatever the exception and whatever the
# order they are listed in.

- name: Same-day children from different pregnancies, the one with the non-consensual conception exception listed first
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
      child_1:
        age: 6
        date_of_birth: 20180501
      with_exception:
        age: 4
        date_of_birth: 20200701
        child_limit_non_consensual_conception_exception: true
      without_exception:
        age: 4
        date_of_birth: 20200701
    benunits:
      benunit:
        members: [parent, child_1, with_exception, without_exception]
        would_claim_uc: false
        claims_all_entitled_benefits: true
  output:
    ctc_child_limit_position: [-1, 1, 3, 2]
    # 3 x 3,455.
    CTC_child_element: 10_365

- name: Same-day children from different pregnancies, the one with the non-consensual conception exception listed second
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
      child_1:
        age: 6
        date_of_birth: 20180501
      without_exception:
        age: 4
        date_of_birth: 20200701
      with_exception:
        age: 4
        date_of_birth: 20200701
        child_limit_non_consensual_conception_exception: true
    benunits:
      benunit:
        members: [parent, child_1, without_exception, with_exception]
        would_claim_uc: false
        claims_all_entitled_benefits: true
  output:
    ctc_child_limit_position: [-1, 1, 2, 3]
    CTC_child_element: 10_365
