  output:
    tax_credits: 0
- name: Tax credits equal to £26 are paid
  period: 2022
  absolute_error_margin: 0
  input:
    child_tax_credit_pre_minimum: 26
  output:
    tax_credits: 26
# Tax Credits Act 2002 s.9(3A): the child limit applies to a child or qualifying
# young person born on or after 6 April 2017. The 2024 child element is 3,455.
