# Wales: Rent Officers Wales, Local Housing Allowance (LHA) rates from April
# <year>, https://www.gov.wales/local-housing-allowance-lha-rates

- name: Carmarthenshire one and two bedrooms, April 2024, rising with size
  # The list-of-rents model gave the two-bedroom rate below the one-bedroom.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
      person_2:
        age: 40
    benunits:
      benunit:
        members: [person]
        LHA_category: B
        benunit_rent: 100_000
      benunit_2:
        members: [person_2]
        LHA_category: C
        benunit_rent: 100_000
    households:
      household:
        members: [person, person_2]
        brma: CARMARTHENSHIRE
  output:
    # GBP 92.05 and GBP 112.50 a week; UC GBP 400.00 and GBP 488.84 a month.
    BRMA_LHA_rate: [4_786.60, 5_850]
    uc_LHA_cap: [4_800, 5_866.08]

