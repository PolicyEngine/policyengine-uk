# LHA rates against the published determinations. Housing Benefit rates are
# weekly (BRMA_LHA_rate annualises over 52 weeks); Universal Credit rates are
# monthly (uc_LHA_cap annualises over 12 months, below a rent that exceeds it).
# England: VOA, Local Housing Allowance (LHA) rates applicable from April <year>,
# https://www.gov.uk/government/collections/local-housing-allowance-lha-rates
# Universal Credit: DWP, Universal Credit Local Housing Allowance rates,
# https://www.gov.uk/government/collections/universal-credit-local-housing-allowance-rates

- name: Maidstone shared accommodation, April 2024 (GBP 102.37 a week)
  period: 2024
  absolute_error_margin: 0.01
  input:
    brma: MAIDSTONE
    LHA_category: A
  output:
    BRMA_LHA_rate: 5_323.24

