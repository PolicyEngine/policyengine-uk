# Bedrooms for children and couples who cannot share a bedroom because of
# disability in the LHA size criteria.
#
# Universal Credit (UC Regs 2013 Sch 4 para 12): the disabled child condition
# (12(6)) is met where the renter, or another member of their extended
# benefit unit, is responsible for a child who would otherwise be expected to
# share a bedroom, receives the DLA (or CDP) care component at the middle or
# highest rate, and is not reasonably able to share a room with another child
# because of their disability. The renter then has as many additional
# bedrooms as are necessary for each such child to have their own (12(8)).
# The disabled person condition (12(6A)) is met where the renter would
# otherwise share a bedroom with a joint renter, receives a qualifying
# disability benefit and cannot reasonably share with the joint renter; it
# gives one additional bedroom (12(9)(d)). From 4 December 2013 (children)
# and 1 April 2017 (couples); attendance allowance counted only at the
# higher rate until 27 January 2025 (SI 2025/3).
#
# Housing Benefit (HB Regs 2006 and HB (SPC) Regs 2006 reg 13D(3)): the
# categories are, in order, (za) a member of a couple who cannot share a
# bedroom, (zb) a member of a couple who can share a bedroom (the partner of
# one who cannot), (a) a couple, (b) a person who is not a child, (ba) a child
# who cannot share a bedroom, (c) two children of the same sex, (d) two
# children under 10, (e) a child; "but the claimant is only entitled to a
# bedroom in respect of a child who cannot share a bedroom or a member of a
# couple who cannot share a bedroom if there is a bedroom in the dwelling
# occupied as the home that is additional to those to which the claimant
# would be entitled if the child or the member of the couple were able to
# share a bedroom" (as amended by SI 2017/213 regs 4(4) and 5(3)).
# Definitions in reg 2(1). The model reads the dwelling's bedrooms from
# num_bedrooms and assumes the bedroom exists where that is not reported (0).
#
# Examples from the DWP Advice for Decision Making chapter F3 (F3135-F3138)
# and HB circular A21/2013 Annex 2. The cannot-share judgement is the input
# cannot_reasonably_share_bedroom_due_to_disability.

- name: ADM F3135 example 1, two disabled sisters who would share each have a room
  period: 2026
  input:
    people:
      joanne:
        age: 40
        is_household_head: true
      kevin:
        age: 42
      daughter_10:
        age: 10
        is_male: false
        dla_sc_middle_plus: true
        cannot_reasonably_share_bedroom_due_to_disability: true
      daughter_8:
        age: 8
        is_male: false
        dla_sc_middle_plus: true
        cannot_reasonably_share_bedroom_due_to_disability: true
      son_13:
        age: 13
        is_male: true
    benunits:
      family:
        members: [joanne, kevin, daughter_10, daughter_8, son_13]
    households:
      home:
        members: [joanne, kevin, daughter_10, daughter_8, son_13]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_child_who_cannot_share_bedroom: [false, false, true, true, false]
    # The couple, the son and the two girls who would otherwise share: the
    # girls each have their own room, one additional bedroom (para 12(8)).
    LHA_cannot_share_bedrooms: 1
    LHA_additional_bedrooms: 1
    LHA_allowed_bedrooms: 4
    LHA_category: E
    # HB reg 13D(3)(ba): each girl is a child who cannot share.
    housing_benefit_LHA_cannot_share_bedrooms: 1
    housing_benefit_LHA_allowed_bedrooms: 4

