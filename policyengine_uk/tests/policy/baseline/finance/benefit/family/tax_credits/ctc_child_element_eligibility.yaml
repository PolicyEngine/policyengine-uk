        weekly_hours: 10
        child_tax_credit_reported: 1000
      person2:
        age: 4
        date_of_birth: 20200101
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: ["person1", "person2"]
        would_claim_uc: false
  output:
    is_CTC_eligible: true
    CTC_child_element: 3455
    CTC_family_element: 0
    child_tax_credit: 3455
    working_tax_credit: 0
    tax_credits: 3455

