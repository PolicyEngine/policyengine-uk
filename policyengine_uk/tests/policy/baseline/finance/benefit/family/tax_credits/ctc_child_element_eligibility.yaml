- name: "Case 9, an ineligible CTC preference does not reduce Housing Benefit or Welsh Council Tax Reduction."
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        is_parent: true
        is_benunit_head: true
        is_claimant_or_partner: true
        employment_income: 4000
        weekly_hours: 10
        child_tax_credit_reported: 0
        housing_benefit_reported: 1000
      person2:
        age: 4
        date_of_birth: 20200101
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: ["person1", "person2"]
        would_claim_uc: false
        would_claim_CTC: true
        would_claim_housing_benefit: true
        would_claim_council_tax_reduction: true
        would_claim_child_benefit: false
    households:
      household:
        members: ["person1", "person2"]
        region: "WALES"
        tenure_type: "RENT_FROM_COUNCIL"
        rent: 5200
        council_tax: 1000
        savings: 0
  output:
    housing_benefit: 5200
    council_tax_reduction: 1000
    child_tax_credit: 0
    working_tax_credit: 0
    tax_credits: 0

