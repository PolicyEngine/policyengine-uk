- name: Another member's own ESA leaves a non-dependant couple banded on their own income
  # The claimant works 35 hours on £13,000 a year, £250 a week; the partner
  # has no income. A couple is banded on its joint income, which counts the
  # claimant's and partner's income-related ESA (reg 74(4)), here nil. The
  # other member's £8,000 award is their own: counting it would add £153.85
  # a week and move the claimant from the £183 band (£45.15) to the £348 band
  # (£101.35). The partner and the other member, outside remunerative work,
  # pay the lowest amount, £19.65 a week.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      applicant:
        age: 70
        housing_benefit_individual_non_dep_deduction_eligible: false
      claimant:
        age: 30
        is_claimant_or_partner: true
        current_education: NOT_IN_EDUCATION
        weekly_hours: 35
        housing_benefit_non_dep_gross_income: 13_000
        housing_benefit_individual_non_dep_deduction_eligible: true
      partner:
        age: 30
        is_claimant_or_partner: true
        current_education: NOT_IN_EDUCATION
        weekly_hours: 0
        housing_benefit_non_dep_gross_income: 0
        housing_benefit_individual_non_dep_deduction_eligible: true
      other:
        age: 40
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        weekly_hours: 0
        housing_benefit_non_dep_gross_income: 0
        housing_benefit_individual_non_dep_deduction_eligible: true
        esa_income_reported: 8_000
    benunits:
      applicant_unit:
        members: [applicant]
      non_dependant_unit:
        members: [claimant, partner, other]
        would_claim_uc: false
        child_benefit: 0
        child_tax_credit: 0
        working_tax_credit: 0
    households:
      household:
        members: [applicant, claimant, partner, other]
        country: ENGLAND
        local_authority: MAIDSTONE
        savings: 0
  output:
    esa_income: [0, 8_000]
    claimant_or_partner_esa_income: [0, 0]
    # 45.15 x 52 = 2,347.80; 19.65 x 52 = 1,021.80.
    household_benefits_individual_non_dep_deduction: [0, 2_347.80, 1_021.80, 1_021.80]
