- name: A claimant whose own ESA falls below tariff income is not on it when another member's award is paid
  # Savings of £10,000 give tariff income of ceil(4,000 / 250) = 16 x £1 a
  # week, £832 a year. The claimant's £500 report leaves no award; the other
  # member's own claim pays £5,000 - £832 = £4,168.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      applicant:
        age: 70
      claimant:
        age: 22
        is_claimant_or_partner: true
        current_education: NOT_IN_EDUCATION
        weekly_hours: 0
        esa_income_reported: 500
      other:
        age: 23
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        weekly_hours: 0
        esa_income_reported: 5_000
    benunits:
      applicant_unit:
        members: [applicant]
      non_dependant_unit:
        members: [claimant, other]
        would_claim_uc: false
    households:
      household:
        members: [applicant, claimant, other]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 10_000
  output:
    esa_income_tariff_income: [0, 832]
    claimant_or_partner_esa_income: [0, 0]
    esa_income: [0, 4_168]
    is_on_income_related_esa: [false, false, true]
    council_tax_reduction_non_dep_deduction_exempt: [false, false, true]
    council_tax_reduction_individual_non_dep_deduction: [0, 260, 0]
    council_tax_reduction_non_dep_deductions: [260, 0]

