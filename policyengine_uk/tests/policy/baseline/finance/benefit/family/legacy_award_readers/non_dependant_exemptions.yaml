# Non-dependant exemptions and the "not in remunerative work" test for a
# non-dependant on a legacy income-related award. No deduction is made for a
# non-dependant aged under 25 who is on Income Support or income-based JSA
# (HB Regs 2006 reg 74(8)(a); SI 2006/214 reg 55(8)(a)), or, under the
# national council tax reduction schemes, for one of any age on Income
# Support, income-based JSA or income-related ESA (SI 2012/2885 Sch 1 para
# 8(8)(a); SSI 2012/319 reg 48; SSI 2021/249 reg 90; WSI 2013/3029 Sch 1
# para 3 and Sch 6 para 5). A person on one of them is not in remunerative
# work (HB Regs 2006 reg 6(6); SI 2006/214 reg 6(6)).
#
# A person is on income-based JSA or income-related ESA on a day the
# allowance "is payable to him", and on Income Support when "in receipt of"
# it (HB Regs 2006 reg 2(1), (3) and (3A); the council tax reduction schemes
# use the same definitions). "other" is a member of the non-dependant's
# benefit unit who is neither its claimant, a partner nor a child or young
# person they are responsible for, so an award they report is their own
# claim, payable to them: it makes them exempt and leaves the claimant
# deducted. A claimant whose own report falls below the tariff income on the
# capital has no award, so is on none, whatever another member receives.
#
# Every case runs in 2025-26, when Income Support, income-based JSA and
# income-related ESA are in payment for the whole year. The applicant is the
# 70-year-old household head, so England's pensioner scheme deducts for the
# non-dependants at its 2025-26 rates (SI 2025/39): £5.00 a week (£260 a
# year) for a non-dependant outside remunerative work. Housing Benefit's
# 2025-26 scale: £19.65 a week under £183, £45.15 from £183, £62.00 from
# £266 and £101.35 from £348 of normal gross weekly income.

- name: Another member's income-based JSA exempts that member, not the non-dependant claimant
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      applicant:
        age: 70
      claimant:
        age: 22
        is_claimant_or_partner: true
        current_education: NOT_IN_EDUCATION
        weekly_hours: 0
      other:
        age: 23
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        weekly_hours: 0
        jsa_income_reported: 4_000
    benunits:
      applicant_unit:
        members: [applicant]
      non_dependant_unit:
        members: [claimant, other]
        would_claim_uc: false
    households:
      household:
        members: [applicant, claimant, other]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    claimant_or_partner_jsa_income: [0, 0]
    is_on_income_based_jsa: [false, false, true]
    # reg 74(8)(a): the other member is 23 and on income-based JSA.
    housing_benefit_non_dep_deduction_exempt: [false, false, true]
    # Sch 1 para 8(8)(a).
    council_tax_reduction_non_dep_deduction_exempt: [false, false, true]
    # The claimant pays the lowest amount, £5.00 x 52.
    council_tax_reduction_individual_non_dep_deduction: [0, 260, 0]
    council_tax_reduction_non_dep_deductions: [260, 0]

