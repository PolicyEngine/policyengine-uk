        is_claimant_or_partner: true
      child:
        age: 3
      other:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        jsa_income_reported: 8_000
    benunits:
      benunit:
        members: [parent, child, other]
        would_claim_uc: false
        child_benefit: 0
    households:
      household:
        members: [parent, child, other]
        region: WALES
