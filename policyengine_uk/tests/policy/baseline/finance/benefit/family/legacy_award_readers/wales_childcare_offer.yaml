    claimant_or_partner_jsa_income: 0
    wales_childcare_offer_parent_condition: [true, false, false]
    wales_childcare_offer_eligible: true

- name: Wales, the benefit unit's income-related ESA counts towards the lone parent's gross income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 96_000
        is_claimant_or_partner: true
      child:
        age: 3
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
        child_benefit: 0
        esa_income: 8_000
    households:
      household:
        members: [parent, child]
        region: WALES
        country: WALES
  output:
    claimant_or_partner_esa_income: 8_000
    # 96,000 + 8,000 = 104,000 > 100,000
    wales_childcare_offer_parent_condition: [false, false]
    wales_childcare_offer_eligible: false

