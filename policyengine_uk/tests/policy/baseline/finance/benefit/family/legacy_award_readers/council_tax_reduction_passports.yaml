# Working-age council tax reduction passport: the applicant or partner is on
# Income Support, income-based JSA or income-related ESA (CTR (Default Scheme)
# (England) Regs 2012, Schedule; the local schemes follow it). A member who is
# neither the applicant, the partner nor a child or young person they are
# responsible for ("other") claims in their own right.

- name: Another member's income-related ESA does not passport the applicant
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      other:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [claimant, other]
    households:
      household:
        members: [claimant, other]
  output:
    council_tax_reduction_relevant_income_based_benefit: false

- name: The applicant's own income-related ESA passports them
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    council_tax_reduction_relevant_income_based_benefit: true

