# Benefit cap: no cap where "the claimant or the claimant's partner" receives
# ESA with the support component (HB Regs 2006 reg 75F(1)(a)).

- name: Another member's income-related ESA does not exempt the family from the benefit cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      other:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
        esa_includes_support_component: true
    benunits:
      benunit:
        members: [claimant, other]
        working_tax_credit: 0
    households:
      household:
        members: [claimant, other]
  output:
    is_benefit_cap_exempt_health_disability: false

- name: The claimant's own income-related ESA with the support component exempts the family from the benefit cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        esa_income_reported: 5_000
        esa_includes_support_component: true
      other:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
    benunits:
      benunit:
        members: [claimant, other]
        working_tax_credit: 0
    households:
      household:
        members: [claimant, other]
  output:
    is_benefit_cap_exempt_health_disability: true

# Maintenance loans: the "students entitled to benefits" schedule (SI 2011/1986
# reg 71(1)(h)(iii)) follows the special support grant test in reg 61(2)(b),
# which follows HB Regs 2006 reg 56(2)(a): a full-time student "who is a
# person on" income-related ESA, that is, one to whom it "is payable"
# (reg 2(3A)). The model's proxy reads whether income-related ESA is payable
# to the student; a parent's or partner's award does not make the student
# eligible.

- name: A parent's income-related ESA does not put a student on the benefits schedule
  period: 2025
  input:
    people:
      parent:
        age: 50
        is_claimant_or_partner: true
        is_parent: true
        esa_income_reported: 5_000
      student:
        age: 19
        is_claimant_or_partner: false
        current_education: TERTIARY
    benunits:
      benunit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        country: ENGLAND
  output:
    is_child_or_young_person_for_legacy_benefits: [false, false]
    maintenance_loan_entitled_to_benefits: [true, false]

- name: A student's own income-related ESA puts them on the benefits schedule
  period: 2025
  input:
    people:
      parent:
        age: 50
        is_claimant_or_partner: true
        is_parent: true
      student:
        age: 19
        is_claimant_or_partner: false
        current_education: TERTIARY
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        country: ENGLAND
  output:
    maintenance_loan_entitled_to_benefits: [true, true]

- name: A student whose partner is paid income-related ESA is not on the benefits schedule through it
  period: 2025
  input:
    people:
      student:
        age: 22
        is_claimant_or_partner: true
        current_education: TERTIARY
      partner:
        age: 23
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [student, partner]
    households:
      household:
        members: [student, partner]
        country: ENGLAND
  output:
    maintenance_loan_entitled_to_benefits: [false, true]

- name: A student's own ESA report below the tariff income is not paid, whatever another member reports
  period: 2025
  input:
    people:
      parent:
        age: 50
        is_claimant_or_partner: true
        is_parent: false
      student:
        age: 19
        is_claimant_or_partner: false
        current_education: TERTIARY
        esa_income_reported: 200
      other:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 3_000
    benunits:
      benunit:
        members: [parent, student, other]
    households:
      household:
        members: [parent, student, other]
        country: ENGLAND
        savings: 7_000
  output:
    # Savings of £7,000 are £1,000 above £6,000: 4 steps of £250, so tariff
    # income of £4 a week, £208 a year (ESA Regs 2008 reg 118). The student's
    # £200 alone gives no award; the other adult's £3,000 gives £2,792. The
    # benefit unit's award on both reports, £2,992, is household income but
    # does not make the student's report paid.
    esa_income: [2_992]
    claimant_or_partner_esa_income: [0]
    is_on_income_related_esa: [false, false, true]
    maintenance_loan_entitled_to_benefits: [false, false, true]
