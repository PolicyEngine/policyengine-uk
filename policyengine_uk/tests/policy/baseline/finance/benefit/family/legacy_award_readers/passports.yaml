# Targeted childcare (England's two-year-old offer): the child's parent is
# entitled to a qualifying benefit (SI 2014/2147 reg 1(2), "eligible child").
# The other routes (UC, CTC and WTC criteria, Guarantee Credit) are switched
# off with inputs.

- name: Another member's income-related ESA does not qualify the family for targeted childcare
  period: 2025
  input:
    people:
      parent:
        age: 30
        is_claimant_or_partner: true
      child:
        age: 2
      other:
        age: 20
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [parent, child, other]
        guarantee_credit: 0
        meets_universal_credit_criteria_for_targeted_childcare_entitlement: false
        meets_child_tax_credit_criteria_for_targeted_childcare_entitlement: false
