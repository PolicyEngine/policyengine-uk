# Passports that the law ties to the claimant, the partner, the parent or the
# student. "other" is a member who is neither the claimant, the partner nor a
# child or young person they are responsible for, so an award they report is
# their own claim.

# Tax credits: no income test while "the person, or either of the persons"
# claiming is entitled to Income Support, income-based JSA or income-related
# ESA (TCA 2002 s.7(2); SI 2002/2008 reg 4). Otherwise the claimant's earnings
# of £10,000 are the applicable income (the £300 disregard only applies to
# step-one income, of which there is none).

- name: Another member's income-related ESA leaves the tax credit income test in place
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        employment_income: 10_000
      other:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [claimant, other]
    households:
      household:
        members: [claimant, other]
  output:
    tax_credits_applicable_income: 10_000

- name: The claimant's own income-related ESA lifts the tax credit income test
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        employment_income: 10_000
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    tax_credits_applicable_income: 0

- name: Another member's income-based JSA leaves the tax credit income test in place
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        employment_income: 10_000
      other:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        jsa_income_reported: 4_000
    benunits:
      benunit:
        members: [claimant, other]
    households:
      household:
        members: [claimant, other]
  output:
    tax_credits_applicable_income: 10_000

- name: The partner's income-based JSA lifts the tax credit income test
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        employment_income: 10_000
      partner:
        age: 38
        is_claimant_or_partner: true
        jsa_income_reported: 4_000
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    tax_credits_applicable_income: 0

# Scottish Child Payment: the individual responsible for the child has been
# awarded a qualifying benefit (SSI 2020/351 reg 18(e)-(f), regs 9, 12 and 14).
# Responsibility runs through the individual's or partner's Child Benefit,
# Pension Credit or Universal Credit award, or kinship care (reg 12(1)(b)); the
# model takes the responsible individual to be the claimant or partner.
# Universal Credit, tax credits and Pension Credit are entered as 0 so the
# income-related award is the only possible qualifying benefit.

- name: Another member's income-related ESA does not qualify the child for Scottish Child Payment
  period: 2025
  input:
    people:
      parent:
        age: 30
        is_claimant_or_partner: true
      child:
        age: 3
      other:
        age: 20
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [parent, child, other]
        universal_credit: 0
        child_tax_credit: 0
        working_tax_credit: 0
        pension_credit: 0
    households:
      household:
        members: [parent, child, other]
        region: SCOTLAND
  output:
    is_scp_eligible: [false, false, false]

- name: The parent's own income-related ESA qualifies the child for Scottish Child Payment
