# The Secretary of State appointed 1 July 2026 for the abolition of
# income-related ESA (Welfare Reform Act 2012 s.33(1)(b)) to reach every
# remaining old style ESA award in Great Britain (SI 2025/1148 art. 3A(1),
# inserted by SI 2026/409). The Department for Communities appointed 1
# October 2026 in Northern Ireland (Welfare Reform (NI) Order 2015 art.
# 39(1)(b); SR 2025/176 art. 3A(1), inserted by SR 2026/115).
#
# Each model year is the fiscal year from 6 April to 5 April; 2026-27 has 365
# days. A Great Britain award is payable for the 86 days from 6 April to 30
# June 2026 (25 + 31 + 30) and a Northern Ireland award for the 178 days from
# 6 April to 30 September 2026 (25 + 31 + 30 + 31 + 31 + 30). So in 2026-27
# the model pays the annual award times 86/365 = 0.235616 or 178/365 =
# 0.487671, and it pays no unsaved income-related ESA from 2027-28. Under
# art. 3A(1)(b), an award already due to end at the end of a two-week run-on
# ends on that schedule; the annual model pays every award to the general
# date.
#
# When the abolition reaches the claimant's or partner's award, the family
# claims Universal Credit if would_claim_uc_at_legacy_closure (default true),
# and the claim ends the award. From 2027-28 the award has ended and DWP
# moves the family off its legacy benefits (legacy_benefits_closed). Cases
# that test the 2026-27 share set would_claim_uc_at_legacy_closure to false.
# DWP's move ends the family's Housing Benefit, and so does a Universal
# Credit claim, except for specified or temporary accommodation (SI
# 2014/1230 regs 8(3) and 46(2)), whose rent Universal Credit leaves out.
#
# Under art. 3A(2), an award saved for an appointee stays payable
# (esa_income_appointee_saving).
# A saving for either member who reports a couple's award keeps the whole
# award. Art. 3A(3): a Universal Credit claim still ends a saved award. A
# contributory allowance continues as new style ESA (esa_contrib).
#
# Unless a case says otherwise, nobody has capital, so there is no tariff
# income and the annual award is the reported amount.

- name: Great Britain 2025-26, before the abolition, pays the whole award
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
    households:
      household:
        members: [claimant]
        region: LONDON
  output:
    esa_income_payable_share: 1
    esa_income_report_closed: false
    esa_income: 5_000
    claimant_or_partner_esa_income: 5_000
    is_on_income_related_esa: true

- name: Great Britain 2026-27 pays the award until 30 June 2026 (86 of 365 days)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
    households:
      household:
        members: [claimant]
        region: LONDON
  output:
    # The family does not claim Universal Credit when the abolition reaches
    # its award, so it keeps the award to 30 June 2026.
    esa_income_abolition_reached: true
    claims_uc_at_legacy_closure: false
    esa_income_payable_share: 0.235616
    esa_income_report_closed: false
    esa_income_eligible: true
    # 5,000 x 86 / 365 = 1,178.08
    esa_income: 1_178.08
    claimant_or_partner_esa_income: 1_178.08
    is_on_income_related_esa: true

- name: Great Britain 2027-28 pays no income-related ESA
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
    households:
      household:
        members: [claimant]
        region: LONDON
  output:
    # The award has ended, so DWP has moved the family off its legacy
    # benefits.
    legacy_benefits_closed: true
    esa_income_payable_share: 0
    esa_income_report_closed: true
    esa_income_eligible: false
    esa_income: 0
    claimant_or_partner_esa_income: 0
    is_on_income_related_esa: false
    # The family does not claim Universal Credit, so nothing replaces it.
    claims_universal_credit: false
    universal_credit: 0

