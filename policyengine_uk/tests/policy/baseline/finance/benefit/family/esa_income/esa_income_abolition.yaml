- name: Great Britain 2026-27, a family in specified or temporary accommodation that claims Universal Credit keeps its Housing Benefit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
        housing_benefit_reported: 5_200
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [claimant]
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 5_200
  output:
    # The family claims on its award's appointed day. The claim doesn't
    # terminate Housing Benefit for specified or temporary accommodation
    # (SI 2014/1230 reg 8(3)). The Secretary of State excludes this rent
    # from rent payments (UC Regs 2013 Sch 1 paras 3(h) and (i)), so the
    # housing costs element is nil and Universal Credit pays the standard allowance alone:
    # 12 x £424.90 = £5,098.80. Universal Credit passports the Housing
    # Benefit means test, which pays the whole £5,200 rent.
    claims_universal_credit: true
    housing_benefit_eligible: true
    housing_benefit: 5_200
    uc_housing_costs_element: 0
    universal_credit: 5_098.80

- name: Great Britain 2026-27, a London tenant in temporary accommodation the abolition moves to Universal Credit keeps Housing Benefit for £30,000 of rent
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
        housing_benefit_reported: 30_000
        # The work-related activity group: no support component.
        esa_includes_support_component: false
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [claimant]
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 30_000
        council_tax: 1_500
  output:
    # The abolition reaches the unsaved award (SI 2025/1148 art. 3A) and the
    # family claims Universal Credit, which ends the income-related ESA
    # award. Housing Benefit for council-arranged homelessness accommodation
    # survives the claim (SI 2014/1230 reg 8(3)), and Universal Credit
    # leaves that rent out (UC Regs 2013 Sch 1 paras 3(i) and 3B).
    # Universal Credit: the standard allowance alone, 12 x £424.90 =
    # £5,098.80. DWP counts Housing Benefit as nil in the Universal Credit
    # cap (UC Regs 2013 reg 80(2A)): £5,098.80 falls below London's £16,967 single
    # cap, so no reduction. Housing Benefit: Universal Credit passports the
    # means test, so it pays the whole £30,000 rent, and the Housing Benefit
    # cap doesn't apply to a claimant receiving Universal Credit (HB Regs
    # 2006 reg 75F(1)(g)).
    # Household net income: £30,000 + £5,098.80 + £100 Household Energy
    # Payment (band A to D in England, 2026-27) - £180 TV licence - £1,500
    # council tax = £33,518.80.
    esa_income_abolition_reached: true
    claims_universal_credit: true
    esa_income: 0
    housing_benefit_eligible: true
    housing_benefit: 30_000
    uc_housing_costs_element: 0
    uc_benefit_cap_reduction: 0
    housing_benefit_benefit_cap_reduction: 0
    universal_credit: 5_098.80
    household_net_income: 33_518.80

