      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [claimant]
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 30_000
        council_tax: 1_500
  output:
    # The family reports income-related ESA, so claims_all_entitled_benefits
    # is false, but the accommodation status makes it claim Housing Benefit
    # (would_claim_housing_benefit): Universal Credit leaves the rent out.
    # The figures match the tenant who reports Housing Benefit: Universal
    # Credit £5,098.80, Housing Benefit £30,000, and household net income
    # £30,000 + £5,098.80 + £100 - £180 - £1,500 = £33,518.80.
    claims_all_entitled_benefits: false
    would_claim_housing_benefit: true
    claims_universal_credit: true
    housing_benefit_eligible: true
    housing_benefit: 30_000
    uc_housing_costs_element: 0
    universal_credit: 5_098.80
    household_net_income: 33_518.80

- name: Great Britain 2026-27, the same London tenant outside that accommodation gets capped Universal Credit and no Housing Benefit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
        housing_benefit_reported: 30_000
        esa_includes_support_component: false
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [claimant]
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 30_000
        council_tax: 1_500
  output:
    # The claim ends Housing Benefit after its run-on (SI 2014/1230 reg
    # 8(2A)). Universal Credit before the cap: £5,098.80 standard allowance
    # + £30,000 social rent = £35,098.80. DWP reduces it by the excess
    # over London's £16,967 single cap: £35,098.80 - £16,967 = £18,131.80,
    # leaving £16,967. Household net income: £16,967 + £100 - £180 - £1,500
    # = £15,387.
    claims_universal_credit: true
    housing_benefit_eligible: false
    housing_benefit: 0
    uc_housing_costs_element: 30_000
    uc_benefit_cap_reduction: 18_131.80
    universal_credit: 16_967
    household_net_income: 15_387

- name: Great Britain 2026-27, DWP caps Universal Credit and leaves temporary accommodation Housing Benefit whole
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 35
        esa_income_reported: 5_000
        housing_benefit_reported: 15_000
        esa_includes_support_component: false
      child_1:
        age: 10
      child_2:
        age: 8
      child_3:
        age: 6
      child_4:
        age: 4
    benunits:
      benunit:
        members: [claimant, child_1, child_2, child_3, child_4]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [claimant, child_1, child_2, child_3, child_4]
        region: NORTH_WEST
        tenure_type: RENT_FROM_COUNCIL
        rent: 15_000
  output:
    # The lone parent claims when the abolition reaches the award. Universal
    # Credit before the cap: the £5,098.80 standard allowance, and child
    # elements of 12 x (£351.88 for the eldest, born before 6 April 2017, +
    # 3 x £303.94) = £15,164.40, with no housing costs element (UC Regs 2013
    # Sch 1 paras 3(i) and 3B): £20,263.20. Child Benefit: (£27.05 + 3 x
    # £17.90) x 52 = £4,199.00. DWP counts Housing Benefit as nil in the
    # Universal Credit cap (reg 80(2A)), so the welfare benefits come to £20,263.20
    # + £4,199.00 = £24,462.20, which exceeds the £22,020 cap outside London
    # for a lone parent by £2,442.20. Universal Credit: £20,263.20 -
    # £2,442.20 = £17,821.00. Housing Benefit pays the whole £15,000 rent,
    # passported by Universal Credit, and its own cap doesn't apply (HB Regs
    # 2006 reg 75F(1)(g)). benefit_cap_welfare_benefits counts Housing
    # Benefit at its amount before the cap: £24,462.20 + £15,000 =
    # £39,462.20.
    claims_universal_credit: true
    uc_housing_costs_element: 0
    universal_credit_pre_benefit_cap: 20_263.20
    child_benefit: 4_199
    benefit_cap_welfare_benefits: 39_462.20
    uc_benefit_cap_reduction: 2_442.20
    universal_credit: 17_821
    is_housing_benefit_benefit_cap_exempt_specified_benefit: true
    housing_benefit_benefit_cap_reduction: 0
    housing_benefit: 15_000

