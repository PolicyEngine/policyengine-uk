    # SI 2014/1230 reg 8(2B). The award still ends.
    esa_income_abolition_reached: false
    legacy_benefits_closed: false
    claims_uc_at_legacy_closure: false
    esa_income_report_closed: true
    esa_income: 0

- name: A protected mixed-age couple that claims when the abolition reaches its award leaves the pension-age route
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        esa_income_reported: 5_000
      partner:
        age: 70
        is_claimant_or_partner: true
        housing_benefit_reported: 4_000
    benunits:
      benunit:
