        region: NORTHERN_IRELAND
  output:
    esa_income_payable_share: 0.487671
    esa_income_report_closed: false
    # 5,000 x 178 / 365 = 2,438.36
    esa_income: 2_438.36
    claimant_or_partner_esa_income: 2_438.36
    is_on_income_related_esa: true

