- name: The 2026-27 share applies to the award after tariff income
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
    households:
      household:
        members: [claimant]
        region: LONDON
        savings: 7_000
  output:
    # ESA Regs 2008 reg 118: £1 a week for each £250 of capital above £6,000,
    # so £7,000 gives £4 a week, 4 x 52 = £208 a year. The award is
    # (5,000 - 208) x 86 / 365 = 4,792 x 86 / 365 = 1,129.07.
    esa_income_tariff_income: 208
    esa_income: 1_129.07

