- name: In 2015-16 a profit equal to the small profits threshold pays Class 2
  period: 2015
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
        hours_worked: 780
        self_employment_income: 5_965
        personal_pension_contributions: 1_000
    benunits:
