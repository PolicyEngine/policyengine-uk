# The Income Support gate reads the screened award (s.124(1)(h)).

- name: A partner's ESA lost to remunerative work no longer bars Income Support
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      carer:
        age: 40
        is_claimant_or_partner: true
        receives_carer_benefit: true
        income_support_reported: 1_000
      partner:
        age: 40
        is_claimant_or_partner: true
        esa_income_reported: 3_000
        # 20 hours a week for £100 a week: remunerative work for the ESA
        # claimant, but under the Income Support partner's 24 hours.
        hours_worked: 1_040
        employment_income: 5_200
    benunits:
      couple:
        members: [carer, partner]
        income_support_assessable_capital: 0
    households:
      household:
        members: [carer, partner]
  output:
    esa_income_eligible: false
    esa_income: 0
    # Without the work test the partner's award would count as income-related
    # ESA of the other member of the couple and bar the claim.
    income_support_eligible: true
