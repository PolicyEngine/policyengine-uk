# Reg 99(3) with the dated SSCBA 1992 amounts. 2023-24 (s.11 and s.15 as at
# 6 April 2023): Class 2 of £3.45 a week only on profits over the £12,570
# lower profits threshold, Class 4 at 9% from £12,570; the higher limit is
# £167. 2015-16 (s.11 as at 6 April 2015): Class 2 of £2.80 a week on
# profits of, or over, the £5,965 small profits threshold, Class 4 at 9% from
# £8,060; the personal allowance is £10,600 and the higher limit £104.

- name: In 2023-24 no Class 2 or Class 4 is due below the lower profits threshold
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
        hours_worked: 780
        self_employment_income: 12_500
        personal_pension_contributions: 7_300
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # No notional tax (under £12,570), Class 4 or Class 2. Half the premium,
    # £3,650. (£12,500 - £3,650) / 52 = £170.19, over £167.
    esa_exempt_work_earnings: 170.19
    esa_income_claimant_remunerative_work: true
    esa_income_eligible: false
    esa_income: 0

- name: In 2023-24 a profit equal to the lower profits threshold pays no Class 2
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
        hours_worked: 780
        self_employment_income: 12_570
        personal_pension_contributions: 7_600
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # Class 2 is due only on profits that exceed £12,570. Half the premium,
    # £3,800. (£12,570 - £3,800) / 52 = £168.65, over £167. Deducting Class 2
    # would give £165.20.
    esa_exempt_work_earnings: 168.65
    esa_income_claimant_remunerative_work: true
    esa_income_eligible: false
    esa_income: 0

- name: In 2023-24 £1 over the lower profits threshold brings Class 2 in and the work under the limit
  # An intended cliff, not a defect: reg 99(3)(a)'s Class 2 is a fixed weekly
  # amount once profit exceeds the threshold, so £1 more profit than the
  # case above (£168.65, remunerative) lowers net earnings below £167. More
  # pay or profit never helps from 6 April 2024, when Class 2 stops; the
  # monotonicity property tests 2025 and 2026.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
        hours_worked: 780
        self_employment_income: 12_571
        personal_pension_contributions: 7_600
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # Tax 20% x £1 = £0.20. Class 4 9% x £1 = £0.09. Class 2 52 x £3.45 =
    # £179.40. Half the premium, £3,800.
    # (£12,571 - £0.20 - £0.09 - £179.40 - £3,800) / 52 = £165.22, within £167.
    esa_exempt_work_earnings: 165.22
    esa_income_claimant_remunerative_work: false
    esa_income_eligible: true
    esa_income: 5_000

