        statutory_sick_pay: 3_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # £10,300 / 52 = £198.08. Taxing the £13,300 the shared base holds would
    # take £146 of tax and £58.40 of Class 1 and give £194.15.
    esa_exempt_work_earnings: 198.08
    esa_income_claimant_remunerative_work: true
    esa_income_eligible: false
    esa_income: 0

