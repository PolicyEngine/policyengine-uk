- name: Self-employment takes reg 99's notional tax, not the actual tax
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 5_000
        hours_worked: 780
        self_employment_income: 13_200
        personal_pension_contributions: 5_900
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # Reg 99(1): 20% x (£13,200 - £12,570) = £126, whatever relief the
    # pension contributions attract. Reg 99(3)(b): 6% x (£13,200 - £12,570) =
    # £37.80 of Class 4. Half the pension contributions, £2,950.
    # (£13,200 - £126 - £37.80 - £2,950) / 52 = £193.97, within £195.50.
    esa_exempt_work_earnings: 193.97
    esa_income_claimant_remunerative_work: false
    esa_income_eligible: true
    esa_income: 5_000

