- name: Case 19, where working tax credit makes Pension Credit pay only without the award, a couple aged 66 and 58 get Pension Credit and no income-related ESA.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 66
        is_claimant_or_partner: true
        # 20 hours a week.
        employment_income: 10_000
        hours_worked: 1_040
        working_tax_credit_reported: 1
      person2:
        age: 58
        is_claimant_or_partner: true
        esa_income_reported: 3_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
  output:
    # Before 15 May 2019 the 66-year-old can claim Pension Credit for the
    # couple. In 2016-17 the couple minimum guarantee is £237.55 a week,
    # 52 x 237.55 = 12_352.60, and the couple's standard earnings disregard
    # is £10 a week (Sch VI para 5), £20 with the award. The 66-year-old has
    # reached pensionable age, so pays no primary Class 1 contributions
    # (SSCBA 1992 s.6(3)), and 10_000 is under the £11,000 personal
    # allowance, so his earnings count in full.
    # Working tax credit: the basic and couple elements, 1_960 + 2_010 =
    # 3_970 (WTC (Entitlement and Maximum Rate) Regs 2002 Sch 2), which counts
    # as Pension Credit income (SPCA 2002 s.15(1)(b)).
    # B(e): the award lifts the tax credit income test (TCA 2002 s.7(2)), so
    # working tax credit is 3_970, and 10_000 + 3_970 - 1_040 = 12_930, over
    # 12_352.60: nil. Savings credit counts no working tax credit (SPC Regs
    # 2002 reg 9(a)): 10_000 - 1_040 = 8_960, 172.31 a week, under the
    # £212.97 couple threshold: nil.
    # B(0): Pension Credit on 3_970 would be nil too, so it gives no
    # passport. The income test applies: 41% of income over £6,420 comes off,
    # 3_970 - 0.41 x (10_000 - 6_420) = 2_502.20. Then 10_000 + 2_502.20 -
    # 520 = 11_982.20, so 12_352.60 - 11_982.20 = 370.40. B(0) pays, so para
    # 6(1)(d) bars the award, and the couple gets B(0).
    esa_income_eligible: false
    esa_income: 0
    claimant_or_partner_esa_income: 0
    working_tax_credit: 2_502.20
    pension_credit: 370.40

