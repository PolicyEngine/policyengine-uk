# Income-related ESA and pensionable age or State Pension Credit.
# Welfare Reform Act 2007 s.1(3)(c): a claimant who has reached pensionable
# age is not entitled to ESA. Pensionable age is the person's own State
# Pension age (s.1(6); Pensions Act 1995 Sch 4 para 1).
# Sch 1 para 6(1)(c) and (d): the income-related allowance needs that the
# claimant "is not entitled to state pension credit" and "is not a member of a
# couple the other member of which is entitled to ... state pension credit".
# A mixed-age couple is not entitled to State Pension Credit from 15 May 2019
# (State Pension Credit Act 2002 s.4(1A)) unless the SI 2019/37 art 4 saving
# applies. Northern Ireland's Welfare Reform Act (Northern Ireland) 2007 sets
# the same conditions in the same words.
# Everyone here is a legacy claimant (would_claim_uc false), since a Universal
# Credit claim ends the couple's income-related ESA anyway. No case has
# capital, so no tariff income: an award that passes is the 5_000 reported.
# Pension Credit with no income is the guarantee credit's standard minimum
# guarantee for 52 weeks: in 2026-27, £238.00 for a single claimant and
# £363.25 for a couple (SPC Regs 2002 reg 6(1), as amended by the Social
# Security Benefits Up-rating Order 2026, SI 2026/148, art 29(2)), so
# 52 x 238.00 = 12_376 and 52 x 363.25 = 18_889. Nobody here reached
# pensionable age before 6 April 2016, so no savings credit is due.

- name: Case 1, a single claimant aged 70 who reports income-related ESA gets Pension Credit and no ESA.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
    households:
      household:
        members: [person1]
  output:
    # Born in 1956: pensionable age 66 (Pensions Act 1995 Sch 4 para 1 rule 7).
    is_SP_age: true
    # s.1(3)(c) bars the claim: 0, not the 5_000 reported.
    esa_income_eligible: false
    esa_income: 0
    claimant_or_partner_esa_income: 0
    is_on_income_related_esa: false
    # 52 x 238.00.
    pension_credit: 12_376

- name: Case 2, a couple aged 70 and 68 where the 68-year-old reports income-related ESA get Pension Credit and no ESA.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
      person2:
        age: 68
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
  output:
    # Both born after 5 October 1954 and before 6 April 1960: pensionable
    # age 66 (rule 7).
    is_SP_age: [true, true]
    meets_pension_credit_age_conditions: true
    # s.1(3)(c) bars the 68-year-old's claim, and para 6(1)(c) and (d) bar it
    # too.
    esa_income_eligible: false
    esa_income: 0
    claimant_or_partner_esa_income: 0
    is_on_income_related_esa: [false, false]
    # 52 x 363.25.
    pension_credit: 18_889

- name: Case 3, a saved mixed-age couple aged 70 and 60 get Pension Credit and no ESA on the younger member's report.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
      person2:
        age: 60
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
        # SI 2019/37 art 4(1): the couple was entitled to Pension Credit on
        # 14 May 2019 and has been since, so s.4(1A) does not exclude it.
        has_mixed_age_couple_pension_credit_saving: true
    households:
      household:
        members: [person1, person2]
  output:
    # The 60-year-old has not reached pensionable age, so s.1(3)(c) does not
    # bar them.
    is_SP_age: [true, false]
    meets_pension_credit_age_conditions: true
    # Para 6(1)(d): the other member of the couple is entitled to State
    # Pension Credit, so the 60-year-old gets no income-related ESA.
    esa_income_eligible: false
    esa_income: 0
    claimant_or_partner_esa_income: 0
    is_on_income_related_esa: [false, false]
    # 52 x 363.25.
    pension_credit: 18_889

- name: Case 4, the same mixed-age couple without the saving keep income-related ESA and get no Pension Credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
      person2:
        age: 60
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
        has_mixed_age_couple_pension_credit_saving: false
    households:
      household:
        members: [person1, person2]
  output:
    # SPCA 2002 s.4(1A): the 70-year-old is not entitled to Pension Credit
    # while the partner is under the qualifying age.
    meets_pension_credit_age_conditions: false
    pension_credit: 0
    # Neither para 6(1)(d) nor s.1(3)(c) bars the 60-year-old: the 5_000.
    esa_income_eligible: true
    esa_income: 5_000
    claimant_or_partner_esa_income: 5_000
    is_on_income_related_esa: [false, true]

- name: Case 5, a saved mixed-age couple that does not claim Pension Credit keep income-related ESA.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
      person2:
        age: 60
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
        has_mixed_age_couple_pension_credit_saving: true
        would_claim_pc: false
    households:
      household:
        members: [person1, person2]
  output:
    # Entitlement to Pension Credit needs a claim (Social Security
    # Administration Act 1992 s.1), so para 6(1)(d) does not bar the award.
    pension_credit: 0
    esa_income_eligible: true
    esa_income: 5_000
    claimant_or_partner_esa_income: 5_000
    is_on_income_related_esa: [false, true]

- name: Case 6, a single claimant aged 60 keeps income-related ESA.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
    households:
      household:
        members: [person1]
  output:
    is_SP_age: false
    meets_pension_credit_age_conditions: false
    pension_credit: 0
    esa_income_eligible: true
    esa_income: 5_000
    claimant_or_partner_esa_income: 5_000
    is_on_income_related_esa: true

- name: Case 7, a man aged 63 in 2016 over the Pension Credit qualifying age but under pensionable age gets no income-related ESA while he would claim Pension Credit.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 63
        date_of_birth: 19530301
        gender: MALE
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
    households:
      household:
        members: [person1]
  output:
    # Born 1 March 1953, before 6 December 1953: pensionable age 65, on 1
    # March 2018 (Pensions Act 1995 Sch 4 para 1 rule 1), so s.1(3)(c) does
    # not bar him in 2016-17.
    is_SP_age: false
    # The qualifying age for State Pension Credit is a woman's pensionable
    # age for the same date of birth (SPCA 2002 s.1(6)): a woman born from 6
    # February to 5 March 1953 reached it on 6 January 2016 (rule 3, table 1).
    has_attained_state_pension_credit_qualifying_age: true
    meets_pension_credit_age_conditions: true
    # Para 6(1)(c): he is entitled to State Pension Credit.
    esa_income_eligible: false
    esa_income: 0
    is_on_income_related_esa: false

- name: Case 8, the same man in 2016 keeps income-related ESA if he would not claim Pension Credit.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 63
        date_of_birth: 19530301
        gender: MALE
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        would_claim_pc: false
    households:
      household:
        members: [person1]
  output:
    is_SP_age: false
    pension_credit: 0
    esa_income_eligible: true
    esa_income: 5_000
    is_on_income_related_esa: true

- name: Case 9, a woman born on the same day reached pensionable age, so gets no income-related ESA in 2016 even without a Pension Credit claim.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 63
        date_of_birth: 19530301
        gender: FEMALE
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        would_claim_pc: false
    households:
      household:
        members: [person1]
  output:
    # Rule 3, table 1: pensionable age on 6 January 2016.
    is_SP_age: true
    # s.1(3)(c).
    esa_income_eligible: false
    esa_income: 0
    is_on_income_related_esa: false

- name: Case 10, before the mixed-age couple exclusion, a couple aged 70 and 60 that would claim Pension Credit get no ESA on the younger member's report.
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
      person2:
        age: 60
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
  output:
    # SPCA 2002 s.4(1A) came into force on 15 May 2019 (SI 2019/37 art 3), so
    # in 2018-19 the 70-year-old can claim Pension Credit for the couple.
    is_mixed_age_couple: true
    meets_pension_credit_age_conditions: true
    # Para 6(1)(d).
    esa_income_eligible: false
    esa_income: 0
    is_on_income_related_esa: [false, false]

- name: Case 11, a member outside the couple aged 70 who reports income-related ESA gets none.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_claimant_or_partner: true
      person2:
        age: 70
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
  output:
    # They claim in their own right, and s.1(3)(c) bars their claim too.
    esa_income_eligible: false
    esa_income: 0
    claimant_or_partner_esa_income: 0
    is_on_income_related_esa: [false, false]

- name: Case 12, the couple's Pension Credit does not bar a member outside the couple who claims income-related ESA in their own right.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
      person2:
        age: 40
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
  output:
    # The 70-year-old is a single claimant of Pension Credit: 52 x 238.00.
    meets_pension_credit_age_conditions: true
    pension_credit: 12_376
    # The 40-year-old is not a member of the 70-year-old's couple, so para
    # 6(1)(d) does not reach them: their own award of 5_000.
    esa_income_eligible: true
    esa_income: 5_000
    claimant_or_partner_esa_income: 0
    is_on_income_related_esa: [false, true]

- name: Case 13, where both members of a mixed-age couple report income-related ESA, only the one under pensionable age can be its payee.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
        esa_income_reported: 5_000
      person2:
        age: 60
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
        has_mixed_age_couple_pension_credit_saving: false
    households:
      household:
        members: [person1, person2]
  output:
    # The 60-year-old can claim; the model makes the couple's two reports one
    # award of 5_000 + 5_000 = 10_000.
    esa_income_eligible: true
    esa_income: 10_000
    claimant_or_partner_esa_income: 10_000
    # s.1(3)(c): the 70-year-old cannot be the claimant, so the award is not
    # payable to them.
    is_on_income_related_esa: [false, true]
