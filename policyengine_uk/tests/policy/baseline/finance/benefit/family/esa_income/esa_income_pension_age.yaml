# Cases 15 to 19 take one case for each pairing of B(0) and B(e). Each is a
# man aged 63 in 2016, born 1 March 1953: over the qualifying age for State
# Pension Credit (from 6 January 2016) and under his pensionable age (65,
# on 1 March 2018), with support-group income-related ESA. In 2016-17 the
# minimum guarantee is £155.60 a week, 52 x 155.60 = 8_091.20 a year (SPC
# Regs 2002 reg 6(1)(b)), and Pension Credit disregards £5 a week of a single
# claimant's earnings (Sch VI para 5), or £20 a week while the claimant is on
# employment and support allowance (para 4(1)(a)(vii)). Below 65 no savings
# credit is due (SPCA 2002 s.3(1)). His income is below the personal
# allowance (£11,000) and his earnings below the National Insurance primary
# threshold (£155 a week), so neither takes anything off.

- name: Case 15, where Pension Credit pays with or without the award, the man gets Pension Credit worked out without it and no income-related ESA.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 63
        date_of_birth: 19530301
        gender: MALE
        is_claimant_or_partner: true
        esa_income_reported: 6_011.20
        esa_includes_support_component: true
        # £50 a week for 10 hours.
        employment_income: 2_600
        hours_worked: 520
        # £40 a week.
        private_pension_income: 2_080
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
    households:
      household:
        members: [person1]
  output:
    # B(0): income 50 + 40 - 5 = 85 a week, so 155.60 - 85 = 70.60 a week.
    # B(e): 50 + 40 - 20 = 70, so 85.60 a week. B(0) pays, so para 6(1)(c)
    # bars the award and Pension Credit is B(0): 52 x 70.60.
    esa_income_eligible: false
    esa_income: 0
    pension_credit: 3_671.20
    pension_credit_earnings_disregard: 260

