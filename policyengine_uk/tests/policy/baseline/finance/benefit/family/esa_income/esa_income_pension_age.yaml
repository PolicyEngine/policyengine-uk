# Income-related ESA and pensionable age or State Pension Credit.
# Welfare Reform Act 2007 s.1(3)(c): a claimant who has reached pensionable
# age is not entitled to ESA. Pensionable age is the person's own State
# Pension age (s.1(6); Pensions Act 1995 Sch 4 para 1).
# Sch 1 para 6(1)(c) and (d): the income-related allowance needs that the
# claimant "is not entitled to state pension credit" and "is not a member of a
# couple the other member of which is entitled to ... state pension credit".
# The model reads the couple's Pension Credit worked out with no
# income-related ESA in the family, B(0), and bars the couple's claim where it
# pays. B(e) is the Pension Credit the family would get with the award e.
# A mixed-age couple is not entitled to State Pension Credit from 15 May 2019
# (State Pension Credit Act 2002 s.4(1A)) unless the SI 2019/37 art 4 saving
# applies.
# Everyone here is a legacy claimant (would_claim_uc false), since a Universal
# Credit claim ends the couple's income-related ESA anyway. No case has
# capital, so no tariff income: an award that passes is the amount reported.
# Pension Credit with no income is the guarantee credit's standard minimum
# guarantee for 52 weeks: in 2026-27, £238.00 for a single claimant and
# £363.25 for a couple (SPC Regs 2002 reg 6(1), as amended by the Social
# Security Benefits Up-rating Order 2026, SI 2026/148, art 29(2)), so
# 52 x 238.00 = 12_376 and 52 x 363.25 = 18_889. Nobody here in 2026 reached
# pensionable age before 6 April 2016, so no savings credit is due (SPCA 2002
# s.3(1)).

- name: Case 1, a single claimant aged 70 who reports income-related ESA gets Pension Credit and no ESA.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
    households:
      household:
        members: [person1]
  output:
    # Born in 1956: pensionable age 66 (Pensions Act 1995 Sch 4 para 1 rule 6).
    is_SP_age: true
    # s.1(3)(c) bars the claim: 0, not the 5_000 reported.
    esa_income_eligible: false
    esa_income: 0
    claimant_or_partner_esa_income: 0
    is_on_income_related_esa: false
    # 52 x 238.00.
    pension_credit: 12_376

- name: Case 2, a couple aged 70 and 68 where the 68-year-old reports income-related ESA get Pension Credit and no ESA.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_claimant_or_partner: true
      person2:
        age: 68
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
  output:
    # Both born after 5 October 1954 and before 6 April 1960: pensionable
    # age 66 (rule 6).
    is_SP_age: [true, true]
    meets_pension_credit_age_conditions: true
    # s.1(3)(c) bars the 68-year-old's claim, and para 6(1)(c) and (d) bar it
    # too.
    esa_income_eligible: false
    esa_income: 0
    claimant_or_partner_esa_income: 0
    is_on_income_related_esa: [false, false]
    # 52 x 363.25.
    pension_credit: 18_889

- name: Case 3, a saved mixed-age couple aged 73 and 60 get Pension Credit and no ESA on the younger member's report.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 73
        date_of_birth: 19530301
        gender: MALE
        is_claimant_or_partner: true
        # The couple has had Pension Credit since before 15 May 2019.
        pension_credit_reported: 9_000
      person2:
        age: 60
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
  output:
    # SI 2019/37 art 4(1): born 1 March 1953, the older member reached the
    # qualifying age on 6 January 2016 (Pensions Act 1995 Sch 4 para 1 rule 3,
    # table 1, via SPCA 2002 s.1(6)), so the couple could be entitled to
    # Pension Credit on 14 May 2019, and it reports Pension Credit now, so
    # s.4(1A) does not exclude it.
    has_mixed_age_couple_pension_credit_saving: true
    # The 60-year-old has not reached pensionable age, so s.1(3)(c) does not
    # bar them.
    is_SP_age: [true, false]
    meets_pension_credit_age_conditions: true
    # Para 6(1)(d): B(0) = 52 x 363.25 = 18_889 is payable, so the other
    # member of the couple is entitled to State Pension Credit and the
    # 60-year-old gets no income-related ESA.
    esa_income_eligible: false
    esa_income: 0
    claimant_or_partner_esa_income: 0
    is_on_income_related_esa: [false, false]
    # 52 x 363.25. He reached pensionable age at 65 on 1 March 2018 (rule
    # 1), after 6 April 2016, so no savings credit is due (SPCA 2002 s.3(1)).
    pension_credit: 18_889

- name: Case 4, the same mixed-age couple without the saving keep income-related ESA and get no Pension Credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 73
        date_of_birth: 19530301
        gender: MALE
        is_claimant_or_partner: true
      person2:
        age: 60
        is_claimant_or_partner: true
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
  output:
    # Neither member reports Pension Credit or pension-age Housing Benefit,
    # so the couple keeps no saving, and SPCA 2002 s.4(1A) excludes the
    # 73-year-old while the partner is under the qualifying age.
    has_mixed_age_couple_pension_credit_saving: false
    meets_pension_credit_age_conditions: false
    pension_credit: 0
    # Neither para 6(1)(d) nor s.1(3)(c) bars the 60-year-old: the 5_000.
    esa_income_eligible: true
    esa_income: 5_000
    claimant_or_partner_esa_income: 5_000
    is_on_income_related_esa: [false, true]

