        members: [person1]
  output:
    # B(0): 115.50 + 61 - 5 = 171.50 a week, over 155.60. B(e): 115.50 + 61
    # - 20 = 156.50, still over it. Pension Credit refuses him either way, so
    # para 6(1)(c) does not bar the award: 52 x 94.60 = 4_919.20.
    pension_credit: 0
    esa_income_eligible: true
    esa_income: 4_919.20
    is_on_income_related_esa: true

