      household:
        members: [person1]
  output:
    # B(0): 115.50 + 50 - 5 = 160.50 a week, over 155.60, so nil. B(e):
    # 115.50 + 50 - 20 = 145.50, so 155.60 - 145.50 = 10.10 a week. No state
