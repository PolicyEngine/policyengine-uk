# Existing annual-model continuing-award proxy: the parent reports Income Support.
# No eligibility, allowance, assessable income or cash award is forced. The public
# YAML dotted-input route reforms only the new dimensionless withdrawal rate.
# 2024 model controls: 90.50 * 52 = 4,706; lone-parent disregard 20 * 52 = 1,040.
# Pay 6,500 gives assessable income 5,460: default cash 0, half-rate cash 1,976.
# Pay 2,000 gives assessable income 960: default cash 3,746, half-rate cash 4,226.
# These inherited allowance/disregard controls are not a new rates or historical audit.

- name: Default withdrawal exhausts an award above the old income cutoff
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 100
        employment_income: 6500
        hours_worked: 520
      child:
        age: 4
        is_claimant_or_partner: false
    benunits:
      family:
        members:
        - parent
        - child
    households:
      home:
        members:
        - parent
        - child
        region: LONDON
  output:
    income_support: 0
    income_support_applicable_amount: 4706
    income_support_applicable_income: 5460
    income_support_eligible: true
    income_tax:
    - 0
    - 0
    national_insurance:
    - 0
    - 0
    would_claim_IS: true
- name: Default withdrawal preserves cash below the old income cutoff
  period: 2024
