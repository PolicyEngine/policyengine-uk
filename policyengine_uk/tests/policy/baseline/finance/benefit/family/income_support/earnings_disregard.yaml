- name: A single claimant's disregard does not reach spousal maintenance.
  # Para 9: £5 x 52 = £260, capped at £100 of earnings. Maintenance from a
  # former spouse is income other than earnings (reg 40; Sch 9 para 15(3)(a)):
  # £100 + £1,000 - £100 = £1,000. Before the fix: £1,100 - £260 = £840.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        employment_income: 100
        spousal_maintenance_income: 1_000
        social_security_income: 0
    benunits:
      benunit:
        members: [claimant]
        income_support_assessable_capital: 0
    households:
      household:
        members: [claimant]
  output:
    income_support_net_earnings: 100
    income_support_earnings_disregard: 100
    income_support_applicable_income: 1_000

- name: Self-employment profit below the disregard is disregarded, a pension is not.
  # Reg 38(2): £600 of profit, below the personal allowance and the Class 4
  # lower profits limit, is £600 of net profit, so the disregard is £600.
  # £600 + £2,000 pension - £600 = £2,000; £4,786.60 - £2,000 = £2,786.60.
  # Before the fix: £2,600 - £1,040 = £1,560.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 1_000
        hours_worked: 0
        self_employment_income: 600
        private_pension_income: 2_000
        social_security_income: 0
      child:
        age: 1
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [claimant, child]
        would_claim_IS: true
        would_claim_uc: false
        income_support_assessable_capital: 0
    households:
      household:
        members: [claimant, child]
  output:
    national_insurance: [0, 0]
    income_support_net_earnings: 600
    income_support_earnings_disregard: 600
    income_support_applicable_income: 2_000
    income_support: 2_786.60

- name: The annual model approximates earnings tax by their share of income.
  # A single claimant in England with £13,000 of pension and £200 of
  # earnings. Income tax: (£13,200 - £12,570) x 20% = £126. The earnings'
  # share of it is £126 x 200 / 13,200 = £1.9091, and £200 is below the
  # primary threshold, so net earnings are £200 - £1.9091 = £198.0909 and
  # the disregard min(£260, £198.0909) = £198.0909. Income:
  # £13,200 - £126 - £198.0909 = £12,875.9091. Before the fix:
  # £13,074 - £260 = £12,814.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        employment_income: 200
        private_pension_income: 13_000
        social_security_income: 0
    benunits:
      benunit:
        members: [claimant]
        income_support_assessable_capital: 0
    households:
      household:
        members: [claimant]
        region: LONDON
  output:
    income_tax: 126
    national_insurance: 0
    income_support_net_earnings: 198.09
    income_support_earnings_disregard: 198.09
    income_support_applicable_income: 12_875.91

- name: The annual model allocates Class 1 between earnings and statutory pay.
  # This proportional split approximates payroll deductions. A lone parent
  # in England has £500 of earnings and £13,000 of SMP. Class
  # 1 is due on the £13,500 together: (£13,500 - £12,570) x 8% = £74.40, of
  # which the wages' share is £74.40 x 500 / 13,500 = £2.7556. Income tax:
  # (£13,500 - £12,570) x 20% = £186, of which the earnings' share is
  # £186 x 500 / 13,500 = £6.8889. Net earnings: £500 - £6.8889 - £2.7556 =
  # £490.3556, the disregard. Income: £13,500 - £186 - £74.40 - £490.3556 =
  # £12,749.2444. Before the fix: £13,239.60 - £1,040 = £12,199.60.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_parent: true
        is_claimant_or_partner: true
        employment_income: 500
        statutory_maternity_pay: 13_000
        social_security_income: 0
      child:
        age: 1
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [claimant, child]
        income_support_assessable_capital: 0
    households:
      household:
        members: [claimant, child]
        region: LONDON
  output:
    income_tax: [186, 0]
    national_insurance: [74.40, 0]
    income_support_net_earnings: 490.36
    income_support_earnings_disregard: 490.36
    income_support_applicable_income: 12_749.24
