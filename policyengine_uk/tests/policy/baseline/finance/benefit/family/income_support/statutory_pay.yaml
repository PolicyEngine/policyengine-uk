- name: Case 10, statutory pay does not reopen Income Support after closure.
  # 2027 is wholly after 31 March 2026. This avoids assuming that an annual
  # 2026 formula selects the parameter after its 1 April closure boundary.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 1_000
        hours_worked: 0
        employment_income: 1_040
        statutory_sick_pay: 1_000
        social_security_income: 0
      person2:
        age: 3
        is_claimant_or_partner: false
    benunits:
      benunit:
