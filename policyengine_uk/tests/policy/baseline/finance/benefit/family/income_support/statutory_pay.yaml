- name: Case 4, the partner's statutory sick pay counts in the couple's income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        is_claimant_or_partner: true
        employment_income: 520
        social_security_income: 0
      person2:
        age: 32
        is_claimant_or_partner: true
        statutory_sick_pay: 1_000
        social_security_income: 0
    benunits:
      benunit:
        members: [person1, person2]
        income_support_assessable_capital: 0
    households:
      household:
        members: [person1, person2]
  output:
    # Reg 23(1): £520 ordinary earnings - £520 disregard + £1,000 SSP.
    income_support_applicable_income: 1_000

- name: Case 5, statutory payments add across the claimant and partner.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        is_claimant_or_partner: true
        employment_income: 520
        statutory_sick_pay: 500
        statutory_paternity_pay: 300
        social_security_income: 0
      person2:
        age: 32
        is_claimant_or_partner: true
        statutory_maternity_pay: 700
        social_security_income: 0
    benunits:
      benunit:
        members: [person1, person2]
        income_support_assessable_capital: 0
    households:
      household:
        members: [person1, person2]
  output:
    # £520 - £520 + £500 SSP + £300 SPP + £700 SMP = £1,500.
    income_support_applicable_income: 1_500

- name: Case 6, another adult's statutory pay does not reduce the claimant's award.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 1_000
        hours_worked: 0
        employment_income: 1_040
        statutory_sick_pay: 1_000
        social_security_income: 0
      person2:
        age: 3
        is_claimant_or_partner: false
      person3:
        age: 38
        is_claimant_or_partner: false
        statutory_maternity_pay: 1_500
        income_tax_before_winter_fuel_payment_charge: 300
        national_insurance: 100
        pension_contributions: 200
        social_security_income: 0
    benunits:
      benunit:
        members: [person1, person2, person3]
        would_claim_IS: true
        would_claim_uc: false
        income_support_assessable_capital: 0
    households:
      household:
        members: [person1, person2, person3]
  output:
    # Only the claimant and partner count (reg 23(1)); the excluded adult's
    # £1,500 SMP and deductions do not change Case 1's income or award.
    income_support_applicable_income: 1_000
    income_support: 3_786.60

