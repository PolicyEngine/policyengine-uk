- name: Case 8, statutory pay retains the tax NI and half-pension deductions.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 1_000
        hours_worked: 0
        employment_income: 3_040
        statutory_sick_pay: 1_000
        # Enter actual deductions to isolate the IS calculation. This case
        # does not assert how the annual tax and NI models calculate them.
        # Income Support deducts income tax before the winter fuel payment
        # charge.
        income_tax_before_winter_fuel_payment_charge: 100
        national_insurance: 50
        pension_contributions: 200
        social_security_income: 0
      person2:
        age: 3
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_IS: true
        would_claim_uc: false
        income_support_assessable_capital: 0
    households:
      household:
        members: [person1, person2]
  output:
    # £3,040 + £1,000 - £100 - £50 - (0.5 x £200) - £1,040 = £2,750.
    # Ordinary earnings still exceed the disregard after all deductions.
    income_support_applicable_income: 2_750
    income_support: 2_036.60

