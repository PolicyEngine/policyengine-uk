        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 1_000
        hours_worked: 0
        employment_income: 1_040
        statutory_maternity_pay: 2_000
        social_security_income: 0
      person2:
        age: 3
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_IS: true
        would_claim_uc: false
        income_support_assessable_capital: 0
    households:
      household:
        members: [person1, person2]
  output:
    # £4,786.60 - £2,000 SMP = £2,786.60.
    income_support_applicable_income: 2_000
    income_support_entitlement: 2_786.60
    income_support: 2_786.60

