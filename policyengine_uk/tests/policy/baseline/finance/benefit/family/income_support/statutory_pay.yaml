# IS Regs 1987 reg 35(2)(b) excludes sickness and parental-leave remuneration
# from earnings; reg 40(1) treats it as other income. Schedule 9 paras 1
# and 4 permit tax, primary Class 1 NI and half of pension contributions.
# https://www.legislation.gov.uk/uksi/1987/1967/regulation/40
# https://www.legislation.gov.uk/uksi/1987/1967/schedule/9/paragraph/4
#
# Ordinary earnings independently consume the Schedule 8 disregard in these
# targeted cases: £20 x 52 = £1,040 for lone parents, £10 x 52 = £520 for a
# couple. Statutory pay then counts in full. The disregard is capped at net
# earnings, so it never reaches statutory pay; earnings_disregard.yaml covers
# statutory pay with no earnings, or with earnings below the disregard.
# The 2025/26 lone-parent allowance is £92.05 x 52 = £4,786.60 (DWP rates).
# https://www.legislation.gov.uk/uksi/1987/1967/schedule/8/paragraph/5
# https://www.legislation.gov.uk/uksi/1987/1967/schedule/8/paragraph/6
# https://www.gov.uk/government/publications/benefit-and-pension-rates-2025-to-2026/benefit-and-pension-rates-2025-to-2026

- name: Case 1, a claimant's statutory sick pay reduces a lone-parent award.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 1_000
        hours_worked: 0
        employment_income: 1_040
        statutory_sick_pay: 1_000
        social_security_income: 0
      person2:
        age: 3
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_IS: true
        would_claim_uc: false
        income_support_assessable_capital: 0
    households:
      household:
        members: [person1, person2]
  output:
    # £1,040 earnings - £1,040 earnings disregard + £1,000 SSP = £1,000.
    employment_income: [1_040, 0]
    statutory_sick_pay: [1_000, 0]
    income_tax: [0, 0]
    national_insurance: [0, 0]
    income_support_tariff_income: 0
    income_support_applicable_amount: 4_786.60
    income_support_applicable_income: 1_000
    income_support_entitlement: 3_786.60
    income_support: 3_786.60

- name: Case 2, a claimant's statutory maternity pay reduces a lone-parent award.
  period: 2025
  absolute_error_margin: 0.01
  input:
