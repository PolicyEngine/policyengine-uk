# Income Support deducts one-half of pension contributions from net earnings
# (IS Regs 1987 reg 36(3)(b)) and net profit (reg 38(1)(b)(ii), (3)(c) and
# (9)(b)), with no reference to Housing Benefit's share. The rates below 0.5
# are model reforms, not current law.
#
# Each person earns 10,000 a year, below the personal allowance and the primary
# threshold, so no income tax or National Insurance is due. The single
# claimant's earnings disregard is 5 a week (260 a year) and a couple's 10 a
# week (520 a year).

- name: At current law Income Support deducts half of pension contributions
  # 10,000 - 0.5 x 2,000 - 260 = 8,740. The same claimant without the
  # contribution has 9,740 (means_test_income_members.yaml).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 2_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    pension_contributions: 2_000
    income_tax: 0
    national_insurance: 0
    income_support_applicable_income: 8_740

- name: A reform of the Income Support share moves Income Support applicable income
  # Model reform, not current law: 10,000 - 0.25 x 2,000 - 260 = 9,240, which is
  # 500 more than at half: 2,000 x (0.5 - 0.25).
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.dwp.income_support.means_test.pension_contribution_deduction_rate: 0.25
    people:
      claimant:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 2_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    income_support_applicable_income: 9_240
    # Housing Benefit keeps its own half: 10,000 - 0.5 x 2,000.
    housing_benefit_net_earnings: 9_000

- name: A reform of the Housing Benefit share leaves Income Support applicable income
  # Model reform, not current law. Housing Benefit net earnings become
  # 10,000 - 0.25 x 2,000 = 9,500; Income Support keeps 8,740.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.dwp.housing_benefit.means_test.pension_contribution_deduction_rate: 0.25
    people:
      claimant:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 2_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    housing_benefit_net_earnings: 9_500
    income_support_applicable_income: 8_740

- name: A reform of a Council Tax Reduction share leaves Income Support applicable income
  # Model reform, not current law. The claimant lives in England outside the
  # councils whose schemes are modelled, so Council Tax Reduction reads the
  # England default scheme's share: 10,000 - 0.25 x 2,000 = 9,500. Income
  # Support keeps 8,740.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.local_authorities.england.council_tax_reduction.default_scheme.means_test.pension_contribution_deduction_rate: 0.25
    people:
      claimant:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 2_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
    households:
      household:
        members: [claimant]
        country: ENGLAND
  output:
    council_tax_reduction_applicable_income: 9_500
    income_support_applicable_income: 8_740

- name: A couple's contributions are summed at the Income Support share
  # 20,000 - 0.5 x (2,000 + 1,000) - 520 = 17,980.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 2_000
      partner:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 1_000
    benunits:
      benunit:
        members: [head, partner]
    households:
      household:
        members: [head, partner]
  output:
    income_support_applicable_income: 17_980

- name: A couple's Income Support applicable income falls by contributions times the change in share
  # Model reform, not current law: 20,000 - 0.25 x 3,000 - 520 = 18,730, which
  # is 750 more than at half: 3,000 x (0.5 - 0.25).
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.dwp.income_support.means_test.pension_contribution_deduction_rate: 0.25
    people:
      head:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 2_000
      partner:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 1_000
    benunits:
      benunit:
        members: [head, partner]
    households:
      household:
        members: [head, partner]
  output:
    income_support_applicable_income: 18_730
