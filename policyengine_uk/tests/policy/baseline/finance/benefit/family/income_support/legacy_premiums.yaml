# IS Schedule 2 paragraphs 11-13A and HB Schedule 3 paragraphs 12-15
# distinguish the claimant and partner from their children and young persons.
# Annual amounts use the 2026 weekly disability-premia parameters times 52:
# single: disability 44.85 * 52 = 2332.20; enhanced 22 * 52 = 1144;
# severe 86.05 * 52 = 4474.60.
# couple: disability 64 * 52 = 3328; enhanced 31.40 * 52 = 1632.80;
# severe 172.10 * 52 = 8949.20.

- name: Disabled 16-year-old claimant receives the single legacy premiums
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 16
    is_disabled_for_benefits: true
    is_enhanced_disabled_for_benefits: true
    is_severely_disabled_for_benefits: true
    pip_dl_category: ENHANCED
  output:
    # The claimant qualifies in their own right: no statutory age-18 floor.
    disability_premium: 2332.20
    enhanced_disability_premium: 1144
    severe_disability_premium: 4474.60

- name: Disabled 17-year-old claimant receives the single legacy premiums
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 17
    is_disabled_for_benefits: true
    is_enhanced_disabled_for_benefits: true
    is_severely_disabled_for_benefits: true
    pip_dl_category: ENHANCED
  output:
    disability_premium: 2332.20
    enhanced_disability_premium: 1144
    severe_disability_premium: 4474.60

- name: Disabled 18-year-old young person does not qualify a parent for legacy premiums
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
      young_person:
        age: 18
        is_in_non_advanced_education: true
        is_disabled_for_benefits: true
        is_enhanced_disabled_for_benefits: true
        is_severely_disabled_for_benefits: true
        pip_dl_category: ENHANCED
    benunits:
      family:
        members: [parent, young_person]
  output:
    # Zero qualifying claimants/partners, so each claimant premium is zero.
    # The separate disabled-child premium is outside the current model.
    disability_premium: 0
    enhanced_disability_premium: 0
    severe_disability_premium: 0

- name: Disabled 19-year-old young person does not qualify a parent for legacy premiums
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
      young_person:
        age: 19
        is_in_non_advanced_education: true
        age_started_or_accepted_current_education_or_training: 17
        is_disabled_for_benefits: true
        is_enhanced_disabled_for_benefits: true
        is_severely_disabled_for_benefits: true
        pip_dl_category: ENHANCED
    benunits:
      family:
        members: [parent, young_person]
  output:
    disability_premium: 0
    enhanced_disability_premium: 0
    severe_disability_premium: 0

- name: Disabled 17-year-old partner qualifies the couple for legacy premiums
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 17
        is_claimant_or_partner: true
        is_disabled_for_benefits: true
        is_enhanced_disabled_for_benefits: true
        is_severely_disabled_for_benefits: true
        pip_dl_category: ENHANCED
    benunits:
      family:
        members: [claimant, partner]
  output:
    disability_premium: 3328
    enhanced_disability_premium: 1632.80
    # IS Sch 2 para 13(2)(b) / HB Sch 3 para 14(2)(b) require both partners
    # to qualify; the claimant receives no qualifying benefit and is not
    # blind, so there is no severe disability premium.
    severe_disability_premium: 0

- name: Disabled lone parent with a young person keeps single legacy premiums
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_disabled_for_benefits: true
        is_enhanced_disabled_for_benefits: true
        is_severely_disabled_for_benefits: true
        pip_dl_category: ENHANCED
      young_person:
        age: 19
        is_in_non_advanced_education: true
        age_started_or_accepted_current_education_or_training: 17
    benunits:
      family:
        members: [parent, young_person]
  output:
    disability_premium: 2332.20
    enhanced_disability_premium: 1144
    severe_disability_premium: 4474.60

