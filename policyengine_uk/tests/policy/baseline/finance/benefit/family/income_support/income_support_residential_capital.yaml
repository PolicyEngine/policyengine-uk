# Income Support tariff income from capital: IS Regs 1987 reg 53 (NI: SR
# 1987/459 reg 53). Capital above the lower threshold counts as £1 a week for
# each complete £250 (reg 53(1)-(1A)) and £1 for any part of £250 left over
# (reg 53(2)), over 52 weeks. The lower threshold is £6,000 (reg 53(1)), or
# £10,000 where the claimant lives permanently in prescribed accommodation
# (reg 53(1A)-(1C)). Capital above £16,000 bars the award (reg 45), so the
# figures at £16,001 continue the formula past the limit. No award turns on
# them: the last case shows the award is nil there.

- name: Income Support ordinary capital threshold and partial steps
  period: 2025
  absolute_error_margin: 0.01
  input:
    income_support_assessable_capital: [6000, 6001, 10000, 10001, 10251, 16000, 16001]
    legacy_prescribed_accommodation_capital_exception: [false, false, false, false, false, false, false]
  output:
    # Excess over £6,000: 0, 1, 4,000, 4,001, 4,251, 10,000, 10,001.
    # Steps of £250 or part: 0, 1, 16, 17, 18, 40, 41; each £1 x 52.
    income_support_tariff_income: [0, 52, 832, 884, 936, 2080, 2132]

- name: Income Support prescribed accommodation capital threshold and partial steps
  period: 2025
  absolute_error_margin: 0.01
  input:
    income_support_assessable_capital: [6000, 6001, 10000, 10001, 10251, 16000, 16001]
    legacy_prescribed_accommodation_capital_exception: [true, true, true, true, true, true, true]
  output:
    # Excess over £10,000: 0, 0, 0, 1, 251, 6,000, 6,001.
    # Steps of £250 or part: 0, 0, 0, 1, 2, 24, 25; each £1 x 52.
    income_support_tariff_income: [0, 0, 0, 52, 104, 1248, 1300]

- name: Omitted prescribed accommodation status retains the ordinary Income Support threshold
  period: 2025
  absolute_error_margin: 0.01
  input:
    income_support_assessable_capital: 10001
  output:
    legacy_prescribed_accommodation_capital_exception: false
    income_support_tariff_income: 884

- name: Housing Benefit's residential exception does not set the Income Support threshold
  period: 2025
  absolute_error_margin: 0.01
  input:
    income_support_assessable_capital: 10001
    housing_benefit_residential_capital_exception: true
  output:
    legacy_prescribed_accommodation_capital_exception: false
    # Reg 53(1): £4,001 over £6,000, 17 steps.
    income_support_tariff_income: 884

- name: Income Support in prescribed accommodation is paid at the upper capital limit
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      p1:
        age: 26
        income_support_reported: true
      c1:
        age: 4
    benunits:
      b1:
        members: [p1, c1]
        would_claim_IS: true
        income_support_assessable_capital: 16_000
        legacy_prescribed_accommodation_capital_exception: true
    households:
      household:
        members: [p1, c1]
  output:
    income_support_eligible: true
    # Reg 53(1A): £6,000 over £10,000 is 24 steps, £24 x 52 = £1,248.
    income_support_tariff_income: 1_248
    income_support_applicable_income: 1_248
    # £74.70 x 52 = £3,884.40 (2021-22 lone parent aged 18 or over), less
    # £1,248 tariff income.
    income_support: 2_636.40

- name: Income Support outside prescribed accommodation is paid at the upper capital limit
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      p1:
        age: 26
        income_support_reported: true
      c1:
        age: 4
    benunits:
      b1:
        members: [p1, c1]
        would_claim_IS: true
        income_support_assessable_capital: 16_000
        legacy_prescribed_accommodation_capital_exception: false
    households:
      household:
        members: [p1, c1]
  output:
    income_support_eligible: true
    # Reg 53(1): £10,000 over £6,000 is 40 steps, £40 x 52 = £2,080.
    income_support_tariff_income: 2_080
    income_support_applicable_income: 2_080
    # £3,884.40 less £2,080 tariff income.
    income_support: 1_804.40

- name: Income Support is not paid above the capital limit with or without the exception
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      p1:
        age: 26
        income_support_reported: true
      c1:
        age: 4
      p2:
        age: 26
        income_support_reported: true
      c2:
        age: 4
    benunits:
      b1:
        members: [p1, c1]
        would_claim_IS: true
        income_support_assessable_capital: 16_001
        legacy_prescribed_accommodation_capital_exception: true
      b2:
        members: [p2, c2]
        would_claim_IS: true
        income_support_assessable_capital: 16_001
        legacy_prescribed_accommodation_capital_exception: false
    households:
      household_1:
        members: [p1, c1]
      household_2:
        members: [p2, c2]
  output:
    # Reg 45: capital above £16,000 bars the award.
    income_support_eligible: [false, false]
    income_support: [0, 0]
