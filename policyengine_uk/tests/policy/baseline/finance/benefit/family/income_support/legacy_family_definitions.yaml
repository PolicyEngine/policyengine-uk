# IS Regulations 1987 Sch 2 para 1; Sch 8 paras 5, 6 and 10.
# Annual amounts use existing CPI-uprated 2025 weekly parameters * 52:
# low = 80.01221579759817 * 52 = 4160.635221475105;
# high = 101.00013997540619 * 52 = 5252.007278721122;
# couple = 158.66598990083986 * 52 = 8250.631474843673.
# Applicable incomes: 10000 - 52 * (single 5 / lone parent 20 / couple 10)
# = 9740 / 8960 / 9480. Tax, premiums, other income held at zero.
# Retained limits: mixed 18-24/under18 incorrectly uses the higher gap amount
# (Sch 2 para 1(3)(f)); young couples' higher own-right/child branches are not
# modelled (para 1(3)(a),(e)). These rate-policy issues are outside this change.
- name: IS single claimant aged 17 is not their own child
  period: 2025
  absolute_error_margin: 0.02
  input:
    people:
      claimant:
        age: 17
        income_tax: 0
        national_insurance: 0
        social_security_income: 0
        pension_contributions: 0
        employment_income: 10000
    benunits:
      family:
        members:
        - claimant
        benefits_premiums: 0
        income_support_tariff_income: 0
  output:
    income_support_applicable_amount: 4160.635221475105
    income_support_applicable_income: 9740
- name: IS lone parent aged 17 uses the under-18 allowance
  period: 2025
  absolute_error_margin: 0.02
  input:
    people:
      claimant:
        age: 17
        is_parent: true
        income_tax: 0
        national_insurance: 0
        social_security_income: 0
        pension_contributions: 0
        employment_income: 10000
      child:
        age: 1
        income_tax: 0
        national_insurance: 0
        social_security_income: 0
        pension_contributions: 0
    benunits:
      family:
        members:
        - claimant
        - child
        benefits_premiums: 0
        income_support_tariff_income: 0
  output:
    income_support_applicable_amount: 4160.635221475105
    income_support_applicable_income: 8960
