- name: Income Support capital test ignores the main residence
  period: 2021
  absolute_error_margin: 1
  input:
    people:
      p1:
        age: 26
        income_support_reported: true
      c1:
        age: 4
    benunits:
      b1:
        members: [p1, c1]
        would_claim_IS: true
    households:
      household:
        members: [p1, c1]
        savings: 1000
        owned_land: 500
        corporate_wealth: 2000
        main_residence_value: 300000
        other_residential_property_value: 3000
        non_residential_property_value: 4000
  output:
    # Savings at face value; land, shares and property less 10% for the
    # expenses of sale (IS Regs 1987 reg. 49(a)): 1,000 + 90% of 9,500.
    income_support_assessable_capital: 9550

