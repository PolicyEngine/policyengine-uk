- name: Income Support values overseas land and property less sale expenses
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    overseas_property_value: 10_000
  output:
    # 10,000 gross less 10% sale expenses; no identified secured debt.
    income_support_assessable_capital: 9_000

- name: Income Support preserves household allocation for overseas land and property
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 40
      second:
        age: 40
      partner:
        age: 40
    benunits:
      single:
        members: first
        would_claim_IS: false
      couple:
        members: [second, partner]
        would_claim_IS: false
    households:
      household:
        members: [first, second, partner]
        overseas_property_value: 18_000
  output:
    # The 16,200 net household value is shared by one and two adults.
    income_support_assessable_capital: [5_400, 10_800]

- name: Income Support reported claim path receives full overseas land and property capital
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 40
      unrelated:
        age: 40
    benunits:
      claiming:
        members: claimant
        would_claim_IS: true
      other:
        members: unrelated
        would_claim_IS: false
    households:
      household:
        members: [claimant, unrelated]
        overseas_property_value: 18_000
  output:
    # Existing claim-path allocation gives the claimant all net household capital.
    income_support_assessable_capital: [16_200, 0]

