- name: Income Support counts tariff income without an earnings disregard
  period: 2021
  absolute_error_margin: 1
  input:
    people:
      p1:
        age: 26
        income_support_reported: true
      c1:
        age: 4
    benunits:
      b1:
        members: [p1, c1]
        would_claim_IS: true
    households:
      household:
        members: [p1, c1]
        savings: 6251
  output:
    income_support_eligible: true
    income_support_tariff_income: 104
    income_support_net_earnings: 0
    income_support_earnings_disregard: 0
    income_support_applicable_income: 104
    # £74.70 x 52 = £3,884.40 (2021-22 lone parent aged 18 or over).
    # No earnings: no Schedule 8 disregard. £3,884.40 - £104 = £3,780.40.
    income_support: 3780.40

