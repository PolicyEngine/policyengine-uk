- name: Income Support deducts sale expenses before combined secured debt for second homes and buy-to-let
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    # Second homes of 50,000 and buy-to-let of 70,000 share one component.
    other_residential_property_value: 120_000
    other_residential_property_secured_debt: 80_000
  output:
    # max(0, 90% of 120,000 - 80,000); no separate buy-to-let input.
    income_support_assessable_capital: 28_000

- name: Income Support floors combined property equity at zero for second homes and buy-to-let
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    # Second homes of 50,000 and buy-to-let of 70,000 share one component.
    other_residential_property_value: 120_000
    other_residential_property_secured_debt: 120_000
  output:
    # max(0, 90% of 120,000 - 120,000); no separate buy-to-let input.
    income_support_assessable_capital: 0
