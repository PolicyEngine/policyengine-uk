# Cases 18 to 20: the Income Support bar in reg. 5(4)(c), which reg. 4(2)
# keeps for the 16th-birthday period. 2018-19 rates: child element £2,780 and
# family element £545 a year (child_element.yaml, family_element.yaml); PIP
# daily living standard rate £57.30 a week; Carer's Allowance £64.60 a week;
# Child Benefit eldest rate £20.70 a week; colour TV licence £150.50. The
# disability cost-of-living payment parameter starts at £150 on 1 January
# 2022, and the model applies that first value to earlier years, so the
# household receives £150 for the parent's PIP.

- name: Case 18, a 16-year-old school leaver who receives Income Support in their own right is not a qualifying young person (reg. 4(2), reg. 5(4)(c)).
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
        pip_dl_category: STANDARD
        child_tax_credit_reported: 1
      carer:
        age: 16
        date_of_birth: 20020115
        current_education: NOT_IN_EDUCATION
        care_hours: 35
        income_support_reported: 3_000
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, carer]
        would_claim_uc: false
    households:
      household:
        members: [parent, carer]
  output:
    # Born 15 January 2002: the reg. 4 period runs to 31 August 2018.
    is_before_first_september_following_16th_birthday: [false, true]
    # Not the claimant or partner, so their own report while Income Support
    # is in payment.
    is_on_income_support: [false, true]
    is_qualifying_young_person_for_child_tax_credit: [false, false]
    # No child or qualifying young person, so no CTC.
    child_tax_credit: 0
    # PIP 57.30 x 52 = 2,979.60; Carer's Allowance 64.60 x 52 = 3,359.20;
    # Child Benefit 20.70 x 52 = 1,076.40; cost-of-living payment 150; less
    # TV licence 150.50: 7,414.70.
    household_net_income: 7_414.70

- name: Case 19, the same family without Income Support for the 16-year-old gets CTC until 31 August 2018 (reg. 4(1)).
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
        pip_dl_category: STANDARD
        child_tax_credit_reported: 1
      carer:
        age: 16
        date_of_birth: 20020115
        current_education: NOT_IN_EDUCATION
        care_hours: 35
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, carer]
        would_claim_uc: false
    households:
      household:
        members: [parent, carer]
  output:
    is_before_first_september_following_16th_birthday: [false, true]
    is_on_income_support: [false, false]
    is_qualifying_young_person_for_child_tax_credit: [false, true]
    # No income: child element 2,780 + family element 545 = 3,325.
    child_tax_credit: 3_325
    # Case 18's 7,414.70 + 3,325 = 10,739.70.
    household_net_income: 10_739.70

- name: Case 20, a 17-year-old at school who receives Income Support in their own right is not a qualifying young person (reg. 5(3)(a), 5(4)(c)).
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
        child_tax_credit_reported: 1
      student:
        age: 17
        date_of_birth: 20010115
        current_education: UPPER_SECONDARY
        income_support_reported: 3_000
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, student]
        would_claim_uc: false
  output:
    # The first condition holds: full-time non-advanced education begun
    # before 19.
    meets_qualifying_young_person_education_or_training_condition_for_child_tax_credit: [false, true]
    is_before_first_september_following_16th_birthday: [false, false]
    is_on_income_support: [false, true]
    is_qualifying_young_person_for_child_tax_credit: [false, false]
    child_tax_credit: 0
