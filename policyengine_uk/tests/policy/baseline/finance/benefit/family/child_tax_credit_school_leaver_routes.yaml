      parent:
        child_tax_credit_reported: 1
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      student:
        age: 16
        date_of_birth: 20080101
        current_education: TERTIARY
        weekly_hours: 24
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, student]
        would_claim_uc: false
  output:
    # Advanced education fails the first condition, which reg. 4(2) lifts.
    # It is still full-time education (reg. 5(5)), so the student has not
    # "ceased" it and the remunerative work bar does not apply.
    is_qualifying_young_person_for_child_tax_credit: [false, true]
    CTC_child_element: 3_455

