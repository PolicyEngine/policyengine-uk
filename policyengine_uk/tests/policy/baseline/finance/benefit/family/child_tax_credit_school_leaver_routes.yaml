# Child Tax Credit qualifying young persons who have left education: Child
# Tax Credit Regulations 2002 reg. 4 (from the 16th birthday until the 31
# August that next follows, with no education condition), reg. 5(3)(b) (20
# weeks after leaving, under 18, while registered for work or training) and
# the second condition in reg. 5(4), which applies to both: not in
# remunerative work (24 hours a week or more, reg. 2(1)) after leaving, and
# not receiving a benefit in their own right.
#
# The child element was £3,455 in 2024-25, the last year of tax credits
# (gov/dwp/tax_credits/child_tax_credit/elements/child_element.yaml).
#
# The child element needs an existing claim that a Universal Credit claim has
# not ended (is_CTC_eligible): each case that reads it gives the claimant a
# reported award and the family no Universal Credit claim.

- name: Case 1, a 16-year-old who has left education is a qualifying young person for the year (reg. 4(1)).
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        child_tax_credit_reported: 1
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      school_leaver:
        age: 16
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, school_leaver]
        would_claim_uc: false
  output:
    is_qualifying_young_person_for_child_tax_credit: [false, true]
    is_child_or_qualifying_young_person_for_child_tax_credit: [false, true]
    is_responsible_for_child_or_qualifying_young_person_for_child_tax_credit: true
    CTC_child_element: 3_455

- name: Case 2, a 16-year-old who has left education and works 24 hours a week is not a qualifying young person (reg. 5(4)(a)).
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        child_tax_credit_reported: 1
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      school_leaver:
        age: 16
        current_education: NOT_IN_EDUCATION
        weekly_hours: 24
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, school_leaver]
        would_claim_uc: false
  output:
    is_in_remunerative_work_for_child_tax_credit: [false, true]
    is_qualifying_young_person_for_child_tax_credit: [false, false]
    CTC_child_element: 0
    # Child Benefit reg. 4 has no remunerative work bar.
    is_qualifying_young_person_for_child_benefit: [false, true]

