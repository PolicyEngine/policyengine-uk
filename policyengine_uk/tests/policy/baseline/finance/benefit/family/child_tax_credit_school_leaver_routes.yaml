        is_parent: true
        is_claimant_or_partner: true
      pupil:
        age: 16
        current_education: UPPER_SECONDARY
        weekly_hours: 24
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, pupil]
        would_claim_uc: false
  output:
    # Reg. 5(4)(a) applies to a person "having ceased" education or training.
    is_qualifying_young_person_for_child_tax_credit: [false, true]
    CTC_child_element: 3_455

- name: Case 5, a 16-year-old apprentice still on a college course and working 30 hours a week is a qualifying young person.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        child_tax_credit_reported: 1
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      apprentice:
        age: 16
        current_education: POST_SECONDARY
        is_apprentice: true
        weekly_hours: 30
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, apprentice]
        would_claim_uc: false
  output:
    # Education "by virtue of his employment" is left out of the first
    # condition (reg. 5(3)(a)(ii)), which reg. 4(2) lifts. The apprentice has
    # not "ceased to receive full-time education" (reg. 5(4)(a), 5(5)), so
    # the remunerative work bar does not apply.
    is_qualifying_young_person_for_child_tax_credit: [false, true]
    CTC_child_element: 3_455

