    benunits:
      benunit:
        members: [parent, apprentice]
  output:
    # Ceased full-time education and in remunerative work (reg. 5(4)(a)).
    is_qualifying_young_person_for_child_tax_credit: [false, false]
    CTC_child_element: 0
