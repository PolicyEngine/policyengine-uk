# A member of the benefit unit aged 16 or over who is not the claimant or
# partner has their own bedroom in the size criteria, with the exceptions below.
#
# Universal Credit: UC Regs 2013 Sch 4 para 10(1)(b), "a qualifying young
# person for whom the renter or either joint renter is responsible"; anyone
# else aged 16 or over living with the renter is a non-dependant (para 9(2))
# with a bedroom under para 10(1)(c), "a non-dependant who is not a child",
# except a qualifying young person no one is responsible for (para 9(2)(g))
# and a member who heads the household and is not a qualifying young person
# the renter is responsible for, whom the formula treats as liable for the
# rent (para 9(2)(d)).
# A child is a person under 16 (WRA 2012 s.40).
#
# Housing Benefit: HB Regs 2006 and HB (SPC) Regs 2006 reg 13D(3)(b), "a
# person who is not a child".
#
# Rents of £200 a week (£10,400 a year) sit between the model's Maidstone
# one-bedroom (B, £173.08 a week) and two-bedroom (C, £208.85 a week) rates,
# so the bedroom decides whether the rent is met in full.

- name: A qualifying young person has their own bedroom
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_household_head: true
        is_parent: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
    benunits:
      family:
        members: [parent, young_person]
    households:
      home:
        members: [parent, young_person]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_claimant_or_partner: [true, false]
    is_child_or_qualifying_young_person_for_universal_credit: [false, true]
    # UC: the renter (para 10(1)(a)) and the qualifying young person (para
    # 10(1)(b)): 2 bedrooms, category C.
    LHA_allowed_bedrooms: 2
    LHA_category: C
    # The rent is below the two-bedroom rate, so it is met in full.
    uc_housing_costs_element: 10_400
    # HB: one bedroom each for the claimant and the young person, neither of
    # whom is a child (reg 13D(3)(b)): 2 bedrooms, category C.
    housing_benefit_LHA_allowed_bedrooms: 2
    housing_benefit_LHA_category: C

- name: A qualifying young person aged 19 has their own bedroom
  period: 2026
  input:
    people:
      parent:
        age: 50
        is_household_head: true
        is_parent: true
      young_person:
        age: 19
        current_education: UPPER_SECONDARY
        # UC Regs 2013 reg 5(1)(b) and 5(2): enrolled before 19, and before
        # the 1 September after their 19th birthday.
        age_started_or_accepted_current_education_or_training: 18
        is_before_universal_credit_qualifying_young_person_terminal_date: true
    benunits:
      family:
        members: [parent, young_person]
    households:
      home:
        members: [parent, young_person]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_claimant_or_partner: [true, false]
    is_child_or_qualifying_young_person_for_universal_credit: [false, true]
    LHA_allowed_bedrooms: 2
    LHA_category: C
    uc_housing_costs_element: 10_400
    housing_benefit_LHA_allowed_bedrooms: 2
    housing_benefit_LHA_category: C

- name: A member aged 18 who is not a qualifying young person is a non-dependant with a bedroom
  period: 2026
  input:
    people:
      parent:
        age: 45
        is_household_head: true
        is_parent: true
      son:
        age: 18
        current_education: NOT_IN_EDUCATION
    benunits:
      family:
        members: [parent, son]
    households:
      home:
        members: [parent, son]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_claimant_or_partner: [true, false]
    is_qualifying_young_person_for_universal_credit: [false, false]
    # UC: not a qualifying young person, so a non-dependant (para 9(2)) who
    # is not a child (para 10(1)(c)).
    LHA_allowed_bedrooms: 2
    LHA_category: C
    # HB: a person who is not a child (reg 13D(3)(b)).
    housing_benefit_LHA_allowed_bedrooms: 2
    housing_benefit_LHA_category: C

- name: A looked-after qualifying young person has no Universal Credit bedroom of their own
  period: 2026
  input:
    people:
      carer:
        age: 40
        is_household_head: true
        is_parent: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        # UC Regs 2013 reg 4(6)(a): no one is responsible for a qualifying
        # young person looked after by a local authority.
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [carer, young_person]
    households:
      home:
        members: [carer, young_person]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_qualifying_young_person_for_universal_credit: [false, true]
    is_child_or_qualifying_young_person_for_universal_credit: [false, false]
    # Not under para 10(1)(b), and not a non-dependant (para 9(2)(c) and (g)),
    # so no bedroom of their own. The carer they are placed with is a foster parent
    # (reg 2: a person with whom a child is placed under the care planning
    # regulations, which place children under 18), so has one additional
    # bedroom (para 12(4)(a), (9)(b)): 2 bedrooms, category C. The model reads
    # "child" there as under 18 (see is_lha_foster_child; reg 91(2)(b)-(d)
    # also speak of foster parents of qualifying young persons). Read as under
    # 16 (WRA 2012 s.40), there would be no foster room and 1 bedroom.
    LHA_additional_bedrooms: 1
    LHA_allowed_bedrooms: 2
    LHA_category: C
    # HB: a young person placed with the claimant by a local authority does
    # not occupy the dwelling (HB Regs 2006 reg 21(3)), but the claimant is a
    # qualifying parent or carer (reg 2(1)) with one additional bedroom (reg
    # 13D(3A)(b)): 2 bedrooms.
    is_child_or_young_person_placed_with_family: [false, true]
    housing_benefit_LHA_additional_bedrooms: 1
    housing_benefit_LHA_allowed_bedrooms: 2
    housing_benefit_LHA_category: C

- name: A qualifying young person cannot share with a younger sibling of the same sex
  period: 2026
  input:
    people:
      parent_1:
        age: 42
        is_household_head: true
        is_parent: true
        is_male: true
      parent_2:
        age: 40
        is_parent: true
        is_male: false
      young_person:
        age: 17
        is_male: true
        current_education: UPPER_SECONDARY
      boy:
        age: 12
        is_male: true
      girl:
        age: 8
        is_male: false
    benunits:
      family:
        members: [parent_1, parent_2, young_person, boy, girl]
    households:
      home:
        members: [parent_1, parent_2, young_person, boy, girl]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_claimant_or_partner: [true, true, false, false, false]
    # UC: the couple (para 10(1)(a)), the qualifying young person (b), and
    # one bedroom each for the boy and the girl, who are of opposite sexes
    # and one of whom is 10 or over ((d)-(f)): 4 bedrooms, category E.
    LHA_allowed_bedrooms: 4
    LHA_category: E
    # HB: the couple (reg 13D(3)(a)), the young person ((b)), and the two
    # children ((e)): 4 bedrooms, the maximum category.
    housing_benefit_LHA_allowed_bedrooms: 4
    housing_benefit_LHA_category: E

- name: A partner aged 19 adds no bedroom
  period: 2026
  input:
    people:
      claimant:
        age: 24
        is_household_head: true
      partner:
        age: 19
        current_education: NOT_IN_EDUCATION
    benunits:
      couple:
        members: [claimant, partner]
    households:
      home:
        members: [claimant, partner]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_claimant_or_partner: [true, true]
    # The couple share one bedroom (UC para 10(1)(a); HB reg 13D(3)(a)).
    LHA_allowed_bedrooms: 1
    LHA_category: B
    housing_benefit_LHA_allowed_bedrooms: 1
    housing_benefit_LHA_category: B

- name: A pensioner couple's grandchild in full-time education has their own Housing Benefit bedroom
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandparent_1:
        age: 70
        is_household_head: true
      grandparent_2:
        age: 68
      grandchild:
        age: 17
        current_education: UPPER_SECONDARY
    benunits:
      family:
        members: [grandparent_1, grandparent_2, grandchild]
    households:
      home:
        members: [grandparent_1, grandparent_2, grandchild]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_claimant_or_partner: [true, true, false]
    is_child_or_young_person_for_legacy_benefits: [false, false, true]
    # HB (SPC) Regs 2006 reg 13D(3): the couple ((a)) and the young person
    # ((b)): 2 bedrooms, category C.
    housing_benefit_LHA_allowed_bedrooms: 2
    housing_benefit_LHA_category: C
    # No income, so Housing Benefit meets the eligible rent: the rent, which
    # is below the two-bedroom rate.
    housing_benefit: 10_400

- name: A qualifying young person no one is responsible for in a non-dependant's family adds no Universal Credit bedroom
  period: 2026
  input:
    people:
      renter:
        age: 40
        is_household_head: true
      carer:
        age: 45
        is_parent: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        is_looked_after_by_local_authority: true
    benunits:
      renter_family:
        members: [renter]
      carer_family:
        members: [carer, young_person]
    households:
      home:
        members: [renter, carer, young_person]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_non_dependant_of_household_head: [false, true, true]
    is_qualifying_young_person_for_universal_credit: [false, false, true]
    is_child_or_qualifying_young_person_for_universal_credit: [false, false, false]
    # The renter (para 10(1)(a)) and the carer, a non-dependant who is not a
    # child ((c)). The young person is no one's responsibility (reg 4(6)), so
    # is not a non-dependant (para 9(2)(g)): 2 bedrooms, category C. The
    # carer's own claim: the carer (para 10(1)(a)) and the foster parent
    # condition's additional bedroom (para 12(4)(a); the young person is a
    # child under 18 placed with the carer), 2. The young person, the
    # carer's foster child, has none (para 9(2)(c)).
    LHA_allowed_bedrooms: [2, 2]
    LHA_category: [C, C]

- name: A non-dependant couple has two Universal Credit bedrooms but one Housing Benefit bedroom
  period: 2026
  input:
    people:
      renter:
        age: 40
        is_household_head: true
      non_dependant_1:
        age: 30
      non_dependant_2:
        age: 28
    benunits:
      renter_family:
        members: [renter]
      couple:
        members: [non_dependant_1, non_dependant_2]
    households:
      home:
        members: [renter, non_dependant_1, non_dependant_2]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_claimant_or_partner: [true, true, true]
    # UC: the renter (para 10(1)(a)) and each non-dependant who is not a
    # child ((c)): 3 bedrooms, category D. The couple's own category would be
    # 1 bedroom, and a couple is not a specified renter (para 28): B.
    LHA_allowed_bedrooms: [3, 1]
    LHA_category: [D, B]
    # HB: the claimant ((b)) and the occupier couple ((a)): 2 bedrooms,
    # category C. An ordinary couple shares a bedroom; only a couple who
    # cannot share has two ((za); DWP circular HB A3/2017). The couple pay no
    # rent; their own category would be 1 bedroom: B.
    housing_benefit_LHA_allowed_bedrooms: [2, 1]
    housing_benefit_LHA_category: [C, B]

- name: A member who heads the household but does not claim adds no Universal Credit bedroom
  period: 2025
  input:
    people:
      mother:
        age: 45
        is_parent: true
      son:
        age: 20
        current_education: NOT_IN_EDUCATION
        is_household_head: true
    benunits:
      family:
        members: [mother, son]
    households:
      home:
        members: [mother, son]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_resolved_household_head: [false, true]
    is_claimant_or_partner: [true, false]
    is_qualifying_young_person_for_universal_credit: [false, false]
    # The formula reads the son, as household head, as the householder in
    # whose name the home is rented. He does not claim, so he is not a
    # renter (Sch 4 paras 1(2) and 9(1)(a)). Aged 20 and not in education, he
    # is not a qualifying young person (para 9(1)(b)). Liable for his
    # occupation, he is not a non-dependant (para 9(2)(d)). Only the renter's
    # bedroom counts (para 10(1)(a)): 1 bedroom, category B.
    LHA_allowed_bedrooms: 1
    LHA_category: B

- name: A household head who is a qualifying young person the renter is responsible for has their own bedroom
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      mother:
        age: 45
        is_male: false
        is_parent: true
      daughter:
        age: 17
        is_male: false
        current_education: UPPER_SECONDARY
        is_household_head: true
    benunits:
      family:
        members: [mother, daughter]
    households:
      home:
        members: [mother, daughter]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_resolved_household_head: [false, true]
    is_claimant_or_partner: [true, false]
    is_child_or_qualifying_young_person_for_universal_credit: [false, true]
    # The daughter heads the household but is a qualifying young person her
    # mother is responsible for, so she is in the extended benefit unit
    # (Sch 4 para 9(1)(b)) whoever is liable for the rent. The renter
    # (para 10(1)(a)) and the qualifying young person (para 10(1)(b)):
    # 2 bedrooms, category C, and the rent is met in full.
    LHA_allowed_bedrooms: 2
    LHA_category: C
    uc_housing_costs_element: 10_400
    # HB: one bedroom each for the claimant and the daughter, an occupier
    # who is not a child (reg 13D(3)(b)).
    housing_benefit_LHA_allowed_bedrooms: 2
    housing_benefit_LHA_category: C

# A non-dependant in the renter's benefit unit has a bedroom (para 10(1)(c))
# and bears a housing cost contribution (para 13). The claim that bears the
# contribution has the bedroom, and coding the same adult in a benefit unit
# of their own changes no claim.
#
# 2026-27 amounts in the parameter files: UC standard allowance for a single
# claimant aged 25 or over £424.90 a month, £5,098.80 a year; housing cost
# contribution £96.55 a month, £1,158.60 a year, for a non-dependant aged 21
# or over (paras 14(1), 16(2)(a)); Household Energy Payment £100 (council
# tax bands A to D in England; the default band is D); TV Licence £180.

- name: An adult son in the renter's benefit unit has a bedroom and bears a housing cost contribution
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      mother:
        age: 45
        is_household_head: true
      son:
        age: 22
        current_education: NOT_IN_EDUCATION
    benunits:
      family:
        members: [mother, son]
    households:
      home:
        members: [mother, son]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_benefit_unit_non_dependant_for_universal_credit: [false, true]
    # The renter and the son, a non-dependant who is not a child: 2 bedrooms,
    # category C (£208.85 a week, £10,860.20 a year, above the rent).
    LHA_allowed_bedrooms: 2
    LHA_category: C
    # 96.55 x 12 = 1,158.60.
    uc_non_dep_deductions: 1_158.60
    # 10,400 - 1,158.60 = 9,241.40.
    uc_housing_costs_element: 9_241.40
    # 5,098.80 + 9,241.40 = 14,340.20, with no income to taper.
    universal_credit: 14_340.20
    # 14,340.20 + 100 (Household Energy Payment) - 180 (TV Licence).
    household_net_income: 14_260.20

- name: The same adult son in a benefit unit of his own, not claiming, leaves his mother's claim unchanged
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      mother:
        age: 45
        is_household_head: true
      son:
        age: 22
        current_education: NOT_IN_EDUCATION
    benunits:
      family:
        members: [mother]
      son_unit:
        members: [son]
        would_claim_uc: false
    households:
      home:
        members: [mother, son]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_non_dependant_of_household_head: [false, true]
    # The renter and the son, now another family's non-dependant: 2
    # bedrooms, category C, as when he is in her benefit unit.
    LHA_allowed_bedrooms: [2, 1]
    LHA_category: [C, A]
    uc_non_dep_deductions: [1_158.60, 0]
    uc_housing_costs_element: [9_241.40, 0]
    universal_credit: [14_340.20, 0]
    household_net_income: 14_260.20

- name: A claiming joint tenant has the bedroom of the non-claiming head's adult son whose contribution it bears
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        # Over State Pension age, so not eligible for Universal Credit.
        age: 80
        is_household_head: true
        is_claimant_or_partner: true
      son:
        age: 30
        is_claimant_or_partner: false
      sharer:
        age: 40
        is_claimant_or_partner: true
    benunits:
      head_family:
        members: [head, son]
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
    households:
      home:
        members: [head, son, sharer]
        rent: 12_000
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_uc_eligible: [false, true]
    uc_non_dependants_counted: [false, true]
    # The head's family makes no Universal Credit claim, so the sharer's
    # claim counts the son (para 9(2)(f)): the sharer bears his contribution
    # (96.55 x 12 = 1,158.60) and has his bedroom (renter 1 + son 1 = 2).
    uc_non_dep_deductions: [0, 1_158.60]
    LHA_allowed_bedrooms: [2, 2]

- name: A non-claiming sharer's adult son ends the head's shared accommodation rate through final Universal Credit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        is_household_head: true
        is_claimant_or_partner: true
      sharer:
        age: 40
        employment_income: 60_000
        is_claimant_or_partner: true
      son:
        age: 22
        is_claimant_or_partner: false
    benunits:
      head_family:
        members: [head]
        would_claim_uc: true
        claims_universal_credit: true
        liable_for_share_of_household_rent: true
      sharer_family:
        members: [sharer, son]
        would_claim_uc: false
        claims_universal_credit: false
        liable_for_share_of_household_rent: true
    households:
      home:
        members: [head, sharer, son]
        rent: 26_000
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
        region: SOUTH_EAST
  output:
    # The sharer's family makes no claim and does not count the household's
    # non-dependants, so the head's claim counts the son (para 9(2)(f)): it
    # bears his contribution and has his bedroom (renter 1 + son 1 = 2).
    is_benefit_unit_non_dependant_for_universal_credit: [false, false, true]
    uc_non_dependants_counted: [true, false]
    LHA_allowed_bedrooms: [2, 2]
    # The third condition in para 28(4) fails, so the head, single and
    # under 35, is not a specified renter (para 27): category C, not A.
    lha_renter_has_non_dependant: [true, true]
    is_lha_shared_accommodation_rate_specified_renter: [false, false]
    LHA_category: [C, C]
    # 96.55 x 12 = 1,158.60.
    uc_non_dep_deductions: [1_158.60, 0]
    # The head's £13,000 share of the rent exceeds Maidstone's two-bedroom
    # Universal Credit rate, £905 a month: 905 x 12 = 10,860, less the
    # contribution, 9,701.40.
    uc_housing_costs_element: [9_701.40, 10_860]
    # 5,098.80 + 9,701.40 = 14,800.20, with no income to taper.
    universal_credit_pre_benefit_cap: [14_800.20, 0]
    # The head has no earnings, so the cap for a single claimant outside
    # London, £14,753, applies: 14,800.20 - 14,753 = 47.20.
    uc_benefit_cap_reduction: [47.20, 0]
    universal_credit: [14_753, 0]
