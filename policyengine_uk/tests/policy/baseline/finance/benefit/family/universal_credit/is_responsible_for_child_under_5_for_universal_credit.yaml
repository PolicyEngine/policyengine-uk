# UC Regs 2013 reg 4: a person is responsible for a child who normally lives
# with them; where a child lives with two or more people who are not a couple,
# only the one with main responsibility is. The model reads "normally lives
# with" as benefit-unit membership, so the claimant and any partner are
# responsible for their unit's children and no one else is.

- name: A lone parent with a 4-year-old
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 23
        is_claimant_or_partner: true
      child:
        age: 4
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    is_responsible_for_child_under_5_for_universal_credit: [true, false]

- name: A lone parent whose child is 5 is not responsible for a child under 5
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 23
        is_claimant_or_partner: true
      child:
        age: 5
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    is_responsible_for_child_under_5_for_universal_credit: [false, false]

- name: Both members of a couple are responsible for their baby
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      mother:
        age: 24
        is_claimant_or_partner: true
      father:
        age: 26
        is_claimant_or_partner: true
      baby:
        age: 0
    benunits:
      benunit:
        members: [mother, father, baby]
    households:
      household:
        members: [mother, father, baby]
  output:
    is_responsible_for_child_under_5_for_universal_credit: [true, true, false]

- name: A member of the unit who is not the claimant or partner is not responsible
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 45
        is_claimant_or_partner: true
      adult_son:
        age: 25
        is_claimant_or_partner: false
      young_sibling:
        age: 2
    benunits:
      benunit:
        members: [parent, adult_son, young_sibling]
    households:
      household:
        members: [parent, adult_son, young_sibling]
  output:
    is_responsible_for_child_under_5_for_universal_credit: [true, false, false]

# Reg 4(6)(a): a child looked after by a local authority is no one's
# responsibility.
- name: A foster carer is not responsible for a looked-after child
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      carer:
        age: 50
        is_claimant_or_partner: true
      foster_child:
        age: 3
        is_looked_after_by_local_authority: true
    benunits:
      benunit:
        members: [carer, foster_child]
    households:
      household:
        members: [carer, foster_child]
  output:
    is_responsible_for_child_under_5_for_universal_credit: [false, false]

- name: The age limit is a parameter
  period: 2026
  absolute_error_margin: 0
  input:
    gov.dwp.universal_credit.elements.housing.non_dep_deduction.young_child_age_limit: 6
    people:
      parent:
        age: 23
        is_claimant_or_partner: true
      child:
        age: 5
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    is_responsible_for_child_under_5_for_universal_credit: [true, false]
