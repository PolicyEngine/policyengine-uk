# The minimum income floor is the individual threshold of UC Regs 2013
# reg. 90(2), the National Minimum Wage rate for the person's age times their
# expected hours (35 a week, reg. 88), times 52 / 12 and rounded down to a
# whole pound (reg. 6(1A)(a)), converted to a net amount by deducting "such
# amount for income tax and national insurance contributions as the Secretary
# of State considers appropriate" (reg. 62(4)(b)). The model deducts the
# income tax and primary Class 1 NI the person would pay if the threshold were
# their only income, from employment. Annual amounts are 12 monthly amounts.
#
# Hand calculations use the rates the model holds for each year:
# - 2026: National Living Wage 12.71 an hour (21 and over), 10.85 (18 to 20);
#   personal allowance 12,570; rest-of-UK basic rate 20%; Scottish starter
#   rate 19% on the first 3,967 of taxable income, then basic rate 20% up to
#   16,956; primary Class 1 NI 8% above the primary threshold of 241.73 a
#   week (12,569.96 a year);
# - 2020: National Living Wage 8.72 an hour (25 and over); personal
#   allowance 12,500; basic rate 20%; primary Class 1 NI 12% above 183 a
#   week (9,516 a year).

- name: Individual threshold is the minimum wage for 35 hours a week, in whole pounds a month
  period: 2020
  absolute_error_margin: 0
  input:
    minimum_wage: 10
  output:
    # 10 x 35 x 52 / 12 = 1,516.67, rounded down to 1,516, times 12.
    uc_minimum_income_floor_gross: 18_192

- name: A whole-pound monthly threshold is not rounded down
  period: 2020
  absolute_error_margin: 0
  input:
    minimum_wage: 12
  output:
    # 12 x 35 x 52 / 12 = 1,820 exactly.
    uc_minimum_income_floor_gross: 21_840

- name: Net floor for a claimant aged 30 in England, 2026
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 30
    region: NORTH_EAST
  output:
    # 12.71 x 35 x 52 / 12 = 1,927.68, rounded down to 1,927 a month.
    uc_minimum_income_floor_gross: 23_124
    # (23,124 - 12,570) x 20%.
    uc_minimum_income_floor_income_tax: 2_110.80
    # (23,124 - 12,569.96) x 8%.
    uc_minimum_income_floor_national_insurance: 844.32
    # 23,124 - 2,110.80 - 844.32, or 1,680.74 a month.
    uc_minimum_income_floor: 20_168.88

- name: Net floor for a Scottish taxpayer uses Scottish income tax rates
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 30
    region: SCOTLAND
  output:
    uc_minimum_income_floor_gross: 23_124
    # Taxable 10,554: 3,967 x 19% + (10,554 - 3,967) x 20%
    # = 753.73 + 1,317.40.
    uc_minimum_income_floor_income_tax: 2_071.13
    uc_minimum_income_floor_national_insurance: 844.32
    # 23,124 - 2,071.13 - 844.32.
    uc_minimum_income_floor: 20_208.55

- name: Net floor for a claimant aged 19 uses the 18 to 20 minimum wage
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 19
    region: NORTH_EAST
  output:
    # 10.85 x 35 x 52 / 12 = 1,645.58, rounded down to 1,645 a month.
    uc_minimum_income_floor_gross: 19_740
    # (19,740 - 12,570) x 20%.
    uc_minimum_income_floor_income_tax: 1_434
    # (19,740 - 12,569.96) x 8%.
    uc_minimum_income_floor_national_insurance: 573.60
    uc_minimum_income_floor: 17_732.40

- name: No Class 1 NI is deducted for a person over State Pension age
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    region: NORTH_EAST
  output:
    uc_minimum_income_floor_gross: 23_124
    uc_minimum_income_floor_income_tax: 2_110.80
    # Primary Class 1 is not payable over pensionable age (SSCBA 1992 s. 6(3)).
    uc_minimum_income_floor_national_insurance: 0
    uc_minimum_income_floor: 21_013.20

- name: Net floor in 2020 uses that year's rates
  period: 2020
  absolute_error_margin: 0.01
  input:
    age: 30
    region: NORTH_EAST
  output:
    # 8.72 x 35 x 52 / 12 = 1,322.53, rounded down to 1,322 a month.
    uc_minimum_income_floor_gross: 15_864
    # (15,864 - 12,500) x 20%.
    uc_minimum_income_floor_income_tax: 672.80
    # (15,864 - 9,516) x 12%.
    uc_minimum_income_floor_national_insurance: 761.76
    uc_minimum_income_floor: 14_429.44
