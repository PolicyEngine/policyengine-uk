    uc_income_tax_on_earnings: [386, 0]

- name: Pension contributions paid after 75 are not relievable, so are not deducted
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 76
    employment_income: 15_000
    employee_pension_contributions: 1_000
  output:
    # No relief after 75 (FA 2004 s. 188(3)(a)): (15,000 - 12,570) x 20%.
    uc_income_tax_on_earnings: 486
    # Over State Pension age, so no Class 1 NI.
    uc_national_insurance_on_earnings: 0
    # 15,000 - 486, with the 1,000 of contributions not deducted.
    uc_individual_earned_income: 14_514

- name: A reform exempting pensions from income tax leaves the tax on earnings unchanged
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.earned_taxable_income_exclusions:
      - taxable_savings_interest_income
      - taxable_dividend_income
      - taxable_property_income
      - received_allowances_earned_income
      - marriage_allowance
      - taxable_pension_income
    age: 40
    employment_income: 20_000
    private_pension_income: 10_000
  output:
    # The pension is outside the taxed base, so it is not above earnings
    # either: (20,000 - 12,570) x 20%.
    income_tax: 1_486
    uc_income_tax_on_earnings: 1_486
