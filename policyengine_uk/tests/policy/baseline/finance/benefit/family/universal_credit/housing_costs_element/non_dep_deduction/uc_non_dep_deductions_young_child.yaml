# The exemption belongs to the non-dependant who is responsible for the child:
# the renter's own young child does not exempt the renter's non-dependants.
- name: A non-dependant grandparent is not responsible for the renter's toddler
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        is_household_head: true
        is_claimant_or_partner: true
      toddler:
        age: 2
      grandmother:
        age: 60
        is_claimant_or_partner: true
    benunits:
      renter_family:
        members: [parent, toddler]
      grandmother_family:
        members: [grandmother]
    households:
      household:
        members: [parent, toddler, grandmother]
  output:
    is_responsible_for_child_under_5_for_universal_credit: [true, false, false]
    uc_individual_non_dep_deduction: [0, 0, 1_158.60]
    uc_non_dep_deductions: [1_158.60, 0]

- name: An adult son in the renter's benefit unit is not responsible for his young sibling
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        is_household_head: true
        is_claimant_or_partner: true
      son:
        age: 25
        is_claimant_or_partner: false
      sibling:
        age: 2
    benunits:
      benunit:
        members: [parent, son, sibling]
    households:
      household:
        members: [parent, son, sibling]
  output:
    is_benefit_unit_non_dependant_for_universal_credit: [false, true, false]
    uc_individual_non_dep_deduction: [0, 1_158.60, 0]
    uc_non_dep_deductions: 1_158.60

- name: The housing costs element is not reduced for a non-dependant lone parent with a baby
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandmother:
        age: 55
        is_household_head: true
        is_claimant_or_partner: true
      mother:
        age: 23
        is_claimant_or_partner: true
      baby:
        age: 1
    benunits:
      renter:
        members: [grandmother]
        benunit_tenure_type: RENT_FROM_COUNCIL
        benunit_rent: 6_000
      non_dependant_family:
        members: [mother, baby]
    households:
      household:
        members: [grandmother, mother, baby]
  output:
    uc_housing_costs_element: [6_000, 0]
