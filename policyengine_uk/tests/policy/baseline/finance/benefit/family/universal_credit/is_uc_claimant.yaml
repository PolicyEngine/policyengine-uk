- name: Case 1, fallback distinguishes two parents and an older qualifying child.
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_parent: true
      person2:
        age: 39
        is_parent: true
      person3:
        age: 18
        is_in_non_advanced_education: true
    benunits:
      benunit:
        members: [person1, person2, person3]
  output:
    is_uc_claimant: [true, true, false]

- name: Case 2, one supplied parent flag does not erase a genuine adult partner.
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_parent: true
      person2:
        age: 39
      person3:
        age: 5
    benunits:
      benunit:
        members: [person1, person2, person3]
  output:
    is_uc_claimant: [true, true, false]

- name: Case 3, an identified young parent remains a claimant while in education.
  period: 2025
  input:
    people:
      person1:
        age: 18
        is_parent: true
        is_in_non_advanced_education: true
      person2:
        age: 25
        is_parent: true
      person3:
        age: 1
    benunits:
      benunit:
        members: [person1, person2, person3]
  output:
    is_uc_claimant: [true, true, false]

- name: Case 4, explicit source roles override an age-only fallback.
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_uc_claimant: true
      person2:
        age: 19
        is_uc_claimant: false
    benunits:
      benunit:
        members: [person1, person2]
  output:
    is_uc_claimant: [true, false]

- name: Case 5, the head of a young person's own benefit unit is a claimant.
  period: 2025
  input:
    age: 17
    is_in_non_advanced_education: true
  output:
    is_uc_claimant: true

- name: Case 6, an adult child without qualifying education is neither a partner nor a UC child.
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_parent: true
      person2:
        age: 18
    benunits:
      benunit:
        members: [person1, person2]
  output:
    # The default (higher) education input does not establish a UC qualifying
    # young person. An 18-year-old 22 years younger than the head is presumed
    # the parent's child, not their partner, so the parent claims alone
    # (previously the two were treated as joint claimants).
    is_child_or_qualifying_young_person_for_universal_credit: [false, false]
    is_uc_claimant: [true, false]
