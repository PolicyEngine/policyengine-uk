- name: Work allowance with housing - 2025
  period: 2025
  absolute_error_margin: 100
  input:
    uc_housing_costs_element: 1
    uc_limited_capability_for_WRA: true
  output:
    uc_work_allowance: 4_924

# Reg. 22(2) table, 2026-27: higher work allowance £710.00 a month (no housing
# costs element), lower work allowance £427.00 (with one).

- name: Higher work allowance for a claimant with limited capability and no housing costs element, 2026-27
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    uc_housing_costs_element: 0
    uc_limited_capability_for_WRA: true
  output:
    uc_work_allowance: 8_520 # 710 * 12

- name: Lower work allowance for a claimant with limited capability and a housing costs element, 2026-27
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    uc_housing_costs_element: 1
    uc_limited_capability_for_WRA: true
  output:
    uc_work_allowance: 5_124 # 427 * 12

# UC Regs 2013 Sch 1 paras 3(h) and (i) leave rent for specified or temporary
# accommodation out of rent payments, so the award has no housing costs element
# and the higher work allowance applies (reg 22(2)(a)).
- name: A claimant with earnings and limited capability in temporary accommodation gets the higher work allowance, 2026-27
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        employment_income: 12_000
        uc_limited_capability_for_WRA: true
        housing_benefit_reported: 8_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [claimant]
        region: NORTH_WEST
        tenure_type: RENT_FROM_COUNCIL
        rent: 8_000
  output:
    uc_housing_costs_element: 0
    uc_work_allowance: 8_520 # 710 * 12
    # Housing Benefit pays the rent beside Universal Credit (SI 2014/1230
    # reg 8(3)), passported by Universal Credit.
    housing_benefit: 8_000

- name: The same claimant outside that accommodation gets the lower work allowance, 2026-27
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        employment_income: 12_000
        uc_limited_capability_for_WRA: true
        housing_benefit_reported: 8_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
    households:
      household:
        members: [claimant]
        region: NORTH_WEST
        tenure_type: RENT_FROM_COUNCIL
        rent: 8_000
  output:
    uc_housing_costs_element: 8_000
    uc_work_allowance: 5_124 # 427 * 12
    housing_benefit: 0
