- name: Single adult not in work
  period: 2020
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 30
        in_work: false
  output:
    uc_childcare_work_condition: false

- name: Single adult in work
  period: 2020
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 30
        in_work: true
  output:
    uc_childcare_work_condition: true

- name: Head of household, child in work - ineligible
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      person1:
        in_work: false
        age: 40
      person2:
        in_work: true
        age: 17
  output:
    uc_childcare_work_condition: false

- name: Couple, one person in work
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      person1:
        in_work: false
        age: 40
      person2:
        in_work: true
        age: 39
    benunits:
      benunit:
        members: [person1, person2]
  output:
    uc_childcare_work_condition: false

- name: Couple, both adults in work
  period: 2024
