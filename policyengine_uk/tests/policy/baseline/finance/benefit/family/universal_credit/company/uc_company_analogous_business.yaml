# The Universal Credit Regulations 2013 reg. 77 (company analogous to a
# partnership or one person business), as explained in DWP's Advice for
# Decision Making Chapter H4, paras. H4360-H4377. Expected values are worked
# by hand from the regulation; the capital cases use the same figures as the
# Axiom encoding's tests (rulespec-uk uk/regulations/uksi/2013/376/77.test.yaml).
# Company earnings are not taxable income, so no income tax or National
# Insurance comes off them, and other earnings in these cases are below the
# personal allowance and the primary threshold, so earned income before the
# floor equals gross earnings.

- name: Sole owner of a trading company whose main employment it is has the floor applied to the company income
  # H4374-H4375 and Example 2 (Claudia): the company's income is the owner's
  # self-employed earnings (reg. 77(3)(b)) and, as the trade is their main
  # employment, they are treated as gainfully self-employed so the minimum
  # income floor applies (reg. 77(3)(c)). max(6,000, 20,000) = 20,000.
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_is_main_employment: true
    owned_company_income_share: 6_000
    uc_minimum_income_floor: 20_000
  output:
    uc_company_owner_treatment_applies: true
    uc_company_self_employed_earnings: 6_000
    uc_company_gainful_self_employment: true
    uc_mif_applies: true
    uc_individual_earned_income_before_mif: 6_000
    uc_individual_earned_income: 20_000

- name: A partner-like shareholder in a start-up period has only their share of the company income counted
  # H4376 Example 1 (Ezgjan): a 50% owner with meaningful influence, working
  # 60 hours a week with no salary, in a start-up period. Reg. 62(5) keeps
  # the floor off during the start-up period; their half of 24,000 counts.
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_is_main_employment: true
    owned_company_income_share: 24_000 * 0.5
    uc_is_in_startup_period: true
    uc_minimum_income_floor: 20_000
  output:
    uc_company_gainful_self_employment: true
    uc_mif_applies: false
    uc_individual_earned_income: 12_000

- name: Company income is counted in addition to the owner's pay as its director
  # Reg. 77(4): 9,000 of director's pay (employed earnings) plus 15,000 of
  # company income is 24,000, above the 20,000 floor.
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    employment_income: 9_000
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_is_main_employment: true
    owned_company_income_share: 15_000
    uc_minimum_income_floor: 20_000
  output:
    uc_company_self_employed_earnings: 15_000
    uc_individual_earned_income: 24_000

- name: When the company is not the owner's main employment its income counts but no floor applies
  # Reg. 77(3)(b) applies to any owner of a trading company; reg. 77(3)(c)
  # only when the trade is the main employment. 12,000 + 1,000 = 13,000,
  # below the 20,000 floor, which does not apply.
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    employment_income: 12_000
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_is_main_employment: false
    owned_company_income_share: 1_000
    uc_minimum_income_floor: 20_000
  output:
    uc_company_gainful_self_employment: false
    uc_mif_applies: false
    uc_individual_earned_income: 13_000

- name: The company income is tapered like other earnings
  # A single claimant with no children and no limited capability for work has
  # no work allowance (reg. 22). Earned income is the 8,000 floor (above the
  # 6,000 of company income) and the taper takes 55% of it (reg. 22(1)(b)),
  # which is less than the maximum amount, so the reduction is not capped.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_is_main_employment: true
        owned_company_income_share: 6_000
        uc_minimum_income_floor: 8_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
  output:
    uc_earned_income: 8_000
    uc_income_reduction: 8_000 * 0.55

- name: A property company gives capital but no earnings
  # H4365-H4367 (Pablo): a major shareholder in a company letting a seaside
  # cottage. The shares (90,000, held within corporate_wealth) are disregarded
  # and the company's capital (the 120,000 cottage) is counted instead
  # (reg. 77(2)). Reg. 77(3), including the trade asset disregard and the
  # earnings rule, applies only to a trade (H4376). 2,000 + 90,000 - 90,000
  # + 120,000 = 122,000.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_property_business: true
        is_engaged_in_owned_company_trade: true
        owned_company_is_main_employment: true
        owned_company_income_share: 10_000
        owned_company_capital: 120_000
        owned_company_trade_assets: 120_000
        owned_company_holding_value: 90_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 2_000
        corporate_wealth: 90_000
  output:
    uc_company_owner_treatment_applies: [true]
    uc_company_self_employed_earnings: [0]
    uc_company_gainful_self_employment: [false]
    uc_company_capital: [120_000]
    uc_company_holding_disregard: [90_000]
    uc_individual_earned_income: [0]
    uc_assessable_capital: 122_000

- name: Trade assets are disregarded while the owner works in the trade
  # Reg. 77(2) and (3)(a); Axiom test trade_company_main_employment_treats_capital_income_and_mif.
  # Company capital 100,000 less 40,000 of assets used wholly and
  # exclusively for the trade = 60,000; the 25,000 holding is disregarded.
  # 3,000 + 25,000 - 25,000 + 60,000 = 63,000.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        is_engaged_in_owned_company_trade: true
        owned_company_capital: 100_000
        owned_company_trade_assets: 40_000
        owned_company_holding_value: 25_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 3_000
        corporate_wealth: 25_000
  output:
    uc_company_capital: [60_000]
    uc_company_holding_disregard: [25_000]
    uc_assessable_capital: 63_000

- name: Trade assets count when the owner does not work in the trade
  # Reg. 77(3)(a) disregards trade assets only "while they are engaged in
  # activities in the course of that trade"; Axiom test
  # trade_assets_not_disregarded_when_person_not_engaged_in_trade_activities.
  # 90,000 counted; 20,000 holding disregarded. 20,000 - 20,000 + 90,000.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        is_engaged_in_owned_company_trade: false
        owned_company_capital: 90_000
        owned_company_trade_assets: 30_000
        owned_company_holding_value: 20_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        corporate_wealth: 20_000
  output:
    uc_company_capital: [90_000]
    uc_assessable_capital: 90_000

- name: Income that is employed earnings through an intermediary from the main employment takes the owner out of the rule
  # Reg. 77(5): nothing in reg. 77 applies, so the shares count as ordinary
  # capital and the company income is not self-employed earnings. Axiom test
  # intermediary_employed_earnings_main_employment_excludes_regulation.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_intermediary_earnings_chapter: CHAPTER_8
        owned_company_intermediary_earnings_from_main_employment: true
        owned_company_is_main_employment: true
        is_engaged_in_owned_company_trade: true
        owned_company_income_share: 36_000
        owned_company_capital: 100_000
        owned_company_trade_assets: 40_000
        owned_company_holding_value: 25_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        corporate_wealth: 25_000
  output:
    uc_company_intermediary_exclusion_applies: [true]
    uc_company_owner_treatment_applies: [false]
    uc_company_self_employed_earnings: [0]
    uc_company_gainful_self_employment: [false]
    uc_mif_applies: [false]
    uc_company_capital: [0]
    uc_company_holding_disregard: [0]
    # Outside reg. 77 the holding is ordinary shares, valued at 90% for the
    # expenses of sale (reg. 49(1)(a)).
    uc_assessable_capital: 22_500

- name: An investor in a company with many shareholders is not treated as its owner
  # H4364: such a shareholder has no influence over the running of the
  # company, so reg. 77 does not apply and the shares are ordinary capital
  # (reg. 46). Company facts recorded for them have no effect.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: false
        owned_company_carries_on_trade: true
        owned_company_is_main_employment: true
        owned_company_income_share: 50_000
        owned_company_capital: 1_000_000
        owned_company_holding_value: 12_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        corporate_wealth: 12_000
  output:
    uc_company_owner_treatment_applies: [false]
    uc_individual_earned_income: [0]
    # Ordinary shares, valued at 90% for the expenses of sale (reg. 49(1)(a)).
    uc_assessable_capital: 10_800

- name: A company carrying on neither a trade nor a property business is outside the rule
  # Reg. 77(1) needs a company "carrying on a trade or a property business".
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_capital: 50_000
        owned_company_holding_value: 10_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        corporate_wealth: 10_000
  output:
    uc_company_owner_treatment_applies: [false]
    # Ordinary shares, valued at 90% for the expenses of sale (reg. 49(1)(a)).
    uc_assessable_capital: 9_000

- name: Each partner's company is attributed to the couple's capital
  # Joint claimants' capital is combined against one limit (Welfare Reform
  # Act 2012 s. 5(2)(a); UC Regs 2013 reg. 18(1)(b)). Two 50% owners of the same
  # trading company, neither working in it: each is treated as holding half
  # of the 30,000 company capital and each 5,000 holding is disregarded.
  # 10,000 + 15,000 + 15,000 - 5,000 - 5,000 = 30,000.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      a:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_capital: 15_000
        owned_company_holding_value: 5_000
      b:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_capital: 15_000
        owned_company_holding_value: 5_000
    benunits:
      benunit:
        members: [a, b]
    households:
      household:
        members: [a, b]
        corporate_wealth: 10_000
  output:
    uc_assessable_capital: 30_000

- name: The company's capital can take the owner over the capital limit
  # 1,000 of savings and a disregarded 1,000 holding, but the company holds
  # 20,000 of cash not used wholly and exclusively for its trade: assessable
  # capital 1,000 + 1,000 - 1,000 + 20,000 = 21,000 exceeds the 16,000 limit
  # (reg. 18(1); Welfare Reform Act 2012 s. 5(1)(a)), so no award.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        is_engaged_in_owned_company_trade: true
        owned_company_capital: 20_000
        owned_company_holding_value: 1_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 1_000
        corporate_wealth: 1_000
  output:
    uc_assessable_capital: 21_000
    is_uc_eligible: false
    universal_credit: 0

- name: Since November 2018 intermediary earnings exclude only when they come from the main employment
  # Reg. 77(5) as substituted by SI 2018/1129 reg. 3(5) from 28 November 2018:
  # Chapter 8 income from a side engagement does not take a trading-company
  # owner out of the rule.
  period: 2026
  absolute_error_margin: 0
  input:
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_intermediary_earnings_chapter: CHAPTER_8
    owned_company_intermediary_earnings_from_main_employment: false
    owned_company_income_share: 10_000
  output:
    uc_company_intermediary_exclusion_applies: false
    uc_company_owner_treatment_applies: true
    uc_company_self_employed_earnings: 10_000

- name: Before November 2018 any Chapter 8 or 9 intermediary earnings excluded the owner
  # Reg. 77(5) as made: "This regulation does not apply where the person
  # derives income from the company that is employed earnings by virtue of
  # Chapter 8 ... or Chapter 9 ... of Part 2 of ITEPA", with no main
  # employment condition.
  period: 2017
  absolute_error_margin: 0
  input:
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_intermediary_earnings_chapter: CHAPTER_9
    owned_company_intermediary_earnings_from_main_employment: false
    owned_company_income_share: 10_000
  output:
    uc_company_intermediary_exclusion_applies: true
    uc_company_owner_treatment_applies: false
    uc_company_self_employed_earnings: 0

- name: Before November 2018 Chapter 10 earnings did not exclude the owner
  # Chapter 10 was added to reg. 77(5) only from 28 November 2018.
  period: 2017
  absolute_error_margin: 0
  input:
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_intermediary_earnings_chapter: CHAPTER_10
    owned_company_intermediary_earnings_from_main_employment: true
    owned_company_income_share: 10_000
  output:
    uc_company_intermediary_exclusion_applies: false
    uc_company_owner_treatment_applies: true
    uc_company_self_employed_earnings: 10_000

- name: A company loss makes self-employed earnings nil and is not set against the owner's pay
  # Reg. 57(2): if the result of steps 1 to 3 "is nil or a negative amount,
  # the amount of the person's self-employed earnings ... is nil". A 10,000
  # loss leaves the 12,000 of director's pay intact (reg. 77(4)).
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    employment_income: 12_000
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_income_share: -10_000
  output:
    uc_company_self_employed_earnings: -10_000
    uc_individual_earned_income: 12_000

- name: A company loss is set against the profit of the owner's own trade
  # Reg. 77(1) treats the owner as the company's sole owner, so its trade is
  # one more trade they carry on. Reg. 57(2) step 2 adds together the profit
  # or loss of each trade before the nil rule: 8,000 of profit from their own
  # trade less the company's 3,000 loss is 5,000. Start-up period, so no floor.
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    self_employment_income: 8_000
    uc_is_in_startup_period: true
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_income_share: -3_000
  output:
    uc_individual_earned_income_before_mif: 5_000
    uc_individual_earned_income: 5_000

- name: Working in the trade as one's main employment is engagement in it
  # Reg. 77(3)(a) disregards trade assets "while they are engaged in
  # activities in the course of that trade"; a person whose main employment
  # is that trade is. 100,000 - 40,000 = 60,000 treated as possessed.
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    stands_as_sole_owner_or_partner_of_company: true
    owned_company_carries_on_trade: true
    owned_company_is_main_employment: true
    is_engaged_in_owned_company_trade: false
    owned_company_capital: 100_000
    owned_company_trade_assets: 40_000
  output:
    uc_company_capital: 60_000

- name: In a household of two benunits the disregarded holding leaves the household pool before it is shared
  # The household has 10,000 of savings and the owner's 30,000 of shares
  # (within corporate_wealth). Reg. 77(2) disregards the shares, so 10,000
  # remains, shared between the two unreported adults: 5,000 each. The
  # company has no other capital.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      owner:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_holding_value: 30_000
      lodger:
        age: 30
    benunits:
      owner_unit:
        members: [owner]
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [owner, lodger]
        savings: 10_000
        corporate_wealth: 30_000
  output:
    # The 30,000 holding leaves the pool at the 90% at which corporate_wealth
    # is counted (reg. 49(1)(a)).
    household_uc_pool_company_holdings: 27_000
    uc_assessable_capital: [5_000, 5_000]

- name: A benunit that reports its capital has its own holding taken off what it reports
  # Reported capital of 50,000 includes the 30,000 holding: 20,000 remains,
  # plus 15,000 of company capital not used in the trade = 35,000.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_holding_value: 30_000
        owned_company_capital: 15_000
    benunits:
      benunit:
        members: person
        uc_reported_capital: 50_000
    households:
      household:
        members: person
  output:
    # The complete override is a countable figure, so the holding inside it
    # is counted at 90% (reg. 49(1)(a)) and comes off at that value:
    # 50,000 - 27,000 + 15,000 of company capital.
    uc_assessable_capital: 38_000

- name: A dependant's company earnings are not the claimant's earned income
  # Reg. 22(1)(b) deducts "the claimant's earned income (or, in the case of
  # joint claimants, their combined earned income)". A qualifying young
  # person who owns a trading company is not a claimant: their 20,000 of
  # company income is their own self-employed earnings but does not reduce
  # the award, and no floor applies to them.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
      student:
        age: 17
        is_in_non_advanced_education: true
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_income_share: 20_000
    benunits:
      benunit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
  output:
    is_uc_assessed_claimant: [true, false]
    uc_company_self_employed_earnings: [0, 20_000]
    uc_mif_applies: [false, false]
    uc_earned_income: 0

- name: A holding is disregarded only from the corporate wealth that holds it
  # Reg. 77(2) disregards "the value of the person's holding in the
  # company", which is shares, so it comes out of the household's
  # corporate_wealth and cannot remove savings. A 10,000 holding entered with
  # 10,000 of savings and no corporate_wealth leaves the 10,000 of savings.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 40
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_holding_value: 10_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 10_000
  output:
    household_uc_pool_company_holdings: 0
    uc_assessable_capital: 10_000

- name: Tax and National Insurance on a trade a company loss cancels are not taken off pay
  # Reg. 57(2): the profit or loss of each trade is added together (step 2),
  # then income tax and National Insurance paid in respect of any trade come
  # off (step 3), and a nil or negative result is nil. 20,000 of profit from
  # the owner's own trade and the company's 20,000 loss make 0. The trade's
  # income tax is (12,000 + 20,000 - 12,570) x 20% = 3,886, all of it on the
  # trade because the 12,000 of pay is within the personal allowance, and
  # its Class 4 contributions are (20,000 - 12,570) x 6% = 445.80; both
  # stay inside the nil trading result. Pay is below the primary threshold,
  # so employed earnings are 12,000 (reg. 55(5)). In a start-up period, so
  # no floor. 55% of 12,000 is more than the maximum amount, so no award.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 12_000
        self_employment_income: 20_000
        uc_is_in_startup_period: true
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_income_share: -20_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
  output:
    uc_income_tax_on_trade: [3_886]
    uc_national_insurance_on_trade: [445.80]
    uc_individual_earned_income_before_mif: [12_000]
    universal_credit: 0

- name: Without the company loss the same tax and National Insurance come off the trade
  # The control for the case above: 12,000 + 20,000 - 3,886 - 445.80.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 12_000
    self_employment_income: 20_000
    uc_is_in_startup_period: true
  output:
    uc_income_tax_on_trade: 3_886
    uc_national_insurance_on_trade: 445.80
    uc_individual_earned_income_before_mif: 27_668.20

- name: A dependant's holding in a benunit that reports its capital leaves the household pool
  # The parent reports nil capital, so their benunit's capital is that
  # figure; a dependant's capital is not theirs, and the 17-year-old's 12,000
  # holding (all of the household's corporate_wealth) is disregarded (reg.
  # 77(2)) and is nobody's to count. So it leaves the pool shared by the
  # unrelated adult, who does not report: 8,000 + 12,000 - 12,000 = 8,000.
  # The dependant's 25,000 of company capital is not a claimant's.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
      student:
        age: 17
        is_in_non_advanced_education: true
        stands_as_sole_owner_or_partner_of_company: true
        owned_company_carries_on_trade: true
        owned_company_holding_value: 12_000
        owned_company_capital: 25_000
      lodger:
        age: 40
    benunits:
      family:
        members: [parent, student]
        uc_reported_capital: 0
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [parent, student, lodger]
        savings: 8_000
        corporate_wealth: 12_000
  output:
    # The 12,000 holding leaves the pool at the 90% at which corporate_wealth
    # is counted (reg. 49(1)(a)).
    household_uc_pool_company_holdings: 10_800
    uc_assessable_capital: [0, 8_000]
