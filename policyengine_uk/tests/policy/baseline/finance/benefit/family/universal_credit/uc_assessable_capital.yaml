- name: Universal Credit reported capital overrides unclassified other real estate
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 40
      second:
        age: 40
      partner:
        age: 40
    benunits:
      reporting:
        members: first
        uc_reported_capital: 4_000
      unreported:
        members: [second, partner]
    households:
      household:
        members: [first, second, partner]
        other_property_value: 18_000
  output:
    # The override consumes 4,000 of the net pool; the other unit gets its residual.
    uc_assessable_capital: [4_000, 12_200]

- name: Universal Credit deducts sale expenses before combined secured debt for second homes and buy-to-let
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    # Second homes of 50,000 and buy-to-let of 70,000 share one component.
    other_residential_property_value: 120_000
    other_residential_property_secured_debt: 80_000
  output:
    # max(0, 90% of 120,000 - 80,000); no separate buy-to-let input.
    uc_assessable_capital: 28_000

- name: Universal Credit floors combined property equity at zero for second homes and buy-to-let
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    # Second homes of 50,000 and buy-to-let of 70,000 share one component.
    other_residential_property_value: 120_000
    other_residential_property_secured_debt: 120_000
  output:
    # max(0, 90% of 120,000 - 120,000); no separate buy-to-let input.
    uc_assessable_capital: 0

- name: A financial report overrides overseas property but retains domestic property capital
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    benunit_reported_capital: 0
    overseas_property_value: 18_000
    other_residential_property_value: 10_000
  output:
    # The financial observation replaces the new category's proxy, while the
    # independent domestic property pool retains 90% of the 10,000 stock.
    uc_property_capital: 9_000
    uc_assessable_capital: 9_000

- name: A financial report overrides unclassified other property but retains domestic property capital
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    benunit_reported_capital: 0
    other_property_value: 18_000
    non_residential_property_value: 10_000
  output:
    # The financial observation replaces the new category's proxy, while the
    # independent domestic property pool retains 90% of the 10,000 stock.
    uc_property_capital: 9_000
    uc_assessable_capital: 9_000
