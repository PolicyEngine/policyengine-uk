- name: Before 23 September 2020 an established trade had no start-up period on the move
  period: 2020
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 30
        self_employment_income: 3_000
      child:
        age: 3
  output:
    # Reg. 63(1)(a) as made: "the claimant has begun to carry on the trade
    # ... in the 12 months preceding the beginning of that assessment
    # period". A new trade is uc_is_in_startup_period.
    uc_work_related_group_apart_from_earnings: [ALL_REQUIREMENTS, NOT_A_CLAIMANT]
    uc_is_in_startup_period_on_entering_all_requirements_group: [false, false]
    uc_mif_applies: [true, false]

