- name: Universal Credit in the start-up period, lone parent of a three-year-old
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        self_employment_income: 6_000
      child:
        age: 3
  output:
    uc_individual_earned_income_before_mif: [6_000, 0]
    uc_individual_earned_income: [6_000, 0]
    # 6,000 is below the work allowance without housing costs, 710 x 12.
    uc_earned_income: 0
    # 424.90 x 12 + 303.94 x 12.
    uc_maximum_amount: 8_746.08
    universal_credit: 8_746.08

- name: Universal Credit after the start-up period, lone parent of a four-year-old
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        self_employment_income: 6_000
      child:
        age: 4
  output:
    uc_individual_earned_income_before_mif: [6_000, 0]
    # The floor at 30 expected hours: 12.71 x 30 x 52 = 19,827.60, less
    # income tax (19,827.60 - 12,570) x 20% = 1,451.52 and Class 4 National
    # Insurance (19,827.60 - 12,570) x 6% = 435.46.
    uc_individual_earned_income: [17_940.62, 0]
    # Less the work allowance of 710 x 12 = 8,520.
    uc_earned_income: 9_420.62
    uc_maximum_amount: 8_746.08
    # 8,746.08 - 0.55 x 9,420.62.
    universal_credit: 3_564.74
