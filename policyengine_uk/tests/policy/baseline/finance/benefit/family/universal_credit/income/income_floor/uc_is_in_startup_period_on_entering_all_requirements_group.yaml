- name: Couple, both self-employed, only the responsible carer moves into the group
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      carer:
        age: 30
        self_employment_income: 3_000
        hours_worked: 832
      partner:
        age: 32
        self_employment_income: 3_000
        hours_worked: 1_820
      child:
        age: 3
  output:
    # The partner who works fewer hours is the responsible carer by default.
    # The other partner was already in the all work-related requirements
    # group, so their gainful self-employment was decided before.
    uc_is_responsible_carer: [true, false, false]
    uc_is_in_startup_period_on_entering_all_requirements_group: [true, false, false]
    uc_mif_applies: [false, true, false]

