# UC Regs 2013 reg. 63(1): a start-up period "is a period of 12 months and
# applies from the beginning of the assessment period in which the Secretary
# of State determines that a claimant is in gainful self-employment where (a)
# regulation 62 (minimum income floor) has not previously applied to the
# claimant in relation to the trade ... (whether in relation to the current
# award or a previous award)". Reg. 62(5): no floor in a start-up period.
#
# DWP, Self-employed and gainfully self-employed: Guidance V22.0: claimants
# in the Work Preparation, Work Focused Interview only or No Work-related
# Requirements regimes "cannot be found gainfully self-employed" (p. 3);
# those who move into the Intensive Work Search regime "(for example, due to
# a change in their youngest child's age)" have a Gateway Interview, and "If
# the claimant is found to be gainfully self-employed, either the Start-up
# Period or the Minimum Income Floor will be applied" (p. 11).
#
# Until 22 September 2020 reg. 63(1)(a) required a trade begun in the 12
# months before the decision. Parameters for a year are read at 30 April, so
# the route applies from 2021.

- name: Lone parent whose youngest child is 3 is in a start-up period
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 30
        self_employment_income: 3_000
      child:
        age: 3
  output:
    uc_work_related_group_apart_from_earnings: [ALL_REQUIREMENTS, NOT_A_CLAIMANT]
    uc_is_in_startup_period_on_entering_all_requirements_group: [true, false]
    uc_mif_applies: [false, false]

- name: Child aged 2, the responsible carer is still in the work preparation group
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 30
        self_employment_income: 3_000
      child:
        age: 2
  output:
    uc_is_in_startup_period_on_entering_all_requirements_group: [false, false]
    uc_mif_applies: [false, false]

- name: Child aged 4, the start-up period has ended and the floor applies
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 30
        self_employment_income: 3_000
      child:
        age: 4
  output:
    uc_is_in_startup_period_on_entering_all_requirements_group: [false, false]
    uc_mif_applies: [true, false]

- name: An older sibling does not change the youngest child's age
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 35
        self_employment_income: 3_000
      older:
        age: 9
      youngest:
        age: 3
  output:
    uc_is_in_startup_period_on_entering_all_requirements_group: [true, false, false]
    uc_mif_applies: [false, false, false]

- name: Barred where the floor or an earlier start-up period has applied before
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 30
        self_employment_income: 3_000
        uc_startup_period_barred_by_earlier_floor_or_startup: true
      child:
        age: 3
  output:
    # Reg. 63(1)(a) and (2). DWP guidance V22.0 p. 4: a floor applied before
    # is removed on the move into a lower regime, and the guidance's p. 11
    # applies "either the Start-up Period or the Minimum Income Floor" after
    # the move back.
    uc_is_in_startup_period_on_entering_all_requirements_group: [false, false]
    uc_mif_applies: [true, false]

