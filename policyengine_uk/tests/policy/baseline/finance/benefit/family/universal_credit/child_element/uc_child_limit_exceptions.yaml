# UC Regs 2013 reg 24A(1) and Schedule 12, as in force on 6 April 2025. In
# 2025-26 the child element is 292.81 a month, 292.81 x 12 = 3,513.72 a year.
# Every child here is born after 6 April 2017, so none is transitionally
# protected and none carries the higher first child amount.
#
# Reg 24A(1)(za): the element is available for a child with the adoption
# (para 3) or non-parental caring arrangements (para 4) exception, and reg
# 24B(2A) leaves that child out of the order of children. Reg 24A(1)(b)(ii):
# a third or later child in the order gets the element if the multiple births
# (para 2), non-consensual conception (para 5) or continuation (para 6)
# exception applies; that child keeps their place in the order.

- name: Without an exception, the third child born after 6 April 2017 gets no child element
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_benunit_head: true
        is_parent: true
      child_1:
        age: 7
        date_of_birth: 20180501
      child_2:
        age: 6
        date_of_birth: 20190601
      child_3:
        age: 4
        date_of_birth: 20210701
    benunits:
      benunit:
        members: [parent, child_1, child_2, child_3]
  output:
    uc_child_limit_position: [-1, 1, 2, 3]
    uc_individual_child_element: [0, 3_513.72, 3_513.72, 0]

- name: Multiple births (Sch 12 para 2) - the second twin gets the child element as the third child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_benunit_head: true
        is_parent: true
      child_1:
        age: 7
        date_of_birth: 20180501
      # Listed first, but with the exception it is ordered after its twin
      # (reg 24B(2)), so the twin without it is the second child.
      twin_with_exception:
        age: 4
        date_of_birth: 20210701
        child_limit_multiple_birth_exception: true
      twin:
        age: 4
        date_of_birth: 20210701
    benunits:
      benunit:
        members: [parent, child_1, twin_with_exception, twin]
  output:
    uc_child_limit_position: [-1, 1, 3, 2]
    uc_individual_child_element: [0, 3_513.72, 3_513.72, 3_513.72]

- name: Adoption (Sch 12 para 3) - the adopted child is left out of the order, so two birth children fill the limit
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_benunit_head: true
        is_parent: true
      adopted:
        age: 7
        date_of_birth: 20180101
        child_limit_adoption_exception: true
      child_1:
        age: 6
        date_of_birth: 20190301
      child_2:
        age: 5
        date_of_birth: 20200401
      child_3:
        age: 4
        date_of_birth: 20210501
    benunits:
      benunit:
        members: [parent, adopted, child_1, child_2, child_3]
  output:
    # Without the exception the adopted child would be first and child_2
    # third. With it, child_1 and child_2 are first and second, and child_3
    # is third with no exception: 3 x 3,513.72 = 10,541.16.
    uc_child_limit_disregarded: [false, true, false, false, false]
    uc_child_limit_position: [-1, -1, 1, 2, 3]
    uc_individual_child_element: [0, 3_513.72, 3_513.72, 3_513.72, 0]
    uc_child_element: 10_541.16

- name: Non-parental caring arrangements (Sch 12 para 4) - a grandchild in kinship care is left out of the order
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_benunit_head: true
        is_parent: true
      child_1:
        age: 7
        date_of_birth: 20180501
      child_2:
        age: 6
        date_of_birth: 20190601
      kinship_child:
        age: 3
        date_of_birth: 20220801
        child_limit_non_parental_caring_exception: true
    benunits:
      benunit:
        members: [parent, child_1, child_2, kinship_child]
  output:
    uc_child_limit_position: [-1, 1, 2, -1]
    uc_individual_child_element: [0, 3_513.72, 3_513.72, 3_513.72]

- name: Non-consensual conception (Sch 12 para 5) - the third child gets the element and keeps their place, so the fourth does not
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_benunit_head: true
        is_parent: true
      child_1:
        age: 7
        date_of_birth: 20180501
      child_2:
        age: 6
        date_of_birth: 20190601
      child_3:
        age: 5
        date_of_birth: 20200701
        child_limit_non_consensual_conception_exception: true
      child_4:
        age: 3
        date_of_birth: 20220801
    benunits:
      benunit:
        members: [parent, child_1, child_2, child_3, child_4]
  output:
    uc_child_limit_position: [-1, 1, 2, 3, 4]
    uc_individual_child_element: [0, 3_513.72, 3_513.72, 3_513.72, 0]

- name: Continuation of an existing exception (Sch 12 para 6) - a step-parent's third child gets the element
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_benunit_head: true
        is_parent: true
      child_1:
        age: 7
        date_of_birth: 20180501
      child_2:
        age: 6
        date_of_birth: 20190601
      stepchild:
        age: 4
        date_of_birth: 20210701
        child_limit_continuation_exception: true
    benunits:
      benunit:
        members: [parent, child_1, child_2, stepchild]
  output:
    uc_child_limit_position: [-1, 1, 2, 3]
    uc_individual_child_element: [0, 3_513.72, 3_513.72, 3_513.72]

- name: An exception for the first or second child changes nothing
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_benunit_head: true
        is_parent: true
      child_1:
        age: 7
        date_of_birth: 20180501
      child_2:
        age: 6
        date_of_birth: 20190601
        child_limit_non_consensual_conception_exception: true
      child_3:
        age: 4
        date_of_birth: 20210701
    benunits:
      benunit:
        members: [parent, child_1, child_2, child_3]
  output:
    uc_individual_child_element: [0, 3_513.72, 3_513.72, 0]

# Reg 24A was revoked from 6 April 2026 (UC (Removal of Two Child Limit) Act
# 2026), so from 2026-27 every child gets the element, 303.94 x 12 = 3,647.28,
# with or without an exception.
- name: From 2026-27 the flags make no difference, as there is no limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 36
        is_benunit_head: true
        is_parent: true
      adopted:
        age: 8
        date_of_birth: 20180101
        child_limit_adoption_exception: true
      child_1:
        age: 7
        date_of_birth: 20190301
      child_2:
        age: 6
        date_of_birth: 20200401
      child_3:
        age: 5
        date_of_birth: 20210501
    benunits:
      benunit:
        members: [parent, adopted, child_1, child_2, child_3]
  output:
    uc_individual_child_element: [0, 3_647.28, 3_647.28, 3_647.28, 3_647.28]
