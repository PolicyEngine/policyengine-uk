- name: Current pension-age allowance preserves Housing Benefit for a nil Universal Credit claimant
  # Current 2025-26 pension-age couple allowance: 366 a week. The family
  # otherwise matches the review's nil-entitlement reproducer above.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 72
        is_claimant_or_partner: true
        working_tax_credit_reported: 2_000
        housing_benefit_reported: 4_000
        employment_income: 37_500
      younger:
        age: 40
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [older, younger]
        has_mixed_age_couple_pension_credit_saving: true
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [older, younger]
        rent: 9_000
        tenure_type: RENT_FROM_COUNCIL
  output:
