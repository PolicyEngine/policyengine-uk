# SI 2019/37 art. 4(3)(b)(ii), inserted by SI 2024/604 art. 2,
# preserves the Housing Benefit reclaim route for a protected mixed-age
# couple that claims Universal Credit before the final deadline but is not
# entitled. Entitlement is assessed before benefit-cap reductions.

- name: Protected mixed-age couple claiming nil Universal Credit keeps its Housing Benefit reclaim route
  # Preserve the review's 139.83 reproducer with its then-modelled 2025
  # weekly couple allowance. Main subsequently corrected that rate to 366;
  # the unmodified current-policy case below has the same route outcome.
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.dwp.housing_benefit.allowances.couple.aged: 357.98
    people:
      older:
        age: 72
        is_claimant_or_partner: true
        working_tax_credit_reported: 2_000
        housing_benefit_reported: 4_000
        employment_income: 37_500
      younger:
        age: 40
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [older, younger]
        has_mixed_age_couple_pension_credit_saving: true
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [older, younger]
        rent: 9_000
        tenure_type: RENT_FROM_COUNCIL
  output:
    legacy_benefits_closed: true
    claims_universal_credit: true
    is_uc_eligible: true
    universal_credit_pre_benefit_cap: 0
    is_uc_entitled: false
    universal_credit: 0
    left_pension_route_at_legacy_closure: false
    housing_benefit_eligible: true
    housing_benefit: 139.83

