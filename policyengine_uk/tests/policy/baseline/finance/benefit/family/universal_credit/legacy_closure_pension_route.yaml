    housing_benefit: 410.90

- name: Benefit cap reducing Universal Credit to nil does not preserve the pension-age route
  # Isolate the distinction between a nil means-tested entitlement and a
  # positive entitlement whose payment is then reduced to zero by the cap.
  period: 2025
  input:
    people:
      older:
        age: 72
        is_claimant_or_partner: true
        working_tax_credit_reported: 2_000
        housing_benefit_reported: 4_000
      younger:
        age: 40
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [older, younger]
        has_mixed_age_couple_pension_credit_saving: true
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
        uc_maximum_amount: 1_200
        uc_income_reduction: 0
        uc_benefit_cap_reduction: 1_200
    households:
      household:
        members: [older, younger]
        rent: 9_000
        tenure_type: RENT_FROM_COUNCIL
  output:
    claims_universal_credit: true
    universal_credit_pre_benefit_cap: 1_200
    is_uc_entitled: true
    universal_credit: 0
    left_pension_route_at_legacy_closure: true
    housing_benefit_eligible: false
    housing_benefit: 0
    is_pension_credit_eligible: false
