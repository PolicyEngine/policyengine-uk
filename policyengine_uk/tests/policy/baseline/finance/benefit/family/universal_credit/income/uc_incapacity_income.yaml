# Annual public-input controls, not an audit of legacy entitlement or rates.
# Ages 60/58 in 2026 permit legacy IB/SDA histories; receipt remains an input.
# CA annual netting represents constant year-round amounts. The care-hours
# interface does not attribute care to a recipient: the represented PIP recipient
# documents the qualifying-care premise without certifying that missing link.
# UC eligibility, components, income reduction and final awards remain live.

- name: IB reduces a working-age claimant's positive final UC award
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 60
    incapacity_benefit_reported: 1_000
    country: ENGLAND
  output:
    universal_credit: 424.90 * 12 - 1_000
    incapacity_benefit: 1_000
    is_uc_eligible: true
    uc_maximum_amount: 424.90 * 12
    uc_unearned_income: 1_000
    uc_income_reduction: 1_000

- name: No legacy income preserves a positive final UC award
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 60
    country: ENGLAND
  output:
    universal_credit: 424.90 * 12
    uc_unearned_income: 0

- name: IB 0 counts alongside actual residual Carer's Allowance
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 60
        care_hours: 35
        incapacity_benefit_reported: 0
      recipient:
        age: 55
        pip_dl_category: ENHANCED
    benunits:
      carer_unit:
        members: [carer]
      recipient_unit:
        members: [recipient]
    households:
      household:
        members: [carer, recipient]
        country: ENGLAND
  output:
    universal_credit: [3115.48, 5098.80]
    carers_allowance_pre_overlap: [4495.40, 0]
    carers_allowance: [4495.40, 0]
    uc_carer_element: [2512.08, 0]
    is_uc_eligible: [true, true]
    uc_maximum_amount: [7610.88, 5098.80]
    uc_unearned_income: [4495.40, 0]
    uc_income_reduction: [4495.40, 0]

