# SDA is the existing maximum-rate proxy, not the reported cash amount.
# The public disability flag supplies the assessment premise; the calculator
# does not infer this flag from a disability benefit report as datasets do.
# Unchanged 2026 standard/health rates below are model controls, not a rate audit.
- name: SDA report 1 counts the full modeled award and live LCWRA element
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 60
        sda_reported: 1
        is_disabled_for_benefits: true
      partner:
        age: 58
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        country: ENGLAND
  output:
    universal_credit: (666.97 + 217.26) * 12 - 119.35 * 52
    sda: [6206.20, 0]
    uc_limited_capability_for_WRA: [true, false]
    uc_LCWRA_element: 217.26 * 12
    is_uc_eligible: true
    uc_maximum_amount: (666.97 + 217.26) * 12
    uc_unearned_income: 119.35 * 52
    uc_income_reduction: 119.35 * 52

