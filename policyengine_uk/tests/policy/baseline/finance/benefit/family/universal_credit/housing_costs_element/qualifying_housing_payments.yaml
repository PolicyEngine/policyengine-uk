# Provider routing is separate from caravan/houseboat ownership and payment type.
# GB: UC Sch4 paras2/3/20/22/25/30/33/34; NI paras2/3/19/21/24/29/32/33.
# Council/registered-provider status is established outside the model. All positive
# social cases have one bedroom, commercial qualifying payments and no reductions.
# 2026 Barnsley one-bed LHA: 415/month x12 =4980; qualifying social rent=6000.
# Standard allowance: 424.90/month x12 =5098.80; GB final awards=10078.80/11098.80,
# below the outside-London single cap of14753. No calculated money input is forced.
# NI Belfast one-bed LHA: 605.47/month x12 =7265.64; rent8400 gives final UC
# 12364.44(private) and13498.80(social), a1134.36 difference, both below the cap.
# NI social provider means the Housing Executive or a registered housing association.
# The two owner guard cases deliberately omit payment qualification or liability;
# provider status alone does not supply either fact or overall UC entitlement.
# https://www.legislation.gov.uk/uksi/2013/376/schedule/4
# https://www.legislation.gov.uk/nisr/2016/216/schedule/4
# https://www.legislation.gov.uk/nisr/2026/54/regulation/3
# https://www.gov.uk/government/publications/universal-credit-local-housing-allowance-rates-2026-to-2027
# https://www.nidirect.gov.uk/articles/universal-credit-payments-housing
# https://www.nidirect.gov.uk/articles/benefit-cap

- name: Case 13, a caravan owner paying a council pitch charge uses the social provider route.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    benunits:
      benunit:
        members: [person1]
        is_married: false
        would_claim_uc: true
        would_claim_housing_benefit: false
        has_qualifying_site_or_mooring_liability: true
        qualifying_site_or_mooring_provider_is_social: true
    households:
      household:
        members: [person1]
        country: ENGLAND
        region: YORKSHIRE
        brma: BARNSLEY
        tenure_type: OWNED_OUTRIGHT
        accommodation_type: MOBILE
        num_bedrooms: 1
        rent: 6000
  output:
    universal_credit: 11098.8
    uc_housing_costs_element: 6000.0

