# Current 2026 qualifying site/mooring payments: UC Regs 2013 regs 25/26,
# Sch 1 para 2(c)/(d), Sch 4 paras 20/22/25; NI regs 26/27, Sch 1 para 2,
# Sch 4 paras 19/21/24. Ordinary mortgage repayments are not tested as rent.
# Single age 40 standard allowance: 424.90/month x 12 = 5,098.80.
# 2026 Inner South East London one-bed LHA: 1,295.50/month x 12 = 15,546.
# A 5,200 payment is below that cap; 5,098.80 + 5,200 = 10,298.80,
# below the single London annual benefit cap of 16,967. No income, capital,
# non-dependants or other awards reduce these raw-input cases.
# https://www.gov.uk/government/publications/benefit-and-pension-rates-2026-to-2027/proposed-benefit-and-pension-rates-2026-to-2027
# https://www.gov.uk/government/publications/universal-credit-local-housing-allowance-rates-2026-to-2027
# https://www.legislation.gov.uk/uksi/2013/376/schedule/4

- name: Case 1, a qualifying owner site payment reaches the final Universal Credit award.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    benunits:
      benunit:
        members: [person1]
        is_married: false
        would_claim_uc: true
        would_claim_housing_benefit: false
        has_qualifying_site_or_mooring_liability: true
    households:
      household:
        members: [person1]
        country: ENGLAND
        region: LONDON
        brma: INNER_SOUTH_EAST_LONDON
        tenure_type: OWNED_OUTRIGHT
        accommodation_type: MOBILE
        rent: 5_200
  output:
    uc_housing_costs_element: 5_200
    universal_credit: 10_298.8

