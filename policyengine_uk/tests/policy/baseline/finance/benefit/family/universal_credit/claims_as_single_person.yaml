- name: Reg. 82(1)(a) - the couple's combined earned income, the other member's included, meets the earnings exception
  period: 2026
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
        employment_income: 11_000
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    # "Couple" in the cap includes a single claimant's partner (reg. 78(2)).
    # 11,000 a year (916.67 a month) exceeds 16 hours at the national living
    # wage of 12.71 (NMW Regs 2015 reg. 4 from 1 April 2026):
    # 12.71 x 16 x 52 / 12 = 881.23 a month.
    is_benefit_cap_exempt_earnings: true

