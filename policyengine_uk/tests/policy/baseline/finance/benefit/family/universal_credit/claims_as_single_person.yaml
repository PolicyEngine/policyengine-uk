- name: WRA 2012 s. 4(1)(b) - a claimant over State Pension age cannot claim as a single person
  period: 2026
  input:
    people:
      claimant:
        age: 70
        is_claimant_or_partner: true
      partner:
        age: 40
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    # The partner is under State Pension age but cannot be a joint claimant,
    # so the reg. 3(2)(a) mixed-age route is closed, and there is no single
    # claim either.
    is_uc_eligible: false
    uc_member_of_couple_claims_as_single_person: false

