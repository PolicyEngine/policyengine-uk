- name: A family that reports Housing Benefit but claims UC is single for UC's cap and shared rate and a couple for HB's
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      renter:
        age: 30
        is_claimant_or_partner: true
        housing_benefit_reported: 3_000
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
        pip_dl: 4_000
    benunits:
      benunit:
        members: [renter, partner]
        would_claim_uc: true
    households:
      household:
        members: [renter, partner]
        tenure_type: RENT_PRIVATELY
        region: NORTH_EAST
  output:
    claims_legacy_benefits: true
    uc_member_of_couple_claims_as_single_person: true
    # Each scheme applies its own rules. UC: a single claimant (reg.
    # 80A(2)(c)); the other member's PIP is not a claimant's, so no exception
    # (reg. 83(1)(g)); shared accommodation (Sch 4 para 28(2)).
    is_uc_benefit_cap_single_claimant_rate: true
    is_uc_benefit_cap_exempt: false
    uc_benefit_cap: 14_753
    is_lha_shared_accommodation_rate_specified_renter: true
    LHA_category: A
    # Housing Benefit has no single claim by a member of a couple: the couple
    # rate (reg. 75CA(2)(d)), the partner's PIP lifts the cap (reg.
    # 75F(1)(ea), "the claimant or the claimant's partner"), and a couple is
    # not a young individual (reg. 2(1); reg. 13D(2)(a)(i)).
    is_housing_benefit_benefit_cap_single_claimant_rate: false
    is_housing_benefit_benefit_cap_exempt: true
    is_housing_benefit_young_individual: false
    housing_benefit_LHA_category: B
    # 424.90 x 12
    uc_standard_allowance: 5_098.80

- name: A family that stays on legacy benefits gets the same per-scheme rules
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      renter:
        age: 30
        is_claimant_or_partner: true
        housing_benefit_reported: 3_000
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
        pip_dl: 4_000
    benunits:
      benunit:
        members: [renter, partner]
        would_claim_uc: false
    households:
      household:
        members: [renter, partner]
        tenure_type: RENT_PRIVATELY
        region: NORTH_EAST
  output:
    claims_legacy_benefits: true
    # Staying on legacy benefits changes neither scheme's rules. Housing
    # Benefit, which this family receives, has no single claim by a member of
    # a couple: the couple rate (HB reg. 75CA(2)(d)), the partner's PIP lifts
    # the cap (HB reg. 75F(1)(ea)), and a couple is not a young individual
    # (HB reg. 2(1)): one bedroom (B).
    is_housing_benefit_benefit_cap_single_claimant_rate: false
    is_housing_benefit_benefit_cap_exempt: true
    is_housing_benefit_young_individual: false
    housing_benefit_LHA_category: B
    # The Universal Credit rules are those of the reg. 3(3) single claim
    # (reg. 80A(2)(c), reg. 83(1), Sch 4 para 28(2)).
    is_uc_benefit_cap_single_claimant_rate: true
    is_uc_benefit_cap_exempt: false
    uc_benefit_cap: 14_753
    is_lha_shared_accommodation_rate_specified_renter: true
    LHA_category: A
