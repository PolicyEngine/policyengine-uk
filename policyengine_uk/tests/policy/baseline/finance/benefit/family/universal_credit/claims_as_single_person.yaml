- name: WRA 2012 s. 4(1)(b) - a claimant over State Pension age cannot claim as a single person
  period: 2026
  input:
    people:
      claimant:
        age: 70
        is_claimant_or_partner: true
      partner:
        age: 40
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    # The partner is under State Pension age but cannot be a joint claimant,
    # so the reg. 3(2)(a) mixed-age route is closed.
    is_uc_eligible: false

- name: A working-age claimant can claim as a single person when the partner over State Pension age cannot be a joint claimant
  period: 2026
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      partner:
        age: 70
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
