# A member of a couple who claims Universal Credit as a single person
# because the other member cannot be a joint claimant (UC Regs 2013 reg. 3(3)).
#
# The model reads 2026 at the 2026-27 fiscal year. Amounts per assessment
# period from the reg. 36 table (as amended from 6 April 2026 by the
# Universal Credit Act 2025, S.I. 2026/113 and the Social Security Benefits
# Up-rating Order 2026, S.I. 2026/148) and the reg. 22 table:
#   standard allowance: single under 25 338.58, single 25 or over 424.90,
#     joint both under 25 528.34, joint either 25 or over 666.97;
#   LCWRA element for a claimant other than a pre-2026, severe conditions or
#     terminally ill claimant 217.26; carer element 209.34;
#   work allowance: higher 710, lower 427; taper 55% (reg. 22(1)(b)).
# Benefit cap annual limits (reg. 80A(2)): single claimant outside London
# with no child 14,753; joint claimants or a single claimant responsible for
# a child, outside London, 22,020.
# Earnings stay below the personal allowance and the NI primary threshold
# (12,570), so no tax or NI is deducted.

- name: Reg. 36(3) - a member of a couple claiming as a single person gets the single 25-or-over standard allowance
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_uc_single_or_joint_claimant: [true, false]
    uc_member_of_couple_claims_as_single_person: true
    uc_standard_allowance_claimant_type: SINGLE_OLD
    # 424.90 x 12
    uc_standard_allowance: 5_098.80
    is_uc_eligible: true

- name: Joint claimants of the same ages get the joint standard allowance (control)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_uc_single_or_joint_claimant: [true, true]
    uc_member_of_couple_claims_as_single_person: false
    uc_standard_allowance_claimant_type: COUPLE_OLD
    # 666.97 x 12
    uc_standard_allowance: 8_003.64

- name: Reg. 36(3) - the single rate follows the claimant's own age, not the partner's
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 22
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    uc_standard_allowance_claimant_type: SINGLE_YOUNG
    # 338.58 x 12 (joint claimants with one aged 30 would get 666.97)
    uc_standard_allowance: 4_062.96

- name: Reg. 3(3)(a) - a 19-year-old whose 17-year-old partner has no reg. 8 circumstance claims as a single person (ADM E2017 example)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      tom:
        age: 19
        is_claimant_or_partner: true
      jane:
        age: 17
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [tom, jane]
    households:
      household:
        members: [tom, jane]
        region: NORTH_EAST
  output:
    meets_uc_minimum_age_condition: [true, false]
    uc_is_ineligible_partner: [false, true]
    is_uc_single_or_joint_claimant: [true, false]
    uc_standard_allowance_claimant_type: SINGLE_YOUNG
    # 338.58 x 12
    uc_standard_allowance: 4_062.96

