- name: Reg. 32(1) - the claimant must be in paid work and the other member too
  period: 2026
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
        employment_income: 10_000
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
      child:
        age: 3
    benunits:
      benunit:
        members: [claimant, partner, child]
    households:
      household:
        members: [claimant, partner, child]
        region: NORTH_EAST
  output:
    # Reg. 32(1)(b) applies "whether claiming jointly or as a single person";
    # the partner is neither in paid work nor unable to provide childcare
    # for a reason in (i)-(iii).
    uc_unable_to_provide_childcare: [false, false, false]
    uc_childcare_work_condition: false

