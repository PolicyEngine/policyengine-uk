- name: Reg. 18(2) - the claimant's capital includes the other member's
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
        lifetime_isa_balance: 8_000
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
        lifetime_isa_balance: 16_000
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    # Surrender values under 60, 75% of the balance (ADM H1659):
    # 6,000 + 12,000 = 18,000, above the 16,000 limit of reg. 18(1)(a).
    uc_assessable_capital: 18_000
    is_uc_eligible: false

- name: Reg. 22(3) - the other member's earnings are deducted as if the couple were joint claimants
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
        employment_income: 6_000
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    # No child and no limited capability for work: no work allowance
    # (reg. 22(1)(b)(i)), so 55% of 6,000 is deducted.
    is_uc_work_allowance_eligible: false
    uc_earned_income: 6_000
    uc_income_reduction: 3_300
    # 5,098.80 - 3,300
    universal_credit: 1_798.80

- name: Reg. 22(3) - the other member's unearned income is deducted in full
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
        private_pension_income: 1_200
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    uc_unearned_income: 1_200
    uc_income_reduction: 1_200
    # 5,098.80 - 1,200
    universal_credit: 3_898.80

- name: Reg. 22(3) - the other member's limited capability for work gives the work allowance joint claimants would have, but no LCWRA element
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
        uc_is_ineligible_partner: true
        uc_limited_capability_for_WRA: true
        employment_income: 6_000
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    # Joint claimants where "one or both have limited capability for work"
    # have a work allowance (reg. 22(1)(b)(ii)): the higher one, 710 x 12 =
    # 8,520, with no housing costs element (reg. 22(2)(a)). 6,000 is below it.
    is_uc_work_allowance_eligible: true
    uc_work_allowance: 8_520
    uc_earned_income: 0
    uc_income_reduction: 0
    # Reg. 27(1): the element is for "a claimant"; the partner is not one.
    uc_LCWRA_element: 0
    # 424.90 x 12
    universal_credit: 5_098.80

