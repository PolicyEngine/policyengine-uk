      benunit:
        members: [claimant, partner, child]
    households:
      household:
        members: [claimant, partner, child]
        region: NORTH_EAST
  output:
    # Limb (a) needs "the claimant" in paid work or with an offer of it. The
    # claimant has limited capability for work but does not work; the other
    # member's work does not meet limb (a) for them.
    uc_unable_to_provide_childcare: [true, false, false]
    uc_childcare_work_condition: false

- name: Reg. 32(1) - joint claimants, one working and the other with limited capability for work (control)
  period: 2026
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
