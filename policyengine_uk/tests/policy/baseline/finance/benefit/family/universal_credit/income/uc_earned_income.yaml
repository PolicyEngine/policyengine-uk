- name: All sources summed and deductions used, except self-employment
  period: 2022
  absolute_error_margin: 0
  input:
    employment_income: 1_000
    miscellaneous_income: 100
    uc_work_allowance: 10
    # The claimant's own tax (UC reg 22 counts the claimant's earnings).
    income_tax_before_winter_fuel_payment_charge: 1
  output:
    uc_earned_income: 1100 - 11

- name: Capped at 0
  period: 2025
  absolute_error_margin: 0
  input:
    employment_income: 1_000
    miscellaneous_income: 100
    uc_work_allowance: 2_000
    # The claimant's own tax (UC reg 22 counts the claimant's earnings).
    income_tax_before_winter_fuel_payment_charge: 1
  output:
    uc_earned_income: 0
