- name: A young person's own Housing Benefit report after the parent's legacy awards close leaves the child element.
  # The parent's own Income Support report from 2026 closes the family's
  # legacy awards (legacy_benefits_closed), and the family doesn't meet the
  # Pension Credit age conditions, so the model pays no Housing Benefit on
  # the young person's report (housing_benefit_eligible). UC: 12 x (424.90 +
  # 351.88) = 9,321.36.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 3_000
      young_person:
        age: 17
        current_education: POST_SECONDARY
        is_claimant_or_partner: false
        housing_benefit_reported: 3_000
    benunits:
      benunit:
        members: [parent, young_person]
    households:
      household:
        members: [parent, young_person]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    legacy_benefits_closed: true
    housing_benefit_eligible: false
    is_qualifying_young_person_for_universal_credit: [false, true]
    uc_child_element: 4_222.56
    universal_credit: 9_321.36

