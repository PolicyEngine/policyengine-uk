  # income-related ESA on their report. UC: 12 x (400.14 + 339.00) = 8,869.68;
  # child element 12 x 339.00 = 4,068.00.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        is_parent: true
        is_claimant_or_partner: true
