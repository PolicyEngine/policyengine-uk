# The model ends a person's legacy awards once its annual migration proxy
# closes them, and the UC qualifying young person test (SI 2014/1230 reg. 28)
# follows that closure: nobody is entitled to an award the model has ended.
# The model ends a person's own Income Support, income-based JSA and
# income-related ESA when person_legacy_benefits_closed holds
# (income_support, jsa_income, esa_income_report_closed), and the family's
# Housing Benefit and tax credits when legacy_benefits_closed holds
# (housing_benefit_eligible, is_CTC_eligible, is_WTC_eligible). A
# dependant's own Income Support or income-based JSA report from 2026, or own
# tax credit report from 2025, closes the dependant's legacy awards
# (gov.dwp.income_support.active, gov.dwp.JSA.income.active and
# gov.dwp.tax_credits.active turn false on 1 April 2026, 1 April 2026 and
# 6 April 2025). The closure reports exclude nobody, as the benefit has closed.
#
# Every case but the last uses one household: a parent aged 45 and a 17-year-old on a
# non-advanced course in the parent's benefit unit, North East, owned
# outright, no income. The parent claims Universal Credit as a single
# claimant over 25 (universal_credit/standard_allowance/amount.yaml
# SINGLE_OLD: £400.14 a month in 2025-26, £424.90 in 2026-27) and gets the
# first child higher amount for a qualifying young person
# (elements/child/first/higher_amount.yaml: £339.00 in 2025-26, £351.88 in
# 2026-27). So:
#   2025 with the child element:    12 x (400.14 + 339.00) = 8,869.68
#   2026 with the child element:    12 x (424.90 + 351.88) = 9,321.36
#   2026 without the child element: 12 x 424.90 = 5,098.80

- name: A young person's own income-related ESA report alone removes the child element in 2026.
  # No closure applies: the young person reports no closed benefit, so the
  # model pays the £3,000 of income-related ESA (esa_income) and the young
  # person is entitled to it. UC: 12 x 424.90 = 5,098.80.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        is_parent: true
        is_claimant_or_partner: true
      young_person:
        age: 17
        current_education: POST_SECONDARY
        is_claimant_or_partner: false
        esa_income_reported: 3_000
    benunits:
      benunit:
        members: [parent, young_person]
    households:
      household:
        members: [parent, young_person]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    person_legacy_benefits_closed: [false, false]
    esa_income: 3_000
    is_qualifying_young_person_for_universal_credit: [false, false]
    uc_child_element: 0
    universal_credit: 5_098.80

- name: A young person's own income-related ESA report with their own Income Support report in 2026 leaves the child element.
  # Income Support closed on 1 April 2026, so the young person's own report
  # closes their legacy awards (person_legacy_benefits_closed) and the model
  # pays no income-related ESA on their report (esa_income 0). Neither report
  # excludes them. UC: 12 x (424.90 + 351.88) = 9,321.36; child element
  # 12 x 351.88 = 4,222.56.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        is_parent: true
        is_claimant_or_partner: true
      young_person:
        age: 17
        current_education: POST_SECONDARY
        is_claimant_or_partner: false
        esa_income_reported: 3_000
        income_support_reported: 3_000
    benunits:
      benunit:
        members: [parent, young_person]
    households:
      household:
        members: [parent, young_person]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    person_legacy_benefits_closed: [false, true]
    esa_income: 0
    is_qualifying_young_person_for_universal_credit: [false, true]
    uc_child_element: 4_222.56
    universal_credit: 9_321.36

