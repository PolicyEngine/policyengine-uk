- name: A young person's own income-based JSA report with their own Child Tax Credit report in 2025 leaves the child element.
  # Income-based JSA still pays in 2025, but the young person's own Child Tax
  # Credit report closes their legacy awards, so the model pays no
  # income-based JSA on their report (jsa_income 0). UC: 8,869.68 as above.
  period: 2025
  absolute_error_margin: 0.01
