- name: An 18-year-old lone parent's own Child Tax Credit report excludes them while they don't claim Universal Credit.
  # Tax credits pay in 2024 and the claimant doesn't claim Universal Credit,
  # so the model pays Child Tax Credit for the child born after 5 April 2017:
  # the child element of 3,455, with no family element and no income to taper
  # it.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 18
        current_education: POST_SECONDARY
        is_claimant_or_partner: true
        child_tax_credit_reported: 1_000
      child:
        age: 1
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [claimant, child]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
    households:
      household:
        members: [claimant, child]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    is_CTC_eligible: true
    child_tax_credit: 3_455
    is_qualifying_young_person_for_universal_credit: [false, false]
    universal_credit: 0

- name: An 18-year-old claimant whose partner reports the couple's Child Tax Credit stays a qualifying young person once the couple claims Universal Credit.
  # The members of a couple claim tax credits jointly (Tax Credits Act 2002
  # s.3(3)), so the partner's report gives the claimant the couple's award.
  # The couple's claim for Universal Credit ends a joint claimant's tax
  # credits (SI 2014/1230 reg. 8(2); is_CTC_eligible), so nobody is entitled
  # to the award. UC: 12 x (617.60 + 287.92) = 10,866.24.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 18
        current_education: POST_SECONDARY
        is_claimant_or_partner: true
      partner:
        age: 45
        is_claimant_or_partner: true
        child_tax_credit_reported: 1_000
      child:
        age: 1
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [claimant, partner, child]
        would_claim_uc: true
    households:
      household:
        members: [claimant, partner, child]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    is_CTC_eligible: false
    child_tax_credit: 0
    is_qualifying_young_person_for_universal_credit: [true, false, false]
    universal_credit: 10_866.24

