# A claim for Universal Credit ends the claimant's own tax credits, Income
# Support and Housing Benefit, and either joint claimant's tax credits (SI
# 2014/1230 reg. 8(2) and (2A)), and the claimant's and partner's
# income-related ESA (SI 2013/983 art. 4). It ends nobody else's award. The
# model ends the family's continuing Housing Benefit award
# (housing_benefit_eligible) and its Child Tax Credit (is_CTC_eligible), and
# the claimant's and partner's income-related ESA (esa_income_report_closed),
# when the family claims (claims_universal_credit). Nobody is entitled to an
# award the claim has ended, so for a claimant or partner the UC qualifying
# young person test (SI 2014/1230 reg. 28) follows those three limbs. For a
# dependant it doesn't: a parent's claim leaves the dependant's own award.
# The model ends no Working Tax Credit, Income Support or income-based JSA
# award on the claim, so the predicate follows no claim limb for them.
#
# would_claim_uc decides the claim here. A case without a claim also sets
# would_claim_uc_at_legacy_closure false, so the family claims nothing when
# DWP moves it off its legacy benefits either. The reg. 5 variable
# reads universal_credit_reported and receives_benefits_in_own_right for reg.
# 5(5), not a calculated Universal Credit award, and these cases leave both
# at their defaults, so a claimant who claims Universal Credit still meets
# reg. 5.
#
# Rates (universal_credit/standard_allowance/amount.yaml, elements/child/):
#   SINGLE_YOUNG £311.68 a month in 2024-25 and £338.58 in 2026-27;
#   COUPLE_OLD £617.60 in 2024-25; the child amount for a child born after
#   5 April 2017 £287.92 in 2024-25 (elements/child/amount.yaml).
#   Child Tax Credit child element £3,455 a year in 2024-25
#   (tax_credits/child_tax_credit/elements/child_element.yaml).

- name: An 18-year-old claimant's own income-related ESA report leaves them a qualifying young person once they claim Universal Credit.
  # The claimant claims Universal Credit, which ends their own income-related
  # ESA (SI 2013/983 art. 4; esa_income_report_closed), so the model pays no
  # income-related ESA on their report and they aren't entitled to it. UC: 12
  # x 338.58 = 4,062.96.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 18
        current_education: POST_SECONDARY
        is_claimant_or_partner: true
        esa_income_reported: 3_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
    households:
      household:
        members: [claimant]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    esa_income_report_closed: [true]
    esa_income: 0
    is_qualifying_young_person_under_universal_credit_regulation_5: [true]
    is_qualifying_young_person_for_universal_credit: [true]
    universal_credit: 4_062.96

- name: An 18-year-old claimant's own income-related ESA report excludes them while they don't claim Universal Credit.
  # Nothing ends the award: the claimant doesn't claim Universal Credit and
  # reports no closed benefit, and the claim pays for 86 of the 365 days of
  # 2026-27 (esa_income_payable_share 0.2356), so the model pays 3,000 x 86 /
  # 365 = 706.85 of income-related ESA on their report and they're entitled
  # to it. They get no Universal Credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 18
        current_education: POST_SECONDARY
        is_claimant_or_partner: true
        esa_income_reported: 3_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
    households:
      household:
        members: [claimant]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    esa_income_report_closed: [false]
    esa_income: 706.85
    is_qualifying_young_person_for_universal_credit: [false]
    universal_credit: 0

- name: An 18-year-old claimant's own Housing Benefit report leaves them a qualifying young person once they claim Universal Credit.
  # The claimant rents from the council at £6,000 a year and claims Universal
  # Credit, which ends their own Housing Benefit (SI 2014/1230 reg. 8(2A);
  # housing_benefit_eligible), so the model pays no Housing Benefit on their
  # report. UC: 12 x 338.58 + 6,000 housing element = 10,062.96.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 18
        current_education: POST_SECONDARY
        is_claimant_or_partner: true
        housing_benefit_reported: 3_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
    households:
      household:
        members: [claimant]
        region: NORTH_EAST
        tenure_type: RENT_FROM_COUNCIL
        rent: 6_000
  output:
    housing_benefit_eligible: false
    housing_benefit: 0
    is_qualifying_young_person_for_universal_credit: [true]
    universal_credit: 10_062.96

