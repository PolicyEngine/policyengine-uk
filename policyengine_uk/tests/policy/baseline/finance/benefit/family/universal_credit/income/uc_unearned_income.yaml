- name: Dividend income stays unearned when only disregarded pension wealth is held
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        dividend_income: 120
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 6_001
        private_pension_wealth: 150_000
  output:
    # Pension wealth is disregarded capital (UC Regs 2013 Sch 10 para 10), so
    # the dividend gate keys on corporate_wealth alone: with no share-like
    # holdings the dividends are not folded into capital and stay unearned.
    uc_assessable_capital: 6_001
    uc_tariff_income: 4.35 * 12
    uc_unearned_income: 4.35 * 12 + 120

# Reg. 22(1)(a) deducts "all of the claimant's unearned income (or in the
# case of joint claimants all of their combined unearned income)". A
# dependant's income is not the claimant's.

- name: A dependant's unearned income does not count and the claimant's does
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
        is_parent: true
        private_pension_income: 1_000
      child:
        age: 17
        current_education: UPPER_SECONDARY
        savings_interest_income: 300
        dividend_income: 200
        property_income: 100
        private_pension_income: 400
        carers_allowance: 500
    benunits:
      benunit:
        members: [parent, child]
  output:
    uc_unearned_income: 1_000

- name: A dependant's savings interest does not wipe out a lone parent's Universal Credit
  # Reg. 36 table, 2026-27: £424.90 + £351.88 a month. Before this was
  # fixed the child's £12,000 counted pound for pound and UC was nil.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
      child:
        age: 17
        current_education: UPPER_SECONDARY
        savings_interest_income: 12_000
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    uc_unearned_income: 0
    universal_credit: (424.90 + 351.88) * 12

- name: With tariff income, a dependant's savings interest is neither added nor taken off
  # The household's £6,001 is £1 over the £6,000 lower limit: one £4.35
  # monthly step (reg. 72). The claimant's £120 of interest is replaced by
  # the tariff income; the child's £500 never counted.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        is_parent: true
        savings_interest_income: 120
      child:
        age: 10
        savings_interest_income: 500
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        savings: 6_001
  output:
    uc_tariff_income: 4.35 * 12
    uc_unearned_income: 4.35 * 12
