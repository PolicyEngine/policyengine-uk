# UC Regs 2013 reg. 66(1) lists the descriptions of unearned income, and income
# outside them is not taken into account (DWP ADM H5002, H5112). Actual
# interest, dividends and rent fall in none of them: reg. 66(1)(m) reaches only
# ITTOIA 2005 Part 5 income, while interest and dividends are Part 4 and
# property income is Part 3. Capital counts through its assumed yield instead
# (reg. 72(1), reg. 66(1)(k)): £4.35 a month for each £250, or part of £250,
# above £6,000. Where capital is treated as yielding income, reg. 72(3) treats
# the actual income derived from it, "for example rental, interest or
# dividends", as capital.

- name: Listed sources are summed and interest and dividends are not
  period: 2020
  absolute_error_margin: 0
  input:
    carers_allowance: 10_000
    jsa_contrib: 1_000
    private_pension_income: 100
    savings_interest_income: 10
    dividend_income: 1
  output:
    # Reg. 66(1)(b)(iii) carer's allowance + (b)(i) JSA + (a) private pension.
    uc_unearned_income: 11_100

- name: Tariff income is exposed in unearned income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 6_001
  output:
    uc_unearned_income: 4.35 * 12

- name: Savings interest is not unearned income when tariff income applies
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        savings_interest_income: 120
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 6_001
  output:
    uc_tariff_income: 4.35 * 12
    uc_unearned_income: 4.35 * 12

- name: Dividend income is not unearned income when tariff income applies
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        dividend_income: 120
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 6_001
        corporate_wealth: 1
  output:
    uc_tariff_income: 4.35 * 12
    uc_unearned_income: 4.35 * 12

- name: Rent from residential property is not unearned income when tariff income applies
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        property_income: 120
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 6_001
        other_residential_property_value: 1
  output:
    uc_tariff_income: 4.35 * 12
    uc_unearned_income: 4.35 * 12

- name: Rent from non-residential property is not unearned income when tariff income applies
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        property_income: 120
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 6_001
        non_residential_property_value: 1
  output:
    uc_tariff_income: 4.35 * 12
    uc_unearned_income: 4.35 * 12

- name: Dividend income is not unearned income without share capital in the data
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        dividend_income: 120
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 6_001
  output:
    # No reg. 66(1) description covers dividends, whether or not the data
    # records the shares that pay them.
    uc_tariff_income: 4.35 * 12
    uc_unearned_income: 4.35 * 12

- name: Rent is not unearned income without property capital in the data
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        property_income: 120
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 6_001
  output:
    uc_tariff_income: 4.35 * 12
    uc_unearned_income: 4.35 * 12

- name: Rent from letting part of the home is not unearned income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        property_income: 120
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 6_001
        main_residence_value: 1_000_000
  output:
    # The home is disregarded capital (Sch. 10 para. 1), so it yields no
    # tariff income, and rent from a sub-tenant or boarder is not income
    # either (ADM H5112, example of a room let at £60 a week).
    uc_tariff_income: 4.35 * 12
    uc_unearned_income: 4.35 * 12

- name: Interest, dividends and rent are not unearned income below the tariff threshold
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 30
        savings_interest_income: 200
        dividend_income: 300
        property_income: 1_000
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 5_000
  output:
    # Capital of £6,000 or less yields nothing (reg. 72(1); ADM H1764), and
    # the actual income it pays is outside reg. 66(1).
    uc_tariff_income: 0
    uc_unearned_income: 0

- name: Interest is not added to tariff income when the data records no savings
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        savings_interest_income: 500
        property_income: 4_800
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 0
        other_residential_property_value: 10_000
  output:
    # Tariff income on £10,000 of let property: (10,000 - 6,000) / 250 = 16
    # steps x £4.35 x 12 = £835.20. Neither the rent nor the interest is
    # added on top of it.
    uc_tariff_income: 835.20
    uc_unearned_income: 835.20

- name: Reported capital drives tariff income for multi-benunit households
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_1:
        age: 30
        savings_interest_income: 120
      person_2:
        age: 32
    benunits:
      benunit_1:
        members: person_1
        uc_reported_capital: 6_001
      benunit_2:
        members: person_2
    households:
      household:
        members: [person_1, person_2]
        savings: 0
  output:
    uc_tariff_income: [52.2, 0]
    uc_unearned_income: [52.2, 0]

