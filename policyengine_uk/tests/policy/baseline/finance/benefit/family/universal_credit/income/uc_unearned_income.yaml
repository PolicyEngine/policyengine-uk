      person_1:
        age: 30
        savings_interest_income: 120
      person_2:
        age: 32
    benunits:
      benunit_1:
        members: person_1
        uc_reported_capital: 6_001
      benunit_2:
        members: person_2
    households:
      household:
        members: [person_1, person_2]
        savings: 0
  output:
    uc_tariff_income: [52.2, 0]
