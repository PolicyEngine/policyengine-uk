# Welfare Reform Act 2012 s. 19(6): the responsible carer for a child is "a
# single person who is responsible for the child", or "a person who is a
# member of a couple where (i) the person or the other member of the couple
# is responsible for the child, and (ii) the person has been nominated by the
# couple jointly as responsible for the child". UC Regs 2013 reg. 86(2):
# "Only one of joint claimants may be nominated", and the nomination "applies
# to all the children" (reg. 86(3)).
#
# The nomination is the couple's choice and data seldom record it. Without
# an input the model takes the nomination that leaves the couple the lower
# combined earned income after the minimum income floor (the higher award),
# and the elder claimant where it makes no difference.
#
# 2026-27 amounts for a claimant aged 21 or over in England: net floor
# 20,386.03 for 35 hours (see uc_minimum_income_floor.yaml); 16-hour
# threshold 12.71 x 16 x 52 = 10,574.72, below the personal allowance.

- name: A claimant with no child is not a responsible carer
  period: 2026
  input:
    age: 30
  output:
    uc_is_responsible_carer: false

- name: A lone parent is the responsible carer
  period: 2026
  input:
    people:
      parent:
        age: 30
      child:
        age: 4
  output:
    uc_is_responsible_carer: [true, false]

- name: A couple with no floor at stake default to the elder claimant
  period: 2026
  input:
    people:
      younger:
        age: 30
        employment_income: 20_000
      elder:
        age: 35
      child:
        age: 4
  output:
    uc_is_responsible_carer: [false, true, false]

- name: A couple nominate the self-employed partner the floor would otherwise apply to
  period: 2026
  input:
    people:
      elder:
        age: 35
        employment_income: 12_000
      self_employed:
        age: 30
        self_employment_income: 5_000
      child:
        age: 1
  output:
    # Nominating the self-employed partner puts them in section 20, so no
    # floor: combined earned income 17,000. Nominating the elder leaves the
    # self-employed partner in section 22 with the floor.
    uc_is_responsible_carer: [false, true, false]
    uc_mif_applies: [false, false, false]
    uc_individual_earned_income: [12_000, 5_000, 0]

- name: Two self-employed partners default to the nomination that leaves the lower combined earned income
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      elder:
        age: 35
        self_employment_income: 15_000
        would_claim_marriage_allowance: false
      younger:
        age: 30
        self_employment_income: 2_000
        would_claim_marriage_allowance: false
      child:
        age: 1
    households:
      household:
        members: [elder, younger, child]
        region: NORTH_EAST
  output:
    # Elder: 15,000 - (15,000 - 1,000 - 12,570) x 20% - (15,000 - 12,570)
    # x 6% = 15,000 - 286 - 145.80.
    uc_individual_earned_income_before_mif: [14_568.20, 2_000, 0]
    # Couple threshold either way: 20,386.03 + 10,574.72 = 30,960.75.
    # Nominating the younger: the elder is treated as having 20,386.03 and
    # the couple has 22,386.03. Nominating the elder: the younger would be
    # treated as having 30,960.75 - 14,568.20 = 16,392.55 and the couple
    # would have 30,960.75.
    uc_is_responsible_carer: [false, true, false]
    uc_mif_applies: [true, false, false]
    uc_individual_earned_income: [20_386.03, 2_000, 0]

- name: A recorded nomination overrides the default
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      elder:
        age: 35
        self_employment_income: 15_000
        would_claim_marriage_allowance: false
        uc_is_responsible_carer: true
      younger:
        age: 30
        self_employment_income: 2_000
        would_claim_marriage_allowance: false
        uc_is_responsible_carer: false
      child:
        age: 1
    households:
      household:
        members: [elder, younger, child]
        region: NORTH_EAST
  output:
    uc_mif_applies: [false, true, false]
    # 30,960.75 - 14,568.20.
    uc_individual_earned_income: [14_568.20, 16_392.55, 0]

- name: A child looked after by a local authority has no responsible carer
  period: 2026
  input:
    people:
      parent:
        age: 30
      child:
        age: 4
        is_looked_after_by_local_authority: true
  output:
    # UC Regs reg. 4(6)(a).
    uc_is_responsible_carer: [false, false]

- name: A claimant whose partner cannot be a joint claimant is the responsible carer
  period: 2026
  input:
    people:
      partner:
        age: 35
        uc_is_ineligible_partner: true
      claimant:
        age: 30
      child:
        age: 4
  output:
    uc_is_responsible_carer: [false, true, false]
