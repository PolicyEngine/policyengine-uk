- name: Reg. 32(1)(b) - an offer of paid work does not meet the other member's limb
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        uc_has_offer_of_paid_work_starting_by_end_of_next_assessment_period: true
      partner:
        age: 34
        uc_has_offer_of_paid_work_starting_by_end_of_next_assessment_period: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Whichever member is taken as the claimant meets (a) with an offer, but
    # (b) requires the other member to be "in paid work" or unable to provide
    # childcare; an offer is neither.
    uc_childcare_work_condition: false

- name: Reg. 32(1) - three flagged claimants, one in paid work and two unable to provide childcare
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 40
        is_claimant_or_partner: true
        employment_income: 15_000
      second:
        age: 39
        is_claimant_or_partner: true
        uc_limited_capability_for_WRA: true
      third:
        age: 38
        is_claimant_or_partner: true
        care_hours: 40
    benunits:
      benunit:
        members: [first, second, third]
    households:
      household:
        members: [first, second, third]
  output:
    # A couple has two members, so three flagged claimants are a data error,
    # not a legal claim. The formula generalises reg. 32(1) as: some claimant
    # meets limb (a) and every other claimant meets limb (b).
    uc_childcare_work_condition: true

- name: Reg. 32(1) - three flagged claimants, one of whom neither works nor meets an exception
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 40
        is_claimant_or_partner: true
        employment_income: 15_000
      second:
        age: 39
        is_claimant_or_partner: true
        uc_limited_capability_for_WRA: true
      third:
        age: 38
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [first, second, third]
    households:
      household:
        members: [first, second, third]
  output:
    uc_childcare_work_condition: false

- name: Reg. 32(1)(a) - self-employment is paid work
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        self_employment_income: 8_000
      partner:
        age: 34
        uc_limited_capability_for_WRA: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Reg. 2: paid work is "work done for payment or in expectation of
    # payment"; the in_work proxy counts self-employment earnings.
    in_work: [true, false]
    uc_childcare_work_condition: true
