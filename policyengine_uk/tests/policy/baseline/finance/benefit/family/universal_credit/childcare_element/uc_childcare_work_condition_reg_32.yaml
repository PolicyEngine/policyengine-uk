        members: [claimant, partner, child]
  output:
    uc_unable_to_provide_childcare: [false, false, false]
    uc_childcare_work_condition: false
    uc_childcare_element: 0

- name: Reg. 32(1)(a) - the exceptions do not replace the claimant's own paid work
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        uc_limited_capability_for_WRA: true
      partner:
        age: 34
        care_hours: 40
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Neither member is in paid work, so neither meets (a): ADM F7013 applies
    # "where only one of the couple is in paid work".
    uc_unable_to_provide_childcare: [true, true]
    uc_childcare_work_condition: false

- name: Reg. 32(1)(a) - a nonworking single claimant with limited capability for work
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        uc_limited_capability_for_WRA: true
  output:
    # Limb (b) and its exceptions apply only to the other member of a couple.
    uc_childcare_work_condition: false

