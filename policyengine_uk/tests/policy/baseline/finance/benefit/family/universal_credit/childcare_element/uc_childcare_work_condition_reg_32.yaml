# Universal Credit Regulations 2013 reg. 32, the childcare work condition:
# https://www.legislation.gov.uk/uksi/2013/376/regulation/32
# "(1) The work condition is met in respect of an assessment period if—
#  (a) the claimant is in paid work or has an offer of paid work that is due
#      to start before the end of the next assessment period; and
#  (b) if the claimant is a member of a couple (whether claiming jointly or as
#      a single person), the other member is either in paid work or is unable
#      to provide childcare because that person— (i) has limited capability
#      for work, (ii) has regular and substantial caring responsibilities for
#      a severely disabled person, or (iii) is temporarily absent from the
#      claimant's household."
# Reg. 32(2)(b): a claimant receiving statutory sick pay, statutory maternity
# pay, statutory paternity pay, ... or a maternity allowance is treated as in
# paid work. ADM ch. F7, F7011-F7015, agrees:
# https://assets.publishing.service.gov.uk/media/696a076c7b7f37aa8e4022d9/adm-ch-f7.pdf
#
# Where an element amount is checked, it is reg. 34 for one child in 2025-26:
# min(5,000 * 85%, 1,031.88 * 12) = 4,250.

- name: Reg. 32(1)(b)(i) - a working claimant's partner with limited capability for work
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 35
        is_parent: true
        employment_income: 15_000
      partner:
        age: 34
        uc_limited_capability_for_WRA: true
      child:
        age: 3
        childcare_expenses: 5_000
    benunits:
      benunit:
        members: [claimant, partner, child]
    households:
      household:
        members: [claimant, partner, child]
  output:
    # (a) the claimant works; (b) the partner does not, but has limited
    # capability for work, so is unable to provide childcare.
    uc_unable_to_provide_childcare: [false, true, false]
    uc_childcare_work_condition: true
    uc_childcare_element: 4_250

- name: Reg. 32(1)(b)(i) - the limited capability proxy follows is_disabled_for_benefits
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        employment_income: 15_000
      partner:
        age: 34
        is_disabled_for_benefits: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # uc_limited_capability_for_WRA defaults to is_disabled_for_benefits.
    uc_limited_capability_for_WRA: [false, true]
    uc_childcare_work_condition: true

- name: Reg. 32(1)(b)(ii) - ADM F7013 example, a partner caring full time for her disabled mother
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      ben:
        age: 40
        is_parent: true
        employment_income: 9_000
      sara:
        age: 38
        care_hours: 40
      pauline:
        age: 4
        childcare_expenses: 5_000
      mother:
        age: 70
        aa_category: HIGHER
    benunits:
      benunit:
        members: [ben, sara, pauline]
      mothers_benunit:
        members: [mother]
    households:
      household:
        members: [ben, sara, pauline, mother]
  output:
    # Ben works two days a week. Sara provides full-time care for her mother,
    # who lives with them and receives the higher rate of attendance
    # allowance, so is a "severely disabled person" (SSCBA 1992 s. 70(2)).
    # Sara meets the Carer's Allowance conditions that reg. 30(1)(a)
    # imports, so "both Ben and Sara satisfy the paid work test" (ADM F7013).
    # The model's is_carer_for_benefits reads only Sara's 40 care hours; it
    # does not check her mother's attendance allowance.
    is_carer_for_benefits: [false, true, false, false]
    uc_childcare_work_condition: [true, false]
    uc_childcare_element: [4_250, 0]

- name: Reg. 32(1)(b)(ii) - a partner receiving Carer's Allowance
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        employment_income: 15_000
      partner:
        age: 34
        receives_carers_allowance: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Reg. 30(1)(a): satisfies the conditions for Carer's Allowance.
    uc_unable_to_provide_childcare: [false, true]
    uc_childcare_work_condition: true

