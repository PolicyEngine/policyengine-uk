- name: Reg. 32(2)(b) - a claimant on statutory sick pay with a partner with limited capability for work
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        statutory_sick_pay: 1_500
      partner:
        age: 34
        uc_limited_capability_for_WRA: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # The claimant is treated as in paid work (32(2)(b)) and the partner is
    # unable to provide childcare (32(1)(b)(i)).
    uc_childcare_work_condition: true

- name: Reg. 32(2)(b) - joint claimants both treated as in paid work
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        statutory_sick_pay: 1_500
      partner:
        age: 34
        statutory_maternity_pay: 6_000
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Reg. 32(2) treats "a claimant" as in paid work, and each joint claimant
    # is a claimant (WRA 2012 s. 40), so each is treated as in paid work.
    uc_childcare_treated_as_in_paid_work: [true, true]
    uc_childcare_work_condition: true

