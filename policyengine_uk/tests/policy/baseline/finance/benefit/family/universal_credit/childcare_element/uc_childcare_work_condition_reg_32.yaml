- name: Reg. 32(1)(b) - either joint claimant can be the one in paid work
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      head:
        age: 35
        uc_limited_capability_for_WRA: true
      partner:
        age: 34
        employment_income: 15_000
    benunits:
      benunit:
        members: [head, partner]
    households:
      household:
        members: [head, partner]
  output:
    # Each joint claimant is "the claimant" (WRA 2012 s. 40): the working
    # partner meets (a), the head (limited capability for work) meets (b).
    uc_childcare_work_condition: true

