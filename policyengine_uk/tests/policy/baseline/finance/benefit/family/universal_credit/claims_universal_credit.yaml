# Universal Credit claims when a legacy benefit closes (managed migration).
# Tax credits closed from 6 April 2025 (PE year 2025) and Income Support and
# income-based JSA from 1 April 2026 (PE year 2026). Once one of a working-age
# family's reported legacy benefits has closed, all its legacy awards end
# (SI 2014/1230 regs 8 and 46) and it claims Universal Credit when
# would_claim_uc_at_legacy_closure is true.

- name: Before tax credits close, a tax credit and Housing Benefit family keeps both awards
  period: 2024
  input:
    people:
      parent:
        age: 30
        child_tax_credit_reported: 3_000
        housing_benefit_reported: 4_000
      child:
        age: 4
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [parent, child]
        tenure_type: RENT_FROM_COUNCIL
  output:
    legacy_benefits_closed: false
    claims_universal_credit: false
    housing_benefit_eligible: true
    universal_credit: 0

- name: Once tax credits close, the family claims Universal Credit and its Housing Benefit ends
  period: 2025
  input:
    people:
      parent:
        age: 30
