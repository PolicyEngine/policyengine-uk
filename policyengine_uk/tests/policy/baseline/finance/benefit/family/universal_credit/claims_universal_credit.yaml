# Pension-age and protected mixed-age families. A tax credit closure notice
# sent families on Pension Credit, and families on Child Tax Credit but not
# Working Tax Credit that meet the Pension Credit age conditions, to Pension
# Credit (SI 2019/167 art. 3A(1)). Families on Working Tax Credit got a
# Universal Credit migration notice, and a pension-age one not entitled to
# Pension Credit has the Universal Credit upper age condition waived
# (SI 2014/1230 reg 60A; DWP HB circular A9/2024 paras 5-14).

- name: A protected mixed-age couple on Working Tax Credit claims Universal Credit at the closure and leaves the pension-age route
  period: 2025
  input:
    people:
      older:
        age: 72
        is_claimant_or_partner: true
        working_tax_credit_reported: 2_000
        housing_benefit_reported: 4_000
      younger:
        age: 40
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [older, younger]
        has_mixed_age_couple_pension_credit_saving: true
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [older, younger]
        tenure_type: RENT_FROM_COUNCIL
  output:
    meets_pension_credit_age_conditions: true
    legacy_benefits_closed: true
    claims_universal_credit: true
    is_uc_eligible: true
    left_pension_route_at_legacy_closure: true
    housing_benefit_eligible: false
    is_pension_credit_eligible: false

- name: A protected mixed-age couple on Working Tax Credit that does not claim loses its Housing Benefit and the saving
  period: 2025
  input:
    people:
      older:
        age: 72
        is_claimant_or_partner: true
        working_tax_credit_reported: 2_000
        housing_benefit_reported: 4_000
      younger:
        age: 40
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [older, younger]
        has_mixed_age_couple_pension_credit_saving: true
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
    households:
      household:
        members: [older, younger]
        tenure_type: RENT_FROM_COUNCIL
  output:
    legacy_benefits_closed: true
    claims_universal_credit: false
    left_pension_route_at_legacy_closure: true
    housing_benefit_eligible: false
    is_pension_credit_eligible: false
    universal_credit: 0

