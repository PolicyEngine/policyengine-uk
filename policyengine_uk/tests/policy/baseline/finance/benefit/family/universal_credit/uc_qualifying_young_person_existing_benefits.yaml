# The Universal Credit (Transitional Provisions) Regulations 2014 reg. 28
# excludes from the UC qualifying young person test a person entitled to an
# existing benefit (reg. 2(1)): income-based JSA, income-related ESA, Income
# Support, Housing Benefit, Child Tax Credit and Working Tax Credit. The
# predicate reads the person's own reports and, for a claimant or partner,
# the couple's joint tax credit award (Tax Credits Act 2002 s.3(3)). The
# first seven cases follow the table in issue 2804: 2026, North East, owned
# outright, no income.

- name: A parent's young person who reports their own Income Support attracts no child element.
  period: 2026
  input:
    people:
      parent:
        age: 45
        is_parent: true
        is_claimant_or_partner: true
      young_person:
        age: 17
        current_education: POST_SECONDARY
        is_claimant_or_partner: false
        income_support_reported: 3_000
    benunits:
      benunit:
        members: [parent, young_person]
    households:
      household:
        members: [parent, young_person]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    is_qualifying_young_person_for_universal_credit: [false, false]
    is_child_or_qualifying_young_person_for_universal_credit: [false, false]
    uc_child_element: 0
    universal_credit: 5_098.80

