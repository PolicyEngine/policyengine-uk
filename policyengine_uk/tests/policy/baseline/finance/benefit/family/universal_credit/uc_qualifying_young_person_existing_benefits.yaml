- name: A young person's own Child Tax Credit or Working Tax Credit report excludes them.
  # Each person forms their own benefit unit as its claimant, and none
  # claims Universal Credit, so no claim ends their Child Tax Credit.
  period: 2024
  input:
    age: [17, 17, 17]
    current_education: [UPPER_SECONDARY, UPPER_SECONDARY, UPPER_SECONDARY]
    child_tax_credit_reported: [0.01, 0, 0]
    working_tax_credit_reported: [0, 0.01, 0]
    would_claim_uc: [false, false, false]
  output:
    is_qualifying_young_person_for_universal_credit: [false, false, true]

- name: A parent's own reports of every existing benefit leave their young person a qualifying young person.
  period: 2026
  input:
    people:
      parent:
        age: 45
        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 3_000
        housing_benefit_reported: 3_000
        child_tax_credit_reported: 3_000
        working_tax_credit_reported: 3_000
        esa_income_reported: 3_000
        jsa_income_reported: 3_000
      young_person:
        age: 17
        current_education: POST_SECONDARY
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    is_qualifying_young_person_for_universal_credit: [false, true]

- name: A couple's Working Tax Credit award reported by one partner excludes both 18-year-old partners.
  # Tax Credits Act 2002 s.3(3): the members of a couple claim jointly.
  period: 2024
  input:
    people:
      claimant:
        age: 18
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: true
        working_tax_credit_reported: 2_000
      partner:
        age: 18
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
  output:
    is_qualifying_young_person_for_universal_credit: [false, false]

- name: A couple's Child Tax Credit award does not exclude a dependant who reports none.
  # The couple doesn't claim Universal Credit, so no claim ends its award.
  period: 2024
  input:
    people:
      claimant:
        age: 18
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: true
        child_tax_credit_reported: 2_000
      partner:
        age: 18
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [claimant, partner, young_person]
        would_claim_uc: false
  output:
    is_qualifying_young_person_for_universal_credit: [false, false, true]

- name: A partner's own Housing Benefit report leaves an 18-year-old claimant a qualifying young person.
  # The partner reports their own Housing Benefit, and the formula reads
  # only tax credits across the couple.
  period: 2024
  input:
    people:
      claimant:
        age: 18
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
        housing_benefit_reported: 3_000
    benunits:
      benunit:
        members: [claimant, partner]
  output:
    is_qualifying_young_person_for_universal_credit: [true, false]

- name: A dependant's own Child Tax Credit award leaves an 18-year-old claimant a qualifying young person.
  # Tax Credits Act 2002 s.3(3)(b): the dependant claims as a single person,
  # so their award is not the claimant's.
  period: 2024
  input:
    people:
      claimant:
        age: 18
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: false
        child_tax_credit_reported: 1_000
    benunits:
      benunit:
        members: [claimant, young_person]
  output:
    is_qualifying_young_person_for_universal_credit: [true, false]
