# Under the Universal Credit (Transitional Provisions) Regulations 2014
# reg. 28, DWP doesn't count a person entitled to an existing benefit (reg.
# 2(1)) as a UC qualifying young person: income-based JSA, income-related
# ESA, Income Support, Housing Benefit, Child Tax Credit and Working Tax
# Credit. The predicate reads the person's own reports and, for a claimant or
# partner, the couple's joint tax credit award (Tax Credits Act 2002 s.3(3)).
# It reads a report only in a year the model pays that benefit, only until
# the model's legacy closure, or for a claimant or partner the family's
# Universal Credit claim, ends the award on it, and only if no reform
# neutralises it. The model pays Income Support and income-based
# JSA until 31 March 2026 and tax credits until 5 April 2025, and has no
# closure date for Housing Benefit or income-related ESA. It also ends a
# person's legacy awards when its annual migration proxy closes them, and
# the predicate follows that closure
# (uc_qualifying_young_person_legacy_closure.yaml covers it). In these cases
# a young person's own report closes their legacy awards only where that
# benefit's year gate has already closed, so the closure decides no case.
# The claim limbs end only a claimant's or partner's own award
# (uc_qualifying_young_person_universal_credit_claim.yaml covers them), so
# the cases that test a claimant's own Child Tax Credit or Housing Benefit
# report claim no Universal Credit (would_claim_uc). The first six cases,
# and the four after the seventh, share one household: a parent aged 45 and
# a 17-year-old on a non-advanced course, North East, owned outright, no
# income.

- name: A parent's young person who reports their own Income Support attracts no child element.
  period: 2025
  input:
    people:
      parent:
        age: 45
        is_parent: true
        is_claimant_or_partner: true
      young_person:
        age: 17
        current_education: POST_SECONDARY
        is_claimant_or_partner: false
        income_support_reported: 3_000
    benunits:
      benunit:
        members: [parent, young_person]
    households:
      household:
        members: [parent, young_person]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    is_qualifying_young_person_for_universal_credit: [false, false]
    is_child_or_qualifying_young_person_for_universal_credit: [false, false]
    uc_child_element: 0
    universal_credit: 4_801.68

