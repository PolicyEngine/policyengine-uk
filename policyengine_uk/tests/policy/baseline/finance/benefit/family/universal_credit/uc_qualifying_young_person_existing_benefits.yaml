- name: An 18-year-old claimant on a non-advanced course who reports Housing Benefit is not a qualifying young person.
  # The claimant doesn't claim Universal Credit, so no claim ends their own
  # Housing Benefit (uc_qualifying_young_person_universal_credit_claim.yaml
  # covers a claim). They get no Universal Credit.
  period: 2026
  input:
    people:
      claimant:
        age: 18
        current_education: POST_SECONDARY
        is_claimant_or_partner: true
        housing_benefit_reported: 6_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
    households:
      household:
        members: [claimant]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    is_qualifying_young_person_for_universal_credit: [false]
    is_child_or_qualifying_young_person_for_universal_credit: [false]
    uc_child_element: 0
    universal_credit: 0

