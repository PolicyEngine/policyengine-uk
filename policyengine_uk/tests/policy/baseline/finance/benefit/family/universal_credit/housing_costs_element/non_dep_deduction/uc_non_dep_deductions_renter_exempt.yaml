- name: UC Sch 4 para 15, a partner whom reg 3(3) excludes from the claim brings no exemption by being blind
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 45
        is_household_head: true
        is_claimant_or_partner: true
      partner:
        age: 43
        is_blind: true
        is_claimant_or_partner: true
        # Reg 3(3)(e): subject to immigration control, so the claimant
        # claims as a single person.
        uc_is_ineligible_partner: true
      son:
        age: 22
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
    benunits:
      family:
        members: [claimant, partner, son]
    households:
      home:
        members: [claimant, partner, son]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_uc_single_or_joint_claimant: [true, false, false]
    is_benefit_unit_non_dependant_for_universal_credit: [false, false, true]
    # At this head LHA_allowed_bedrooms gives the son no room: 1 bedroom,
    # category B, whose rate the model sets at £9,000.00 a year, below the
    # £10,400 rent. #2010 gives him the room (para 10(1)(c)).
    LHA_allowed_bedrooms: 1
    LHA_category: B
    # Para 1(2) makes the claimant the renter. The blind partner is no claimant,
    # so para 15 gives no exemption.
    uc_non_dep_deductions_renter_exempt: false
    # The son, aged 22, owes 96.55 x 12 = 1,158.60 (para 13).
    uc_non_dep_deductions: 1_158.60
    # 9,000.00 - 1,158.60 = 7,841.40.
    uc_housing_costs_element: 7_841.40
    # Single rate aged 25 or over: 424.90 x 12 = 5,098.80. Under reg 3(3)
    # the claimant claims as a single person.
    uc_standard_allowance: 5_098.80
    # 5,098.80 + 7,841.40 = 12,940.20, with no income to taper.
    universal_credit: 12_940.20
    # 12,940.20 + 100 (Household Energy Payment) - 90 (the TV Licence, which the model halves
    # for a household with a blind member) = 12,950.20.
    household_net_income: 12_950.20

