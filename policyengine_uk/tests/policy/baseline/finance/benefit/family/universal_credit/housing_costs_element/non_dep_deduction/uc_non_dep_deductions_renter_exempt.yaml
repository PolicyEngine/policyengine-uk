- name: UC Sch 4 para 15(2)(c), a single claimant on armed forces independence payment is exempt
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 45
        armed_forces_independence_payment: 5000
        attendance_allowance: 0
        is_household_head: true
        is_claimant_or_partner: true
      partner:
        age: 43
        is_claimant_or_partner: true
        # Reg 3(3)(e): subject to immigration control, so the claimant
        # claims as a single person.
        uc_is_ineligible_partner: true
      son:
        age: 22
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
    benunits:
      family:
        members: [claimant, partner, son]
    households:
      home:
        members: [claimant, partner, son]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_uc_single_or_joint_claimant: [true, false, false]
    is_benefit_unit_non_dependant_for_universal_credit: [false, false, true]
    # At this head LHA_allowed_bedrooms gives the son no room: 1 bedroom,
    # category B, whose rate the model sets at £9,000.00 a year, below the
    # £10,400 rent. #2010 gives him the room (para 10(1)(c)).
    LHA_allowed_bedrooms: 1
    LHA_category: B
    # Reg 2's attendance allowance includes armed forces independence payment
    # (head (f)), so the claimant is in receipt of attendance allowance
    # (para 15(2)(c)) without Attendance Allowance itself.
    uc_non_dep_deductions_renter_exempt: true
    uc_non_dep_deductions: 0
    # The rent less no contribution: 9,000.00.
    uc_housing_costs_element: 9_000.00
    # Single rate aged 25 or over: 424.90 x 12 = 5,098.80. Under reg 3(3)
    # the claimant claims as a single person.
    uc_standard_allowance: 5_098.80
    # 5,098.80 + 9,000.00 = 14,098.80, with no income to taper;
    # the formula takes no armed forces independence payment as unearned income.
    universal_credit: 14_098.80
    # 14,098.80 + 100 (Household Energy Payment) - 180 (the TV Licence) = 14,018.80.
    # household_benefits lists afcs but not armed_forces_independence_payment,
    # so household net income leaves out the £5,000 payment.
    household_net_income: 14_018.80

