    # 8,003.64 + 9,000.00 = 17,003.64, with no income to taper.
    universal_credit: 17_003.64
    # 17,003.64 + 100 (Household Energy Payment) - 90 (the TV Licence, which the model halves
    # for a household with a blind member) = 17,013.64.
    household_net_income: 17_013.64

