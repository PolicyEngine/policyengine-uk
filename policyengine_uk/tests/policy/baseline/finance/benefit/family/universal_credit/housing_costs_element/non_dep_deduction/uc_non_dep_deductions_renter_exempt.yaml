- name: UC Sch 4 para 15, a joint claim where the blind partner is a joint renter is exempt
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 45
        is_household_head: true
        is_claimant_or_partner: true
      partner:
        age: 43
        is_blind: true
        is_claimant_or_partner: true
        uc_is_ineligible_partner: false
      son:
        age: 22
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
    benunits:
      family:
        members: [claimant, partner, son]
    households:
      home:
        members: [claimant, partner, son]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_uc_single_or_joint_claimant: [true, true, false]
    is_benefit_unit_non_dependant_for_universal_credit: [false, false, true]
    # The claimant, the partner who shares her room, and the son, a
    # non-dependant who is not a child (Sch 4 para 10(1)(a), (c)): 2
    # bedrooms, category C, whose £208.85 weekly rate (£10,860.20 a year)
    # exceeds the £10,400 rent, so the formula takes the rent.
    LHA_allowed_bedrooms: 2
    LHA_category: C
    # Both members claim jointly, so the blind partner is a joint renter
    # (para 15(1)(b), (2)(a)).
    uc_non_dep_deductions_renter_exempt: true
    uc_non_dep_deductions: 0
    # The rent less no contribution: 10,400.00.
    uc_housing_costs_element: 10_400.00
    # Couple rate, both aged 25 or over: 666.97 x 12 = 8,003.64.
    uc_standard_allowance: 8_003.64
    # 8,003.64 + 10,400.00 = 18,403.64, with no income to taper.
    universal_credit: 18_403.64
    # 18,403.64 + 100 (Household Energy Payment) - 90 (the TV Licence, which the model halves
    # for a household with a blind member) = 18,413.64.
    household_net_income: 18_413.64

