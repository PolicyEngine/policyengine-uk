        members: [carer, young_person]
    households:
      household:
        members: [carer, young_person]
  output:
    is_child_or_qualifying_young_person_for_universal_credit: [false, false]
    is_benefit_unit_non_dependant_for_universal_credit: [false, false]
    uc_non_dep_deductions: 0

