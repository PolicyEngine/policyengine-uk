# Non-dependants within the claimant's own benefit unit.
#
# A benefit unit can include someone aged 16 or over who is neither the
# claimant or partner nor a child or young person the claimant is responsible
# for, such as an adult son or a 19-year-old who has left education. In law
# that person is a non-dependant of the renter (UC Regs 2013 Sch 4 para
# 9(1)(c) and (2); HB Regs 2006 and HB (SPC) Regs 2006 reg 3; CTR SI
# 2012/2885 reg 9, WSI 2013/3029 reg 9, SSI 2021/249 reg 8), so their family's
# claim bears a deduction for them, subject to each scheme's exemptions.
#
# Amounts for 2026-27:
# - UC housing cost contribution £96.55 a month (Sch 4 para 14(1)), aged 21
#   or over (para 16(2)(a)): £1,158.60 a year.
# - HB non-dependant aged 18 or over not in remunerative work £20.40 a week
#   (reg 74(1)(b)): £1,060.80 a year. In remunerative work with gross income
#   of £300 a week: £64.35 (reg 74(2)(c)), £3,346.20 a year. The HB cases
#   give part-time earners £50 a week for 10 hours, below remunerative work
#   (16 hours, reg 6) and inside the lowest band.

- name: UC, an adult son in the renter's benefit unit bears a housing cost contribution
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 50
        is_household_head: true
        is_claimant_or_partner: true
      son:
        age: 25
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, son]
    households:
      household:
        members: [parent, son]
  output:
    is_benefit_unit_non_dependant_for_universal_credit: [false, true]
    uc_individual_non_dep_deduction: [0, 1_158.60]
    uc_non_dep_deductions: 1_158.60

- name: UC, no contribution for a non-dependant in the benefit unit under 21
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 50
        is_household_head: true
        is_claimant_or_partner: true
      son:
        # Left education: not a qualifying young person.
        age: 19
        is_claimant_or_partner: false
        is_qualifying_young_person_for_universal_credit: false
    benunits:
      benunit:
        members: [parent, son]
    households:
      household:
        members: [parent, son]
  output:
    is_benefit_unit_non_dependant_for_universal_credit: [false, true]
    uc_non_dep_deductions: 0

- name: UC, a qualifying young person the renter is responsible for is not a non-dependant
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 50
        is_household_head: true
        is_claimant_or_partner: true
      daughter:
        age: 19
        is_claimant_or_partner: false
        is_qualifying_young_person_for_universal_credit: true
    benunits:
      benunit:
        members: [parent, daughter]
    households:
      household:
        members: [parent, daughter]
  output:
    is_benefit_unit_non_dependant_for_universal_credit: [false, false]
    uc_non_dep_deductions: 0

# Sch 4 para 9(2)(g): a qualifying young person for whom no one in the
