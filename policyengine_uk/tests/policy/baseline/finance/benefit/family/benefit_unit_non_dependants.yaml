# The sharer's adult son is a non-dependant of both jointly liable people.
# The blind sharer is exempt; the head is not and bears half (para 8(5)).
- name: CTR, a blind sharer is exempt for its own adult son but the head still bears half
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 50
        is_household_head: true
        is_claimant_or_partner: true
      sharer:
        age: 48
        is_claimant_or_partner: true
        is_blind: true
      sharer_son:
        age: 25
        is_claimant_or_partner: false
        council_tax_reduction_individual_non_dep_deduction: 300
    benunits:
      benunit_1:
        members: [head]
      benunit_2:
        members: [sharer, sharer_son]
        liable_for_share_of_household_rent: true
    households:
      household:
        members: [head, sharer, sharer_son]
        rent: 12_000
        country: SCOTLAND
  output:
    council_tax_reduction_non_dep_deductions: [150, 0]

# The English working-age local schemes keep their own aggregation, which
# charges only other families' non-dependants. Widening the shared
# eligibility must not make a jointly liable sharer bear the head's own son.
- name: Local CTR (Newham), a jointly liable sharer does not bear the head's own in-unit son
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 50
        is_household_head: true
        is_claimant_or_partner: true
      son:
        age: 25
        is_claimant_or_partner: false
        employment_income: 20_000
        weekly_hours: 37.5
      sharer:
        age: 48
        is_claimant_or_partner: true
    benunits:
      benunit_1:
        members: [head, son]
        would_claim_council_tax_reduction: true
      benunit_2:
        members: [sharer]
        liable_for_share_of_household_rent: true
        would_claim_council_tax_reduction: true
    households:
      household:
        members: [head, son, sharer]
        rent: 12_000
        region: LONDON
        local_authority: NEWHAM
        tenure_type: RENT_PRIVATELY
        council_tax: 1_800
  output:
    council_tax_reduction_joint_liability_share: [0.5, 0.5]
    newham_council_tax_reduction_non_dep_deductions: [0, 0]
    newham_council_tax_reduction: [630, 630]
