  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 50
        is_household_head: true
        is_claimant_or_partner: true
      son:
        age: 25
        is_claimant_or_partner: false
        employment_income: 2_600
        weekly_hours: 10
      sharer:
        age: 48
        is_claimant_or_partner: true
    benunits:
      benunit_1:
        members: [head, son]
      benunit_2:
        members: [sharer]
        liable_for_share_of_household_rent: true
    households:
      household:
        members: [head, son, sharer]
        rent: 12_000
  output:
    share_of_household_rent: [0.5, 0.5]
    housing_benefit_non_dep_deductions: [530.40, 530.40]

