# Higher category only: Schedule 3 paragraph 1, age 65 or over.
# Each case states that the claimant or partner attained State Pension age
# before the April 2021 cutoff, as everyone at pension age before then had.
# Parameter processing backdates the cutoff, like every parameter, to 2015,
# so a unit given no person ages would otherwise read as the later cohort.

- name: Higher pension-age single allowance in 2015
  period: 2015
  absolute_error_margin: 0.01
  input:
    housing_benefit_eligible: true
    housing_benefit_pension_age_regulations_apply: true
    housing_benefit_attained_pension_age_before_cutoff: true
    eldest_claimant_or_partner_age: 70
    is_single_person: true
    is_couple: false
    is_lone_parent: false
    benefits_premiums: 0
  output:
    housing_benefit_applicable_amount: 166.05 * 52

