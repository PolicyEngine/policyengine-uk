- name: Reduced rent without LHA
  period: 2025
  input:
    benunit_rent: 8_000
    LHA_eligible: false
    housing_benefit_applicable_amount: 1_000
    housing_benefit_applicable_income: 11_000
    LHA_cap: 1_000
    housing_benefit_non_dep_deductions: 0
  output:
    housing_benefit_entitlement: 1_500

- name: Reduced rent with LHA
  period: 2025
  input:
    benunit_rent: 8_000
    LHA_eligible: true
    housing_benefit_applicable_amount: 1_000
    housing_benefit_applicable_income: 11_000
    LHA_cap: 1_000
    housing_benefit_non_dep_deductions: 0
  output:
    # The eligible rent is the LHA cap of 1,000 (SI 2006/213 reg 12D(2)(a)),
    # and the taper of 0.65 * (11,000 - 1,000) = 6,500 is deducted from it
    # (reg 71): max(0, 1,000 - 6,500) = 0. Capping after the taper gave
    # min(8,000 - 6,500, 1,000) = 1,000.
    housing_benefit_entitlement: 0

- name: Capped at 0
  period: 2025
  input:
    benunit_rent: 8_000
    LHA_eligible: false
    housing_benefit_applicable_amount: 1_000
    housing_benefit_applicable_income: 11_000
    LHA_cap: 1_000
    housing_benefit_non_dep_deductions: 2_000
  output:
    housing_benefit_entitlement: 0

- name: Fully reduceed rent
  period: 2025
  input:
    benunit_rent: 6_000
    LHA_eligible: false
    housing_benefit_applicable_amount: 1_000
    housing_benefit_applicable_income: 11_000
    LHA_cap: 1_000
    housing_benefit_non_dep_deductions: 0
  output:
    housing_benefit_entitlement: 0
