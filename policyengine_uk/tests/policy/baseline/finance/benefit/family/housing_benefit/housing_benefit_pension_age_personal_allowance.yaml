- name: Private renter aged 70 with a £30,000 State Pension is assessed at the lower rate
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 70
        state_pension_reported: 30_000
    benunits:
      benunit:
        members: [person]
    households:
      household:
        members: [person]
        rent: 9_000
        tenure_type: RENT_PRIVATELY
  output:
    housing_benefit_attained_pension_age_before_cutoff: false
    housing_benefit_applicable_amount: 238 * 52
    housing_benefit: 47.68  # 656.08 at the higher rate: 0.65 x (256 - 238) x 52 = 608.40 more
