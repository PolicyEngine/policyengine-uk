# Pension-age Housing Benefit personal allowances by when State Pension age was
# attained: SI 2006/214 Sch 3 para 1 (NI: SR 2006/406 Sch 4 para 1), as amended
# by SI 2021/188 from 1 April 2021. Higher rates (1)(b)/(2)(b) where a member
# attained pensionable age before 1 April 2021; lower rates (1)(c)/(2)(c) where
# every member attained it on or after. Amounts are the Up-rating Order rates.
# Each date of birth is placed by age and months_since_last_birthday, both
# measured at 6 October of the fiscal year.

- name: Single woman who attained State Pension age on 31 March 2021 keeps the higher rate
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 71
        months_since_last_birthday: 6.19355
        is_male: false
    benunits:
      benunit:
        members: [claimant]
        housing_benefit_eligible: true
        benefits_premiums: 0
  output:
    housing_benefit_attained_pension_age_before_cutoff: true
    housing_benefit_applicable_amount: 256.00 * 52  # para 1(1)(b), claimant attained 31 March 2021

