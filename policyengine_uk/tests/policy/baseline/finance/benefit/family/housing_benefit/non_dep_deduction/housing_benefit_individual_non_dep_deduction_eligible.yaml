- name: Eligible
  period: 2025
  input:
    is_non_dependant_of_household_head: true
    age: 18
  output:
    housing_benefit_individual_non_dep_deduction_eligible: true

- name: Age ineligible
  period: 2025
  input:
    is_non_dependant_of_household_head: true
    age: 17
  output:
    housing_benefit_individual_non_dep_deduction_eligible: false

- name: Rent ineligible
  period: 2025
  input:
    benunit_is_rent_liable: true
    age: 18
  output:
    housing_benefit_individual_non_dep_deduction_eligible: false

# HB Regs 2006 reg 3: a member of the claimant's own benefit unit who is not
# the claimant, partner or a child or young person.
- name: Non-dependant within the benefit unit
  period: 2025
  input:
    is_non_dependant_of_household_head: false
    is_benefit_unit_non_dependant_for_legacy_benefits: true
    age: 19
  output:
    housing_benefit_individual_non_dep_deduction_eligible: true

- name: Non-dependant within the benefit unit, under 18
  period: 2025
  input:
    is_non_dependant_of_household_head: false
    is_benefit_unit_non_dependant_for_legacy_benefits: true
    age: 17
  output:
    housing_benefit_individual_non_dep_deduction_eligible: false
