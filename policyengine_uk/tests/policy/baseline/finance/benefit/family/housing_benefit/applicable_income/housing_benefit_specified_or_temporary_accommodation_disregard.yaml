    # £10,400 ≥ £520 + £5,061.16 + £889.20 = £6,470.36.
    housing_benefit_applicable_income_disregard: 6_470.36 # (£10 + £97.33 + £17.10) × 52

# End to end: a working-age claimant continuing a Housing Benefit award, on a
# council tenancy (no Local Housing Allowance), with the applicable amount set
# as an input (£95.55 × 52, the 2026-27 single 25-or-over personal allowance)
# so the test does not depend on uprating it to 2027-28. Entitlement is the
# rent less 65% of applicable income above the applicable amount.

- name: Housing Benefit entitlement rises by 65% of the para 18 amount
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 10_400 # £200 a week
        weekly_hours: 10
        housing_benefit_reported: 1
    benunits:
      benunit:
        members: [person]
        would_claim_uc: false
        guarantee_credit: 0
        housing_benefit_applicable_amount: 4_968.60
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [person]
        rent: 10_400
        tenure_type: RENT_FROM_COUNCIL
  output:
    housing_benefit_applicable_income_disregard: 4_301.96 # (£5 + £77.73) × 52
    housing_benefit_applicable_income: 6_098.04 # 10,400 − 4,301.96
    # 10,400 − 0.65 × (6,098.04 − 4,968.60) = 10,400 − 734.14.
    housing_benefit_entitlement: 9_665.86

