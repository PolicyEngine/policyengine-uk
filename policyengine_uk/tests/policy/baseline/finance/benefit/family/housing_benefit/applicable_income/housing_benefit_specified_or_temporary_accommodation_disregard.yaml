# Housing Benefit earnings disregard for specified or temporary accommodation:
# SI 2006/213 Sch 4 para 18, inserted from 5 October 2026 by SI 2026/753 reg
# 2(4) as substituted by SI 2026/978 reg 2(2); NI: SR 2006/405 Sch 5 para 18,
# inserted from 5 October 2026 by SR 2026/157 reg 2(4).
#
# Para 18(1): where (a) the claimant lives in accommodation in UC Regs 2013
# Sch 1 para 3A or 3B (NI: UC Regs 2016 Sch 1 para 4 or 4A) and (b) the
# claimant or partner is an employed or self-employed earner, the amount in
# para 18(2). A couple has one amount: it applies to the partner's earnings
# only to the extent the claimant's fall short of it.
# Para 18(2), weekly: single claimant or lone parent under 25 £61.41, 25 or
# over £77.73; couple both under 18 £97.33, one 18 or over but both under 25
# £61.53, one 25 or over £119.70.
# It is added to the £5/£10/£25 (paras 10, 7, 4): no paragraph excludes the
# other. Para 17(3)(a) as amended counts it in the £17.10 additional
# disregard's earnings test: net earnings must equal or exceed the paras 3 to
# 10A and 18 disregards + deductible childcare + £17.10.
#
# Annual = weekly × 52: £61.41 → 3,193.32; £77.73 → 4,041.96; £97.33 →
# 5,061.16; £61.53 → 3,199.56; £119.70 → 6,224.40; £5 → 260; £10 → 520; £25
# → 1,300; £17.10 → 889.20.
#
# The accommodation amount retains its legal date: 2026-27 has 182 days
# before 5 October and 183 days afterwards. Completed awards are combined
# after earnings caps, childcare, the income threshold and taper.
# Earnings are below the income tax personal allowance and the National
# Insurance primary threshold (both £12,570), so net earnings equal gross
# earnings, and the hours are below every £17.10 work condition unless a
# test says otherwise.

- name: Single claimant aged 30 in specified or temporary accommodation gets £5 plus £77.73
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        employment_income: 10_400 # £200 a week
        weekly_hours: 10
    benunits:
      benunit:
        members: [person]
        in_specified_or_temporary_accommodation: true
  output:
    housing_benefit_specified_or_temporary_accommodation_disregard: 4_041.96 # para 18(2)(a)(ii)
    housing_benefit_applicable_income_disregard: 4_301.96 # (£5 + £77.73) × 52

