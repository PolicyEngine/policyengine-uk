- name: Continuing council tenant retains the default half-pension deduction
  # SI 2006/213 reg 36(3)(c): half of the personal pension contribution.
  # Earnings are below the tax and NI thresholds. Net earnings are
  # 12,000 - 0.5 * 2,000 = 11,000; the single earnings disregard is 5 * 52.
  # Applicable income is 10,740 and the allowance is 92.05 * 52 = 4,786.60.
  # HB = 10,000 - 0.65 * (10,740 - 4,786.60) = 6,130.29.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 12_000
        weekly_hours: 16
        personal_pension_contributions: 2_000
        housing_benefit_reported: 1_000  # continuing award, not calculated cash
    benunits:
      benunit:
        members: [person]
        would_claim_uc: false
    households:
      household:
        members: [person]
        tenure_type: RENT_FROM_COUNCIL
        region: LONDON
        num_bedrooms: 1
        rent: 10_000
  output:
    housing_benefit: 6_130.29
    housing_benefit_applicable_income: 10_740
    housing_benefit_net_earnings: 11_000
    housing_benefit_applicable_income_disregard: 260
    housing_benefit_applicable_amount: 4_786.60
    pension_contributions: 2_000
    income_tax: 0
    national_insurance: 0
    housing_benefit_non_dep_deductions: 0
    housing_benefit_benefit_cap_reduction: 0
    housing_benefit_on_passporting_benefit: false
    housing_benefit_eligible: true
    would_claim_housing_benefit: true
    legacy_benefits_closed: false
    universal_credit: 0

