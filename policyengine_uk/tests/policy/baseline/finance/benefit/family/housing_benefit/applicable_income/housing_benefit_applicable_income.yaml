- name: Capped at 0
  period: 2025
  input:
    would_claim_uc: false  # not on Universal Credit, which passports the means test
    # Benefits
    child_benefit: 1_000
    income_support: 0
    jsa_income: 0
    esa_income: 0
    # Income
    employment_income: 0
    self_employment_income: 0
    property_income: 0
    private_pension_income: 0
    # Tax
    income_tax: 0
    national_insurance: 0
    # Other 
    tax_credits: 0
    pension_contributions: 0
    housing_benefit_applicable_income_disregard: 5_000
    housing_benefit_applicable_income_childcare_element: 10_000
  output:
    housing_benefit_applicable_income: 0

- name: Child Benefit is fully disregarded
  period: 2025
  input:
    would_claim_uc: false  # not on Universal Credit, which passports the means test
    # Benefits
    child_benefit: 1_000
    income_support: 0
    jsa_income: 0
    esa_income: 0
    # Income
    employment_income: 0
    self_employment_income: 0
    property_income: 0
    private_pension_income: 0
    # Tax
    income_tax: 0
    national_insurance: 0
    # Other 
    tax_credits: 0
    pension_contributions: 0
    housing_benefit_applicable_income_disregard: 0
    housing_benefit_applicable_income_childcare_element: 0
  output:
    housing_benefit_applicable_income: 0

- name: Pension contributions halved
  # SI 2006/213 reg 36(3)(b): half of the pension contributions come off
  # earnings. 3,250 - 1,500 / 2 = 2,500.
  period: 2025
  input:
    would_claim_uc: false  # not on Universal Credit, which passports the means test
    # Benefits
    child_benefit: 0
    income_support: 0
    jsa_income: 0
    esa_income: 0
    # Income
    employment_income: 3_250
    self_employment_income: 0
    property_income: 0
    private_pension_income: 0
    # Tax
    income_tax: 0
    national_insurance: 0
    # Other 
    tax_credits: 0
    pension_contributions: 1_500
    housing_benefit_applicable_income_disregard: 0
    housing_benefit_applicable_income_childcare_element: 0
  output:
    housing_benefit_applicable_income: 2_500

- name: Added Tax and income
  # Earnings plus working tax credit, which counts in full where Sch 5
  # para 56 does not apply. 3,250 + 2,000 - 1,500 / 2 = 4,500.
  period: 2025
  input:
    would_claim_uc: false  # not on Universal Credit, which passports the means test
    # Benefits
    child_benefit: 0
    income_support: 0
    jsa_income: 0
    esa_income: 0
    # Income
    employment_income: 3_250
    self_employment_income: 0
    property_income: 0
    private_pension_income: 0
    # Tax
    income_tax: 0
    national_insurance: 0
    # Other 
    tax_credits: 2_000
    pension_contributions: 1_500
    housing_benefit_applicable_income_disregard: 0
    housing_benefit_applicable_income_childcare_element: 0
  output:
    housing_benefit_applicable_income: 4_500

- name: Pension contributions capped at 0
  # Applicable income is floored at nil: 3,250 - 100,000 / 2 < 0.
  period: 2025
  input:
    would_claim_uc: false  # not on Universal Credit, which passports the means test
    # Benefits
    child_benefit: 0
    income_support: 0
    jsa_income: 0
    esa_income: 0
    # Income
    employment_income: 3_250
    self_employment_income: 0
    property_income: 0
    private_pension_income: 0
    # Tax
    income_tax: 0
    national_insurance: 0
    # Other 
    tax_credits: 0
    pension_contributions: 100_000
    housing_benefit_applicable_income_disregard: 0
    housing_benefit_applicable_income_childcare_element: 0
  output:
    housing_benefit_applicable_income: 0

# GB Sch 5 paras 31/65 and reg 25(3); NI Sch 6 paras 32/64 and reg 22(3).

- name: ENGLAND working-age excludes Child Benefit, Social Fund and dependent earnings
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        private_pension_income: 12000
        income_tax: 0
        national_insurance: 0
        pension_contributions: 0
        ssmg: 500
      child:
        age: 17
        is_claimant_or_partner: false
        is_child_or_young_person_for_legacy_benefits: true
        employment_income: 10400
        income_tax: 0
        national_insurance: 0
        pension_contributions: 0
    benunits:
      family:
        members: [claimant, child]
        child_benefit: 1500
        income_support: 0
        esa_income: 0
        jsa_income: 0
        tax_credits: 0
        housing_benefit_pension_age_regulations_apply: false
        in_receipt_of_guarantee_credit: false
        in_receipt_of_savings_credit_only: false
        housing_benefit_on_passporting_benefit: false
        housing_benefit_tariff_income: 0
        housing_benefit_applicable_income_disregard: 0
        housing_benefit_applicable_income_childcare_element: 0
    households:
      home:
        members: [claimant, child]
        country: ENGLAND
  output:
    housing_benefit_applicable_income: 12000

