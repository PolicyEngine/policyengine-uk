- name: Added tax credits; rent from let property is capital, not income
  # HB Regs 2006 reg 46(4) treats income derived from capital as capital and
  # Sch 5 para 17 disregards it, so the £1,000 of property income does not
  # count: 1,000 child benefit + 2,250 IS + 1,000 tax credits - 1,500 / 2.
  period: 2025
  input:
    # Benefits
    child_benefit: 1_000
    income_support: 2_250
    jsa_income: 0
    esa_income: 0
    # Income
    employment_income: 0
    self_employment_income: 0
    property_income: 1_000
    private_pension_income: 0
    # Tax
    income_tax: 0
    national_insurance: 0
    # Other 
    tax_credits: 1_000
    pension_contributions: 1_500
    housing_benefit_applicable_income_disregard: 0
    housing_benefit_applicable_income_childcare_element: 0
  output:
    housing_benefit_applicable_income: 3_500

