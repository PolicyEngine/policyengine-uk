- name: Guarantee Credit passports Housing Benefit income and capital
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 70
        in_social_housing: true
        housing_benefit_reported: 1
        private_pension_income: 10_000
    benunits:
      benunit:
        members: person
        # The passport needs a guarantee credit that is paid. Pension Credit
        # income here is 10,000 plus 80 x 52 = 4,160 deemed from capital,
        # 14,160 in all, above the 2025-26 standard minimum guarantee
        # (227.10 x 52 = 11,809.20), so Pension Credit eligibility
        # is set along with the credit.
        guarantee_credit: 1
        is_pension_credit_eligible: true
        would_claim_uc: false
        housing_benefit_applicable_income_disregard: 0
        housing_benefit_applicable_income_childcare_element: 0
    households:
      household:
        members: person
        savings: 50_000
  output:
    housing_benefit_assessable_capital: 0
    housing_benefit_tariff_income: 0
    housing_benefit_applicable_income: 0
    housing_benefit_eligible: true

