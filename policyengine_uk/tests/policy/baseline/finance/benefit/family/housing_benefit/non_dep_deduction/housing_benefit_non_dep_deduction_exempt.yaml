# HB Regs 2006 (SI 2006/213) reg 74(7)-(8) and (10); SI 2006/214 reg 55(7)-(9).

- name: Full-time tertiary student is exempt
  period: 2026
  input:
    age: 20
    would_claim_uc: false
    current_education: TERTIARY
  output:
    housing_benefit_non_dep_deduction_exempt: true

- name: Full-time student in non-advanced education is exempt
  period: 2026
  input:
    age: 18
    would_claim_uc: false
    current_education: UPPER_SECONDARY
  output:
    housing_benefit_non_dep_deduction_exempt: true

- name: Higher education flag alone makes a student exempt
  period: 2026
  input:
    age: 30
    would_claim_uc: false
    current_education: NOT_IN_EDUCATION
    in_HE: true
  output:
    housing_benefit_non_dep_deduction_exempt: true

- name: A worker not in education is not exempt
  period: 2026
  input:
    age: 30
    would_claim_uc: false
    current_education: NOT_IN_EDUCATION
    employment_income: 20_000
  output:
    housing_benefit_non_dep_deduction_exempt: false

- name: State Pension Credit recipient is exempt at any age
  period: 2026
  input:
    age: 70
    would_claim_uc: false
    current_education: NOT_IN_EDUCATION
    pension_credit: 1_000
  output:
    housing_benefit_non_dep_deduction_exempt: true

- name: Income Support under 25 is exempt
  period: 2026
  input:
    age: 24
    would_claim_uc: false
    current_education: NOT_IN_EDUCATION
    income_support: 1_000
  output:
    housing_benefit_non_dep_deduction_exempt: true

- name: Income Support at 25 is not exempt
  period: 2026
  input:
    age: 25
    would_claim_uc: false
    current_education: NOT_IN_EDUCATION
    income_support: 1_000
  output:
    housing_benefit_non_dep_deduction_exempt: false

- name: Income-based JSA under 25 is exempt
  period: 2026
  input:
    age: 24
    would_claim_uc: false
    current_education: NOT_IN_EDUCATION
    jsa_income: 1_000
  output:
    housing_benefit_non_dep_deduction_exempt: true

- name: Income-related ESA under 25 is not exempt without an assessment-phase input
  period: 2026
  input:
    age: 24
    would_claim_uc: false
    current_education: NOT_IN_EDUCATION
    esa_income: 1_000
  output:
    # reg 74(8)(a) exempts only ESA(IR) without the support component and
    # outside the work-related activity group; the model has no ESA group input.
    housing_benefit_non_dep_deduction_exempt: false

- name: Universal Credit without earned income under 25 is exempt
  period: 2026
  input:
    age: 24
    current_education: NOT_IN_EDUCATION
    universal_credit_pre_benefit_cap: 1_000
  output:
    housing_benefit_non_dep_deduction_exempt: true

- name: Universal Credit with earned income under 25 is not exempt
  period: 2026
  input:
    age: 24
    current_education: NOT_IN_EDUCATION
    universal_credit_pre_benefit_cap: 1_000
    employment_income: 2_000
  output:
    housing_benefit_non_dep_deduction_exempt: false

- name: Universal Credit without earned income at 25 is not exempt
  period: 2026
  input:
    age: 25
    current_education: NOT_IN_EDUCATION
    universal_credit_pre_benefit_cap: 1_000
  output:
    housing_benefit_non_dep_deduction_exempt: false

- name: Another member's Universal Credit claim doesn't exempt a non-dependant under 25
  # The family's Universal Credit is the 40-year-old's own claim
  # (is_uc_claimant), so the 22-year-old partner with no earnings is not
  # entitled to it (HB Regs 2006 reg 74(8)(b); SI 2012/2885 Sch 1 para
  # 8(8)(c)). The 40-year-old has earnings, so the limb exempts no one.
  period: 2026
  input:
    people:
      claimant:
        age: 70
        is_household_head: true
      partner_a:
        age: 22
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
        is_uc_claimant: false
      partner_b:
        age: 30
        employment_income: 9_360
        weekly_hours: 16
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
        is_uc_claimant: false
      other_adult:
        age: 40
        employment_income: 1_040
        weekly_hours: 2
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
        is_uc_claimant: true
    benunits:
      claimant_unit:
        members: [claimant]
        pension_credit: 0
      non_dependant_unit:
        members: [partner_a, partner_b, other_adult]
        universal_credit_pre_benefit_cap: 5_200
        income_support: 0
        jsa_income: 0
        esa_income: 0
        pension_credit: 0
    households:
      household:
        members: [claimant, partner_a, partner_b, other_adult]
        country: ENGLAND
        local_authority: MAIDSTONE
  output:
    housing_benefit_non_dep_deduction_exempt: [false, false, false, false]
    council_tax_reduction_non_dep_deduction_exempt: [false, false, false, false]
