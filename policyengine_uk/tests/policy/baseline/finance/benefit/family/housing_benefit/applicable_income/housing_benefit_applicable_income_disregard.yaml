- name: Childcare charges count against the additional disregard's earnings test
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 5_200 # £100 a week
        weekly_hours: 16
        childcare_expenses: 4_160 # £80 a week
      child:
        age: 5
    benunits:
      benunit:
        members: [parent, child]
  output:
    # Childcare deducted is min(£4,160, one-child maximum) = £4,160.
    # £5,200 < £1,300 + £4,160 + £889.20 = £6,349.20, so only £25 a week.
    housing_benefit_applicable_income_childcare_element: 4_160
    housing_benefit_applicable_income_disregard: 1_300

