# Housing Benefit earnings disregards: SI 2006/213 Sch 4 (working age) and
# SI 2006/214 Sch 4 (pension age); NI: SR 2006/405 and SR 2006/406 Sch 5.
# Weekly amounts: lone parent £25 (213 para 4; 214 para 2), couple £10 (213
# para 7; 214 para 7(b)), anyone else £5 (213 para 10; 214 para 7(a)), each
# taken from net earnings, so never more than them. The additional earnings
# disregard of £17.10 (213 para 17; 214 para 9) needs a work condition and
# net earnings of at least the other disregards + deductible childcare
# charges + £17.10. Annual = weekly × 52. Earnings in these cases are below
# the income tax personal allowance (£12,570) and the National Insurance
# primary threshold (£241.73 × 52 = £12,569.96), so net earnings equal gross
# earnings.

- name: Pensioner with only a State Pension has no earnings to disregard
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 70
        state_pension_reported: 15_000
    benunits:
      benunit:
        members: [person]
  output:
    housing_benefit_net_earnings: 0
    housing_benefit_applicable_income_disregard: 0

- name: Single person earning £3 a week has all £3 disregarded
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 156 # £3 × 52
    benunits:
      benunit:
        members: [person]
  output:
    housing_benefit_applicable_income_disregard: 156 # min(£5, £3) × 52

