        age: 5
    benunits:
      benunit:
        members: [parent, child]
  output:
    # £5,200 ≥ £1,300 + £1,040 + £889.20 = £3,229.20.
    housing_benefit_applicable_income_childcare_element: 1_040
    housing_benefit_applicable_income_disregard: 2_189.20 # (£25 + £17.10) × 52

