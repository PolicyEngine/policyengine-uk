# The cases below derive special eligibility from severe disablement
# allowance or blindness (housing_benefit_special_earnings_disregard_eligible)
# instead of supplying it, and add a lone parent at the permitted-work
# maximum. Each holds the accommodation, childcare, additional-disregard and
# passport terms at nil, so the output is the standard amount alone.
#
# Specified amount, 2024-25: ESA Regulations 2008 reg 45(4) (NI: SR 2008/280
# reg 45(4)) and SI 1995/311 reg 17(4) set the limit at 16 x National Minimum
# Wage, rounded up to the next 50p (reg 45(9A), reg 17(10)). The adult rate
# in gov.hmrc.minimum_wage.non_apprentice is £11.44, and
# gov.dwp.ESA.exempt_work.higher_earnings_limit_minimum_wage_hours is 16:
# 16 x £11.44 = £183.04, rounded up to £183.50 a week.
#
# Couples: A does that exempt work for £60 a week, under 16 hours; B, the
# other member, earns £100 a week from other work and does no exempt work.
# Pension-age para 5A(4) (working-age para 10A(4)): A's £60 is under £183.50,
# so B's earnings are also disregarded up to £183.50 - £60 = £123.50, but at
# most £20. Pre-assessed permitted-work amount: (£60 + £20) x 52 = £4,160.
# Net earnings: (£60 + £100) x 52 = £8,320.
#
# Special amount before permitted work: £20 x 52 = £1,040, in place of the
# couple's £10. Para 5A(2): "paragraphs 1 to 5 and 7 do not apply", so the
# disregard is £4,160, not £4,160 + £1,040 = £5,200 and not £1,040.

# SI 2006/214 Sch 4. The claimant (A, 70) receives severe disablement
# allowance (para 5A(5)(c)) and does exempt work under SI 1995/311 reg 17(4)
# (para 5A(6)(b)). The SDA qualifies the couple for £20 (para 5(1)(a)(ii)).
- name: ENGLAND pension-age SDA recipient's permitted work replaces the special £20
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        is_claimant_or_partner: true
        sda: 100
      partner:
        age: 68
        is_claimant_or_partner: true
        sda: 0
    benunits:
      couple:
        members: [claimant, partner]
