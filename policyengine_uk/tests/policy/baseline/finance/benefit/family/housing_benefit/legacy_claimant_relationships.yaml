- name: Lone parent with qualifying young person uses lone-parent rates
  period: 2025
  absolute_error_margin: 0.01
  input:
    # Isolate the statutory Sch 4 categories from existing automatic uprating.
    gov.dwp.housing_benefit.means_test.income_disregard.single: 5
    gov.dwp.housing_benefit.means_test.income_disregard.couple: 10
    gov.dwp.housing_benefit.means_test.income_disregard.lone_parent: 25
    people:
      person0:
        age: 40
        weekly_hours: 0
        is_claimant_or_partner: true
        is_parent: true
      person1:
        age: 18
        weekly_hours: 0
        is_in_non_advanced_education: true
    benunits:
      benunit:
        members: [person0, person1]
        housing_benefit_eligible: true
        benefits_premiums: 0
  output:
    # HB Sch 3 para 1: the applicable weekly model rate is 92.04; *52.
    housing_benefit_applicable_amount: 4786.08
    # CTR retains the existing shared HB allowance parameters.
    council_tax_reduction_applicable_amount: 4786.08
    # HB Sch 4 paras 4/7/10: 25 * 52, with no hours disregard.
    housing_benefit_applicable_income_disregard: 1300

