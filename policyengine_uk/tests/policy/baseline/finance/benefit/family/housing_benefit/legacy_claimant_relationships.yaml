- name: Under-18 claimant allowance ignores an older qualifying dependant
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 17
        is_claimant_or_partner: true
      qualifying_dependant:
        age: 18
        is_claimant_or_partner: false
        is_in_non_advanced_education: true
    benunits:
      benunit:
        members: [claimant, qualifying_dependant]
        housing_benefit_eligible: true
        benefits_premiums: 0
  output:
    # HB Sch 3 para 1(2): the claimant is under 18, even if responsible
    # for an older qualifying young person. Younger rate 72.92 * 52.
    housing_benefit_applicable_amount: 3_791.84
    # The shared CTR allowance calculation also uses only claimant/partner ages.
    council_tax_reduction_applicable_amount: 3_791.84
