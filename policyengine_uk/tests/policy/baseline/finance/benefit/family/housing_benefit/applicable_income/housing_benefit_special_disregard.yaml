- name: Standard replacement, lone-parent precedence and earnings cap
  period: 2024
  input:
    housing_benefit_special_earnings_disregard_eligible: [true, true, true, true, false, false]
    housing_benefit_net_earnings: [5000, 5000, 5000, 500, 5000, 5000]
    is_couple: [false, true, false, true, false, true]
    is_lone_parent: [false, false, true, false, false, false]
    housing_benefit_specified_or_temporary_accommodation_disregard: [0, 0, 0, 0, 0, 0]
    housing_benefit_applicable_income_childcare_element: [0, 0, 0, 0, 0, 0]
    meets_housing_benefit_additional_earnings_disregard_conditions: [false, false, false, false, false, false]
    housing_benefit_on_passporting_benefit: [false, false, false, false, false, false]
  output:
    housing_benefit_special_earnings_disregard: [1040, 1040, 1300, 500, 260, 520]
    housing_benefit_applicable_income_disregard: [1040, 1040, 1300, 500, 260, 520]

- name: Special standard amount participates in additional-disregard threshold
  period: 2024
  absolute_error_margin: 0.01
  input:
    housing_benefit_special_earnings_disregard_eligible: [true, true, true]
    housing_benefit_net_earnings: [1929.19, 1929.20, 5000]
    is_couple: [false, true, false]
    is_lone_parent: [false, false, false]
    housing_benefit_specified_or_temporary_accommodation_disregard: [0, 0, 0]
    housing_benefit_applicable_income_childcare_element: [0, 0, 0]
    meets_housing_benefit_additional_earnings_disregard_conditions: [true, true, true]
    housing_benefit_on_passporting_benefit: [false, false, true]
  output:
    housing_benefit_applicable_income_disregard: [1040, 1929.20, 5000]

- name: A zero special-amount reform is not replaced with the ordinary amount
  period: 2024
  input:
