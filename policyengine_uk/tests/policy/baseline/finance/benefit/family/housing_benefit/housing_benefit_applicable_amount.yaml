# GB SI 2026/148 Sch 4: adult amounts and child amount 87.88/week.
- name: Single older
  period: 2026
  absolute_error_margin: 0.02
  input:
    people:
      claimant:
        age: 25
        is_claimant_or_partner: true
        is_housing_benefit_claimant: true
    benunits:
      family:
        members: [claimant]
        housing_benefit_eligible: true
        housing_benefit_pension_age_regulations_apply: false
        benefits_premiums: 0
  output:
    housing_benefit_applicable_amount: 4968.60

