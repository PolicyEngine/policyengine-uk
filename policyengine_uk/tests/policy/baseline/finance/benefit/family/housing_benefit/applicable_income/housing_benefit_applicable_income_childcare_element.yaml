- name: One child, capped
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_parent: true
        childcare_expenses: 9000
      child0:
        age: 10
    benunits:
      benunit:
        members: [claimant, child0]
  output:
    # Annual age limits are <16, or <17 if disabled/blind (HB reg 28(6)).
    # With 1 relevant children the deduction is min(cost, weekly cap * 52).
    num_relevant_children_for_housing_benefit_childcare: 1
    housing_benefit_applicable_income_childcare_element: 9000

