- name: One relevant child and an older young person use the one-child cap
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_parent: true
        childcare_expenses: 30_000
      child:
        age: 10
      young_person:
        age: 17
    benunits:
      benunit:
        members: [claimant, child, young_person]
  output:
    num_relevant_children_for_housing_benefit_childcare: 1
    # Reg 27(3) selects the one-child cap: min(30,000, 175 * 52). The cap is
    # fixed at 175/week in law (unchanged by SI 2025/295 art 23(2)).
    housing_benefit_applicable_income_childcare_element: 9_100

- name: Under-18 claimant is not their own relevant child
  period: 2025
  input:
    people:
      claimant:
        age: 17
        childcare_expenses: 9_000
    benunits:
      benunit:
        members: [claimant]
  output:
    # 0 dependants implies 0 childcare cap (HB reg 27(3)).
    num_relevant_children_for_housing_benefit_childcare: 0
    housing_benefit_applicable_income_childcare_element: 0

- name: Disabled 16-year-old outside education and training is not a relevant young person
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_parent: true
        childcare_expenses: 9_000
      young_person:
        age: 16
        is_disabled_for_benefits: true
        is_in_non_advanced_education: false
        is_in_approved_training: false
    benunits:
      benunit:
        members: [claimant, young_person]
  output:
    # HB reg 28(6) requires a child of the family, including a qualifying
    # young person; the disability age extension does not create that status.
    num_relevant_children_for_housing_benefit_childcare: 0
    housing_benefit_applicable_income_childcare_element: 0
