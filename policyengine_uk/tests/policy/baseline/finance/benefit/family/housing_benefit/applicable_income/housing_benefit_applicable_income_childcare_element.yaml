# Qualifying charges are externally pre-assessed; these tests isolate the
# count/cap/residual calculation. Cap inputs reproduce #1925, not another fix.
- name: "No children and no qualifying charges"
  period: 2024
  absolute_error_margin: 0.02
  input:
    people:
      claimant:
        age: 40
        is_parent: true
        childcare_expenses: 0
        is_claimant_or_partner: true
    benunits:
      family:
        members: ["claimant"]
        housing_benefit_net_earnings: 20000
        housing_benefit_special_earnings_disregard: 260
        housing_benefit_permitted_work_disregard: 0
        is_lone_parent: false
        housing_benefit_specified_or_temporary_accommodation_disregard: 0
        working_tax_credit: 0
        child_tax_credit: 0
        meets_housing_benefit_additional_earnings_disregard_conditions: false
        housing_benefit_on_passporting_benefit: false
        housing_benefit_pension_age_regulations_apply: false
    gov.dwp.tax_credits.working_tax_credit.elements.childcare_1: 175
    gov.dwp.tax_credits.working_tax_credit.elements.childcare_2: 300
  output:
    housing_benefit_applicable_income_childcare_element: 0

