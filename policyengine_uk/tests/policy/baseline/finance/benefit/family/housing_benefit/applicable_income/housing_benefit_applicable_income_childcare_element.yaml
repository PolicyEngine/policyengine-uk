# HB Regs 2006 regs 27–28 / pension regs 30–31: qualifying costs and deduction limits.
- name: One qualifying child capped at statutory 175 per week
  period: 2026
  absolute_error_margin: 0.02
  input:
    people:
      claimant:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
        weekly_hours: 16
        housing_benefit_paid_work_expected: true
      child:
        age: 10
        is_claimant_or_partner: false
        housing_benefit_childcare_charges_paid: 10000
        housing_benefit_childcare_provider: REGISTERED_APPROVED
    benunits:
      family:
        members: [claimant, child]
        housing_benefit_pension_age_regulations_apply: false
        housing_benefit_net_earnings: 20000
        housing_benefit_pre_additional_earnings_disregard: 1300
        working_tax_credit: 0
        child_tax_credit: 0
  output:
    num_relevant_children_for_housing_benefit_childcare: 1
    housing_benefit_applicable_income_childcare_element: 9100

