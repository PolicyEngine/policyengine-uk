# April 2027 projections use May-July 2026 earnings growth of 3.9%.
# Lower single/lone-parent: 238 * 1.039 * 52 = 12,858.664.
# Lower couple: 363.25 * 1.039 * 52 = 19,625.671.
# Higher single/lone-parent: 256 * 1.039 * 52 = 13,831.168.
# Higher couple: 383.35 * 1.039 * 52 = 20,711.6338.
# Regulation-set/cohort inputs isolate uprating from age-attainment logic.
- name: April 2027 lower single pension-age HB allowance follows earnings
  period: 2027
  absolute_error_margin: 0.01
  input:
    age: 70
    housing_benefit_eligible: true
    housing_benefit_pension_age_regulations_apply: true
    housing_benefit_attained_pension_age_before_cutoff: false
    benefits_premiums: 0
  output:
    housing_benefit_applicable_amount: 12_858.664

