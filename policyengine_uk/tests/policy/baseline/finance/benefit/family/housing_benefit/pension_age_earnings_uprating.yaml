  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
      child:
        age: 12
    benunits:
      benunit:
        members: [claimant, child]
        housing_benefit_eligible: true
        housing_benefit_pension_age_regulations_apply: true
        housing_benefit_attained_pension_age_before_cutoff: true
        benefits_premiums: 0
  output:
