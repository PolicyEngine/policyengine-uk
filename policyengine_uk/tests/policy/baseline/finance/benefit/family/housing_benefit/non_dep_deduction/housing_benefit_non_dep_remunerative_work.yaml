# HB Regs 2006 reg 74(1)(b), (2) and reg 6(1), (6); pension-age
# HB Regs 2006 reg 55(1)(b), (2) and reg 6(1), (6).
# A non-worker or 15-hour worker pays 20.40 * 52 = 1,060.80 in 2026-27.
# A 16-hour worker's wages of 9,000 alone are below 192/week; adding
# IIDB or child maintenance of 12,000 gives 403.85/week, so 105.20 * 52.

- name: ENGLAND housing_benefit bands IIDB only from 16 weekly hours
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [30, 30, 30, 30]
    country: ENGLAND
    housing_benefit_individual_non_dep_deduction_eligible: true
    # No work, 15 hours, 16 hours, and 37.5 hours each week.
    hours_worked: [0, 780, 832, 1_950]
    employment_income: [0, 9_000, 9_000, 9_000]
    iidb: 12_000
    social_security_income: 0
    is_on_income_support: false
    is_on_income_based_jsa: false
    is_on_income_related_esa: false
  output:
    weekly_hours: [0, 15, 16, 37.5]
    housing_benefit_non_dep_gross_income: [12_000, 21_000, 21_000, 21_000]
    household_benefits_individual_non_dep_deduction: [1_060.80, 1_060.80, 5_470.40, 5_470.40]

- name: ENGLAND housing_benefit bands child maintenance only from 16 weekly hours
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [30, 30, 30, 30]
    country: ENGLAND
    housing_benefit_individual_non_dep_deduction_eligible: true
    # No work, 15 hours, 16 hours, and 37.5 hours each week.
    hours_worked: [0, 780, 832, 1_950]
    employment_income: [0, 9_000, 9_000, 9_000]
    maintenance_income: 12_000
    social_security_income: 0
    is_on_income_support: false
    is_on_income_based_jsa: false
    is_on_income_related_esa: false
  output:
    weekly_hours: [0, 15, 16, 37.5]
    housing_benefit_non_dep_gross_income: [12_000, 21_000, 21_000, 21_000]
    household_benefits_individual_non_dep_deduction: [1_060.80, 1_060.80, 5_470.40, 5_470.40]

- name: housing_benefit charges the flat amount on a non-worker's pension or nil income
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [70, 70]
    housing_benefit_individual_non_dep_deduction_eligible: true
    hours_worked: 0
    private_pension_income: [28_912, 0]
    social_security_income: 0
    is_on_income_support: false
    is_on_income_based_jsa: false
    is_on_income_related_esa: false
  output:
    household_benefits_individual_non_dep_deduction: [1_060.80, 1_060.80]

- name: housing_benefit excludes each income-related benefit recipient from remunerative work
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [30, 30, 30, 30]
    housing_benefit_individual_non_dep_deduction_eligible: true
    hours_worked: 832
    employment_income: 9_000
    iidb: 12_000
    social_security_income: 0
    is_on_income_support: [true, false, false, false]
    is_on_income_based_jsa: [false, true, false, false]
    is_on_income_related_esa: [false, false, true, false]
  output:
    household_benefits_individual_non_dep_deduction: [1_060.80, 1_060.80, 1_060.80, 5_470.40]

- name: ENGLAND housing_benefit reads its remunerative work hours parameter
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.dwp.housing_benefit.non_dep_deduction.remunerative_work_hours: 20
    age: [30, 30]
    country: ENGLAND
    housing_benefit_individual_non_dep_deduction_eligible: true
    hours_worked: [832, 1_040]
    employment_income: 9_000
    maintenance_income: 12_000
    social_security_income: 0
    is_on_income_support: false
    is_on_income_based_jsa: false
    is_on_income_related_esa: false
  output:
    household_benefits_individual_non_dep_deduction: [1_060.80, 5_470.40]
