# HB Regs 2006 reg 74(1)(b), (2) and reg 6(1), (6); pension-age
# HB Regs 2006 reg 55(1)(b), (2) and reg 6(1), (6).
# A non-worker or 15-hour worker pays 20.40 * 52 = 1,060.80 in 2026-27,
# whatever their income. The exemptions in reg 74(7), (8) and (10) and reg
# 55(7)-(9) act through eligibility, which most cases here take as an input.
# Family awards, which a single non-dependant's gross income would count, are
# held at zero.
# A 16-hour worker's wages of 9,000 alone are below 192/week; adding
# IIDB or child maintenance of 12,000 gives 403.85/week, so 105.20 * 52.


- name: ENGLAND housing_benefit bands IIDB only from 16 weekly hours (0 weekly hours)
  period: 2026
  absolute_error_margin: 0.01
  input:
    universal_credit_pre_benefit_cap: 0
    child_tax_credit: 0
    working_tax_credit: 0
    child_benefit: 0
    income_support: 0
    jsa_income: 0
    esa_income: 0
    pension_credit: 0
    age: 30
    country: ENGLAND
    housing_benefit_individual_non_dep_deduction_eligible: true
    hours_worked: 0
    employment_income: 0
    iidb: 12000
    social_security_income: 0
    is_on_income_support: false
    is_on_income_based_jsa: false
    is_on_income_related_esa: false
  output:
    weekly_hours: 0
    housing_benefit_non_dep_gross_income: 12000
    household_benefits_individual_non_dep_deduction: 1060.8

