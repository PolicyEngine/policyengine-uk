# Non-dependant deductions fall on the household head's family only: joint
# tenants and other sharers of the rent, boarders and lodgers are not
# non-dependants, and a sharer, boarder or lodger has no non-dependants from
# the household head's family (UC Regs 2013 Sch 4 para 9(2)(d)-(f); HB Regs
# 2006 reg 3(2)(d)-(e) and 3(4)).
- name: Single family, no deductions
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person_1:
        is_household_head: true
        household_benefits_individual_non_dep_deduction: 1
      person_2:
        household_benefits_individual_non_dep_deduction: 2
    benunits:
      benunit:
        members: [person_1, person_2]
    households:
      household:
        members: [person_1, person_2]
  output:
    housing_benefit_non_dep_deductions: 0

- name: Two families, the household head's family bears the other's deduction
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person_1:
        is_household_head: true
        household_benefits_individual_non_dep_deduction: 1
      person_2:
        household_benefits_individual_non_dep_deduction: 2
    benunits:
      benunit_1:
        members: person_1
      benunit_2:
        members: person_2
    households:
      household:
        members: [person_1, person_2]
  output:
    # Only the head's family has non-dependants: 2; the other family has none.
    housing_benefit_non_dep_deductions: [2, 0]

- name: Three families, the household head's family bears both others
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person_1:
        household_benefits_individual_non_dep_deduction: 1
      person_2:
        is_household_head: true
        household_benefits_individual_non_dep_deduction: 2
      person_3:
        household_benefits_individual_non_dep_deduction: 3
    benunits:
      benunit_1:
        members: person_1
      benunit_2:
        members: person_2
      benunit_3:
        members: person_3
    households:
      household:
        members: [person_1, person_2, person_3]
  output:
    # The head's family: 1 + 3 = 4.
    housing_benefit_non_dep_deductions: [0, 4, 0]

- name: A family liable for rent is not a non-dependant
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person_1:
        is_household_head: true
        household_benefits_individual_non_dep_deduction: 1
      person_2:
        household_benefits_individual_non_dep_deduction: 2
      person_3:
        household_benefits_individual_non_dep_deduction: 3
    benunits:
      benunit_1:
        members: person_1
      benunit_2:
        members: person_2
        # A lodger or a sharer of the rent.
        benunit_is_rent_liable: true
      benunit_3:
        members: person_3
    households:
      household:
        members: [person_1, person_2, person_3]
  output:
    # Only person 3 is a non-dependant of the head's family: 3.
    housing_benefit_non_dep_deductions: [3, 0, 0]

- name: A sharer of a nil rent is not a non-dependant
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person_1:
        age: 40
        is_household_head: true
        household_benefits_individual_non_dep_deduction: 0
      person_2:
        age: 40
        household_benefits_individual_non_dep_deduction: 2
    benunits:
      benunit_1:
        members: [person_1]
        housing_benefit_non_dep_deductions_claimant_exempt: false
      benunit_2:
        members: [person_2]
        liable_for_share_of_household_rent: true
        housing_benefit_non_dep_deductions_claimant_exempt: false
    households:
      household:
        members: [person_1, person_2]
        rent: 0
  output:
    # Both families are liable for the rent, so each bears half. With a nil
    # rent neither has any, but the sharer is still a joint occupier, not a
    # non-dependant (HB Regs 2006 reg 3(2)(d)): no deduction for either.
    share_of_household_rent: [0.5, 0.5]
    housing_benefit_non_dep_deductions: [0, 0]

- name: A family with any share of the rent is a joint occupier, however small
  period: 2025
  absolute_error_margin: 0.001
  input:
    people:
      person_1:
        is_household_head: true
        household_benefits_individual_non_dep_deduction: 1
      person_2:
        household_benefits_individual_non_dep_deduction: 2
      person_3:
        household_benefits_individual_non_dep_deduction: 3
    benunits:
      benunit_1:
        members: [person_1]
        share_of_household_rent: 0.995
        housing_benefit_non_dep_deductions_claimant_exempt: false
      benunit_2:
        members: [person_2]
        # A nil rent leaves the family not liable for any, though it bears a
        # share of the payments.
        share_of_household_rent: 0.005
        benunit_is_rent_liable: false
        housing_benefit_non_dep_deductions_claimant_exempt: false
      benunit_3:
        members: [person_3]
        share_of_household_rent: 0
        benunit_is_rent_liable: false
        housing_benefit_non_dep_deductions_claimant_exempt: false
    households:
      household:
        members: [person_1, person_2, person_3]
  output:
    # HB Regs 2006 reg 3(2)(d): person 2 shares the payments, so is a joint
    # occupier, not a non-dependant. Only person 3's 3 is deducted, split by
    # the shares: 3 x 0.995 and 3 x 0.005.
    housing_benefit_non_dep_deductions: [2.985, 0.015, 0]

# The review case on #2184: an existing claimant in council housing with an
# adult child whose only income is £28,912 of other investment income and who
# does no paid work. The bands apply only in remunerative work (HB Regs 2006
# reg 74(2)), so the adult child pays the reg 74(1)(b) amount, as one with no
# income would.
- name: A non-dependant's investment income does not raise the Housing Benefit deduction
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        is_household_head: true
      adult_child:
        age: 25
        other_investment_income: 28_912 # 556 a week, no hours
    benunits:
      claimant_family:
        members: [claimant]
      adult_child_family:
        members: [adult_child]
    households:
      household:
        members: [claimant, adult_child]
        tenure_type: RENT_FROM_COUNCIL
        rent: 15_000
  output:
    # 19.65 * 52 = 1,021.80; banding the £556 would give 115.45 * 52 = 6,003.40.
    housing_benefit_non_dep_deductions: [1_021.80, 0]

- name: One deduction for a non-dependant couple, the higher amount
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        is_household_head: true
        household_benefits_individual_non_dep_deduction: 0
      non_dep_1:
        household_benefits_individual_non_dep_deduction: 1_060.80
      non_dep_2:
        household_benefits_individual_non_dep_deduction: 5_470.40
    benunits:
      claimant_unit:
        members: [claimant]
      couple:
        members: [non_dep_1, non_dep_2]
    households:
      household:
        members: [claimant, non_dep_1, non_dep_2]
  output:
    # HB Regs 2006 reg 74(3); the couple's own unit bears no deduction.
    housing_benefit_non_dep_deductions: [5_470.40, 0]

- name: No deductions where the claimant is exempt
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        is_household_head: true
        household_benefits_individual_non_dep_deduction: 0
      non_dep:
        household_benefits_individual_non_dep_deduction: 1_060.80
    benunits:
      claimant_unit:
        members: [claimant]
        housing_benefit_non_dep_deductions_claimant_exempt: true
      non_dep_unit:
        members: [non_dep]
        housing_benefit_non_dep_deductions_claimant_exempt: false
    households:
      household:
        members: [claimant, non_dep]
  output:
    # HB Regs 2006 reg 74(6).
    housing_benefit_non_dep_deductions: [0, 0]

- name: Universal Credit counts in the income of the claimant it assesses
  # The non-dependant family's Universal Credit is the adult son's own claim
  # (is_uc_claimant), so it counts in his gross income, not his parents'
  # (HB Regs 2006 reg 74(2), (4)). The parents' joint income is the father's
  # 180 a week, under the 192 band: 20.40, one deduction for the couple
  # (reg 74(3)). The son works 2 hours, so he pays 20.40 (reg 74(1)(b)).
  # (20.40 + 20.40) * 52 = 2,121.60. Counting the son's 100 a week of UC in
  # the parents' income would give 280 a week and 64.35.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        is_household_head: true
      father:
        age: 50
        employment_income: 9_360 # 180 a week
        weekly_hours: 16
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
        is_uc_claimant: false
      mother:
        age: 48
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
        is_uc_claimant: false
      son:
        age: 27
        employment_income: 1_040 # 20 a week
        weekly_hours: 2
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
        is_uc_claimant: true
    benunits:
      claimant_unit:
        members: [claimant]
      non_dependant_unit:
        members: [father, mother, son]
        universal_credit_pre_benefit_cap: 5_200 # 100 a week
        child_tax_credit: 0
        working_tax_credit: 0
        child_benefit: 0
        income_support: 0
        jsa_income: 0
        esa_income: 0
        pension_credit: 0
    households:
      household:
        members: [claimant, father, mother, son]
        tenure_type: RENT_FROM_COUNCIL
        rent: 10_000
  output:
    household_benefits_individual_non_dep_deduction: [0, 1_060.80, 1_060.80, 1_060.80]
    housing_benefit_non_dep_deductions: [2_121.60, 0]

- name: Another adult's own income-related ESA stays out of the couple's income
  # The adult son claims income-related ESA in his own right, so it is his
  # income, not his parents' (HB Regs 2006 reg 74(4)). The parents' joint
  # income is the father's 180 a week, under the 192 band: 20.40, one
  # deduction for the couple. The son does no work and pays 20.40 (reg
  # 74(1)(b)). (20.40 + 20.40) * 52 = 2,121.60. Counting his 100 a week of
  # ESA in the parents' income would give 280 a week and 64.35.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        is_household_head: true
      father:
        age: 50
        employment_income: 9_360 # 180 a week
        weekly_hours: 16
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
      mother:
        age: 48
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
      son:
        age: 27
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
    benunits:
      claimant_unit:
        members: [claimant]
      non_dependant_unit:
        members: [father, mother, son]
        esa_income: 5_200 # the son's own award, 100 a week
        claimant_or_partner_esa_income: 0
        universal_credit_pre_benefit_cap: 0
        child_tax_credit: 0
        working_tax_credit: 0
        child_benefit: 0
        income_support: 0
        jsa_income: 0
        pension_credit: 0
    households:
      household:
        members: [claimant, father, mother, son]
        tenure_type: RENT_FROM_COUNCIL
        rent: 10_000
  output:
    household_benefits_individual_non_dep_deduction: [0, 1_060.80, 1_060.80, 1_060.80]
    housing_benefit_non_dep_deductions: [2_121.60, 0]
