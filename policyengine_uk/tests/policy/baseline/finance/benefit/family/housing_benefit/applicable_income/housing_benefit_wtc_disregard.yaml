- name: The WTC disregard returns to its ordinary amount in 2021
  period: 2021
  absolute_error_margin: 0.02
  input:
    housing_benefit_net_earnings: 500
    housing_benefit_special_earnings_disregard: 260
    housing_benefit_permitted_work_disregard: 0
