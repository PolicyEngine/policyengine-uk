    # Sch 4 para 17 fails: 500 < 260 + 0 + 889.20.
    # Sch 5 para 56 reserves min(2,000, 889.20), with no childcare.
    housing_benefit_wtc_disregard: 889.20
    housing_benefit_applicable_income_childcare_element: 0
    # Reg 27 and Sch 5 para 56: 500 + 2,000 - 260 - 889.20 = 1,350.80.
