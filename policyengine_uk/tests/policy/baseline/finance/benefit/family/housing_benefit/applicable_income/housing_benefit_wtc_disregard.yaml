- name: Earnings one penny below the additional disregard threshold reserve WTC
  period: 2024
  absolute_error_margin: 0.02
  input:
    housing_benefit_net_earnings: 6_349.19
    housing_benefit_special_earnings_disregard: 1_300
    housing_benefit_permitted_work_disregard: 0
    housing_benefit_specified_or_temporary_accommodation_disregard: 0
    housing_benefit_on_passporting_benefit: false
    meets_housing_benefit_additional_earnings_disregard_conditions: true
    childcare_expenses: 4_160
    num_relevant_children_for_housing_benefit_childcare: 1
    working_tax_credit: 100
    child_tax_credit: 0
  output:
    # Sch 4 para 17: 6,349.19 < 1,300 + 4,160 + 889.20.
    # Sch 5 para 56 reserves 100; reg 27 still deducts the full 4,160.
    housing_benefit_wtc_disregard: 100
    housing_benefit_applicable_income_childcare_element: 4_160
    housing_benefit_applicable_income_disregard: 1_300

- name: Earnings at the additional disregard threshold use earnings instead of WTC
  period: 2024
  absolute_error_margin: 0.02
  input:
    housing_benefit_net_earnings: 6_349.20
    housing_benefit_special_earnings_disregard: 1_300
    housing_benefit_permitted_work_disregard: 0
    housing_benefit_specified_or_temporary_accommodation_disregard: 0
    housing_benefit_on_passporting_benefit: false
    meets_housing_benefit_additional_earnings_disregard_conditions: true
    childcare_expenses: 4_160
    num_relevant_children_for_housing_benefit_childcare: 1
    working_tax_credit: 100
    child_tax_credit: 0
  output:
    # Sch 4 para 17(3): equality qualifies, so 1,300 + 889.20 is
    # disregarded from earnings. Sch 5 para 56 then disregards no WTC.
    housing_benefit_wtc_disregard: 0
    housing_benefit_applicable_income_childcare_element: 4_160
    housing_benefit_applicable_income_disregard: 2_189.20

- name: WTC remains available to childcare when the work condition fails
  period: 2024
  absolute_error_margin: 0.02
  input:
    housing_benefit_net_earnings: 5_200
    housing_benefit_special_earnings_disregard: 1_300
    housing_benefit_permitted_work_disregard: 0
    housing_benefit_specified_or_temporary_accommodation_disregard: 0
    housing_benefit_on_passporting_benefit: false
    meets_housing_benefit_additional_earnings_disregard_conditions: false
    childcare_expenses: 4_160
    num_relevant_children_for_housing_benefit_childcare: 1
    working_tax_credit: 100
    child_tax_credit: 0
  output:
    # Sch 5 para 56 does not apply without a Sch 4 para 17(2) work
    # condition. Reg 27: min(4,160, 5,200 - 1,300 + 100) = 4,000.
    housing_benefit_wtc_disregard: 0
    housing_benefit_childcare_earnings_limit: 4_000
    housing_benefit_applicable_income_childcare_element: 4_000

- name: CTC funds childcare after WTC has been reserved
  period: 2024
  absolute_error_margin: 0.02
  input:
    housing_benefit_net_earnings: 5_200
    housing_benefit_special_earnings_disregard: 1_300
    housing_benefit_permitted_work_disregard: 0
    housing_benefit_specified_or_temporary_accommodation_disregard: 0
    housing_benefit_on_passporting_benefit: false
    meets_housing_benefit_additional_earnings_disregard_conditions: true
    childcare_expenses: 4_160
    num_relevant_children_for_housing_benefit_childcare: 1
    working_tax_credit: 100
    child_tax_credit: 500
  output:
    # Sch 5 para 56 reserves only WTC. Reg 27 allows the remaining CTC:
    # limit = 3,900 + (100 - 100) + 500 = 4,400; childcare = 4,160.
    housing_benefit_wtc_disregard: 100
    housing_benefit_childcare_earnings_limit: 4_400
    housing_benefit_applicable_income_childcare_element: 4_160

