- name: The tax credit closure keeps Housing Benefit for specified or temporary accommodation
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        working_tax_credit_reported: 2_000
        housing_benefit_reported: 5_200
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [claimant]
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 5_200
  output:
    # Tax credits ended on 5 April 2025, so DWP has moved the family. This
    # Housing Benefit award doesn't terminate, whichever legacy benefit
    # closed (SI 2014/1230 reg 46(2)). The closure ends Working Tax Credit,
    # so the family has no income and the means test pays the whole
    # eligible rent.
    legacy_benefits_closed: true
    claims_universal_credit: false
    working_tax_credit: 0
    housing_benefit_eligible: true
    housing_benefit: 5_200

- name: The tax credit closure ends Housing Benefit outside that accommodation
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        working_tax_credit_reported: 2_000
        housing_benefit_reported: 5_200
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
    households:
      household:
        members: [claimant]
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 5_200
  output:
    legacy_benefits_closed: true
    housing_benefit_eligible: false
    housing_benefit: 0

# SI 2014/1230 reg 6A(2): the bar on new Housing Benefit claims doesn't apply
# to a claim in respect of specified or temporary accommodation. UC Regs 2013
# Sch 1 paras 3(h) and (i) exclude that rent from rent payments, so Universal
# Credit has no housing costs element for it. In 2026-27 the standard
# allowance for a single claimant aged 25 or over comes to 12 x £424.90 =
# £5,098.80.
- name: A family in temporary accommodation with no award makes a new Housing Benefit claim beside Universal Credit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [claimant]
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 10_000
  output:
    # Universal Credit passports the Housing Benefit means test, so Housing
    # Benefit pays the whole £10,000 rent; reg 75F(1)(g) lifts its cap.
    claims_universal_credit: true
    housing_benefit_eligible: true
    housing_benefit: 10_000
    uc_housing_costs_element: 0
    universal_credit: 5_098.80

- name: The same family that doesn't take Housing Benefit up gets no help with the rent
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
        claims_all_entitled_benefits: false
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [claimant]
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 10_000
  output:
    # The family can claim (housing_benefit_eligible) but doesn't
    # (would_claim_housing_benefit), and Universal Credit still leaves the
    # rent out.
    housing_benefit_eligible: true
    would_claim_housing_benefit: false
    housing_benefit: 0
    uc_housing_costs_element: 0
    universal_credit: 5_098.80

# Northern Ireland: SR 2016/226 reg 6(3) keeps Housing Benefit for specified or
# temporary accommodation after a Universal Credit claim, and SR 2016/216 Sch 1
# paras 3(e) and (ea) exclude that rent from rent payments.
- name: Northern Ireland, a Housing Benefit award in temporary accommodation continues after a Universal Credit claim
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        housing_benefit_reported: 6_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [claimant]
        region: NORTHERN_IRELAND
        tenure_type: RENT_FROM_COUNCIL
        rent: 6_000
  output:
    claims_universal_credit: true
    housing_benefit_eligible: true
    housing_benefit: 6_000
    uc_housing_costs_element: 0
    universal_credit: 5_098.80

- name: Northern Ireland, the same claim outside that accommodation ends Housing Benefit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        housing_benefit_reported: 6_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
    households:
      household:
        members: [claimant]
        region: NORTHERN_IRELAND
        tenure_type: RENT_FROM_COUNCIL
        rent: 6_000
  output:
    # SR 2016/226 reg 6(2A) ends the award; Universal Credit pays the social
    # rent: £5,098.80 + £6,000 = £11,098.80, under the £14,753 single cap
    # outside London.
    housing_benefit_eligible: false
    housing_benefit: 0
    uc_housing_costs_element: 6_000
    universal_credit: 11_098.80
