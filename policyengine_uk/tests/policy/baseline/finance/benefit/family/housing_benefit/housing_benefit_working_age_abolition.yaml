- name: GB protected accommodation receives Housing Benefit alongside non-housing UC
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        housing_benefit_reported: 1
    benunits:
      benunit:
        members: [claimant]
        in_specified_or_temporary_accommodation: true
        would_claim_uc: true
        housing_benefit_applicable_income: 0
        # Fix the non-housing allowance to isolate the rent-cost routing.
        uc_standard_allowance: 5_000
    households:
      household:
        members: [claimant]
        rent: 5_200
        tenure_type: RENT_FROM_COUNCIL
        region: LONDON
  output:
    housing_benefit_payable_share: 1
    housing_benefit_eligible: true
    housing_benefit: 5_200
    uc_housing_costs_element: 0
    universal_credit: 5_000

