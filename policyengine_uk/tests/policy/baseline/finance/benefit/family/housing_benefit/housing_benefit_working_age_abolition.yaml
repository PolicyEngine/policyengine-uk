- name: A capped family keeping protected Housing Benefit alongside Universal Credit is capped once
  # HB Regs 2006 reg 75F(1)(g): the Housing Benefit cap does not apply to a
  # claimant receiving Universal Credit. UC Regs 2013 reg 80(2A): Universal
  # Credit's cap counts that Housing Benefit as nil, so its reduction is
  # 57,794.21 - 30,000 - 25,323 = 2,471.21.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
      partner:
        age: 35
      child1:
        age: 2
      child2:
        age: 4
      child3:
        age: 6
      child4:
        age: 8
    benunits:
      benunit:
        members: [parent, partner, child1, child2, child3, child4]
        would_claim_uc: true
        in_specified_or_temporary_accommodation: true
    households:
      household:
        members: [parent, partner, child1, child2, child3, child4]
        rent: 30_000
        tenure_type: RENT_FROM_HA
        region: LONDON
  output:
    is_housing_benefit_benefit_cap_exempt: true
    housing_benefit_benefit_cap_reduction: 0
    housing_benefit: 30_000
    uc_housing_costs_element: 0
    benefit_cap_welfare_benefits: 57_794.21
    uc_benefit_cap: 25_323
    uc_benefit_cap_reduction: 2_471.21

# Art. 7(4)(b) (NI: SR 2025/176 art. 7(4)(b)) saves an award where,
# immediately before the abolition date, the claimant is entitled to
# income-related ESA that the art. 3A(2) appointee saving keeps. The claimant
# is the Housing Benefit claimant: one of the members reporting Housing
# Benefit, so every reporter must hold the saved award; a sole claimant when
# no member reports it; or the saved ESA claimant where
# housing_benefit_claimant_is_saved_esa_claimant confirms it. An outside
# adult's saved report does not keep the family's award.

- name: GB award with an appointee's income-related ESA is paid in full in 2026 and prompts no claim
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        housing_benefit_reported: 1
        esa_income_reported: 5_000
        esa_income_appointee_saving: true
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
        housing_benefit_applicable_income: 0
    households:
      household:
        members: [claimant]
        rent: 5_200
        tenure_type: RENT_FROM_COUNCIL
        region: LONDON
  output:
    esa_income_payable_share: 1
    housing_benefit_payable_share: 1
    claims_uc_at_legacy_closure: false
    housing_benefit_eligible: true
    housing_benefit: 5_200

