# Abolition of working-age Housing Benefit outside specified and temporary
# accommodation: 1 July 2026 in Great Britain (SI 2025/1148 art. 7, inserted
# by SI 2026/409) and 1 October 2026 in Northern Ireland (SR 2025/176 art. 7,
# inserted by SR 2026/115). Pension-age claimants and protected mixed-age
# couples keep their awards (art. 7(4)(a), SI 2014/1230 reg 6A(4)-(5)).
#
# Each fiscal year runs 6 April to 5 April (365 days in 2026-27). A GB award
# is payable for the 86 days from 6 April to 30 June 2026 and an NI award for
# the 178 days from 6 April to 30 September 2026, so the 2026 amount is the
# annual entitlement times 86/365 or 178/365. Every case below fixes
# housing_benefit_applicable_income at 0, so entitlement equals the £5,200
# rent (£100 a week).

- name: GB working-age continuing award is paid in full before the abolition year
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        housing_benefit_reported: 1
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
        housing_benefit_applicable_income: 0
    households:
      household:
        members: [claimant]
        rent: 5_200
        tenure_type: RENT_FROM_COUNCIL
        region: LONDON
  output:
    housing_benefit_payable_share: 1
    housing_benefit_eligible: true
    housing_benefit: 5_200

- name: GB working-age continuing award is paid until 30 June 2026 (86 of 365 days)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        housing_benefit_reported: 1
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
        housing_benefit_applicable_income: 0
    households:
      household:
        members: [claimant]
        rent: 5_200
        tenure_type: RENT_FROM_COUNCIL
        region: LONDON
  output:
    # 86 / 365
    housing_benefit_payable_share: 0.235616
    housing_benefit_eligible: true
    housing_benefit_entitlement: 5_200
    # 5,200 * 86 / 365
    housing_benefit: 1_225.21

- name: GB working-age continuing award has ended by 2027
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        housing_benefit_reported: 1
    benunits:
      benunit:
        members: [claimant]
        in_specified_or_temporary_accommodation: false
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: false
        housing_benefit_applicable_income: 0
    households:
      household:
        members: [claimant]
        rent: 5_200
        tenure_type: RENT_FROM_COUNCIL
        region: LONDON
  output:
    housing_benefit_payable_share: 0
    housing_benefit_eligible: false
    housing_benefit: 0
    universal_credit: 0

