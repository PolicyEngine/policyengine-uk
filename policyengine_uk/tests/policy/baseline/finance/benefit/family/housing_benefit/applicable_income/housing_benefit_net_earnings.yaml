# Net earnings for the Housing Benefit earnings disregards: SI 2006/213
# regs 36(3) and 38; SI 2006/214 regs 36(2) and 39. Gross earnings less income
# tax, National Insurance and half of pension contributions. PolicyEngine
# attributes a person's income tax to earnings in proportion to their share
# of the person's total income. 2026: personal allowance £12,570, basic rate
# 20%, Class 1 primary threshold £241.73 × 52 = £12,569.96, main rate 8%.

- name: Earnings below the tax and National Insurance thresholds are all net earnings
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 5_200
    benunits:
      benunit:
        members: [person]
  output:
    housing_benefit_net_earnings: 5_200

- name: Half of pension contributions is deducted
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 5_200
        personal_pension_contributions: 400
    benunits:
      benunit:
        members: [person]
  output:
    housing_benefit_net_earnings: 5_000 # 5,200 − 0.5 × 400

- name: Income tax and National Insurance on earnings are deducted
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 20_000
    benunits:
      benunit:
        members: [person]
  output:
    # Income tax 0.2 × (20,000 − 12,570) = 1,486.
    # NI 0.08 × (20,000 − 12,569.96) = 594.4032.
    # 20,000 − 1,486 − 594.4032 = 17,919.5968.
    housing_benefit_net_earnings: 17_919.60

- name: Income tax is attributed to earnings by their share of total income
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 70
        state_pension_reported: 15_000
        employment_income: 1_000
    benunits:
      benunit:
        members: [person]
  output:
    # Income tax 0.2 × (16,000 − 12,570) = 686, of which 1,000 / 16,000 is
    # attributed to earnings: 42.875. No National Insurance above State
    # Pension age. 1,000 − 42.875 = 957.125.
    housing_benefit_net_earnings: 957.125

- name: A self-employment loss is not set against employment income
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 2_000
        self_employment_income: -3_000
    benunits:
      benunit:
        members: [person]
  output:
    housing_benefit_net_earnings: 2_000 # SI 2006/213 reg 38(10)

- name: A couple's net earnings are added together
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        employment_income: 3_000
      partner:
        age: 38
        self_employment_income: 2_000
    benunits:
      benunit:
        members: [claimant, partner]
  output:
    housing_benefit_net_earnings: 5_000

- name: A self-employment loss set against other income does not drop the tax on employment income
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 20_000
        self_employment_income: -25_000
        # Tax and NI as inputs: the test is about attribution, not the
        # income tax calculation.
        income_tax: 1_486
        ni_class_1_employee: 594.40
    benunits:
      benunit:
        members: [person]
  output:
    # Total income is 20,000 - 25,000 = -5,000. Before the loss it is
    # 20,000, all earnings, so all the income tax is attributed to them:
    # 20,000 - 1,486 - 594.40 = 17,919.60. (Dividing by the negative total
    # income attributed none: 19,405.60.)
    housing_benefit_net_earnings: 17_919.60

- name: Statutory maternity pay is earnings
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        statutory_maternity_pay: 8_000
      child:
        age: 0
    benunits:
      benunit:
        would_claim_uc: false  # not on Universal Credit, which passports the means test
        members: [parent, child]
  output:
    # SI 2006/213 reg 35(1)(i). £8,000 is below the personal allowance and
    # the NI primary threshold.
    housing_benefit_net_earnings: 8_000
    # Lone parent: 25 x 52.
    housing_benefit_applicable_income_disregard: 1_300

- name: Statutory sick pay is earnings at pension age
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 70
        statutory_sick_pay: 2_000
    benunits:
      benunit:
        members: [person]
  output:
    # SI 2006/214 reg 35(1)(h). 5 x 52.
    housing_benefit_net_earnings: 2_000
    housing_benefit_applicable_income_disregard: 260

- name: Income tax on statutory maternity pay is attributed to earnings
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        employment_income: 10_000
        statutory_maternity_pay: 20_000
        private_pension_income: 10_000
        income_tax: 5_486
        ni_class_1_employee: 1_394.40
    benunits:
      benunit:
        members: [person]
  output:
    # Taxable income 40,000: total_income 20,000 (employment and pension)
    # plus 20,000 of statutory maternity pay, which the model taxes as
    # employment income. Earnings are 10,000 + 20,000 = 30,000, so 3/4 of
    # the 5,486 of income tax (4,114.50) is attributed to them.
    # 30,000 - 4,114.50 - 1,394.40 = 24,491.10.
    housing_benefit_net_earnings: 24_491.10

- name: A property loss does not inflate the share of income tax attributed to earnings
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 70
        employment_income: 10_000
        private_pension_income: 10_000
        property_income: -5_000
        income_tax: 1_486
    benunits:
      benunit:
        members: [person]
  output:
    # Total income 15,000; before the property loss 20,000, of which
    # earnings are half, so half of the 1,486 of income tax (743) is
    # attributed to them. No NI above State Pension age.
    # 10,000 - 743 = 9,257. (Dividing by 15,000 would attribute 990.67.)
    housing_benefit_net_earnings: 9_257
