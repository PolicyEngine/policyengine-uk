- name: Pension contributions are deducted from self-employed earnings in the start-up period
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        is_claimant_or_partner: true
      lodger:
        age: 24
        self_employment_income: 6_000
        pension_contributions: 6_000
        uc_is_in_startup_period: true
        weekly_hours: 10
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
    benunits:
      claimant_unit:
        members: [claimant]
        benunit_is_rent_liable: true
      lodger_unit:
        members: [lodger]
        benunit_is_rent_liable: false
        universal_credit_pre_benefit_cap: 2_000
        child_tax_credit: 0
        working_tax_credit: 0
        child_benefit: 0
        income_support: 0
        jsa_income: 0
        esa_income: 0
        pension_credit: 0
    households:
      household:
        members: [claimant, lodger]
        country: ENGLAND
        local_authority: MAIDSTONE
  output:
    # UC Regs 2013 reg 57(2), step 4: with no employed earnings, the 6,000 of
    # relievable pension contributions comes off the 6,000 profit, leaving nil.
    # The minimum income floor does not apply in the start-up period (reg
    # 62(5)), so the award is on no earned income: exempt under HB reg
    # 74(8)(b) (aged under 25) and CTR para 8(8)(c).
    housing_benefit_non_dep_deduction_exempt: [false, true]
    council_tax_reduction_non_dep_deduction_exempt: [false, true]
    housing_benefit_non_dep_deductions: [0, 0]
    council_tax_reduction_non_dep_deductions: [0, 0]

- name: Scotland's working-age scheme exempts the partner of an Income Support claimant
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      applicant:
        age: 50
        is_claimant_or_partner: true
      recipient:
        age: 35
        income_support_reported: 5_000
        weekly_hours: 0
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
      partner:
        age: 34
        weekly_hours: 0
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
    benunits:
      applicant_unit:
        members: [applicant]
        benunit_is_rent_liable: true
        income_support: 0
        jsa_income: 0
        esa_income: 0
        pension_credit: 0
        universal_credit_pre_benefit_cap: 0
      couple_unit:
        members: [recipient, partner]
        benunit_is_rent_liable: false
        would_claim_uc: false
        child_tax_credit: 0
        working_tax_credit: 0
        child_benefit: 0
        income_support: 5_000
        jsa_income: 0
        esa_income: 0
        pension_credit: 0
    households:
      household:
        members: [applicant, recipient, partner]
        country: SCOTLAND
        local_authority: GLASGOW_CITY
  output:
    # SSI 2021/249 reg 90(8)(a) with reg 4(1): the partner "has a partner who
    # is" on Income Support and is not on Universal Credit, so both are exempt
    # from CTR. Housing Benefit has no such rule (reg 74(8)(a) is for the
    # person on IS, and only under 25): both are out of remunerative work, and
    # the couple pays one lowest amount, 20.40 a week.
    council_tax_reduction_non_dep_deduction_exempt: [false, true, true]
    council_tax_reduction_non_dep_deductions: [0, 0]
    housing_benefit_non_dep_deductions: [1_060.80, 0]

