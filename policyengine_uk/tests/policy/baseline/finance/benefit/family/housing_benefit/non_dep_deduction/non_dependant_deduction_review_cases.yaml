      parent:
        age: 45
        employment_income: 10_400
        weekly_hours: 16
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: true
      young_person:
        age: 19
        current_education: NOT_IN_EDUCATION
        is_in_approved_training: true
        age_started_or_accepted_current_education_or_training: 16
        weekly_hours: 0
        is_claimant_or_partner: false
    benunits:
      claimant_unit:
        members: [claimant]
        benunit_is_rent_liable: true
      non_dependant_unit:
        members: [parent, young_person]
        benunit_is_rent_liable: false
        would_claim_child_benefit: false
        child_tax_credit: 0
        working_tax_credit: 0
        income_support: 0
        jsa_income: 0
        esa_income: 0
        pension_credit: 0
        would_claim_uc: false
    households:
      household:
        members: [claimant, parent, young_person]
        country: ENGLAND
        local_authority: MAIDSTONE
  output:
    # LGFA 1992 Sch 1 para 3 needs another person to be "entitled to child
    # benefit" for the young person, and entitlement needs a claim (SSAA 1992
