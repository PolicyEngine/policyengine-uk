- name: Income-related ESA is payable to the recipient, not the working partner
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
      recipient:
        age: 45
        esa_income_reported: 2600
        weekly_hours: 0
        current_education: NOT_IN_EDUCATION
      partner:
        age: 40
        employment_income: 10920
        weekly_hours: 16
        current_education: NOT_IN_EDUCATION
    benunits:
      claimant_unit:
        members: [claimant]
        benunit_is_rent_liable: true
      non_dependant_unit:
        members: [recipient, partner]
        benunit_is_rent_liable: false
        child_tax_credit: 0
        working_tax_credit: 0
        child_benefit: 0
        income_support: 0
        jsa_income: 0
        esa_income: 2600
        pension_credit: 0
        would_claim_uc: false
    households:
      household:
        members: [claimant, recipient, partner]
        country: ENGLAND
        local_authority: MAIDSTONE
  output:
    # HB Regs 2006 reg 2(3A): only the recipient is on ESA(IR), so only they are
    # out of remunerative work (reg 6(6)) and exempt from CTR (para 8(8)(a)). The
    # partner is banded on the couple's 260 a week (210 wages plus 50 ESA), in
    # the HB 192 band (46.85) and under the CTR 279 band (5.20); one deduction
    # for the couple, the higher.
    housing_benefit_non_dep_deductions: [2_436.20, 0]
    council_tax_reduction_non_dep_deductions: [270.40, 0]

