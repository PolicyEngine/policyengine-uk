    # under the CTR 279 band (5.20), and the young person, out of remunerative
    # work, pays the lowest amount (5.20).
    council_tax_reduction_non_dep_deduction_exempt: [false, false, false]
    council_tax_reduction_non_dep_deductions: [540.80, 0]
