    housing_benefit_assessable_capital: 0
    housing_benefit_applicable_income: 0
    housing_benefit_entitlement: 4_160

- name: A family on Universal Credit with income and capital gets the same Housing Benefit as on income-based JSA
  # The universal credit and income-based JSA limbs of the passport have the
  # same effect: maximum Housing Benefit. Same household as the income-based
  # JSA case in housing_benefit_income_related_benefit_passport.yaml.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        employment_income: 1_000
        housing_benefit_reported: 1
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
        universal_credit_pre_benefit_cap: 3_500
        housing_benefit_eligible: true
    households:
      household:
        members: [claimant]
        tenure_type: RENT_FROM_COUNCIL
        rent: 5_200
        savings: 12_000
  output:
    in_receipt_of_income_support_jsa_ib_or_esa_ir: false
    housing_benefit_on_passporting_benefit: true
    housing_benefit_assessable_capital: 0
    housing_benefit_tariff_income: 0
    housing_benefit_applicable_income: 0
    housing_benefit_entitlement: 5_200
