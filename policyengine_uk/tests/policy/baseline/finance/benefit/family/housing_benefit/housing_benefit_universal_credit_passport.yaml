  # universal credit from 8 May 2018 (SR 2018/92).
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 45
        employment_income: 3_000
        housing_benefit_reported: 1
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
        universal_credit_pre_benefit_cap: 1_000
        housing_benefit_eligible: true
    households:
      household:
        members: [claimant]
        country: NORTHERN_IRELAND
        tenure_type: RENT_FROM_COUNCIL
