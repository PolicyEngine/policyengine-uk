# 2026-27 deductions (HB Regs 2006 reg 74(1)-(2); SI 2006/214 reg 55(1)-(2);
# up-rated by SI 2026/148 art 23(3)). In remunerative work (16 hours or more,
# reg 6(1)): under £192 a week 20.40; not less than £192 46.85; £279 64.35;
# £365 105.20; £485 119.85; £605 and above 131.45. Not in remunerative work:
# 20.40 (reg 74(1)(b)). Bands include their lower edge ("not less than").

- name: In remunerative work with no income pays the lowest amount
  period: 2026
  absolute_error_margin: 0.01
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    age: 30
    total_income: 0
    weekly_hours: 35
  output:
    # reg 74(2)(a) and (1)(b)
    household_benefits_individual_non_dep_deduction: 20.4 * 52

- name: Just below the second band
  period: 2026
  absolute_error_margin: 0.01
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    age: 30
    total_income: 9983.48
    weekly_hours: 35
  output:
    # 191.99 a week
    household_benefits_individual_non_dep_deduction: 20.4 * 52

- name: Exactly 192 a week is in the band starting at 192
  period: 2026
  absolute_error_margin: 0.01
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    age: 30
    total_income: 9984
    weekly_hours: 35
  output:
    household_benefits_individual_non_dep_deduction: 46.85 * 52

