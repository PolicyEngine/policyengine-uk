# 2025-26 bands and deductions (HB Regs 2006 reg 74 as up-rated by SI 2025/295
# art 23(3); DWP Benefit and pension rates 2025 to 2026): under £183 a week
# 19.65; £183-265.99 45.15; £266-347.99 62.00; £348-462.99 101.35;
# £463-576.99 115.45; £577 and above 126.65.

- name: Reduced rent without LHA
  period: 2025
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    total_income: 5_200 # 100 weekly
  output:
    household_benefits_individual_non_dep_deduction: 19.65 * 52

- name: Higher amount
  period: 2025
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    total_income: 30_056 # 578 weekly
  output:
    household_benefits_individual_non_dep_deduction: 126.65 * 52

- name: Middle amount
  period: 2025
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    total_income: 18_148 # 349 weekly
  output:
    household_benefits_individual_non_dep_deduction: 101.35 * 52

- name: A band includes its lower edge (reg 74(2), "not less than £183")
  period: 2025
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    total_income: 9_516 # exactly 183 weekly
  output:
    household_benefits_individual_non_dep_deduction: 45.15 * 52

- name: Just below a band's lower edge stays in the band below
  period: 2025
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    total_income: 9_515 # just under 183 weekly
  output:
    household_benefits_individual_non_dep_deduction: 19.65 * 52

- name: The top band includes £577 exactly
  period: 2025
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    total_income: 30_004 # exactly 577 weekly
  output:
    household_benefits_individual_non_dep_deduction: 126.65 * 52

- name: A non-dependant with no income pays the lowest deduction (reg 74(1)(b))
  period: 2025
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    total_income: 0
  output:
    household_benefits_individual_non_dep_deduction: 19.65 * 52
