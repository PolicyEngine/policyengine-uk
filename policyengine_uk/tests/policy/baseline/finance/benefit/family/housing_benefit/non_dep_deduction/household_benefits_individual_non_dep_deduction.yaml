- name: A couple's joint income sets the band for the member in remunerative work
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      worker:
        age: 30
        total_income: 10_400 # 200 a week
        weekly_hours: 35
        housing_benefit_individual_non_dep_deduction_eligible: true
      partner:
        age: 30
        total_income: 10_400
        weekly_hours: 0
        housing_benefit_individual_non_dep_deduction_eligible: true
    benunits:
      couple:
        members: [worker, partner]
        universal_credit_pre_benefit_cap: 0
        child_tax_credit: 0
        working_tax_credit: 0
        child_benefit: 0
    households:
      household:
        members: [worker, partner]
  output:
    # reg 74(4): joint income 400 a week is in the 365 band; the partner, not
    # in remunerative work, would pay 20.40 (reg 74(1)(b)).
    household_benefits_individual_non_dep_deduction: [5_470.40, 1_060.80]

- name: A dependent child's income does not count towards the couple's
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        total_income: 9_360 # 180 a week
        weekly_hours: 35
        housing_benefit_individual_non_dep_deduction_eligible: true
      child:
        age: 17
        total_income: 5_200
    benunits:
      family:
        members: [parent, child]
        universal_credit_pre_benefit_cap: 0
        child_tax_credit: 0
        working_tax_credit: 0
        child_benefit: 0
    households:
      household:
        members: [parent, child]
  output:
    household_benefits_individual_non_dep_deduction: [1_060.80, 0]

- name: Universal Credit counts towards gross income
  period: 2026
  absolute_error_margin: 0.01
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    age: 40
    total_income: 14_040 # 270 a week
    weekly_hours: 16
    universal_credit_pre_benefit_cap: 1_040 # 20 a week
    child_tax_credit: 0
    working_tax_credit: 0
    child_benefit: 0
  output:
    # reg 74(2): 290 a week gross is in the 279 band (64.35). UC is not among
    # the reg 74(9) disregards.
    household_benefits_individual_non_dep_deduction: 64.35 * 52

- name: On income-related ESA, 16 hours is not remunerative work
  period: 2026
  absolute_error_margin: 0.01
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    age: 40
    total_income: 10_574.72 # 203.36 a week (supported permitted work)
    weekly_hours: 16
    esa_income: 5_200
    universal_credit_pre_benefit_cap: 0
    child_tax_credit: 0
    working_tax_credit: 0
    child_benefit: 0
  output:
    # reg 6(6): a person on income-related ESA is treated as not in
    # remunerative work, so pays the reg 74(1)(b) amount.
    household_benefits_individual_non_dep_deduction: 20.40 * 52

- name: A dependent young person in the family is banded on their own income, not the parent's
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        total_income: 9_360 # 180 a week
        weekly_hours: 16
        housing_benefit_individual_non_dep_deduction_eligible: true
      young_person:
        age: 19
        current_education: UPPER_SECONDARY
        age_started_or_accepted_current_education_or_training: 18
        total_income: 5_200 # 100 a week
        weekly_hours: 8
        housing_benefit_individual_non_dep_deduction_eligible: true
    benunits:
      family:
        members: [parent, young_person]
        universal_credit_pre_benefit_cap: 0
        child_tax_credit: 0
        working_tax_credit: 0
        child_benefit: 0
    households:
      household:
        members: [parent, young_person]
  output:
    # reg 74(4) joins only a couple's income. The parent's 180 a week is
    # under the 192 band (20.40); the young person, under 16 hours, pays 20.40
    # if not exempt (eligibility is an input here).
    household_benefits_individual_non_dep_deduction: [1_060.80, 1_060.80]
