  period: 2026
  absolute_error_margin: 0.01
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    age: 30
    total_income: 31459.48
    weekly_hours: 35
  output:
    # 604.99 a week
    household_benefits_individual_non_dep_deduction: 119.85 * 52

- name: Not in remunerative work pays the lowest amount whatever the income
  period: 2026
  absolute_error_margin: 0.01
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    age: 30
    total_income: 40000
    weekly_hours: 0
  output:
    # reg 74(1)(b): the bands apply only in remunerative work
    household_benefits_individual_non_dep_deduction: 20.4 * 52

