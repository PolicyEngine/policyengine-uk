- name: A loss counts as no income
  period: 2026
  absolute_error_margin: 0.01
  input:
    housing_benefit_individual_non_dep_deduction_eligible: true
    age: 30
    total_income: -5000
    weekly_hours: 35
  output:
    household_benefits_individual_non_dep_deduction: 20.4 * 52

- name: A couple's joint income sets the band for the member in remunerative work
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      worker:
        age: 30
        total_income: 10_400 # 200 a week
        weekly_hours: 35
        housing_benefit_individual_non_dep_deduction_eligible: true
      partner:
        age: 30
        total_income: 10_400
        weekly_hours: 0
        housing_benefit_individual_non_dep_deduction_eligible: true
    benunits:
      couple:
        members: [worker, partner]
    households:
      household:
        members: [worker, partner]
  output:
    # reg 74(4): joint income 400 a week is in the 365 band; the partner, not
    # in remunerative work, would pay 20.40 (reg 74(1)(b)).
    household_benefits_individual_non_dep_deduction: [5_470.40, 1_060.80]

- name: A dependent child's income does not count towards the couple's
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        total_income: 9_360 # 180 a week
        weekly_hours: 35
        housing_benefit_individual_non_dep_deduction_eligible: true
      child:
        age: 17
        total_income: 5_200
    benunits:
      family:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    household_benefits_individual_non_dep_deduction: [1_060.80, 0]
