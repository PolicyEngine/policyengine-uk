# Explicit-facts input contract for the legacy SDP non-dependant gate.
# Sources: HB SI2006/213 and SI2006/214reg3(2)(d),(3),(4);
# IS SI1987/1967reg3(2B),(2C),(4). The ISclose-relative/date condition
# differs from HBreg9(1). An assertedTrue below supplies ALLconditions
# for EVERYprogramme using the shared gate, for this claimantBU and year.
# It is NEVER inferred from the rentflag, headrole or anotherBU’s input.
# The nonliable-target case deliberately supplies an inconsistent assertion
# to test the guard; it is NOT presented as a lawful positive scenario.
# Ordinary asserted rentalpairs satisfy thoseconditions; unknown/partial
# cases remainFalse. Nonpaying thirdpersons are outside the assertion.
# Numeric1000 pre-gate components isolate finalgate routing and accounting;
# they are synthetic supplied public inputs, NOT statutory premium rates.
# Othercases test existing age/blind/benefit/family input seams, not newlaw.

- name: "Asserted ordinary rental occupiers preserve the premium gate in both head directions"
  period: 2026
  input:
    people:
      qualifying_head:
        age: 40
        is_household_head: true
        is_claimant_or_partner: true
        receives_severe_disability_premium_qualifying_benefit: true
        is_blind: false
        is_child_or_qualifying_young_person_for_child_benefit: false
      other_sharer:
        age: 35
        is_household_head: false
        is_claimant_or_partner: true
        receives_severe_disability_premium_qualifying_benefit: false
        is_blind: false
        is_child_or_qualifying_young_person_for_child_benefit: false
      other_head:
        age: 35
        is_household_head: true
        is_claimant_or_partner: true
        receives_severe_disability_premium_qualifying_benefit: false
        is_blind: false
        is_child_or_qualifying_young_person_for_child_benefit: false
      qualifying_sharer:
        age: 40
        is_household_head: false
        is_claimant_or_partner: true
        receives_severe_disability_premium_qualifying_benefit: true
        is_blind: false
        is_child_or_qualifying_young_person_for_child_benefit: false
    benunits:
      qualifying_head_family:
        members: ["qualifying_head"]
        liable_for_share_of_household_rent: false
        severe_disability_premium_joint_occupier_exclusion_applies: true
        severe_disability_premium_before_non_dependant_test: 1000
      other_sharer_family:
        members: ["other_sharer"]
        liable_for_share_of_household_rent: true
        severe_disability_premium_joint_occupier_exclusion_applies: true
        severe_disability_premium_before_non_dependant_test: 0
      other_head_family:
        members: ["other_head"]
        liable_for_share_of_household_rent: false
        severe_disability_premium_joint_occupier_exclusion_applies: true
        severe_disability_premium_before_non_dependant_test: 0
      qualifying_sharer_family:
        members: ["qualifying_sharer"]
        liable_for_share_of_household_rent: true
        severe_disability_premium_joint_occupier_exclusion_applies: true
        severe_disability_premium_before_non_dependant_test: 1000
    households:
      head_qualifies_home:
        members: ["qualifying_head", "other_sharer"]
        country: "ENGLAND"
        tenure_type: "RENT_PRIVATELY"
        rent: 12000
      sharer_qualifies_home:
        members: ["other_head", "qualifying_sharer"]
        country: "ENGLAND"
        tenure_type: "RENT_PRIVATELY"
        rent: 12000
  output:
    is_liable_for_household_rent: [true, true, true, true]
    severe_disability_premium: [1000, 0, 0, 1000]
    has_non_dependant_for_severe_disability_premium: [false, false, false, false]
    severe_disability_premium_before_non_dependant_test: [1000, 0, 0, 1000]

