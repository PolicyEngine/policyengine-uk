# Severe disability conditions of the Child Tax Credit disability element
# (CTC Regs 2002 reg 8(1)(b), (3)-(5)) and the Working Tax Credit severe
# disability element (WTC Regs 2002 reg 17(2)-(4)).

- name: DLA care component at the highest rate is severe
  period: 2026
  input:
    dla_sc_category: HIGHER
  output:
    is_severely_disabled_for_benefits: true

- name: DLA care component at the middle rate is not severe
  period: 2026
  input:
    dla_sc_category: MIDDLE
  output:
    is_severely_disabled_for_benefits: false

- name: PIP daily living component at the enhanced rate is severe
  period: 2026
  input:
    pip_dl_category: ENHANCED
  output:
    is_severely_disabled_for_benefits: true

- name: PIP daily living component at the standard rate is not severe
  period: 2026
  input:
    pip_dl_category: STANDARD
  output:
    is_severely_disabled_for_benefits: false

- name: Attendance Allowance at the higher rate is severe (WTC reg 17(2))
  period: 2026
  input:
    aa_category: HIGHER
  output:
    is_severely_disabled_for_benefits: true

- name: Attendance Allowance at the lower rate is not severe
  period: 2026
  input:
    aa_category: LOWER
  output:
    is_severely_disabled_for_benefits: false

- name: Armed Forces Independence Payment is severe
  period: 2026
  input:
    armed_forces_independence_payment: 1_000
  output:
    is_severely_disabled_for_benefits: true

- name: Other Armed Forces Compensation Scheme payments are not severe
  period: 2026
  input:
    afcs_reported: 1_000
  output:
    is_severely_disabled_for_benefits: false

- name: WTC severe disability element for a claimant on higher-rate Attendance Allowance
  period: 2024
  absolute_error_margin: 0.01
  input:
    age: 70
    aa_category: HIGHER
    is_WTC_eligible: true
  output:
    # WTC Regs 2002 reg 17(2) and Sch 2 para 6: 1,705 a year in 2024-25.
    WTC_severely_disabled_element: 1_705

# Attendance Allowance is read from its award category. Only when no category
# is given is an amount compared with the annual higher rate less GBP 10 a
# week: an approximation, since WTC reg 17(2) has no tolerance.
- name: The Attendance Allowance category decides over an amount entered with it
  period: 2026
  input:
    aa_category: LOWER
    attendance_allowance: 5_959.20
  output:
    is_severely_disabled_for_benefits: false

- name: Attendance Allowance amount with no category, at the 2024 threshold, is severe
  period: 2024
  input:
    # 108.55 x 52 - 10 x 52 = 5,124.60.
    attendance_allowance: 5_124.60
  output:
    is_severely_disabled_for_benefits: true

- name: Attendance Allowance amount with no category, just below the 2024 threshold, is not severe
  period: 2024
  input:
    attendance_allowance: 5_124.59
  output:
    is_severely_disabled_for_benefits: false

- name: Attendance Allowance amount with no category, at the 2026 threshold, is severe
  period: 2026
  input:
    # 114.60 x 52 - 10 x 52 = 5,439.20.
    attendance_allowance: 5_439.20
  output:
    is_severely_disabled_for_benefits: true

- name: Attendance Allowance amount with no category, just below the 2026 threshold, is not severe
  period: 2026
  input:
    attendance_allowance: 5_439.19
  output:
    is_severely_disabled_for_benefits: false
