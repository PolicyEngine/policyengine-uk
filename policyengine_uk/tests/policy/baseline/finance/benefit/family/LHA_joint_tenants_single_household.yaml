- name: A joint tenant in the claimant's household who needs overnight care gives each an additional bedroom
  period: 2026
  input:
    people:
      lee:
        age: 32
        is_male: true
        is_household_head: true
      lee_partner:
        age: 31
        is_male: false
      lee_son:
        age: 4
        is_male: true
      lee_daughter:
        age: 7
        is_male: false
      mother:
        age: 70
        is_male: false
        meets_lha_overnight_care_condition: true
    benunits:
      lee_family:
        members: [lee, lee_partner, lee_son, lee_daughter]
      mother_family:
        members: [mother]
        liable_for_share_of_household_rent: true
        joint_tenant_in_household_head_household: true
    households:
      home:
        members: [lee, lee_partner, lee_son, lee_daughter, mother]
        rent: 7_800
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # Lee: 13D(3A)(a)(iii), an occupier other than the claimant or partner;
    # his mother: (a)(i), herself.
    housing_benefit_LHA_additional_bedrooms: [1, 1]
    housing_benefit_LHA_allowed_bedrooms: [4, 4]
