- name: A foster child placed with the head is no one's occupier and the carer's bedroom is the head's alone
  period: 2026
  input:
    people:
      head:
        age: 45
        is_male: false
        is_household_head: true
      foster_child:
        age: 8
        is_male: true
        is_looked_after_by_local_authority: true
      sister:
        age: 40
        is_male: false
    benunits:
      head_family:
        members: [head, foster_child]
      sister_family:
        members: [sister]
        liable_for_share_of_household_rent: true
        joint_tenant_in_household_head_household: true
    households:
      home:
        members: [head, foster_child, sister]
        rent: 15_600
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # The foster child does not occupy the dwelling (reg 21(3); LHA Guidance
    # Manual para 2.033). The head is a qualifying parent or carer with one
    # additional bedroom (13D(3A)(b)), which applies to the claimant and
    # partner only, so not to her sister's claim.
    is_child_or_young_person_placed_with_family: [false, true, false]
    housing_benefit_LHA_additional_bedrooms: [1, 0]
    housing_benefit_LHA_allowed_bedrooms: [3, 2]
    housing_benefit_LHA_category: [D, C]

- name: The input has no effect on a family that does not share the rent
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      john:
        age: 30
        is_household_head: true
      alex:
        age: 30
      peter:
        age: 30
        household_benefits_individual_non_dep_deduction: 1_000
    benunits:
      john_family:
        members: [john]
        joint_tenant_in_household_head_household: true
      alex_family:
        members: [alex]
        liable_for_share_of_household_rent: true
      peter_family:
        members: [peter]
        joint_tenant_in_household_head_household: true
    households:
      home:
        members: [john, alex, peter]
        rent: 20_800
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # As in LHA Guidance Manual 2.110: the household head and the
    # non-dependant are not sharers of the rent, so John and Alex remain in
    # separate households, each counting Peter.
    housing_benefit_LHA_allowed_bedrooms: [2, 2, 1]
    housing_benefit_shares_accommodation: [true, true, false]
    housing_benefit_non_dep_deductions: [500, 500, 0]

- name: The household head's own family marked as sharing the rent does not lack exclusive use
  period: 2026
  input:
    people:
      head:
        age: 40
        is_household_head: true
    benunits:
      head_family:
        members: [head]
        # The head's family is always liable for the rent; the input on it
        # alone does not make the rent shared.
        liable_for_share_of_household_rent: true
    households:
      home:
        members: [head]
        rent: 7_800
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    housing_benefit_shares_accommodation: false
    housing_benefit_LHA_allowed_bedrooms: 1
    # One bedroom with exclusive use, aged 40: the one-bedroom rate.
    housing_benefit_LHA_category: B
