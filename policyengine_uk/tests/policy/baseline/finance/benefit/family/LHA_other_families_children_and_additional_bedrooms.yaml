    # accommodation, has the shared rate (reg 13D(2)(a)(ii)).
    housing_benefit_LHA_allowed_bedrooms: [2, 1]
    housing_benefit_LHA_category: [C, A]

- name: A looked-after 17-year-old not in education is the renter's foster child under Universal Credit
  period: 2026
  input:
    people:
      renter:
        age: 40
        is_household_head: true
      young_person:
        age: 17
        current_education: NOT_IN_EDUCATION
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [renter, young_person]
    households:
      home:
        members: [renter, young_person]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: a person under 18 placed with the renter by a local authority
    # makes the renter a foster parent (reg 2) and is their foster child
    # (para 9(2)(c), 9(3); see is_lha_foster_child): no bedroom of their own,
    # one foster room: 2. (Read as under 16, they would be a non-dependant
    # with a bedroom and there would be no foster room: also 2.)
    is_lha_foster_child: [false, true]
    LHA_additional_bedrooms: 1
    LHA_allowed_bedrooms: 2
    # HB: not a "young person" (reg 19), so reg 21(3) does not apply: an
    # occupier aged 16 or over with a bedroom, and no qualifying parent or
    # carer room: 2.
    is_child_or_young_person_placed_with_family: [false, false]
    housing_benefit_LHA_additional_bedrooms: 0
    housing_benefit_LHA_allowed_bedrooms: 2

- name: A looked-after 17-year-old placed with a non-dependant
  period: 2026
  input:
    people:
      renter:
        age: 50
        is_household_head: true
      daughter:
        age: 35
        is_male: false
      young_person:
        age: 17
        current_education: NOT_IN_EDUCATION
        is_looked_after_by_local_authority: true
    benunits:
      renter_family:
        members: [renter]
      daughter_family:
        members: [daughter, young_person]
    households:
      home:
        members: [renter, daughter, young_person]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: for the renter, the 17-year-old is neither a child nor a qualifying
    # young person, so para 9(2)(g) does not exclude them, and they are not
    # the renter's foster child: renter, daughter and young person, 3. The
    # daughter's own size criteria: herself and the foster room, 2.
    LHA_allowed_bedrooms: [3, 2]
    # HB: not a "young person" (reg 19), so an occupier: 3. The daughter's
    # own: 1 + the 17-year-old (13D(3)(b)) = 2; no carer room, since reg
    # 21(3) does not apply.
    housing_benefit_LHA_allowed_bedrooms: [3, 2]

- name: A foster child who needs overnight care gives the overnight and the foster bedrooms
  period: 2026
  input:
    people:
      foster_parent:
        age: 40
        is_household_head: true
      foster_child:
        age: 8
        is_looked_after_by_local_authority: true
        dla_sc_middle_plus: true
        has_non_resident_overnight_carer: true
    benunits:
      family:
        members: [foster_parent, foster_child]
    households:
      home:
        members: [foster_parent, foster_child]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC para 12(A1)(c), (9)(a)-(b); HB reg 13D(3A)(a)(iv), (3B).
    LHA_additional_bedrooms: 2
    LHA_allowed_bedrooms: 3
    housing_benefit_LHA_additional_bedrooms: 2
    housing_benefit_LHA_allowed_bedrooms: 3

- name: A looked-after qualifying young person who needs overnight care
  period: 2026
  input:
    people:
      carer:
        age: 40
        is_household_head: true
        is_parent: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        is_looked_after_by_local_authority: true
        dla_sc_middle_plus: true
        has_non_resident_overnight_carer: true
    benunits:
      family:
        members: [carer, young_person]
    households:
      home:
        members: [carer, young_person]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_qualifying_young_person_for_universal_credit: [false, true]
    is_child_or_qualifying_young_person_for_universal_credit: [false, false]
    # UC: the young person is the renter's foster child (under 18), so their
    # overnight care counts under para 12(A1)(c): foster and overnight rooms,
    # 3.
    LHA_additional_bedrooms: 2
    LHA_allowed_bedrooms: 3
    # HB: placed under reg 21(3), so not an occupier, but within
    # 13D(3A)(a)(iv); with the qualifying parent or carer room, (3B): 3.
    housing_benefit_LHA_additional_bedrooms: 2
    housing_benefit_LHA_allowed_bedrooms: 3

- name: A lodger who needs overnight care counts for Housing Benefit only
  period: 2026
  input:
    people:
      householder:
        age: 60
        is_household_head: true
      lodger:
        age: 45
        rent_paid_as_lodger: 5_000
        pip_dl: 5_000
        has_non_resident_overnight_carer: true
    benunits:
      householder_family:
        members: [householder]
      lodger_family:
        members: [lodger]
    households:
      home:
        members: [householder, lodger]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: the lodger is outside the extended benefit unit (para 9(2)(d)): 1.
    # HB: the lodger is an occupier (13D(3)(b)) who requires overnight care
    # (13D(3A)(a)(iii)): 3. The lodger's own claim: 1 + carer room = 2.
    LHA_allowed_bedrooms: [1, 2]
    housing_benefit_LHA_allowed_bedrooms: [3, 2]

- name: A joint tenant's overnight care counts only for that tenant
  period: 2026
  input:
    people:
      tenant_1:
        age: 40
        is_household_head: true
      tenant_2:
        age: 38
        pip_dl: 5_000
        has_non_resident_overnight_carer: true
    benunits:
      family_1:
        members: [tenant_1]
      family_2:
        members: [tenant_2]
        liable_for_share_of_household_rent: true
    households:
      home:
        members: [tenant_1, tenant_2]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: the joint tenant is not in the other's extended benefit unit (para
    # 9(2)(d)). HB: 13D(3A)(a)(iii) says "a person ... who occupies the
    # claimant's dwelling as their home", without the defined term
    # "occupiers"; the model applies 13D(12)'s joint-tenant exclusion, as
    # private-sector joint tenants' size criteria rest on each tenant's own
    # household (HB circular A21/2013 para 25).
    LHA_allowed_bedrooms: [1, 2]
    housing_benefit_LHA_allowed_bedrooms: [1, 2]

