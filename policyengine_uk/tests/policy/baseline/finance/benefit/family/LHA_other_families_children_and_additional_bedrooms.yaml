        members: [adopter, child]
    households:
      home:
        members: [adopter, child]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: the adopter is responsible for the child (reg 4A(1)(c), from 1
    # April 2024), who has a bedroom (para 10(1)(f)), and as an adopter with
    # whom a child is placed meets the foster parent condition (para
    # 12(4)(b); ADM F3133): 3 bedrooms.
    is_child_or_qualifying_young_person_for_universal_credit: [false, true]
    lha_renter_meets_foster_parent_condition: true
    LHA_allowed_bedrooms: 3
    LHA_category: D
    # HB: the child is not a member of the household nor an occupier (reg
    # 21(3)(b)-(c)); the adopter is a qualifying parent or carer: 2 bedrooms.
    is_child_or_young_person_for_legacy_benefits: [false, false]
    is_child_or_young_person_placed_with_family: [false, true]
    housing_benefit_LHA_allowed_bedrooms: 2
    housing_benefit_LHA_category: C

