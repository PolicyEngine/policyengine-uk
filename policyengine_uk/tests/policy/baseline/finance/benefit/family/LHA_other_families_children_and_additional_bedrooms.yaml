        members: [renter, daughter, grandson, granddaughter]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: the renter, the daughter (para 10(1)(c)) and the two grandchildren
    # under 10 (10(1)(d)): 3 bedrooms, category D.
    LHA_allowed_bedrooms: [3, 2]
    LHA_category: [D, C]
    # HB: reg 13D(3)(a), (b), (d).
    housing_benefit_LHA_allowed_bedrooms: [3, 2]
    housing_benefit_LHA_category: [D, C]

- name: A lodger's child counts for Housing Benefit but not Universal Credit
  period: 2026
  input:
    people:
      householder:
        age: 60
        is_household_head: true
      lodger:
        age: 30
        rent_paid_as_lodger: 5_000
      lodgers_child:
        age: 5
    benunits:
      householder_family:
        members: [householder]
      lodger_family:
        members: [lodger, lodgers_child]
    households:
      home:
        members: [householder, lodger, lodgers_child]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_non_dependant_of_household_head: [false, false, false]
    # UC: the lodger is liable to pay on a commercial basis (para 9(2)(d)),
    # so is not in the householder's extended benefit unit, and the lodger's
    # child is excluded by para 9(2)(g): the householder's bedroom only.
    LHA_allowed_bedrooms: [1, 2]
    # HB: the lodger and the lodger's child occupy the dwelling as their home
    # (reg 13D(12); LHA Guidance Manual para 2.030; circular A4/2012 para
    # 44): 3 bedrooms. The lodger's own claim counts their own family.
    housing_benefit_LHA_allowed_bedrooms: [3, 2]

- name: A joint tenant's child does not count for the other joint tenant
  period: 2026
  input:
    people:
      tenant_1:
        age: 40
        is_household_head: true
      tenant_2:
        age: 38
      tenant_2_child:
        age: 7
    benunits:
      family_1:
        members: [tenant_1]
      family_2:
        members: [tenant_2, tenant_2_child]
        liable_for_share_of_household_rent: true
    households:
      home:
        members: [tenant_1, tenant_2, tenant_2_child]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # A joint tenant outside the claimant's household is not an occupier
    # (HB reg 13D(12)), nor their household (LHA Guidance Manual paras 2.031
    # and 2.093); under UC they are liable for their occupation (para
    # 9(2)(d)). Each joint tenant counts their own family.
    LHA_allowed_bedrooms: [1, 2]
    housing_benefit_LHA_allowed_bedrooms: [1, 2]

- name: A non-dependant's foster child does not count for the renter
  period: 2026
  input:
    people:
      renter:
        age: 60
        is_household_head: true
      daughter:
        age: 32
        is_male: false
      foster_child:
        age: 6
        is_looked_after_by_local_authority: true
    benunits:
      renter_family:
        members: [renter]
      daughter_family:
        members: [daughter, foster_child]
    households:
      home:
        members: [renter, daughter, foster_child]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: no one in the renter's extended benefit unit is responsible for a
    # looked-after child (reg 4(6)(a)), so the child is not a non-dependant
    # (para 9(2)(g)): the renter and the daughter, 2 bedrooms.
    LHA_allowed_bedrooms: [2, 2]
    # HB: reg 21(3) names only a child placed with the claimant or partner,
    # but DWP treats foster children as not occupying the dwelling (LHA
    # Guidance Manual para 2.033; circular A21/2013 para 22), and the model
    # follows it: 2 bedrooms. The daughter's own size criteria include the
    # foster parent's or qualifying parent or carer's additional bedroom.
    housing_benefit_LHA_allowed_bedrooms: [2, 2]
    LHA_additional_bedrooms: [0, 1]
    housing_benefit_LHA_additional_bedrooms: [0, 1]

- name: Foster children have no bedrooms of their own; the foster parent has one additional bedroom
  period: 2026
  input:
    people:
      foster_parent:
        age: 45
        is_household_head: true
      foster_son:
        age: 12
        is_male: true
        is_looked_after_by_local_authority: true
      foster_daughter:
        age: 11
        is_male: false
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [foster_parent, foster_son, foster_daughter]
    households:
      home:
        members: [foster_parent, foster_son, foster_daughter]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_child_or_qualifying_young_person_for_universal_credit: [false, false, false]
    is_child_or_young_person_placed_with_family: [false, true, true]
    # UC: foster children are in no one's extended benefit unit (paras 9(1),
    # 9(2)(c), 9(3); reg 4(6)(a)); the renter is a foster parent with one
    # additional bedroom however many children are placed (para 12(4)(a),
    # (9)(b); ADM F3138 example 2): 2 bedrooms, category C.
    lha_renter_meets_foster_parent_condition: true
    LHA_additional_bedrooms: 1
    LHA_allowed_bedrooms: 2
    LHA_category: C
    # HB: the foster children do not occupy the dwelling (reg 21(3); LHA
    # Guidance Manual para 2.033); the claimant is a qualifying parent or
    # carer (reg 2(1)) with one additional bedroom (reg 13D(3A)(b)).
    is_housing_benefit_qualifying_parent_or_carer: true
    housing_benefit_LHA_additional_bedrooms: 1
    housing_benefit_LHA_allowed_bedrooms: 2
    housing_benefit_LHA_category: C
    uc_housing_costs_element: 10_400

- name: A couple fostering a child alongside their own child
  period: 2026
  input:
    people:
      parent_1:
        age: 38
        is_household_head: true
        is_parent: true
      parent_2:
        age: 36
        is_parent: true
      son:
        age: 5
        is_male: true
      foster_daughter:
        age: 3
        is_male: false
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [parent_1, parent_2, son, foster_daughter]
    households:
      home:
        members: [parent_1, parent_2, son, foster_daughter]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_claimant_or_partner: [true, true, false, false]
    # UC: the couple, their son (para 10(1)(f)), and the foster parent's
    # additional bedroom (para 12(9)(b)): 3 bedrooms. The foster daughter
    # does not share with the son as a child of the extended benefit unit.
    LHA_allowed_bedrooms: 3
    LHA_category: D
    # HB: the couple, the son (reg 13D(3)(e)) and the qualifying parent or
    # carer's bedroom (13D(3A)(b)).
    housing_benefit_LHA_allowed_bedrooms: 3
    housing_benefit_LHA_category: D

- name: A single foster parent under 35 is not restricted to the shared accommodation rate
  period: 2026
  input:
    people:
