    LHA_allowed_bedrooms: [1, 2]

- name: A non-dependant's child placed for adoption
  period: 2026
  input:
    people:
      renter:
        age: 60
        is_household_head: true
      daughter:
        age: 30
        is_male: false
      child:
        age: 5
        is_placed_for_adoption: true
    benunits:
      renter_family:
        members: [renter]
      daughter_family:
        members: [daughter, child]
    households:
      home:
        members: [renter, daughter, child]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: reg 4A(1)(c) makes the daughter responsible, so the child is in
    # the renter's extended benefit unit: 3. The daughter's own: herself, the
    # child and the adopter's room, 3.
    LHA_allowed_bedrooms: [3, 3]
    # HB: following DWP, a child placed with anyone in the household is not
    # an occupier: 2. The daughter's own: herself and the qualifying parent
    # or carer room, 2.
    housing_benefit_LHA_allowed_bedrooms: [2, 2]

