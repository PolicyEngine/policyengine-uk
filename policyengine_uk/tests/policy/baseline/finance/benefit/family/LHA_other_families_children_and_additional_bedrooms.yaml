        is_approved_foster_parent_without_placement: true
      non_dependant_1:
        age: 30
      non_dependant_2:
        age: 29
      non_dependant_3:
        age: 40
    benunits:
      renter_family:
        members: [renter]
      non_dependant_family_1:
        members: [non_dependant_1, non_dependant_2]
      non_dependant_family_2:
        members: [non_dependant_3]
    households:
      home:
        members: [renter, non_dependant_1, non_dependant_2, non_dependant_3]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: the renter, three non-dependants and the foster room: 5, capped at
    # category E (para 26). HB: the claimant, the couple (13D(3)(a)), the
    # other non-dependant and the carer room: 4, E.
    LHA_allowed_bedrooms: [5, 1, 1]
    LHA_category: [E, B, B]
    housing_benefit_LHA_allowed_bedrooms: [4, 1, 1]
    housing_benefit_LHA_category: [E, B, B]

- name: Before April 2017 a non-dependant's overnight care gave no additional bedroom
  period: 2016
  input:
    people:
      renter:
        age: 58
        is_household_head: true
      son:
        age: 30
        pip_dl: 5_000
        has_non_resident_overnight_carer: true
    benunits:
      renter_family:
        members: [renter]
      son_family:
        members: [son]
    households:
      home:
        members: [renter, son]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC Sch 4 para 12(A1)(b) and HB reg 13D(3A)(a)(iii) came in on 1 April
    # 2017 (SI 2017/213); before then only the renter or claimant and
    # partner counted. The son's own claim keeps his room.
    LHA_additional_bedrooms: [0, 1]
    LHA_allowed_bedrooms: [2, 2]
    housing_benefit_LHA_additional_bedrooms: [0, 1]
    housing_benefit_LHA_allowed_bedrooms: [2, 2]

- name: A non-dependant's foster child who needs overnight care counts only for the non-dependant
  period: 2026
  input:
    people:
      renter:
        age: 60
        is_household_head: true
      daughter:
        age: 32
        is_male: false
      foster_child:
        age: 6
        is_looked_after_by_local_authority: true
        dla_sc_middle_plus: true
        has_non_resident_overnight_carer: true
    benunits:
      renter_family:
        members: [renter]
      daughter_family:
        members: [daughter, foster_child]
    households:
      home:
        members: [renter, daughter, foster_child]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # UC: the foster child is in no one's extended benefit unit but the
    # foster parent's (para 9(2)(g); 12(A1)(c)), so the renter gets no
    # overnight room: 2. The daughter: herself, the foster room and the
    # overnight room, 3. HB: not an occupier of the renter's dwelling (model
    # follows DWP); the daughter's own: herself, the carer room and the
    # overnight room ((3A)(a)(iv)), 3.
    LHA_additional_bedrooms: [0, 2]
    LHA_allowed_bedrooms: [2, 3]
    housing_benefit_LHA_additional_bedrooms: [0, 2]
    housing_benefit_LHA_allowed_bedrooms: [2, 3]

