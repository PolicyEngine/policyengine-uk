# Who counts in the LHA size criteria beyond the claimant's own family, and
# the additional bedrooms for foster parents and overnight care.
#
# Universal Credit (UC Regs 2013 Sch 4): the renter's extended benefit unit is
# the renter, the children and qualifying young persons they are responsible
# for, and their non-dependants (para 9(1)). A non-dependant is anyone who
# normally lives with the renter except, among others, a foster child of the
# renter (9(2)(c), 9(3)), a person liable to pay for their occupation on a
# commercial basis such as a lodger (9(2)(d)), and a child or qualifying young
# person no one in the extended benefit unit is responsible for (9(2)(g)). A
# non-dependant's own child is their responsibility (reg 4(2)), so is a
# non-dependant too, and counts as a child in para 10(1)(d)-(f). No one is
# responsible for a child looked after by a local authority (reg 4(6)(a)),
# except a child placed for adoption (reg 4A(1)(c)). Para 12 gives one
# additional bedroom for each of the overnight care condition and the foster
# parent condition (12(9)).
#
# Housing Benefit (HB Regs 2006 and HB (SPC) Regs 2006 reg 13D): one bedroom
# for each category of "occupier", everyone who occupies the dwelling as
# their home except a joint tenant outside the claimant's household (13D(12)),
# so the children of a non-dependant, boarder or lodger count. A child or
# young person placed with the claimant as a foster child or for adoption
# does not occupy the dwelling (reg 21(3)); the claimant is then a
# "qualifying parent or carer" (reg 2(1)) with one additional bedroom
# (13D(3A)(b)), and one more for overnight care (13D(3A)(a), (3B)).
#
# DWP guidance: ADM F3016, F3034, F3111-F3112, F3131-F3138; LHA Guidance
# Manual (April 2014) paras 2.030-2.033, 2.090, 2.093; HB/CTB circular A4/2012
# paras 36-38 and 44.
#
# Rents of £200 a week (£10,400 a year) sit between the published Maidstone
# one-bedroom (B) and two-bedroom (C) rates (VOA, LHA April 2024, held for
# 2025-26: B £172.60, C £208.27 a week), so where the category is C the rent
# is met in full.

- name: A non-dependant's child of the opposite sex needs a bedroom of their own
  period: 2026
  input:
    people:
      renter:
        age: 48
        is_household_head: true
        is_male: false
      son:
        age: 12
        is_male: true
      daughter:
        age: 24
        is_male: false
      granddaughter:
        age: 11
        is_male: false
    benunits:
      renter_family:
        members: [renter, son]
      daughter_family:
        members: [daughter, granddaughter]
    households:
      home:
        members: [renter, son, daughter, granddaughter]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    is_non_dependant_of_household_head: [false, false, true, true]
    # UC: the renter (para 10(1)(a)), the daughter (10(1)(c)), and the son
    # and the granddaughter, who are of opposite sexes and over 10 (10(1)(f)):
    # 4 bedrooms. The daughter's own entitlement counts her and her child.
    LHA_allowed_bedrooms: [4, 2]
    LHA_category: [E, C]
    # HB: the claimant, the daughter and the two children: the same four
    # occupiers' categories (reg 13D(3)(b), (e)).
    housing_benefit_LHA_allowed_bedrooms: [4, 2]
    housing_benefit_LHA_category: [E, C]

- name: A non-dependant's child shares with the renter's child of the same sex
  period: 2026
  input:
    people:
      renter:
        age: 48
        is_household_head: true
        is_male: false
      son:
        age: 12
        is_male: true
      daughter:
        age: 24
        is_male: false
      grandson:
        age: 8
        is_male: true
    benunits:
      renter_family:
        members: [renter, son]
      daughter_family:
        members: [daughter, grandson]
    households:
      home:
        members: [renter, son, daughter, grandson]
        rent: 10_400
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # The son and the grandson share (UC para 10(1)(e); HB reg 13D(3)(c)):
    # 3 bedrooms, the same as without the grandson.
    LHA_allowed_bedrooms: [3, 2]
    housing_benefit_LHA_allowed_bedrooms: [3, 2]

- name: A non-dependant's two children under 10 share one bedroom
  period: 2026
  input:
