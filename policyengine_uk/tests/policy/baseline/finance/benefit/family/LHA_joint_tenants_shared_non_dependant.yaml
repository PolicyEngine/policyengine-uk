    housing_benefit_non_dep_deductions: [1_000, 0]
    council_tax_reduction_non_dep_deductions: [300, 0]

- name: A shared non-dependant couple is one bedroom for each joint tenant
  period: 2026
  input:
    people:
      john:
        age: 30
        is_household_head: true
      alex:
        age: 30
      peter:
        age: 30
      paula:
        age: 29
    benunits:
