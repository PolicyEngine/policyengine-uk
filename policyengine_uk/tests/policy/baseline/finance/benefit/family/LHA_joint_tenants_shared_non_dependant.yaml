- name: A sharer with no rent is never its own or the head's non-dependant
  period: 2026
  input:
    people:
      head:
        age: 30
        is_household_head: true
      sharer:
        age: 30
    benunits:
      head_family:
        members: [head]
        housing_benefit_shares_accommodation: false
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
        housing_benefit_shares_accommodation: false
    households:
      home:
        members: [head, sharer]
        rent: 0
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # HB reg 3(2)(a), (d): neither joint occupier is a non-dependant of
