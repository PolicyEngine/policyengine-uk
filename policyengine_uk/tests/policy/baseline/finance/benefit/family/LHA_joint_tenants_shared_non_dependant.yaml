        council_tax_reduction_individual_non_dep_deduction: 300
        merton_council_tax_reduction_individual_non_dep_deduction: 300
      adult_2:
        age: 40
        council_tax_reduction_individual_non_dep_deduction: 200
        merton_council_tax_reduction_individual_non_dep_deduction: 200
