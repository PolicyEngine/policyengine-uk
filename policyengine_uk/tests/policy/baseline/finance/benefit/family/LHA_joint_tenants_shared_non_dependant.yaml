- name: A non-dependant of only a couple who share the rent with a sharer falls wholly on the couple's CTR claim
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        is_household_head: true
      head_partner:
        age: 44
      sharer:
        age: 40
      relative:
        age: 30
        council_tax_reduction_individual_non_dep_deduction: 300
    benunits:
      head_family:
        members: [head, head_partner]
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
      relative_family:
        members: [relative]
        non_dependant_normally_resides_with: HOUSEHOLD_HEAD_FAMILY
    households:
      home:
        members: [head, head_partner, sharer, relative]
        rent: 20_800
        tenure_type: RENT_PRIVATELY
  output:
    # The model treats a couple as one claim here, as it does when no one
    # else is liable: the relative resides with that family alone, so its
    # claim bears the whole deduction. Where both partners are named joint
    # tenants (liable under LGFA 1992 s.6, not only s.9), the literal Sch 1
    # para 8(5) would split it between the two of them; the model cannot
    # tell how a couple is liable.
    council_tax_reduction_non_dep_deductions: [300, 0, 0]

- name: A sharer flag on the household head's own family shares the rent with no one
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
