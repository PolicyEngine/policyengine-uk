    merton_council_tax_reduction_non_dep_deductions: [500, 200, 300]

- name: Without sharers every residence value takes the supplied rent share
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        is_household_head: true
      daughter:
        age: 22
        household_benefits_individual_non_dep_deduction: 1_000
    benunits:
      head_family:
        members: [head]
        share_of_household_rent: 0.6
      daughter_family:
        members: [daughter]
        share_of_household_rent: 0
        non_dependant_normally_resides_with: HOUSEHOLD_HEAD_FAMILY
    households:
      home:
        members: [head, daughter]
        rent: 20_800
        tenure_type: RENT_PRIVATELY
