        members: [peter, paula]
    households:
      home:
        members: [john, alex, peter, paula]
        rent: 20_800
        tenure_type: RENT_PRIVATELY
        brma: MAIDSTONE
  output:
    # HB reg 13D(3)(a): an occupier couple is one category, so one bedroom,
    # in each joint tenant's size criteria.
    housing_benefit_LHA_allowed_bedrooms: [2, 2, 1]
    # UC: each non-dependant not a child has a bedroom (Sch 4 para
    # 10(1)(c)), in the household head's claim only.
