# UC Regulations 2013 reg 3(3)(a) permits an actual single claim where the
# partner is 17 and outside the reduced minimum-age exceptions. A valid
# Scottish married couple remains a tax-credit couple, but only the older
# member is a UC claimant. TP Regulations 2014 reg 8(2B) saves that pension-
# age single claimant after July 2022; no exact continuing payment is asserted.
# https://www.legislation.gov.uk/uksi/2013/376/regulation/3
# https://www.legislation.gov.uk/uksi/2014/1230/regulation/8
- name: Case 20, a pension age UC single claimant is saved with an excluded young spouse in the first role.
  period: 2024
  input:
    people:
      person1:
        age: 70
        weekly_hours: 16
        employment_income: 5000
        working_tax_credit_reported: 1000
        is_claimant_or_partner: true
        is_parent: false
        is_disabled_for_benefits: false
        care_hours: 0
        carers_allowance_reported: 0
      person2:
        age: 17
        weekly_hours: 0
        employment_income: 0
        working_tax_credit_reported: 0
        is_claimant_or_partner: true
        is_parent: false
        is_disabled_for_benefits: false
        care_hours: 0
        carers_allowance_reported: 0
    benunits:
      benunit:
        members:
        - person1
        - person2
        relation_type: COUPLE
        is_married: true
        would_claim_uc: true
        would_claim_uc_at_legacy_closure: false
        legacy_benefits_closed: false
        would_claim_WTC: true
    households:
      household:
        members:
        - person1
        - person2
        region: SCOTLAND
        tenure_type: OWNED_OUTRIGHT
  output:
    is_couple: true
    claims_universal_credit: true
    has_attained_state_pension_credit_qualifying_age:
    - true
    - false
    uc_limited_capability_for_work:
    - false
    - false
    is_carer_for_benefits:
