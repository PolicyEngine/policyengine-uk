# SI 2014/1230 reg 8(2)(a)-(b): an ordinary genuine UC claim ends
# claimant/joint-claimant tax credits even if UC pays zero. Current 8(2B)
# saves a single pension-age claimant or BOTH joint claimants, not a mixed
# age couple merely keeping a protected Pension Credit route.
# https://www.legislation.gov.uk/uksi/2014/1230/regulation/8
# https://www.legislation.gov.uk/nisr/2016/226/regulation/6
# claims_universal_credit is the existing annual claim proxy; these cases
# do not assert made/deemed/withdrawn claim dates or fractional-year awards.
# The 2015 England ordinary-claim case is after 16 June 2014. The 2011/2012
# direct predicate controls do not represent actual UC claims. The 2013
# full-WTC control has no claim. Modern NI uses 2024.
# Amount controls: 2024 basic 2,435 + 30-hour element 1,015 = 3,450;
# 2013 basic 1,920 + 30-hour element 790 = 2,710, with earnings 5,000
# below the taper threshold. See the cited Schedule 2 in the unchanged
# elements/basic.yaml and worker.yaml parameters; no model-derived oracle.

- name: Case 1, an ordinary UC claim ends a working age claimant WTC award.
  period: 2024
  input:
    people:
      person1:
        age: 35
        weekly_hours: 30
        employment_income: 5000
        working_tax_credit_reported: 1000
        is_claimant_or_partner: true
        is_parent: false
        is_disabled_for_benefits: false
    benunits:
      benunit:
        members:
        - person1
        would_claim_uc: true
        would_claim_uc_at_legacy_closure: false
        legacy_benefits_closed: false
        would_claim_WTC: true
    households:
      household:
        members:
        - person1
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    claims_universal_credit: true
    is_WTC_eligible: false
    working_tax_credit: 0
    working_tax_credit_reported:
    - 1000
- name: Case 2, a UC claim ends WTC even when capital makes the UC payment zero.
