        legacy_benefits_closed: false
        would_claim_WTC: true
        uc_reported_capital: 20000
    households:
      household:
        members:
        - person1
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    claims_universal_credit: true
    uc_assessable_capital: 20000
    is_uc_eligible: false
    universal_credit: 0
    is_WTC_eligible: false
    working_tax_credit: 0
  absolute_error_margin: 0.01
