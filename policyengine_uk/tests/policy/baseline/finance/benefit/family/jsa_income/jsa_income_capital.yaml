- name: Income-based JSA capital test disregards private pension wealth
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        jsa_income_reported: 1_000
    benunits:
      benunit:
        members: claimant
    households:
      household:
        members: claimant
        savings: 1_000
        corporate_wealth: 2_000
        private_pension_wealth: 150_000
  output:
    # Savings at face value; shares less 10% for the expenses of sale
    # (JSA Regs 1996 reg. 111(a)): 1,000 + 90% of 2,000.
    jsa_income_assessable_capital: 2_800

- name: Income-based JSA values overseas land and property less sale expenses
  period: 2026
  absolute_error_margin: 0
  input:
    age: 40
    overseas_property_value: 10_000
  output:
    # 10,000 gross less 10% sale expenses; no identified secured debt.
    jsa_income_assessable_capital: 9_000

- name: Income-based JSA preserves household allocation for overseas land and property
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 40
      second:
        age: 40
      partner:
        age: 40
    benunits:
      single:
        members: first
      couple:
        members: [second, partner]
    households:
      household:
        members: [first, second, partner]
        overseas_property_value: 18_000
  output:
    # The 16,200 net household value is shared by one and two adults.
    jsa_income_assessable_capital: [5_400, 10_800]

- name: Income-based JSA reported claim path receives full overseas land and property capital
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 40
        jsa_income_reported: 1_000
      unrelated:
        age: 40
    benunits:
      claiming:
        members: claimant
      other:
        members: unrelated
    households:
      household:
        members: [claimant, unrelated]
        overseas_property_value: 18_000
  output:
    # Existing claim-path allocation gives the claimant all net household capital.
    jsa_income_assessable_capital: [16_200, 0]

