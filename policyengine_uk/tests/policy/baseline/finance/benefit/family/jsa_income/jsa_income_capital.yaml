- name: Income-based JSA allocates household capital by claimant and partner share when nobody reports the award
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      adult_1:
        age: 30
      adult_2:
        age: 32
      adult_3:
        age: 34
    benunits:
      benunit_1:
        members: adult_1
      benunit_2:
        members: [adult_2, adult_3]
    households:
      household:
        members: [adult_1, adult_2, adult_3]
        savings: 18_000
  output:
    jsa_income_assessable_capital: [6_000, 12_000]

- name: Income-based JSA does not dilute claimant capital across unrelated non-claiming adults
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        jsa_income_reported: 1_000
      unrelated_adult:
        age: 34
    benunits:
      claimant_benunit:
        members: claimant
      unrelated_benunit:
        members: unrelated_adult
    households:
      household:
        members: [claimant, unrelated_adult]
        savings: 18_000
  output:
    jsa_income_assessable_capital: [18_000, 0]

