- name: Income-based JSA capital test ignores the main residence
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        jsa_income_reported: 1_000
    benunits:
      benunit:
        members: claimant
    households:
      household:
        members: claimant
        savings: 1_000
        owned_land: 500
        corporate_wealth: 2_000
        main_residence_value: 300_000
        other_residential_property_value: 3_000
        non_residential_property_value: 4_000
  output:
    # Savings at face value; land, shares and property less 10% for the
    # expenses of sale (JSA Regs 1996 reg. 111(a)): 1,000 + 90% of 9,500.
    jsa_income_assessable_capital: 9_550

- name: Income-based JSA has no tariff income at the lower capital threshold
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        jsa_income_reported: 1_000
    benunits:
      benunit:
        members: claimant
    households:
      household:
        members: claimant
        savings: 6_000
  output:
    jsa_income_tariff_income: 0
    jsa_income: 1_000

