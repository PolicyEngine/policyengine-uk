# Income-based JSA tariff income from capital: JSA Regs 1996 reg 116 (NI: SR
# 1996/198 reg 116). Capital above the lower threshold counts as £1 a week for
# each complete £250 (reg 116(1)-(1A)) and £1 for any part of £250 left over
# (reg 116(2)), over 52 weeks. The lower threshold is £6,000 (reg 116(1)), or
# £10,000 where the claimant lives permanently in prescribed accommodation
# (reg 116(1A)-(1C)). Capital above £16,000 bars the award (reg 107), so the
# figures at £16,001 continue the formula past the limit. No award turns on
# them: the last case shows the award is nil there.

- name: Income-based JSA ordinary capital threshold and partial steps
  period: 2025
  absolute_error_margin: 0.01
  input:
    jsa_income_assessable_capital: [6000, 6001, 10000, 10001, 10251, 16000, 16001]
    legacy_prescribed_accommodation_capital_exception: [false, false, false, false, false, false, false]
  output:
    # Excess over £6,000: 0, 1, 4,000, 4,001, 4,251, 10,000, 10,001.
    # Steps of £250 or part: 0, 1, 16, 17, 18, 40, 41; each £1 x 52.
    jsa_income_tariff_income: [0, 52, 832, 884, 936, 2080, 2132]

- name: Income-based JSA prescribed accommodation capital threshold and partial steps
  period: 2025
  absolute_error_margin: 0.01
  input:
    jsa_income_assessable_capital: [6000, 6001, 10000, 10001, 10251, 16000, 16001]
    legacy_prescribed_accommodation_capital_exception: [true, true, true, true, true, true, true]
  output:
    # Excess over £10,000: 0, 0, 0, 1, 251, 6,000, 6,001.
    # Steps of £250 or part: 0, 0, 0, 1, 2, 24, 25; each £1 x 52.
    jsa_income_tariff_income: [0, 0, 0, 52, 104, 1248, 1300]

- name: Omitted prescribed accommodation status retains the ordinary JSA threshold
  period: 2025
  absolute_error_margin: 0.01
  input:
    jsa_income_assessable_capital: 10001
  output:
    legacy_prescribed_accommodation_capital_exception: false
    jsa_income_tariff_income: 884

- name: Housing Benefit's residential exception does not set the JSA threshold
  period: 2025
  absolute_error_margin: 0.01
  input:
    jsa_income_assessable_capital: 10001
    housing_benefit_residential_capital_exception: true
  output:
    legacy_prescribed_accommodation_capital_exception: false
    # Reg 116(1): £4,001 over £6,000, 17 steps.
    jsa_income_tariff_income: 884

- name: Income-based JSA in prescribed accommodation is paid at the upper capital limit
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        jsa_income_reported: 3_000
    benunits:
      benunit:
        members: claimant
        jsa_income_assessable_capital: 16_000
        legacy_prescribed_accommodation_capital_exception: true
    households:
      household:
        members: claimant
  output:
    jsa_income_eligible: true
    # Reg 116(1A): £6,000 over £10,000 is 24 steps, £24 x 52 = £1,248.
    jsa_income_tariff_income: 1_248
    # £3,000 reported award less £1,248 tariff income.
    jsa_income: 1_752

- name: Income-based JSA outside prescribed accommodation is paid at the upper capital limit
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        jsa_income_reported: 3_000
    benunits:
      benunit:
        members: claimant
        jsa_income_assessable_capital: 16_000
        legacy_prescribed_accommodation_capital_exception: false
    households:
      household:
        members: claimant
  output:
    jsa_income_eligible: true
    # Reg 116(1): £10,000 over £6,000 is 40 steps, £40 x 52 = £2,080.
    jsa_income_tariff_income: 2_080
    # £3,000 reported award less £2,080 tariff income.
    jsa_income: 920

- name: Income-based JSA is not paid above the capital limit with or without the exception
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant_1:
        age: 30
        jsa_income_reported: 3_000
      claimant_2:
        age: 30
        jsa_income_reported: 3_000
    benunits:
      benunit_1:
        members: claimant_1
        jsa_income_assessable_capital: 16_001
        legacy_prescribed_accommodation_capital_exception: true
      benunit_2:
        members: claimant_2
        jsa_income_assessable_capital: 16_001
        legacy_prescribed_accommodation_capital_exception: false
    households:
      household_1:
        members: claimant_1
      household_2:
        members: claimant_2
  output:
    # Reg 107: capital above £16,000 bars the award.
    jsa_income_eligible: [false, false]
    jsa_income: [0, 0]
