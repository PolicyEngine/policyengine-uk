- name: A couple caring for a placed child have the same 24-hour limit
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 40
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
      second:
        age: 40
        is_claimant_or_partner: true
        hours_worked: 1_040
      child:
        age: 8
        is_claimant_or_partner: false
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [first, second, child]
    households:
      household:
        members: [first, second, child]
  output:
    # Not a joint-claim couple (reg 3A(1) with reg 78(4)(a)); the partner's
    # 20 hours are under 24, as for a couple without children.
    jsa_income_eligible: true

# Members outside the family.

- name: A non-dependent adult's own award is tested on their own work alone
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      head:
        age: 50
        is_claimant_or_partner: true
        hours_worked: 2_080
      lodger:
        age: 30
        is_claimant_or_partner: false
        jsa_income_reported: 3_000
    benunits:
      benunit:
        members: [head, lodger]
    households:
      household:
        members: [head, lodger]
  output:
    jsa_income_eligible: true
    jsa_income: 3_000

- name: A non-dependent adult's award does not rescue the claimant's
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 50
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
        hours_worked: 832
      lodger:
        age: 30
        is_claimant_or_partner: false
        jsa_income_reported: 3_000
    benunits:
      benunit:
        members: [claimant, lodger]
    households:
      household:
        members: [claimant, lodger]
  output:
    jsa_income_eligible: false

- name: A non-dependent adult working 16 hours is not on JSA, whatever the claimant reports
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 50
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
      lodger:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        jsa_income_reported: 3_000
        hours_worked: 832
    benunits:
      benunit:
        members: [claimant, lodger]
    households:
      household:
        members: [claimant, lodger]
  output:
    # The claimant reports the award, so the benefit unit's screen tests only
    # the claimant, who passes.
    jsa_income_eligible: true
    claimant_or_partner_jsa_income: 3_000
    # The lodger claims in their own right and works 16 hours a week as its
    # claimant (Jobseekers Act 1995 s.1(2)(e)).
    is_on_income_based_jsa: [true, false]

- name: A non-working non-dependent adult stays on JSA when the claimant's claim fails
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 50
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
        hours_worked: 832
      lodger:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        jsa_income_reported: 3_000
    benunits:
      benunit:
        members: [claimant, lodger]
    households:
      household:
        members: [claimant, lodger]
  output:
    # The benefit unit's award applies the claimant's failed screen to every
    # report in it, so it is nil.
    jsa_income_eligible: false
    jsa_income: 0
    claimant_or_partner_jsa_income: 0
    # The lodger's own claim passes, so they are on it; the claimant is not.
    is_on_income_based_jsa: [false, true]

# The Income Support gate reads the screened award (s.124(1)(f)).

- name: A carer's own JSA lost to 16 hours of work no longer bars Income Support
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      carer:
        age: 40
        is_claimant_or_partner: true
        receives_carer_benefit: true
        income_support_reported: 1_000
        jsa_income_reported: 3_000
        # 20 hours a week: a carer is not in remunerative work for Income
        # Support (IS Regs reg 6(4)(c)), but is for JSA.
        hours_worked: 1_040
    benunits:
      benunit:
        members: [carer]
        income_support_assessable_capital: 0
    households:
      household:
        members: [carer]
  output:
    jsa_income_eligible: false
    jsa_income: 0
    income_support_eligible: true
