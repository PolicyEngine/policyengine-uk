# A couple without children (a joint-claim couple, s.1(4), reg 3A(1)).

- name: Without children, the other member working 15 hours does not end it
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 30
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
      second:
        age: 30
        is_claimant_or_partner: true
        hours_worked: 780
    benunits:
      couple:
        members: [first, second]
    households:
      household:
        members: [first, second]
  output:
    jsa_income_eligible: true
    jsa_income: 3_000

- name: Without children, the other member working 16 hours does not end it
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 30
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
      second:
        age: 30
        is_claimant_or_partner: true
        # A joint claim would fail, but the first member can claim alone
        # (reg 3E(1), (2)(g)) and the second is under 24 hours (s.3(1)(e)).
        hours_worked: 832
    benunits:
      couple:
        members: [first, second]
    households:
      household:
        members: [first, second]
  output:
    jsa_income_eligible: true
    jsa_income: 3_000

- name: Without children, the other member working 20 hours does not end it
