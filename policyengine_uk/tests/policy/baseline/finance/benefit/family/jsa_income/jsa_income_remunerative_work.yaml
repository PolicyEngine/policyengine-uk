# Income-based JSA remunerative work conditions.
# Jobseekers Act 1995 s.1(2)(e): a claimant is entitled if he "is not engaged
# in remunerative work"; s.3(1)(e): the income-based conditions include that
# the claimant "is not a member of a couple the other member of which is
# engaged in remunerative work". s.1(2B)(b): in a joint claim "each member of
# the couple satisfies the conditions set out in paragraphs (a) to (c) and (e)
# to (i) of subsection (2)", and s.35(1) makes each member a claimant. A
# joint-claim couple is a couple with no child or young person for whom one
# of them gets Child Benefit (s.1(4)), at least one of whom is 18 or over and
# born after 28 October 1947 (JSA Regs 1996 reg 3A(1)).
# JSA Regs 1996 reg 51(1): remunerative work is paid work of "not less than
# 16 hours per week" for "a claimant" and "not less than 24 hours per week"
# for "any partner of the claimant". Reg 53 has no exception for carers.
#
# Hours are annual hours_worked; the weekly figure is hours_worked / 52, so
# 780 is 15 hours, 832 is 16, 1,196 is 23 and 1,248 is 24. 2025 is used
# because the model pays income-based JSA until 31 March 2026. Capital is nil.

- name: A single claimant working 15 hours a week keeps the award
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        jsa_income_reported: 3_000
        hours_worked: 780
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    jsa_remunerative_work_hours: 15
    jsa_income_eligible: true
    jsa_income: 3_000

- name: A single claimant working 16 hours a week is in remunerative work
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        jsa_income_reported: 3_000
        hours_worked: 832
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    jsa_remunerative_work_hours: 16
    jsa_income_eligible: false
    jsa_income: 0

- name: A carer claimant working 16 hours is still in remunerative work
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        jsa_income_reported: 3_000
        receives_carer_benefit: true
        hours_worked: 832
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    jsa_income_eligible: false

# A couple with a child: claimant and partner (s.3(1)(e), reg 51(1)(b)).

- name: With a child, a partner working 23 hours does not end the award
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
        is_parent: true
        jsa_income_reported: 3_000
      partner:
        age: 30
        is_claimant_or_partner: true
        is_parent: true
        hours_worked: 1_196
      child:
        age: 5
        is_claimant_or_partner: false
    benunits:
      family:
        members: [claimant, partner, child]
    households:
      household:
        members: [claimant, partner, child]
  output:
    is_jsa_joint_claim_couple: false
    jsa_income_eligible: true
    jsa_income: 3_000

- name: With a child, a partner working 24 hours ends the award
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
        is_parent: true
        jsa_income_reported: 3_000
      partner:
        age: 30
        is_claimant_or_partner: true
        is_parent: true
        hours_worked: 1_248
      child:
        age: 5
        is_claimant_or_partner: false
    benunits:
      family:
        members: [claimant, partner, child]
    households:
      household:
        members: [claimant, partner, child]
  output:
    jsa_income_eligible: false
    jsa_income: 0

- name: With a child, the claimant working 16 hours ends the award
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
        is_parent: true
        jsa_income_reported: 3_000
        hours_worked: 832
      partner:
        age: 30
        is_claimant_or_partner: true
        is_parent: true
      child:
        age: 5
        is_claimant_or_partner: false
    benunits:
      family:
        members: [claimant, partner, child]
    households:
      household:
        members: [claimant, partner, child]
  output:
    jsa_income_eligible: false

- name: With a child, a carer partner working 30 hours still ends the award
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
        is_parent: true
        jsa_income_reported: 3_000
      partner:
        age: 30
        is_claimant_or_partner: true
        is_parent: true
        receives_carer_benefit: true
        hours_worked: 1_560
      child:
        age: 5
        is_claimant_or_partner: false
    benunits:
      family:
        members: [claimant, partner, child]
    households:
      household:
        members: [claimant, partner, child]
  output:
    jsa_income_eligible: false

# A couple without children: a joint claim (s.1(2B)(b)).

- name: In a joint claim, the other member working 15 hours does not end it
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 30
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
      second:
        age: 30
        is_claimant_or_partner: true
        hours_worked: 780
    benunits:
      couple:
        members: [first, second]
    households:
      household:
        members: [first, second]
  output:
    is_jsa_joint_claim_couple: true
    jsa_income_eligible: true
    jsa_income: 3_000

- name: In a joint claim, the other member working 16 hours ends it
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 30
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
      second:
        age: 30
        is_claimant_or_partner: true
        # Under the 24 hours that would apply to a partner, but each member
        # of a joint-claim couple is a claimant.
        hours_worked: 832
    benunits:
      couple:
        members: [first, second]
    households:
      household:
        members: [first, second]
  output:
    is_jsa_joint_claim_couple: true
    jsa_income_eligible: false
    jsa_income: 0

- name: A couple entered as not a joint-claim couple use the partner's 24 hours
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 30
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
      second:
        age: 30
        is_claimant_or_partner: true
        hours_worked: 1_040
    benunits:
      couple:
        members: [first, second]
        # For example where one member claims alone (JSA Regs 1996 reg 3E).
        is_jsa_joint_claim_couple: false
    households:
      household:
        members: [first, second]
  output:
    jsa_income_eligible: true

- name: A couple born before the prescribed date are not a joint-claim couple
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        # Born in 1945, before 28 October 1947.
        age: 80
        is_claimant_or_partner: true
      second:
        age: 80
        is_claimant_or_partner: true
    benunits:
      couple:
        members: [first, second]
    households:
      household:
        members: [first, second]
  output:
    is_jsa_joint_claim_couple: false

- name: A single claimant is not a joint-claim couple
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 30
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    is_jsa_joint_claim_couple: false

- name: A couple caring for a placed child are not a joint-claim couple
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      first:
        age: 40
        is_claimant_or_partner: true
      second:
        age: 40
        is_claimant_or_partner: true
      child:
        age: 8
        is_claimant_or_partner: false
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [first, second, child]
    households:
      household:
        members: [first, second, child]
  output:
    # Reg 3A(1) excludes a couple caring for a child in the circumstances
    # of reg 78(4), which include a child placed by a local authority.
    is_jsa_joint_claim_couple: false

# Members outside the family.

- name: A non-dependent adult's own award is tested on their own work alone
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      head:
        age: 50
        is_claimant_or_partner: true
        hours_worked: 2_080
      lodger:
        age: 30
        is_claimant_or_partner: false
        jsa_income_reported: 3_000
    benunits:
      benunit:
        members: [head, lodger]
    households:
      household:
        members: [head, lodger]
  output:
    jsa_income_eligible: true
    jsa_income: 3_000

- name: A non-dependent adult's award does not rescue the claimant's
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 50
        is_claimant_or_partner: true
        jsa_income_reported: 3_000
        hours_worked: 832
      lodger:
        age: 30
        is_claimant_or_partner: false
        jsa_income_reported: 3_000
    benunits:
      benunit:
        members: [claimant, lodger]
    households:
      household:
        members: [claimant, lodger]
  output:
    jsa_income_eligible: false

# The Income Support gate reads the screened award (s.124(1)(f)).

- name: A carer's own JSA lost to 16 hours of work no longer bars Income Support
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      carer:
        age: 40
        is_claimant_or_partner: true
        receives_carer_benefit: true
        income_support_reported: 1_000
        jsa_income_reported: 3_000
        # 20 hours a week: a carer is not in remunerative work for Income
        # Support (IS Regs reg 6(4)(c)), but is for JSA.
        hours_worked: 1_040
    benunits:
      benunit:
        members: [carer]
        income_support_assessable_capital: 0
    households:
      household:
        members: [carer]
  output:
    jsa_income_eligible: false
    jsa_income: 0
    income_support_eligible: true
