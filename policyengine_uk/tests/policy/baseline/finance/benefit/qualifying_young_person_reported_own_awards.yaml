# UC reg. 5(5) and SPC reg. 4A(5) exclude own awards from both QYP routes.
# The reports identify the recipient whether receives_benefits_in_own_right
# is omitted or explicitly false. SPC reg. 4A(5) also lists income support,
# which UC reg. 5(5) does not.

- name: A 16-year-old reporting income-related ESA does not attract child additions for a parent aged 40.
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_benunit_head: true
      young_person:
        age: 16
        is_benunit_head: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
    benunits:
      benunit:
        members: [parent, young_person]
    households:
      household:
        members: [parent, young_person]
        country: ENGLAND
        rent: 0
        savings: 0
  output:
    is_before_first_september_following_16th_birthday: [false, true]
    is_qualifying_young_person_for_universal_credit: [false, false]
    is_child_or_qualifying_young_person_for_universal_credit: [false, false]
    is_qualifying_young_person_for_pension_credit: [false, false]
    is_child_or_qualifying_young_person_for_pension_credit: [false, false]
    uc_individual_child_element: [0, 0]
    uc_child_element: 0
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    is_uc_work_allowance_eligible: false
    uc_work_allowance: 0
    child_minimum_guarantee_addition: 0

