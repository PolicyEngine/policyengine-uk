# Announced higher/advanced/top freeze: Scottish Budget 2026-27, Income Tax Policy.
# https://www.gov.scot/publications/scottish-budget-2026-2027/pages/4/
# 2026 taxable limits: [0,3967,16956,31092,62430,125140]; rates19/20/21/42/45/48%.
# The first two positive limits retain the existing model CPI projection.
# Higher/advanced/top stay at31092/62430/125140 through2028-29;
# 2029-30 onward resumes the existing CPI projection from2028, without catch-up.
# Neither future rate continuity nor post-freeze CPI is a multi-year enacted rule.
# Oracles independently sum band widths x rates, with PA12570 below100k and0at150k.
# Current CPI index levels2026..2030: {2026: 1.64763, 2027: 1.68058, 2028: 1.71419, 2029: 1.74847, 2030: 1.78344}

