# tax_band for a Scottish taxpayer with savings or dividends (#2350). The
# Scottish rates charge only income that is neither savings nor dividends
# (ITA 2007 s. 11A(1A); S6M-16531 for 2025-26). Savings and dividends are the
# top slice (s. 16) and take the rates and bands they would bear outside
# Scotland (ss. 11D(6) and 13(5)). The band is the higher of the two. In
# 2025-26 the personal allowance is £12,570, the Scottish limits on taxable
# income are £2,827, £14,921, £31,092, £62,430 and £125,140 (19%, 20%, 21%,
# 42%, 45%, 48%), the basic rate limit is £37,700, the dividend allowance is
# £500 (8.75% ordinary, 33.75% upper) and the Personal Savings Allowance is
# £1,000, or £500 with higher-rate income (s. 12B). Marriage Allowance
# applies the rate conditions of s. 55B(2)(b) and the dividend counterfactual
# of s. 55B(2)(ba); savings charged at the savings nil rate leave it open.

- name: Scottish 2025 pay of 40000 and dividends of 5000 is intermediate
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 40_000
        dividend_income: 5_000
    households:
      household:
        members: [person]
        country: SCOTLAND
  output:
    # Pay: 27,430 taxable, intermediate. 2,827 x 19% + 12,094 x 20%
    # + 12,509 x 21% = 537.13 + 2,418.80 + 2,626.89 = 5,582.82.
    # Dividends: 27,430 to 32,430, below 37,700: (5,000 - 500) x 8.75%.
    tax_band: INTERMEDIATE
    meets_marriage_allowance_income_conditions: true
    earned_income_tax: 5_582.82
    dividend_income_tax: 393.75

- name: Scottish 2025 pay of 40000 and savings of 5000 is intermediate
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 40_000
        savings_interest_income: 5_000
    households:
      household:
        members: [person]
        country: SCOTLAND
  output:
    # Pay as above. Savings: 27,430 to 32,430, below 37,700, so the £1,000
    # allowance and (5,000 - 1,000) x 20% = 800. The model assigns no savings
    # to the starting rate because other taxable income exceeds £5,000
    # (s. 12).
    tax_band: INTERMEDIATE
    meets_marriage_allowance_income_conditions: true
    earned_income_tax: 5_582.82
    savings_income_tax: 800

