- name: Scottish intermediate rate recognised
  period: 2022
  absolute_error_margin: 0
  input:
    adjusted_net_income: 14650
    region: SCOTLAND
  output:
    tax_band: STARTER

- name: Scottish top rate applies at 125140 total income
  period: 2025
  absolute_error_margin: 0
  input:
    # The personal allowance is fully withdrawn at £125,140; the taxable
    # top-rate limit is £125,140 too. tax_band classification is separate
    # from the amount of income charged at 48% (see #2350).
    adjusted_net_income: 125140
    region: SCOTLAND
  output:
    # TaxBand enum uses ADDITIONAL for both Advanced (45%) and Top (48%) rates
    tax_band: ADDITIONAL

- name: Scottish income above advanced threshold
  period: 2025
  absolute_error_margin: 0
  input:
    # 100,000 income is above advanced rate threshold (62,430 above PA)
    # but below the £125,140 taxable top-rate threshold
    # PA at 100,000 is 12,570 (not yet tapered), taxable = 87,430
    adjusted_net_income: 100000
    region: SCOTLAND
  output:
    # TaxBand enum uses ADDITIONAL for both Advanced (45%) and Top (48%) rates
    tax_band: ADDITIONAL

- name: Scottish 2024 pay of 120000 has no tax at the 48 percent rate
  period: 2024
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 120000
    region: SCOTLAND
  output:
    # S6M-12252: 45% continues to £125,140 of taxable income.
    # https://www.parliament.scot/chamber-and-committees/votes-and-motions/S6M-12252
    earned_taxable_income: 117430
    earned_income_tax: 44278.31
    income_tax: 44278.31

- name: Scottish 2024 pay of 150000 has exactly 24860 taxed at 48 percent
  period: 2024
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 150000
    region: SCOTLAND
