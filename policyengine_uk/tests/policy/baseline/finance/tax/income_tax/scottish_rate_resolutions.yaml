# Scottish income tax for 2018-19 through 2021-22: pay alone, and married
# couples at the intermediate rate limit. The Scottish Parliament set each
# year's rates and limits by motion: S5M-10397, S5M-15879, S5M-21090 and
# S5M-24225, at
# https://www.parliament.scot/chamber-and-committees/votes-and-motions/<motion>
# In the motions Parliament charges each rate on "income" up to a limit. The
# taxpayer deducts the personal allowance at Step 3 and works out the tax at
# Step 4 on the income that remains (ITA 2007 s. 23), so the limits apply to
# income after the allowance. The allowance was £11,850 in 2018-19, £12,500 in
# 2019-20 and 2020-21 and £12,570 in 2021-22 (s. 35(1)). It falls by £1 for
# every £2 of income above £100,000, leaving none at £160,000 (s. 35(2)). The
# Scottish Government adds the standard allowance to the lower limits in its
# tables (gov.scot). No allowance remains at the £150,000 top (s. 35(2)), so
# its tables give the limit itself.

# 2018-19, S5M-10397: 19% to £2,000, 20% to £12,150, 21% to £31,580,
# 41% to £150,000, 46% above.

- name: Scottish 2018-19 pay of 13000 bears only the starter rate
  period: 2018
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 13_000
    region: SCOTLAND
  output:
    # 1,150 x 19% = 218.50.
    earned_taxable_income: 1_150
    income_tax: 218.50

