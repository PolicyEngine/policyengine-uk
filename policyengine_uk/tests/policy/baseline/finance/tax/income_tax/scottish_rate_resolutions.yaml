# Scottish income tax on pay alone, in the tax years whose rates and limits
# PolicyEngine/policyengine-uk#2783 corrects. Each motion sets the rates and
# limits on taxable income, above the personal allowance:
# https://www.parliament.scot/chamber-and-committees/votes-and-motions/<motion>
# Personal allowance: £11,850 (2018-19), £12,500 (2019-20 and 2020-21) and
# £12,570 (2021-22), withdrawn by £1 for every £2 of income above £100,000
# (ITA 2007 s. 35), so it is nil at £160,000. gov.scot's tables for each year
# give the same bands with that allowance added.

# 2018-19, S5M-10397: 19% to £2,000, 20% to £12,150, 21% to £31,580,
# 41% to £150,000, 46% above.

- name: Scottish 2018-19 pay of 13000 is taxed at the starter rate
  period: 2018
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 13_000
    region: SCOTLAND
  output:
    # 1,150 x 19% = 218.50.
    earned_taxable_income: 1_150
    income_tax: 218.50

- name: Scottish 2018-19 pay of 20000 reaches the basic rate
  period: 2018
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 20_000
    region: SCOTLAND
  output:
    # 2,000 x 19% + 6,150 x 20% = 380 + 1,230 = 1,610.
    earned_taxable_income: 8_150
    income_tax: 1_610

- name: Scottish 2018-19 pay of 30000 reaches the intermediate rate
  period: 2018
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 30_000
    region: SCOTLAND
  output:
