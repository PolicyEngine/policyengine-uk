    # 380 + 2,030 + 19,430 x 21% = 380 + 2,030 + 4,080.30 = 6,490.30.
    earned_taxable_income: 31_580
    income_tax: 6_490.30

- name: Scottish 2018-19 pay of 50000 reaches the 41 percent higher rate
  period: 2018
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 50_000
    region: SCOTLAND
  output:
    # The issue's case: 6,490.30 + 6,570 x 41% = 6,490.30 + 2,693.70 = 9,184.
    earned_taxable_income: 38_150
    income_tax: 9_184

- name: Scottish 2018-19 pay of 160000 reaches the 46 percent top rate
  period: 2018
  absolute_error_margin: 0.01
  input:
    age: 40
