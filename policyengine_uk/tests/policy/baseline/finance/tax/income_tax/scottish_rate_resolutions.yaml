    tax_band: [HIGHER, NONE]
    meets_marriage_allowance_income_conditions: [false, true]
    marriage_allowance: [0, 0]
    income_tax: [6_348.28, 0]

- name: Scottish 2020-21 earner with pay of 14000 and savings of 29500 can receive the Marriage Allowance
  period: 2020
  absolute_error_margin: 0.01
  input:
    people:
      earner:
        age: 40
        employment_income: 14_000
        savings_interest_income: 29_500
      spouse:
        age: 40
        employment_income: 5_000
    benunits:
      couple:
        members: [earner, spouse]
        is_married: true
    households:
      home:
        members: [earner, spouse]
        region: SCOTLAND
  output:
    # 1,500 of pay above the allowance bears the starter rate. Savings sit
    # on top (s. 16) and take the rest-of-UK bands (s. 11D(6)): 31,000 of
    # taxable income stays below the 37,500 basic rate limit, though it
    # passes the 30,930 Scottish limit, so nothing bears a higher rate.
    # Without the election the earner pays 5,285, the next case; with it,
    # 5,285 - 1,250 x 20% = 5,035.
    non_savings_income_after_allowances: [1_500, 0]
    tax_band: [BASIC, NONE]
    meets_marriage_allowance_income_conditions: [true, true]
    marriage_allowance: [1_250, 0]
    marriage_allowance_tax_reduction: [250, 0]
    income_tax: [5_035, 0]

- name: Scottish 2020-21 earner with pay of 14000 and savings of 29500 without the election pays the starter and savings basic rates
  period: 2020
  absolute_error_margin: 0.01
  input:
    people:
      earner:
        age: 40
        employment_income: 14_000
        savings_interest_income: 29_500
        would_claim_marriage_allowance: false
      spouse:
        age: 40
        employment_income: 5_000
    benunits:
      couple:
        members: [earner, spouse]
        is_married: true
    households:
      home:
        members: [earner, spouse]
        region: SCOTLAND
  output:
    # Pay: 1,500 x 19% = 285. Savings: 5,000 - 1,500 = 3,500 at the 0%
    # starting rate (s. 12), 1,000 at the savings nil rate (s. 12A, 12B(4)),
    # and 29,500 - 3,500 - 1,000 = 25,000 x 20% = 5,000.
    # With the election, the law gives 5,285 - 250 = 5,035.
    earned_income_tax: [285, 0]
    savings_income_tax: [5_000, 0]
    income_tax: [5_285, 0]
    marriage_allowance: [0, 0]
