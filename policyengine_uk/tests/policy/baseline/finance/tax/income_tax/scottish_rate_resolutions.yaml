# Married Scottish couples at the intermediate rate limit in 2018-19 to
# 2020-21. The spouse's £5,000 of pay stays below the allowance left after the
# election (ITA 2007 s. 55C(1)(c)), so the earner can receive the Marriage
# Allowance if they pay tax only at the rates s. 55B(2)(b) lists: the Scottish
# starter, basic and intermediate rates, and the starting, nil and savings
# basic rates for savings (FA 2016 s. 6(15)(a), from 2017-18). s. 55B(4)(b)
# and (5) set the transferable amount at 10% of the personal allowance,
# rounded up to £10. s. 55B(1) and (3) give the earner a tax reduction of 20%
# of it, which s. 55A(2) applies at Step 6 of s. 23, after Step 4 charges tax
# at each rate.
#
# These cases check the claim, the amount transferred, the reduction and the
# earner's income tax, and check the tax at each rate on a twin couple that
# makes no election.

# 2018-19, S5M-10397: 21% to £31,580, then 41%. Allowance £11,850: the
# spouse transfers £1,190 and keeps £10,660.

- name: Scottish 2018-19 earner at the 31580 limit can receive the Marriage Allowance
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      earner:
        age: 40
        employment_income: 43_430
      spouse:
        age: 40
        employment_income: 5_000
    benunits:
      couple:
        members: [earner, spouse]
        is_married: true
    households:
      home:
        members: [earner, spouse]
        region: SCOTLAND
  output:
    # 43,430 - 11,850 = 31,580, none of it above the intermediate rate
    # limit. Without the election the earner pays 6,490.30, the single
    # case above; with it, the law gives 6,490.30 - 1,190 x 20% = 6,252.30.
    non_savings_income_after_allowances: [31_580, 0]
    tax_band: [INTERMEDIATE, NONE]
    meets_marriage_allowance_income_conditions: [true, true]
    marriage_allowance: [1_190, 0]
    marriage_allowance_tax_reduction: [238, 0]
    income_tax: [6_252.30, 0]

- name: Scottish 2018-19 earner 1 pound above the 31580 limit cannot receive the Marriage Allowance
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      earner:
        age: 40
        employment_income: 43_431
      spouse:
        age: 40
        employment_income: 5_000
    benunits:
      couple:
        members: [earner, spouse]
        is_married: true
    households:
      home:
        members: [earner, spouse]
        region: SCOTLAND
  output:
    # 31,581 of taxable income puts 1 at the 41% higher rate, which
    # s. 55B(2)(b) does not list. 6,490.30 + 1 x 41% = 6,490.71.
    tax_band: [HIGHER, NONE]
    meets_marriage_allowance_income_conditions: [false, true]
    marriage_allowance: [0, 0]
    income_tax: [6_490.71, 0]

