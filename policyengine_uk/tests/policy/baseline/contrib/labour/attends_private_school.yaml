- name: A household situation attends no private school unless set, even at the top of the income distribution
  period: 2024
  input:
    people:
      adult:
        age: 25
      child:
        age: 10
        attends_private_school_random_draw: 0
    households:
      household:
        household_weight: 1_000_000_000
        household_market_income: 1_000_000_000
        household_benefits: 0
        members: [adult, child]
  output:
    attends_private_school: [False, False]

- name: A household situation keeps attendance it sets
  period: 2024
  input:
    people:
      adult:
        age: 25
      child:
        age: 10
        attends_private_school: true
    households:
      household:
        members: [adult, child]
  output:
    attends_private_school: [False, True]
