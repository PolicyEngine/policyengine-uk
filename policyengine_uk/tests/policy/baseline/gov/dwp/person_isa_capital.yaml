# Cash and stocks and shares ISA balances count in the holder's own benefit
# unit (#2729). An ISA has one holder, who owns its investments beneficially
# (ISA Regulations 1998 reg 4(1B)(c) and (6)(a)), and a child holds their own
# junior ISA (reg 2B). The means tests count the claimant's and partner's
# capital (WRA 2012 s 5; HB Regs 2006 reg 25; SPCA 2002 s 5; IS Regs 1987
# reg 23; JSA Regs 1996 reg 88; ESA Regs 2008 reg 83), and not a child's or
# young person's (HB reg 25(3) and 45; IS reg 23(2); JSA reg 88(2); ESA reg
# 83(2)). The household pool shares the rest of the household's capital.

- name: Case 1, a lodger's cash ISA stays out of the main benefit unit's capital.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      tenant:
        age: 30
      lodger:
        age: 30
        cash_isa_balance: 10_000
    benunits:
      tenant_unit:
        members: tenant
        would_claim_uc: false  # not on Universal Credit, which passports HB
      lodger_unit:
        members: lodger
        would_claim_uc: false
    households:
      household:
        members: [tenant, lodger]
        savings: 2_000
  output:
    cash_isa: 10_000
    cash_isa_countable_capital: [0, 10_000]
    # The pool is savings 2,000 plus cash_isa 10,000 less the lodger's
    # 10,000, shared 1,000 each by the two claimants; the lodger adds the
    # 10,000 ISA.
    uc_assessable_capital: [1_000, 11_000]
    housing_benefit_assessable_capital: [1_000, 11_000]

- name: Case 2, an adult child's stocks and shares ISA stays out of the parents' capital.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent_1:
        age: 50
      parent_2:
        age: 48
      adult_child:
        age: 25
        stocks_and_shares_isa_balance: 6_000
    benunits:
      parents:
        members: [parent_1, parent_2]
        would_claim_uc: false
      child:
        members: adult_child
        would_claim_uc: false
    households:
      household:
        members: [parent_1, parent_2, adult_child]
        savings: 9_000
  output:
    # share_like_capital is the itemised 6,000, all of it the child's ISA.
    share_like_capital: 6_000
    stocks_and_shares_isa_countable_capital: [0, 0, 6_000]
    # The pool is savings 9,000 plus share_like_capital 6,000 less the
    # child's 6,000. Three claimants share it: 6,000 to the parents and
    # 3,000 to the child, who adds the 6,000 ISA.
    uc_assessable_capital: [6_000, 9_000]
    housing_benefit_assessable_capital: [6_000, 9_000]

- name: Case 3, an adult child's ISA inside corporate wealth stays out of the parents' capital.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent_1:
        age: 50
      parent_2:
        age: 48
      adult_child:
        age: 25
        stocks_and_shares_isa_balance: 6_000
    benunits:
      parents:
        members: [parent_1, parent_2]
        would_claim_uc: false
      child:
        members: adult_child
        would_claim_uc: false
    households:
      household:
        members: [parent_1, parent_2, adult_child]
        # 3,000 of directly held shares and the child's 6,000 ISA.
        corporate_wealth: 9_000
  output:
    share_like_capital: 9_000
    # The pool is corporate wealth 9,000 less the child's 6,000 ISA: 3,000,
    # shared 2,000 to the parents and 1,000 to the child.
    uc_assessable_capital: [2_000, 7_000]
    housing_benefit_assessable_capital: [2_000, 7_000]

- name: Case 4, a parent's Income Support claim does not count an adult child's cash ISA.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 45
        income_support_reported: true
      child:
        age: 4
      adult_child:
        age: 22
        cash_isa_balance: 5_000
    benunits:
      parent_and_child:
        members: [parent, child]
        would_claim_IS: true
      adult_child:
        members: adult_child
    households:
      household:
        members: [parent, child, adult_child]
        savings: 2_000
  output:
    # The claiming benunit takes the whole pool, savings 2,000 plus cash_isa
    # 5,000 less the child's 5,000; the ISA stays with its holder.
    income_support_assessable_capital: [2_000, 5_000]

- name: Case 5, a parent's income-based JSA claim does not count an adult child's cash ISA.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 45
        jsa_income_reported: 3_000
      adult_child:
        age: 22
        cash_isa_balance: 5_000
    benunits:
      parent:
        members: parent
      adult_child:
        members: adult_child
    households:
      household:
        members: [parent, adult_child]
        savings: 2_000
  output:
    jsa_income_assessable_capital: [2_000, 5_000]

- name: Case 6, a parent's income-related ESA claim does not count an adult child's stocks and shares ISA.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 45
        esa_income_reported: 3_000
      adult_child:
        age: 22
        stocks_and_shares_isa_balance: 5_000
    benunits:
      parent:
        members: parent
        would_claim_uc: false
      adult_child:
        members: adult_child
    households:
      household:
        members: [parent, adult_child]
        savings: 2_000
  output:
    esa_income_assessable_capital: [2_000, 5_000]

- name: Case 7, a pensioner couple's Pension Credit counts their own ISAs and not a lodger's.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      pensioner_1:
        age: 70
        cash_isa_balance: 3_000
      pensioner_2:
        age: 68
        stocks_and_shares_isa_balance: 2_000
      lodger:
        age: 30
        cash_isa_balance: 6_000
    benunits:
      pensioners:
        members: [pensioner_1, pensioner_2]
      lodger:
        members: lodger
    households:
      household:
        members: [pensioner_1, pensioner_2, lodger]
        savings: 4_000
  output:
    # The pool is savings 4,000 plus cash_isa 9,000 and share_like_capital
    # 2,000 less all three balances: 4,000, shared by the two pension-age
    # adults. The couple add their own 3,000 and 2,000.
    pension_credit_assessable_capital: [9_000, 0]

- name: Case 8, a dependent child's junior ISA counts in no benefit unit.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
      child:
        age: 10
        cash_isa_balance: 3_000
        stocks_and_shares_isa_balance: 1_500
    benunits:
      family:
        members: [parent, child]
        would_claim_uc: false
    households:
      household:
        members: [parent, child]
        savings: 1_000
  output:
    is_claimant_or_partner: [true, false]
    # The pool is savings 1,000 once the child's 3,000 and 1,500 leave it.
    uc_assessable_capital: 1_000
    housing_benefit_assessable_capital: 1_000
    income_support_assessable_capital: 1_000
    jsa_income_assessable_capital: 1_000
    esa_income_assessable_capital: 1_000

- name: Case 9, a couple's own ISAs count together in their benefit unit.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        cash_isa_balance: 4_000
      partner:
        age: 33
        stocks_and_shares_isa_balance: 3_000
      lodger:
        age: 30
    benunits:
      couple:
        members: [claimant, partner]
        would_claim_uc: false
      lodger:
        members: lodger
        would_claim_uc: false
    households:
      household:
        members: [claimant, partner, lodger]
        savings: 6_000
  output:
    # Joint claimants' combined capital (WRA 2012 s 5(2)(a)): the pool of
    # savings 6,000, shared 4,000 and 2,000, plus the couple's 4,000 and
    # 3,000.
    uc_assessable_capital: [11_000, 2_000]
    housing_benefit_assessable_capital: [11_000, 2_000]

- name: Case 10, a household total above the balances keeps the rest in the pool.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      tenant:
        age: 30
      lodger:
        age: 30
        cash_isa_balance: 10_000
    benunits:
      tenant_unit:
        members: tenant
        would_claim_uc: false
      lodger_unit:
        members: lodger
        would_claim_uc: false
    households:
      household:
        members: [tenant, lodger]
        cash_isa: 15_000
  output:
    cash_isa: 15_000
    cash_isa_countable_capital: [0, 10_000]
    # The 5,000 of the total no balance explains is shared 2,500 each.
    uc_assessable_capital: [2_500, 12_500]
    housing_benefit_assessable_capital: [2_500, 12_500]

- name: Case 11, balances above the household total are scaled down to it.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      tenant:
        age: 30
        cash_isa_balance: 3_000
      lodger:
        age: 30
        cash_isa_balance: 9_000
    benunits:
      tenant_unit:
        members: tenant
        would_claim_uc: false
      lodger_unit:
        members: lodger
        would_claim_uc: false
    households:
      household:
        members: [tenant, lodger]
        cash_isa: 6_000
  output:
    # The balances add up to 12,000, twice the 6,000 total, so each counts
    # half and the pool keeps nothing.
    cash_isa_countable_capital: [1_500, 4_500]
    uc_assessable_capital: [1_500, 4_500]
    housing_benefit_assessable_capital: [1_500, 4_500]

- name: Case 12, a Universal Credit report covers its own claimant's ISA.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent_1:
        age: 50
      parent_2:
        age: 48
      adult_child:
        age: 25
        cash_isa_balance: 10_000
    benunits:
      parents:
        members: [parent_1, parent_2]
      child:
        members: adult_child
        # The child's own financial capital: the 10,000 ISA and 2,000 of
        # the household's savings.
        benunit_reported_capital: 12_000
    households:
      household:
        members: [parent_1, parent_2, adult_child]
        savings: 9_000
  output:
    # The report consumes 12,000 of the 19,000 pool, ISA included, and the
    # parents take the other 7,000.
    uc_assessable_capital: [7_000, 12_000]

- name: Case 13, a stocks and shares ISA above the UC capital limit counts for its holder only.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      tenant:
        age: 30
      lodger:
        age: 30
        stocks_and_shares_isa_balance: 34_000
    benunits:
      tenant_unit:
        members: tenant
      lodger_unit:
        members: lodger
    households:
      household:
        members: [tenant, lodger]
  output:
    # Shared by the two claimants, the ISA put 17,000 in each unit, above
    # reg 18's 16,000 limit. Now only its holder's unit counts it.
    uc_assessable_capital: [0, 34_000]
