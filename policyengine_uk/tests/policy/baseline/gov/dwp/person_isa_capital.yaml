# Cash and stocks and shares ISA balances count in the holder's own benefit
# unit (#2729). The account investor beneficially owns an ordinary ISA's
# investments, and the named child owns a junior ISA's investments (ISA
# Regulations 1998 reg 4(6)(a) and reg 2B(c)). DWP and local authorities count
# the claimant's and partner's capital (WRA 2012 s 5; HB Regs 2006 reg 25; SPCA
# 2002 s 5; IS Regs 1987 reg 23; JSA Regs 1996 reg 88; ESA Regs 2008 reg 83),
# and not a child's or young person's (HB reg 25(3) and 45; IS reg 23(2); JSA
# reg 88(2); ESA reg 83(2)). The formula subtracts the identified ISA balances
# from the household's capital, then allocates the remainder by claimant and
# partner counts, between pension-age adults for Pension Credit, or wholly to
# a unit on the IS, JSA or ESA claim path. Each programme values the pool's
# share-like holdings with expenses of sale (directly held shares, and all of
# an unitemised corporate_wealth) at market value less 10% (UC Regs 2013 reg
# 49(1)(a); HB Regs 2006 reg 47; IS Regs 1987 reg 49; JSA Regs 1996 reg 111;
# ESA Regs 2008 reg 113; SPC Regs 2002 reg 19). It counts savings, cash ISAs
# and each stocks and shares ISA balance the formula moves out of
# share_like_capital at face value: an ISA is valued at what the holder would
# get by withdrawing it, with no deduction for expenses of sale (ADM
# H1656-H1658; DMG 29662-29664, 52662, 84748-84750).

- name: Case 1, a lodger's cash ISA stays out of the main benefit unit's capital.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      tenant:
        age: 30
      lodger:
        age: 30
        cash_isa_balance: 10_000
    benunits:
      tenant_unit:
        members: tenant
        would_claim_uc: false  # not on Universal Credit, which passports HB
      lodger_unit:
        members: lodger
        would_claim_uc: false
    households:
      household:
        members: [tenant, lodger]
        savings: 2_000
  output:
    cash_isa: 10_000
    cash_isa_countable_capital: [0, 10_000]
    # The formula subtracts the lodger's 10,000 from savings 2,000 plus
    # cash_isa 10,000 and allocates the remaining 2,000 by claimant counts,
    # 1,000 to each unit; the lodger's unit adds the 10,000 ISA.
    uc_assessable_capital: [1_000, 11_000]
    housing_benefit_assessable_capital: [1_000, 11_000]

- name: Case 2, an adult child's stocks and shares ISA stays out of the parents' capital.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent_1:
        age: 50
      parent_2:
        age: 48
      adult_child:
        age: 25
        stocks_and_shares_isa_balance: 6_000
    benunits:
      parents:
        members: [parent_1, parent_2]
        would_claim_uc: false
      child:
        members: adult_child
        would_claim_uc: false
    households:
      household:
        members: [parent_1, parent_2, adult_child]
        savings: 9_000
  output:
    # share_like_capital sums the itemised 6,000, all of it the child's ISA.
    share_like_capital: 6_000
    stocks_and_shares_isa_countable_capital: [0, 0, 6_000]
    # The formula subtracts the child's 6,000 from savings 9,000 plus
    # share_like_capital 6,000 and allocates the remaining 9,000 by claimant
    # counts: 6,000 to the parents and 3,000 to the child's unit, which adds
    # the 6,000 ISA at face value.
    uc_assessable_capital: [6_000, 9_000]
    housing_benefit_assessable_capital: [6_000, 9_000]

- name: Case 3, an adult child's ISA inside corporate wealth stays out of the parents' capital.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent_1:
        age: 50
      parent_2:
        age: 48
      adult_child:
        age: 25
        stocks_and_shares_isa_balance: 6_000
    benunits:
      parents:
        members: [parent_1, parent_2]
        would_claim_uc: false
      child:
        members: adult_child
        would_claim_uc: false
    households:
      household:
        members: [parent_1, parent_2, adult_child]
        # 3,000 of directly held shares and the child's 6,000 ISA.
        corporate_wealth: 9_000
  output:
    share_like_capital: 9_000
    # The formula subtracts the child's 6,000 ISA from corporate wealth
    # 9,000, values the remaining 3,000 less 10% at 2,700 and allocates it:
    # 1,800 to the parents and 900 to the child's unit, which adds the 6,000
    # ISA at face value.
    uc_assessable_capital: [1_800, 6_900]
    housing_benefit_assessable_capital: [1_800, 6_900]

- name: Case 4, a parent's Income Support claim does not count an adult child's cash ISA.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 45
        income_support_reported: true
      child:
        age: 4
      adult_child:
        age: 22
        cash_isa_balance: 5_000
    benunits:
      parent_and_child:
        members: [parent, child]
        would_claim_IS: true
      adult_child:
        members: adult_child
    households:
      household:
        members: [parent, child, adult_child]
        savings: 2_000
  output:
    # The formula subtracts the adult child's 5,000 from savings 2,000 plus
    # cash_isa 5,000 and gives the claiming benunit the whole 2,000
    # remainder; the ISA counts in its holder's unit.
    income_support_assessable_capital: [2_000, 5_000]

- name: Case 5, a parent's income-based JSA claim does not count an adult child's cash ISA.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 45
        jsa_income_reported: 3_000
      adult_child:
        age: 22
        cash_isa_balance: 5_000
    benunits:
      parent:
        members: parent
      adult_child:
        members: adult_child
    households:
      household:
        members: [parent, adult_child]
        savings: 2_000
  output:
    jsa_income_assessable_capital: [2_000, 5_000]

- name: Case 6, a parent's income-related ESA claim does not count an adult child's stocks and shares ISA.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 45
        esa_income_reported: 3_000
      adult_child:
        age: 22
        stocks_and_shares_isa_balance: 5_000
    benunits:
      parent:
        members: parent
        would_claim_uc: false
      adult_child:
        members: adult_child
    households:
      household:
        members: [parent, adult_child]
        savings: 2_000
  output:
    # The parent's claiming unit takes the 2,000 of savings; the child's unit
    # counts the 5,000 ISA at face value.
    esa_income_assessable_capital: [2_000, 5_000]

- name: Case 7, a pensioner couple's Pension Credit counts their own ISAs and not a lodger's.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      pensioner_1:
        age: 70
        cash_isa_balance: 3_000
      pensioner_2:
        age: 68
        stocks_and_shares_isa_balance: 2_000
      lodger:
        age: 30
        cash_isa_balance: 6_000
    benunits:
      pensioners:
        members: [pensioner_1, pensioner_2]
      lodger:
        members: lodger
    households:
      household:
        members: [pensioner_1, pensioner_2, lodger]
        savings: 4_000
  output:
    # The formula subtracts all three balances from savings 4,000, cash_isa
    # 9,000 and share_like_capital 2,000, and allocates the remaining 4,000
    # between the two pension-age adults. The couple's unit adds their own
    # 3,000 cash ISA and 2,000 stocks and shares ISA at face value.
    pension_credit_assessable_capital: [9_000, 0]

- name: Case 8, a dependent child's junior ISA counts in no benefit unit.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
      child:
        age: 10
        cash_isa_balance: 3_000
        stocks_and_shares_isa_balance: 1_500
    benunits:
      family:
        members: [parent, child]
        would_claim_uc: false
    households:
      household:
        members: [parent, child]
        savings: 1_000
  output:
    is_claimant_or_partner: [true, false]
    # The formula subtracts the child's 3,000 and 1,500, leaving savings of
    # 1,000 in the pool.
    uc_assessable_capital: 1_000
    housing_benefit_assessable_capital: 1_000
    income_support_assessable_capital: 1_000
    jsa_income_assessable_capital: 1_000
    esa_income_assessable_capital: 1_000

- name: Case 9, a couple's own ISAs count together in their benefit unit.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 35
        cash_isa_balance: 4_000
      partner:
        age: 33
        stocks_and_shares_isa_balance: 3_000
      lodger:
        age: 30
    benunits:
      couple:
        members: [claimant, partner]
        would_claim_uc: false
      lodger:
        members: lodger
        would_claim_uc: false
    households:
      household:
        members: [claimant, partner, lodger]
        savings: 6_000
  output:
    # Joint claimants' combined capital (WRA 2012 s 5(2)(a)): the formula
    # allocates savings of 6,000 by claimant counts, 4,000 to the couple and
    # 2,000 to the lodger, and the couple's unit adds their 4,000 cash ISA
    # and the 3,000 stocks and shares ISA at face value.
    uc_assessable_capital: [11_000, 2_000]
    housing_benefit_assessable_capital: [11_000, 2_000]

- name: Case 10, a household total above the balances keeps the rest in the pool.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      tenant:
        age: 30
      lodger:
        age: 30
        cash_isa_balance: 10_000
    benunits:
      tenant_unit:
        members: tenant
        would_claim_uc: false
      lodger_unit:
        members: lodger
        would_claim_uc: false
    households:
      household:
        members: [tenant, lodger]
        cash_isa: 15_000
  output:
    cash_isa: 15_000
    cash_isa_countable_capital: [0, 10_000]
    # The formula allocates the 5,000 of the total that no balance explains
    # by claimant counts, 2,500 to each unit.
    uc_assessable_capital: [2_500, 12_500]
    housing_benefit_assessable_capital: [2_500, 12_500]

- name: Case 11, the model scales balances above the household total down to it.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      tenant:
        age: 30
        cash_isa_balance: 3_000
      lodger:
        age: 30
        cash_isa_balance: 9_000
    benunits:
      tenant_unit:
        members: tenant
        would_claim_uc: false
      lodger_unit:
        members: lodger
        would_claim_uc: false
    households:
      household:
        members: [tenant, lodger]
        cash_isa: 6_000
  output:
    # The balances sum to 12,000, twice the 6,000 total, so the model counts
    # half of each, and the formula leaves nothing in the pool.
    cash_isa_countable_capital: [1_500, 4_500]
    uc_assessable_capital: [1_500, 4_500]
    housing_benefit_assessable_capital: [1_500, 4_500]

- name: Case 12, a Universal Credit report covers its own claimant's ISA.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent_1:
        age: 50
      parent_2:
        age: 48
      adult_child:
        age: 25
        cash_isa_balance: 10_000
    benunits:
      parents:
        members: [parent_1, parent_2]
      child:
        members: adult_child
        # The child's own financial capital: the 10,000 ISA and 2,000 of
        # the household's savings.
        benunit_reported_capital: 12_000
    households:
      household:
        members: [parent_1, parent_2, adult_child]
        savings: 9_000
  output:
    # The formula subtracts the 12,000 report from the 19,000 pool, ISA
    # included, and allocates the other 7,000 to the parents.
    uc_assessable_capital: [7_000, 12_000]

- name: Case 13, a stocks and shares ISA above the UC capital limit counts for its holder only.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      tenant:
        age: 30
      lodger:
        age: 30
        stocks_and_shares_isa_balance: 30_600
    benunits:
      tenant_unit:
        members: tenant
      lodger_unit:
        members: lodger
    households:
      household:
        members: [tenant, lodger]
  output:
    # The ISA of 30,600 exceeds reg 18's 16,000 limit. Pooling it would give
    # each claimant 15,300, within the limit. The formula attributes it to
    # its holder.
    uc_assessable_capital: [0, 30_600]

# Cases 14 to 17: where balances exceed a household total, the model counts
# exactly the total, so a holder at a capital limit or a tariff threshold
# stays on its boundary. In Cases 14 and 15 the stocks and shares total is the
# boundary itself, since a stocks and shares ISA counts at face value.
# The model stores amounts in float32 (spacing 0.0009765625 at 16,000), and
# absolute_error_margin 0 fails on one unit in the last place.

- name: Case 14, an ISA above its household total counts exactly 16,000 at UC's capital limit.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      cash_holder:
        age: 30
        cash_isa_balance: 16_790
      stocks_holder:
        age: 30
        stocks_and_shares_isa_balance: 18_567
    benunits:
      cash_unit:
        members: cash_holder
        would_claim_uc: false
        would_claim_IS: false
      stocks_unit:
        members: stocks_holder
        would_claim_uc: false
        would_claim_IS: false
    households:
      cash_home:
        members: cash_holder
        cash_isa: 16_000
      stocks_home:
        members: stocks_holder
        stocks_and_shares_isa: 16_000
  output:
    cash_isa_countable_capital: [16_000, 0]
    stocks_and_shares_isa_countable_capital: [0, 16_000]
    # WRA 2012 s 5(1)(a) requires capital not greater than the amount reg
    # 18(1)(a) prescribes, 16,000, so capital of exactly 16,000 keeps
    # entitlement. Reg 72(1) deems 4.35 a month for each 250 above 6,000:
    # 40 steps, 2,088 a year.
    uc_assessable_capital: [16_000, 16_000]
    is_uc_eligible: [true, true]
    uc_tariff_income: [2_088, 2_088]

- name: Case 15, an ISA above its household total counts exactly 6,000 at UC's tariff threshold.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      cash_holder:
        age: 30
        cash_isa_balance: 8_341
      stocks_holder:
        age: 30
        stocks_and_shares_isa_balance: 8_341
    benunits:
      cash_unit:
        members: cash_holder
        would_claim_uc: false
        would_claim_IS: false
      stocks_unit:
        members: stocks_holder
        would_claim_uc: false
        would_claim_IS: false
    households:
      cash_home:
        members: cash_holder
        cash_isa: 6_000
      stocks_home:
        members: stocks_holder
        stocks_and_shares_isa: 6_000
  output:
    cash_isa_countable_capital: [6_000, 0]
    stocks_and_shares_isa_countable_capital: [0, 6_000]
    # Reg 72(1) deems no income from capital of 6,000 or less.
    uc_assessable_capital: [6_000, 6_000]
    uc_tariff_income: [0, 0]

- name: Case 16, a holder at the total leaves an unrelated couple nothing in every working-age test.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      holder:
        age: 30
        cash_isa_balance: 16_790
      partner_1:
        age: 30
      partner_2:
        age: 30
    benunits:
      holder_unit:
        members: holder
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        in_receipt_of_guarantee_credit: false
        in_receipt_of_savings_credit_only: false
        housing_benefit_on_passporting_benefit: false
      couple:
        members: [partner_1, partner_2]
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        in_receipt_of_guarantee_credit: false
        in_receipt_of_savings_credit_only: false
        housing_benefit_on_passporting_benefit: false
    households:
      household:
        members: [holder, partner_1, partner_2]
        cash_isa: 16_000
  output:
    # The holder counts the whole 16,000, so the formula leaves exactly
    # nothing in the pool for the couple.
    cash_isa_countable_capital: [16_000, 0, 0]
    uc_assessable_capital: [16_000, 0]
    housing_benefit_assessable_capital: [16_000, 0]
    income_support_assessable_capital: [16_000, 0]
    jsa_income_assessable_capital: [16_000, 0]
    esa_income_assessable_capital: [16_000, 0]

- name: Case 17, a pension-age holder at the total counts exactly 10,000 in Pension Credit.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      holder:
        age: 70
        cash_isa_balance: 16_450
      partner_1:
        age: 70
      partner_2:
        age: 70
    benunits:
      holder_unit:
        members: holder
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        in_receipt_of_guarantee_credit: false
        in_receipt_of_savings_credit_only: false
        housing_benefit_on_passporting_benefit: false
      couple:
        members: [partner_1, partner_2]
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        in_receipt_of_guarantee_credit: false
        in_receipt_of_savings_credit_only: false
        housing_benefit_on_passporting_benefit: false
    households:
      household:
        members: [holder, partner_1, partner_2]
        cash_isa: 10_000
  output:
    cash_isa_countable_capital: [10_000, 0, 0]
    pension_credit_assessable_capital: [10_000, 0]
    # SPC Regs 2002 reg 15(6) deems 1 a week for each 500 above 10,000, so
    # capital of exactly 10,000 deems nothing.
    pension_credit_deemed_income: [0, 0]
    housing_benefit_assessable_capital: [10_000, 0]

- name: Case 18, a stocks and shares ISA counts no more than the share-like capital that includes it.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      holder:
        age: 30
        stocks_and_shares_isa_balance: 1_000
    benunits:
      holder_unit:
        members: holder
        would_claim_uc: false
        would_claim_IS: false
    households:
      household:
        members: holder
        stocks_and_shares_isa: 1_000
        # The formulas count share-like capital, and an input or reform can
        # set it below the ISA total.
        share_like_capital: 100
  output:
    stocks_and_shares_isa_countable_capital: 100
    # UC counts the 100 at face value.
    uc_assessable_capital: 100

- name: Case 19, a child's ISA counts in no unit when the parent reports the family's capital.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
      child:
        age: 10
        cash_isa_balance: 10_000
      lodger:
        age: 30
    benunits:
      family:
        members: [parent, child]
        # The parent's own capital: nothing.
        benunit_reported_capital: 0
      lodger_unit:
        members: lodger
    households:
      household:
        members: [parent, child, lodger]
  output:
    # The formula takes the report as the claimant's and partner's capital
    # and subtracts the child's 10,000 ISA from the pool, so the lodger's unit
    # counts none of it.
    uc_assessable_capital: [0, 0]

- name: Case 20, a UC report keeps the inherited override, so the part of a reporter's ISA above the report stays in the pool.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      holder_1:
        age: 30
        cash_isa_balance: 1
      other_1:
        age: 30
      holder_2:
        age: 30
        cash_isa_balance: 1
      other_2:
        age: 30
      holder_3:
        age: 30
        cash_isa_balance: 10_000
      other_3:
        age: 30
      holder_4:
        age: 30
        cash_isa_balance: 10_000
      other_4:
        age: 30
    benunits:
      holder_unit_1:
        members: holder_1
        benunit_reported_capital: 0
      other_unit_1:
        members: other_1
      holder_unit_2:
        members: holder_2
        uc_reported_capital: 0
      other_unit_2:
        members: other_2
      holder_unit_3:
        members: holder_3
        benunit_reported_capital: 0
      other_unit_3:
        members: other_3
      holder_unit_4:
        members: holder_4
        benunit_reported_capital: 6_000
      other_unit_4:
        members: other_4
    households:
      household_1:
        members: [holder_1, other_1]
      household_2:
        members: [holder_2, other_2]
      household_3:
        members: [holder_3, other_3]
      household_4:
        members: [holder_4, other_4]
  output:
    # The formula leaves a reporting unit's own ISA in the pool and
    # subtracts only the reported amount, so the unit without a report
    # counts the rest of the household's capital.
    uc_assessable_capital: [0, 1, 0, 1, 0, 10_000, 6_000, 4_000]

- name: Case 21, a Pension Credit report replaces the reporting unit's capital and shares none of it.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      holder_1:
        age: 70
        cash_isa_balance: 10_000
      other_1:
        age: 70
      holder_2:
        age: 70
        cash_isa_balance: 10_000
      other_2:
        age: 70
    benunits:
      holder_unit_1:
        members: holder_1
        pension_credit_reported_capital: 0
      other_unit_1:
        members: other_1
      holder_unit_2:
        members: holder_2
        pension_credit_reported_capital: 6_000
      other_unit_2:
        members: other_2
    households:
      household_1:
        members: [holder_1, other_1]
      household_2:
        members: [holder_2, other_2]
  output:
    # The formula subtracts the holder's ISA from the pool and replaces the
    # holder's unit's capital with the report, so the other pension-age unit
    # counts none of the ISA.
    pension_credit_assessable_capital: [0, 0, 6_000, 0]
