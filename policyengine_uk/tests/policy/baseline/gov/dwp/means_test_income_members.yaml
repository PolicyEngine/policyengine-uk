# Means tests count the income of the claimant and any partner and, as the
# model did before, of the programme's own children or young persons. A member
# who is none of these (for example an 18- or 19-year-old presumed to be the
# claimant's child but not in education) does not count.

- name: An earning 18-year-old who is neither partner nor dependant does not reduce the parent's UC
  # Default inputs: the 18-year-old is presumed the parent's child, is not in
  # education (so not a UC qualifying young person) and is not a claimant.
  # UC is the same as for the parent and the 10-year-old alone (next case).
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      parent:
        age: 40
      young_adult:
        age: 18
        employment_income: 15_000
      child:
        age: 10
    benunits:
      benunit:
        members: [parent, young_adult, child]
    households:
      household:
        members: [parent, young_adult, child]
  output:
    is_claimant_or_partner: [true, false, false]
    uc_earned_income: 0
    universal_credit: 9_321.36

- name: The same parent and child without the 18-year-old
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      parent:
        age: 40
      child:
        age: 10
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    universal_credit: 9_321.36

- name: A 17-year-old outside education is not a UC young person, so their pay does not count
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      parent:
        age: 40
      teenager:
        age: 17
        current_education: NOT_IN_EDUCATION
        employment_income: 5_000
      child:
        age: 10
    benunits:
      benunit:
        members: [parent, teenager, child]
    households:
      household:
        members: [parent, teenager, child]
  output:
    is_child_or_qualifying_young_person_for_universal_credit: [false, false, true]
    is_claimant_or_partner: [true, false, false]
    uc_earned_income: 0

- name: A non-dependant 19-year-old's pay is not the claimant's income under any legacy means test
  # The claimant earns 10,000 and a 19-year-old presumed their child (not in
  # education, so not a young person) earns 15,000. Every applicable income
  # equals the claimant-alone case below.
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      claimant:
        age: 40
        employment_income: 10_000
      young_adult:
        age: 19
        employment_income: 15_000
    benunits:
      benunit:
        members: [claimant, young_adult]
    households:
      household:
        members: [claimant, young_adult]
  output:
    is_claimant_or_partner: [true, false]
    housing_benefit_applicable_income: 9_655.42
    income_support_applicable_income: 9_740
    tax_credits_applicable_income: 10_000
    council_tax_reduction_applicable_income: 10_000
    uc_earned_income: 10_000

- name: The same claimant alone
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      claimant:
        age: 40
        employment_income: 10_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    housing_benefit_applicable_income: 9_655.42
    income_support_applicable_income: 9_740
    tax_credits_applicable_income: 10_000
    council_tax_reduction_applicable_income: 10_000
    uc_earned_income: 10_000

- name: A non-member's hours do not earn the claimant the HB worker disregard
  # HB Sch 4 para 17 tests the claimant's or partner's work. The 19-year-old
  # (not in education, presumed the claimant's child, not a young person)
  # works 35 hours; only the single-claimant disregard applies, as for the
  # claimant alone.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
      young_adult:
        age: 19
        weekly_hours: 35
        employment_income: 15_000
    benunits:
      benunit:
        members: [claimant, young_adult]
    households:
      household:
        members: [claimant, young_adult]
  output:
    is_claimant_or_partner: [true, false]
    housing_benefit_applicable_income_disregard: 344.58

- name: The same claimant alone gets the same HB disregard
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    housing_benefit_applicable_income_disregard: 344.58
