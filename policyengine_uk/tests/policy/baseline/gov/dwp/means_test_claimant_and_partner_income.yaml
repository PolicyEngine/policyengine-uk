# Means tests assess the income of the claimant and any partner only: not of
# children or young persons, and not of other members of the benefit unit
# (UC Regs 2013 reg 22; HB Regs 2006 reg 25; IS Regs 1987 reg 23; TCA 2002
# s.7; CTR (Prescribed Requirements) (England) Regs 2012 Sch 1 para 11).

- name: An earning 18-year-old who is neither partner nor dependant does not reduce the parent's UC
  # Default inputs: the 18-year-old is presumed the parent's child, is not in
  # education (so not a UC qualifying young person) and is not a claimant.
  # UC is the same as for the parent and the 10-year-old alone (next case).
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      parent:
        age: 40
      young_adult:
        age: 18
        employment_income: 15_000
      child:
        age: 10
    benunits:
      benunit:
        members: [parent, young_adult, child]
    households:
      household:
        members: [parent, young_adult, child]
  output:
    is_claimant_or_partner: [true, false, false]
    uc_earned_income: 0
    universal_credit: 9_321.36

- name: The same parent and child without the 18-year-old
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      parent:
        age: 40
      child:
        age: 10
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    universal_credit: 9_321.36

- name: A qualifying young person's earnings are not UC income
  # UC reg 22 deducts the claimant's earned income only.
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      parent:
        age: 40
      student:
        age: 17
        current_education: UPPER_SECONDARY
        employment_income: 5_000
      child:
        age: 10
    benunits:
      benunit:
        members: [parent, student, child]
    households:
      household:
        members: [parent, student, child]
  output:
    is_child_or_qualifying_young_person_for_universal_credit: [false, true, true]
    uc_earned_income: 0

- name: A non-dependant 19-year-old's pay is not the claimant's income under any legacy means test
  # The claimant earns 10,000 and a 19-year-old presumed their child (not in
  # education, so not a young person) earns 15,000. Every applicable income
  # equals the claimant-alone case below.
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      claimant:
        age: 40
        employment_income: 10_000
      young_adult:
        age: 19
        employment_income: 15_000
    benunits:
      benunit:
        members: [claimant, young_adult]
    households:
      household:
        members: [claimant, young_adult]
  output:
    is_claimant_or_partner: [true, false]
    housing_benefit_applicable_income: 9_655.42
    income_support_applicable_income: 9_740
    tax_credits_applicable_income: 10_000
    council_tax_reduction_applicable_income: 10_000
    uc_earned_income: 10_000

- name: The same claimant alone
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      claimant:
        age: 40
        employment_income: 10_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    housing_benefit_applicable_income: 9_655.42
    income_support_applicable_income: 9_740
    tax_credits_applicable_income: 10_000
    council_tax_reduction_applicable_income: 10_000
    uc_earned_income: 10_000
