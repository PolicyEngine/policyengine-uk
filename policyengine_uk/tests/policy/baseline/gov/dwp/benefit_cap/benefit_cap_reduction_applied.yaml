# The benefit cap reduction reported is the amount taken off the awards.
#
# UC Regs 2013 reg 81: the reduction is "the excess" less the childcare costs
# element, and reg 81 has no nil floor of its own, so it can exceed the award
# before the cap (uc_benefit_cap_reduction). WRA 2012 s 96(2) reduces
# entitlement "by an amount up to or equalling the excess": the award goes to
# nil and no lower, so the amount removed is the smaller of the two
# (uc_benefit_cap_reduction_after_floor). Deductions come out of what the cap
# leaves (UC etc. (Claims and Payments) Regs 2013 Sch 6 para 3(1)(a) keeps a
# penny payable). DWP's benefit cap statistics count UC households by "an
# amount the payment has been capped by", and benefit_cap_reduction reports
# that amount. HB Regs 2006 reg 75D(2) already limits the Housing Benefit
# reduction to the award less the reg 75 minimum (50 pence a week).
#
# The award before the cap and the capped total are entered. Annual limits
# outside London (UC reg 80A(2)(b)(ii), HB reg 75CA(2)(b)(ii)): couple
# 22,020; single without children 14,753.

- name: Case 1, a reg 81 amount above the award takes the award to nil and reports the award.
  # Excess 30,000 - 22,020 = 7,980; no childcare costs element. The award
  # before the cap is 100, so 100 is removed.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 100
        benefit_cap_welfare_benefits: 30_000
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_uc_benefit_cap_exempt: false
    uc_benefit_cap: 22_020
    uc_benefit_cap_reduction: 7_980
    uc_benefit_cap_reduction_after_floor: 100
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 100
    universal_credit: 0

- name: Case 2, an award equal to the reg 81 amount is removed in full.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 7_980
        benefit_cap_welfare_benefits: 30_000
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    uc_benefit_cap_reduction: 7_980
    uc_benefit_cap_reduction_after_floor: 7_980
    benefit_cap_reduction: 7_980
    universal_credit: 0

- name: Case 3, an award above the reg 81 amount loses exactly that amount.
  # 10,000 - 7,980 = 2,020 paid.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 10_000
        benefit_cap_welfare_benefits: 30_000
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    uc_benefit_cap_reduction: 7_980
    uc_benefit_cap_reduction_after_floor: 7_980
    benefit_cap_reduction: 7_980
    universal_credit: 2_020

- name: Case 4, the childcare costs element offsets the excess and the award still bounds the rest.
  # Reg 81(1): 7,980 - 3,000 = 4,980, above the 100 award.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 100
        benefit_cap_welfare_benefits: 30_000
        uc_childcare_element: 3_000
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    uc_benefit_cap_reduction: 4_980
    uc_benefit_cap_reduction_after_floor: 100
    benefit_cap_reduction: 100
    universal_credit: 0

- name: Case 5, a childcare costs element above the excess leaves the family uncapped.
  # Reg 81(2): no reduction where the childcare costs element exceeds the
  # excess, so the family is not counted as capped.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 100
        benefit_cap_welfare_benefits: 30_000
        uc_childcare_element: 9_000
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    uc_benefit_cap_reduction: 0
    uc_benefit_cap_reduction_after_floor: 0
    benefit_cap_reduction: 0
    universal_credit: 100

- name: Case 6, an award the cap takes to nil has no deductions, and the cap reduction reported is still the award.
  # Deductions come out of what the cap leaves, which is nothing.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 100
        benefit_cap_welfare_benefits: 30_000
        uc_deduction_rate: 0.25
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    uc_deductions: 0
    uc_benefit_cap_reduction: 7_980
    uc_benefit_cap_reduction_after_floor: 100
    benefit_cap_reduction: 100
    universal_credit: 0

- name: Case 7, deductions from what the cap leaves do not change the cap reduction reported.
  # The cap takes 7,980 of 10,000, leaving 2,020. Deductions are 25% of the
  # couple's standard allowance (628.10 a month x 12 = 7,537.20), so
  # 0.25 x 7,537.20 = 1,884.30, within the 2,020 less a penny a month. Paid:
  # 2,020 - 1,884.30 = 135.70.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 30
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 10_000
        benefit_cap_welfare_benefits: 30_000
        uc_deduction_rate: 0.25
    households:
      household:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    uc_standard_allowance: 7_537.20
    uc_deductions: 1_884.30
    uc_benefit_cap_reduction_after_floor: 7_980
    benefit_cap_reduction: 7_980
    universal_credit: 135.70

- name: Case 8, a Housing Benefit reduction is bounded by the award less the reg 75 minimum.
  # Excess 25,000 - 14,753 = 10,247, above the 5,000 award; HB reg 75D(2)
  # leaves 0.50 x 52 = 26, so 4,974 is removed.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
        universal_credit_pre_benefit_cap: 0
        housing_benefit_pre_benefit_cap: 5_000
        benefit_cap_welfare_benefits: 25_000
        working_tax_credit: 0
    households:
      household:
        members: [claimant]
        region: NORTH_EAST
  output:
    housing_benefit_benefit_cap: 14_753
    housing_benefit_benefit_cap_reduction: 4_974
    uc_benefit_cap_reduction: 0
    benefit_cap_reduction: 4_974
