# The benefits the cap counts.
#
# UC Regs 2013 reg 80(1): "the amount of a welfare benefit to be used when
# determining total entitlement to welfare benefits is the amount to which the
# single person or couple is entitled". HB Regs 2006 reg 75A: "the total amount
# of welfare benefits to which— (a) where the claimant is a member of a couple,
# each member of the couple is or jointly are entitled; or (b) in any other
# case, the claimant is entitled". Welfare benefits: Welfare Reform Act 2012
# s.96(10).
#
# 2025-26 single cap outside London: 14,753 (UC reg 80A(2)). A non-dependent
# adult (30, not in education, neither claimant nor partner) claims their own
# benefits, which the family's cap does not count. Families live in the North
# East; benefit amounts are set directly.

- name: A non-dependent adult's income-related ESA is not in the family's capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      adult:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 20_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    esa_income: 5_000
    claimant_or_partner_esa_income: 0
    benefit_cap_welfare_benefits: 20_000
    is_uc_benefit_cap_exempt: false
    is_housing_benefit_benefit_cap_exempt: false
    # UC reg 81: max(20,000 - 14,753 - 0 childcare, 0) = 5,247.
    # The adult's 5,000 is theirs, not the family's; there is no HB award.
    uc_benefit_cap_reduction: 5_247
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 5_247
    universal_credit: 14_753

- name: A non-dependent adult's contributory ESA, JSA, incapacity benefit and SDA are not in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      adult:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_contrib_reported: 2_000
        jsa_contrib_reported: 2_000
        incapacity_benefit_reported: 2_000
        sda: 2_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    benefit_cap_welfare_benefits: 18_000
    is_uc_benefit_cap_exempt: false
    is_housing_benefit_benefit_cap_exempt: false
    # UC reg 81: max(18,000 - 14,753 - 0 childcare, 0) = 3,247.
    uc_benefit_cap_reduction: 3_247
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 3_247
    universal_credit: 14_753

- name: The claimant's own contributory JSA is in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        jsa_contrib_reported: 3_000
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 15_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    benefit_cap_welfare_benefits: 18_000
    # UC reg 81: max(15,000 + 3,000 - 14,753 - 0 childcare, 0) = 3,247.
    uc_benefit_cap_reduction: 3_247
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 3_247
    universal_credit: 11_753

- name: A non-dependent adult's income-based JSA does not reduce the family's Housing Benefit
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      adult:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        jsa_income_reported: 6_000
    benunits:
      family:
        members: [claimant, adult]
        would_claim_uc: false
        would_claim_housing_benefit: true
        housing_benefit_pre_benefit_cap: 9_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    claimant_or_partner_jsa_income: 0
    benefit_cap_welfare_benefits: 9_000
    # HB reg 75D: min(max(9,000 - 14,753, 0), 9,000 - 0.50 * 52) = 0.
    # No UC award: UC reg 78(1) gives no UC reduction.
    uc_benefit_cap_reduction: 0
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 0
    housing_benefit: 9_000

- name: The claimant's own income-based JSA reduces their Housing Benefit
  period: 2025
  input:
    people:
      claimant:
        age: 40
        jsa_income_reported: 6_000
    benunits:
      family:
        members: [claimant]
        would_claim_uc: false
        would_claim_housing_benefit: true
        housing_benefit_pre_benefit_cap: 9_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    claimant_or_partner_jsa_income: 6_000
    benefit_cap_welfare_benefits: 15_000
    # HB reg 75D: min(9,000 + 6,000 - 14,753, 9,000 - 0.50 * 52) = 247.
    # HB left = 9,000 - 247 = 8,753, above the reg 75 minimum of 26/year.
    uc_benefit_cap_reduction: 0
    housing_benefit_benefit_cap_reduction: 247
    benefit_cap_reduction: 247
    housing_benefit: 8_753

# Whose benefits: the couple of the scheme whose award the family has
# (benefit_cap_couple). For a family on Universal Credit, its claimants
# (is_uc_claimant, or the claimant and partner unless entered; UC Regs 2013
# regs 78(2), 80(1)); otherwise Housing Benefit's claimant and partner (HB
# Regs 2006 reg 75A). Here the second adult is entered as a Universal Credit
# claimant but is not the Housing Benefit partner. An input entered for one
# person takes its default for the others, so both claimants are entered.

- name: On Universal Credit, an entered joint claimant's own contributory JSA is in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        is_uc_claimant: true
      adult:
        age: 30
        is_claimant_or_partner: false
        is_uc_claimant: true
        current_education: NOT_IN_EDUCATION
        jsa_contrib_reported: 2_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 25_000
        housing_benefit_pre_benefit_cap: 0
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    is_uc_assessed_claimant: [true, true]
    # Joint claimants outside London: 22,020 (UC Regs 2013 reg 80A(2)(d)(i)).
    is_uc_benefit_cap_single_claimant_rate: false
    uc_benefit_cap: 22_020
    benefit_cap_welfare_benefits: 27_000
    # 25,000 + 2,000 - 22,020, less a childcare element of 0 (reg 81).
    uc_benefit_cap_reduction: 4_980
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 4_980

- name: On Universal Credit, an entered joint claimant's own income-based JSA is in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        is_uc_claimant: true
      adult:
        age: 30
        is_claimant_or_partner: false
        is_uc_claimant: true
        current_education: NOT_IN_EDUCATION
        jsa_income_reported: 2_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 25_000
        housing_benefit_pre_benefit_cap: 0
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    jsa_income: 2_000
    claimant_or_partner_jsa_income: 0
    uc_benefit_cap: 22_020
    benefit_cap_welfare_benefits: 27_000
    # 25,000 + 2,000 - 22,020, less a childcare element of 0 (reg 81).
    uc_benefit_cap_reduction: 4_980
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 4_980

- name: On Housing Benefit alone, the same adult's contributory JSA is not in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        is_uc_claimant: true
      adult:
        age: 30
        is_claimant_or_partner: false
        is_uc_claimant: true
        current_education: NOT_IN_EDUCATION
        jsa_contrib_reported: 2_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 0
        housing_benefit_pre_benefit_cap: 15_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    # The adult is not the claimant's partner (HB Regs 2006 reg 75A), so
    # the single rate (reg 75CA(2)) and none of the adult's benefits:
    # 15,000 - 14,753, which leaves more than reg 75's 50p a week.
    housing_benefit_benefit_cap: 14_753
    benefit_cap_welfare_benefits: 15_000
    uc_benefit_cap_reduction: 0
    housing_benefit_benefit_cap_reduction: 247
    benefit_cap_reduction: 247

# The rate's couple: is_couple (relation_type, which can be entered), unless,
# for Universal Credit, the entered claimants of the award are other members
# (is_uc_benefit_cap_single_claimant_rate). Housing Benefit reads its own
# claimant and partner (is_housing_benefit_benefit_cap_single_claimant_rate).

- name: On Housing Benefit alone, a couple entered as such has the couple limit though the model would presume the younger member a child
  period: 2025
  input:
    people:
      claimant:
        age: 40
      partner:
        age: 18
        current_education: NOT_IN_EDUCATION
    benunits:
      family:
        members: [claimant, partner]
        relation_type: COUPLE
        universal_credit_pre_benefit_cap: 0
        housing_benefit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_claimant_or_partner: [true, false]
    is_couple: true
    # A couple outside London: 22,020 (HB Regs 2006 reg 75CA(2)), as
    # relation_type gives (is_single_person).
    is_housing_benefit_benefit_cap_single_claimant_rate: false
    housing_benefit_benefit_cap: 22_020
    benefit_cap_reduction: 0

- name: On Universal Credit, a couple entered as such has the couple limit when no claimant is entered
  period: 2025
  input:
    people:
      claimant:
        age: 40
      partner:
        age: 18
        current_education: NOT_IN_EDUCATION
    benunits:
      family:
        members: [claimant, partner]
        relation_type: COUPLE
        universal_credit_pre_benefit_cap: 18_000
        housing_benefit_pre_benefit_cap: 0
    households:
      home:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_couple: true
    # Joint claimants outside London: 22,020 (UC Regs 2013 reg 80A(2)(d)(i)).
    is_uc_benefit_cap_single_claimant_rate: false
    uc_benefit_cap: 22_020
    benefit_cap_reduction: 0

# Parliament lists Maternity Allowance among the welfare benefits whose
# total the Secretary of State may cap by regulations (WRA 2012 s.96(1),
# (10)(i)). The woman entitled to it receives it (SSCBA 1992 s.35(1)), so DWP
# and councils count the allowance of a claimant or partner and leave out
# that of a non-dependent adult in the household. Under UC Regs 2013 reg
# 80(4) and HB Regs 2006 reg 75C(4) they use the amount they count as income.
# DWP counts it in full as unearned income (reg 66(1)(b)(viii)), and councils
# disregard none of it under HB Regs 2006 reg 40 and Schedule 5.

- name: DWP counts the claimant's own Maternity Allowance in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 30
        maternity_allowance_reported: 3_000
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 15_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    maternity_allowance: 3_000
    benefit_cap_welfare_benefits: 18_000
    # A woman can become entitled to Maternity Allowance from the 11th week
    # before the expected week of confinement (SSCBA 1992 s.35(1)(a)), so DWP
    # can pay it to a woman with no child yet. DWP applies the limit for a
    # single claimant with no child outside London, 14,753 (UC Regs 2013 reg
    # 80A(2)(c)). Under reg 81 it reduces her Universal Credit by max(15,000 +
    # 3,000 - 14,753 - 0 childcare, 0) = 3,247 and pays 15,000 - 3,247 =
    # 11,753.
    uc_benefit_cap: 14_753
    uc_benefit_cap_reduction: 3_247
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 3_247
    universal_credit: 11_753

- name: DWP counts a partner's Maternity Allowance in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 32
      partner:
        age: 30
        maternity_allowance_reported: 4_000
    benunits:
      family:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 20_000
    households:
      home:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_uc_assessed_claimant: [true, true]
    maternity_allowance: [0, 4_000]
    benefit_cap_welfare_benefits: 24_000
    # DWP applies the limit for joint claimants outside London, 22,020 (UC
    # Regs 2013 reg 80A(2)(d)(i)). Under reg 81 it reduces their Universal
    # Credit by max(20,000 + 4,000 - 22,020 - 0 childcare, 0) = 1,980 and
    # pays 20,000 - 1,980 = 18,020.
    uc_benefit_cap: 22_020
    uc_benefit_cap_reduction: 1_980
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 1_980
    universal_credit: 18_020

- name: DWP leaves a non-dependent adult's Maternity Allowance out of the family's capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      adult:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        maternity_allowance_reported: 5_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 20_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    maternity_allowance: [0, 5_000]
    benefit_cap_welfare_benefits: 20_000
    # Under UC reg 81 DWP reduces the claimant's Universal Credit by
    # max(20,000 - 14,753 - 0 childcare, 0) = 5,247. The adult receives the
    # 5,000 in their own right.
    uc_benefit_cap_reduction: 5_247
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 5_247
    universal_credit: 14_753

- name: A council counts the claimant's own Maternity Allowance when it caps Housing Benefit for a family without Universal Credit
  period: 2025
  input:
    people:
      claimant:
        age: 30
        maternity_allowance_reported: 6_000
    benunits:
      family:
        members: [claimant]
        would_claim_uc: false
        would_claim_housing_benefit: true
        housing_benefit_pre_benefit_cap: 9_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    universal_credit_pre_benefit_cap: 0
    benefit_cap_welfare_benefits: 15_000
    # The council applies the limit for a single claimant outside London,
    # 14,753 (HB Regs 2006 reg 75CA(2)(c)). Under reg 75D it reduces her
    # Housing Benefit by min(9,000 + 6,000 - 14,753, 9,000 - 0.50 * 52) = 247
    # and pays 9,000 - 247 = 8,753. She has no Universal Credit award for DWP
    # to reduce (UC reg 78(1)).
    housing_benefit_benefit_cap: 14_753
    uc_benefit_cap_reduction: 0
    housing_benefit_benefit_cap_reduction: 247
    benefit_cap_reduction: 247
    housing_benefit: 8_753

# Issue #2784's family through the whole Universal Credit award, 2026-27: a
# lone parent of 30 with children of 1, 4 and 7 renting privately for 1,500 a
# month in Tyneside, the North East's default Broad Rental Market Area.
#
# Universal Credit before the cap, monthly (DWP, Benefit and pension rates
# 2026 to 2027):
#   standard allowance, single 25 or over         424.90
#   child element, 3 x 303.94 (SI 2026/148 Sch 13; Parliament revoked
#     reg 24A, the two-child limit, from 6 April 2026 through the Universal
#     Credit (Removal of Two Child Limit) Act 2026 s.1(3)(a))  911.82
#   housing costs element: the lower of the rent, 1,500, and the cap rent
#     (UC Regs 2013 Sch 4 para 22), the three-bedroom rate of 650.00 (DWP,
#     Universal Credit LHA monthly rates 2026 to 2027, Tyneside): one bedroom
#     for the parent, one for two children under 10, one for the third child
#     (Sch 4 para 10(1)(a), (d), (f))             650.00
#   maximum amount                               1,986.72, or 23,840.64 a year
# less Maternity Allowance in full (reg 66(1)(b)(viii)), so 23,840.64 - 6,000
# = 17,840.64 a year.
#
# Child Benefit: (27.05 + 2 x 17.90) x 52 = 3,268.20 a year (Child Benefit
# (Rates) Regulations 2006 reg 2(1), as the Treasury set the rates through SI
# 2026/232 art. 2).
# DWP applies the family limit of 22,020 (reg 80A(2)(d)(ii)) and grants no
# exception.

- name: DWP takes the excess over the cap off the issue 2784 family's Universal Credit when it has no Maternity Allowance
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      child1:
        age: 1
      child2:
        age: 4
      child3:
        age: 7
    benunits:
      family:
        members: [parent, child1, child2, child3]
    households:
      home:
        members: [parent, child1, child2, child3]
        region: NORTH_EAST
        brma: TYNESIDE
        tenure_type: RENT_PRIVATELY
        rent: 18_000
  output:
    uc_standard_allowance: 5_098.80
    uc_child_element: 10_941.84
    uc_housing_costs_element: 7_800
    universal_credit_pre_benefit_cap: 23_840.64
    child_benefit: 3_268.20
    # 23,840.64 + 3,268.20 = 27,108.84.
    benefit_cap_welfare_benefits: 27_108.84
    uc_benefit_cap: 22_020
    is_uc_benefit_cap_exempt: false
    # Under reg 81 DWP reduces the award by 27,108.84 - 22,020 - 0 childcare
    # = 5,088.84 and pays 23,840.64 - 5,088.84 = 18,751.80.
    uc_benefit_cap_reduction: 5_088.84
    universal_credit: 18_751.80

- name: DWP takes the issue 2784 family's Maternity Allowance off its capped Universal Credit pound for pound
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        maternity_allowance_reported: 6_000
      child1:
        age: 1
      child2:
        age: 4
      child3:
        age: 7
    benunits:
      family:
        members: [parent, child1, child2, child3]
    households:
      home:
        members: [parent, child1, child2, child3]
        region: NORTH_EAST
        brma: TYNESIDE
        tenure_type: RENT_PRIVATELY
        rent: 18_000
  output:
    uc_maximum_amount: 23_840.64
    uc_unearned_income: 6_000
    universal_credit_pre_benefit_cap: 17_840.64
    # 17,840.64 + 3,268.20 Child Benefit + 6,000 Maternity Allowance
    # = 27,108.84, the same total as without the allowance.
    benefit_cap_welfare_benefits: 27_108.84
    # Under reg 81 DWP reduces the award by 27,108.84 - 22,020 - 0 childcare
    # = 5,088.84 and pays 17,840.64 - 5,088.84 = 12,751.80. With the
    # allowance the family keeps 12,751.80 + 6,000 = 18,751.80, the same as
    # it keeps from Universal Credit alone without it.
    uc_benefit_cap_reduction: 5_088.84
    universal_credit: 12_751.80

# Each of the next three cases holds the award before the cap fixed, so the
# total and the reduction follow from the Maternity Allowance alone.

- name: DWP counts the claimant's Maternity Allowance award, not the amount she reported
  period: 2025
  input:
    people:
      claimant:
        age: 30
        maternity_allowance_reported: 999
        maternity_allowance: 3_000
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 15_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # DWP counts her 3,000 award (UC Regs 2013 reg 80(1), (4)): 15,000 +
    # 3,000.
    benefit_cap_welfare_benefits: 18_000
    uc_benefit_cap: 14_753
    # Under reg 81 DWP reduces her Universal Credit by max(18,000 - 14,753
    # - 0 childcare, 0) = 3,247 and pays 15,000 - 3,247 = 11,753.
    uc_benefit_cap_reduction: 3_247
    universal_credit: 11_753

