# The benefits the cap counts.
#
# UC Regs 2013 reg 80(1): "the amount of a welfare benefit to be used when
# determining total entitlement to welfare benefits is the amount to which the
# single person or couple is entitled". HB Regs 2006 reg 75A: "the total amount
# of welfare benefits to which— (a) where the claimant is a member of a couple,
# each member of the couple is or jointly are entitled; or (b) in any other
# case, the claimant is entitled". Welfare benefits: Welfare Reform Act 2012
# s.96(10).
#
# 2025-26 single cap outside London: 14,753 (UC reg 80A(2)). A non-dependent
# adult (30, not in education, neither claimant nor partner) claims their own
# benefits, which the family's cap does not count. Families live in the North
# East; benefit amounts are set directly.

- name: A non-dependent adult's income-related ESA is not in the family's capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      adult:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_income_reported: 5_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 20_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    esa_income: 5_000
    claimant_or_partner_esa_income: 0
    benefit_cap_welfare_benefits: 20_000
    is_uc_benefit_cap_exempt: false
    is_housing_benefit_benefit_cap_exempt: false
    # UC reg 81: max(20,000 - 14,753 - 0 childcare, 0) = 5,247.
    # The adult's 5,000 is theirs, not the family's; there is no HB award.
    uc_benefit_cap_reduction: 5_247
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 5_247
    universal_credit: 14_753

- name: A non-dependent adult's contributory ESA, JSA, incapacity benefit and SDA are not in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      adult:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        esa_contrib_reported: 2_000
        jsa_contrib_reported: 2_000
        incapacity_benefit_reported: 2_000
        sda: 2_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    benefit_cap_welfare_benefits: 18_000
    is_uc_benefit_cap_exempt: false
    is_housing_benefit_benefit_cap_exempt: false
    # UC reg 81: max(18,000 - 14,753 - 0 childcare, 0) = 3,247.
    uc_benefit_cap_reduction: 3_247
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 3_247
    universal_credit: 14_753

- name: The claimant's own contributory JSA is in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        jsa_contrib_reported: 3_000
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 15_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    benefit_cap_welfare_benefits: 18_000
    # UC reg 81: max(15,000 + 3,000 - 14,753 - 0 childcare, 0) = 3,247.
    uc_benefit_cap_reduction: 3_247
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 3_247
    universal_credit: 11_753

- name: A non-dependent adult's income-based JSA does not reduce the family's Housing Benefit
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      adult:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        jsa_income_reported: 6_000
    benunits:
      family:
        members: [claimant, adult]
        would_claim_uc: false
        would_claim_housing_benefit: true
        housing_benefit_pre_benefit_cap: 9_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    claimant_or_partner_jsa_income: 0
    benefit_cap_welfare_benefits: 9_000
    # HB reg 75D: min(max(9,000 - 14,753, 0), 9,000 - 0.50 * 52) = 0.
    # No UC award: UC reg 78(1) gives no UC reduction.
    uc_benefit_cap_reduction: 0
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 0
    housing_benefit: 9_000

- name: The claimant's own income-based JSA reduces their Housing Benefit
  period: 2025
  input:
    people:
      claimant:
        age: 40
        jsa_income_reported: 6_000
    benunits:
      family:
        members: [claimant]
        would_claim_uc: false
        would_claim_housing_benefit: true
        housing_benefit_pre_benefit_cap: 9_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    claimant_or_partner_jsa_income: 6_000
    benefit_cap_welfare_benefits: 15_000
    # HB reg 75D: min(9,000 + 6,000 - 14,753, 9,000 - 0.50 * 52) = 247.
    # HB left = 9,000 - 247 = 8,753, above the reg 75 minimum of 26/year.
    uc_benefit_cap_reduction: 0
    housing_benefit_benefit_cap_reduction: 247
    benefit_cap_reduction: 247
    housing_benefit: 8_753

# Whose benefits: the couple of the scheme whose award the family has
# (benefit_cap_couple). For a family on Universal Credit, its claimants
# (is_uc_claimant, or the claimant and partner unless entered; UC Regs 2013
# regs 78(2), 80(1)); otherwise Housing Benefit's claimant and partner (HB
# Regs 2006 reg 75A). Here the second adult is entered as a Universal Credit
# claimant but is not the Housing Benefit partner. An input entered for one
# person takes its default for the others, so both claimants are entered.

- name: On Universal Credit, an entered joint claimant's own contributory JSA is in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        is_uc_claimant: true
      adult:
        age: 30
        is_claimant_or_partner: false
        is_uc_claimant: true
        current_education: NOT_IN_EDUCATION
        jsa_contrib_reported: 2_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 25_000
        housing_benefit_pre_benefit_cap: 0
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    is_uc_assessed_claimant: [true, true]
    # Joint claimants outside London: 22,020 (UC Regs 2013 reg 80A(2)(d)(i)).
    is_uc_benefit_cap_single_claimant_rate: false
    uc_benefit_cap: 22_020
    benefit_cap_welfare_benefits: 27_000
    # 25,000 + 2,000 - 22,020, less a childcare element of 0 (reg 81).
    uc_benefit_cap_reduction: 4_980
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 4_980

- name: On Universal Credit, an entered joint claimant's own income-based JSA is in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        is_uc_claimant: true
      adult:
        age: 30
        is_claimant_or_partner: false
        is_uc_claimant: true
        current_education: NOT_IN_EDUCATION
        jsa_income_reported: 2_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 25_000
        housing_benefit_pre_benefit_cap: 0
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    jsa_income: 2_000
    claimant_or_partner_jsa_income: 0
    uc_benefit_cap: 22_020
    benefit_cap_welfare_benefits: 27_000
    # 25,000 + 2,000 - 22,020, less a childcare element of 0 (reg 81).
    uc_benefit_cap_reduction: 4_980
    housing_benefit_benefit_cap_reduction: 0
    benefit_cap_reduction: 4_980

- name: On Housing Benefit alone, the same adult's contributory JSA is not in the capped total
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        is_uc_claimant: true
      adult:
        age: 30
        is_claimant_or_partner: false
        is_uc_claimant: true
        current_education: NOT_IN_EDUCATION
        jsa_contrib_reported: 2_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 0
        housing_benefit_pre_benefit_cap: 15_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    # The adult is not the claimant's partner (HB Regs 2006 reg 75A), so
    # the single rate (reg 75CA(2)) and none of the adult's benefits:
    # 15,000 - 14,753, which leaves more than reg 75's 50p a week.
    housing_benefit_benefit_cap: 14_753
    benefit_cap_welfare_benefits: 15_000
    uc_benefit_cap_reduction: 0
    housing_benefit_benefit_cap_reduction: 247
    benefit_cap_reduction: 247

# The rate's couple: is_couple (relation_type, which can be entered), unless,
# for Universal Credit, the entered claimants of the award are other members
# (is_uc_benefit_cap_single_claimant_rate). Housing Benefit reads its own
# claimant and partner (is_housing_benefit_benefit_cap_single_claimant_rate).

- name: On Housing Benefit alone, a couple entered as such has the couple limit though the model would presume the younger member a child
  period: 2025
  input:
    people:
      claimant:
        age: 40
      partner:
        age: 18
        current_education: NOT_IN_EDUCATION
    benunits:
      family:
        members: [claimant, partner]
        relation_type: COUPLE
        universal_credit_pre_benefit_cap: 0
        housing_benefit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_claimant_or_partner: [true, false]
    is_couple: true
    # A couple outside London: 22,020 (HB Regs 2006 reg 75CA(2)), as
    # relation_type gives (is_single_person).
    is_housing_benefit_benefit_cap_single_claimant_rate: false
    housing_benefit_benefit_cap: 22_020
    benefit_cap_reduction: 0

- name: On Universal Credit, a couple entered as such has the couple limit when no claimant is entered
  period: 2025
  input:
    people:
      claimant:
        age: 40
      partner:
        age: 18
        current_education: NOT_IN_EDUCATION
    benunits:
      family:
        members: [claimant, partner]
        relation_type: COUPLE
        universal_credit_pre_benefit_cap: 18_000
        housing_benefit_pre_benefit_cap: 0
    households:
      home:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_couple: true
    # Joint claimants outside London: 22,020 (UC Regs 2013 reg 80A(2)(d)(i)).
    is_uc_benefit_cap_single_claimant_rate: false
    uc_benefit_cap: 22_020
    benefit_cap_reduction: 0
