# The benefit cap's earnings exception (UC Regs 2013 reg 82(1)(a)) tests "the
# claimant's earned income or, if the claimant is a member of a couple, the
# couple's combined earned income". Earned income is Universal Credit's
# (reg 52): statutory sick, maternity and paternity pay are employed earnings
# (reg 55(4)), and the deductions are the person's own relievable pension
# contributions and the income tax and primary Class 1 contributions paid "in
# respect of the employment" (reg 55(5)). Income the minimum income floor
# treats a person as having does not count (reg 82(4)). The threshold is the
# model's 10,152 a year (issue #1986). Each family is a single claimant aged 40
# outside London with an entered award of 18,000 before the cap, so the cap
# of 14,753 takes 3,247 unless an exception applies.
# Sources: https://www.legislation.gov.uk/uksi/2013/376/regulation/55
# https://www.legislation.gov.uk/uksi/2013/376/regulation/82
# https://www.gov.uk/guidance/rates-and-thresholds-for-employers-2026-to-2027
# The existing model threshold is retained here; 11,000 and 10,000 also lie
# above and below the 2026 NLW-based threshold of 10,574.72 respectively.

- name: Statutory sick pay is earned income for the earnings exception
  period: 2026
  input:
    age: 40
    employment_income: 3_000
    statutory_sick_pay: 8_000
    universal_credit_pre_benefit_cap: 18_000
    region: NORTH_EAST
  output:
    uc_individual_earned_income_before_mif: 11_000
    is_benefit_cap_exempt_earnings: true
    benefit_cap_reduction: 0

- name: Statutory paternity pay is earned income for the earnings exception
  period: 2026
  input:
    age: 40
    employment_income: 3_000
    statutory_paternity_pay: 8_000
    universal_credit_pre_benefit_cap: 18_000
    region: NORTH_EAST
  output:
    uc_individual_earned_income_before_mif: 11_000
    is_benefit_cap_exempt_earnings: true
    benefit_cap_reduction: 0

- name: Statutory maternity pay is earned income for the earnings exception
  period: 2026
  input:
    people:
      claimant:
        age: 40
        employment_income: 3_000
        statutory_maternity_pay: 8_000
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # 3,000 + 8,000 = 11,000, under the personal allowance and the primary
    # threshold, so no tax or NI: 11,000 >= 10,152. Without the maternity
    # pay the wages alone, 3,000, are under the threshold.
    uc_individual_earned_income_before_mif: 11_000
    is_benefit_cap_exempt_earnings: true
    is_benefit_cap_exempt: true
    benefit_cap_reduction: 0

- name: Tax on a private pension does not come off the earnings the exception tests
  period: 2026
  input:
    people:
      claimant:
        age: 40
        employment_income: 11_000
        private_pension_income: 10_000
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # Income tax is (21,000 - 12,570) x 20% = 1,686, all of it on the
    # pension: the wages are the lowest slice and the personal allowance
    # covers them, so none is in respect of the employment (reg 55(5)(b)).
    # No NI on 11,000. 11,000 >= 10,152. Netting the 1,686 off the wages
    # would give 9,314, under the threshold.
    income_tax: 1_686
    uc_income_tax_on_earnings: 0
    uc_individual_earned_income_before_mif: 11_000
    is_benefit_cap_exempt_earnings: true
    benefit_cap_reduction: 0

- name: Relievable pension contributions come off the earnings the exception tests
  period: 2026
  input:
    people:
      claimant:
        age: 40
        employment_income: 11_000
        employee_pension_contributions: 1_000
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # Reg 55(5)(a): 11,000 - 1,000 = 10,000, with no tax or NI, is under
    # 10,152. The cap applies: 18,000 - 14,753 = 3,247.
    uc_individual_earned_income_before_mif: 10_000
    is_benefit_cap_exempt_earnings: false
    is_benefit_cap_exempt: false
    benefit_cap_reduction: 3_247

- name: The minimum income floor does not create an earnings exception
  period: 2026
  input:
    age: 40
    self_employment_income: 5_000
    uc_mif_applies: true
    uc_minimum_income_floor: 20_000
    universal_credit_pre_benefit_cap: 18_000
    region: NORTH_EAST
  output:
    uc_individual_earned_income_before_mif: 5_000
    uc_individual_earned_income: 20_000
    is_benefit_cap_exempt_earnings: false
    benefit_cap_reduction: 3_247
