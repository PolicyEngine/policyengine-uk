# --- #1986 counterexample ---

- name: A partner's voluntary Class 3 does not remove the couple's exception
  # London couple, four children, private rent 36,000, 2025-26. One partner
  # earns 10,300; the other has no earnings and pays 923 of Class 3. Earned
  # income is 10,300 >= 846 x 12 = 10,152, so the cap does not apply. Before
  # #1986 the model deducted the partner's Class 3 and capped the award.
  period: 2025
  input:
    people:
      earner:
        age: 35
        employment_income: 10_300
      partner:
        age: 35
        ni_class_3: 923
      child1:
        age: 3
      child2:
        age: 5
      child3:
        age: 8
      child4:
        age: 10
    benunits:
      benunit:
        members: [earner, partner, child1, child2, child3, child4]
        would_claim_uc: true
    households:
      household:
        members: [earner, partner, child1, child2, child3, child4]
        region: LONDON
        brma: INNER_NORTH_LONDON
        tenure_type: RENT_PRIVATELY
        rent: 36_000
  output:
    benefit_cap_earned_income: 10_300
    is_uc_entitled: true
    is_benefit_cap_exempt_earnings: true
    benefit_cap_reduction: 0

# --- The exception is for Universal Credit only ---

- name: Earnings over the UC threshold do not except a Housing Benefit award
  # Reg. 82 applies "to an award of universal credit". A Housing Benefit
  # claimant with no UC and no Working Tax Credit has no earnings exception
  # (HB Regs 2006 reg. 75E needs entitlement to WTC). 2024-25: 9,600 is over
  # the UC threshold of 793 x 12 = 9,516, but the family cap still applies.
  period: 2024
  input:
    people:
      parent:
        age: 40
        employment_income: 9_600
        hours_worked: 416
        housing_benefit_reported: 100
      child1:
        age: 8
      child2:
        age: 6
      child3:
        age: 4
      child4:
        age: 2
    benunits:
      benunit:
        members: [parent, child1, child2, child3, child4]
        would_claim_uc: false
        would_claim_housing_benefit: true
        working_tax_credit: 0
    households:
      household:
        members: [parent, child1, child2, child3, child4]
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 36_000
  output:
    # 9,600 >= 793 x 12 = 9,516: the reg. 82 income test is met.
    benefit_cap_earned_income: 9_600
    universal_credit_pre_benefit_cap: 0
    is_benefit_cap_exempt_earnings: false
    is_benefit_cap_exempt: false
    benefit_cap: 25_323

# --- Miscellaneous income: one definition for the award and the cap ---

- name: Miscellaneous income counts as earned for the cap, as it does for the award
  # The UC award counts miscellaneous_income as earned income
  # (uc_individual_earned_income_before_mif), and the cap shares that
  # definition. In the FRS the input mixes paid work, which is earned (reg.
  # 52(a)(iii)), with royalties, trust income and overseas pensions, which
  # reg. 66(1) treats as unearned; PolicyEngine/policyengine-uk#1961 tracks
  # the split. This case pins today's shared treatment, so the #1961 fix
  # moves the award and the cap together. 11,000 is under the personal
  # allowance and carries no NI.
  period: 2026
  input:
    people:
      person:
        age: 30
        miscellaneous_income: 11_000
  output:
    uc_earned_income_before_work_allowance: 11_000
    benefit_cap_earned_income: 11_000
    is_benefit_cap_exempt_earnings: true
