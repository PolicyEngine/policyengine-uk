# Universal Credit benefit cap earnings exception, UC Regs 2013 reg. 82.
# https://www.legislation.gov.uk/uksi/2013/376/regulation/82
#
# (1)(a): the cap does not apply where "the claimant's earned income or, if
# the claimant is a member of a couple, the couple's combined earned income"
# is at least the pay for 16 hours a week at the reg. 4 National Minimum
# Wage Regulations rate (the national living wage), times 52 and divided by
# 12. Reg. 6(1A)(za) disregards a fraction of a pound in that amount. Before
# 1 April 2017 the amount was 430 a month. The monthly amounts are the
# parameter gov.dwp.benefit_cap_earnings_exemption.
# (4): earned income excludes income treated as earned under reg. 62 (the
# minimum income floor).
# The exception applies "to an award of universal credit": it does not except
# a Housing Benefit award (HB Regs 2006 reg. 75E). Cases with no Housing
# Benefit test the income test through is_benefit_cap_exempt_earnings.
# Earned income is net of the person's own income tax, NI and relievable
# pension contributions on their earnings (regs. 55(5), 57(2)); Class 3 is not
# on earnings. In 2025-26 and 2026-27 the personal allowance and the primary
# threshold are both 12,570 a year. In the earlier years tested here the
# earnings are below both.

# --- Threshold: 16 x national living wage x 52 / 12, whole pounds ---

- name: 2016-17 earnings of 5,160 meet the 430 a month threshold
  # Reg. 82(1)(a) as made; S.I. 2017/138 substituted the hours formula
  # from 1 April 2017.
  # 430 x 12 = 5,160; "equal to or exceeds".
  period: 2016
  input:
    people:
      person:
        age: 30
        employment_income: 5160
  output:
    benefit_cap_earned_income: 5160
    is_benefit_cap_exempt_earnings: true

- name: 2016-17 earnings of 5,159 fall short of the 430 a month threshold
  period: 2016
  input:
    people:
      person:
        age: 30
        employment_income: 5159
  output:
    benefit_cap_earned_income: 5159
    is_benefit_cap_exempt_earnings: false

- name: 2017-18 earnings of 6,240 meet the 520 a month threshold
  # National living wage 7.50: 7.50 x 16 x 52 / 12 = 520.00.
  # 520 x 12 = 6,240; "equal to or exceeds".
  period: 2017
  input:
    people:
      person:
        age: 30
        employment_income: 6240
  output:
    benefit_cap_earned_income: 6240
    is_benefit_cap_exempt_earnings: true

- name: 2017-18 earnings of 6,239 fall short of the 520 a month threshold
  period: 2017
  input:
    people:
      person:
        age: 30
        employment_income: 6239
  output:
    benefit_cap_earned_income: 6239
    is_benefit_cap_exempt_earnings: false

- name: 2018-19 earnings of 6,504 meet the 542 a month threshold
  # National living wage 7.83: 7.83 x 16 x 52 / 12 = 542.88, rounded
  # down to 542 (reg. 6(1A)(za)).
  # 542 x 12 = 6,504; "equal to or exceeds".
  period: 2018
  input:
    people:
      person:
        age: 30
        employment_income: 6504
  output:
    benefit_cap_earned_income: 6504
    is_benefit_cap_exempt_earnings: true

- name: 2018-19 earnings of 6,503 fall short of the 542 a month threshold
  period: 2018
  input:
    people:
      person:
        age: 30
        employment_income: 6503
  output:
    benefit_cap_earned_income: 6503
    is_benefit_cap_exempt_earnings: false

- name: 2019-20 earnings of 6,828 meet the 569 a month threshold
  # National living wage 8.21: 8.21 x 16 x 52 / 12 = 569.23, rounded
  # down to 569.
  # 569 x 12 = 6,828; "equal to or exceeds".
  period: 2019
  input:
    people:
      person:
        age: 30
        employment_income: 6828
  output:
    benefit_cap_earned_income: 6828
    is_benefit_cap_exempt_earnings: true

- name: 2019-20 earnings of 6,827 fall short of the 569 a month threshold
  period: 2019
  input:
    people:
      person:
        age: 30
        employment_income: 6827
  output:
    benefit_cap_earned_income: 6827
    is_benefit_cap_exempt_earnings: false

- name: 2023-24 earnings of 8,664 meet the 722 a month threshold
  # National living wage 10.42 (S.I. 2023/354): 10.42 x 16 x 52 / 12 =
  # 722.45, rounded down to 722. GOV.UK gave 722 for 2023-24.
  # 722 x 12 = 8,664; "equal to or exceeds".
  period: 2023
  input:
    people:
      person:
        age: 30
        employment_income: 8664
  output:
    benefit_cap_earned_income: 8664
    is_benefit_cap_exempt_earnings: true

- name: 2023-24 earnings of 8,663 fall short of the 722 a month threshold
  period: 2023
  input:
    people:
      person:
        age: 30
        employment_income: 8663
  output:
    benefit_cap_earned_income: 8663
    is_benefit_cap_exempt_earnings: false

- name: The threshold uses the national living wage whatever the claimant's age
  # Reg. 82(1)(a) refers to the reg. 4 rate, not the claimant's own rate. A
  # claimant aged 19 earning 10,572 meets the 2026-27 threshold of 881 x 12.
  period: 2026
  input:
    people:
      person:
        age: 19
        employment_income: 10_572
  output:
    benefit_cap_earned_income: 10_572
    is_benefit_cap_exempt_earnings: true

# --- Earned income at the threshold ---

- name: Earnings of 10,573 meet the 2026-27 threshold after rounding
  # 10,573 >= 10,572. Without the whole-pound rounding the threshold would be
  # 10,574.72 and the exception would not apply.
  period: 2026
  input:
    people:
      person:
        age: 30
        employment_income: 10_573
  output:
    benefit_cap_earned_income: 10_573
    is_benefit_cap_exempt_earnings: true

- name: Earnings exactly at the 2026-27 threshold meet it
  # "equal to or exceeds": 10,572 >= 10,572.
  period: 2026
  input:
    people:
      person:
        age: 30
        employment_income: 10_572
  output:
    benefit_cap_earned_income: 10_572
    is_benefit_cap_exempt_earnings: true

- name: Earnings of 10,571 fall short of the 2026-27 threshold
  period: 2026
  input:
    people:
      person:
        age: 30
        employment_income: 10_571
  output:
    benefit_cap_earned_income: 10_571
    is_benefit_cap_exempt_earnings: false

- name: Earned income is net of the person's income tax and NI on the earnings
  # Tax (14,000 - 12,570) x 20% = 286; Class 1 (14,000 - 12,570) x 8% =
  # 114.40; 14,000 - 286 - 114.40 = 13,599.60.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        employment_income: 14_000
  output:
    benefit_cap_earned_income: 13_599.60
    is_benefit_cap_exempt_earnings: true

- name: Pension contributions are deducted from earned income
  # Reg. 55(5)(a): 11,500 - 1,000 = 10,500 < 10,572.
  period: 2026
  input:
    people:
      person:
        age: 30
        employment_income: 11_500
        employee_pension_contributions: 1_000
  output:
    benefit_cap_earned_income: 10_500
    is_benefit_cap_exempt_earnings: false

- name: Pension contributions paid at 74 are deducted
  # Under 75 the contribution is relievable (Finance Act 2004 s. 188(3)(a)):
  # 11,000 - 1,000 = 10,000. No NI is due over State Pension age.
  period: 2026
  input:
    people:
      person:
        age: 74
        employment_income: 11_000
        employee_pension_contributions: 1_000
  output:
    benefit_cap_earned_income: 10_000

- name: Pension contributions paid at 75 are not deducted
  # Finance Act 2004 s. 188(3)(a): contributions paid once the person has
  # reached 75 are not relievable,
  # so reg. 55(5)(a) does not deduct them. 11,000 is under the personal
  # allowance and no NI is due over State Pension age, so earned income is
  # 11,000.
  period: 2026
  input:
    people:
      person:
        age: 75
        employment_income: 11_000
        employee_pension_contributions: 1_000
  output:
    benefit_cap_earned_income: 11_000

- name: Voluntary Class 3 contributions are not deducted
  period: 2026
  input:
    people:
      person:
        age: 30
        employment_income: 10_600
        ni_class_3: 900
  output:
    benefit_cap_earned_income: 10_600
    is_benefit_cap_exempt_earnings: true

- name: Tax on the person's property income is not deducted from their earnings
  # Earnings are the lowest slice of income and sit inside the personal
  # allowance, so the tax on earnings is nil.
  period: 2026
  input:
    people:
      person:
        age: 30
        employment_income: 10_600
        property_income: 40_000
  output:
    benefit_cap_earned_income: 10_600
    is_benefit_cap_exempt_earnings: true

- name: A partner's tax on property income does not reduce the couple's earned income
  period: 2026
  input:
    people:
      earner:
        age: 30
        employment_income: 10_600
      partner:
        age: 30
        property_income: 40_000
    benunits:
      benunit:
        members: [earner, partner]
  output:
    benefit_cap_earned_income: 10_600
    is_benefit_cap_exempt_earnings: true

- name: A couple's earned income is combined
  # Reg. 82(1)(a): 6,000 + 6,000 = 12,000 >= 10,572.
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 6_000
      person2:
        age: 30
        employment_income: 6_000
    benunits:
      benunit:
        members: [person1, person2]
  output:
    benefit_cap_earned_income: 12_000
    is_benefit_cap_exempt_earnings: true

- name: Income treated as earned under the minimum income floor does not count
  # Reg. 82(4). Profits of 3,000 are below the Class 4 lower profits limit, so
  # earned income is 3,000; the floor (35 x 12.71 x 52 = 23,132.20 gross)
  # counts for the award but not for the exception.
  period: 2026
  input:
    people:
      person:
        age: 30
        self_employment_income: 3_000
        uc_is_in_startup_period: false
  output:
    uc_mif_applies: true
    benefit_cap_earned_income: 3_000
    is_benefit_cap_exempt_earnings: false

- name: Earnings of 5,200 in 2016-17 meet the 430 a month threshold
  period: 2016
  input:
    people:
      person:
        age: 30
        employment_income: 5_200
  output:
    is_benefit_cap_exempt_earnings: true

