# Universal Credit Regulations 2013 reg. 83(1): "The benefit cap does not apply
# in relation to any assessment period where— (a) the LCWRA element is included
# in the award of universal credit or the claimant is receiving an employment
# and support allowance that includes the support component; ... (f) a
# claimant, or a child or qualifying young person for whom a claimant is
# responsible, is receiving disability living allowance; ... (g) a claimant,
# or a qualifying young person for whom a claimant is responsible, is
# receiving personal independence payment; ... (i) a claimant, or a qualifying
# young person for whom a claimant is responsible, is entitled to carer's
# allowance; ... (j) the carer element is included in the award of universal
# credit".
# The LCWRA element and the carer element are included only for a claimant
# (regs 27(1) and 29(1)).

- name: A claimant with LCWRA is exempt, the LCWRA element being in the award (reg. 83(1)(a))
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
        uc_limited_capability_for_WRA: true
      child:
        age: 10
    benunits:
      benunit:
        members: [parent, child]
  output:
    is_benefit_cap_exempt_health_disability: true

- name: A disabled child not receiving disability living allowance does not exempt the award
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
      child:
        age: 10
        is_disabled_for_benefits: true
    benunits:
      benunit:
        members: [parent, child]
  output:
    uc_LCWRA_element: 0
    dla: [0, 0]
    is_benefit_cap_exempt_health_disability: false

- name: A child receiving disability living allowance exempts the award (reg. 83(1)(f))
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
      child:
        age: 10
        dla_sc_category: MIDDLE
    benunits:
      benunit:
        members: [parent, child]
  output:
    uc_LCWRA_element: 0
    is_benefit_cap_exempt_health_disability: true

- name: A qualifying young person receiving personal independence payment exempts the award (reg. 83(1)(g))
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        pip_dl_category: STANDARD
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    uc_LCWRA_element: 0
    is_benefit_cap_exempt_health_disability: true

- name: A qualifying young person entitled to Carer's Allowance exempts the award (reg. 83(1)(i)) without giving it the carer element
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        care_hours: 40
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    uc_carer_element: 0
    is_benefit_cap_exempt_health_disability: true

- name: A claimant who is a carer is exempt, the carer element being in the award (reg. 83(1)(j))
  period: 2026
  input:
    age: 40
    care_hours: 35
    would_claim_carers_allowance: false
  output:
    carers_allowance: 0
    is_benefit_cap_exempt_health_disability: true

# Reg. 83(1)(a) to (e): "the claimant is receiving an employment and support
# allowance that includes the support component"; "(b) a claimant is receiving
# industrial injuries benefit; (c) a claimant is receiving attendance
# allowance; ... (e) a claimant is receiving a payment under article 15(1)(c)
# or article 29(1)(a) of the Armed Forces and Reserve Forces (Compensation
# Scheme) Order 2011". These name the claimant alone, so a dependant's payment
# does not exempt the award. Housing Benefit Regulations 2006 reg. 75F(1)(a) to
# (d) say "the claimant or the claimant's partner".

- name: A claimant receiving industrial injuries benefit exempts the award (reg. 83(1)(b))
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
        iidb_reported: 3_000
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    is_benefit_cap_exempt_health_disability: true

- name: A qualifying young person receiving industrial injuries benefit does not exempt the award
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        iidb_reported: 3_000
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    is_uc_assessed_claimant: [true, false]
    is_benefit_cap_exempt_health_disability: false
    is_benefit_cap_exempt: false

- name: A claimant receiving contributory ESA exempts the award (reg. 83(1)(a))
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
        esa_contrib_reported: 5_000
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    is_benefit_cap_exempt_health_disability: true
    is_benefit_cap_exempt_other: true

- name: A dependant receiving contributory ESA does not exempt the award
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        esa_contrib_reported: 5_000
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    is_benefit_cap_exempt_health_disability: false
    is_benefit_cap_exempt_other: false
    is_benefit_cap_exempt: false

- name: A claimant receiving an armed forces compensation payment exempts the award (reg. 83(1)(e))
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
        afcs_reported: 5_000
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    is_benefit_cap_exempt_other: true

- name: A dependant receiving an armed forces compensation payment does not exempt the award
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_parent: true
      young_person:
        age: 17
        current_education: UPPER_SECONDARY
        afcs_reported: 5_000
    benunits:
      benunit:
        members: [parent, young_person]
  output:
    is_benefit_cap_exempt_other: false

- name: A partner receiving industrial injuries benefit exempts the award, each joint claimant being a claimant
  period: 2026
  input:
    people:
      claimant:
        age: 40
      partner:
        age: 38
        iidb_reported: 3_000
    benunits:
      benunit:
        members: [claimant, partner]
  output:
    is_uc_assessed_claimant: [true, true]
    is_benefit_cap_exempt_health_disability: true

- name: A third member flagged as a claimant receiving personal independence payment, not being a claimant or qualifying young person, does not exempt the award
  period: 2026
  input:
    people:
      claimant:
        age: 50
        is_uc_claimant: true
      partner:
        age: 48
        is_uc_claimant: true
      adult_child:
        age: 22
        is_uc_claimant: true
        pip_dl_category: STANDARD
    benunits:
      benunit:
        members: [claimant, partner, adult_child]
  output:
    is_uc_assessed_claimant: [true, true, false]
    is_benefit_cap_exempt_health_disability: false
