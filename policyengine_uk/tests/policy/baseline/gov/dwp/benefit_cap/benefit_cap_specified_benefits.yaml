# Benefit cap exceptions for receipt of specified benefits.
#
# HB Regs 2006 (SI 2006/213) reg 75F(1): "The benefit cap does not apply
# where— (a) the claimant or the claimant's partner is receiving an
# employment and support allowance under Part 1 of the Welfare Reform Act
# which includes a support component; (b) the claimant or the claimant's
# partner is receiving an industrial injuries benefit ...; (c) ... an
# attendance allowance; ... (d) ... a war pension; (e) the claimant, the
# claimant's partner or a child or young person for whom the claimant or the
# claimant's partner is responsible, is receiving a disability living
# allowance; ... (ea) the claimant, the claimant's partner or a young person
# for whom the claimant or the claimant's partner is responsible, is
# receiving a personal independence payment, adult disability payment or an
# armed forces independence payment ...; ... (h) the claimant, the claimant's
# partner, or a young person for whom the claimant or the claimant's partner
# is responsible, is entitled to a carer's allowance ...; (ha) ... carer
# support payment". Reg 75F(2)(a): a war pension includes "a guaranteed
# income payment".
#
# UC Regs 2013 (SI 2013/376) reg 83(1) draws the same lines with "a
# claimant", adding "(a) the LCWRA element is included in the award" and
# "(j) the carer element is included in the award". The model applies one
# cap to both schemes, so either scheme's exception counts.
#
# 2025-26 caps (UC reg 80A(2); HB reg 75CA): single outside London 14,753;
# couple or family outside London 22,020. Each family lives in the North
# East. Benefit amounts are set directly, so the expected values follow from
# the cap arithmetic alone: reduction = capped benefits - cap (UC reg 81;
# HB reg 75D).
#
# A "non-dependent adult" below is a benefit-unit member aged 30 (50 in the
# attendance allowance case) who is neither the claimant, the partner, nor a
# child or young person they are responsible for. Their own benefits and
# circumstances never lift the family's cap. (Their age and earnings still
# can, through is_benefit_cap_exempt_other and _earnings: out of scope here.)

# --- ESA with the support component: HB reg 75F(1)(a), UC reg 83(1)(a) ---

- name: Claimant's contributory ESA with the support component lifts the cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
        esa_contrib_reported: 7_000
        esa_includes_support_component: true
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    is_benefit_cap_exempt_health_disability: true
    is_benefit_cap_exempt: true
    benefit_cap_reduction: 0
    universal_credit: 18_000

- name: Claimant's contributory ESA without the support component does not lift the cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
        esa_contrib_reported: 7_000
        esa_includes_support_component: false
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    is_benefit_cap_exempt_health_disability: false
    is_benefit_cap_exempt: false
    benefit_cap: 14_753
    # 18,000 UC + 7,000 ESA - 14,753 = 10,247
    benefit_cap_reduction: 10_247
    # 18,000 - 10,247
    universal_credit: 7_753

- name: Claimant's income-related ESA with the support component lifts the Housing Benefit cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 6_000
        esa_includes_support_component: true
    benunits:
      family:
        members: [claimant]
        would_claim_uc: false
        would_claim_housing_benefit: true
        housing_benefit_pre_benefit_cap: 9_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    esa_income: 6_000
    is_benefit_cap_exempt_health_disability: true
    benefit_cap_reduction: 0
    housing_benefit: 9_000

- name: Claimant's income-related ESA without the support component does not lift the Housing Benefit cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 6_000
        esa_includes_support_component: false
    benunits:
      family:
        members: [claimant]
        would_claim_uc: false
        would_claim_housing_benefit: true
        housing_benefit_pre_benefit_cap: 9_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    esa_income: 6_000
    is_benefit_cap_exempt_health_disability: false
    benefit_cap: 14_753
    # 9,000 HB + 6,000 ESA - 14,753 = 247 (HB reg 75D(1))
    benefit_cap_reduction: 247
    housing_benefit: 8_753

- name: Partner's contributory ESA with the support component lifts the couple's cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      partner:
        age: 38
        is_claimant_or_partner: true
        esa_contrib_reported: 7_000
        esa_includes_support_component: true
    benunits:
      family:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_couple: true
    is_benefit_cap_exempt_health_disability: true
    benefit_cap_reduction: 0

- name: Partner's contributory ESA without the support component leaves the couple capped
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      partner:
        age: 38
        is_claimant_or_partner: true
        esa_contrib_reported: 7_000
        esa_includes_support_component: false
    benunits:
      family:
        members: [claimant, partner]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_benefit_cap_exempt_health_disability: false
    benefit_cap: 22_020
    # 18,000 + 7,000 - 22,020 = 2,980
    benefit_cap_reduction: 2_980

- name: Income-related ESA that the capital test stops is not received, so it does not lift the cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
        esa_income_reported: 6_000
        esa_includes_support_component: true
        # Isolate the ESA head. Universal Credit would still give this person
        # limited capability for work-related activity from the ESA
        # assessment (UC Regs 2013 reg 40(1)(a)(ii)), and the model's one cap
        # takes UC reg 83(1)(a) for Housing Benefit families too.
        uc_limited_capability_for_WRA: false
    benunits:
      family:
        members: [claimant]
        would_claim_uc: false
        esa_income_eligible: false
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    esa_income: 0
    is_on_income_related_esa: false
    is_benefit_cap_exempt_health_disability: false

- name: With no support-component input, a person's own contributory ESA is taken to include it
  period: 2025
  input:
    people:
      claimant:
        age: 40
        esa_contrib_reported: 7_000
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    esa_includes_support_component: true
    is_benefit_cap_exempt_health_disability: true
    benefit_cap_reduction: 0

- name: A person without ESA has no support component
  period: 2025
  input:
    people:
      claimant:
        age: 40
    benunits:
      family:
        members: [claimant]
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    esa_includes_support_component: false
    is_benefit_cap_exempt_health_disability: false

- name: An income-related award entered for the family is the claimant's, with the support component
  period: 2025
  input:
    people:
      claimant:
        age: 40
    benunits:
      family:
        members: [claimant]
        esa_income: 6_000
        would_claim_uc: false
        would_claim_housing_benefit: true
        housing_benefit_pre_benefit_cap: 9_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    is_on_income_related_esa: true
    esa_includes_support_component: true
    is_benefit_cap_exempt_health_disability: true
    housing_benefit: 9_000

- name: A partner who reports the couple's income-related ESA has the support component
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      partner:
        age: 38
        is_claimant_or_partner: true
        esa_income_reported: 6_000
    benunits:
      family:
        members: [claimant, partner]
        would_claim_uc: false
    households:
      home:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    # The award is the partner's: the claimant has no allowance of their own
    # (WRA 2007 s.4(4)(b): "the claimant has limited capability for
    # work-related activity" refers to the person whose allowance it is).
    is_on_income_related_esa: [true, true]
    esa_includes_support_component: [false, true]
    is_benefit_cap_exempt_health_disability: true

- name: An income-related award entered for a couple is the award of the claimant who heads the family
  period: 2025
  input:
    people:
      claimant:
        age: 38
        is_claimant_or_partner: true
        is_benunit_head: true
      partner:
        age: 40
        is_claimant_or_partner: true
        is_benunit_head: false
    benunits:
      family:
        members: [claimant, partner]
        esa_income: 6_000
        would_claim_uc: false
    households:
      home:
        members: [claimant, partner]
        region: NORTH_EAST
  output:
    is_on_income_related_esa: [true, true]
    has_own_esa_award: [true, false]
    esa_includes_support_component: [true, false]
    is_benefit_cap_exempt_health_disability: true
