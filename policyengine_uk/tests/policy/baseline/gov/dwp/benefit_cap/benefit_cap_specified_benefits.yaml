    # not a claimant's element (reg 27(1)). 18,000 - 14,753.
    is_uc_benefit_cap_exempt_specified_benefit: false
    is_housing_benefit_benefit_cap_exempt_specified_benefit: false
    benefit_cap_reduction: 3_247

- name: From 2026 too, an LCWRA element entered for the award lifts the cap whatever a non-dependant's limited capability
  period: 2026
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
        uc_limited_capability_for_WRA: false
      adult:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        uc_limited_capability_for_WRA: true
    benunits:
      family:
        members: [claimant, adult]
        uc_LCWRA_element: 5_157.60
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    # The rebalancing may rescale an entered element, but it stays the
    # award's (reg 83(1)(a)).
    is_uc_benefit_cap_exempt_specified_benefit: true
    is_housing_benefit_benefit_cap_exempt_specified_benefit: false
    benefit_cap_reduction: 0

- name: A carer element the family's entered carer flag gives lifts the cap, though no member is flagged
  period: 2025
  input:
    people:
      claimant:
        age: 40
    benunits:
      family:
        members: [claimant]
        benunit_has_carer: true
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # The award includes the carer element (reg 83(1)(j)), and no member who
    # is not a claimant has caring responsibilities to give it instead.
    is_uc_benefit_cap_exempt_specified_benefit: true
    is_housing_benefit_benefit_cap_exempt_specified_benefit: false
    benefit_cap_reduction: 0

- name: A nil carer element is not included in the award, though the claimant cares
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_carer_for_benefits: true
    benunits:
      family:
        members: [claimant]
        benunit_has_carer: false
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # Reg 83(1)(j) asks whether the award includes the element; the
    # family's entered flag gives none. 18,000 - 14,753.
    uc_carer_element: 0
    is_uc_benefit_cap_exempt_specified_benefit: false
    is_housing_benefit_benefit_cap_exempt_specified_benefit: false
    benefit_cap_reduction: 3_247

# --- Working tax credit: HB reg 75E(2) ---

- name: The family's working tax credit lifts the cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
    benunits:
      family:
        members: [claimant]
        working_tax_credit: 1_000
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # HB reg 75E(2): "the claimant is, or the claimant and the claimant's
    # partner are jointly, entitled to working tax credit". WTC is outside
    # HB reg 75F and UC reg 83, and lifts only the HB cap through reg 75E.
    is_uc_benefit_cap_exempt_specified_benefit: false
    is_housing_benefit_benefit_cap_exempt_specified_benefit: false
    is_housing_benefit_benefit_cap_exempt_working_tax_credit: true
    is_uc_benefit_cap_exempt: false
    is_housing_benefit_benefit_cap_exempt: true

# --- UC earnings (reg 82) and HB pension-age regulations (reg 5) ---

- name: Earnings of 20,000 a year meet the model's earnings exception
  period: 2025
  input:
    people:
      claimant:
        age: 40
        employment_income: 20_000
    benunits:
      family:
        members: [claimant]
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # Income tax (20,000 - 12,570) x 20% = 1,486; NI (20,000 - 12,570) x 8%
    # = 594.40; 20,000 - 1,486 - 594.40 = 17,919.60 >= 10,152.
    is_uc_benefit_cap_exempt_earnings: true

- name: Earnings of 9,000 a year do not meet the model's earnings exception
  period: 2025
  input:
    people:
      claimant:
        age: 40
        employment_income: 9_000
    benunits:
      family:
        members: [claimant]
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # Below the personal allowance and primary threshold: 9,000 < 10,152.
    is_uc_benefit_cap_exempt_earnings: false

- name: A claimant over the qualifying age for State Pension Credit and off Universal Credit is outside the cap (HB pension-age regulations)
  period: 2025
  input:
    people:
      claimant:
        age: 70
    benunits:
      family:
        members: [claimant]
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # HB reg 5(3): "these Regulations shall not apply ... if he ... has
    # attained the qualifying age for state pension credit" (subject to
    # reg 5(1)(b)); the pension-age regulations contain no benefit cap.
    # Universal Credit's cap has no age exception for a claimant (UC reg
    # 79(1) names only the exceptions "in regulation 82 ... or 83"), but SI
    # 2014/1230 reg 60C disapplies it where every claimant has reached the
    # qualifying age.
    housing_benefit_pension_age_regulations_apply: true
    is_uc_benefit_cap_exempt_qualifying_age: true
    is_uc_benefit_cap_exempt: true
    is_housing_benefit_benefit_cap_exempt: true

- name: A non-dependent adult over State Pension age does not lift the cap
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      adult:
        age: 70
        is_claimant_or_partner: false
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    # Housing Benefit's pension-age regulations read the claimant and
    # partner (HB Regs 2006 reg 5), and SI 2014/1230 reg 60C the claimants;
    # Universal Credit has no other age exception. 18,000 - 14,753.
    housing_benefit_pension_age_regulations_apply: false
    is_uc_benefit_cap_exempt_qualifying_age: false
    is_uc_benefit_cap_exempt: false
    is_housing_benefit_benefit_cap_exempt: false
    benefit_cap_reduction: 3_247

- name: A non-dependent adult's earnings do not meet the earnings exception
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      adult:
        age: 30
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
        employment_income: 20_000
    benunits:
      family:
        members: [claimant, adult]
        universal_credit_pre_benefit_cap: 18_000
    households:
      home:
        members: [claimant, adult]
        region: NORTH_EAST
  output:
    # UC Regs 2013 reg 82(1)(a) reads the claimant's earned income. 18,000 -
    # 14,753.
    is_uc_benefit_cap_exempt_earnings: false
    is_uc_benefit_cap_exempt: false
    is_housing_benefit_benefit_cap_exempt: false
    benefit_cap_reduction: 3_247
