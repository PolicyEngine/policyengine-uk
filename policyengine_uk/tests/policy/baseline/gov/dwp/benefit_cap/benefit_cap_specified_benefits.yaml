# --- The other two exception variables keep their results ---

- name: Earnings of 20,000 a year meet the model's earnings exception
  period: 2025
  input:
    people:
      claimant:
        age: 40
        employment_income: 20_000
    benunits:
      family:
        members: [claimant]
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # Income tax (20,000 - 12,570) x 20% = 1,486; NI (20,000 - 12,570) x 8%
    # = 594.40; 20,000 - 1,486 - 594.40 = 17,919.60 >= 10,152.
    is_benefit_cap_exempt_earnings: true

- name: Earnings of 9,000 a year do not meet the model's earnings exception
  period: 2025
  input:
    people:
      claimant:
        age: 40
        employment_income: 9_000
    benunits:
      family:
        members: [claimant]
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    # Below the personal allowance and primary threshold: 9,000 < 10,152.
    is_benefit_cap_exempt_earnings: false

- name: A member over State Pension age keeps the age exception
  period: 2025
  input:
    people:
      claimant:
        age: 70
    benunits:
      family:
        members: [claimant]
    households:
      home:
        members: [claimant]
        region: NORTH_EAST
  output:
    is_benefit_cap_exempt_other: true
    is_benefit_cap_exempt: true
