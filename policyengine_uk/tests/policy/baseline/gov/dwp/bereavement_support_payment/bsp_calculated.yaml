    bsp_calculated_initial_payment: 3500
    bsp_calculated: 3500
    bsp: 3500

- name: "Case 4, the initial component needs both a known category and its fixed actual receipt year."
  period: 2026
  absolute_error_margin: 0.01
  input:
    bsp_add_calculated_award: [true, true, true]
    bsp_initial_payment_year: [2026, 0, 0]
    bsp_initial_payment_rate: ["UNKNOWN", "STANDARD", "HIGHER"]
    bsp_standard_instalments: [0, 0, 0]
    bsp_higher_instalments: [0, 0, 0]
    bsp_instalments_received_before_year: [0, 0, 0]
    bsp_reported: [0, 0, 0]
  output:
    bsp_calculated_initial_payment: [0, 0, 0]
    bsp: [0, 0, 0]

