# Independent primary sources: GOV.UK BSP, What you'll get; NI Direct BSP, Payments.
# Explicit facts describe already-qualified, actual receipts; no entitlement calendar is inferred.
# The combined eighteen-instalment and mixed-history rejection tests bind the frozen API contract.
- name: "Case 1, default reported cash remains authoritative without an additional-award opt-in."
  period: 2026
  absolute_error_margin: 0.01
  input:
    bsp_reported: 725.13
  output:
    bsp_calculated: 0
    bsp: 725.13

- name: "Case 2, the qualified standard initial payment is two thousand five hundred pounds."
  period: 2026
  absolute_error_margin: 0.01
  input:
    bsp_add_calculated_award: true
    bsp_initial_payment_year: 2026
    bsp_initial_payment_rate: "STANDARD"
    bsp_standard_instalments: 0
    bsp_higher_instalments: 0
    bsp_instalments_received_before_year: 0
    bsp_reported: 0
  output:
    bsp_calculated_initial_payment: 2500
    bsp_calculated_monthly_payments: 0
    bsp_calculated: 2500
    bsp: 2500

- name: "Case 3, the qualified higher initial payment is three thousand five hundred pounds."
  period: 2026
  absolute_error_margin: 0.01
  input:
    bsp_add_calculated_award: true
    bsp_initial_payment_year: 2026
    bsp_initial_payment_rate: "HIGHER"
    bsp_standard_instalments: 0
    bsp_higher_instalments: 0
    bsp_instalments_received_before_year: 0
    bsp_reported: 0
