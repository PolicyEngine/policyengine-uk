# State Pension age by date of birth, at each boundary of Pensions Act 1995
# Schedule 4 paragraph 1. Status is at 6 October of the fiscal year. Age and
# months_since_last_birthday place the date of birth named in each test.
# Expected values come from a day-level reading of the statute.

- name: Woman born 5 April 1950 attains State Pension age at 60 (rule 2)
  period: 2015
  absolute_error_margin: 0.001
  input:
    age: 65
    months_since_last_birthday: 6.032258
    is_male: false
  output:
    state_pension_age: 60.0  # attained 5 April 2010
    is_SP_age: true

