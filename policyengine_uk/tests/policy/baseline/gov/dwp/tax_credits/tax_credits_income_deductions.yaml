# SI 2002/2006 regs 3(7) and 10: gross member pensions and eligible Gift Aid
# are deducted after the four-step income calculation; other investment
# income belongs to Step One. Existing ISA income is already additional.
# https://www.legislation.gov.uk/uksi/2002/2006/regulation/3
# https://www.legislation.gov.uk/uksi/2002/2006/regulation/10
# The WTC cases use HMRC 2024-25 basic 2435, threshold 7955 and taper 41%.
# At 16 hours, a 60-year-old qualifies without a 30-hour or family element.
# Gross contributions already include relief: never multiply them by 1.25.
# Gift Aid is net, and the existing gross-up turns 80 into 100.

- name: Other investment income counts above the shared Step One disregard
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        employment_income: 20000
        other_investment_income: 1000
    benunits:
      family:
        members: &id001
        - claimant
        would_claim_uc: false
    households:
      home:
        members: *id001
  output:
    tax_credits_current_year_income: 20700
    tax_credits_applicable_income: 20700
- name: Personal pension contributions use their existing gross amount once
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 40
        employment_income: 20000
        personal_pension_contributions: 1000
    benunits:
      family:
        members: &id002
        - claimant
        would_claim_uc: false
    households:
      home:
        members: *id002
  output:
    tax_credits_current_year_income: 19000
    tax_credits_applicable_income: 19000
    pension_contributions: 1000
