        would_claim_uc: false
  output:
    CTC_family_element: 545

# Before 2016-17 the model has no individual element or income thresholds, so
# these cases enter CTC eligibility and test the family element alone. PE-UK
# converts parameters to fiscal years for 2015 to 2040 only; an earlier YEAR
# period reads them at 1 January, which falls in the previous tax year. The
# periods below are chosen so that both tax years have the same law.

- name: 2012 (read at 1 January 2012, in 2011-12), a child under one - 545 (reg 7(3) as substituted by SI 2011/1035)
  period: 2012
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 35
      baby:
        age: 0
    benunits:
      benunit:
        members: [parent, baby]
        is_CTC_eligible: true
  output:
    CTC_family_element: 545

- name: 2010 (read at 1 January 2010, in 2009-10), a child under one - 1,090 (reg 7(3)(a) as made)
  period: 2010
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 35
      older_child:
        age: 4
      baby:
        age: 0
    benunits:
      benunit:
        members: [parent, older_child, baby]
        is_CTC_eligible: true
  output:
    CTC_family_element: 1_090

- name: 2010 (read at 1 January 2010, in 2009-10), youngest child aged one - 545 (reg 7(3)(b) as made)
  period: 2010
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 35
      child:
        age: 1
    benunits:
      benunit:
        members: [parent, child]
        is_CTC_eligible: true
  output:
    CTC_family_element: 545

- name: 2004 (read at 1 January 2004, in 2003-04, the first year of tax credits) - 545
  period: 2004
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 35
      child:
        age: 5
    benunits:
      benunit:
        members: [parent, child]
        is_CTC_eligible: true
  output:
    CTC_family_element: 545

