        age: 7
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
  output:
    CTC_family_element: 0

- name: 2024-25, a birth year entered for one child only - the other child's birth year is still the period less age
  period: 2024
  absolute_error_margin: 0
