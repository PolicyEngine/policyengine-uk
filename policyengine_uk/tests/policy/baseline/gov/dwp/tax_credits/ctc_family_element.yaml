# Child Tax Credit family element: Tax Credits Act 2002 s.9(2)(a) and
# CTC Regs 2002 (SI 2002/2007) reg 7(2)(a) and (3).
#
# Expected values are worked from the law, not from the model:
# - reg 7(3): the family element is £545 in every tax year from 2003-04 to
#   2024-25 (as made: £545, or £1,090 where any child is under one; from
#   6 April 2011, SI 2011/1035 reg 2(2): £545).
# - reg 7(2)(a), from 6 April 2017 (SI 2017/387 reg 4(b)): included only where
#   the claimant is responsible for a child or qualifying young person born
#   before 6 April 2017. The model knows birth years only (period less age), so
#   a child counts as born before the cutoff when their birth year is 2016 or
#   earlier.
# - 2024-25 award, CTC only: individual element £3,455 per child
#   (reg 7(4)(c), SI 2024/247 reg 3(a)); threshold £19,995 and taper 41%
#   (SI 2002/2008 reg 8(3) steps 4 and 5, SI 2024/247 reg 4(4)). For income of
#   £25,000 the reduction is 41% x (25,000 - 19,995) = £2,052.05.
#
# Every family claims CTC (reported) and not Universal Credit, has no one in
# work for 16 hours (so no WTC), and has no disabled child.

- name: 2024-25, one child born 2014 - family element of 545 included
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 25_000
        child_tax_credit_reported: 1_000
      child:
        age: 10
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
  output:
    CTC_family_element: 545
    CTC_maximum_rate: 4_000  # 3,455 + 545
    child_tax_credit: 1_947.95  # 4,000 - 2,052.05

- name: 2024-25, only child born 2019 - no family element
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 25_000
        child_tax_credit_reported: 1_000
      child:
        age: 5
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
  output:
    CTC_family_element: 0
    CTC_maximum_rate: 3_455
    child_tax_credit: 1_402.95  # 3,455 - 2,052.05

- name: 2024-25, children born 2015 and 2019 - one child born before the cutoff is enough, and there is one family element
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 25_000
        child_tax_credit_reported: 1_000
      older_child:
        age: 9
      younger_child:
        age: 5
    benunits:
      benunit:
        members: [parent, older_child, younger_child]
        would_claim_uc: false
  output:
    CTC_family_element: 545
    CTC_maximum_rate: 7_455  # 2 x 3,455 + 545
    child_tax_credit: 5_402.95  # 7,455 - 2,052.05

- name: 2024-25, three children born 2018, 2020 and 2022 - no family element, and the child limit gives two individual elements
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 25_000
        child_tax_credit_reported: 1_000
      child_1:
        age: 6
      child_2:
        age: 4
      child_3:
        age: 2
    benunits:
      benunit:
        members: [parent, child_1, child_2, child_3]
        would_claim_uc: false
  output:
    CTC_family_element: 0
    CTC_child_element: 6_910  # 2 x 3,455 (reg 7(2A))
    CTC_maximum_rate: 6_910
    child_tax_credit: 4_857.95  # 6,910 - 2,052.05

- name: 2024-25, a qualifying young person born 2006 counts as born before the cutoff
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        employment_income: 25_000
        child_tax_credit_reported: 1_000
      young_person:
        age: 18
        current_education: UPPER_SECONDARY
      child:
        age: 2
    benunits:
      benunit:
        members: [parent, young_person, child]
        would_claim_uc: false
  output:
    is_child_or_qualifying_young_person_for_child_tax_credit: [false, true, true]
    CTC_family_element: 545
    CTC_maximum_rate: 7_455  # 2 x 3,455 + 545
    child_tax_credit: 5_402.95

- name: 2024-25, an older sibling aged 20 is not a qualifying young person, so does not bring the family element
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        employment_income: 25_000
        child_tax_credit_reported: 1_000
      adult_child:
        age: 20
        current_education: UPPER_SECONDARY
      child:
        age: 4
    benunits:
      benunit:
        members: [parent, adult_child, child]
        would_claim_uc: false
  output:
    is_child_or_qualifying_young_person_for_child_tax_credit: [false, false, true]
    CTC_family_element: 0
    CTC_maximum_rate: 3_455
    child_tax_credit: 1_402.95

- name: 2024-25, joint claim with a child born 2012 - family element included
  period: 2024
