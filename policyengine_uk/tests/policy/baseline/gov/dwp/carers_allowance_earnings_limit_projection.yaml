# Carer's Allowance earnings limit after its last legislated amount (£204 a
# week from 6 April 2026, SI 2026/218). From April 2025 the Government sets
# the limit at 16 times the hourly national living wage, rounded up to the
# nearest pound (Explanatory Memorandum to SI 2025/352, paragraph 5.6), and
# the model projects later years that way. The model projects the April 2027
# national living wage by May-July 2026 earnings growth, 3.9% (published), to
# £12.71 x 1.039 = £13.21, so the limit is 16 x £13.21 = £211.36, rounded up
# to £212. Later years rest on OBR forecasts, so they are tested in
# test_carers_allowance_earnings_limit_projection.py against whatever the
# model's wage is. Earnings are entered net, as carers_allowance_earnings, so
# the cases do not depend on tax or NI.

- name: 2027-28, net earnings of exactly £212 a week have not exceeded the limit.
  period: 2027
  input:
    age: 45
    carers_allowance_earnings: 212 * 52
    care_hours: 40
    country: ENGLAND
  output:
    is_gainfully_employed_for_carers_allowance: false

- name: 2027-28, net earnings of £213 a week are over the limit.
  period: 2027
  input:
    age: 45
    carers_allowance_earnings: 213 * 52
    care_hours: 40
    country: ENGLAND
  output:
    is_gainfully_employed_for_carers_allowance: true
    carers_allowance: 0
