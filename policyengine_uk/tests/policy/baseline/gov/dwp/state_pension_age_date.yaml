# The day State Pension age is attained, written as a YYYYMMDD number, at
# boundaries of Pensions Act 1995 Schedule 4 paragraph 1. Age and
# months_since_last_birthday place the date of birth named in each test at
# 6 October of the fiscal year. Expected days come from a day-level reading
# of the statute.

- name: Woman born 5 April 1950 attains State Pension age on her 60th birthday
  period: 2015
  input:
    age: 65
    months_since_last_birthday: 6.0323
    is_male: false
  output:
    state_pension_age_date: 20100405

