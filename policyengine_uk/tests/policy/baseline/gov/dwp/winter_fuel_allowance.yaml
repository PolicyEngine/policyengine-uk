  # SI 2024/869 and SI 2025/969 extend to England and Wales; SI 2000/729
  # covered Great Britain up to the 2023 qualifying week.
  period: 2024
  absolute_error_margin: 1
  input:
    age: 67
    country: "SCOTLAND"
    total_income: 10000
  output:
    winter_fuel_allowance: 0

