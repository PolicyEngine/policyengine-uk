- name: Case 36, a full-time student whose family claimed when DWP moved it off tax credits keeps the award in 2025.
  # We use one claimant in cases 36 to 41: aged 30 and single, with no child,
  # no listed disability benefit and no earnings, so DWP applies no reg. 14(1)
  # exception to them. While they had Working Tax Credit they worked at least
  # 30 hours a week (Working Tax Credit (Entitlement and Maximum Rate)
  # Regulations 2002 reg. 4(1)); they stopped before their Universal Credit
  # award began, so they have no earned income from its first assessment period
  # on. They undertake a full-time degree, so they receive education under reg.
  # 12(2)(a). We set Working Tax Credit of £1,000 to stand in for the award
  # that closed, and the model closes tax credits from 6 April 2025. The family
  # claims only because its tax credits close (would_claim_uc false,
  # would_claim_uc_at_legacy_closure true). Under SI 2014/1230, DWP issued the
  # claimant a migration notice (reg. 44(1)) while they had an award of Working
  # Tax Credit, an existing benefit (reg. 2(1)), so they became a notified
  # person (reg. 44(6)). By claiming on or before the final deadline, the last
  # day of the first assessment period of an award starting on the deadline day
  # (reg. 46(4)), they make a qualifying claim (reg. 48). On the migration day,
  # the day before their entitlement starts (reg. 49), they undertake the
  # course, so DWP doesn't apply the condition in s. 4(1)(d) to them while they
  # continue it (reg. 60(1)). No one could claim a tax credit for 2025-26 (reg.
  # 6A(9)), and an award on a claim made by the final deadline starts no later
  # than the deadline day (reg. 46(3)), so with a deadline day on or before 6
  # April 2025 (reg. 44(3B)) the migration day fell on or before 5 April 2025;
  # in 2025-26 DWP applies the text of reg. 60(1) in force from 27 January
  # 2025. We assume 12 assessment periods at the 2025 to 2026 rate and no
  # transitional element (reg. 52(1)): 12 x £400.14 = £4,801.68.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        current_education: TERTIARY
        is_in_full_time_education: true
        working_tax_credit_reported: 1_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    legacy_benefits_closed: true
    claims_uc_at_legacy_closure: true
    uc_receiving_education: [true]
    uc_is_excepted_from_education_condition: [true]
    is_uc_eligible: true
    universal_credit: 4_801.68

- name: Case 37, the student of case 36 continues the same course in 2026 and keeps the award.
  # The claimant continues the course they undertook on the migration day, so
  # DWP still doesn't apply the condition (SI 2014/1230 reg. 60(1)). Under reg.
  # 60(2), DWP stops the protection only in an assessment period in which a
  # transitional element would have stopped under reg. 56 or 57, and none of
  # those events has happened. The claimant has no earned income and isn't in
  # gainful self-employment, so the minimum income floor neither applies to
  # them nor would apply but for a start-up period (Universal Credit
  # Regulations 2013 reg. 62(1) and (5)); so even under reg. 56(3)(b) their
  # earned income didn't reach the single administrative threshold in the first
  # assessment period, and DWP can't apply reg. 56(2) (reg. 56(2)(a)(ii)). DWP
  # applies reg. 56(3A) only to an award mentioned in reg. 60A(1), and the
  # claimant has no such award. They haven't joined a couple (reg. 56(4)(b)),
  # and their award continues, so DWP doesn't apply reg. 57 either. With no
  # transitional element, as in case 36, 12 x £424.90 = £5,098.80, as in case
  # 19.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        current_education: TERTIARY
        is_in_full_time_education: true
        working_tax_credit_reported: 1_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    legacy_benefits_closed: true
    claims_uc_at_legacy_closure: true
    uc_receiving_education: [true]
    uc_is_excepted_from_education_condition: [true]
    is_uc_eligible: true
    universal_credit: 5_098.80

- name: Case 38, the student of case 36 finishes the course and meets the condition in 2027.
  # We keep current_education TERTIARY from case 36 and set
  # is_in_full_time_education false for the end of the course: the model reads
  # only that input to decide whether the claimant undertakes a full-time
  # course. The claimant no longer undertakes the course they undertook on the
  # migration day, and DWP lifts the condition only "while they are continuing
  # to undertake that course" (SI 2014/1230 reg. 60(1)), so DWP now applies it
