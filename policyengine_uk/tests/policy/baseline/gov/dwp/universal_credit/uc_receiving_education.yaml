- name: Case 40, the student of case 36 claims before the closure and gets no Universal Credit in 2024.
  # The model keeps tax credits open in 2024, so legacy_benefits_closed reads
  # false, and the family claims Universal Credit (would_claim_uc true) with no
  # closure. The claimant claims before DWP issues them a migration notice, so
  # they don't claim as a notified person (SI 2014/1230 reg. 44(6)) and have no
  # deadline day or final deadline (regs. 44(1)(b) and 46(4)). Their claim
  # doesn't count as a qualifying claim (reg. 48), and DWP doesn't apply reg.
  # 60(1). Since 27 January 2025 DWP has applied reg. 60(1) to a person who has
  # made a qualifying claim (SI 2025/3 reg. 6(9)(a) and (c)); before then it
  # applied reg. 60(1) only to a notified person, so the claimant gets no
  # protection under either text. They receive education under reg. 12(2)(a)
  # with no reg. 14(1) exception, and DWP pays nothing. A family that claimed
  # by the final deadline after DWP issued it a migration notice in 2024-25 did
  # make a qualifying claim (reg. 48). Until 26 January 2025 DWP applied reg.
  # 60(1) to a notified person in it who was on the course on the day their
  # existing awards were to terminate as a consequence of the claim, which for
  # a tax credit award ended by the claim is the migration day (regs. 8(2)(a)
  # and 49); from 27 January 2025 it applied reg. 60(1) to a full-time student
  # in it who was on the course on the migration day. The model, which takes
  # the closure from the active parameters here, protects such a student only
  # from 2025-26.
  period: 2024
  input:
    people:
      person1:
        age: 30
        current_education: TERTIARY
        is_in_full_time_education: true
        working_tax_credit_reported: 1_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: true
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    legacy_benefits_closed: false
    claims_uc_at_legacy_closure: false
    claims_universal_credit: true
    uc_receiving_education: [true]
    uc_is_excepted_from_education_condition: [false]
    meets_uc_education_condition: [false]
    is_uc_eligible: false
    universal_credit: 0

