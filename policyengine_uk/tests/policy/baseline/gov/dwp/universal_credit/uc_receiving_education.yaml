- name: Case 40, the student of case 36 claims before the closure and gets no Universal Credit in 2024.
  # The model keeps tax credits open in 2024, so legacy_benefits_closed reads
  # false, and the family claims Universal Credit (would_claim_uc true) with
  # no closure. A person who claims before any migration notice reaches them
  # never becomes a notified person (SI 2014/1230 reg. 44(6)), so their claim
  # doesn't count as a qualifying claim (reg. 48), and DWP doesn't apply reg.
  # 60(1). Before 27 January 2025, DWP applied reg. 60(1) only to a notified
  # person (SI 2025/3 reg. 6(9)(a) and (c) replaced those words), so the
  # claimant gets no protection under either text. They receive education
  # under reg. 12(2)(a) with no reg. 14(1) exception, and DWP pays nothing. A
  # family that claimed by the final deadline after DWP issued it a migration
  # notice in 2024-25 did make a qualifying claim, and a full-time student on
  # its migration day kept the protection from then. The model, which takes
  # the closure from the active parameters here, protects such a student only
  # from 2025-26.
  period: 2024
  input:
    people:
      person1:
        age: 30
        current_education: TERTIARY
        is_in_full_time_education: true
        working_tax_credit_reported: 1_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: true
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    legacy_benefits_closed: false
    claims_uc_at_legacy_closure: false
    claims_universal_credit: true
    uc_receiving_education: [true]
    uc_is_excepted_from_education_condition: [false]
    meets_uc_education_condition: [false]
    is_uc_eligible: false
    universal_credit: 0

