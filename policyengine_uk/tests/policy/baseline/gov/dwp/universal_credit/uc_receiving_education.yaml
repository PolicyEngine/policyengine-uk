    uc_receiving_education: [true, false]
    uc_is_excepted_from_education_condition: [false, false]
    meets_uc_education_condition: [false, true]
    is_uc_eligible: false
    universal_credit: 0

- name: Case 36, a full-time student whose family claims when its tax credits close in 2025 keeps the award.
  # We give one claimant to cases 36 to 41: aged 30 and single, with no child,
  # no listed disability benefit and no earnings, so no reg. 14(1) exception
  # applies. They undertake a full-time degree, so they receive education under
  # reg. 12(2)(a). We set Working Tax Credit of £1,000 to stand in for the
  # award that closed, and the model closes tax credits from 6 April 2025. The
  # family claims only because its tax credits close (would_claim_uc false,
  # would_claim_uc_at_legacy_closure true). Under SI 2014/1230, DWP issues a
  # migration notice to a person entitled to an existing benefit (reg. 44(1)),
  # who becomes a notified person (reg. 44(6)). By claiming on or before the
  # final deadline, the last day of the first assessment period of an award
  # starting on the deadline day (reg. 46(4)), they make a qualifying claim
  # (reg. 48). On the migration day, the day before their entitlement starts
  # (reg. 49), they undertake the course, so DWP doesn't apply the condition in
  # s. 4(1)(d) to them while they continue it (reg. 60(1)). 12 x £400.14 =
  # £4,801.68.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        current_education: TERTIARY
        is_in_full_time_education: true
        working_tax_credit_reported: 1_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    legacy_benefits_closed: true
    claims_uc_at_legacy_closure: true
    uc_receiving_education: [true]
    uc_is_excepted_from_education_condition: [true]
    is_uc_eligible: true
    universal_credit: 4_801.68

- name: Case 37, the student of case 36 continues the same course in 2026 and keeps the award.
  # The claimant continues the course they undertook on the migration day, so
  # DWP still doesn't apply the condition (SI 2014/1230 reg. 60(1)). Under reg.
  # 60(2), DWP stops the protection only in an assessment period in which a
  # transitional element would have stopped under reg. 56 or 57, and none of
  # those events has happened. The claimant has no earned income, so in the
  # first assessment period it didn't reach the single administrative
  # threshold, and reg. 56(2) can't apply (reg. 56(2)(a)(ii)); reg. 56(3A)
  # covers only reg. 60A awards. They haven't joined a couple (reg. 56(4)(b)),
  # and their award continues, so reg. 57 doesn't apply. 12 x £424.90 =
  # £5,098.80, as in case 19.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        current_education: TERTIARY
        is_in_full_time_education: true
        working_tax_credit_reported: 1_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    legacy_benefits_closed: true
    claims_uc_at_legacy_closure: true
    uc_receiving_education: [true]
    uc_is_excepted_from_education_condition: [true]
    is_uc_eligible: true
    universal_credit: 5_098.80

- name: Case 38, the student of case 36 finishes the course and meets the condition in 2027.
  # The claimant no longer undertakes the course they undertook on the
