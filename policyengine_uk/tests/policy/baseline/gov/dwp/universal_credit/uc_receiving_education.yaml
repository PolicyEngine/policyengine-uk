- name: Case 30, a claimant on a non-advanced full-time course with an equipment grant and no maintenance funding keeps the award.
  # Under reg. 12(2)(b), the person must have a loan or grant for their
  # maintenance. The claimant can use Learner Support for materials and
  # equipment (gov.uk/learner-support), and the claimant's student loan
  # doesn't fund maintenance here, so the claimant doesn't receive education.
  # 12 x £424.90 = £5,098.80.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        current_education: POST_SECONDARY
        is_in_full_time_education: true
        education_grants: 100
        student_loans: 3_000
        has_education_maintenance_funding: false
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    uc_receiving_education: [false]
    is_uc_eligible: true
    universal_credit: 5_098.80

- name: Case 31, an 18-year-old on Housing Benefit and a non-advanced full-time course takes the ordinary route.
  # SI 2014/1230 reg. 28: a person entitled to an existing benefit, here
  # Housing Benefit (reg. 2(1)), doesn't count as a qualifying young person
  # for the Universal Credit Regulations. With no maintenance funding, reg.
  # 12(2) doesn't apply either, so the claimant doesn't receive education.
  period: 2026
  input:
    people:
      person1:
        age: 18
        current_education: POST_SECONDARY
        is_in_full_time_education: true
        housing_benefit_reported: 6_000
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    is_qualifying_young_person_for_universal_credit: [true]
    is_qualifying_young_person_for_uc_education: [false]
    uc_receiving_education: [false]
    is_uc_eligible: true

- name: Case 32, the same 18-year-old with a maintenance grant receives education under reg. 12(2)(b).
  # DWP no longer treats the claimant as a qualifying young person under reg.
  # 28, so the claimant takes the ordinary route under reg. 12(2), and the
  # grant for their maintenance meets reg. 12(2)(b). No exception applies.
  period: 2026
  input:
    people:
      person1:
        age: 18
        current_education: POST_SECONDARY
        is_in_full_time_education: true
        has_education_maintenance_funding: true
        housing_benefit_reported: 6_000
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    is_qualifying_young_person_for_uc_education: [false]
    uc_receiving_education: [true]
    is_uc_eligible: false
    universal_credit: 0

- name: Case 33, a couple of 18-year-olds on a joint Working Tax Credit award both leave the qualifying young person route.
  # Tax Credits Act 2002 s. 3(3)(a): a couple claims jointly, so the award
  # belongs to both members, and SI 2014/1230 reg. 28 applies to each,
  # whichever member reports it.
  period: 2024
  input:
    people:
      person1:
        age: 18
        current_education: POST_SECONDARY
        is_in_full_time_education: true
        working_tax_credit_reported: 1_000
      person2:
        age: 18
        current_education: POST_SECONDARY
        is_in_full_time_education: true
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        region: NORTH_EAST
  output:
    is_qualifying_young_person_for_universal_credit: [true, true]
    is_qualifying_young_person_for_uc_education: [false, false]
    uc_receiving_education: [false, false]

- name: Case 34, the 18-year-old of case 32 claims when DWP moves them off legacy benefits and keeps the award.
  # The claimant reports Housing Benefit, so under SI 2014/1230 reg. 28 they
  # don't count as a qualifying young person, and they receive education
  # under reg. 12(2)(b), not reg. 12(1A). They fail the condition on the
  # migration day "because the person is undertaking a full-time course (see
  # regulation 12(2) and 13 ...)", so under reg. 60(1) it doesn't apply to
  # them while they continue the course.
  period: 2026
  input:
    people:
      person1:
        age: 18
        current_education: POST_SECONDARY
        is_in_full_time_education: true
        has_education_maintenance_funding: true
        housing_benefit_reported: 6_000
    benunits:
      benunit:
        members: [person1]
        claims_uc_at_legacy_closure: true
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    is_qualifying_young_person_for_universal_credit: [true]
    is_qualifying_young_person_for_uc_education: [false]
    uc_receiving_education: [true]
    uc_is_excepted_from_education_condition: [true]
    meets_uc_education_condition: [true]
    is_uc_eligible: true

- name: Case 35, Working Tax Credit reported by another adult in the benefit unit doesn't lift the condition from a qualifying young person.
  # The model's benefit unit can hold an adult who is neither claimant,
  # partner, child nor qualifying young person, and the model sums reported
  # Working Tax Credit over every member, so this family takes the reg. 60A
  # route. Under reg. 60A(1) the Secretary of State waives only "the
  # condition in section 4(1)(b) of the Act (claimant has not reached the
  # qualifying age for state pension credit)". The claimant, an 18-year-old
  # qualifying young person on a full-time non-advanced course, receives
  # education under reg. 12(1A). DWP applies reg. 60(1) only to a person on a
  # course under reg. 12(2), and the claimant has no reg. 14(1) exception:
  # the other adult isn't a child or qualifying young person (reg. 14(1)(c)).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 18
        current_education: POST_SECONDARY
        is_in_full_time_education: true
        is_claimant_or_partner: true
      person2:
        age: 25
        working_tax_credit_reported: 1_000
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [person1, person2]
        claims_uc_at_legacy_closure: true
    households:
      household:
        members: [person1, person2]
        region: NORTH_EAST
        tenure_type: OWNED_OUTRIGHT
  output:
    is_qualifying_young_person_for_uc_education: [true, false]
    uc_receiving_education: [true, false]
    uc_is_excepted_from_education_condition: [false, false]
    meets_uc_education_condition: [false, true]
    is_uc_eligible: false
    universal_credit: 0
