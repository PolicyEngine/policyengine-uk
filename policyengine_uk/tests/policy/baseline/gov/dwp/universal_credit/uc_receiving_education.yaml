        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [person1]
        region: NORTH_EAST
  output:
    uc_receiving_education: [false]
    meets_uc_education_condition: [true]
    is_uc_eligible: true

