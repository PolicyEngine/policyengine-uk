# Universal Credit's basic condition that a claimant "is not receiving
# education" (Welfare Reform Act 2012 s. 4(1)(d)), with the meaning in the
# Universal Credit Regulations 2013 reg. 12, the exceptions in reg. 14(1) and
# the couple rule in reg. 3(2), which DWP applies under its Advice for
# Decision Making E2016 where one member of a couple meets all the basic
# conditions.
#
# We calculate expected amounts from DWP's monthly rates for 2026 to 2027
# (Benefit and pension rates 2026 to 2027, gov.uk): standard allowance £338.58
# for a single claimant under 25, £424.90 for one aged 25 or over, £528.34 for
# joint claimants both under 25 and £666.97 where one or both are 25 or over;
# child element £351.88 for a first child born before 6 April 2017 and £303.94
# for any other child. Each award comes to 12 times the monthly amount, less
# 55% of earnings (reg. 22(1)(b)); no case has housing costs except cases 1
# and 2.
#
# In cases 36 to 41 we test, on one student in years from 2024 to 2027, the
# protection in the Universal Credit (Transitional Provisions) Regulations
# 2014 reg. 60, and in case 41 its Northern Ireland counterpart, reg. 61 of
# SR 2016/226. For 2025 to 2026 we take DWP's monthly standard allowance for a
# single claimant aged 25 or over, £400.14, from Benefit and pension rates
# 2025 to 2026 (gov.uk). The Department for Communities set the same amount
# in Northern Ireland (Social Security Benefits Up-rating Order (Northern
# Ireland) 2025, SR 2025/64, art. 32(2) and Schedule 13). DWP had published no
# rates for 2027 to 2028 by November 2026, so we assert no amount in case 38.

- name: Case 1, issue 2346, a full-time university student aged 19 gets no Universal Credit.
  # Reg. 12(2)(a): a full-time course of advanced education (a first degree,
  # reg. 12(3)(a)(ii)). No reg. 14(1) exception applies.
  period: 2026
  input:
    people:
      person1:
        age: 19
        current_education: TERTIARY
        is_in_full_time_education: true
        employment_income: 4_571
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        region: SOUTH_WEST
        rent: 5_857
        tenure_type: RENT_PRIVATELY
        brma: PLYMOUTH
  output:
    uc_receiving_education: [true]
    uc_is_excepted_from_education_condition: [false]
    meets_uc_education_condition: [false]
    is_uc_eligible: false
    universal_credit: 0

- name: Case 2, issue 2346, the same student not on a full-time course keeps the award.
  # 12 x £338.58 = £4,062.96 standard allowance, plus the housing costs
  # element at the Universal Credit LHA rate for Plymouth, £400 a month, so
  # £4,800, less 55% of £4,571 of pay = £2,514.05 (no work allowance without
  # a child or limited capability for work): £8,862.96 - £2,514.05 =
  # £6,348.91, as on main at 2da212abc.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 19
        current_education: TERTIARY
        is_in_full_time_education: false
        employment_income: 4_571
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        region: SOUTH_WEST
        rent: 5_857
        tenure_type: RENT_PRIVATELY
        brma: PLYMOUTH
  output:
    uc_receiving_education: [false]
    is_uc_eligible: true
    uc_standard_allowance: 4_062.96
    uc_housing_costs_element: 4_800
    uc_income_reduction: 2_514.05
    universal_credit: 6_348.91

- name: Case 3, a single parent on a full-time degree keeps the award.
  # Reg. 14(1)(c): responsible for a child. 12 x (£338.58 + £303.94) =
  # 12 x £642.52 = £7,710.24.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 22
        current_education: TERTIARY
        is_in_full_time_education: true
      person2:
        age: 3
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        region: NORTH_EAST
  output:
    uc_receiving_education: [true, false]
    uc_is_excepted_from_education_condition: [true, false]
    meets_uc_education_condition: [true, true]
    is_uc_eligible: true
    universal_credit: 7_710.24

- name: Case 4, a couple where one member is a full-time student and the other is not claim jointly.
  # Reg. 3(2)(b): one member doesn't meet the condition and has no
  # exception, and the other meets it, so they claim jointly at the couple
  # rate: 12 x £666.97 = £8,003.64. The model does not count student income
  # (reg. 68), and this couple has none.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        current_education: TERTIARY
        is_in_full_time_education: true
      person2:
        age: 30
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        region: NORTH_EAST
  output:
    meets_uc_education_condition: [false, true]
    is_uc_eligible: true
    uc_standard_allowance: 8_003.64
    universal_credit: 8_003.64

- name: Case 5, a couple who are both full-time students with no exception get no Universal Credit.
  # Under reg. 3(2)(b), the other member must meet the condition or have an
  # exception; neither does.
  period: 2026
  input:
    people:
      person1:
        age: 30
        current_education: TERTIARY
        is_in_full_time_education: true
      person2:
        age: 30
        current_education: TERTIARY
        is_in_full_time_education: true
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        region: NORTH_EAST
  output:
    meets_uc_education_condition: [false, false]
    is_uc_eligible: false
    universal_credit: 0

- name: Case 6, a student couple where the other member is responsible for a child keeps the award.
  # Reg. 14(1)(e)(i): both members receive education and the other member
  # is responsible for a child. The model places responsibility on the
  # benefit unit, so each member also has the reg. 14(1)(c) exception.
  # 12 x (£528.34 + £303.94) = 12 x £832.28 = £9,987.36.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 22
        current_education: TERTIARY
        is_in_full_time_education: true
      person2:
        age: 22
        current_education: TERTIARY
        is_in_full_time_education: true
      person3:
        age: 5
    benunits:
      benunit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        region: NORTH_EAST
  output:
    uc_receiving_education: [true, true, false]
    uc_is_excepted_from_education_condition: [true, true, false]
    is_uc_eligible: true
    universal_credit: 9_987.36

- name: Case 7, a mixed-age couple who are both full-time students get no Universal Credit under ADM E2016.
  # Under reg. 14(1)(f), the member who has reached the qualifying age for
  # State Pension Credit need not meet the education condition, but that
  # member doesn't meet the age condition. The younger member meets the age
  # condition but receives education with no exception. Under ADM E2016, DWP
  # accepts a joint claim only where one member meets all the basic
  # conditions, and neither does. Since 15 May 2019 the couple cannot get
  # Pension Credit either (SPCA 2002 s. 4(1A)).
  period: 2026
  input:
    people:
      person1:
        age: 70
        current_education: TERTIARY
        is_in_full_time_education: true
      person2:
        age: 60
        current_education: TERTIARY
        is_in_full_time_education: true
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        region: NORTH_EAST
  output:
    uc_receiving_education: [true, true]
    uc_is_excepted_from_education_condition: [true, false]
    meets_uc_education_condition: [true, false]
    is_uc_eligible: false
    universal_credit: 0

- name: Case 8, a mixed-age couple whose younger member alone is a full-time student get no Universal Credit under ADM E2016.
  # The older member meets the education condition and the younger the age
  # condition, but neither meets both. Under ADM E2016, DWP needs one member
  # to meet both.
  period: 2026
  input:
    people:
      person1:
        age: 70
      person2:
        age: 60
        current_education: TERTIARY
        is_in_full_time_education: true
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        region: NORTH_EAST
  output:
    meets_uc_education_condition: [true, false]
    is_uc_eligible: false
    universal_credit: 0

