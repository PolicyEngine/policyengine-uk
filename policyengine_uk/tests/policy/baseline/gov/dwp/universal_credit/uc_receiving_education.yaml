  # route. Under reg. 60A(1) the Secretary of State waives only "the
  # condition in section 4(1)(b) of the Act (claimant has not reached the
  # qualifying age for state pension credit)". The claimant, an 18-year-old
  # qualifying young person on a full-time non-advanced course, receives
  # education under reg. 12(1A). DWP applies reg. 60(1) only to a person on a
  # course under reg. 12(2), and the claimant has no reg. 14(1) exception:
  # the other adult isn't a child or qualifying young person (reg. 14(1)(c)).
  period: 2026
