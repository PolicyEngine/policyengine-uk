      scottish_pensioner:
        age: 75
        private_pension_income: 12_000
    benunits:
      welsh:
        members: [welsh_pensioner]
        would_claim_pc: false
      scottish:
        members: [scottish_pensioner]
        would_claim_pc: false
    households:
      welsh_household:
        members: [welsh_pensioner]
        country: WALES
        local_authority: CARDIFF
        savings: 12_600
      scottish_household:
        members: [scottish_pensioner]
        country: SCOTLAND
        local_authority: GLASGOW_CITY
        savings: 12_600
  output:
