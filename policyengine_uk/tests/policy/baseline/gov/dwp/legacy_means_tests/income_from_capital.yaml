        age: 16
        is_parent: true
        is_household_head: false
      father:
        age: 16
        is_parent: true
        is_household_head: false
      baby:
        age: 0
        is_household_head: false
    benunits:
      family:
        members: [head, mother, father, baby]
        claims_all_entitled_benefits: true
        would_claim_uc: false
    households:
      home:
        members: [head, mother, father, baby]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_head_applies_alone: [true]
    is_council_tax_reduction_applicant_or_partner: [true, false, false, false]
    income_tax: [0, 0, 0, 0]
    legacy_benefits_home_letting_income: [0]
    council_tax_reduction_home_letting_income: [4_160]
    council_tax_reduction_applicable_income: [16_160]
    council_tax_reduction_applicable_amount: [12_376]
    council_tax_reduction: 1_243.20

