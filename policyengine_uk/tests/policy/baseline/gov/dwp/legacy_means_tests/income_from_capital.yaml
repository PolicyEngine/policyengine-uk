  # (no reduction above 16,000). It is valued less 10% for the expenses of
  # sale (para 32(a)): 100,000 x 0.9 = 90,000.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        private_pension_income: 14_000
        property_income: 7_000
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        other_residential_property_value: 100_000
  output:
    council_tax_reduction_assessable_capital: 90_000
    council_tax_reduction: 0

