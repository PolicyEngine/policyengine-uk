# Income derived from capital in the legacy means tests.
#
# Income Support, Housing Benefit, Pension Credit and council tax reduction
# treat rent, interest and dividends as capital, not income (IS Regs 1987 reg
# 48(4) and Sch 9 para 22; HB Regs 2006 reg 46(4) and Sch 5 para 17; HB (SPC)
# Regs 2006 Sch 5 para 22; SPC Regs 2002 Sch IV para 18; CTR equivalents), and
# disregard tax only on income they take into account (IS Sch 9 para 1; HB Sch 5
# para 1; HB (SPC) reg 33(12); SPC reg 17(10)(a)). Rent for letting part of the
# home stays income less £20 a week per occupier (IS Sch 9 para 19; HB Sch 5
# para 22; HB (SPC) Sch 5 para 10; SPC Sch IV para 9).
#
# Tax figures: personal allowance £12,570; basic rate 20%; property allowance
# £1,000; personal savings allowance £1,000 for a basic-rate taxpayer;
# dividend allowance £500; dividend ordinary rate 8.75% in 2025-26 and 10.75%
# in 2026-27 (the model's rate); employee NI 8% above £12,570.

- name: Income Support, lone parent with earnings and rent from a let property
  # Earnings 10,000 use 10,000 of the personal allowance, so the remaining
  # 2,570 goes against taxable rent of 5,200 - 1,000 = 4,200. Tax on rent:
  # (4,200 - 2,570) x 20% = 326. Tax on earnings and NI: nil.
  # Main counted the rent and deducted its tax: 10,000 + 5,200 - 326 - 1,040.
  # The law counts neither: 10,000 - 1,040 (the £20 lone parent disregard).
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 10_000
        property_income: 5_200
        income_support_reported: 1
      child:
        age: 3
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    income_tax: [326, 0]
    property_income_tax: [326, 0]
    legacy_means_test_income_tax: [0, 0]
    income_support_applicable_income: 8_960

- name: Working-age Housing Benefit counts earnings net of the tax on them only
  # Earnings 14,000: tax (14,000 - 12,570) x 20% = 286; NI (14,000 - 12,570)
  # x 8% = 114.40. Rent 6,000: tax (6,000 - 1,000) x 20% = 1,000. Interest 500
  # is within the personal savings allowance. Dividends 1,000: (1,000 - 500) x
  # 8.75% = 43.75. Income tax 1,329.75, of which 286 is on counted income.
  # Applicable income: 14,000 - 286 - 114.40 - 260 (the £5 weekly disregard,
  # set as an input here) = 13,339.60.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 14_000
        property_income: 6_000
        savings_interest_income: 500
        dividend_income: 1_000
    benunits:
      benunit:
        members: [person]
        housing_benefit_applicable_income_disregard: 260
    households:
      household:
        members: [person]
  output:
    income_tax: 1_329.75
    property_income_tax: 1_000
    dividend_income_tax: 43.75
    savings_income_tax: 0
    legacy_means_test_income_tax: 286
    national_insurance: 114.40
    housing_benefit_applicable_income: 13_339.60

- name: Pension-age Housing Benefit counts rent from part of the home less £20 a week, not rent from other property
  # State Pension 12,000 and private pension 2,000 use the personal allowance
  # and leave 1,430 taxable: tax 286. Rent from other property 3,000: taxable
  # 2,000, tax 400, not deducted. Sub-tenant rent 5,200 (£100 a week): HB (SPC)
  # reg 29(1)(v) less Sch 5 para 10's £20, so 80 x 52 = 4,160.
  # Applicable income: 14,000 + 4,160 - 286 = 17,874 (no earnings disregard,
  # set to 0). Pension Credit income is the same 17,874, above the £238 x 52 =
  # 12,376 guarantee, so there is no guarantee credit passport.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 70
        state_pension: 12_000
        private_pension_income: 2_000
        property_income: 3_000
        sublet_income: 5_200
    benunits:
      benunit:
        members: [person]
        housing_benefit_applicable_income_disregard: 0
    households:
      household:
        members: [person]
  output:
    income_tax: 686
    legacy_means_test_income_tax: 286
    legacy_benefits_home_letting_income: 4_160
    pension_credit_income: 17_874
    guarantee_credit: 0
    housing_benefit_applicable_income: 17_874

- name: Pension Credit ignores rent from a let property
  # SPC Sch IV para 18. Rent 4,000: taxable 3,000, of which 3,000 - (12,570 -
  # 10,000) = 430 is taxed: 86, not deducted. Income 10,000 (State Pension).
  # Guarantee credit (238 - 10,000 / 52) x 52 = 12,376 - 10,000 = 2,376.
  # Savings credit: qualifying income 10,000 is below the threshold of
  # 208.07 x 52 = 10,819.64, so nil. Main counted the rent less its tax:
  # 13,914, which paid no guarantee credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 80
        state_pension: 10_000
        property_income: 4_000
    benunits:
      benunit:
        members: [person]
    households:
      household:
        members: [person]
  output:
    income_tax: 86
    legacy_means_test_income_tax: 0
    pension_credit_income: 10_000
    guarantee_credit: 2_376
    savings_credit: 0
    pension_credit: 2_376

- name: Pension Credit does not deduct tax on dividends
  # State Pension 12,000 leaves 570 of the personal allowance for dividends
  # 3,000: taxable 2,430 - 500 allowance = 1,930, at 10.75% = 207.475. That tax
  # is on income Pension Credit does not count, so it is not deducted.
  # Deemed income on savings 20,000: ceil((20,000 - 10,000) / 500) = £20 a week,
  # 1,040 a year. Income 12,000 + 1,040 = 13,040, above 12,376: no guarantee
  # credit. Savings credit: threshold 10,819.64; maximum 0.6 x (12,376 -
  # 10,819.64) = 933.816; phase-in 0.6 x (13,040 - 10,819.64) = 1,332.22,
  # capped at 933.816; less 0.4 x (13,040 - 12,376) = 265.60; 668.216.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 80
        state_pension: 12_000
        dividend_income: 3_000
    benunits:
      benunit:
        members: [person]
    households:
      household:
        members: [person]
        savings: 20_000
  output:
    dividend_income_tax: 207.475
    legacy_means_test_income_tax: 0
    pension_credit_deemed_income: 1_040
    pension_credit_income: 13_040
    guarantee_credit: 0
    savings_credit: 668.216
    pension_credit: 668.216

- name: English pensioner council tax reduction counts sub-tenant rent less £20, not other rent
  # SI 2012/2885 Sch 1 para 16(1)(v) and Sch 5 para 10 for the sub-tenant rent:
  # 2,600 / 52 = £50 a week, less £20 = 30 x 52 = 1,560. Sch 5 para 23
  # disregards actual income from capital, so the other rent 4,000 and its tax
  # 486 ((15,000 - 12,570) x 20%) are left out: 12,000 + 1,560 = 13,560.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 70
        state_pension: 12_000
        property_income: 4_000
        sublet_income: 2_600
    benunits:
      benunit:
        members: [person]
    households:
      household:
        members: [person]
        region: NORTH_EAST
  output:
    income_tax: 486
    legacy_means_test_income_tax: 0
    council_tax_reduction_applicable_income: 13_560

- name: Scottish working-age council tax reduction counts neither rent from property nor sub-tenant rent
  # SSI 2021/249 reg 57(1) lists unearned income in full; it includes the
