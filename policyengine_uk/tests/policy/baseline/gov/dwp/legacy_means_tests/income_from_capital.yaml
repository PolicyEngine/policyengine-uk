    council_tax_reduction_tariff_income: [312, 312]
    council_tax_reduction_applicable_income: [12_312, 12_312]

- name: A savings credit recipient's council tax reduction income does not fall when more sub-tenant rent ends the savings credit
  # Before: 3,130.54 of sub-tenant rent counts 2,090.54 (less 20 a week).
  # Pension Credit income is 10,000 + 2,000 + 2,090.54 + 520 deemed income
  # (savings 15,000: 10 steps of 500 over 10,000) = 14,610.54. Savings credit
  # = 60% x (238 - 208.07) x 52 - 40% x (14,610.54 - 238 x 52) = 933.816 -
  # 893.816 = 40.00, so the award is savings credit only and council tax
  # reduction counts 14,610.54 + 40 = 14,650.54 (SI 2012/2885 Sch 1 para 14).
  # CTR = 2,000 - 20% x (14,650.54 - 13,312) = 1,732.29.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 90
        state_pension: 10_000
        private_pension_income: 2_000
        sublet_income: 3_130.54
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 15_000
  output:
    pension_credit_income: 14_610.54
    savings_credit: 40
    in_receipt_of_savings_credit_only: true
    council_tax_reduction_tariff_income: 0
    council_tax_reduction_applicable_income: 14_650.54
    council_tax_reduction: 1_732.29

- name: The same pensioner with 200 more sub-tenant rent is assessed under the general rules with tariff income
  # 3,330.54 counts 2,290.54. Pension Credit income 14,810.54 leaves a savings
  # credit of 933.816 - 40% x (14,810.54 - 12,376) < 0, so nil. Under the
  # general rules: 12,000 + 2,290.54, no tax (12,000 is under the personal
  # allowance), plus tariff income on 15,000 (Sch 1 para 37): 10 a week, 520
  # a year = 14,810.54, more than the 14,650.54 counted before. CTR = 2,000 -
  # 20% x (14,810.54 - 13,312) = 1,700.29.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 90
        state_pension: 10_000
        private_pension_income: 2_000
        sublet_income: 3_330.54
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 15_000
  output:
    savings_credit: 0
    in_receipt_of_savings_credit_only: false
    council_tax_reduction_tariff_income: 520
    council_tax_reduction_applicable_income: 14_810.54
    council_tax_reduction: 1_700.29

- name: Oxford tests a Universal Credit recipient on the Universal Credit assessment of capital
  # The household's let property is worth 20,000 (18,000 after sale
  # expenses), but the claimant's Universal Credit capital is 15,000 (a
  # reported assessment). Oxford's Appendix 6 ignores capital already taken
  # into account for Universal Credit, so the 16,000 limit (paragraph 28)
  # does not exclude the claimant. UC: 424.90 - 36 x 4.35 (assumed yield on
  # 9,000 over 6,000) = 268.30 a month, 3,219.60 a year, 61.92 a week: band 1,
  # 100% of 2,000.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    benunits:
      benunit:
        members: [person]
        claims_all_entitled_benefits: true
        would_claim_uc: true
        uc_reported_capital: 15_000
    households:
      household:
        members: [person]
        country: ENGLAND
        local_authority: OXFORD
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        other_residential_property_value: 20_000
  output:
    universal_credit: 3_219.60
    council_tax_reduction_assessable_capital: 15_000
    oxford_council_tax_reduction: 2_000

- name: Oxford ignores the capital of an Income Support recipient
  # Appendix 6 also ignores capital already taken into account for Income
  # Support, so the household's 18,000 of property (after sale expenses) does
  # not exclude the claimant; Income Support recipients' income is nil for the
  # bands, so the award is 100% of 2,000.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    benunits:
      benunit:
        members: [person]
        claims_all_entitled_benefits: true
        would_claim_uc: false
