        local_authority: CARDIFF
        tenure_type: RENT_FROM_COUNCIL
        rent: 5_000
        council_tax: 1_500
        other_residential_property_value: 50_000
  output:
    council_tax_reduction_assessable_capital: 45_000
    council_tax_reduction_tariff_income: 2_080
    council_tax_reduction_applicable_income: 11_080
    council_tax_reduction: 0

