- name: A Scottish couple whose joint Universal Credit award is held only by people over pension age is under the pension-age scheme
  # SSI 2021/249 reg 3(2): the working-age scheme does not apply where the
  # award is held only by people over pensionable age. Universal Credit
  # itself needs a claimant under that age (UC Regs 2013 reg 3(2)(a)), so the
  # model treats such an award as not selecting the working-age scheme. SSI
  # 2012/319 counts the sub-tenant rent less 20 a week: (100 - 20) x 52 =
  # 4,160, plus the UC (1,000, an input) as the model counts it: 5,160. The
  # couple do not claim Pension Credit, whose guarantee credit would
  # otherwise disregard their whole income.
  period: 2026
  input:
    people:
      claimant:
        age: 71
        sublet_income: 5_200
      partner:
        age: 70
    benunits:
      benunit:
        members: [claimant, partner]
        universal_credit: 1_000
        would_claim_pc: false
    households:
      household:
        members: [claimant, partner]
        country: SCOTLAND
        local_authority: GLASGOW_CITY
  output:
    council_tax_reduction_pensioner: true
    council_tax_reduction_applicable_income: 5_160
