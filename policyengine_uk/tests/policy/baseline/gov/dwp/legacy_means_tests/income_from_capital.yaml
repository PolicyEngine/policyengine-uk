        country: ENGLAND
        local_authority: OXFORD
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        other_residential_property_value: 20_000
  output:
    council_tax_reduction_assessable_capital: 18_000
    oxford_council_tax_reduction: 2_000

- name: Wales uses the Secretary of State's capital for a Universal Credit recipient
  # WSI 2013/3029 Sch 6 para 9(6): with a UC award the authority uses the
  # Secretary of State's calculation of capital, 15,000 here (a reported
  # assessment), not the household's 18,000 of property after sale expenses.
  # The income includes the UC assumed yield (UC Regs 2013 reg 72): 36 x 4.35
  # x 12 = 1,879.20. Income 3,219.60 (UC, an input) + 1,879.20 = 5,098.80 is
  # below the applicable amount (6,000, an input), so CTR is the full 1,500.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    benunits:
      benunit:
        members: [person]
        claims_all_entitled_benefits: true
        universal_credit: 3_219.60
        uc_reported_capital: 15_000
        council_tax_reduction_applicable_amount: 6_000
    households:
      household:
        members: [person]
        country: WALES
        local_authority: CARDIFF
        tenure_type: OWNED_OUTRIGHT
        council_tax: 1_500
        other_residential_property_value: 20_000
  output:
    council_tax_reduction_assessable_capital: 15_000
    council_tax_reduction_tariff_income: 1_879.20
    council_tax_reduction_applicable_income: 5_098.80
    council_tax_reduction: 1_500

