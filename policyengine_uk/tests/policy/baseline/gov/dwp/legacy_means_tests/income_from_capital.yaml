# week under Sch 5 para 10), and the benefit unit's claimant's and partner's
# does not. In the first three cases below the head, aged 70, reached State
# Pension age after 1 April 2021, so her 2026-27 personal allowance is £238 a
# week: 238 x 52 = 12,376. Maidstone runs England's pensioner scheme:
# maximum 100% of the £2,000 council tax, withdrawn at 20% of income above the
# applicable amount. Her £12,000 private pension falls within the £12,570
# personal allowance, and the model taxes none of the rent: income tax nil.

- name: A household head applying alone counts her own rent from letting part of the home in council tax reduction
  # Rent 5,200 / 52 = 100 a week, less 20 = 80; 80 x 52 = 4,160.
