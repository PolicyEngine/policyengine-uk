  input:
    people:
      person:
        age: 40
        employment_income: 12_000
        property_income: 3_000
        sublet_income: 2_600
    benunits:
      benunit:
        members: [person]
    households:
      household:
        members: [person]
        region: SCOTLAND
  output:
    legacy_means_test_income_tax: 0
    council_tax_reduction_applicable_income: 12_000

