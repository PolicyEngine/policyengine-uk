- name: Before Pension Credit, the £4 disregard applied at every age
  # IS Regs 1987 Sch 9 para 19 as made; the pension-age £20 starts with
  # Pension Credit on 6 October 2003. (100 - 4) x 52 = 4,992.
  period: 2002
  input:
    age: 70
    sublet_income: 5_200
  output:
    legacy_benefits_home_letting_income: 4_992

- name: Tax reductions are shared between counted income and income from capital
  # ITA 2007 s.23: Step 4 tax is 286 on earnings ((14,000 - 12,570) x 20%) and
  # 1,000 on rent ((6,000 - 1,000) x 20%), 1,286 in all; Step 6 deducts a
  # 1,000 tax reduction. other_tax_credits records no source, so the model
  # shares it in proportion to the Step 4 tax (a stated convention: a credit
  # for foreign tax on the rent would relieve only the rent, TIOPA 2010
  # s.18(2)): the rent's share is 1,000 x 1,000 / 1,286 = 777.60, leaving
  # 222.40 of tax on rent. Income tax 286 less 222.40 = 63.60 is the tax on
  # counted income. Without the earnings the rent bears no tax, so all 286 is
  # tax the earnings cause and is deducted: HB applicable income is
  # 14,000 - 286 - 114.40 (NI) - 260 = 13,339.60. The sharing sets the tax
  # deducted only without earnings (the next case).
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 14_000
        property_income: 6_000
        property_rental_income: 6_000
        other_tax_credits: 1_000
    benunits:
      benunit:
        members: [person]
        housing_benefit_applicable_income_disregard: 260
    households:
      household:
        members: [person]
  output:
    income_tax: 286
    legacy_means_test_income_tax: 63.605
    legacy_means_test_uncounted_income_tax_without_earnings: 0
    legacy_means_test_deducted_income_tax: 286
    housing_benefit_applicable_income: 13_339.60

- name: Without earnings, the tax reductions shared with income from capital set the tax deducted
  # The same Step 4 and Step 6 figures with a private pension of 14,000 in
  # place of the earnings: 286 on the pension, 1,000 on the rent, a 1,000
  # reduction shared pro rata, income tax 286. Nobody has earnings, so the
  # tax on uncounted income is the 222.40 left on the rent, and the tax
  # deducted is 286 - 222.40 = 63.60, the tax on counted income. A pension
  # bears no NI. HB applicable income: 14,000 - 63.60 - 260 (the £5 weekly
  # disregard, set as an input) = 13,676.40.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        private_pension_income: 14_000
        property_income: 6_000
        property_rental_income: 6_000
        other_tax_credits: 1_000
    benunits:
      benunit:
        members: [person]
        housing_benefit_applicable_income_disregard: 260
    households:
      household:
        members: [person]
  output:
    income_tax: 286
    legacy_means_test_income_tax: 63.605
    legacy_means_test_uncounted_income_tax_without_earnings: 222.395
    legacy_means_test_deducted_income_tax: 63.605
    housing_benefit_applicable_income: 13_676.395

- name: Step 7 charges are not tax on counted income
  # The High Income Child Benefit Charge is added at Step 7 of ITA 2007 s.23
  # (s.30(1)); it is not tax calculated on any income the means tests count.
  # Earnings 20,000: (20,000 - 12,570) x 20% = 1,486. Income tax with a 500
  # charge is 1,986; 1,486 is deducted.
  period: 2025
  input:
    age: 40
    employment_income: 20_000
    CB_HITC: 500
  output:
    income_tax: 1_986
    legacy_means_test_income_tax: 1_486

- name: Tax on counted income is nil when Step 6 reductions exceed the Step 5 tax
  # Step 4 tax is 286 on earnings and 1,000 on rent. The 2,000 of Step 6
  # reductions are deducted only so far as there is Step 5 tax (ITA 2007
  # s.29(2)), so 1,286 is used and the tax left is nil; the 500 Step 7
  # charge is then added (s.23 Step 7), so the liability before the winter
  # fuel payment charge is 500. Rent bears 1,286 x 1,000 / 1,286 = 1,000 of
  # the reductions, so its tax after them is nil, and the helper gives
  # 500 - 0 - 500 (the charge) = 0.
  period: 2025
  input:
    age: 40
    employment_income: 14_000
    property_income: 6_000
    property_rental_income: 6_000
    other_tax_credits: 2_000
    CB_HITC: 500
  output:
    earned_income_tax: 286
    property_income_tax: 1_000
    income_tax_reductions: 1_286
    income_tax_before_winter_fuel_payment_charge: 500
    legacy_means_test_income_tax: 0

- name: Tax on counted income is floored at nil when the supplied tax is below the charges
  # An isolation of the helper's floor, not a statutory tax calculation: the
  # case above with the income tax before the winter fuel payment charge
  # supplied at nil rather than its statutory 500. The helper gives 0 - 0
  # (rent's tax after its share of reductions) - 500 (the charge), floored
  # at nil.
  period: 2025
  input:
    age: 40
    employment_income: 14_000
    property_income: 6_000
    property_rental_income: 6_000
    other_tax_credits: 2_000
    CB_HITC: 500
    income_tax_before_winter_fuel_payment_charge: 0
  output:
    earned_income_tax: 286
    property_income_tax: 1_000
    legacy_means_test_income_tax: 0

- name: The finance-cost reduction comes off the tax on rent first
  # ITTOIA 2005 ss.274A-274AA give the reduction on the property business's
  # finance costs, at most its profits, so it relieves the tax on rent. The
  # tax components are supplied: 286 on earnings, 1,000 on rent, a 400
  # finance-cost reduction. Income tax 1,286 - 400 = 886; the rent's tax
  # after the reduction is 600, so the tax on counted income is 886 - 600 =
  # 286 (shared pro rata it would be 197.04).
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    earned_income_tax: 286
    property_income_tax: 1_000
    property_finance_cost_relief: 400
  output:
    income_tax: 886
    legacy_means_test_income_tax: 286

- name: Other reductions are shared pro rata after the finance-cost reduction
  # As above with 500 of other tax credits. The finance-cost reduction leaves
  # 286 + 600 = 886 of tax; the 500 is shared in proportion to it: counted
  # income bears 500 x 286 / 886 = 161.40, leaving 124.60. Income tax is
  # 1,286 - 900 = 386, and 386 - (600 - 500 x 600 / 886 = 261.40) = 124.60.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    earned_income_tax: 286
    property_income_tax: 1_000
    property_finance_cost_relief: 400
    other_tax_credits: 500
  output:
    income_tax: 386
    legacy_means_test_income_tax: 124.60

- name: Working-age Housing Benefit award with rent from a let property
  # A continuing award (2025-26). Earnings 10,000 use 10,000 of the personal
  # allowance; taxable rent 5,000 - 1,000 = 4,000, of which 4,000 - 2,570 =
  # 1,430 is taxed: 286, all on rent. Without the earnings the rent bears no
  # tax, so the 286 is tax the earnings cause and is deducted. NI is nil
  # below 12,570. Applicable income: 10,000 - 286 - 260 (the £5 disregard, as
  # an input) = 9,454. With the single 25-or-over personal allowance of
  # £92.05 a week (4,786.60, an input here), HB = 6,000 - 65% x (9,454 -
  # 4,786.60) = 6,000 - 3,033.81 = 2,966.19. Counting the rent would leave
  # nothing.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 10_000
        property_income: 5_000
        property_rental_income: 5_000
        housing_benefit_reported: 1
    benunits:
      benunit:
        members: [person]
        would_claim_uc: false
        housing_benefit_applicable_income_disregard: 260
        housing_benefit_applicable_amount: 4_786.60
    households:
      household:
        members: [person]
        tenure_type: RENT_FROM_COUNCIL
        rent: 6_000
        region: NORTH_EAST
  output:
    property_income_tax: 286
    legacy_means_test_income_tax: 0
    legacy_means_test_deducted_income_tax: 286
    housing_benefit_applicable_income: 9_454
    housing_benefit: 2_966.19

- name: An English pensioner with a let property worth more than £16,000 gets no council tax reduction
