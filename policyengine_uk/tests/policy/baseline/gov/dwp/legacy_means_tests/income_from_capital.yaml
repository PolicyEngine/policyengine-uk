        members: [pensioner]
        claims_all_entitled_benefits: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        other_residential_property_value: 100_000
  output:
