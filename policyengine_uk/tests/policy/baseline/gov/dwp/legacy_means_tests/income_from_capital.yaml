- name: A household head applying alone keeps her tariff income when the couple she lives with gets Pension Credit
  # The head, aged 85, reached State Pension age before 1 April 2021, so her
  # allowance is 256 x 52 = 13,312. A pensioner couple flagged as parents
  # forms the benefit unit's claimant and partner, and gets guarantee credit.
  # That award is theirs, so the head's capital and tariff income follow the
  # general rule: household savings 14,000 stand in for her capital. Tariff
  # (Sch 1 para 37): £1 a week for each £500, or part, over £10,000:
  # 4,000 / 500 = 8; 8 x 52 = 416. Tax on her pension: (13,000 - 12,570)
  # x 20% = 86. Income 13,000 - 86 + 416 = 13,330. CTR 2,000 - 20% x
  # (13,330 - 13,312) = 1,996.40 before the non-dependant deduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 85
        is_household_head: true
        private_pension_income: 13_000
      older_partner:
        age: 67
        is_parent: true
        is_household_head: false
      younger_partner:
        age: 66
        is_parent: true
        is_household_head: false
    benunits:
      family:
        members: [head, older_partner, younger_partner]
        claims_all_entitled_benefits: true
        would_claim_uc: false
    households:
      home:
        members: [head, older_partner, younger_partner]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 14_000
  output:
    is_claimant_or_partner: [false, true, true]
    council_tax_reduction_head_applies_alone: [true]
    in_receipt_of_guarantee_credit: [true]
    council_tax_reduction_assessable_capital: [14_000]
    council_tax_reduction_tariff_income: [416]
    council_tax_reduction_applicable_income: [13_330]
    council_tax_reduction_applicable_amount: [13_312]
    # The couple in her benefit unit are the head's non-dependants (SI
    # 2012/2885 reg 9(2)(a)). The model exempts the member to whom DWP pays
    # the Pension Credit (is_on_pension_credit) and not the other, so the
    # council deducts England's lowest pensioner amount, 5.20 x 52 = 270.40,
    # for the couple, neither of whom works.
    council_tax_reduction_non_dep_deduction_exempt: [false, true, false]
    council_tax_reduction_non_dep_deductions: [270.40]
    # 1,996.40 - 270.40 = 1,726.
    council_tax_reduction: 1_726

