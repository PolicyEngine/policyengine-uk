    people:
      householder:
        age: 45
        is_household_head: true
      boarder:
        age: 30
        is_household_head: false
        rent_paid_as_boarder: 780
    benunits:
      householder_unit:
        members: [householder]
      boarder_unit:
        members: [boarder]
    households:
      household:
        members: [householder, boarder]
  output:
    legacy_benefits_home_letting_income: [0, 0]

- name: Pension-age householder, a lodger couple each paying £60 a week
  # Per person: (60 - 20) + (60 - 20) = 80 a week; x 52 = 4,160.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 70
        is_household_head: true
      lodger_1:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 3_120
      lodger_2:
        age: 32
        is_household_head: false
        rent_paid_as_lodger: 3_120
    benunits:
      householder_unit:
        members: [householder]
      lodger_couple:
        members: [lodger_1, lodger_2]
    households:
      household:
        members: [householder, lodger_1, lodger_2]
  output:
    legacy_benefits_home_letting_income: [4_160, 0]

- name: Working-age householder, the same lodger couple
