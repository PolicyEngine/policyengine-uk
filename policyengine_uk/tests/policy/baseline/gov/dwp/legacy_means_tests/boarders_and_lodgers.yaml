# Rent from boarders and lodgers living in the household, in the legacy means
# tests (legacy_benefits_home_letting_income, counted by Income Support,
# Housing Benefit, Pension Credit and council tax reduction).
#
# Board and lodging, per boarder: the first £20 a week is disregarded and half
# the excess (IS Sch 9 para 20; HB Sch 5 para 42; HB (SPC) Sch 5 para 9; SPC Sch
# IV para 8; CTR (England) Sch 5 para 9). Lodging only: £20 a week is
# disregarded. Claimants over the qualifying age for State Pension Credit
# disregard it from "the amount paid by that person" (HB (SPC) Sch 5 para 10;
# SPC Sch IV para 9); working-age claimants from the aggregate paid by "that
# person or a member of his family" (HB Sch 5 para 22; IS Sch 9 para 19), £4
# before 7 April 2008. Universal Credit does not count this rent (UC Regs 2013
# reg 66(1); ADM H5112).

- name: Pension-age householder, one lodger paying £100 a week
  # (100 - 20) x 52 = 4,160.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 70
        is_household_head: true
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 5_200
    benunits:
      householder_unit:
        members: [householder]
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [householder, lodger]
  output:
    legacy_benefits_home_letting_income: [4_160, 0]

- name: One boarder paying £100 a week
  # 0.5 x (100 - 20) x 52 = 2,080.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 70
        is_household_head: true
      boarder:
        age: 30
        is_household_head: false
        rent_paid_as_boarder: 5_200
    benunits:
      householder_unit:
        members: [householder]
      boarder_unit:
        members: [boarder]
    households:
      household:
        members: [householder, boarder]
  output:
    legacy_benefits_home_letting_income: [2_080, 0]

- name: A boarder paying £15 a week is disregarded in full
  # 780 / 52 = 15 < 20.
  period: 2026
  absolute_error_margin: 0.01
