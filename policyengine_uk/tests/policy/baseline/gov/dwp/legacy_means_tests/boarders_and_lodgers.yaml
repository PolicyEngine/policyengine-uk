  # it through taxable_property_income only: 20,000 + 2,500 = 22,500.
  # Household post-tax income adds it once through gross_taxable_inputs:
  # 22,500 less income tax (1,486 + 500 = 1,986) and NI 594.40 = 19,919.60.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 45
        is_household_head: true
        employment_income: 20_000
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 10_000
    benunits:
      householder_unit:
        members: [householder]
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [householder, lodger]
        region: NORTH_WEST
  output:
    taxable_rent_a_room_income: [2_500, 0]
    taxable_property_income: [2_500, 0]
    total_income: [22_500, 0]
    adjusted_net_income: [22_500, 0]
    gross_taxable_inputs: [22_500, 0]
    post_tax_income: 19_919.60

- name: CTR on the Universal Credit route with pay deducts the extra tax earnings cause on uncounted rent
  # 2026-27, England, working age, with a Universal Credit award (set as an
  # input; Universal Credit itself is nil at this income). Pay 30,000: tax
  # (30,000 - 12,570) x 20% = 3,486, NI 17,430 x 8% = 1,394.40. A lodger pays
  # 15,000: taxable rent-a-room income 7,500, taxed at 20%: 1,500. The route
  # does not count the rent. Without the pay, 7,500 falls inside the 12,570
  # personal allowance, so the rent bears no tax and nil comes off; the
  # 1,500 that earnings cause stays deducted. Income: 30,000 - (3,486 +
  # 1,500) - 1,394.40 = 23,619.60, which is 1,500 below the 25,119.60
  # without the lodger.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 45
        is_household_head: true
        employment_income: 30_000
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 15_000
    benunits:
      householder_unit:
        members: [householder]
        council_tax_reduction_universal_credit_award: true
      lodger_unit:
        members: [lodger]
        would_claim_uc: false
    households:
      household:
        members: [householder, lodger]
        region: NORTH_WEST
  output:
    rent_a_room_income_tax: [1_500, 0]
    rent_a_room_income_tax_without_earnings: [0, 0]
    legacy_means_test_deducted_income_tax: [4_986, 0]
    council_tax_reduction_applicable_income: [23_619.60, 0]

- name: CTR on the Universal Credit route without pay keeps uncounted rent out of income
  # The same household without the pay. Taxable rent-a-room income 7,500
  # falls inside the personal allowance, so there is no tax, and the route
  # counts neither the rent nor any tax on it. Income is the Universal Credit
  # award alone, the single standard allowance of 424.90 a month: 424.90 x 12
  # = 5,098.80. The general rules would have added
  # (15,000 / 52 - 20) x 52 = 13,960.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 45
        is_household_head: true
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 15_000
    benunits:
      householder_unit:
        members: [householder]
        council_tax_reduction_universal_credit_award: true
      lodger_unit:
        members: [lodger]
        would_claim_uc: false
    households:
      household:
        members: [householder, lodger]
        region: NORTH_WEST
  output:
    legacy_benefits_home_letting_income: [13_960, 0]
    rent_a_room_income_tax_without_earnings: [0, 0]
    universal_credit: [5_098.80, 0]
    council_tax_reduction_applicable_income: [5_098.80, 0]

- name: Scottish working-age CTR with pay deducts the extra tax earnings cause on uncounted rent
