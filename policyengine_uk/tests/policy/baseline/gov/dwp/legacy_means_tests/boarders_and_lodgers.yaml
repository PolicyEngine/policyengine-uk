  # taxable falls at 21%: 1,575. NI 17,430 x 8% = 1,394.40. The scheme does
  # not list the rent (SSI 2021/249 reg 57(1)). Without the pay the rent
  # bears no tax, so nil comes off; the deduction keeps the rent's whole
  # 1,575 at Scottish rates. Income: 30,000 - (3,451.07 + 1,575) - 1,394.40
  # = 23,579.53, which is 1,575 below the 25,154.53 without the lodger.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 45
        is_household_head: true
        employment_income: 30_000
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 15_000
    benunits:
      householder_unit:
        members: [householder]
        would_claim_uc: false
      lodger_unit:
        members: [lodger]
        would_claim_uc: false
    households:
      household:
        members: [householder, lodger]
        region: SCOTLAND
  output:
    earned_income_tax: [3_451.07, 0]
    rent_a_room_income_tax: [1_575, 0]
    rent_a_room_income_tax_without_earnings: [0, 0]
    legacy_means_test_deducted_income_tax: [5_026.07, 0]
    council_tax_reduction_applicable_income: [23_579.53, 0]

- name: Scottish working-age CTR without pay keeps uncounted rent out of income
