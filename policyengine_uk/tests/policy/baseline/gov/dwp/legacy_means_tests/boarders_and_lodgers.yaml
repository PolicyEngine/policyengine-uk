- name: Tax on counted rent from a lodger is deducted in the legacy means tests
  # 2026-27. Private pension 15,000: (15,000 - 12,570) x 20% = 486. Lodger rent
  # 10,400 is rent-a-room receipts; 10,400 - 7,500 = 2,900 taxable, x 20% =
  # 580. Income tax 1,066, all of it on income the means tests count (IS Sch 9
  # para 1; HB Sch 5 para 1; SPC reg 17), so all of it is deducted. Counted
  # rent: (200 - 20) x 52 = 9,360.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 70
        is_household_head: true
        private_pension_income: 15_000
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 10_400
    benunits:
      householder_unit:
        members: [householder]
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [householder, lodger]
  output:
    income_tax: [1_066, 0]
    property_income_tax: [580, 0]
    rent_a_room_income_tax: [580, 0]
    legacy_means_test_income_tax: [1_066, 0]
    legacy_benefits_home_letting_income: [9_360, 0]

- name: Tax on counted rent-a-room income shares a tax reduction pro rata
  # 2026-27. Step 4 tax: private pension (36,000 - 12,570) x 20% = 4,686;
  # rent-a-room income (10,400 - 7,500) x 20% = 580; savings interest
  # (3,000 - 1,000 personal savings allowance) x 20% = 400, with no starting
  # rate for savings because non-savings income exceeds the allowances by more
  # than £5,000; total 5,666. The married couple's allowance reduction
  # (11,000 x 10% = 1,100, set as an input) leaves income tax of 4,566
  # before the winter fuel payment charge, which the means tests never deduct.
  # The tests count the pension and the rent but treat interest as capital: the
  # capital tax of 400 keeps its share of the reduction,
  # 1,100 x 400 / 5,666 = 77.66, so 322.34 is not deducted, and the tax
  # deducted is 4,566 - 322.34 = 4,243.66.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 70
        is_household_head: true
        private_pension_income: 36_000
        savings_interest_income: 3_000
        married_couples_allowance: 11_000
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 10_400
    benunits:
      householder_unit:
        members: [householder]
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [householder, lodger]
  output:
    rent_a_room_income_tax: [580, 0]
    savings_income_tax: [400, 0]
    capped_mcad: [1_100, 0]
    income_tax_before_winter_fuel_payment_charge: [4_566, 0]
    legacy_means_test_income_tax: [4_243.66, 0]

- name: UC does not deduct the tax on rent it does not count
  # 2026-27, England. Earnings 20,000: tax (20,000 - 12,570) x 20% = 1,486,
  # NI 7,430 x 8% = 594.40. Lodger rent 10,000 gives taxable rent-a-room income
  # 2,500 and tax 500, so income tax is 1,986. UC counts neither the rent
  # (reg 66(1)) nor its tax (reg 55(5)(b)). uc_income_tax_on_earnings takes
  # earnings as the lowest slice, so the taxable rent raises
  # earned_taxable_income and the other income above earnings alike and the
  # tax on earnings stays 1,486: earned income 20,000 - 1,486 - 594.40 =
  # 17,919.60, as without the lodger.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 45
        is_household_head: true
        employment_income: 20_000
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 10_000
    benunits:
      householder_unit:
        members: [householder]
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [householder, lodger]
        region: NORTH_WEST
  output:
    income_tax: [1_986, 0]
    rent_a_room_income_tax_after_reductions: [500, 0]
    uc_income_tax_on_earnings: [1_486, 0]
    uc_earned_income: [17_919.60, 0]

- name: Welsh CTR for a UC recipient does not add rent from a lodger
  # WSI 2013/3029 Sch 6 para 9: with a UC award, income is the UC assessment,
  # which excludes this rent. Here UC (5,000, set as an input) is the only
  # income, so CTR applicable income is 5,000, not 5,000 + 4,160.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 45
        is_household_head: true
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 5_200
    benunits:
      householder_unit:
        members: [householder]
        universal_credit: 5_000
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [householder, lodger]
        region: WALES
  output:
    legacy_benefits_home_letting_income: [4_160, 0]
    council_tax_reduction_applicable_income: [5_000, 0]

- name: The finance-cost reduction comes off no more than the property tax on income from capital
  # 2026-27, England. Private pension 30,000: tax (30,000 - 12,570) x 20% =
  # 3,486. Property income 2,000 with finance costs 10,000, and a lodger
  # paying 15,000: taxable rent-a-room income 15,000 - 7,500 = 7,500, so
  # taxable property income 9,500 and property income tax 1,900, of which
  # 7,500 / 9,500 x 1,900 = 1,500 falls on the rent-a-room income. The
  # finance-cost reduction is 20% x min(10,000, 9,500) = 1,900. Counted tax
  # 3,486 + 1,500 = 4,986; capital tax 1,900 - 1,500 = 400. The reduction
  # comes off the capital side's 400 only; the other 1,500 is shared in
  # proportion to the Step 4 tax left (4,986 counted, 0 capital). So the
  # capital side keeps nil and the tax on counted income is
  # 4,986 - 1,500 = 3,486, which is the whole income tax. The rent-a-room
  # tax keeps 1,500 - 1,500 x 1,500 / 4,986 = 1,048.74.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 50
        is_household_head: true
        private_pension_income: 30_000
        property_income: 2_000
        property_finance_costs: 10_000
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 15_000
    benunits:
      householder_unit:
        members: [householder]
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [householder, lodger]
        region: LONDON
  output:
    taxable_property_income: [9_500, 0]
    property_income_tax: [1_900, 0]
    rent_a_room_income_tax: [1_500, 0]
    property_finance_cost_relief: [1_900, 0]
    income_tax_before_winter_fuel_payment_charge: [3_486, 0]
    legacy_means_test_income_tax: [3_486, 0]
    rent_a_room_income_tax_after_reductions: [1_048.74, 0]

- name: Taxable rent-a-room income reaches total income and adjusted net income once
  # 2026-27, England. Earnings 20,000 and a lodger paying 10,000: taxable
