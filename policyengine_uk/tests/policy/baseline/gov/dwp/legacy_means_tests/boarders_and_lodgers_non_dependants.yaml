        current_education: UPPER_SECONDARY
    benunits:
      host_unit:
        members: [host]
        would_claim_uc: true
      daughter_unit:
        members: [daughter, grandchild]
    households:
      household:
        members: [host, daughter, grandchild]
        rent: 24_000
        tenure_type: RENT_PRIVATELY
