- name: A lodger's son keeps the Pension Credit exemption from the UC housing cost contribution
  # England, 2026-27. The household head (40) claims Universal Credit. The
  # lodger (75) pays 5,200 a year and has a State Pension of 6,000 a year;
  # her son (40), in her benefit unit, pays nothing and earns 15,600 over 20
  # hours. He is a non-dependant, but no housing cost contribution applies
  # where the non-dependant's family receives Pension Credit (UC Regs 2013
  # Sch 4 para 16). Her guarantee credit is the 238 a week standard minimum
  # guarantee less her income: 238 x 52 - 6,000 = 6,376 (her son's earnings
  # are not hers). uc_non_dep_receives_pension_credit computes it with her
  # family's UC housing element at nil; a family over the qualifying age
  # claims no UC, so that is her actual award.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 40
        is_household_head: true
        is_claimant_or_partner: true
      lodger:
        age: 75
        is_household_head: false
        is_claimant_or_partner: true
        rent_paid_as_lodger: 5_200
        state_pension: 6_000
      son:
        age: 40
        is_household_head: false
        is_claimant_or_partner: false
        employment_income: 15_600
        weekly_hours: 20
    benunits:
      householder_unit:
        members: [householder]
        would_claim_uc: true
      lodger_unit:
        members: [lodger, son]
    households:
      household:
        members: [householder, lodger, son]
        rent: 10_400
        tenure_type: RENT_FROM_COUNCIL
        region: LONDON
  output:
    is_non_dependant_of_household_head: [false, false, true]
    pension_credit: [0, 6_376]
    uc_non_dep_receives_pension_credit: [false, true]
    uc_individual_non_dep_deduction_eligible: [false, false, false]
    uc_non_dep_deductions: [0, 0]

# Universal Credit's extended benefit unit. Under UC Regs 2013 Sch 4 para
# 9(2)(g), DWP leaves out of the renter's non-dependants "a child or
# qualifying young person for whom no-one in the renter's extended benefit
# unit is responsible". DWP leaves a boarder or lodger out of that unit (para
# 9(2)(d)), so their child or qualifying young person leaves it too and
# supplies no bedroom under paras 8 and 10. A non-dependant belongs to the
# unit (para 9(1)(c)), so the non-dependant's child stays in it. Housing
# Benefit and council tax reduction apply their own definitions, and the
# model leaves them unchanged.

- name: A commercial lodger's qualifying young person gives the host no Universal Credit bedroom
  # London (Inner South East London BRMA), 2026-27. The host (40) rents
  # privately for 18,000 a year and earns 15,000. An unrelated lodger (40)
  # earns 20,000 and pays the host 5,200 a year on a commercial basis. The
  # lodger's child (18), in the lodger's benefit unit and in non-advanced
  # education, pays nothing and is the lodger's qualifying young person.
  # Nobody in the host's extended benefit unit is responsible for them, so
  # DWP leaves them out under para 9(2)(g), and the host gets one bedroom
  # (para 10(1)(a)). The one-bedroom monthly LHA rate, 1,295.50, caps the rent at
  # 1,295.50 x 12 = 15,546. The maximum amount adds the standard allowance,
  # 424.90 x 12 = 5,098.80, for 20,644.80. The host has no work allowance,
  # so DWP takes 55% of net earnings, 15,000 - 486 income tax - 194.40
  # National Insurance = 14,319.60, which comes to 7,875.78. Universal
  # Credit: 20,644.80 - 7,875.78 = 12,769.02. Counting the young person as a
  # non-dependant would give two bedrooms, a housing element of the whole
  # 18,000 rent (the two-bedroom rate, 1,550 a month, exceeds it) and
  # Universal Credit of 15,223.02.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      host:
        age: 40
        is_household_head: true
        is_claimant_or_partner: true
        employment_income: 15_000
      lodger:
        age: 40
        is_household_head: false
        is_claimant_or_partner: true
        employment_income: 20_000
        rent_paid_as_lodger: 5_200
      young_person:
        age: 18
        is_household_head: false
        is_claimant_or_partner: false
        current_education: UPPER_SECONDARY
    benunits:
      host_unit:
        members: [host]
        would_claim_uc: true
      lodger_unit:
        members: [lodger, young_person]
    households:
      household:
        members: [host, lodger, young_person]
        rent: 18_000
        tenure_type: RENT_PRIVATELY
        region: LONDON
  output:
    benunits:
      host_unit:
        LHA_allowed_bedrooms: 1
        uc_housing_costs_element: 15_546
        universal_credit: 12_769.02
    pays_rent_to_householder: [false, true, false]
    is_qualifying_young_person_for_universal_credit: [false, false, true]
    is_non_dependant_of_household_head: [false, false, true]
    is_non_dependant_of_household_head_for_universal_credit: [false, false, false]

