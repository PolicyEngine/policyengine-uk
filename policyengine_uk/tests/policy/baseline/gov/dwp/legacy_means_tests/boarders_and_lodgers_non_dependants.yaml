- name: A commercial lodger's child leaves a householder under 35 on the Universal Credit shared accommodation rate
  # London (Inner South East London), 2026-27. The household head (25)
  # rents privately for 18,000 a year, earns 15,000 and claims Universal
  # Credit. An unrelated lodger (40) pays 5,200 a year and lives there with
  # a child (10) in the lodger's benefit unit. Nobody in the head's extended
  # benefit unit has responsibility for the child, so the child is not the
  # head's non-dependant for Universal Credit. The head, single and under
  # 35, has no non-dependant, so the shared accommodation rate of 7,800 a
  # year caps the rent. Universal Credit: 5,098.80 + 7,800 - 7,875.78 =
  # 5,023.02, with the earned income of the first Universal Credit case in
  # this group.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 25
        is_household_head: true
        is_claimant_or_partner: true
        employment_income: 15_000
      lodger:
        age: 40
        is_household_head: false
        is_claimant_or_partner: true
        rent_paid_as_lodger: 5_200
      child:
        age: 10
        is_household_head: false
        is_claimant_or_partner: false
    benunits:
      householder_unit:
        members: [householder]
        would_claim_uc: true
      lodger_unit:
        members: [lodger, child]
    households:
      household:
        members: [householder, lodger, child]
        rent: 18_000
        tenure_type: RENT_PRIVATELY
        region: LONDON
  output:
    is_non_dependant_of_household_head: [false, false, true]
    is_uc_non_dependant_of_household_head: [false, false, false]
    benunits:
      householder_unit:
        lha_renter_has_non_dependant: false
        is_lha_shared_accommodation_rate_specified_renter: true
        LHA_allowed_bedrooms: 1
        uc_housing_costs_element: 7_800
        universal_credit: 5_023.02

# Council tax reduction for people over the qualifying age for State Pension
# Credit in Scotland: SSI 2012/319 reg 3. In reg 3(1) the Scottish Ministers
# define a non-dependant as "any person, except someone to whom paragraph (2)
# applies, who normally resides with the applicant", and in reg 3(2)(e) they
# except "any person who is liable to make payments on a commercial basis to
# the applicant or any partner of the applicant in respect of the person's
# occupation of the dwelling". The model treats the payer's partner as liable
# too (pays_rent_to_householder); whether the partner is liable turns on the
# agreement, which the data do not record.

- name: Scottish pension-age council tax reduction leaves out a lodger and partner but not their son or child
  # Edinburgh, 2026-27. The household head (70) has a State Pension of
  # 10,000 and owns the home. An unrelated lodger (50) pays the head 5,200 a
  # year; the lodger's partner (50) pays nothing; their son (30), who is
  # neither claimant nor partner, pays nothing and earns 5,200 over 20 hours
  # a week; their child (10) pays nothing. The head falls under the
  # pension-age scheme. The lodger falls within reg 3(2)(e), and the model
  # treats the partner as liable as well, so neither is a non-dependant. The
  # son and the child sit in the lodger's benefit unit, not the head's (reg
  # 3(2)(a)), and owe the head nothing, so both count as non-dependants under
  # reg 3(1);
  # the model flags the son, at 18 or over, for a deduction, and the child,
  # under 18, for none.
  period: 2026
  input:
    people:
      householder:
        age: 70
        is_household_head: true
        is_claimant_or_partner: true
        state_pension: 10_000
      lodger:
        age: 50
        is_household_head: false
        is_claimant_or_partner: true
        rent_paid_as_lodger: 5_200
      partner:
        age: 50
        is_household_head: false
        is_claimant_or_partner: true
      son:
        age: 30
        is_household_head: false
        is_claimant_or_partner: false
        employment_income: 5_200
        weekly_hours: 20
      child:
        age: 10
        is_household_head: false
        is_claimant_or_partner: false
    benunits:
      householder_unit:
        members: [householder]
        claims_all_entitled_benefits: true
      lodger_unit:
        members: [lodger, partner, son, child]
    households:
      household:
        members: [householder, lodger, partner, son, child]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
        tenure_type: OWNED_OUTRIGHT
  output:
    council_tax_reduction_pensioner: [true, false]
    pays_rent_to_householder: [false, true, true, false, false]
    is_non_dependant_of_household_head: [false, false, false, true, true]
    council_tax_reduction_individual_non_dep_deduction_eligible: [false, false, false, true, false]
