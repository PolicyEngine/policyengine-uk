  # her son (40), in her benefit unit, pays nothing and earns 15,600 over 20
  # hours. He is a non-dependant, but no housing cost contribution applies
  # where the non-dependant's family receives Pension Credit (UC Regs 2013
  # Sch 4 para 16). Her guarantee credit is the 238 a week standard minimum
  # guarantee less her income: 238 x 52 - 6,000 = 6,376 (her son's earnings
  # are not hers). uc_non_dep_receives_pension_credit computes it with her
  # family's UC housing element at nil; a family over the qualifying age
  # claims no UC, so that is her actual award.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 40
        is_household_head: true
        is_claimant_or_partner: true
      lodger:
        age: 75
        is_household_head: false
        is_claimant_or_partner: true
        rent_paid_as_lodger: 5_200
        state_pension: 6_000
      son:
        age: 40
        is_household_head: false
        is_claimant_or_partner: false
        employment_income: 15_600
        weekly_hours: 20
    benunits:
      householder_unit:
        members: [householder]
        would_claim_uc: true
      lodger_unit:
        members: [lodger, son]
    households:
      household:
        members: [householder, lodger, son]
        rent: 10_400
        tenure_type: RENT_FROM_COUNCIL
        region: LONDON
  output:
    is_non_dependant_of_household_head: [false, false, true]
    pension_credit: [0, 6_376]
    uc_non_dep_receives_pension_credit: [false, true]
    uc_individual_non_dep_deduction_eligible: [false, false, false]
    uc_non_dep_deductions: [0, 0]

# Universal Credit's extended benefit unit (UC Regs 2013 Sch 4 paras 8 to
# 10). Under para 9(2)(g), DWP leaves out of the renter's non-dependants "a
# child or qualifying young person for whom no-one in the renter's extended
# benefit unit is responsible". DWP leaves a boarder or lodger out of that
# unit (para 9(2)(d)), and the model leaves out their partner too, so nobody
# in it is responsible for their child or qualifying young person, who
# supplies no bedroom under para 10. A non-paying parent belongs to the unit,
# so their child stays a non-dependant. The Housing Benefit and council tax
# reduction formulas keep their own definitions
# (is_non_dependant_of_household_head).

- name: A commercial lodger's qualifying young person gives the householder no Universal Credit bedroom
  # London (Inner South East London), 2026-27. The household head (40)
  # rents privately for 18,000 a year, earns 15,000 and claims Universal
  # Credit. An unrelated lodger (40) earns 20,000 and pays the head 5,200 a
  # year on a commercial basis. The lodger's son (18), in the lodger's
  # benefit unit, studies for A levels, so the model counts him as a
  # qualifying young person. The lodger has main responsibility for him, and
  # nobody in the head's extended benefit unit has any, so he is not the
  # head's non-dependant for Universal Credit. The head gets one bedroom
  # (para 10(1)(a)), and the one-bedroom rate of 15,546 a year caps the
  # rent: housing element 15,546, with no housing cost contribution. The
  # formula adds the standard allowance, 424.90 x 12 = 5,098.80, for a
  # maximum amount of 20,644.80. Earned income: 15,000 less income tax of
  # (15,000 - 12,570) x 20% = 486 and National Insurance of 8% above the
  # primary threshold of 241.73 a week, 194.40, comes to 14,319.60, of which
  # DWP takes 55%, 7,875.78. Universal Credit: 20,644.80 - 7,875.78 =
  # 12,769.02. With the son as a non-dependant aged 16 or over, the head
  # would get two bedrooms, whose rate of 18,600 exceeds the rent, a housing
  # element of 18,000 and Universal Credit of 15,223.02.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 40
        is_household_head: true
        is_claimant_or_partner: true
        employment_income: 15_000
      lodger:
        age: 40
        is_household_head: false
        is_claimant_or_partner: true
        employment_income: 20_000
        rent_paid_as_lodger: 5_200
      son:
        age: 18
        is_household_head: false
        is_claimant_or_partner: false
        current_education: UPPER_SECONDARY
    benunits:
      householder_unit:
        members: [householder]
        would_claim_uc: true
      lodger_unit:
        members: [lodger, son]
    households:
      household:
        members: [householder, lodger, son]
        rent: 18_000
        tenure_type: RENT_PRIVATELY
        region: LONDON
  output:
    pays_rent_to_householder: [false, true, false]
    is_qualifying_young_person_for_universal_credit: [false, false, true]
    # Housing Benefit and council tax reduction read their own flag.
    is_non_dependant_of_household_head: [false, false, true]
    is_uc_non_dependant_of_household_head: [false, false, false]
    benunits:
      householder_unit:
        LHA_allowed_bedrooms: 1
        uc_non_dep_deductions: 0
        uc_housing_costs_element: 15_546
        universal_credit: 12_769.02

