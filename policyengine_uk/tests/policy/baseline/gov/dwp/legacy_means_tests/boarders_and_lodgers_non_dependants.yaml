# A boarder or lodger is liable to pay the householder on a commercial basis
# for their occupation, so is not a non-dependant: UC Regs 2013 Sch 4 para
# 9(2)(d); HB Regs 2006 reg 3(2)(e)(i); CTR (England) prescribed requirements
# reg 9(2)(e). An unrelated adult in the household who pays nothing remains a
# non-dependant.

- name: An adult lodger is not a non-dependant
  period: 2026
  input:
    people:
      householder:
        age: 45
        is_household_head: true
      lodger:
        age: 30
        is_household_head: false
        rent_paid_as_lodger: 4_000
    benunits:
      householder_unit:
        members: [householder]
        benunit_rent: 9_000
      lodger_unit:
        members: [lodger]
    households:
      household:
        members: [householder, lodger]
        tenure_type: RENT_PRIVATELY
  output:
    pays_rent_to_householder: [false, true]
    uc_individual_non_dep_deduction_eligible: [false, false]
    housing_benefit_individual_non_dep_deduction_eligible: [false, false]
    council_tax_reduction_individual_non_dep_deduction_eligible: [false, false]

- name: The same adult paying nothing is a non-dependant
  period: 2026
  input:
    people:
      householder:
        age: 45
        is_household_head: true
      adult:
        age: 30
        is_household_head: false
    benunits:
      householder_unit:
        members: [householder]
        benunit_rent: 9_000
      adult_unit:
        members: [adult]
    households:
      household:
        members: [householder, adult]
        tenure_type: RENT_PRIVATELY
  output:
    pays_rent_to_householder: [false, false]
    uc_individual_non_dep_deduction_eligible: [false, true]
    housing_benefit_individual_non_dep_deduction_eligible: [false, true]
    council_tax_reduction_individual_non_dep_deduction_eligible: [false, true]

# Person-level liability. HB Regs 2006 reg 8(1)(b) treats the partner of a
# liable person as liable; the model applies that rule to UC and CTR too, as
# a stated assumption. Nobody else in a payer's benefit unit is liable, so a
# lodger's adult son who pays nothing stays the householder's non-dependant.
# The household head's own benefit unit never pays the householder.

- name: A lodger's non-paying adult son is the householder's non-dependant for Housing Benefit
  # Scotland, 2026-27. The household head (60) claims Housing Benefit on an
  # eligible rent of 10,400 a year. An unrelated lodger (50) pays 5,200 a year
  # (100 a week); her son (30), in her benefit unit, pays nothing and earns
  # 15,600 a year (300 a week) over 20 hours a week, with no exemption.
  # The lodger is liable on a commercial basis (reg 3(2)(e)(i)); her son is
  # not, so he is a non-dependant. He works 20 hours, at least the 16-hour
  # remunerative work threshold, so his deduction is banded: 300 a week lies
  # in the band from 279 to 365, whose 2026-27 deduction is 64.35 a week
  # (non_dep_deduction/amount.yaml): 64.35 x 52 = 3,346.20 a year.
  # Counted home-letting income: one lodger family at working age,
  # (100 - 20) x 52 = 4,160 a year. The applicable amount, 95.55 x 52 =
  # 4,968.60, exceeds it, so Housing Benefit is the eligible rent less the
  # deduction: 10,400 - 3,346.20 = 7,053.80.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 60
        is_household_head: true
        is_claimant_or_partner: true
        housing_benefit_reported: 1
      lodger:
        age: 50
        is_household_head: false
        is_claimant_or_partner: true
        rent_paid_as_lodger: 5_200
      son:
        age: 30
        is_household_head: false
        # The inference would make an adult of 30 the partner of a claimant
        # of 50, so the roles are supplied.
        is_claimant_or_partner: false
        employment_income: 15_600
        weekly_hours: 20
    benunits:
      householder_unit:
        members: [householder]
        would_claim_uc: false
      lodger_unit:
        members: [lodger, son]
    households:
      household:
        members: [householder, lodger, son]
        rent: 10_400
        tenure_type: RENT_FROM_COUNCIL
        region: SCOTLAND
  output:
    pays_rent_to_householder: [false, true, false]
    benunit_is_liable_for_household_rent: [true, false]
    is_non_dependant_of_household_head: [false, false, true]
    housing_benefit_individual_non_dep_deduction_eligible: [false, false, true]
    housing_benefit_non_dep_deductions: [3_346.20, 0]
    legacy_benefits_home_letting_income: [4_160, 0]
    housing_benefit_applicable_income: [4_160, 0]
    housing_benefit: [7_053.80, 0]

- name: A lodger's non-paying adult son is the householder's non-dependant for Universal Credit and CTR
  # The same household, with the household head claiming Universal Credit.
