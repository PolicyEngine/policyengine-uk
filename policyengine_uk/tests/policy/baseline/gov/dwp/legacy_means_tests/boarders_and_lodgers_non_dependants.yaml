  # reduction takes the same non-dependant flag and, in the model, the
  # Housing Benefit scale: 64.35 x 52 = 3,346.20.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 60
        is_household_head: true
        is_claimant_or_partner: true
      lodger:
        age: 50
        is_household_head: false
        is_claimant_or_partner: true
        rent_paid_as_lodger: 5_200
      son:
        age: 30
        is_household_head: false
        is_claimant_or_partner: false
        employment_income: 15_600
        weekly_hours: 20
    benunits:
      householder_unit:
        members: [householder]
        would_claim_uc: true
      lodger_unit:
        members: [lodger, son]
    households:
      household:
        members: [householder, lodger, son]
        rent: 10_400
        tenure_type: RENT_FROM_COUNCIL
        region: SCOTLAND
  output:
    is_non_dependant_of_household_head_for_universal_credit: [false, false, true]
    uc_individual_non_dep_deduction_eligible: [false, false, true]
    uc_non_dep_deductions: [1_158.60, 0]
    uc_housing_costs_element: [9_241.40, 5_200]
    council_tax_reduction_individual_non_dep_deduction_eligible: [false, false, true]
    council_tax_reduction_non_dep_deductions: [3_346.20, 0]

