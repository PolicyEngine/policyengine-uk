# UC Regulations 2013, reg 80A(2), and HB Regulations 2006, reg 75CA(2):
# annual single / family caps are 14,753 / 22,020 outside London and
# 16,967 / 25,323 in London. These cases isolate rate selection from
# exemptions and do not assert eligibility to claim UC or HB.

- name: Single claimant aged 30 receives the outside-London single cap.
  period: 2025
  input:
    age: 30
    region: SOUTH_EAST
    is_benefit_cap_exempt: false
  output:
    is_benefit_cap_single_claimant_rate: true
    benefit_cap: 14_753

- name: Single claimant aged 30 receives the London single cap.
  period: 2025
  input:
    age: 30
    region: LONDON
    is_benefit_cap_exempt: false
  output:
    is_benefit_cap_single_claimant_rate: true
    benefit_cap: 16_967

- name: Single claimant aged 17 does not count as their own child outside London.
  period: 2025
  input:
    age: 17
    is_benunit_head: true
    region: SOUTH_EAST
    is_benefit_cap_exempt: false
  output:
    is_claimant_or_partner: true
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    is_benefit_cap_single_claimant_rate: true
    # Old age counts selected 22,020; no partner or dependant means 14,753.
    # Change = 14,753 - 22,020 = -7,267 per year.
    benefit_cap: 14_753

- name: Single claimant aged 17 does not count as their own child in London.
  period: 2025
  input:
    age: 17
    is_benunit_head: true
    region: LONDON
    is_benefit_cap_exempt: false
  output:
    is_benefit_cap_single_claimant_rate: true
    # London change = 16,967 - 25,323 = -8,356 per year.
    benefit_cap: 16_967

- name: A 17-year-old apprentice in the claimant's unit does not give the family cap.
  period: 2025
  input:
    people:
      claimant:
        age: 30
        is_benunit_head: true
        is_parent: true
      apprentice:
        age: 17
        is_benunit_head: false
        is_apprentice: true
        current_education: POST_SECONDARY
    benunits:
      family:
        members: [claimant, apprentice]
        is_benefit_cap_exempt: false
    households:
      home:
        members: [claimant, apprentice]
        region: SOUTH_EAST
  output:
    is_claimant_or_partner: [true, false]
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    is_benefit_cap_single_claimant_rate: true
    # UC reg 5(3) excludes education under an employment contract.
    # Single cap: 14,753, down 22,020 - 14,753 = 7,267 from age-only counts.
    benefit_cap: 14_753

- name: A 17-year-old outside education or approved training does not give the family cap.
  period: 2025
  input:
    people:
      claimant:
        age: 30
        is_benunit_head: true
        is_parent: true
      young_person:
        age: 17
        is_benunit_head: false
        current_education: NOT_IN_EDUCATION
        is_in_approved_training: false
    benunits:
      family:
        members: [claimant, young_person]
        is_benefit_cap_exempt: false
    households:
      home:
        members: [claimant, young_person]
        region: SOUTH_EAST
  output:
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    is_benefit_cap_single_claimant_rate: true
    # UC reg 5(1)(b): no qualifying education/training after the age-16 route.
    # Change = 14,753 - 22,020 = -7,267 per year.
    benefit_cap: 14_753

- name: A 17-year-old receiving benefits in their own right does not give the family cap.
  period: 2025
  input:
    people:
      claimant:
        age: 30
        is_benunit_head: true
        is_parent: true
      young_person:
        age: 17
        is_benunit_head: false
        current_education: POST_SECONDARY
        receives_benefits_in_own_right: true
    benunits:
      family:
        members: [claimant, young_person]
        is_benefit_cap_exempt: false
    households:
      home:
        members: [claimant, young_person]
        region: SOUTH_EAST
  output:
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    is_benefit_cap_single_claimant_rate: true
    # UC reg 5(5) excludes own-right UC/ESA/JSA recipients from QYP status.
    # Change = 14,753 - 22,020 = -7,267 per year.
    benefit_cap: 14_753

- name: A looked-after foster child does not give the claimant the family cap.
  period: 2025
  input:
    people:
      claimant:
        age: 30
        is_benunit_head: true
      child:
        age: 10
        is_benunit_head: false
        is_looked_after_by_local_authority: true
    benunits:
      family:
        members: [claimant, child]
        is_benefit_cap_exempt: false
    households:
      home:
        members: [claimant, child]
        region: SOUTH_EAST
  output:
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    is_benefit_cap_single_claimant_rate: true
    # UC reg 4(6)(a): this foster child is excluded from responsibility.
    # Assume no respite or adoption placement exception under reg 4A.
    # Change = 14,753 - 22,020 = -7,267 per year.
    benefit_cap: 14_753

- name: Parent of a 17-year-old qualifying student keeps the family cap.
  period: 2025
  input:
    people:
      parent:
        age: 30
        is_benunit_head: true
        is_parent: true
      student:
        age: 17
        is_benunit_head: false
        current_education: POST_SECONDARY
    benunits:
      family:
        members: [parent, student]
        is_benefit_cap_exempt: false
    households:
      home:
        members: [parent, student]
        region: SOUTH_EAST
  output:
    is_couple: false
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: true
    is_benefit_cap_single_claimant_rate: false
    # Responsibility under UC regs 4-5 gives the 22,020 annual family limit.
    benefit_cap: 22_020

- name: Lone parent of an 18-year-old qualifying student keeps the London family cap.
  period: 2025
  input:
    people:
      parent:
        age: 30
        is_benunit_head: true
        is_parent: true
      student:
        age: 18
        is_benunit_head: false
        current_education: POST_SECONDARY
    benunits:
      family:
        members: [parent, student]
        is_benefit_cap_exempt: false
    households:
      home:
        members: [parent, student]
        region: LONDON
  output:
    is_claimant_or_partner: [true, false]
    is_couple: false
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: true
    is_benefit_cap_single_claimant_rate: false
    # Same 25,323 as before, now because of responsibility rather than two 18+ members.
    benefit_cap: 25_323

- name: Couple aged 30 and 17 claims as a single person, so the single cap applies without counting the partner as a child.
  period: 2025
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 17
        is_claimant_or_partner: true
        current_education: POST_SECONDARY
    benunits:
      family:
        members: [claimant, partner]
        is_benefit_cap_exempt: false
    households:
      home:
        members: [claimant, partner]
        region: SOUTH_EAST
  output:
    is_couple: true
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    # The partner is under 18 with no UC Regs 2013 reg. 8 circumstance, so
    # the claimant claims as a single person (reg. 3(3)(a); ADM E2017).
    uc_is_ineligible_partner: [false, true]
    uc_member_of_couple_claims_as_single_person: true
    is_benefit_cap_single_claimant_rate: true
    # Reg. 80A(2)(c): 14,753 for a single claimant outside Greater London
    # who is not responsible for a child or qualifying young person (ADM
    # E5007 note 3 applies it to a member of a couple claiming as single).
    benefit_cap: 14_753

- name: Couple aged 30 and 17 where the partner is within reg. 8 claim jointly and receive the couple cap.
  period: 2025
  input:
    people:
      claimant:
        age: 30
        is_claimant_or_partner: true
      partner:
        age: 17
        is_claimant_or_partner: true
        current_education: POST_SECONDARY
        # Reg. 8(1)(c): regular and substantial caring responsibilities, so
        # the minimum age is 16 and the couple claim jointly.
        care_hours: 35
    benunits:
      family:
        members: [claimant, partner]
        is_benefit_cap_exempt: false
    households:
      home:
        members: [claimant, partner]
        region: SOUTH_EAST
  output:
    uc_is_ineligible_partner: [false, false]
    uc_member_of_couple_claims_as_single_person: false
    is_benefit_cap_single_claimant_rate: false
    # Reg. 80A(2)(d)(i): 22,020 for joint claimants outside Greater London.
    benefit_cap: 22_020

- name: Explicitly identified 19-year-old non-dependant does not imply a partner.
  period: 2025
  input:
    people:
      claimant:
        age: 40
        is_claimant_or_partner: true
      non_dependant:
        age: 19
        is_claimant_or_partner: false
        current_education: NOT_IN_EDUCATION
    benunits:
      family:
        members: [claimant, non_dependant]
        is_benefit_cap_exempt: false
    households:
      home:
        members: [claimant, non_dependant]
        region: SOUTH_EAST
  output:
    is_couple: false
    is_responsible_for_child_or_qualifying_young_person_for_universal_credit: false
    is_benefit_cap_single_claimant_rate: true
    # Old two-adult count gave 22,020. With explicit roles, no partner or QYP:
    # change = 14,753 - 22,020 = -7,267 per year.
    benefit_cap: 14_753

- name: Benefit-cap exemption still overrides the selected single rate.
  period: 2025
  input:
    age: 30
    region: SOUTH_EAST
    is_benefit_cap_exempt: true
    universal_credit_pre_benefit_cap: 100_000
  output:
    is_benefit_cap_single_claimant_rate: true
    # Exemption makes the cap infinite: max(100,000 - infinity, 0) = 0.
    # Assert the resulting reduction because the YAML runner cannot compare infinities.
    benefit_cap_reduction: 0

- name: A Housing Benefit young person keeps the family cap though not a UC qualifying young person
  # The 19-year-old started non-advanced education at 17 and is past UC's
  # terminal date, so is not a UC qualifying young person (UC reg 5), but is a
  # Child Benefit qualifying young person, which Housing Benefit uses (HB reg
  # 19). One cap serves both, so the family rate applies: 22,020.
  period: 2025
  input:
    people:
      parent:
        age: 40
        is_parent: true
      student:
        age: 19
        current_education: UPPER_SECONDARY
        age_started_or_accepted_current_education_or_training: 17
        is_before_universal_credit_qualifying_young_person_terminal_date: false
    benunits:
      benunit:
        members: [parent, student]
        is_benefit_cap_exempt: false
    households:
      household:
        members: [parent, student]
        region: SOUTH_EAST
  output:
    is_qualifying_young_person_for_universal_credit: [false, false]
    is_qualifying_young_person_for_child_benefit: [false, true]
    benefit_cap: 22_020

- name: A 16-year-old outside education keeps the family cap (UC reg 5(1)(a) window)
  # Every 16-year-old is a UC qualifying young person until the 1 September
  # after their 16th birthday; annual ages cannot place that date.
  period: 2025
  input:
    people:
      parent:
        age: 40
        is_parent: true
      teenager:
        age: 16
        current_education: NOT_IN_EDUCATION
    benunits:
      benunit:
        members: [parent, teenager]
        is_benefit_cap_exempt: false
    households:
      household:
        members: [parent, teenager]
        region: SOUTH_EAST
  output:
    benefit_cap: 22_020
