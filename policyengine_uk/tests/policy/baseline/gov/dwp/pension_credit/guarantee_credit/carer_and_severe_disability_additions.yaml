- name: Carer addition for a claimant with underlying entitlement and no Carer's Allowance award
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        care_hours: 35
        carers_allowance_reported: 0
        would_claim_carers_allowance: false
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
        country: ENGLAND
  output:
    carers_allowance: 0
    is_carer_for_benefits: true
    carer_minimum_guarantee_addition: 46.37 * 52

- name: Carer addition for a claimant receiving Carer's Allowance
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        carers_allowance_reported: 1
        care_hours: 0
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
        country: ENGLAND
  output:
    is_carer_for_benefits: true
    carer_minimum_guarantee_addition: 46.37 * 52

