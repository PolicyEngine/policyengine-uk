# SPC Regulations 2002 Sch I paras 1-2 and reg 6(5).
# Children and qualifying young people do not bar the addition (Sch I para
# 2(2)(f)) and their own benefits do not qualify the claimant. The 2026 weekly
# amounts are GBP 86.05 (reg 6(5)(a)) and GBP 172.10 (reg 6(5)(b)).
- name: A child without disability benefits does not block the claimant's addition.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 79
        attendance_allowance: 100
      child:
        age: 10
    benunits:
      benunit:
        members: [claimant, child]
  output:
    # Head (a); the child is under 18: 86.05 * 52 = 4,474.60.
    severe_disability_minimum_guarantee_addition: 4_474.60

- name: An 18-year-old qualifying young person's PIP does not add a second claimant amount.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 79
        is_parent: true
        attendance_allowance: 100
      young_person:
        age: 18
        is_in_non_advanced_education: true
        pip_dl: 100
    benunits:
      benunit:
        members: [claimant, young_person]
  output:
    # Head (a); the young person is ignored under para 2(2)(a) and (f):
    # 86.05 * 52 = 4,474.60.
    severe_disability_minimum_guarantee_addition: 4_474.60

- name: Two qualifying partners living with a disabled 19-year-old get the double rate.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 79
        is_parent: true
        attendance_allowance: 100
      partner:
        age: 70
        attendance_allowance: 100
      young_person:
        age: 19
        is_in_non_advanced_education: true
        age_started_or_accepted_current_education_or_training: 18
        pip_dl: 100
    benunits:
      benunit:
        members: [claimant, partner, young_person]
  output:
    # Past the reg 4A terminal date by default, the 19-year-old is not a
    # qualifying young person, but para 2(2)(a) ignores them as a PIP daily
    # living recipient. Head (b), no carer: reg 6(5)(b) 172.10 * 52 = 8,949.20.
    severe_disability_minimum_guarantee_addition: 8_949.20

- name: A dependant's disability benefit alone does not qualify the claimant.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 79
        is_parent: true
      young_person:
        age: 18
        is_in_non_advanced_education: true
        pip_dl: 100
    benunits:
      benunit:
        members: [claimant, young_person]
  output:
    # The claimant receives no qualifying benefit: 0.
    severe_disability_minimum_guarantee_addition: 0
