# SPC Regs 2002 Sch I Part I paras 1-3 and reg 6(4)-(5), as in force from
# 6 April 2026: reg 6(5)(a) GBP 86.05 a week (86.05 * 52 = 4,474.60 a year);
# reg 6(5)(b) GBP 172.10 a week (172.10 * 52 = 8,949.20 a year).
# Head (a): no partner, in receipt of a qualifying benefit, no adult residing
# with them other than one para 2 ignores, and no carer benefit paid for
# caring for them. Head (b): both partners in receipt (para 1(2)(b)-(bd) treat
# a partner in hospital as in receipt), the same residence bar, and a carer
# benefit paid for one partner at most. Head (c): where (b) does not apply, one
# partner in receipt, the other certified blind, the same residence bar, and no
# carer benefit paid for the one in receipt. Reg 6(5)(b) pays double where (b)
# holds otherwise than by para 1(2)(b) and no carer benefit is paid for either.

- name: Head (a) - a single claimant receiving Attendance Allowance who lives alone.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        attendance_allowance: 5_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    severe_disability_minimum_guarantee_addition: 4_474.6
    # (238.00 + 86.05) * 52 = 16,850.60.
    minimum_guarantee: 16_850.6

- name: Head (a) - an adult son in the household bars the addition.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        attendance_allowance: 5_000
      son:
        age: 45
    benunits:
      claimant_unit:
        members: [claimant]
      son_unit:
        members: [son]
    households:
      household:
        members: [claimant, son]
  output:
    # Para 1(1)(a)(ii): the son has attained 18, resides with the claimant and
    # no head of para 2 applies to him.
    has_non_exempt_adult_resident_for_pension_credit_severe_disability: [true, false]
    severe_disability_minimum_guarantee_addition: [0, 0]

- name: Head (a) - para 2 ignores an adult child receiving PIP, one certified blind and a joint tenant.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        attendance_allowance: 5_000
      daughter_on_pip:
        age: 50
        pip_dl: 5_000
      son_blind:
        age: 48
        is_blind: true
      joint_tenant:
        age: 60
        is_ignored_resident_for_pension_credit_severe_disability: true
    benunits:
      claimant_unit:
        members: [claimant]
      daughter_unit:
        members: [daughter_on_pip]
      son_unit:
        members: [son_blind]
      tenant_unit:
        members: [joint_tenant]
    households:
      household:
        members: [claimant, daughter_on_pip, son_blind, joint_tenant]
  output:
    # Para 2(2)(a), 2(2)(b) and 2(6) respectively.
    is_non_exempt_adult_resident_for_pension_credit_severe_disability: [false, false, false, false]
    # The daughter meets head (a) for herself as well; the addition is only
    # paid within Pension Credit, which her age rules out.
    severe_disability_minimum_guarantee_addition: [4_474.6, 4_474.6, 0, 0]

- name: Head (a) - a 17-year-old grandchild not in education does not bar the addition.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        attendance_allowance: 5_000
      grandchild:
        age: 17
        current_education: NOT_IN_EDUCATION
    benunits:
      claimant_unit:
        members: [claimant]
      grandchild_unit:
        members: [grandchild]
    households:
      household:
        members: [claimant, grandchild]
  output:
    # Para 1(1)(a)(ii) reaches only people who have attained 18.
    severe_disability_minimum_guarantee_addition: [4_474.6, 0]

- name: Head (a) - a 19-year-old past the reg 4A terminal date in the claimant's family bars the addition.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        is_parent: true
        attendance_allowance: 5_000
      young_person:
        age: 19
        current_education: UPPER_SECONDARY
        age_started_or_accepted_current_education_or_training: 18
    benunits:
      benunit:
        members: [claimant, young_person]
    households:
      household:
        members: [claimant, young_person]
  output:
    # Not before the 1 September after their 19th birthday, so not a
    # qualifying young person (reg 4A(1)(b)) and not ignored by para 2(2)(f).
    is_qualifying_young_person_for_pension_credit: [false, false]
    severe_disability_minimum_guarantee_addition: 0

- name: Head (a) - the same 19-year-old before the terminal date is ignored.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        is_parent: true
        attendance_allowance: 5_000
      young_person:
        age: 19
        current_education: UPPER_SECONDARY
        age_started_or_accepted_current_education_or_training: 18
        is_before_first_september_after_19th_birthday: true
    benunits:
      benunit:
        members: [claimant, young_person]
    households:
      household:
        members: [claimant, young_person]
  output:
    # Para 2(2)(f).
    severe_disability_minimum_guarantee_addition: 4_474.6

- name: Head (a) - a claimant's own Carer's Allowance is not paid for caring for them.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        attendance_allowance: 5_000
        carers_allowance_reported: 1
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # Para 1(1)(a)(iii) asks whether anyone receives a carer benefit "in
    # respect of caring for him"; nobody can care for themselves.
    receives_carer_benefit: true
    severe_disability_minimum_guarantee_addition: 4_474.6

- name: Head (a) - a young carer in the claimant's family receiving Carer's Allowance bars the addition.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        is_parent: true
        attendance_allowance: 5_000
      young_carer:
        age: 17
        carers_allowance_reported: 1
    benunits:
      benunit:
        members: [claimant, young_carer]
    households:
      household:
        members: [claimant, young_carer]
  output:
    # The carer benefit is taken to be for caring for the claimant.
    severe_disability_minimum_guarantee_addition: 0

- name: Head (a) - a single claimant treated as in receipt only through a hospital stay gets nothing.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 80
        would_receive_aa_or_dla_care_but_for_hospital_stay: true
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # Para 1(2)(b) applies "for the purposes of sub-paragraph (1)(b)" only.
    severe_disability_minimum_guarantee_addition: 0

- name: Head (b) - both partners receive a qualifying benefit and no carer benefit is paid.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        attendance_allowance: 5_000
      partner:
        age: 78
        dla_sc_category: HIGHER
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Reg 6(5)(b): 172.10 * 52 = 8,949.20.
    severe_disability_minimum_guarantee_addition: 8_949.2
    # (363.25 + 172.10) * 52 = 27,838.20.
    minimum_guarantee: 27_838.2

- name: Head (b) - both partners receive Carer's Allowance, so both are cared for.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 70
        attendance_allowance: 5_000
        carers_allowance_reported: 1
      partner:
        age: 70
        attendance_allowance: 5_000
        carers_allowance_reported: 1
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Head (b) allows a carer benefit for one partner only; head (c) needs a
    # blind partner.
    severe_disability_minimum_guarantee_addition: 0

- name: Head (b) - a partner treated as in receipt by para 1(2)(b) gives the single rate.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        attendance_allowance: 5_000
      partner:
        age: 78
        would_receive_aa_or_dla_care_but_for_hospital_stay: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Head (b) holds only by para 1(2)(b), so reg 6(5)(b) does not apply:
    # 86.05 * 52 = 4,474.60.
    severe_disability_minimum_guarantee_addition: 4_474.6

- name: Head (b) - a partner treated as in receipt by para 1(2)(ba)-(bd) keeps the double rate.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        attendance_allowance: 5_000
      partner:
        age: 70
        would_receive_daily_living_disability_benefit_but_for_hospital_stay: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Reg 6(5)(b) excludes only para 1(2)(b): 172.10 * 52 = 8,949.20. DMG
    # 78050 reads the exclusion as covering every hospital deeming.
    severe_disability_minimum_guarantee_addition: 8_949.2

- name: Head (b) - an adult son residing with the couple bars the addition.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 80
        attendance_allowance: 5_000
      partner:
        age: 78
        attendance_allowance: 5_000
      son:
        age: 40
    benunits:
      couple:
        members: [claimant, partner]
      son_unit:
        members: [son]
    households:
      household:
        members: [claimant, partner, son]
  output:
    # Para 1(1)(b)(ii).
    severe_disability_minimum_guarantee_addition: [0, 0]

- name: Head (c) - one partner receives a qualifying benefit and the other is certified blind.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 80
        attendance_allowance: 5_000
      partner:
        age: 78
        is_blind: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Reg 6(5)(a): 86.05 * 52 = 4,474.60.
    severe_disability_minimum_guarantee_addition: 4_474.6

- name: Head (c) - a carer benefit paid for the partner in receipt bars the addition.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 70
        attendance_allowance: 5_000
      partner:
        age: 70
        is_blind: true
        carers_allowance_reported: 1
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Para 1(1)(c)(iv): the blind partner's Carer's Allowance is taken to be
    # for caring for the claimant.
    severe_disability_minimum_guarantee_addition: 0

- name: Head (c) - hospital deeming does not satisfy the receipt condition.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      claimant:
        age: 80
        would_receive_aa_or_dla_care_but_for_hospital_stay: true
      partner:
        age: 78
        is_blind: true
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    # Para 1(1)(c)(i) needs actual receipt; para 1(2)(b) reaches (1)(b) only.
    severe_disability_minimum_guarantee_addition: 0

- name: Two households, each a pensioner receiving Attendance Allowance, ignore each other.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      sister_a:
        age: 82
        attendance_allowance: 5_000
      sister_b:
        age: 79
        attendance_allowance: 5_000
    benunits:
      unit_a:
        members: [sister_a]
      unit_b:
        members: [sister_b]
    households:
      household:
        members: [sister_a, sister_b]
  output:
    # Each is ignored under para 2(2)(a) for the other's head (a).
    severe_disability_minimum_guarantee_addition: [4_474.6, 4_474.6]
