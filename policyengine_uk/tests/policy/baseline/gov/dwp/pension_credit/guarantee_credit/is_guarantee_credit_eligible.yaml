- name: Income under the minimum guarantee confers eligibility.
  period: 2021
  input:
    pension_credit_income: 170
    minimum_guarantee: 180
  output:
    is_guarantee_credit_eligible: true

- name: Income over the minimum guarantee does not confer eligibility.
  period: 2021
  input:
    pension_credit_income: 190
    minimum_guarantee: 180
  output:
    is_guarantee_credit_eligible: false

- name: Pension Credit deemed income from capital can remove Guarantee Credit eligibility.
  period: 2021
  input:
    people:
      person:
        age: 70
    benunits:
      benunit:
        members: person
        minimum_guarantee: 100
    households:
      household:
        members: person
        savings: 10_501
  output:
    pension_credit_deemed_income: 104
    pension_credit_income: 104
    is_guarantee_credit_eligible: false

- name: Case 4, income equal to the minimum guarantee confers eligibility with no award.
  period: 2026
  input:
    people:
      person1:
        age: 67
    benunits:
      benunit:
        members: [person1]
        pension_credit_income: 12_000
        minimum_guarantee: 12_000
  output:
    is_guarantee_credit_eligible: true
    is_pension_credit_eligible: true
    guarantee_credit: 0
    pension_credit_entitlement: 0
