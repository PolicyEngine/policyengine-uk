# Industrial injuries disablement benefit (IIDB), severe disablement allowance
# (SDA), incapacity benefit (IB) and maternity allowance (MA) in Pension Credit
# and Housing Benefit income.
#
# SPC Regs 2002 reg 15(1): "all social security benefits are prescribed except"
# a closed list. The list does not name the four benefits. For IIDB it excepts
# the increases under SSCBA 1992 ss.104 and 105 (constant attendance and
# exceptionally severe disablement) and Sch 8 paras 4 and 7(2)(b) (reg
# 15(1)(c)-(e)); (h) excepts increases for a dependant other than a partner.
# Reg 9 makes WTC, IB, SDA and MA (with contribution-based JSA, contributory
# ESA and reg 15(5)(d) maintenance) non-qualifying income for Savings Credit;
# IIDB stays qualifying income. HB (SPC) Regs 2006 reg 29(1)(j) counts the same
# social security benefits for pension-age Housing Benefit, and HB Regs 2006
# reg 40 counts working-age gross income less Sch 5.
#
# The awards are ordinary awards with no excepted increase, entered as reported
# amounts (SDA as a reported award, which the model pays at gov.dwp.sda.maximum).
# Weekly rates, x 52:
#   SI 2026/148 Sch 1: IIDB 100% 233.90, 20% 46.78 (Part V); SDA 103.85 plus
#   the higher age related addition 15.50 (Part III); long-term IB 146.60
#   (Part I). Art 9: SMP reg 6 rate 194.32, which is the MA standard rate under
#   SSCBA s.35A(1)(b) from 6 April 2026 (art 1). Art 29: standard minimum
#   guarantee 238.00 single and 363.25 couple; Savings Credit threshold 208.07
#   single and 329.75 couple.
#   SI 2025/295 Sch 1 Part V: IIDB 20% 45.06; art 29: single standard minimum
#   guarantee 227.10.
# The cases test classification, not whether a pensioner would be paid MA or
# IB. None of these claimants pays income tax, so tax does not enter any
# expected value; the model taxes IB, so the IB cases also assert that its
# income tax is zero.

- name: Case 1, single pensioner with IIDB at 20 percent.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        private_pension_income: 1_000
        iidb_reported: 46.78 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # 1,000 + 2,432.56 = 3,432.56.
    pension_credit_income: 1_000 + 46.78 * 52
    # 12,376 - 3,432.56 = 8,943.44.
    guarantee_credit: 238 * 52 - (1_000 + 46.78 * 52)

- name: Case 2, pensioner couple whose partner has IIDB at 100 percent.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        private_pension_income: 5_000
      person2:
        age: 70
        state_pension: 0
        iidb_reported: 233.90 * 52
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
  output:
    # 5,000 + 12,162.80 = 17,162.80.
    pension_credit_income: 5_000 + 233.90 * 52
    # 18,889 - 17,162.80 = 1,726.20.
    guarantee_credit: 363.25 * 52 - (5_000 + 233.90 * 52)

- name: Case 3, single pensioner with SDA and the higher age related addition.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        private_pension_income: 1_000
        sda_reported: 1
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # The model pays 119.35 a week, the statutory 103.85 + 15.50.
    sda: (103.85 + 15.50) * 52
    # 1,000 + 6,206.20 = 7,206.20.
    pension_credit_income: 1_000 + (103.85 + 15.50) * 52
    # 12,376 - 7,206.20 = 5,169.80.
    guarantee_credit: 238 * 52 - (1_000 + (103.85 + 15.50) * 52)

