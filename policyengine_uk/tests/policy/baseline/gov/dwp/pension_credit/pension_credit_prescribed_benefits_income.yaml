    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    meets_savings_credit_age_requirement: false
    savings_credit_income: (175.04 + 46.78) * 52
    savings_credit: 0
    guarantee_credit: (238 - 221.82) * 52

- name: Case 12, SDA is not qualifying income for Savings Credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 80
        state_pension: 0
        private_pension_income: 6_000
        sda_reported: 1
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # 6,000 + 6,206.20 = 12,206.20.
    pension_credit_income: 6_000 + (103.85 + 15.50) * 52
    # Reg 9(d): qualifying income is the 6,000 pension, below the 10,819.64
    # threshold, so no Savings Credit. Counting SDA as qualifying income
    # would give 0.6 x (12,206.20 - 10,819.64) = 831.94.
    savings_credit_income: 6_000
    is_savings_credit_eligible: false
    savings_credit: 0
    # 12,376 - 12,206.20 = 169.80.
    guarantee_credit: 238 * 52 - (6_000 + (103.85 + 15.50) * 52)

