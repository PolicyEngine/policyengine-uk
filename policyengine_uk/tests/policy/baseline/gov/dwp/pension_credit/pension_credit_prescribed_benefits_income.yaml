- name: Case 15, working tax credit is not qualifying income for Savings Credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 80
        state_pension: 0
        private_pension_income: 10_000
    benunits:
      benunit:
        members: [person1]
        # An illustrative award: reg 9(a) applies to any amount, and working
        # tax credit rates are not set by the up-rating orders used here.
        working_tax_credit: 1_000
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # SPCA s.15(1)(b): 10,000 + 1,000 = 11,000.
    pension_credit_income: 11_000
    # Reg 9(a): qualifying income is 10,000, below the 10,819.64 threshold.
    # Counting the tax credit would give 0.6 x (11,000 - 10,819.64) = 108.22.
    savings_credit_income: 10_000
    savings_credit: 0
    # 12,376 - 11,000 = 1,376.
    guarantee_credit: 1_376

- name: Case 16, pension-age Housing Benefit counts IIDB once Guarantee Credit ends.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        private_pension_income: 1_000
        iidb_reported: 233.90 * 52
    benunits:
      benunit:
        members: [person1]
        # The model applies the HB earnings disregard (HB (SPC) Regs Sch 4)
        # whether or not there are earnings; there are none here, so it is
        # set to zero to isolate the income rule.
        housing_benefit_applicable_income_disregard: 0
    households:
      household:
        members: [person1]
        country: ENGLAND
        tenure_type: RENT_FROM_COUNCIL
        rent: 6_000
  output:
    # 1,000 + 12,162.80 = 13,162.80, above the 12,376 minimum guarantee.
    pension_credit_income: 1_000 + 233.90 * 52
    guarantee_credit: 0
    # HB (SPC) Regs reg 29(1)(j): the same 13,162.80.
    housing_benefit_applicable_income: 1_000 + 233.90 * 52

- name: Case 17, working-age Housing Benefit counts incapacity benefit and SDA.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        incapacity_benefit_reported: 146.60 * 52
      person2:
        age: 45
        sda_reported: 1
    benunits:
      benunit:
        members: [person1, person2]
        # As in Case 16 (the working-age disregard is HB Regs 2006 Sch 4).
        housing_benefit_applicable_income_disregard: 0
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
        tenure_type: RENT_FROM_COUNCIL
        rent: 6_000
  output:
    income_tax: [0, 0]
    # HB Regs 2006 reg 40(1): 7,623.20 + 6,206.20 = 13,829.40.
    housing_benefit_applicable_income: (146.60 + 103.85 + 15.50) * 52

- name: Case 18, working tax credit does not add to a positive Savings Credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 80
        state_pension: 0
        private_pension_income: 221.82 * 52
    benunits:
      benunit:
        members: [person1]
        # An illustrative award, as in Case 15.
        working_tax_credit: 200
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # 11,534.64 + 200 = 11,734.64.
    pension_credit_income: 221.82 * 52 + 200
    # Reg 9(a): the pension only.
    savings_credit_income: 221.82 * 52
    # 0.6 x (221.82 - 208.07) x 52 = 429.00; income is below the minimum
    # guarantee, so nothing is withdrawn. Counting the tax credit would give
    # 0.6 x (11,734.64 - 10,819.64) = 549.00.
    savings_credit: 0.6 * (221.82 - 208.07) * 52
    # 12,376 - 11,734.64 = 641.36.
    guarantee_credit: 238 * 52 - (221.82 * 52 + 200)

- name: Case 19, a partner's SDA is not qualifying income for a couple's Savings Credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 80
        state_pension: 0
        private_pension_income: 12_000
      person2:
        age: 78
        state_pension: 0
        sda_reported: 1
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
  output:
    # 12,000 + 6,206.20 = 18,206.20.
    pension_credit_income: 12_000 + (103.85 + 15.50) * 52
    # Reg 9(d): qualifying income is the 12,000 pension, below the couple
    # threshold of 329.75 x 52 = 17,147. Counting the partner's SDA would give
    # 0.6 x (18,206.20 - 17,147) = 635.52.
    savings_credit_income: 12_000
    is_savings_credit_eligible: false
    savings_credit: 0
    # 18,889 - 18,206.20 = 682.80.
    guarantee_credit: 363.25 * 52 - (12_000 + (103.85 + 15.50) * 52)
