- name: Case 9, single pensioner with IIDB at 20 percent in 2025.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        private_pension_income: 1_000
        iidb_reported: 45.06 * 52
    benunits:
      benunit:
        members: [person1]
        # SI 2025/295 art 29 sets the single standard minimum guarantee at
        # 227.10; the model's 2025 parameter holds 221.85, so the statutory
        # amount is supplied to isolate the income rule.
        minimum_guarantee: 227.10 * 52
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # 1,000 + 2,343.12 = 3,343.12.
    pension_credit_income: 1_000 + 45.06 * 52
    # 11,809.20 - 3,343.12 = 8,466.08.
    guarantee_credit: 227.10 * 52 - (1_000 + 45.06 * 52)

- name: Case 10, IIDB is qualifying income for Savings Credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        # Aged 80, so State Pension age was reached before the 2016 cutoff.
        age: 80
        state_pension: 0
        private_pension_income: 175.04 * 52
        iidb_reported: 46.78 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # 175.04 + 46.78 = 221.82 a week, 11,534.64 a year.
    pension_credit_income: (175.04 + 46.78) * 52
    savings_credit_income: (175.04 + 46.78) * 52
    # 0.6 x (221.82 - 208.07) = 8.25 a week, 429.00 a year: below the
    # maximum 0.6 x (238 - 208.07), and income is below the minimum
    # guarantee, so nothing is withdrawn.
    savings_credit: 0.6 * (221.82 - 208.07) * 52
    # (238 - 221.82) x 52 = 841.36.
    guarantee_credit: (238 - 221.82) * 52

- name: Case 11, an IIDB recipient who reached State Pension age after the cutoff gets no Savings Credit.
  period: 2026
