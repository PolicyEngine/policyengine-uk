# Carers' benefits in Pension Credit income.
# SPC Regs 2002 reg 15(1) prescribes "all social security benefits" as income
# except those it lists. Carer's Allowance and Carer Support Payment are not
# listed. Reg 15(1)(ri) excepts the Scottish Carer Supplement (SI 2026/246
# art 17(3), from 15 March 2026), and reg 9 does not exclude either benefit
# from Savings Credit qualifying income.
# The carers here have no State Pension, so no overlapping-benefit adjustment
# (reg 15(4)(a)) applies to their Carer's Allowance or Carer Support Payment.
# 2026 rates: CA and CSP 86.45, Scottish Carer Supplement 11.70, standard
# minimum guarantee 238.00 single and 363.25 couple, carer addition 48.15.

- name: Carer's Allowance counts as Pension Credit income
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 70
        state_pension: 0
        private_pension_income: 7_000
        care_hours: 35
    benunits:
      benunit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: ENGLAND
  output:
    carers_allowance: 86.45 * 52
    # 7,000 + 4,495.40 is below the personal allowance, so no income tax.
    pension_credit_income: 7_000 + 86.45 * 52
    minimum_guarantee: (238 + 48.15) * 52
    guarantee_credit: (238 + 48.15 - 86.45) * 52 - 7_000

- name: A reported Carer's Allowance award counts as Pension Credit income
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 70
        state_pension: 0
        private_pension_income: 7_000
        carers_allowance_reported: 1
        care_hours: 0
    benunits:
      benunit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: ENGLAND
  output:
    carers_allowance: 86.45 * 52
    pension_credit_income: 7_000 + 86.45 * 52

- name: Carer Support Payment counts as Pension Credit income, the Scottish Carer Supplement does not
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 70
        state_pension: 0
        private_pension_income: 7_000
        care_hours: 35
    benunits:
      benunit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
  output:
    carers_allowance: 0
    carer_support_payment: 86.45 * 52
    scottish_carer_supplement: 11.70 * 52
    # The supplement is taxable (ITEPA 2003 s.660 Table A, SI 2026/93), so it
    # stays in social security income for income tax.
    social_security_income: (86.45 + 11.70) * 52
    # 7,000 + 5,103.80 is below the personal allowance, so no income tax.
    income_tax: 0
    pension_credit_income: 7_000 + 86.45 * 52
    guarantee_credit: (238 + 48.15 - 86.45) * 52 - 7_000

