        age: 75
        state_pension: 9_000
        pension_credit_reported: 1_000
        is_parent: true
      dependant:
        age: 18
        current_education: UPPER_SECONDARY
    benunits:
      benunit:
        members: [pensioner, dependant]
    households:
      household:
        members: [pensioner, dependant]
        rent: 6_240
        tenure_type: RENT_FROM_COUNCIL
  output:
    is_child_or_qualifying_young_person_for_pension_credit: [false, true]
    is_claimant_or_partner: [true, false]
    is_mixed_age_couple: false
    has_mixed_age_couple_pension_credit_saving: false
    # The dependant is not a claimant or partner (SPCA 2002 s.17), so the
    # pensioner alone meets the age conditions.
    meets_pension_credit_age_conditions: true

