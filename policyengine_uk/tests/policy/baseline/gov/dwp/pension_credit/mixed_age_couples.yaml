# Mixed-age couples: State Pension Credit Act 2002 s.4(1A), in force 15 May
# 2019 (SI 2019/37 art. 3; NI: SR 2019/4 art. 3), with the SI 2019/37 art. 4
# saving (NI: SR 2019/4 art. 4). Housing Benefit follows UC (Transitional
# Provisions) Regs 2014 reg 6A(4)-(5).
#
# Expected amounts are hand-computed from the law's rates:
#   2026-27 couple standard minimum guarantee GBP 363.25 a week: 363.25 x 52 = 18,889
#   2018-19 couple standard minimum guarantee GBP 248.80 a week: 248.80 x 52 = 12,937.60
#   Guarantee Credit = minimum guarantee - income (State Pension 9,000 only)
#   Housing Benefit on Guarantee Credit = full eligible rent (HB SPC Regs reg 26)

- name: Protected mixed-age couple (art. 4 saving input) gets Pension Credit and HB, not UC
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 75
        state_pension: 9_000
      younger:
        age: 60
    benunits:
      benunit:
        members: [older, younger]
        has_mixed_age_couple_pension_credit_saving: true
    households:
      household:
        members: [older, younger]
        rent: 6_240
        tenure_type: RENT_FROM_COUNCIL
  output:
    is_mixed_age_couple: true
    meets_pension_credit_age_conditions: true
    is_pension_credit_eligible: true
    guarantee_credit: 9_889
    pension_credit: 9_889
    housing_benefit_eligible: true
    housing_benefit: 6_240
    is_uc_eligible: false
    universal_credit: 0

- name: Reported Pension Credit sets the saving, whatever the UC take-up draw
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 75
        state_pension: 9_000
        pension_credit_reported: 1_000
      younger:
        age: 60
    benunits:
      benunit:
        members: [older, younger]
        would_claim_uc: true
    households:
      household:
        members: [older, younger]
        rent: 6_240
        tenure_type: RENT_FROM_COUNCIL
  output:
    has_mixed_age_couple_pension_credit_saving: true
    pension_credit: 9_889
    universal_credit: 0

