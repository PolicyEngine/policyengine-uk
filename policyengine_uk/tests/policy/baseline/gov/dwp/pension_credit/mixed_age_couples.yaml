- name: A grandparent outside the couple does not supply the saving's age evidence
  # The benefit unit's claimant and partner are 70 and 60; the 70-year-old was
  # born in 1956, after the qualifying date. A 90-year-old grandparent in the
  # same benefit unit is not the claimant or partner, so their age cannot meet
  # SI 2019/37 art. 4(1).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandparent:
        age: 90
        is_claimant_or_partner: false
        housing_benefit_reported: 5_000
      claimant:
        age: 70
        is_claimant_or_partner: true
        state_pension: 9_000
        pension_credit_reported: 1_000
      partner:
        age: 60
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [grandparent, claimant, partner]
    households:
      household:
        members: [grandparent, claimant, partner]
  output:
    is_mixed_age_couple: true
    has_mixed_age_couple_pension_credit_saving: false

- name: A grandparent's reported Pension Credit does not supply the couple's saving
  # The claimant (75, born 1951) and partner (60) report nothing; only the
  # grandparent reports Pension Credit, which is not the couple's award.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandparent:
        age: 92
        is_claimant_or_partner: false
        pension_credit_reported: 1_000
      claimant:
        age: 75
        is_claimant_or_partner: true
        state_pension: 9_000
      partner:
        age: 60
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [grandparent, claimant, partner]
    households:
      household:
        members: [grandparent, claimant, partner]
  output:
    is_mixed_age_couple: true
    has_mixed_age_couple_pension_credit_saving: false

- name: A grandparent's reported Housing Benefit does not supply the couple's saving
  # The claimant (75, born 1951) is old enough and the couple reports nothing.
  # Only the grandparent, who is over State Pension age, reports Housing
  # Benefit, and that is not the couple's award (SI 2019/37 art. 2(2)(a)).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandparent:
        age: 90
        is_claimant_or_partner: false
        housing_benefit_reported: 5_000
      claimant:
        age: 75
        is_claimant_or_partner: true
        state_pension: 9_000
      partner:
        age: 60
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [grandparent, claimant, partner]
    households:
      household:
        members: [grandparent, claimant, partner]
  output:
    is_mixed_age_couple: true
    has_mixed_age_couple_pension_credit_saving: false

- name: Before the exclusion, a grandparent's Universal Credit does not move the couple onto it
  # In model year 2018 a mixed-age couple not reported on Universal Credit
  # takes the Pension Credit route. Only the couple's own report counts.
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      grandparent:
        age: 90
        is_claimant_or_partner: false
        universal_credit_reported: 3_000
      claimant:
        age: 70
        is_claimant_or_partner: true
        state_pension: 7_000
      partner:
        age: 55
        is_claimant_or_partner: true
    benunits:
      benunit:
        members: [grandparent, claimant, partner]
    households:
      household:
        members: [grandparent, claimant, partner]
  output:
    is_mixed_age_couple: true
    meets_pension_credit_age_conditions: true

# SI 2019/37 art. 4(1): the older member must have reached the qualifying age
# by 14 May 2019, so been born on or before 5 February 1954 (State Pension age
# 6 May 2019; a birth on 6 February 1954 reaches it on 6 July 2019). Ages are
# the legal ages on 6 October 2026.
- name: Mixed-age saving, older member born 5 February 1954, is set
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 72
        date_of_birth: 19540205
        state_pension: 9_000
        pension_credit_reported: 1_000
      younger:
        age: 60
    benunits:
      benunit:
        members: [older, younger]
    households:
      household:
        members: [older, younger]
  output:
    has_mixed_age_couple_pension_credit_saving: true

- name: Mixed-age saving, older member born 6 February 1954, is not set
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 72
        date_of_birth: 19540206
        state_pension: 9_000
        pension_credit_reported: 1_000
      younger:
        age: 60
    benunits:
      benunit:
        members: [older, younger]
    households:
      household:
        members: [older, younger]
  output:
    has_mixed_age_couple_pension_credit_saving: false
