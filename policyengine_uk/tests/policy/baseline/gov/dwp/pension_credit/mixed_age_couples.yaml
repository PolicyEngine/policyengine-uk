  # model's 2019 parameters), so the couple was not a mixed-age couple then.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 70
        state_pension: 9_000
        pension_credit_reported: 1_000
      younger:
        age: 60
    benunits:
      benunit:
        members: [older, younger]
    households:
      household:
        members: [older, younger]
        rent: 6_240
        tenure_type: RENT_FROM_COUNCIL
  output:
    has_mixed_age_couple_pension_credit_saving: false
    pension_credit: 0
    is_uc_eligible: true

