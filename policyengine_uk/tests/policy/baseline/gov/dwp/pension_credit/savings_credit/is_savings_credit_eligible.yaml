- name: No one reached SPA before the cutoff year, ineligible for savings credit
  period: 2023
  input:
    people:
      person:
        age: 68
        is_male: true
        state_pension_age: 66
    benunits:
      benunit:
        members: [person]
        savings_credit_income: 10000
  output:
    is_savings_credit_eligible: false

- name: Has pre-cutoff year SPA member and income above threshold (single), eligible
  period: 2023
  input:
    people:
      person:
        age: 78
        is_male: false
        state_pension_age: 60
    benunits:
      benunit:
        members: [person]
        savings_credit_income: 10200
  output:
    is_savings_credit_eligible: true

- name: Has pre-cutoff year SPA member but income below annual threshold, ineligible
  period: 2026
  input:
    people:
      person:
        age: 81
        is_male: false
        state_pension_age: 60
    benunits:
      benunit:
        members: [person]
        savings_credit_income: 10_000
  output:
    is_savings_credit_eligible: false

- name: One member reached SPA before cutoff year and income above threshold (couple), eligible
  period: 2023
  input:
    people:
      person:
        age: 73
        is_male: true
        state_pension_age: 65
      spouse:
        age: 66
        is_male: false
        state_pension_age: 66
    benunits:
      benunit:
        members: [person, spouse]
        savings_credit_income: 16000
  output:
    is_savings_credit_eligible: true

- name: No pre-cutoff year SPA member and income above threshold (couple), ineligible
  period: 2023
  input:
    people:
      person:
        age: 67
        is_male: true
        state_pension_age: 66
      spouse:
        age: 65
        is_male: false
        state_pension_age: 66
    benunits:
      benunit:
        members: [person, spouse]
        savings_credit_income: 16000
  output:
    is_savings_credit_eligible: false

- name: A nonclaimant's age-requirement flag cannot establish Savings Credit eligibility.
  period: 2026
  input:
    people:
      claimant:
        age: 68
      young_person:
        age: 19
        is_claimant_or_partner: false
        # Deliberate override to isolate s.3(1)'s claimant/partner restriction.
        meets_savings_credit_age_requirement: true
    benunits:
      benunit:
        members: [claimant, young_person]
        savings_credit_income: 12_000
  output:
    # 12,000 > 208.07 * 52, but no claimant reached SPA before the cutoff.
    is_savings_credit_eligible: false

- name: Case 6, 2025 single claimant below the published threshold is ineligible.
  period: 2025
  input:
    people:
      person:
        age: 80
        state_pension_age: 60
    benunits:
      benunit:
        members: [person]
        relation_type: SINGLE
        # One penny below 198.27 * 52.
        savings_credit_income: 10_310.03
  output:
    is_savings_credit_eligible: false

- name: Case 7, 2025 couple below the published threshold is ineligible.
  period: 2025
  input:
    people:
      person:
        age: 80
        state_pension_age: 60
      person2:
        age: 78
        state_pension_age: 60
    benunits:
      benunit:
        members: [person, person2]
        relation_type: COUPLE
        savings_credit_income: 16_000
  output:
    is_savings_credit_eligible: false

- name: Case 8, 2025 single claimant above the published threshold is eligible.
  period: 2025
  input:
    people:
      person:
        age: 80
        state_pension_age: 60
    benunits:
      benunit:
        members: [person]
        relation_type: SINGLE
        # One penny above 198.27 * 52.
        savings_credit_income: 10_310.05
  output:
    is_savings_credit_eligible: true

- name: Case 9, 2027 uses the threshold derived from the two projection bases.
  period: 2027
  input:
    people:
      person:
        age: 82
        state_pension_age: 60
    benunits:
      benunit:
        members: [person]
        relation_type: SINGLE
        savings_credit_income: 11_000
  output:
    # The projected weekly threshold is about 216.71465, or 11,269.16 a year.
    is_savings_credit_eligible: false
