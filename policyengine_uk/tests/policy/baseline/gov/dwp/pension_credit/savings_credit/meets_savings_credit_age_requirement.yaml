# A whole age places the date of birth in the middle of the year of age: a
# 75-year-old on 6 October 2023 was born on 6 April 1948.

- name: Man born 6 April 1948 reached State Pension age at 65 in 2013
  period: 2023
  input:
    people:
      person:
        age: 75
        is_male: true
    benunits:
      benunit:
        members: [person]
  output:
    meets_savings_credit_age_requirement: true

