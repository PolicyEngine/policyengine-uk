- name: The disregard comes off Pension Credit income and raises the guarantee credit.
  period: 2024
  input:
    people:
      claimant:
        age: 70
        employment_income: 2000
        state_pension: 9000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # minimum guarantee 218.15 a week in 2024-25 (SI 2024/242)
    pension_credit_income: 9_000 + 2_000 - 5 * 52
    guarantee_credit: 218.15 * 52 - (9_000 + 2_000 - 5 * 52)

- name: A taxpayer's disregard is capped at net earnings, so earnings below the disregard leave Pension Credit income unchanged (reg 17(9), 17(10)).
  period: 2024
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        private_pension_income: 3_000
        attendance_allowance: 3_000
        employment_income: 1_040
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # Income tax (16,040 - 12,570) x 20% = 694. Tax on the earnings is the
    # lesser of 694 and 20% x 1,040 = 208, so net earnings are 832; the 20
    # pound (attendance allowance) disregard of 1,040 is capped at 832.
    pension_credit_earnings_disregard: 832
    # 16,040 - 694 - 832, the same as with no earnings (next case).
    pension_credit_income: 14_514

- name: The same claimant with no earnings has the same Pension Credit income.
  period: 2024
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        private_pension_income: 3_000
        attendance_allowance: 3_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # 15,000 - (15,000 - 12,570) x 20%
    pension_credit_earnings_disregard: 0
    pension_credit_income: 14_514

- name: A dependant's caring does not qualify a couple for the higher disregard (Sch I para 4 is the claimant's or partner's).
  period: 2024
  input:
    people:
      claimant:
        age: 70
        employment_income: 2_000
      partner:
        age: 70
      child:
        age: 17
        is_entitled_to_carer_benefit: true
    benunits:
      benunit:
        members: [claimant, partner, child]
    households:
      household:
        members: [claimant, partner, child]
  output:
    pension_credit_earnings_disregard: 10 * 52

- name: A Scottish taxpayer's tax on earnings is their top slice on the Scottish schedule, so Pension Credit income does not fall with earnings.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        private_pension_income: 16_000
        attendance_allowance: 5_000
        employment_income: 1_040
      partner:
        age: 70
        attendance_allowance: 5_000
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        country: SCOTLAND
  output:
    # The 1,040 of earnings add 210.89 of income tax (they cross into the
    # Scottish intermediate band), so net earnings are 829.11 and the 20 pound
    # disregard of 1,040 is capped there; income is as with no earnings (next).
    income_tax: [3_016.62, 0]
    pension_credit_earnings_disregard: 829.11
    pension_credit_income: 25_194.27

- name: The same Scottish couple with no earnings has the same Pension Credit income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        private_pension_income: 16_000
        attendance_allowance: 5_000
      partner:
        age: 70
        attendance_allowance: 5_000
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        country: SCOTLAND
  output:
    income_tax: [2_805.73, 0]
    pension_credit_earnings_disregard: 0
    pension_credit_income: 25_194.27

