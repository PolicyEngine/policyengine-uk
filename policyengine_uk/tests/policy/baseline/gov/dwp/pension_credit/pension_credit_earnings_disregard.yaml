- name: Tax on earnings includes the tax they add on savings income, so Pension Credit income does not fall with earnings.
  period: 2024
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        savings_interest_income: 12_000
        attendance_allowance: 3_000
        employment_income: 1_040
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # Income tax is 1,294 with the earnings and 1,086 without (next case): the
    # earnings take 470 of non-savings income over the personal allowance,
    # and take the personal allowance off 570 of savings interest. Tax on the
    # earnings is 208, so net earnings are 832 and the 20 pound disregard of
    # 1,040 is capped there. Pension Credit counts deemed income from capital
    # rather than the interest, so its income is 12,000 + 1,040 - 1,294 - 832.
    income_tax: 1_294
    pension_credit_employment_income_tax: 208
    pension_credit_earnings_disregard: 832
    pension_credit_income: 10_914

- name: The same claimant with savings and no earnings has the same Pension Credit income.
  period: 2024
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        savings_interest_income: 12_000
        attendance_allowance: 3_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    income_tax: 1_086
    pension_credit_earnings_disregard: 0
    # 12,000 - 1,086.
    pension_credit_income: 10_914

- name: Tax on earnings is net of the pension tax relief the earnings unlock.
  period: 2024
  input:
    people:
      claimant:
        age: 70
        private_pension_income: 15_000
        employment_income: 400
        personal_pension_contributions: 300
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # The earnings add 400 x 20% = 80 of tax but let the 300 of contributions
    # be relieved, worth 60: income tax is 506, against 486 without them
    # (next case), so tax on the earnings is 20. Net earnings are 400 - 20 -
    # 300 / 2 = 230, under the 5 pound disregard of 260.
    income_tax: 506
    pension_credit_employment_income_tax: 20
    pension_credit_earnings_disregard: 230
    # 15,400 - 506 - 150 - 230: more than without the earnings, so earning
    # more never raises Pension Credit.
    pension_credit_income: 14_514

- name: The same claimant with no earnings.
  period: 2024
  input:
    people:
      claimant:
        age: 70
        private_pension_income: 15_000
        personal_pension_contributions: 300
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    income_tax: 486
    pension_credit_earnings_disregard: 0
    # 15,000 - 486 - 300 / 2.
    pension_credit_income: 14_364

- name: A self-employment loss is not set against wages in the disregard (CER 1996 reg 13(12)).
  period: 2025
  input:
    people:
      claimant:
        age: 70
        employment_income: 400
        self_employment_income: -8_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # Net earnings are the 400 of wages; the 5 pound disregard is 260.
    pension_credit_earnings_disregard: 260
    pension_credit_income: 400 - 260

- name: Self-employed earnings under the personal allowance carry no notional tax, and the tax they actually cause is not deducted (CER 1996 reg 14; SPC reg 17(11)).
  period: 2025
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        self_employment_income: 3_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # The State Pension uses all but 570 of the personal allowance, so the
    # profit causes all of the (15,000 - 12,570) x 20% = 486 of income tax.
    income_tax: 486
    pension_credit_self_employment_income_tax: 486
    # Notional tax at the basic rate on the profit less the personal
    # allowance alone is nil; Class 4 is not payable over State Pension age.
    pension_credit_self_employment_deductions: 0
    pension_credit_earnings_disregard: 260
    # 15,000 - (486 - 486 + 0) - 260.
    pension_credit_income: 14_740

- name: Profit within the trading allowance is tax-free and fully disregarded up to the 20 pound limit.
  period: 2025
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        private_pension_income: 3_000
        attendance_allowance: 3_000
        self_employment_income: 1_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # The 1,000 trading allowance relieves the profit, so income tax is the
    # (15,000 - 12,570) x 20% = 486 on the pensions.
    income_tax: 486
    pension_credit_self_employment_income_tax: 0
    pension_credit_earnings_disregard: 1_000
    # 16,000 - 486 - 1,000, the same as with no profit: 15,000 - 486.
    pension_credit_income: 14_514

- name: A Scottish self-employed earner's notional tax is at the Scottish basic rate, with main-rate Class 4 under State Pension age.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 60
        self_employment_income: 20_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
        country: SCOTLAND
  output:
    # (20,000 - 12,570) x 20% = 1,486, not the 1,457.73 of income tax on the
    # Scottish starter, basic and intermediate bands; Class 4 is
    # (20,000 - 12,570) x 6% = 445.80.
    income_tax: 1_457.73
    pension_credit_self_employment_deductions: 1_486 + 445.80

- name: Before April 2024 the notional contributions include Class 2 (CER 1996 reg 14(2)(a)).
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 60
        self_employment_income: 20_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # (20,000 - 12,570) x 20% = 1,486; Class 4 (20,000 - 12,570) x 9% =
    # 668.70; Class 2 3.45 x 52 = 179.40.
    pension_credit_self_employment_deductions: 1_486 + 668.70 + 179.40

- name: The notional tax deducts the blind person's allowance with the personal allowance (ITA 2007 Part 3 Chapter 2).
  period: 2024
  input:
    people:
      claimant:
        age: 70
        self_employment_income: 20_000
        blind_persons_allowance: 3_070
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # (20,000 - 12,570 - 3,070) x 20%.
    pension_credit_self_employment_deductions: 872

