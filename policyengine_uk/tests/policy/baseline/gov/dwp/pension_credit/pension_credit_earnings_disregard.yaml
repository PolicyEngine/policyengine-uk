- name: The disregard comes off Pension Credit income and raises the guarantee credit.
  period: 2024
  input:
    people:
      claimant:
        age: 70
        employment_income: 2000
        state_pension: 9000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # minimum guarantee 218.15 a week in 2024-25 (SI 2024/242)
    pension_credit_income: 9_000 + 2_000 - 5 * 52
    guarantee_credit: 218.15 * 52 - (9_000 + 2_000 - 5 * 52)

- name: A taxpayer's disregard is capped at net earnings, so earnings below the disregard leave Pension Credit income unchanged (reg 17(9), 17(10)).
  period: 2024
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        private_pension_income: 3_000
        attendance_allowance: 3_000
        employment_income: 1_040
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # Income tax (16,040 - 12,570) x 20% = 694, against 486 without the
    # earnings (next case), so tax on the earnings is 208 and net earnings are
    # 832; the 20 pound (attendance allowance) disregard of 1,040 is capped at
    # 832.
    pension_credit_earnings_disregard: 832
    # 16,040 - 694 - 832, the same as with no earnings (next case).
    pension_credit_income: 14_514

- name: The same claimant with no earnings has the same Pension Credit income.
  period: 2024
  input:
    people:
      claimant:
        age: 70
        state_pension: 12_000
        private_pension_income: 3_000
        attendance_allowance: 3_000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    # 15,000 - (15,000 - 12,570) x 20%
    pension_credit_earnings_disregard: 0
    pension_credit_income: 14_514

