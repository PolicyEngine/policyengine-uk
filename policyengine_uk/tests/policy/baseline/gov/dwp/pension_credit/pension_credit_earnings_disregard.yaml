# Expected values are hand-computed from SPC Regs 2002 Sch VI (paras 1, 3, 4,
# 4A and 5): weekly amounts times 52 weeks, capped at the earnings.

- name: A single claimant with earnings has 5 pounds a week disregarded (para 5(a)).
  period: 2024
  input:
    people:
      claimant:
        age: 70
        employment_income: 2000
    benunits:
      benunit:
        members: [claimant]
    households:
      household:
        members: [claimant]
  output:
    pension_credit_earnings_disregard: 5 * 52

- name: A couple with earnings has 10 pounds a week disregarded (para 5(b)).
  period: 2024
  input:
    people:
      claimant:
        age: 70
        employment_income: 2000
      partner:
        age: 70
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
  output:
    pension_credit_earnings_disregard: 10 * 52

