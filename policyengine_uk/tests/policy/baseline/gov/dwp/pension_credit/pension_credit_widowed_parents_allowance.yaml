# Widowed parent's allowance (WPA) in Pension Credit and pension-age Housing
# Benefit income.
#
# SPC Regs 2002 reg 15(1): "all social security benefits are prescribed except"
# a closed list. The list excepts bereavement support payment (n) but not WPA,
# Sch IV disregards none of it, and reg 9 does not make it non-qualifying
# income for Savings Credit. HB (SPC) Regs 2006 Sch 5 para 7 disregards £15 a
# week of it for pension-age Housing Benefit.
#
# SSCBA 1992 s.39A(4) and (5) end the allowance at pensionable age and suspend
# it while the recipient lives with a partner, so these pensioners could not
# lawfully be paid it. The cases test how a reported award is counted, not
# whether it would be paid.
# Weekly rates, x 52: SI 2026/148 art 29, standard minimum guarantee 238.00
# single and 363.25 couple, Savings Credit threshold 208.07 single; Carer's
# Allowance 86.45 from 6 April 2026
# (gov.dwp.carers_allowance.rate and the up-rating order it cites).
# Nobody pays income tax: each total income is below the personal allowance.

- name: Case 1, single pensioner with a reported widowed parent's allowance.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        private_pension_income: 1_000
        widowed_parents_allowance_reported: 2_000
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    pension_credit_income: 3_000
    # 12,376 - 3,000 = 9,376.
    guarantee_credit: 238 * 52 - 3_000

- name: Case 2, pensioner couple whose partner has a reported widowed parent's allowance.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        private_pension_income: 5_000
      person2:
        age: 70
        state_pension: 0
        widowed_parents_allowance_reported: 3_000
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
  output:
    pension_credit_income: 8_000
    # 18,889 - 8,000 = 10,889.
    guarantee_credit: 363.25 * 52 - 8_000

- name: Case 3, the allowance displaces Carer's Allowance, so Pension Credit income is unchanged.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        care_hours: 35
        widowed_parents_allowance_reported: 1_000
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # The Overlapping Benefits Regulations reduce Carer's Allowance by the
    # 1,000: 4,495.40 - 1,000 = 3,495.40.
    carers_allowance: 86.45 * 52 - 1_000
    # 1,000 + 3,495.40 = 4,495.40, the same as with no allowance.
    pension_credit_income: 86.45 * 52

- name: Case 4, Savings Credit counts the allowance as qualifying income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        # Reached State Pension age before 6 April 2016.
        age: 80
        state_pension: 0
        private_pension_income: 9_000
        widowed_parents_allowance_reported: 2_000
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    pension_credit_income: 11_000
    savings_credit_income: 11_000
    # Qualifying income is above the threshold (208.07 x 52 = 10,819.64) and
    # income below the guarantee (12,376), so 0.6 x 180.36 = 108.22.
    savings_credit: 0.6 * (11_000 - 208.07 * 52)
    # 12,376 - 11,000 = 1,376.
    guarantee_credit: 238 * 52 - 11_000

- name: Case 5, pension-age Housing Benefit counts the allowance less £15 a week.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        widowed_parents_allowance_reported: 2_000
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # 2,000 - 15 x 52 = 1,220.
    housing_benefit_widowed_parents_allowance_income: 2_000 - 15 * 52
    pension_credit_income: 2_000
