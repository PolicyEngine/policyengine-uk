- name: All income sources are included.
  period: 2021
  input:
    people:
      person:
        age: 70
        employment_income: 1
        state_pension: 4
        private_pension_income: 8
        esa_contrib: 32
        jsa_contrib: 64
        self_employment_income: 128
    benunits:
      benunit:
        members: person
        working_tax_credit: 2
    households:
      household:
        members: person
        savings: 11_000
  output:
    pension_credit_deemed_income: 104
    # 1 + 2 + 4 + 8 + 32 + 64 + 128 + 104 = 343, less the Sch VI disregard:
    # the 20 pound para 4(1)(a)(vii) amount (contributory ESA), capped at the
    # 129 of net earnings (no tax or NI on them).
    pension_credit_earnings_disregard: 129
    pension_credit_income: 214

- name: Interest and dividends are not counted directly in Pension Credit income.
  period: 2021
  input:
    people:
      person:
        age: 70
        savings_interest_income: 500
        dividend_income: 300
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 10_000
  output:
    pension_credit_deemed_income: 0
    pension_credit_income: 0

- name: Pension Credit deemed income starts above the capital disregard.
  period: 2021
  input:
    people:
      person:
        age: 70
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 10_001
  output:
    pension_credit_assessable_capital: 10_001
    pension_credit_deemed_income: 52
    pension_credit_income: 52

- name: Case 4, rent from a let property is not Pension Credit income; the property counts through deemed income.
  # SPC Regs 2002 Sch IV para 18 disregards any actual income from capital, so
  # the £10,476 of rent does not count. Deemed income (reg 15(6)): capital
  # 55,825 - 10,000 = 45,825, ceil(45,825 / 500) = 92, so £92 a week, 4,784 a
  # year. Guarantee credit = (238 - 92) x 52 = 7,592. Savings credit is nil, as
  # qualifying income (£92 a week) is below the savings credit threshold.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 79
        property_income: 10_476
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        other_residential_property_value: 55_370
        savings: 455
  output:
    pension_credit_assessable_capital: 55_825
    pension_credit_deemed_income: 4_784
    pension_credit_income: 4_784
    guarantee_credit: 7_592
    savings_credit: 0
    pension_credit: 7_592

