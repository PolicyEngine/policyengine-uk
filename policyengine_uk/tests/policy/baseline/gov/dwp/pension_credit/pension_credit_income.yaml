- name: All income sources are included.
  period: 2021
  input:
    people:
      person:
        age: 70
        employment_income: 1
        state_pension: 4
        private_pension_income: 8
        esa_contrib: 32
        jsa_contrib: 64
        self_employment_income: 128
    benunits:
      benunit:
        members: person
        working_tax_credit: 2
    households:
      household:
        members: person
        savings: 11_000
  output:
    pension_credit_deemed_income: 104
    pension_credit_income: 343

- name: Interest and dividends are not counted directly in Pension Credit income.
  period: 2021
  input:
    people:
      person:
        age: 70
        savings_interest_income: 500
        dividend_income: 300
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 10_000
  output:
    pension_credit_deemed_income: 0
    pension_credit_income: 0

- name: Pension Credit deemed income starts above the capital disregard.
  period: 2021
  input:
    people:
      person:
        age: 70
    benunits:
      benunit:
        members: person
    households:
      household:
        members: person
        savings: 10_001
  output:
    pension_credit_assessable_capital: 10_001
    pension_credit_deemed_income: 52
    pension_credit_income: 52

- name: Case 4, property income and non-main-home capital count for Pension Credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 79
        property_income: 10_476
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        other_residential_property_value: 55_370
        savings: 455
  output:
    # 455 + 90% of 55,370 (SPC Regs 2002 reg. 19(a)). Deemed income is
    # 81 steps of 500 above 10,000 at 1 a week: 81 * 52 = 4,212.
    pension_credit_assessable_capital: 50_288
    pension_credit_deemed_income: 4_212
    pension_credit_income: 14_688
    # Income exceeds the 12,376 guarantee, so no guarantee credit. Savings
    # credit: 60% of (12,376 - 208.07 * 52) = 933.82, less 40% of
    # (14,688 - 12,376) = 924.80, leaves 9.02.
    guarantee_credit: 0
    pension_credit: 9.016

- name: Case 5, 2026 Pension Credit uses tariff income with the published guarantee rate.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 81
        savings_interest_income: 7_488
        dividend_income: 380
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        savings: 87_285
        corporate_wealth: 12_650
  output:
    # 87,285 + 90% of 12,650 (SPC Regs 2002 reg. 19(a)). Deemed income is
    # 178 steps of 500 above 10,000 at 1 a week: 178 * 52 = 9,256.
    pension_credit_assessable_capital: 98_670
    pension_credit_deemed_income: 9_256
    pension_credit_income: 9_256
    standard_minimum_guarantee: 12_376
    guarantee_credit: 3_120
    pension_credit: 3_120

- name: Pension Credit capital disregards private pension wealth
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 81
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        savings: 12_000
        private_pension_wealth: 200_000
  output:
    pension_credit_assessable_capital: 12_000
