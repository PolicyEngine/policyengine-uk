# War pensions and Armed Forces Compensation Scheme (AFCS) payments in
# Pension Credit income.
#
# SPCA 2002 s.15(1)(g) counts "a war disablement pension or war widow's or
# widower's pension"; SPC Regs 2002 reg 15(5)(aa) counts "a guaranteed income
# payment". Reg 17(7) applies Sch IV, whose para 1 disregards "£10 of any of
# the following": war disablement pensions, war widow's or widower's pensions
# and guaranteed income payments among them. PolicyEngine reads "£10 of any of
# the following" as £10 of each qualifying payment: afcs and
# war_widows_pension each get £10 a week, and an unused disregard does not
# pass to another payment or to the other member of a couple. The claimant's
# and the partner's payments count (SPCA s.5; reg 14: "any reference in this
# Part to the claimant shall apply equally to any partner of the claimant").
# Reg 9 does not exclude these payments from Savings Credit qualifying income.
#
# Statutory 2026-27 rates (SI 2026/148 art 29): standard minimum guarantee
# £238.00 single and £363.25 couple (reg 6(1)); severe disability addition
# £86.05 (reg 6(5)(a)); Savings Credit threshold £208.07 single (reg 7(2)).
# Reg 7(1): maximum savings credit and amount A 60%, amount B 40%. The £10
# disregard has been £10 since the Regulations were made. Payment amounts
# are illustrative weekly amounts (war pensions and AFCS payments are uprated
# by Ministry of Defence instruments, not by SI 2026/148). Annual amounts use
# the model's 52 weeks a year.

- name: Case 1, an AFCS payment above £10 a week counts less £10.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        afcs: 30 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # (30 - 10) * 52 = 1,040.
    pension_credit_war_pension_income: (30 - 10) * 52
    pension_credit_income: (30 - 10) * 52
    minimum_guarantee: 238 * 52
    # 238 * 52 - 1,040 = 12,376 - 1,040 = 11,336.
    guarantee_credit: (238 - 20) * 52

- name: Case 2, an AFCS payment below £10 a week is wholly disregarded.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        afcs: 5 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # max(5 - 10, 0) * 52 = 0. Unchanged behaviour: passes on the base too.
    pension_credit_war_pension_income: 0
    pension_credit_income: 0
    guarantee_credit: 238 * 52

- name: Case 3, an AFCS payment of exactly £10 a week is wholly disregarded.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        afcs: 10 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # max(10 - 10, 0) * 52 = 0. Unchanged behaviour: passes on the base too.
    pension_credit_war_pension_income: 0
    pension_credit_income: 0
    guarantee_credit: 238 * 52

- name: Case 4, a war widow's pension counts less £10.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        war_widows_pension: 30 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # (30 - 10) * 52 = 1,040; 12,376 - 1,040 = 11,336.
    pension_credit_war_pension_income: (30 - 10) * 52
    pension_credit_income: (30 - 10) * 52
    guarantee_credit: (238 - 20) * 52

- name: Case 5, one person with an AFCS payment and a war widow's pension gets £10 off each.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        afcs: 20 * 52
        war_widows_pension: 15 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # ((20 - 10) + (15 - 10)) * 52 = 15 * 52 = 780; 12,376 - 780 = 11,596.
    pension_credit_war_pension_income: (10 + 5) * 52
    pension_credit_income: (10 + 5) * 52
    guarantee_credit: (238 - 15) * 52

- name: Case 6, each member of a couple gets their own £10.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        state_pension: 0
        afcs: 30 * 52
      person2:
        age: 70
        state_pension: 0
        war_widows_pension: 20 * 52
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
  output:
    # ((30 - 10) + (20 - 10)) * 52 = 30 * 52 = 1,560.
    pension_credit_war_pension_income: (20 + 10) * 52
    pension_credit_income: (20 + 10) * 52
    minimum_guarantee: 363.25 * 52
    # 363.25 * 52 - 1,560 = 18,889 - 1,560 = 17,329.
    guarantee_credit: (363.25 - 30) * 52

- name: Case 7, a partner's unused disregard does not pass to the claimant.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        state_pension: 0
        afcs: 30 * 52
      person2:
        age: 70
        state_pension: 0
        afcs: 5 * 52
    benunits:
      benunit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
  output:
    # max(30 - 10, 0) + max(5 - 10, 0) = 20 a week, not 30 + 5 - 20 = 15.
    # 20 * 52 = 1,040; 18,889 - 1,040 = 17,849.
    pension_credit_war_pension_income: 20 * 52
    pension_credit_income: 20 * 52
    guarantee_credit: (363.25 - 20) * 52

- name: Case 8, an AFCS payment is Savings Credit qualifying income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 80
        state_pension: 0
        private_pension_income: 198.07 * 52
        afcs: 40 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # Private pension 10,299.64 is below the personal allowance and AFCS is
    # not taxable income, so there is no income tax.
    income_tax: 0
    # 198.07 + (40 - 10) = 228.07 a week; 228.07 * 52 = 11,859.64.
    pension_credit_war_pension_income: (40 - 10) * 52
    pension_credit_income: 228.07 * 52
    savings_credit_income: 228.07 * 52
    # 238 - 228.07 = 9.93 a week; 9.93 * 52 = 516.36.
    guarantee_credit: 9.93 * 52
    # Amount A = min(0.6 * (238 - 208.07), 0.6 * (228.07 - 208.07))
    #          = min(17.958, 12.00) = 12.00; amount B = 0.4 * 0 = 0.
    # 12.00 * 52 = 624. Whole pennies, so reg 7(4) rounding does not arise.
    savings_credit: 12 * 52

- name: Case 9, a dependant's and a third adult's payments do not count.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 75
        state_pension: 0
      person2:
        age: 72
        state_pension: 0
      person3:
        age: 45
        afcs: 50 * 52
      person4:
        age: 17
        afcs: 30 * 52
    benunits:
      benunit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        country: ENGLAND
  output:
    is_claimant_or_partner: [true, true, false, false]
    # Only the claimant's and partner's payments count (SPCA s.5; reg 14).
    # Unchanged behaviour: passes on the base too.
    pension_credit_war_pension_income: 0
    pension_credit_income: 0

- name: Case 10, armed forces independence payment is not Pension Credit income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        afcs: 30 * 52
        armed_forces_independence_payment: 100 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # Reg 15(1)(ab) excepts armed forces independence payment; only the AFCS
    # payment counts: (30 - 10) * 52 = 1,040.
    pension_credit_war_pension_income: (30 - 10) * 52
    pension_credit_income: (30 - 10) * 52
    # Armed forces independence payment gives the severe disability
    # addition (Sch I para 1; reg 6(5)(a)): (238 + 86.05) * 52 = 16,850.60.
    minimum_guarantee: (238 + 86.05) * 52
    # 16,850.60 - 1,040 = 15,810.60.
    guarantee_credit: (238 + 86.05 - 20) * 52

- name: Case 11, Bereavement Support Payment is still not Pension Credit income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        bsp: 30 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # Reg 15(1)(n) excepts bereavement support payment. Unchanged behaviour:
    # passes on the base too.
    pension_credit_war_pension_income: 0
    pension_credit_income: 0
    guarantee_credit: 238 * 52

- name: Case 12, a reported war widow's pension is in the benefit totals and untaxed.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        war_widows_pension_reported: 30 * 52
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    war_widows_pension: 30 * 52
    # It joins the gross benefit totals that bsp is in, so moving FRS code 9
    # from bsp to this variable leaves the totals unchanged.
    household_benefits: 30 * 52
    hbai_benefits: 30 * 52
    gov_spending: 30 * 52
    pre_budget_change_household_benefits: 30 * 52
    # ITEPA 2003 s.639: no income tax on war widow's pensions.
    social_security_income: 0
    income_tax: 0

- name: Case 13, an unused disregard on one payment does not pass to the person's other payment.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        state_pension: 0
        afcs: 5 * 52
        war_widows_pension: 30 * 52
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # max(5 - 10, 0) + max(30 - 10, 0) = 20 a week, not 5 + 30 - 10 = 25.
    # 20 * 52 = 1,040; 12,376 - 1,040 = 11,336.
    pension_credit_war_pension_income: 20 * 52
    pension_credit_income: 20 * 52
    guarantee_credit: (238 - 20) * 52
