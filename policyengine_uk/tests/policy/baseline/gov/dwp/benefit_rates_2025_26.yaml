# 2025-26 rates from DWP's "Benefit and pension rates 2025 to 2026", as set by
# the Social Security Benefits Up-rating Order 2025 (SI 2025/295). Weekly
# amounts times 52.

- name: Pension Credit standard minimum guarantee, single
  period: 2025
  absolute_error_margin: 0.01
  input:
    benunits:
      benunit:
        members: [person]
        relation_type: SINGLE
    people:
      person:
        age: 70
  output:
    standard_minimum_guarantee: 227.10 * 52

- name: Pension Credit standard minimum guarantee, couple
  period: 2025
  absolute_error_margin: 0.01
  input:
    benunits:
      benunit:
        members: [person, partner]
        relation_type: COUPLE
    people:
      person:
        age: 70
      partner:
        age: 70
  output:
    standard_minimum_guarantee: 346.60 * 52

- name: Housing Benefit personal allowance, single aged 25 or over
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        is_SP_age: false
    benunits:
      benunit:
        members: [person]
        housing_benefit_eligible: true
        eldest_adult_age: 30
        is_single_person: true
        is_couple: false
        is_lone_parent: false
        benefits_premiums: 0
  output:
    housing_benefit_applicable_amount: 92.05 * 52

