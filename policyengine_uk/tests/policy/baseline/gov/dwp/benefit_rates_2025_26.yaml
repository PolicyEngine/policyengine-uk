- name: Disability premium, single and couple
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      a:
        age: 40
      b:
        age: 40
      c:
        age: 40
    benunits:
      single:
        members: [a]
        is_single: true
        is_couple: false
        num_disabled_adults: 1
      couple:
        members: [b, c]
        is_single: false
        is_couple: true
        num_disabled_adults: 1
  output:
    disability_premium: [2_246.40, 3_205.80]  # 43.20 and 61.65 a week

- name: Carer premium, one carer and two carers
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      a:
        age: 40
      b:
        age: 40
      c:
        age: 40
    benunits:
      one:
        members: [a]
        num_carers: 1
      two:
        members: [b, c]
        num_carers: 2
  output:
    carer_premium: [2_412.80, 4_825.60]  # 46.40 and 2 x 46.40 a week

- name: Attendance Allowance, Disability Living Allowance and Personal Independence Payment lower and middle rates
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 70
        aa_category: LOWER
        dla_sc_category: MIDDLE
        dla_m_category: LOWER
        pip_dl_category: STANDARD
        pip_m_category: STANDARD
  output:
    attendance_allowance: 73.90 * 52
    dla_sc: 73.90 * 52
    dla_m: 29.20 * 52
    pip_dl: 73.90 * 52
    pip_m: 29.20 * 52

- name: Carer's Allowance
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        care_hours: 40
        would_claim_carers_allowance: true
    households:
      household:
        members: [person]
        region: LONDON
  output:
    carers_allowance: 83.30 * 52
