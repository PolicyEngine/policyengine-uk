# Two Child Limit Payment tests
# The proposed regulations were never laid. Positive cases enable a counterfactual.

- name: No payment in Scotland before April 2025
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      parent:
        age: 30
      child_1:
        age: 5
        uc_is_child_limit_affected: false
      child_2:
        age: 3
        uc_is_child_limit_affected: false
      child_3:
        age: 1
        uc_is_child_limit_affected: true
    benunits:
      benunit:
        members: [parent, child_1, child_2, child_3]
    households:
      household:
        members: [parent, child_1, child_2, child_3]
        region: SCOTLAND
  output:
    # Payment not in effect before April 2025
    two_child_limit_payment: 0

- name: Counterfactual - Payment in Scotland in 2025
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.social_security_scotland.two_child_limit_payment.in_effect: true
    people:
      parent:
        age: 30
      child_1:
        age: 5
        uc_is_child_limit_affected: false
      child_2:
        age: 3
        uc_is_child_limit_affected: false
      child_3:
        age: 1
        uc_is_child_limit_affected: true
    benunits:
      benunit:
        members: [parent, child_1, child_2, child_3]
    households:
      household:
        members: [parent, child_1, child_2, child_3]
        region: SCOTLAND
  output:
    # UC child element amount * 12 months * 1 affected child
    two_child_limit_payment: 3513.72

