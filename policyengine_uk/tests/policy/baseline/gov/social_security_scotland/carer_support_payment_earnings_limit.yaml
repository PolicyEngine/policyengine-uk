# CSP earnings condition: SSI2023/302reg14 andSch2para4.
# Constant-through-year actual pay; no earnings/eligibility/award overrides.
- name: Scottish carer with forty thousand pounds of pay gets no CSP
  period: 2026
  absolute_error_margin: 0.01
