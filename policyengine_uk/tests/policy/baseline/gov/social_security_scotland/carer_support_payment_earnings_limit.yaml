# CSP earnings condition: SSI2023/302reg14 andSch2para4.
# Constant-through-year actual pay; no earnings/eligibility/award overrides.
- name: Scottish carer with forty thousand pounds of pay gets no CSP
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 45
        employment_income: 40000
        care_hours: 40
      caree:
        age: 50
        pip_dl_category: STANDARD
    benunits:
      family:
        members:
        - carer
        - caree
    households:
      home:
        members:
        - carer
        - caree
        country: SCOTLAND
  output:
    carer_support_payment:
    - 0
    - 0
    carer_support_payment_pre_overlap:
    - 0
    - 0
    scottish_carer_supplement:
    - 0
    - 0
    is_carer_for_benefits:
    - true
    - false
