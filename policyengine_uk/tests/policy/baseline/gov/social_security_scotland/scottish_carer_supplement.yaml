# Social Security (Scotland) Act 2018 s.86B requires Scottish Ministers to
# bring forward legislation raising the Scottish Carer Supplement and the
# Carer Support Payment component to at least their s.86A inflation-adjusted
# levels. Their measure is the 12 months to September CPI, rounded to the
# nearest 5p (Social Security Assistance in Scotland: up-rating for inflation
# in 2026-27, sections 2 and 3). From April 2027 the model raises both each
# April by the previous September's CPI (gov.benefit_uprating_cpi) and rounds
# to the nearest 5p: 3.5% for April 2027 (ONS, 21 October 2026) and the OBR
# October 2026 EFO forecast of 3.4% for April 2028.

- name: Scottish Carer Supplement is 11.70 a week in 2026
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
  output:
    # SSI 2026/170 reg. 12(3)(b): 11.70 x 52.
    scottish_carer_supplement: 608.40
    carer_support_payment: 86.45 * 52

- name: Scottish Carer Supplement rises by September CPI in 2027
  period: 2027
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
  output:
    # 11.70 x 1.035 = 12.1095, to the nearest 5p 12.10; x 52 = 629.20.
    scottish_carer_supplement: 12.10 * 52
    # 86.45 x 1.035 = 89.47575, to the nearest 5p 89.50.
    carer_support_payment: 89.50 * 52

- name: Scottish Carer Supplement keeps rising in 2028
  period: 2028
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
  output:
    # 12.10 x 1.034 = 12.5114, to the nearest 5p 12.50; x 52 = 650.00.
    scottish_carer_supplement: 12.50 * 52
    # 89.50 x 1.034 = 92.543, to the nearest 5p 92.55.
    carer_support_payment: 92.55 * 52

- name: Carer in England gets no Scottish Carer Supplement in 2027
  period: 2027
  absolute_error_margin: 0
  input:
    age: 35
    care_hours: 40
    country: ENGLAND
  output:
    scottish_carer_supplement: 0
    carer_support_payment: 0

# Award weeks. SSI 2023/302 reg 14A: "An individual is entitled to Scottish
# Carer Supplement for each award week in which Carer Support Payment is
# payable to the individual." In reg 2, "award week" means "a period of 7
# days beginning on a Sunday and ending on a Saturday". The Scottish Ministers
# set the weekly rates in reg 16(1) and (1A): Carer Support Payment 86.45 and
# Scottish Carer Supplement 11.70. Under reg 42(1) and (5), a carer who moves
# to another part of the United Kingdom keeps Carer Support for 13 weeks;
# under reg 42(1A), where the cared-for person dies in that time, for 12 award
# weeks after the first day of the award week following the one in which they
# died, up to 25 weeks in all. The formula counts the weeks as the larger of
# carer_support_payment_pre_overlap and carer_support_payment over the weekly
# Carer Support Payment rate, up to 52, and pays the weekly supplement rate for
# each where carer_support_payment is positive, and nothing where it is £0.

- name: Carer in England with 13 weeks of Carer Support Payment gets 13 weeks of supplement
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 35
    country: ENGLAND
    # Reg 42(1) and (5): 13 weeks after the move, 13 x 86.45 = 1,123.85.
    carer_support_payment: 1123.85
  output:
    carer_support_payment_pre_overlap: 0
    # 1,123.85 / 86.45 = 13 award weeks; 13 x 11.70 = 152.10.
    scottish_carer_supplement: 152.10

- name: Carer in England whose cared-for person dies in week 13 after the move gets 25 weeks of supplement
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 35
    country: ENGLAND
    # Reg 42(1A): the cared-for person dies in week 13, and the carer keeps
    # Carer Support for the 12 award weeks from the start of week 14, 25 weeks
    # in all. 25 x 86.45 = 2,161.25.
    carer_support_payment: 2161.25
  output:
    carer_support_payment_pre_overlap: 0
    # 2,161.25 / 86.45 = 25 award weeks; 25 x 11.70 = 292.50.
    scottish_carer_supplement: 292.50

- name: One week of Carer Support Payment gives one week of supplement
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 35
    country: ENGLAND
    carer_support_payment: 86.45
  output:
    # 86.45 / 86.45 = 1 award week; 1 x 11.70 = 11.70.
    scottish_carer_supplement: 11.70

- name: Carer Support Payment worth more than 52 weeks gives 52 weeks of supplement
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 35
    country: ENGLAND
    # 60 x 86.45 = 5,187.
    carer_support_payment: 5187
  output:
    # The model counts 52 award weeks in a year: 52 x 11.70 = 608.40.
    scottish_carer_supplement: 608.40

- name: Carer in Scotland with no caring inputs and 13 weeks of Carer Support Payment gets 13 weeks of supplement
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 35
    country: SCOTLAND
    # No caring hours and no reported Carer's Allowance, so the inputs give
    # no entitlement before the overlapping-benefit reduction.
    carer_support_payment: 1123.85
  output:
    carer_support_payment_pre_overlap: 0
    # 13 x 11.70 = 152.10.
    scottish_carer_supplement: 152.10

- name: Carer in Scotland the model finds eligible keeps 52 weeks of supplement with a supplied part-year payment
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
    carer_support_payment: 1123.85
  output:
    # Age 35 and 40 hours of care a week describe a carer entitled all year:
    # 52 x 86.45 = 4,495.40 before the overlapping-benefit reduction.
    carer_support_payment_pre_overlap: 4495.40
    # The formula counts 52 award weeks from the larger amount: 52 x 11.70 =
    # 608.40. For a carer with 13 weeks of Carer Support Payment, Social
    # Security Scotland would pay 13 x 11.70 = 152.10; see the variable's
    # documentation.
    scottish_carer_supplement: 608.40

- name: Carer whose State Pension reduces Carer Support Payment and leaves some keeps 52 weeks of supplement
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    state_pension: 2_000
    care_hours: 35
    country: SCOTLAND
  output:
    carer_support_payment_pre_overlap: 4495.40
    # Reg 16(2)(a): 2,000 a year, 38.46 a week, falls short of the 86.45
    # weekly rate, so Carer Support Payment stays payable in every award
    # week: 4,495.40 - 2,000 = 2,495.40.
    carer_support_payment: 2495.40
    # Reg 14A: 52 x 11.70 = 608.40.
    scottish_carer_supplement: 608.40

- name: Carer with a supplied payment that State Pension reduced keeps 52 weeks of supplement with the amount before the reduction
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    country: SCOTLAND
    # A carer entitled all year, 52 x 86.45 = 4,495.40, whose State Pension
    # of 2,000 a year leaves 2,495.40, with both amounts supplied.
    carer_support_payment_pre_overlap: 4495.40
    carer_support_payment: 2495.40
  output:
    # Reg 16(2)(a) leaves a payment in every award week: 52 x 11.70 = 608.40.
    scottish_carer_supplement: 608.40

- name: Carer in England with 13 weeks of Carer Support Payment gets 13 weeks of supplement in 2027
  period: 2027
  absolute_error_margin: 0.01
  input:
    age: 35
    country: ENGLAND
    # 13 x 89.50 = 1,163.50, at the 2027 rate above.
    carer_support_payment: 1163.50
  output:
    # 1,163.50 / 89.50 = 13 award weeks; 13 x 12.10 = 157.30.
    scottish_carer_supplement: 157.30
