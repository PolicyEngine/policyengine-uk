# Social Security (Scotland) Act 2018 s.86B requires Scottish Ministers to
# bring forward legislation raising the Scottish Carer Supplement and the
# Carer Support Payment component to at least their s.86A inflation-adjusted
# levels. Their measure is the 12 months to September CPI, rounded to the
# nearest 5p (Social Security Assistance in Scotland: up-rating for inflation
# in 2026-27, sections 2 and 3). From April 2027 the model raises both each
# April by the previous September's CPI (gov.benefit_uprating_cpi) and rounds
# to the nearest 5p: 3.5% for April 2027 (ONS, 21 October 2026) and the OBR
# October 2026 EFO forecast of 3.4% for April 2028.

- name: Scottish Carer Supplement is 11.70 a week in 2026
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
  output:
    # SSI 2026/170 reg. 12(3)(b): 11.70 x 52.
    scottish_carer_supplement: 608.40
    carer_support_payment: 86.45 * 52

- name: Scottish Carer Supplement rises by September CPI in 2027
  period: 2027
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
  output:
    # 11.70 x 1.035 = 12.1095, to the nearest 5p 12.10; x 52 = 629.20.
    scottish_carer_supplement: 12.10 * 52
    # 86.45 x 1.035 = 89.47575, to the nearest 5p 89.50.
    carer_support_payment: 89.50 * 52

- name: Scottish Carer Supplement keeps rising in 2028
  period: 2028
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
  output:
    # 12.10 x 1.034 = 12.5114, to the nearest 5p 12.50; x 52 = 650.00.
    scottish_carer_supplement: 12.50 * 52
    # 89.50 x 1.034 = 92.543, to the nearest 5p 92.55.
    carer_support_payment: 92.55 * 52

- name: Carer in England gets no Scottish Carer Supplement in 2027
  period: 2027
  absolute_error_margin: 0
  input:
    age: 35
    care_hours: 40
    country: ENGLAND
  output:
    scottish_carer_supplement: 0
    carer_support_payment: 0
