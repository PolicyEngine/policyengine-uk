# Social Security (Scotland) Act 2018 s.86B requires Scottish Ministers to
# bring forward legislation raising the Scottish Carer Supplement and the
# Carer Support Payment component to at least their s.86A inflation-adjusted
# levels; their measure is the 12 months to September CPI (Social Security
# Assistance in Scotland: up-rating for inflation in 2026-27, section 3).
# From 2027 the model uprates both with gov.benefit_uprating_cpi, its proxy
# for that measure, which is 184.3803432 in 2026, 188.6206824 in 2027 and
# 192.3927984 in 2028 under the OBR March 2026 EFO. The model does not round
# to the nearest 5p as Ministers do.

- name: Scottish Carer Supplement is 11.70 a week in 2026
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
  output:
    # SSI 2026/170 reg. 12(3)(b): 11.70 x 52.
    scottish_carer_supplement: 608.40
    carer_support_payment: 86.45 * 52

- name: Scottish Carer Supplement rises with gov.benefit_uprating_cpi in 2027
  period: 2027
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
  output:
    # 11.70 x 188.6206824 / 184.3803432 x 52 = 622.39, up from 608.40.
    scottish_carer_supplement: 11.70 * 188.6206824 / 184.3803432 * 52
    # The Carer Support Payment component rises by the same factor.
    carer_support_payment: 86.45 * 188.6206824 / 184.3803432 * 52

- name: Scottish Carer Supplement keeps rising in 2028
  period: 2028
  absolute_error_margin: 0.01
  input:
    age: 35
    care_hours: 40
    country: SCOTLAND
  output:
    # 11.70 x 192.3927984 / 184.3803432 x 52 = 634.84.
    scottish_carer_supplement: 11.70 * 192.3927984 / 184.3803432 * 52

- name: Carer in England gets no Scottish Carer Supplement in 2027
  period: 2027
  absolute_error_margin: 0
  input:
    age: 35
    care_hours: 40
    country: ENGLAND
  output:
    scottish_carer_supplement: 0
    carer_support_payment: 0
