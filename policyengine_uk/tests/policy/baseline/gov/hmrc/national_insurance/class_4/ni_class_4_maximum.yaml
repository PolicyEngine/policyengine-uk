- name: NI Class 4 with employment and self-employment income - over UPL has maximum capped.
  # SI 2001/1004 reg 100(3) as at 6 April 2023, with the 2023-24 SSCBA 1992
  # amounts: lower profits limit £12,570, upper £50,270, main 9%,
  # additional 2% (s.15(3), (3ZA)) and Class 2 of £3.45 a week (s.11(2)).
  # Step 1: 50,270 - 12,570 = 37,700. Step 2: 37,700 x 9% = 3,393.
  # Step 3: 3,393 + 53 x 3.45 = 3,575.85.
  # Step 4: less Class 2 of 52 x 3.45 = 179.40 and primary Class 1 at the
  # main percentage on £100,000 of pay. With pay spread over the year that is
  # at least 10% (the lowest main primary percentage in 2023-24; a director's
  # annual rate was 11.5%) of the £37,700 between the primary threshold and
  # the upper earnings limit, £3,770, so Step 4 is negative: Case 3, treated
  # as nil. The model charges 12%, £4,524.
  # Step 5: 0. Step 6: min(50,270, 100,000) - 12,570 = 37,700.
  # Step 7: 37,700 - 0 = 37,700. Step 8: 37,700 x 2% = 754.
  # Step 9: (100,000 - 50,270) x 2% = 994.60.
  # Maximum (Steps 4 + 8 + 9): 0 + 754 + 994.60 = 1,748.60.
  period: 2023
  absolute_error_margin: 0.01
  input:
    self_employment_income: 100_000
    employment_income: 100_000
  output:
    ni_class_4_maximum: 1_748.60
    ni_class_4: 1_748.60

- name: NI Class 4 maximum in 2022-23 uses the 2.73% additional rate.
  # Reg 100 as modified for 2022-23 by the Health and Social Care Levy
  # (Repeal) Act 2022 Sch para 6(2): 9.73% in Step 2, 100/9.73 in Step 5,
  # 2.73% in Steps 8 and 9. Limits £11,908 and £50,270.
  # Step 3: 38,362 x 9.73% + 53 x 3.15 = 3,899.57. Step 4 less Class 2 of
  # 52 x 3.15 = 163.80 and primary Class 1 on £100,000 of pay, at least
  # 12% of the £37,700 between £12,570 and £50,270 (£4,524), is negative:
  # Case 3, nil.
  # Step 7 = Step 6 = 50,270 - 11,908 = 38,362. Step 8: 38,362 x 2.73%
  # = 1,047.28. Step 9: 49,730 x 2.73% = 1,357.63.
  # Maximum: 0 + 1,047.28 + 1,357.63 = 2,404.91.
  period: 2022
  absolute_error_margin: 0.01
  input:
    self_employment_income: 100_000
    employment_income: 100_000
  output:
    ni_class_4_maximum: 2_404.91
    ni_class_4: 2_404.91
