- name: NI Class 4 - over UPL has maximum capped.
  # 2023-24: 9% of profits between £12,570 and £50,270 (SSCBA 1992
  # s.15(3)(a) and (3ZA)(a) as at 6 April 2023). (50,270 - 12,570) x 9%
  # = 3,393.
  period: 2023
  absolute_error_margin: 0.01
  input:
    self_employment_income: 100_000
  output:
    ni_class_4_main: 3_393

- name: NI Class 4 - 2022-23 main band at 9.73%.
  # Health and Social Care Levy (Repeal) Act 2022 s.2(2)(a); NICs (Increase
  # of Thresholds) Act 2022 s.2(1). (50,270 - 11,908) x 9.73% = 3,732.62.
  period: 2022
  absolute_error_margin: 0.01
  input:
    self_employment_income: 100_000
  output:
    ni_class_4_main: 3_732.62
