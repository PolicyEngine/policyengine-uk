# Salary sacrifice counts only for people with pay
# (employment_income_before_lsr > 0). This runner does not copy an
# employment_income input there (policyengine_uk.Simulation does), so each
# case sets both.
- name: No employer NI charge when salary sacrifice below £2,000 cap
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 40_000
    employment_income_before_lsr: 40_000
    pension_contributions_via_salary_sacrifice: 1_500
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    salary_sacrifice_pension_ni_employer: 0

- name: Employer NI charge at 15% for moderate earner above cap
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 45_000
    employment_income_before_lsr: 45_000
    pension_contributions_via_salary_sacrifice: 2_250
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    # £250 excess * 15% = £37.50
    salary_sacrifice_pension_ni_employer: (2_250 - 2_000) * 0.15

- name: Employer NI charge at 15% for high earner with large excess
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 125_000
    employment_income_before_lsr: 125_000
    pension_contributions_via_salary_sacrifice: 25_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    # £23,000 excess * 15% = £3,450
    salary_sacrifice_pension_ni_employer: (25_000 - 2_000) * 0.15

- name: Employer NI charge for large salary sacrifice
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 80_000
    employment_income_before_lsr: 80_000
    pension_contributions_via_salary_sacrifice: 15_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    # £13,000 excess * 15% = £1,950
    salary_sacrifice_pension_ni_employer: (15_000 - 2_000) * 0.15

- name: No employer NI charge when exactly at cap
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 60_000
    employment_income_before_lsr: 60_000
    pension_contributions_via_salary_sacrifice: 2_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    salary_sacrifice_pension_ni_employer: 0

- name: Employer NI charge for small excess over cap
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 35_000
    employment_income_before_lsr: 35_000
    pension_contributions_via_salary_sacrifice: 2_100
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    # £100 excess * 15% = £15
    salary_sacrifice_pension_ni_employer: 100 * 0.15

- name: Employer NI charge for low earner with high pension contribution
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 30_000
    employment_income_before_lsr: 30_000
    pension_contributions_via_salary_sacrifice: 5_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    # £3,000 excess * 15% = £450
    salary_sacrifice_pension_ni_employer: (5_000 - 2_000) * 0.15

- name: Employer NI on full NIC-only excess
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 45_000
    employment_income_before_lsr: 45_000
    pension_contributions_via_salary_sacrifice: 3_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    # £1,000 excess * 15% = £150
    salary_sacrifice_pension_ni_employer: (3_000 - 2_000) * 0.15
    # Full excess enters NIC-only earnings (no targeted haircut)
    salary_sacrifice_pension_ni_excess: 1_000
    salary_sacrifice_returned_to_income: 0

# The cases below set only the pay (employment_income_before_lsr), so
# ni_class_1_income is pay plus NIC-only excess. The charge is the
# employer Class 1 liability on those earnings less the liability without the
# NIC-only excess. 2025 secondary threshold: 96.153846 x 52 = 5,000.
- name: Amount returned stays below the secondary threshold
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income_before_lsr: 1_500
    pension_contributions_via_salary_sacrifice: 5_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    employment_income: 1_500
    ni_class_1_income: 4_500
    # Earnings of 4,500 are below the threshold, so no contributions are due.
    # (The rate on the whole amount would give 3,000 x 15% = 450.)
    ni_class_1_employer: 0
    salary_sacrifice_pension_ni_employer: 0

- name: Amount returned straddles the secondary threshold
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income_before_lsr: 3_000
    pension_contributions_via_salary_sacrifice: 5_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    employment_income: 3_000
    ni_class_1_income: 6_000
    # Only the part above the threshold is charged: 1,000 x 15% = 150.
    ni_class_1_employer: (6_000 - 5_000) * 0.15
    salary_sacrifice_pension_ni_employer: (6_000 - 5_000) * 0.15

- name: Employer charge continues over State Pension age
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 70
    employment_income_before_lsr: 45_000
    pension_contributions_via_salary_sacrifice: 5_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    # Secondary contributions have no upper age limit (SSCBA 1992 s.6(3)).
    salary_sacrifice_pension_ni_employer: 3_000 * 0.15

- name: No employer charge under 16
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 15
    employment_income_before_lsr: 20_000
    pension_contributions_via_salary_sacrifice: 5_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    salary_sacrifice_pension_ni_excess: 3_000
    ni_class_1_employer: 0
    salary_sacrifice_pension_ni_employer: 0

- name: Employer pension contributions count when they are not exempt
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income_before_lsr: 1_500
    employer_pension_contributions: 2_000
    pension_contributions_via_salary_sacrifice: 5_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
    gov.contrib.policyengine.employer_ni.exempt_employer_pension_contributions: false
  output:
    employment_income: 1_500
    ni_class_1_income: 4_500
    # Charged earnings are 4,500 + 2,000 = 6,500 with the 3,000 excess and
    # 3,500 without: (6,500 - 5,000) x 15% = 225.
    ni_class_1_employer: (6_500 - 5_000) * 0.15
    salary_sacrifice_pension_ni_employer: (6_500 - 5_000) * 0.15

- name: Current law in 2029, with the cap and the broad-base haircut
  period: 2029
  absolute_error_margin: 0.01
  input:
    employment_income_before_lsr: 48_000
    pension_contributions_via_salary_sacrifice: 6_000
  output:
    salary_sacrifice_pension_ni_excess: 4_000
    employment_income: 47_923.20
    ni_class_1_income: 51_923.20
    # Earnings stay above the secondary threshold: 4,000 x 15% = 600.
    salary_sacrifice_pension_ni_employer: 4_000 * 0.15

# SSCBA 1992 s.9A and s.9B: the secondary percentage is 0% up to the upper
# secondary threshold for an earner under 21, and up to the apprentice upper
# secondary threshold for an apprentice under 25 (both £50,270 in 2029-30).
# The £3,000 of a £5,000 sacrifice above the cap enters NIC earnings only
# (total £33,000), all below them.
- name: No employer NI on the excess for an earner aged 20 below the upper secondary threshold
  period: 2029
  absolute_error_margin: 0.01
  input:
    age: 20
    employment_income_before_lsr: 30_000
    pension_contributions_via_salary_sacrifice: 5_000
    employer_pension_contributions: 2_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    salary_sacrifice_pension_ni_excess: 3_000
    salary_sacrifice_returned_to_income: 0
    employment_income: 30_000
    ni_class_1_income: 33_000
    salary_sacrifice_pension_ni_employer: 0
    ni_class_1_employer: 0
    # 30,000 pay + 2,000 employer pension contribution, no employer NI.
    adjusted_employer_cost: 32_000

- name: No employer NI on the excess for an apprentice aged 24 below the apprentice upper secondary threshold
  period: 2029
  absolute_error_margin: 0.01
  input:
    age: 24
    is_apprentice: true
    employment_income_before_lsr: 30_000
    pension_contributions_via_salary_sacrifice: 5_000
    employer_pension_contributions: 2_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    salary_sacrifice_pension_ni_employer: 0
    ni_class_1_employer: 0
    adjusted_employer_cost: 32_000

- name: Employer NI on the excess for an earner aged 21
  period: 2029
  absolute_error_margin: 0.01
  input:
    age: 21
    employment_income_before_lsr: 30_000
    pension_contributions_via_salary_sacrifice: 5_000
    employer_pension_contributions: 2_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    # The £3,000 excess sits above the secondary threshold.
    salary_sacrifice_pension_ni_employer: 3_000 * 0.15

- name: No employer NI on the excess for an earner aged 19 on £40,000
  period: 2029
  absolute_error_margin: 0.01
  input:
    age: 19
    employment_income_before_lsr: 40_000
    pension_contributions_via_salary_sacrifice: 6_000
    gov.hmrc.national_insurance.salary_sacrifice_pension_cap: 2_000
    gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate: 0
  output:
    # £4,000 excess; NIC earnings of £44,000 are below the UST (£50,270).
    salary_sacrifice_pension_ni_excess: 4_000
    ni_class_1_income: 44_000
    salary_sacrifice_pension_ni_employer: 0
    ni_class_1_employer: 0
