  input:
    age: 40
    employment_income: 60_000
  output:
    ni_class_1_employee_primary: (50_270 - 12_570) * 0.08  # 3,016
    ni_class_1_employee_additional: (60_000 - 50_270) * 0.02  # 194.60
    ni_class_1_employer: (60_000 - 5_000) * 0.15  # 8,250.00

- name: 2030-31 Class 4 at the lower profits limit
  period: 2030
  absolute_error_margin: 0.01
  input:
