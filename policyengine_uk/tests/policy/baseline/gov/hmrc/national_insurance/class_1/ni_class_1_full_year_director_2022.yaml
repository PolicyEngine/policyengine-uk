- name: Natural salary household pays director NI and unchanged income tax
  period: 2022
  absolute_error_margin: 0.01
  input:
    age: 40
    region: LONDON
    household_owns_tv: false
    employment_income: 30000
    is_full_year_category_a_director: true
    would_claim_uc: false
  output:
    ni_class_1_income: 30000
    ni_liable: true
    income_tax: 3486
    ni_class_1_employee: 2303.1116
    national_insurance: 2303.1116
    # Existing calendar-2022 support: council-tax rebate 150 + EBSS 199.
    ebr_council_tax_rebate: 150
    ebr_energy_bills_credit: 199
    household_benefits: 349
    tv_licence: 0

- name: Natural higher salary household reconciles both director bands and cash
  period: 2022
  absolute_error_margin: 0.01
