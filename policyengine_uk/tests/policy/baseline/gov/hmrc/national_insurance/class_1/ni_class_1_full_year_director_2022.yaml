# Literal annual employee-primary expectations from HMRC's 2022–23 director
# table: PT £11,908, UEL £50,270, category A rates 12.73% and 2.73%.
# Annual model amounts, not interim payroll deductions. All are adults below SPA.
- name: Full-year category A director below the annual primary threshold
  period: 2022
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 11000
    is_full_year_category_a_director: true
  output:
    ni_class_1_employee_primary: 0
    ni_class_1_employee_additional: 0
    ni_class_1_employee: 0

