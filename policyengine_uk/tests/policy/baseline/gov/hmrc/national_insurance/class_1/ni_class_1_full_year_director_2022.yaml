    national_insurance: 5149.1116
    # Existing calendar-2022 support: council-tax rebate 150 + EBSS 199.
    ebr_council_tax_rebate: 150
    ebr_energy_bills_credit: 199
    household_benefits: 349
    tv_licence: 0
