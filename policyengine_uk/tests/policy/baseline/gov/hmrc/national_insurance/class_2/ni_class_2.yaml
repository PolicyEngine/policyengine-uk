# Expected values come from s.11 SSCBA 1992 as in force for each tax year
# (legislation.gov.uk point-in-time text) and the SIs that set its figures.

# 2023-24: £3.45 a week (SI 2023/236 reg 3(a)) on profits that exceed the
# £12,570 lower profits threshold (reg 3(b)). Profits from the £6,725 small
# profits threshold up to it are treated as paid (s.11(5A)-(5B)).
- name: NI Class 2 - 2023-24, below the small profits threshold.
  period: 2023
  input:
    self_employment_income: 5_000
  output:
    ni_class_2: 0

- name: NI Class 2 - 2023-24, at the small profits threshold, treated as paid.
  period: 2023
  input:
    self_employment_income: 6_725
  output:
    ni_class_2: 0

- name: NI Class 2 - 2023-24, between the thresholds, treated as paid.
  period: 2023
  input:
    self_employment_income: 10_000
  output:
    ni_class_2: 0

- name: NI Class 2 - 2023-24, at the lower profits threshold, not liable.
  period: 2023
  input:
    self_employment_income: 12_570
  output:
    ni_class_2: 0

- name: NI Class 2 - 2023-24, just above the lower profits threshold.
  period: 2023
  input:
    self_employment_income: 12_571
  output:
    ni_class_2: 3.45 * 52

- name: NI Class 2 - 2023-24, above the lower profits threshold.
  period: 2023
  input:
    self_employment_income: 15_000
  output:
    ni_class_2: 3.45 * 52

- name: NI Class 2 - 2023-24, above the upper profits limit.
  period: 2023
  input:
    self_employment_income: 60_000
  output:
    ni_class_2: 179.4

- name: NI Class 2 - 2023-24, over State Pension age.
  period: 2023
  input:
    age: 70
    self_employment_income: 60_000
  output:
    ni_class_2: 0

# 2022-23: £3.15 a week (SI 2022/232 reg 3(a)) on profits that exceed the
# £11,908 lower profits threshold, with effect from 6 April 2022
# (SI 2022/1329 regs 1 and 2).
- name: NI Class 2 - 2022-23, between the thresholds, treated as paid.
  period: 2022
  input:
    self_employment_income: 8_000
  output:
    ni_class_2: 0

- name: NI Class 2 - 2022-23, at the lower profits threshold, not liable.
  period: 2022
  input:
    self_employment_income: 11_908
  output:
    ni_class_2: 0

- name: NI Class 2 - 2022-23, above the lower profits threshold.
  period: 2022
  input:
    self_employment_income: 11_909
  output:
    ni_class_2: 3.15 * 52

# 2021-22: £3.05 a week (unchanged from SI 2020/299) on profits of, or
# exceeding, the £6,515 small profits threshold (SI 2021/157 reg 3).
- name: NI Class 2 - 2021-22, just below the small profits threshold.
  period: 2021
  input:
    self_employment_income: 6_514
  output:
    ni_class_2: 0

- name: NI Class 2 - 2021-22, at the small profits threshold.
  period: 2021
  input:
    self_employment_income: 6_515
  output:
    ni_class_2: 3.05 * 52

# 2020-21: £3.05 a week from £6,475 (SI 2020/299 reg 3).
- name: NI Class 2 - 2020-21, at the small profits threshold.
  period: 2020
  input:
    self_employment_income: 6_475
  output:
    ni_class_2: 3.05 * 52

# 2015-16: £2.80 a week from £5,965 (NICA 2015 Sch 1 para 3).
- name: NI Class 2 - 2015-16, just below the small profits threshold.
  period: 2015
  input:
    self_employment_income: 5_964
  output:
    ni_class_2: 0

- name: NI Class 2 - 2015-16, at the small profits threshold.
  period: 2015
  input:
    self_employment_income: 5_965
  output:
    ni_class_2: 2.8 * 52

# 2024-25: s.11(2) omitted from 6 April 2024 (NICA (Reduction in Rates) Act
# 2023 s.3); no compulsory Class 2.
- name: NI Class 2 - 2024-25, abolished.
  period: 2024
  input:
    self_employment_income: 60_000
  output:
    ni_class_2: 0
