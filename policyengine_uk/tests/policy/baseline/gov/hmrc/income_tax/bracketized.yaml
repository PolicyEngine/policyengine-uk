- name: Earned income is split correctly
  period: 2020
  absolute_error_margin: 0
  input:
    earned_taxable_income: 100000
  output:
    basic_rate_earned_income: 37500
    higher_rate_earned_income: 62500
    add_rate_earned_income: 0

# ITA 2007 ss.12,12A,12B and16: savings nil rate is a positioned
# slice above the starting-rate limit, not an addition to a zero-rate prefix.
# The custom limits and phase-out are reform controls, not enacted amounts.

- name: nil rate starts at reformed limit 37500
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.rates.savings_starter_rate.allowance: 37_500
    age: 40
    region: LONDON
    employment_income: 12_570
    savings_interest_income: 38_000
  output:
    savings_income_tax: 0
    savings_starter_rate_income: 37_500
    savings_allowance: 500
    basic_rate_savings_income: 0
    higher_rate_savings_income: 0
    add_rate_savings_income: 0

- name: nil rate above basic limit leaves higher rate gap
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.rates.savings_starter_rate.allowance: 40_000
    age: 40
    region: LONDON
    employment_income: 12_570
    savings_interest_income: 38_000
  output:
    savings_income_tax: 120
    savings_starter_rate_income: 37_700
    savings_allowance: 500
    basic_rate_savings_income: 0
    higher_rate_savings_income: 300
    add_rate_savings_income: 0

