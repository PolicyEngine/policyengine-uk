- name: Gift Aid keeps income at the extended basic-rate limit basic
  # Gift Aid 1,600 grosses to 2,000; 39,700 taxable income is all at 20%.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 52_270
    gift_aid: 1_600
    region: LONDON
  output:
    gift_aid_grossed_up: 2_000
    tax_band: BASIC
    income_tax: 7_940
    meets_marriage_allowance_income_conditions: true

- name: Income above the Gift Aid extended basic-rate limit is higher
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 52_271
    gift_aid: 1_600
    region: LONDON
  output:
    gift_aid_grossed_up: 2_000
    tax_band: HIGHER
    income_tax: 7_940.40
    meets_marriage_allowance_income_conditions: false

- name: Gift Aid keeps income at the extended higher-rate limit higher
  # 39,700 * 20% + (127,140 - 39,700) * 40% = 42,916.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 127_140
    gift_aid: 1_600
    region: LONDON
  output:
    gift_aid_grossed_up: 2_000
    tax_band: HIGHER
    income_tax: 42_916
    meets_marriage_allowance_income_conditions: false

- name: Income above the Gift Aid extended higher-rate limit is additional
  period: 2025
