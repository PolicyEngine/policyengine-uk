    region: LONDON
  output:
    gift_aid_grossed_up: 2_000
    tax_band: ADDITIONAL
    income_tax: 42_916.45
    meets_marriage_allowance_income_conditions: false

- name: Mixed households retain the separate Scottish tax-band route
  # Preservation control for the unchanged Scottish branch, away from its
  # thresholds; this does not audit the separate Scottish band/date issues.
  period: 2025
  input:
    people:
      english:
        age: 40
        employment_income: 50_270
      welsh:
        age: 40
        employment_income: 50_270
      scottish:
        age: 40
        employment_income: 50_270
    benunits:
      english:
        members: [english]
      welsh:
        members: [welsh]
      scottish:
        members: [scottish]
    households:
      english:
        members: [english]
        region: LONDON
        country: ENGLAND
      welsh:
        members: [welsh]
        region: WALES
        country: WALES
      scottish:
        members: [scottish]
        region: SCOTLAND
        country: SCOTLAND
  output:
    tax_band: [BASIC, BASIC, HIGHER]
    meets_marriage_allowance_income_conditions: [true, true, false]
