# ITA 2007 s.10(2), (3), (3A): income at an upper limit remains in the
# lower band. Section 414(2)(b) extends both limits by grossed-up Gift Aid.
# HMRC's employer tables supply the allowances, limits and rates:
# https://www.gov.uk/guidance/rates-and-thresholds-for-employers-2018-to-2019
# https://www.gov.uk/guidance/rates-and-thresholds-for-employers-2025-to-2026
# These ordinary employment-only cases test the band and the existing Marriage
# Allowance rate-condition classifier, not every donor/election condition.
# Annual formula dispatch is at 1 January: 2018 and 2025 use formula_2018.
# The formula_2017 route uses the existing above-limit helper.

- name: Rest-of-UK income at the personal allowance is untaxed in 2018
  period: 2018
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 11_850
    region: LONDON
  output:
    tax_band: NONE
    income_tax: 0
    meets_marriage_allowance_income_conditions: true

- name: Rest-of-UK income at the basic-rate limit remains basic in 2018
  period: 2018
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 46_350
    region: LONDON
  output:
    tax_band: BASIC
    income_tax: 6_900
    meets_marriage_allowance_income_conditions: true

- name: Rest-of-UK income above the basic-rate limit is higher in 2018
  period: 2018
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 46_351
    region: LONDON
  output:
    tax_band: HIGHER
    income_tax: 6_900.40
    meets_marriage_allowance_income_conditions: false

