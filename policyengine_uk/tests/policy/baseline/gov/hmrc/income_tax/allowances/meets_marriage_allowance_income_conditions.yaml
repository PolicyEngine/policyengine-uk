# ITA 2007 s. 55B(2)(b), (ba) and s. 55C(1)(c), (ca): only the basic rates,
# the Scottish starter and intermediate rates, the dividend ordinary rate and
# the nil and starting rates for savings. 2026-27: personal allowance 12,570,
# basic rate limit 37,700, Scottish higher rate from 31,092 of taxable income.

- name: Basic-rate earner meets the conditions
  period: 2026
  input:
    employment_income: 30_000
  output:
    meets_marriage_allowance_income_conditions: true

- name: No income meets the conditions
  period: 2026
  input:
    employment_income: 0
  output:
    meets_marriage_allowance_income_conditions: true

- name: Taxable income exactly at the basic rate limit meets the conditions
  period: 2026
  input:
    # 50,270 - 12,570 = 37,700, all at the basic rate.
    employment_income: 50_270
  output:
    meets_marriage_allowance_income_conditions: true

- name: One pound into the higher rate fails the conditions
  period: 2026
  input:
    employment_income: 50_271
  output:
    meets_marriage_allowance_income_conditions: false

- name: Additional-rate earner fails the conditions
  period: 2026
  input:
    employment_income: 150_000
  output:
    meets_marriage_allowance_income_conditions: false

- name: Transferor test uses the cut allowance (s. 55C(1)(c))
  period: 2026
  input:
    # Allowance 12,570 - 1,260 = 11,310, so 50,000 leaves 38,690 taxable,
    # 990 above the basic rate limit.
    employment_income: 50_000
    marriage_allowance_relinquished: 1_260
  output:
    personal_allowance: 11_310
    meets_marriage_allowance_income_conditions: false

- name: The same income meets the conditions with the full allowance
  period: 2026
  input:
    # 50,000 - 12,570 = 37,430, within the basic rate band.
    employment_income: 50_000
  output:
    meets_marriage_allowance_income_conditions: true

- name: Scottish intermediate-rate earner meets the conditions
  period: 2026
  input:
    # 40,000 - 12,570 = 27,430, below the Scottish higher rate at 31,092.
    employment_income: 40_000
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: Scottish starter-rate earner meets the conditions
  period: 2026
  input:
    employment_income: 14_000
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: Scottish higher-rate earner fails the conditions
  period: 2026
  input:
    # 44,000 - 12,570 = 31,430, above 31,092.
    employment_income: 44_000
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: false

- name: Scottish savings are banded on UK rates, so an intermediate-rate earner with savings meets the conditions
  period: 2026
  input:
    # Non-savings 27,430 is below the Scottish higher rate; savings stack on
    # it to 32,430, below the UK basic rate limit of 37,700.
    employment_income: 40_000
    savings_interest_income: 5_000
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: Savings within the savings nil rate above the basic rate limit meet the conditions
  period: 2026
  input:
    # Non-savings 50,070 - 12,570 = 37,500. The 500 of interest is covered by
    # the savings nil rate (s. 12A), which s. 55B(2)(b) allows, so none of it
    # is charged at the savings higher rate.
    employment_income: 50_070
    savings_interest_income: 500
  output:
    meets_marriage_allowance_income_conditions: true

- name: Dividends within the dividend nil rate above the basic rate limit fail the conditions
  period: 2026
  input:
    # The same 500 as dividends: s. 55B(2)(ba) ignores the dividend nil rate
    # (s. 13A), and 37,500 + 500 = 38,000 would put 300 at the dividend upper
    # rate.
    employment_income: 50_070
    dividend_income: 500
  output:
    meets_marriage_allowance_income_conditions: false

- name: Savings charged at the savings higher rate fail the conditions
  period: 2026
  input:
    # Taxable income 37,500 + 2,000 = 39,500. A higher-rate taxpayer's
    # savings nil rate covers 500, leaving savings at the higher rate.
    employment_income: 50_070
    savings_interest_income: 2_000
  output:
    meets_marriage_allowance_income_conditions: false

- name: The dividend test uses the basic rate limit (2025-26, 37,700)
  period: 2025
  input:
    # Taxable income 49,970 - 12,570 = 37,400, plus 250 of dividends within
    # the dividend allowance: 37,650 is inside the basic rate limit, so no
    # dividends would be at the dividend upper rate even without s. 13A.
    employment_income: 49_970
    dividend_income: 250
  output:
    meets_marriage_allowance_income_conditions: true

- name: Dividends above property income cross the basic rate limit and fail the conditions
  period: 2026
  input:
    # Property 47,000 less the 1,000 property allowance and the allowance of
    # 12,570 leaves 33,430 of non-savings income. Dividends sit on top
    # (s. 16), from 33,430 to 38,430, so 730 would be at the dividend upper
    # rate (s. 55B(2)(ba)).
    property_income: 47_000
    dividend_income: 5_000
  output:
    meets_marriage_allowance_income_conditions: false

- name: Dividends that reach the basic rate limit exactly meet the conditions (s. 55B(2)(ba))
  period: 2026
  input:
    # 50,070 - 12,570 = 37,500 of earnings, then 200 of dividends to 37,700:
    # even without the dividend nil rate (s. 13A) none would be at the
    # dividend upper rate. Companion case B of TheAxiomFoundation/rulespec-uk#437.
    employment_income: 50_070
    dividend_income: 200
  output:
    meets_marriage_allowance_income_conditions: true

- name: One pound of dividends above the basic rate limit fails the conditions (s. 55B(2)(ba))
  period: 2026
  input:
    # 37,500 + 201 = 37,701: without s. 13A, 1 would be at the dividend upper
    # rate. Companion case C of TheAxiomFoundation/rulespec-uk#437.
    employment_income: 50_070
    dividend_income: 201
  output:
    meets_marriage_allowance_income_conditions: false

- name: Pension relief comes off income once, so income at the basic rate limit after it meets the conditions (s. 55B(2)(b))
  period: 2026
  input:
    # Net pay arrangement: 55,270 of earnings less 5,000 of relieved
    # contributions (FA 2004 s. 188) and the 12,570 allowance leaves 37,700,
    # all at the basic rate.
    employment_income: 55_270
    employee_pension_contributions: 5_000
  output:
    meets_marriage_allowance_income_conditions: true

- name: One pound above the basic rate limit after pension relief fails the conditions (s. 55B(2)(b))
  period: 2026
  input:
    # 55,271 - 5,000 - 12,570 = 37,701, so 1 is at the higher rate. Adjusted
    # net income (50,271) already has the relief deducted (ITA 2007 s. 58),
    # so taking the allowances, which include the relief, off it would
    # deduct the relief twice.
    employment_income: 55_271
    employee_pension_contributions: 5_000
  output:
    meets_marriage_allowance_income_conditions: false

- name: Gift Aid extends the basic rate limit, so income up to the extended limit meets the conditions (ITA 2007 s. 414(2)(b))
  period: 2026
  input:
    # A 1,600 gift grosses up to 2,000 (s. 415), extending the basic rate
    # limit to 39,700. 52,270 - 12,570 = 39,700, all at the basic rate.
    employment_income: 52_270
    gift_aid: 1_600
  output:
    meets_marriage_allowance_income_conditions: true

- name: One pound above the Gift Aid-extended basic rate limit fails the conditions (ITA 2007 s. 414(2)(b))
  period: 2026
  input:
    # 52,271 - 12,570 = 39,701, 1 above the extended limit of 39,700.
    employment_income: 52_271
    gift_aid: 1_600
  output:
    meets_marriage_allowance_income_conditions: false

- name: Gift Aid extends the basic rate limit for the dividend test too (s. 55B(2)(ba), ITA 2007 s. 414(2)(b))
  period: 2026
  input:
    # Earnings of 12,570 use the whole allowance, so 40,000 of dividends run
    # from 0 to 40,000 of taxable income. A 3,200 gift grosses up to 4,000,
    # extending the basic rate limit to 41,700, so even without the dividend
    # nil rate (s. 13A) none would be at the dividend upper rate. Taking the
    # gross gift off adjusted net income instead leaves nothing below the
    # dividends to absorb it.
    employment_income: 12_570
    dividend_income: 40_000
    gift_aid: 3_200
  output:
    meets_marriage_allowance_income_conditions: true
