# ITA 2007 s. 55B(2)(b) and (ba): the person receiving the allowance may be
# liable only at the basic rates, the Scottish starter and intermediate rates
# (from 2018-19, SI 2018/459 art. 6(2)), the dividend ordinary rate and the
# nil and starting rates for savings, and dividends count as if the dividend
# nil rate (s. 13A) did not exist. From 2021-22 to 2026-27 the personal
# allowance is £12,570 and the basic rate limit £37,700, and the Scottish
# higher rate starts at £31,092 of taxable income (S6M-16531 for 2025-26,
# S6M-20844 for 2026-27). In 2026-27 the dividend allowance is £500 and the
# Personal Savings Allowance £1,000, or £500 with income above the basic rate
# limit (s. 12B).

- name: Basic-rate earner meets the Marriage Allowance income conditions
  period: 2021
  input:
    # 30,000 - 12,570 = 17,430, all at the basic rate.
    employment_income: 30_000
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: true

- name: Higher-rate earner fails the Marriage Allowance income conditions
  period: 2021
  input:
    # 60,000 - 12,570 = 47,430, so 9,730 is at the higher rate.
    employment_income: 60_000
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: false

- name: Additional-rate earner fails the Marriage Allowance income conditions
  period: 2021
  input:
    # No personal allowance above 125,140 of income; 10,000 is above the
    # 150,000 higher rate limit.
    employment_income: 160_000
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: false

- name: Earner below the personal allowance meets the conditions (regression for #395)
  period: 2021
  input:
    employment_income: 10_000
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: true

- name: Scottish starter-rate earner meets the Marriage Allowance income conditions
  period: 2021
  input:
    # 430 of taxable income, all at the Scottish starter rate.
    employment_income: 13_000
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: Scottish intermediate-rate earner meets the Marriage Allowance income conditions
  period: 2021
  input:
    # 27,430 of taxable income, below the Scottish higher rate at 31,092.
    employment_income: 40_000
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: Under a raised Scottish higher rate, nil-rate savings meet the conditions
  period: 2025
  input:
    # The Scottish higher rate moves to 37,702 of taxable income. Pay leaves
    # 50,270 - 12,570 = 37,700, all below it. The 1 of interest takes taxable
    # income to 37,701, above the basic rate limit, so the Personal Savings
    # Allowance is 500 (s. 12B) and charges it at the savings nil rate
    # (s. 12A), which s. 55B(2)(b) allows. The model bands the person HIGHER
    # on that pound alone.
    gov.hmrc.income_tax.rates.scotland.rates[3].threshold: 37_702
    employment_income: 50_270
    savings_interest_income: 1
    region: SCOTLAND
  output:
    tax_band: HIGHER
    savings_income_tax: 0
    meets_marriage_allowance_income_conditions: true

- name: Savings covered by the savings nil rate above the basic rate limit meet the conditions
  period: 2026
  input:
    # 50,070 - 12,570 = 37,500 of pay, then 500 of interest to 38,000. Income
    # above the basic rate limit sets the Personal Savings Allowance at 500
    # (s. 12B), which covers all 500 at the savings nil rate (s. 12A).
    employment_income: 50_070
    savings_interest_income: 500
    region: NORTH_EAST
  output:
    tax_band: HIGHER
    savings_income_tax: 0
    meets_marriage_allowance_income_conditions: true

- name: One pound of savings at the savings higher rate fails the conditions
  period: 2026
  input:
    # As above with 501 of interest: 1 is at the savings higher rate, 40p.
    employment_income: 50_070
    savings_interest_income: 501
    region: NORTH_EAST
  absolute_error_margin: 0.01
  output:
    savings_income_tax: 0.4
    meets_marriage_allowance_income_conditions: false

- name: Under a raised starting rate limit, savings at the starting rate meet the conditions
  period: 2026
  input:
    # A reform raises the starting rate limit for savings to 40,000. Pay
    # takes the personal allowance, so the model taxes all 38,000 of
    # interest. It charges the 37,700 within the basic rate band at the
    # starting rate for savings (s. 12), and the 500 savings allowance for
    # income above the basic rate limit (s. 12B(3)) covers the other 300 at
    # the savings nil rate (s. 12A). Section 55B(2)(b) allows both rates.
    gov.hmrc.income_tax.rates.savings_starter_rate.allowance: 40_000
    employment_income: 12_570
    savings_interest_income: 38_000
    region: NORTH_EAST
  output:
    savings_income_tax: 0
    meets_marriage_allowance_income_conditions: true

- name: Taxable income at the basic rate limit meets the conditions
  period: 2026
  input:
    # 50,270 - 12,570 = 37,700: s. 10(2) charges income up to the basic rate
    # limit at the basic rate.
    employment_income: 50_270
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: true

- name: One pound above the basic rate limit fails the conditions
  period: 2026
  input:
    # 37,701 of taxable income: 1 at the higher rate (s. 10(3)).
    employment_income: 50_271
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: false

- name: Scottish taxable income at the start of the higher rate meets the conditions
  period: 2026
  input:
    # 43,662 - 12,570 = 31,092: S6M-20844 charges the intermediate rate on
    # income up to 31,092 and the higher rate only above it.
    employment_income: 43_662
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: One pound into the Scottish higher rate fails the conditions
  period: 2026
  input:
    employment_income: 43_663
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: false

- name: Dividends covered by the dividend allowance above the basic rate limit fail the conditions
  period: 2026
  input:
    # 37,500 of pay, then 500 of dividends, all within the 500 dividend
    # allowance (s. 13A). Without s. 13A, 300 of them would be at the dividend
    # upper rate (37,500 + 500 = 38,000), so s. 55B(2)(ba) fails, though the
    # person pays no dividend tax.
    employment_income: 50_070
    dividend_income: 500
    region: NORTH_EAST
  output:
    dividend_income_tax: 0
    meets_marriage_allowance_income_conditions: false

- name: Dividends that reach the basic rate limit exactly meet the conditions
  period: 2026
  input:
    # 37,500 + 200 = 37,700: none would be at the dividend upper rate.
    employment_income: 50_070
    dividend_income: 200
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: true

- name: Gift Aid raises the basic rate limit for the conditions
  period: 2026
  input:
    # A 1,600 gift grosses up to 2,000 (s. 415), which raises the basic rate
    # limit to 39,700 (s. 414(2)(b)). 52,270 - 12,570 = 39,700.
    employment_income: 52_270
    gift_aid: 1_600
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: true

- name: One pound above the Gift Aid limit fails the conditions
  period: 2026
  input:
    employment_income: 52_271
    gift_aid: 1_600
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: false

- name: Gift Aid raises the start of the Scottish higher rate for the conditions
  period: 2026
  input:
    # The 2,000 grossed-up gift moves the Scottish higher rate to 33,092
    # (s. 414(2)(b)). 45,662 - 12,570 = 33,092.
    employment_income: 45_662
    gift_aid: 1_600
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: One pound above the Scottish Gift Aid limit fails the conditions
  period: 2026
  input:
    employment_income: 45_663
    gift_aid: 1_600
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: false

- name: In 2015-16 a Scottish taxpayer's limit is the basic rate limit
  period: 2015
  input:
    # Section 11A takes effect in 2016-17 (SI 2015/2000 art. 3), and the
    # 2015-16 s. 55B(2)(b) allows the basic rate. 42,200 - 10,600 = 31,600,
    # below the basic rate limit, though above the 31,500 the model reads
    # from its 2017-18 Scottish scale.
    employment_income: 42_200
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: In 2016-17 a Scottish taxpayer's limit is the basic rate limit
  period: 2016
  input:
    # The Treasury added the Scottish basic rate to s. 55B(2)(b) (SI
    # 2015/1810 art. 14(3)), and the 2016-17 s. 11A(1) charges it on
    # non-savings income that would otherwise bear the basic rate.
    # 42,700 - 11,000 = 31,700, below the basic rate limit.
    employment_income: 42_700
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: In 2017-18 the Scottish higher rate fails the conditions
  period: 2017
  input:
    # The 2017-18 s. 55B(2)(b) allows the Scottish basic rate only. With an
    # 11,500 allowance, the Scottish higher rate starts at 31,500 of taxable
    # income: 43,001 - 11,500 = 31,501.
    employment_income: 43_001
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: false

- name: In 2017-18 Scottish income up to the higher rate meets the conditions
  period: 2017
  input:
    # 43,000 - 11,500 = 31,500, all at the Scottish basic rate.
    employment_income: 43_000
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: In 2017-18 the same income outside Scotland meets the conditions
  period: 2017
  input:
    # 31,501 of taxable income, below the 33,500 basic rate limit.
    employment_income: 43_001
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: true

- name: In 2018-19 the Scottish intermediate rate meets the conditions
  period: 2018
  input:
    # SI 2018/459 art. 6(2) adds the Scottish starter and intermediate rates
    # to s. 55B(2)(b). 40,000 - 11,850 = 28,150, at the intermediate rate.
    employment_income: 40_000
    region: SCOTLAND
  output:
    meets_marriage_allowance_income_conditions: true

- name: In 2015-16 dividends above the basic rate limit fail the conditions
  period: 2015
  input:
    # 42,600 - 10,600 = 32,000 of pay, at the model's basic rate limit, then
    # 1 of dividends. Section 13(2) charges the dividend upper rate on
    # dividends that would otherwise bear the higher rate, which starts at
    # the basic rate limit (s. 10(3)). The 2015-16 s. 55B(2)(b) permits the
    # dividend ordinary rate only. The model's dividend scale starts the
    # upper rate at 37,500 that year.
    employment_income: 42_600
    dividend_income: 1
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: false

- name: At the statutory 2015-16 basic rate limit a pound of dividends fails the conditions
  period: 2015
  input:
    # A reform sets the basic rate limit to the statutory 31,785 (s. 10(5)
    # for 2015-16). 42,385 - 10,600 = 31,785 of pay, then 1 of dividends,
    # which s. 13(2) charges at the dividend upper rate.
    gov.hmrc.income_tax.rates.uk[1].threshold: 31_785
    employment_income: 42_385
    dividend_income: 1
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: false

- name: In 2015-16 savings above the basic rate limit fail the conditions
  period: 2015
  input:
    # 32,000 of pay, then 1 of interest. FA 2016 s. 4(17) gives the savings
    # nil rate effect from 2016-17, so the 2015-16 s. 55B(2)(b) permits no
    # savings nil rate, and the pound bears the higher rate. The model
    # applies its Personal Savings Allowance in 2015-16 too.
    employment_income: 42_600
    savings_interest_income: 1
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: false

- name: At the statutory 2015-16 basic rate limit a pound of savings fails the conditions
  period: 2015
  input:
    # As above with 1 of interest, which bears the higher rate: 2015-16 has
    # no savings nil rate.
    gov.hmrc.income_tax.rates.uk[1].threshold: 31_785
    employment_income: 42_385
    savings_interest_income: 1
    region: NORTH_EAST
  output:
    meets_marriage_allowance_income_conditions: false
