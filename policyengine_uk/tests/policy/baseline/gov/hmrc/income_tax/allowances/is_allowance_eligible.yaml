- name: Personal Allowance
  period: 2024
  input:
    adjusted_net_income: 25000
  output:
    personal_allowance: 12570

- name: Blind Person's Allowance
  period: 2024
  input: {}
  output:
    blind_persons_allowance: 0

- name: Married Couples' Allowance Deduction
  period: 2024
  input:
    married_couples_allowance: 3000
  output: 
    married_couples_allowance_deduction: 300.0

- name: Capped Married Couples' Allowance Deduction
  period: 2024
  input:
    married_couples_allowance_deduction: 800.0
    income_tax_pre_charges: 500.0
    CB_HITC: 200.0
  output:
    # The reduction is deducted at Step 6 only so far as there is Step 5 tax
    # (ITA 2007 s. 29(2)); the High Income Child Benefit Charge is added at
    # Step 7 and is not reduced.
    capped_mcad: 500.0
    income_tax_reductions: 500.0
    income_tax: 200.0

- name: Annual Allowance for Pension Contributions
  period: 2024
  input:
    net_income: 60_000
  output:
    # AA = £60,000 from 2023-04-06 (FA 2004 s.228, amended by Finance (No. 2) Act 2023)
    # Net income of £60,000 is below the taper threshold of £260,000, so full AA applies
    pension_annual_allowance: 60_000

- name: Trading Allowance Deduction
  period: 2024
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 2000
    self_employment_income: 1500
  output:
    trading_allowance_deduction: 1500.0

- name: Property Allowance Deduction
  period: 2024
  input:
    property_rental_income: 3000
    property_income: 3000
    gov.hmrc.income_tax.allowances.property_allowance: 1000
  output:
    property_allowance_deduction: 1000.0

- name: Savings Allowance
  period: 2024
  input:
    tax_band: STARTER
  output:
    savings_allowance: 1000.0

- name: Allowances applicable to net income exclude Gift Aid
  period: 2024
  input:
    personal_allowance: 12000
    blind_persons_allowance: 2000
    gift_aid: 500
    covenanted_payments: 300
    charitable_investment_gifts: 100
    other_deductions: 50
  output: 
    # ITA 2007 s.414(2)(b) extends limits instead of deducting the gift.
    # https://www.legislation.gov.uk/ukpga/2007/3/section/414
    allowances: 14450.0
