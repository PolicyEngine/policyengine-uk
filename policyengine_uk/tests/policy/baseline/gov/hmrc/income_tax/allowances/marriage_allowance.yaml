      transferor:
        age: 38
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    # Step 5 tax (13,000 - 12,570) x 20% = 86, so the reduction is 86.
    makes_marriage_allowance_election: [false, true]
    marriage_allowance: [1_260, 0]
    marriage_allowance_tax_reduction: [86, 0]
    income_tax: [0, 0]

- name: Other tax reductions come first (s. 29(3))
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 15_000
        other_tax_credits: 300
      transferor:
        age: 38
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    # Step 5 tax 2,430 x 20% = 486, less 300 leaves 186 for the reduction.
    marriage_allowance_tax_reduction_limit: [186, 0]
    marriage_allowance_tax_reduction: [186, 0]
    income_tax: [0, 0]

- name: When either spouse's election saves the same, the elder elects
  period: 2026
  input:
    people:
      p1:
        age: 40
        savings_interest_income: 15_000
        dividend_income: 10_000
      p2:
        age: 38
        savings_interest_income: 15_000
        dividend_income: 10_000
    benunits:
      benunit:
        members: [p1, p2]
        is_married: true
  output:
    # Each: the allowance covers interest, the rest sits in the 0% starting
    # rate for savings either way, and dividends pay 9,500 x 10.75% =
    # 1,021.25. Either election saves 252.
    makes_marriage_allowance_election: [true, false]
    personal_allowance: [11_310, 12_570]
    income_tax: [1_021.25, 769.25]

