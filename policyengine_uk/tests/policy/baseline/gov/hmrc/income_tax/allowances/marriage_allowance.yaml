- name: s. 55B(2)(ba) - dividends in the nil rate above the basic rate limit bar the recipient
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 50_070
        dividend_income: 500
      transferor:
        age: 38
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    # Taxable 37,500 + 500: without the dividend nil rate 300 of dividends
    # would be at the dividend upper rate.
    makes_marriage_allowance_election: [false, false]
    income_tax: [7_500, 0]

- name: Savings in the savings nil rate above the basic rate limit do not bar the recipient
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 50_070
        savings_interest_income: 500
      transferor:
        age: 38
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    # The interest is at the savings nil rate, which s. 55B(2)(b) allows:
    # 37,500 x 20% - 252 = 7,248.
    makes_marriage_allowance_election: [false, true]
    income_tax: [7_248, 0]

