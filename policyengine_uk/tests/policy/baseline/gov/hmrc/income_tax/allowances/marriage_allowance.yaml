# Regression test for issue #1666: children in a married benefit unit must not
# receive (negative) Marriage Allowance and must not be taxed on phantom income.
- name: Children in married benunit do not transfer Marriage Allowance
  period: 2026
  input:
    people:
      adult1:
        age: 42
        employment_income: 55_000
      adult2:
        age: 40
        employment_income: 35_000
      child1:
        age: 8
      child2:
        age: 3
    benunit:
      members: [adult1, adult2, child1, child2]
      is_married: true
  output:
    marriage_allowance: [0, 0, 0, 0]
    income_tax: [9_432, 4_486, 0, 0]

# ITA 2007 ss. 55A-55E. 2026-27: personal allowance 12,570 (s. 35(1)), so the
# transferable amount is 10% x 12,570 = 1,257, rounded up to 1,260
# (s. 55B(4)(b), (5)). The transferor's allowance falls to 11,310 (s. 55B(6));
# the recipient's tax falls by 20% x 1,260 = 252 at Step 6 (s. 55A(2),
# s. 55B(1), (3)), capped at their Step 5 tax (s. 29(2)). The couple elects
# only when that lowers their combined tax.

- name: Issue example - transferor between the cut and the full allowance
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 30_000
      transferor:
        age: 38
        employment_income: 12_000
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    # Transferor: (12,000 - 11,310) x 20% = 138. Recipient:
    # (30,000 - 12,570) x 20% - 252 = 3,486 - 252 = 3,234. The couple pays
    # 3,372 against 3,486 without the election.
    makes_marriage_allowance_election: [false, true]
    marriage_allowance_relinquished: [0, 1_260]
    marriage_allowance: [1_260, 0]
    personal_allowance: [12_570, 11_310]
    marriage_allowance_tax_reduction: [252, 0]
    income_tax: [3_234, 138]

- name: Transferor with no income
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 30_000
      transferor:
        age: 38
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    makes_marriage_allowance_election: [false, true]
    marriage_allowance: [1_260, 0]
    income_tax: [3_234, 0]

- name: Transferor just under the allowance still saves the couple tax
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 30_000
      transferor:
        age: 38
        employment_income: 12_500
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    # Transferor: (12,500 - 11,310) x 20% = 238, less than the 252 saved.
    makes_marriage_allowance_election: [false, true]
    income_tax: [3_234, 238]

- name: Transferor using the whole allowance gains nothing, so the couple does not elect
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 30_000
      transferor:
        age: 38
        employment_income: 12_570
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    # Electing would cost the transferor 1,260 x 20% = 252, exactly the
    # recipient's reduction.
    makes_marriage_allowance_election: [false, false]
    marriage_allowance: [0, 0]
    personal_allowance: [12_570, 12_570]
    income_tax: [3_486, 0]

- name: Issue departure 1 - transferor with 15,000 of interest stays at the starting rate for savings
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 30_000
      transferor:
        age: 38
        savings_interest_income: 15_000
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    # Transferor: 15,000 - 11,310 = 3,690 of interest, all inside the 5,000
    # starting rate for savings at 0% (s. 12), so they can elect
    # (s. 55C(1)(c)) and pay nothing more. Recipient: 3,486 - 252 = 3,234.
    makes_marriage_allowance_election: [false, true]
    personal_allowance: [12_570, 11_310]
    income_tax: [3_234, 0]

- name: Issue departure 1 - transferor with 12,000 of interest
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 30_000
      transferor:
        age: 38
        savings_interest_income: 12_000
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    makes_marriage_allowance_election: [false, true]
    income_tax: [3_234, 0]

- name: Issue departure 2 - recipient taxed mostly on dividends keeps the reduction
  period: 2026
  input:
    people:
      recipient:
        age: 40
        employment_income: 12_570
        dividend_income: 5_000
      transferor:
        age: 38
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
  output:
    # Earnings use the whole allowance. Dividends: 500 at the dividend nil
    # rate, 4,500 x 10.75% = 483.75 at Step 5, less 252 = 231.75.
    marriage_allowance: [1_260, 0]
    marriage_allowance_tax_reduction: [252, 0]
    income_tax: [231.75, 0]

- name: Issue departure 3 - Scottish intermediate-rate recipient saves the Scottish basic rate
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      recipient:
        age: 40
        employment_income: 30_000
      transferor:
        age: 38
        employment_income: 5_000
    benunits:
      benunit:
        members: [recipient, transferor]
        is_married: true
    households:
      household:
        members: [recipient, transferor]
        region: SCOTLAND
  output:
    # Recipient: 17,430 taxable = 3,967 x 19% + 12,989 x 20% + 474 x 21%
    # = 753.73 + 2,597.80 + 99.54 = 3,451.07, less 20% x 1,260 = 252, not
    # the 21% marginal rate.
    marriage_allowance_appropriate_percentage: [0.2, 0.2]
    marriage_allowance_tax_reduction: [252, 0]
    income_tax: [3_199.07, 0]

