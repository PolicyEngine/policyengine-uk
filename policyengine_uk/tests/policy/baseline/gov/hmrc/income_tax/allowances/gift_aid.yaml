# ITA 2007 ss.414(2)(b), 415 extend the basic and higher rate limits by
# the grossed-up gift rather than deducting the net gift from taxable income.
# https://www.legislation.gov.uk/ukpga/2007/3/section/414
# https://www.legislation.gov.uk/ukpga/2007/3/section/415
# s.58 Step 2 deducts the gross gift from adjusted net income (ANI).
# https://www.legislation.gov.uk/ukpga/2007/3/section/58

- name: Higher-rate taxpayer gets relief from the extended basic-rate limit
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 60000
    gift_aid: 1000
  output:
    # £1,000 net = £1,250 gross, moving £1,250 from 40% to 20%.
    # £11,432 tax without Gift Aid less £250 relief.
    income_tax: 11182

- name: Basic-rate taxpayer gets no further taxpayer relief
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 30000
    gift_aid: 1000
  output:
    # s.414(2)(a) treats the gift as made after basic-rate deduction.
    # Extending the basic-rate limit leaves this taxpayer's tax unchanged.
    income_tax: 3486

- name: Gift Aid reduces ANI for PA taper - full PA restored
  period: 2025
  absolute_error_margin: 1
  input:
    employment_income: 110000
    gift_aid: 10000
  output:
    # Per ITA 2007 s.58, Gift Aid (grossed up) reduces ANI for PA taper
    # £10k net = £12,500 gross
    # ANI for PA taper = £110k - £12.5k = £97,500
    # This is below £100k threshold, so full PA restored
    personal_allowance: 12570

- name: Gift Aid partially restores PA in taper zone
  period: 2025
  absolute_error_margin: 1
  input:
    employment_income: 115000
    gift_aid: 4000
  output:
    # £4k net = £5k gross
    # ANI for PA taper = £115k - £5k = £110k
    # Excess over £100k = £10k
    # PA reduction = £10k * 0.5 = £5k
    # PA = £12,570 - £5k = £7,570
    personal_allowance: 7570

- name: Gift Aid restores personal allowance and extends rate limits
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 110000
    gift_aid: 10000
  output:
    # £10,000 net = £12,500 gross; ANI £97,500 restores PA £12,570.
    # Taxable income remains £110,000 - £12,570 = £97,430.
    # £50,200 at 20% plus £47,230 at 40% = £28,932.
    income_tax: 28932
