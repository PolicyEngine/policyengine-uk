  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 3_000
    savings_interest_income: 4_000
    dividend_income: 20_000
    region: SCOTLAND
  output:
    # Scottish rates apply only to non-savings income (s. 11A). The pay
    # takes £3,000 of the allowance, saving the 19% starter rate. The
    # savings stay whole at 0% in the starting rate band (s. 12) and the
    # dividends take the other £9,570. Dividends of £10,430 from £4,000:
    # (10,430 - 500) x 10.75% on the UK bands (s. 13(5)) = 1,067.475.
    # Setting the allowance against savings before dividends would leave
    # £14,430 of dividends: £430 more tax.
    received_allowances_earned_income: 3_000
    received_allowances_savings_income: 0
    received_allowances_dividend_income: 9_570
    earned_income_tax: 0
    savings_income_tax: 0
    income_tax: 1_067.475

