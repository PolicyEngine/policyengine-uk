    trade_loss_relief_against_general_income: 10_000
    trade_loss_relief_against_savings_and_dividends: 7_700
    received_allowances_earned_income: 0
    received_allowances_savings_income: 20_270
    earned_taxable_income: 37_700
    non_savings_income_after_allowances: 37_700
    earned_income_tax: 7_540
    savings_income_tax: 3_692
    income_tax: 11_232

