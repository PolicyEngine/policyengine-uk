- name: Case 13, a Marriage Allowance recipient the old order already qualifies keeps it
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      recipient:
        age: 40
        employment_income: 5_000
        property_income: 15_000
        savings_interest_income: 15_000
      partner:
        age: 40
    benunit:
      members: [recipient, partner]
      is_married: true
  output:
    # The model gives the recipient a Marriage Allowance of £1,260 from the
    # partner's unused Personal Allowance: 10% of £12,570, rounded up to a
    # multiple of £10 (s. 55B(4) and (5)). The old order leaves £22,430, all
    # within the basic rate limit, so it already meets the rate test
    # (s. 55B(2)(b)) and no share wins more. Pay, property income
    # and the savings above the £1,000 savings allowance all bear 20%, and the
    # pay and property income leave no starting rate band (s. 12), so no share
    # lowers the Step 5 tax, and the model takes the Personal Allowance off the
    # pay and then the property income. Property 7,430 x 20% = 1,486; savings
    # of £15,000 from £7,430: £1,000 at the savings nil rate and
    # 14,000 x 20% = 2,800.
    marriage_allowance: [1_260, 0]
    received_allowances_earned_income: [12_570, 0]
    received_allowances_savings_income: [0, 0]
    income_tax_pre_charges: [4_286, 0]

- name: Case 14, net pay pension relief stays on pay
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 40_000
    employee_pension_contributions: 10_000
    savings_interest_income: 30_000
  output:
    # The model takes employee contributions as a net pay arrangement, which
    # the employer deducts from employment income (FA 2004 s. 193(2)). The
    # taxpayer can't set that relief against savings, so it stays on the
    # pay, and the pay left for the share is £30,000, as if the person had
    # pay of £30,000 and no pension. Adjusted net income of £60,000 leaves the
    # full £12,570 allowance and a £500 savings allowance (s. 12B). Against
    # pay: pay 17,430 x 20% = 3,486; savings from £17,430 to £47,430: £500 at
    # the nil rate, (37,700 - 17,930) x 20% = 3,954 and 9,730 x 40% = 3,892.
    # Every share keeps the savings allowance below the £37,700 limit, where
    # it saves 20%, so no share lowers the tax of 11,332. Sharing the pension
    # relief too would put the pay at the limit and charge £100 less.
    pension_contributions_relief: 10_000
    received_allowances_earned_income: 22_570
    received_allowances_savings_income: 0
    earned_taxable_income: 17_430
    earned_income_tax: 3_486
    savings_income_tax: 7_846
    income_tax: 11_332

- name: Case 15, relief at source on personal pension contributions stays on non-savings income
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 40_000
    personal_pension_contributions: 10_000
    savings_interest_income: 30_000
  output:
    # The model takes personal contributions as relief at source. Parliament
    # deducts nothing from income: the payer keeps basic rate tax on the
    # contribution (FA 2004 s. 192(1)) and, on a claim, the basic and higher
    # rate limits rise by the contribution (s. 192(4)). Under the law the
    # liability is £13,332 and the payer keeps £2,000; the model deducts the
    # relief from non-savings income instead, which gives the same net
    # £11,332, as in case 14.
    pension_contributions_relief: 10_000
    received_allowances_earned_income: 22_570
    received_allowances_savings_income: 0
    income_tax: 11_332

