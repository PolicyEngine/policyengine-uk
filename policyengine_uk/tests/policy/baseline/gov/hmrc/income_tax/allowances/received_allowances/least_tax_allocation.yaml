- name: Case 19, a recipient's share wins the Marriage Allowance at a higher Step 5 tax
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      recipient:
        age: 40
        employment_income: 40_000
        savings_interest_income: 9_000
        dividend_income: 1_570
      partner:
        age: 40
    benunit:
      members: [recipient, partner]
      is_married: true
  output:
    # Section 25(2) asks for the greatest reduction in liability, and s. 23
    # fixes liability after the Step 6 tax reductions. The whole allowance
    # against pay gives the least Step 5 tax, but £300 of dividends then bear
    # the dividend upper rate, so the recipient fails the rate test
    # (s. 55B(2)(b) and (ba)): 27,430 x 20% = 5,486, 8,500 of savings x 20%
    # = 1,700, and 770 x 10.75% + 300 x 35.75% = 190.025, £7,376.025 in all.
    # Setting £2,500 against pay, £8,500 against savings and all £1,570
    # against dividends leaves £37,500 of pay at 20%, £500 of savings at the
    # savings nil rate and no dividends. The rate test then holds, and the
    # tax is 7,500 less 20% of 1,260 = 252: £7,248.
    received_allowances_earned_income: [2_500, 0]
    received_allowances_savings_income: [8_500, 0]
    received_allowances_dividend_income: [1_570, 0]
    income_tax_pre_charges: [7_500, 0]
    meets_marriage_allowance_income_conditions: [true, true]
    marriage_allowance: [1_260, 0]
    marriage_allowance_tax_reduction: [252, 0]
    income_tax: [7_248, 0]

