# trading_allowance_claim_status says which receipts lie behind a person's
# input profit (ITTOIA 2005 Part 6A). The input allowance is the allowance
# legislated for the year the data were measured: a dataset's first year, or
# in a situation like these the latest year the status was supplied for, here
# the year simulated. Reforms do not move it.
# - Claimant: the profit is receipts less the input allowance, as under
#   partial relief (s. 783AI), so receipts are profit + input allowance and
#   the deduction at allowance A is min(profit, A - input allowance). Partial
#   relief replaces capital allowances, so a claimant's are not deducted.
#   Their claim was the election (s. 783AM), so they keep the allowance, and
#   give up current losses, while A is above nil and at least their expenses
#   (gov.simulation.trading_allowance_claimant_expense_share of the input
#   allowance, by default all of it); below those they deduct them instead.
# - Non-claimant: no election for partial relief; full relief needs none
#   (s. 783AE) and applies where supplied receipts, or casual income alone
#   with no profit, are within the allowance.
# - Unknown (the default): unchanged.
# The allowance is £1,000 in 2026-27 and £3,000 from 2027-28 (Budget 2026,
# paragraph 6.254), so the input allowance is £1,000 in the 2026 cases and
# £3,000 in the 2027 ones. Personal allowance £12,570, basic rate 20%,
# Class 4 main rate 6% above the £12,570 lower profits limit.

- name: A claimant at the input allowance keeps their profit as reported.
  period: 2026
  absolute_error_margin: 0
  input:
    self_employment_income: 2_500
    trading_allowance_claim_status: CLAIMANT
  output:
    trading_allowance_deduction: 0
    taxable_self_employment_income: 2_500
    # Their claim is the election, though it relieves nothing more.
    uses_trading_allowance: true

- name: A claimant's profit below the allowance already deducts it.
  period: 2026
  absolute_error_margin: 0
  input:
    self_employment_income: 600
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts of £1,600 are above the allowance, so the £600 is receipts
    # less the allowance. Unknown status would relieve it in full.
    trading_allowance_deduction: 0
    taxable_self_employment_income: 600

- name: A 2027-28 claimant's profit already deducts the £3,000 allowance.
  period: 2027
  absolute_error_margin: 0
  input:
    self_employment_income: 2_500
    trading_allowance_claim_status: CLAIMANT
  output:
    trading_allowance_deduction: 0
    taxable_self_employment_income: 2_500

- name: A raise to £3,000 gives a claimant £2,000 more.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    employment_income: 30_000
    self_employment_income: 2_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts 2,500 + 1,000 = 3,500, less the £3,000 allowance.
    trading_allowance_deduction: 2_000
    taxable_self_employment_income: 500
    # (30,000 + 500 - 12,570) x 20%
    income_tax: 3_586

- name: A claimant whose receipts are within £3,000 is fully relieved.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    self_employment_income: 2_000
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts 2,000 + 1,000 = 3,000 (s. 783AF).
    trading_allowance_deduction: 2_000
    taxable_self_employment_income: 0

- name: A raise to £5,000 gives a claimant £4,000 more.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 5_000
    self_employment_income: 6_000
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts 6,000 + 1,000 = 7,000, less the £5,000 allowance.
    trading_allowance_deduction: 4_000
    taxable_self_employment_income: 2_000

- name: A claimant whose receipts are within £5,000 is fully relieved.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 5_000
    self_employment_income: 3_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts 3,500 + 1,000 = 4,500.
    trading_allowance_deduction: 3_500
    taxable_self_employment_income: 0

- name: A raise from 2027-28's £3,000 to £5,000 gives a claimant £2,000 more.
  period: 2027
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 5_000
    self_employment_income: 2_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts 2,500 + 3,000 = 5,500, less the £5,000 allowance.
    trading_allowance_deduction: 2_000
    taxable_self_employment_income: 500

- name: A cut to £500 leaves a claimant's profit as reported.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 500
    people:
      claimant:
        self_employment_income: 2_500
        trading_allowance_claim_status: CLAIMANT
      unknown:
        self_employment_income: 800
    benunits:
      benunit:
        members: [claimant, unknown]
    households:
      household:
        members: [claimant, unknown]
  output:
    # The claimant's receipts are £3,500 and their expenses are below
    # £1,000 but unknown. By default
    # (gov.simulation.trading_allowance_claimant_expense_share = 1) they are
    # taken as £1,000, so a cut adds nothing: the lower bound. The
    # unknown-status £800 profit is above £500 and loses its full relief.
    # [claimant, unknown]
    trading_allowance_deduction: [0, 0]
    taxable_self_employment_income: [2_500, 800]

- name: With no expenses, a cut to £500 adds £500 to a claimant's profit.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 500
    gov.simulation.trading_allowance_claimant_expense_share: 0
    self_employment_income: 2_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # They keep claiming: 3,500 - 500 = 3,000, the upper bound.
    trading_allowance_deduction: -500
    taxable_self_employment_income: 3_000

- name: With £500 of expenses, a cut to £300 adds £500 to a claimant's profit.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 300
    gov.simulation.trading_allowance_claimant_expense_share: 0.5
    self_employment_income: 2_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # Expenses of 0.5 x 1,000 = 500 beat a £300 allowance: 3,500 - 500.
    trading_allowance_deduction: -500
    taxable_self_employment_income: 3_000

- name: An expense share above 1 is taken as 1, so today's law gives a claimant nothing more.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.simulation.trading_allowance_claimant_expense_share: 1.5
    self_employment_income: 2_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # Expenses above the allowance they chose would contradict their claim.
    trading_allowance_deduction: 0
    taxable_self_employment_income: 2_500
    uses_trading_allowance: true

- name: Abolishing the allowance leaves a claimant's profit as reported.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 0
    people:
      claimant:
        self_employment_income: 2_500
        trading_allowance_claim_status: CLAIMANT
      unknown:
        self_employment_income: 800
    benunits:
      benunit:
        members: [claimant, unknown]
    households:
      household:
        members: [claimant, unknown]
  output:
    # [claimant, unknown]
    trading_allowance_deduction: [0, 0]
    taxable_self_employment_income: [2_500, 800]
    uses_trading_allowance: [false, false]

- name: A claimant's capital allowances are not deducted.
  period: 2026
  absolute_error_margin: 0
  input:
    self_employment_income: 2_500
    capital_allowances: 500
    trading_allowance_claim_status: CLAIMANT
  output:
    # Partial relief replaces them (s. 783AI): receipts 3,500 less £1,000.
    # The deduction gives back the £500 deducted separately.
    trading_allowance_deduction: -500
    taxable_self_employment_income: 2_500
    ni_class_4_profits_before_losses: 2_500

- name: Under a raise to £3,000 a claimant's capital allowances are still not deducted.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    self_employment_income: 2_500
    capital_allowances: 500
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts 3,500 less £3,000, so the raise gains the full £2,000.
    trading_allowance_deduction: 1_500
    taxable_self_employment_income: 500

- name: A claimant's status takes precedence over supplied receipts.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    self_employment_gross_receipts: 6_000
    self_employment_income: 2_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts are read as 2,500 + 1,000 = 3,500, not 6,000.
    trading_allowance_deduction: 2_000
    taxable_self_employment_income: 500

- name: A claimant with no profit is read as unknown.
  period: 2026
  absolute_error_margin: 0
  input:
    miscellaneous_income: 2_000
    income_not_otherwise_charged: 2_000
    trading_allowance_claim_status: CLAIMANT
  output:
    # No trade receipts are invented, so the casual income has the whole
    # £1,000 allowance.
    miscellaneous_income_trading_allowance_deduction: 1_000
    taxable_miscellaneous_income: 1_000

- name: A no-profit claimant's casual income within £3,000 is fully relieved.
  period: 2027
  absolute_error_margin: 0
  input:
    miscellaneous_income: 2_800
    income_not_otherwise_charged: 2_800
    trading_allowance_claim_status: CLAIMANT
  output:
    miscellaneous_income_trading_allowance_deduction: 2_800
    taxable_miscellaneous_income: 0

- name: A non-claimant's profit below the allowance is taxed.
  period: 2027
  absolute_error_margin: 0
  input:
    self_employment_income: 600
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    # Expenses above the allowance put receipts above it, so full relief
    # cannot apply. Unknown status would relieve the £600 in full.
    trading_allowance_deduction: 0
    taxable_self_employment_income: 600

- name: A raise to £5,000 gives a non-claimant nothing.
  period: 2027
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 5_000
    people:
      non_claimant:
        self_employment_income: 2_500
        trading_allowance_claim_status: NON_CLAIMANT
      unknown:
        self_employment_income: 4_000
    benunits:
      benunit:
        members: [non_claimant, unknown]
    households:
      household:
        members: [non_claimant, unknown]
  output:
    # The unknown-status £4,000 profit is within £5,000 and relieved in full.
    # [non_claimant, unknown]
    trading_allowance_deduction: [0, 4_000]
    taxable_self_employment_income: [2_500, 0]

- name: A non-claimant's supplied receipts above the allowance give no switching gain.
  period: 2027
  absolute_error_margin: 0
  input:
    self_employment_gross_receipts: 4_000
    self_employment_income: 2_500
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    # With £1,500 of expenses, electing for the £3,000 allowance would
    # charge £1,000. That election is a change in behaviour.
    trading_allowance_deduction: 0
    taxable_self_employment_income: 2_500

- name: A non-claimant's receipts within the allowance are fully relieved.
  period: 2027
  absolute_error_margin: 0.01
  input:
    employment_income: 30_000
    self_employment_gross_receipts: 2_800
    self_employment_income: 600
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    # Full relief needs no election (s. 783AE).
    trading_allowance_deduction: 600
    taxable_self_employment_income: 0
    # (30,000 - 12,570) x 20%
    income_tax: 3_486

- name: A non-claimant's receipts and casual income within the allowance are both relieved.
  period: 2027
  absolute_error_margin: 0
  input:
    self_employment_gross_receipts: 2_000
    self_employment_income: 600
    miscellaneous_income: 900
    income_not_otherwise_charged: 900
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    # Relevant income 2,000 + 900 = 2,900 (ss. 783AF and 783AG).
    trading_allowance_deduction: 600
    miscellaneous_income_trading_allowance_deduction: 900
    taxable_miscellaneous_income: 0

- name: A non-claimant's relevant income exactly at the allowance is fully relieved.
  period: 2027
  absolute_error_margin: 0
  input:
    self_employment_gross_receipts: 2_100
    self_employment_income: 600
    miscellaneous_income: 900
    income_not_otherwise_charged: 900
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    # 2,100 + 900 = 3,000 does not exceed the allowance (s. 783AE).
    trading_allowance_deduction: 600
    miscellaneous_income_trading_allowance_deduction: 900
    taxable_miscellaneous_income: 0

- name: A non-claimant's receipts and casual income above the allowance get nothing.
  period: 2027
  absolute_error_margin: 0
  input:
    self_employment_gross_receipts: 2_500
    self_employment_income: 600
    miscellaneous_income: 900
    income_not_otherwise_charged: 900
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    # Relevant income 3,400 needs partial relief, which they do not elect
    # (s. 783AM).
    trading_allowance_deduction: 0
    miscellaneous_income_trading_allowance_deduction: 0
    taxable_miscellaneous_income: 900
    uses_trading_allowance: false

- name: A non-claimant with no trade has casual income within the allowance relieved.
  period: 2026
  absolute_error_margin: 0.01
  input:
    employment_income: 30_000
    miscellaneous_income: 800
    income_not_otherwise_charged: 800
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    miscellaneous_income_trading_allowance_deduction: 800
    taxable_miscellaneous_income: 0
    # (30,000 - 12,570) x 20%
    income_tax: 3_486

- name: A non-claimant with no trade has casual income exactly at the allowance relieved.
  period: 2027
  absolute_error_margin: 0
  input:
    miscellaneous_income: 3_000
    income_not_otherwise_charged: 3_000
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    miscellaneous_income_trading_allowance_deduction: 3_000
    taxable_miscellaneous_income: 0

- name: Unknown status still relieves a profit within the allowance.
  period: 2027
  absolute_error_margin: 0
  input:
    self_employment_income: 2_500
    trading_allowance_claim_status: UNKNOWN
  output:
    trading_allowance_deduction: 2_500
    taxable_self_employment_income: 0

- name: Unknown status still applies the allowance to supplied receipts.
  period: 2027
  absolute_error_margin: 0
  input:
    self_employment_gross_receipts: 5_000
    self_employment_income: 4_000
    trading_allowance_claim_status: UNKNOWN
  output:
    trading_allowance_deduction: 2_000
    taxable_self_employment_income: 2_000

- name: Class 4 reads a claimant's deduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    self_employment_income: 20_000
    trading_allowance_claim_status: CLAIMANT
  output:
    trading_allowance_deduction: 2_000
    ni_class_4_profits_before_losses: 18_000
    # (18,000 - 12,570) x 6%
    ni_class_4: 325.80
    # (18,000 - 12,570) x 20%
    income_tax: 1_086

- name: Class 4 charges a non-claimant's whole profit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    self_employment_income: 20_000
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    trading_allowance_deduction: 0
    ni_class_4_profits_before_losses: 20_000
    # (20,000 - 12,570) x 6%
    ni_class_4: 445.80
    # (20,000 - 12,570) x 20%
    income_tax: 1_486

- name: A claimant gives up a current loss at the input allowance.
  period: 2026
  absolute_error_margin: 0.01
  input:
    employment_income: 30_000
    self_employment_income: 2_500
    trading_loss: 1_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # Their claim made the loss nil (ss. 783AF and 783AI).
    trading_allowance_deduction: 0
    uses_trading_allowance: true
    trade_loss_relief_against_general_income: 0
    ni_class_4_trading_loss: 0
    # (30,000 + 2,500 - 12,570) x 20%
    income_tax: 3_986

- name: A raise to £3,000 gives a claimant with a current loss its full £2,000.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    employment_income: 30_000
    self_employment_income: 2_500
    trading_loss: 1_500
    trading_allowance_claim_status: CLAIMANT
  output:
    trading_allowance_deduction: 2_000
    uses_trading_allowance: true
    trade_loss_relief_against_general_income: 0
    # (30,000 + 500 - 12,570) x 20%, £400 less than at £1,000.
    income_tax: 3_586

- name: A claimant keeps the allowance against a current loss larger than its saving.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    employment_income: 30_000
    self_employment_income: 2_500
    trading_loss: 2_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # They chose the allowance over this loss at £1,000, and a raise only
    # makes it better.
    trading_allowance_deduction: 2_000
    uses_trading_allowance: true
    trade_loss_relief_against_general_income: 0
    ni_class_4_trading_loss: 0
    income_tax: 3_586

- name: Abolishing the allowance lets a claimant claim a current loss.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 0
    employment_income: 30_000
    self_employment_income: 2_500
    trading_loss: 1_500
    trading_allowance_claim_status: CLAIMANT
  output:
    uses_trading_allowance: false
    trade_loss_relief_against_general_income: 1_500
    # (30,000 + 2,500 - 1,500 - 12,570) x 20%
    income_tax: 3_686

- name: A cut below a claimant's expenses lets them claim a current loss.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 500
    employment_income: 30_000
    self_employment_income: 2_500
    trading_loss: 1_500
    trading_allowance_claim_status: CLAIMANT
  output:
    # By default their expenses are £1,000, which beat a £500 allowance:
    # they deduct them, ordinary treatment (s. 783AM), so the loss is
    # claimable, as it is under abolition.
    trading_allowance_deduction: 0
    taxable_self_employment_income: 2_500
    uses_trading_allowance: false
    trade_loss_relief_against_general_income: 1_500
    # (30,000 + 2,500 - 1,500 - 12,570) x 20%
    income_tax: 3_686

- name: A non-claimant claims a current loss the allowance would have taken.
  period: 2027
  absolute_error_margin: 0.01
  input:
    employment_income: 30_000
    self_employment_income: 600
    trading_loss: 500
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    # Unknown status would relieve the £600 profit and give up the loss.
    trading_allowance_deduction: 0
    uses_trading_allowance: false
    trade_loss_relief_against_general_income: 500
    # (30,000 + 600 - 500 - 12,570) x 20%
    income_tax: 3_506

- name: A non-claimant elects out of full relief to claim a larger current loss.
  period: 2027
  absolute_error_margin: 0.01
  input:
    employment_income: 30_000
    self_employment_gross_receipts: 2_800
    self_employment_income: 600
    trading_loss: 1_000
    trading_allowance_claim_status: NON_CLAIMANT
  output:
    # Full relief saves £600 against a £1,000 loss (s. 783AL).
    trading_allowance_deduction: 0
    uses_trading_allowance: false
    trade_loss_relief_against_general_income: 1_000
    # (30,000 + 600 - 1,000 - 12,570) x 20%
    income_tax: 3_406

- name: A claimant's receipts and casual income within £3,000 are both relieved.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    self_employment_income: 500
    miscellaneous_income: 900
    income_not_otherwise_charged: 900
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts of £1,500 and casual income of £900 (ss. 783AF and 783AG).
    trading_allowance_deduction: 500
    taxable_self_employment_income: 0
    miscellaneous_income_trading_allowance_deduction: 900
    taxable_miscellaneous_income: 0

- name: Casual income gets what a claimant's receipts leave of £3,000.
  period: 2026
  absolute_error_margin: 0
  input:
    gov.hmrc.income_tax.allowances.trading_allowance: 3_000
    self_employment_income: 1_800
    miscellaneous_income: 900
    income_not_otherwise_charged: 900
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts of £2,800 take £2,800 of the allowance first (s. 783AK).
    trading_allowance_deduction: 1_800
    taxable_self_employment_income: 0
    miscellaneous_income_trading_allowance_deduction: 200
    taxable_miscellaneous_income: 700

- name: At the input allowance a claimant's receipts leave none for casual income.
  period: 2026
  absolute_error_margin: 0
  input:
    self_employment_income: 500
    miscellaneous_income: 900
    income_not_otherwise_charged: 900
    trading_allowance_claim_status: CLAIMANT
  output:
    # Receipts of £1,500 are above the £1,000 allowance.
    trading_allowance_deduction: 0
    taxable_self_employment_income: 500
    miscellaneous_income_trading_allowance_deduction: 0
    taxable_miscellaneous_income: 900
