- name: No Child Benefit, no charge
  period: 2021
  input:
    child_benefit: 0
  output:
    CB_HITC: 0

- name: Child Benefit, under income threshold
  period: 2021
  input:
    child_benefit: 1_000
  output:
    CB_HITC: 0

- name: Child Benefit, halfway through phase-out
  period: 2021
  input:
    child_benefit: 1_000
    employment_income: 55_000
  output:
    CB_HITC: 500

- name: Child Benefit, all the way through phase-out
  period: 2021
  input:
    child_benefit: 1_000
    employment_income: 60_000
  output:
    CB_HITC: 1_000

- name: Case 5, high-income family pays one full Child Benefit charge.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 113_850
      person2:
        age: 38
        employment_income: 35_000
      person3:
        age: 8
      person4:
        age: 5
    benunit:
      members: [person1, person2, person3, person4]
  output:
    child_benefit: 2_337.40
    # s. 681C(3): the Child Benefit total is rounded down to £2,337.
    CB_HITC: [2_337, 0, 0, 0]
    income_tax_pre_charges: [35_742, 4_486, 0, 0]
    income_tax: [38_079, 4_486, 0, 0]

# ITEPA 2003 s. 681C(3): the Child Benefit total and the charge are rounded
# down to whole pounds, and the appropriate percentage ((ANI - £60,000) / £200
# from 2024-25) to a whole number.
- name: Case 6, the percentage, the Child Benefit and the charge are rounded down.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
        employment_income: 71_336
      child:
        age: 5
    benunit:
      members: [parent, child]
  output:
    # (71,336 - 60,000) / 200 = 56.68, so 56%; £1,406.60 becomes £1,406;
    # 56% of £1,406 is £787.36, so £787.
    child_benefit: 1_406.60
    CB_HITC: [787, 0]

- name: Case 7, a whole-number percentage is not rounded below itself.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
        employment_income: 70_000
      child:
        age: 5
    benunit:
      members: [parent, child]
  output:
    # (70,000 - 60,000) / 200 = 50%; 50% of £1,406 is £703.
    CB_HITC: [703, 0]

- name: Case 8, just under the next £200 step keeps the lower percentage.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
        employment_income: 70_199
      child:
        age: 5
    benunit:
      members: [parent, child]
  output:
    # 50.995% rounds down to 50%: £703.
    CB_HITC: [703, 0]

- name: Case 9, at or above £80,000 the whole Child Benefit, in whole pounds.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
        employment_income: 90_000
      child1:
        age: 5
      child2:
        age: 3
    benunit:
      members: [parent, child1, child2]
  output:
    child_benefit: 2_337.40
    CB_HITC: [2_337, 0, 0]

- name: Case 10, the 2023-24 rules, 1% per £100 above £50,000.
  period: 2023
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
        employment_income: 55_550
      child:
        age: 5
    benunit:
      members: [parent, child]
      child_benefit: 1_000
  output:
    # (55,550 - 50,000) / 100 = 55.5%, so 55%; 55% of £1,000 is £550.
    CB_HITC: [550, 0]

- name: Case 11, the Child Benefit total is rounded down before the percentage applies.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      parent:
        age: 40
        employment_income: 79_800
      child:
        age: 5
    benunit:
      members: [parent, child]
  output:
    # (79,800 - 60,000) / 200 = 99%; 99% of £1,406 is £1,391.94, so £1,391.
    # Rounding only the charge (99% of £1,406.60 = £1,392.53) would give £1,392.
    CB_HITC: [1_391, 0]
