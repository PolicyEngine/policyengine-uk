  # Relevant UK earnings are employment income chargeable to tax, including
  # taxable statutory sick pay (FA 2004 s.189(2)(a); HMRC PTM044100): 1,000 +
  # 3,000 = £4,000, enough to relieve the whole £2,000 (s.190(1)), which the
  # employer deducts from that income (s.193(2)). Total income: 4,000 +
  # 32,500 - 2,000 = £34,500, not over £35,000: no charge.
  period: 2025
  input:
