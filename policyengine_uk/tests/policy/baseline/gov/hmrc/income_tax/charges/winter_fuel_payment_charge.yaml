- name: 2025 a landlord without finance costs takes the allowance even where it ends Pension Credit (a model limit)
  # Private pension £35,207; property receipts £3,500, expenses £200 (profit
  # £3,300), no finance costs; six children. With partial relief (the £1,000
  # allowance in place of £200 of expenses): total income £37,707, tax
  # (37,707 - 12,570) x 20% = £5,027.40. With expenses: total income £38,507,
  # tax (38,507 - 12,570) x 20% = £5,187.40. Total income is over £35,000
  # either way, so Pension Credit decides the charge. Pension Credit income
  # (pension and property profits, less tax before the charge) is £33,479.60
  # with the allowance and £33,319.60 with expenses, against the model's
  # minimum guarantee of £33,399.60 (with the amounts for the children), so
  # only the expenses route gets Pension Credit (£80), which exempts the
  # pensioner from the £200 charge (s.681I(4)). Total tax: £5,227.40 with the
  # allowance, £5,187.40 with expenses, so a pensioner choosing the lower tax
  # would not elect for partial relief. The model does not compare routes for
  # landlords without finance costs (uses_property_allowance), so it takes the
