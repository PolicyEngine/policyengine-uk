- name: 2025 the charge is added to income tax
  # Private pension £50,000, no other income, England. Personal allowance
  # £12,570; £37,430 at the basic rate of 20% = £7,486 (within the £37,700
  # basic rate band). The charge, £200, is added at Step 7: £7,686. HBAI net
  # income counts the payment and deducts the tax: 50,000 + 200 - 7,686 =
  # £42,514.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        private_pension_income: 50_000
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    total_income_charged_to_tax: [50_000]
    income_tax_before_winter_fuel_payment_charge: [7_486]
    winter_fuel_payment_charge: [200]
    income_tax: [7_686]
    winter_fuel_allowance: 200
    household_benefits: 200
    hbai_household_net_income: 42_514

- name: 2025 Council Tax Reduction income deducts income tax before the charge
  # The pensioner above. Council Tax Reduction income under the general rules
  # deducts income tax and National Insurance, but not the charge, which
  # recovers the payment: 50,000 - 7,486 = £42,514, not 50,000 - 7,686.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        private_pension_income: 50_000
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    winter_fuel_payment_charge: [200]
    council_tax_reduction_applicable_income: [42_514]

- name: 2025 the payment is kept at £35,000 of private pension
  # £22,430 at 20% = £4,486; no charge. HBAI net income: 35,000 + 200 -
  # 4,486 = £30,714.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        private_pension_income: 35_000
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    winter_fuel_payment_charge: [0]
    income_tax: [4_486]
    hbai_household_net_income: 30_714

- name: 2025 Scotland's payment is household income
  # PAWHP counts in household benefits and HBAI income, like the Winter Fuel
