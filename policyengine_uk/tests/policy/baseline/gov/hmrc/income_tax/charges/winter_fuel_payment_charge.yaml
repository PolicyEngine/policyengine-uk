  # £300, so £4,350. With partial relief (£1,000 allowance, no reduction):
  # (35,020 - 12,570) x 20% = £4,490. Total income is over £35,000 either
  # way (£35,820 and £35,020), so Pension Credit decides the charge. Pension
  # Credit income is £29,970 with
  # expenses and £29,830 with the allowance, against the model's minimum
  # guarantee of £29,893.76 (with the amounts for the children), so only the
  # allowance route gets Pension Credit, which exempts the pensioner from the
