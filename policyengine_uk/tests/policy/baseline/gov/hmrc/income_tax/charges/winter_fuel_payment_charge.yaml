        age: 70
        private_pension_income: 20_000
    households:
      household:
        members: [pensioner]
        country: SCOTLAND
  output:
    winter_fuel_payment_charge: [0]
    pawhp: 203.40
    household_benefits: 203.40
    hbai_benefits: 203.40

- name: 2025 a landlord's property allowance election can keep total income under £35,000
  # Private pension £32,000; property receipts £3,500, expenses £200 (profit
  # £3,300), finance costs £1,500. With expenses: total income £35,300, over
  # £35,000, so the £200 charge applies; tax (35,300 - 12,570) x 20% =
  # £4,546, less the finance-cost reduction 20% x £1,500 = £300, so £4,246,
  # and £4,446 with the charge. With partial relief (the £1,000 allowance in
  # place of £200 of expenses, ITTOIA 2005 s.783BH, and no finance-cost
  # reduction): property profits £2,500, total income £34,500, no charge;
  # tax (34,500 - 12,570) x 20% = £4,386. The pensioner elects partial
  # relief.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        private_pension_income: 32_000
        property_rental_income: 3_500
        property_income: 3_300
        property_finance_costs: 1_500
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    uses_property_allowance: [true]
    total_income_charged_to_tax: [34_500]
    income_tax_before_winter_fuel_payment_charge: [4_386]
    winter_fuel_payment_charge: [0]
    income_tax: [4_386]

- name: 2025 employment expenses come off total income
  # Employment income is net taxable earnings, after deductible expenses
  # (ITEPA 2003 ss.11 and 336): 35,500 - 1,000 = £34,500, not over £35,000,
  # so no charge. Tax: (34,500 - 12,570) x 20% = £4,386.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        employment_income: 35_500
        employment_expenses: 1_000
    benunits:
      unit:
        members: [pensioner]
        pension_credit: 0
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    total_income_charged_to_tax: [34_500]
    winter_fuel_payment: [200]
    winter_fuel_payment_charge: [0]
    income_tax: [4_386]

- name: 2025 capital allowances come off total income
  # Capital allowances are deducted as trading expenses (CAA 2001 s.247):
  # trading profits 35,500 - 1,000 = £34,500, so no charge. Tax:
  # (34,500 - 12,570) x 20% = £4,386.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        self_employment_income: 35_500
        capital_allowances: 1_000
    benunits:
      unit:
        members: [pensioner]
        pension_credit: 0
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    total_income_charged_to_tax: [34_500]
    winter_fuel_payment: [200]
    winter_fuel_payment_charge: [0]
    income_tax: [4_386]

- name: 2025 trading income within the trading allowance is not total income
  # A profit of £800 is within the £1,000 trading allowance, so it is not
  # charged to tax (ITTOIA 2005 s.783AF): total income is the £34,500
  # pension, not £35,300, so no charge. Tax: (34,500 - 12,570) x 20% =
  # £4,386.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        private_pension_income: 34_500
        self_employment_income: 800
    benunits:
      unit:
        members: [pensioner]
        pension_credit: 0
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    total_income_charged_to_tax: [34_500]
    winter_fuel_payment: [200]
    winter_fuel_payment_charge: [0]
    income_tax: [4_386]

- name: 2025 ISA interest is not total income
  # Interest of £2,000, £1,500 of it from an ISA, which is exempt (ITTOIA
  # 2005 s.694): total income is 34,000 + 500 = £34,500, so no charge. Tax:
  # (34,000 - 12,570) x 20% = £4,286 on the pension; the £500 of interest is
  # within the £1,000 personal savings allowance.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        private_pension_income: 34_000
        savings_interest_income: 2_000
        tax_free_savings_income: 1_500
    benunits:
      unit:
        members: [pensioner]
        pension_credit: 0
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    total_income_charged_to_tax: [34_500]
    winter_fuel_payment: [200]
    winter_fuel_payment_charge: [0]
    income_tax: [4_286]

- name: 2025 losses brought forward do not lower total income
  # Relief for a trade loss carried forward (ITA 2007 s.83) is deducted at
  # Step 2, after total income: total income is the £40,000 profit, so the
  # £200 charge applies. Tax before the charge: (40,000 - 10,000 - 12,570) x
  # 20% = £3,486; with the charge, £3,686.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        self_employment_income: 40_000
        loss_relief: 10_000
    benunits:
      unit:
        members: [pensioner]
        pension_credit: 0
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    total_income_charged_to_tax: [40_000]
    winter_fuel_payment_charge: [200]
    income_tax_before_winter_fuel_payment_charge: [3_486]
    income_tax: [3_686]

- name: 2025 statutory sick pay counts towards total income
  # Statutory sick pay is income charged to tax, so it is part of total
  # income (ITA 2007 s.23 Step 1): £30,000 + £6,000 = £36,000, over £35,000.
  # Tax before the charge: (36,000 - 12,570) x 20% = £4,686; with the £200
  # charge, £4,886.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        private_pension_income: 30_000
        statutory_sick_pay: 6_000
    benunits:
      unit:
        members: [pensioner]
        pension_credit: 0
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    winter_fuel_payment: [200]
    winter_fuel_payment_charge: [200]
    income_tax_before_winter_fuel_payment_charge: [4_686]
    income_tax: [4_886]

- name: 2025 trade loss relief does not lower total income
  # Trade loss relief is deducted at Step 2 (ITA 2007 ss.23 and 64), after
  # total income is found at Step 1. Total income is £30,000 + £10,000 =
  # £40,000, so the £200 charge applies. Tax before the charge: net income
  # 40,000 - 8,000 = £32,000, (32,000 - 12,570) x 20% = £3,886; with the
  # charge, £4,086.
  period: 2025
  input:
    people:
      pensioner:
        age: 70
        employment_income: 30_000
        private_pension_income: 10_000
        trading_loss: 8_000
    benunits:
