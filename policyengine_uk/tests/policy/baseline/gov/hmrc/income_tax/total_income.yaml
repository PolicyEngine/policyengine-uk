# ITA 2007 s. 23 Step 1 sums all income charged to income tax. Other
# investment income (National Savings, securities and trust interest) is
# charged as savings income (taxable_savings_interest_income), so it counts.

- name: Other investment income only counts in total income
  period: 2025
  input:
    other_investment_income: 20_000
  output:
    total_income: 20_000
    taxable_savings_interest_income: 20_000
    adjusted_net_income: 20_000

- name: Other investment income adds to savings interest, not double counted
  period: 2025
  input:
    employment_income: 30_000
    savings_interest_income: 2_000
    other_investment_income: 3_000
  output:
    total_income: 35_000
    taxable_savings_interest_income: 5_000
    adjusted_net_income: 35_000

- name: Total income matches adjusted net income above the taper threshold
  # £90k employment plus £20k other investment income: ANI £110k, so the
  # personal allowance is reduced by (110,000 - 100,000) / 2 = £5,000.
  period: 2025
  input:
    employment_income: 90_000
    other_investment_income: 20_000
  output:
    total_income: 110_000
    adjusted_net_income: 110_000
    personal_allowance: 7_570

- name: "ITA s23 and ITEPA s681I count statutory_sick_pay once while legacy bases retain their values"
  description: "ITA 2007 s23 Step 1 and ITEPA 2003 s681I(1)(b): GBP34000 wages plus GBP2000 statutory pay exceeds GBP35000. Maintenance is not taxable. Post-tax and UBI bases intentionally preserve their historical definition."
  period: 2025
  absolute_error_margin: 0.02
  input:
    gov.contrib.ubi_center.basic_income.phase_out.individual.rate: 0.1
    gov.contrib.ubi_center.basic_income.phase_out.individual.threshold: 0
    gov.contrib.ubi_center.basic_income.phase_out.household.rate: 0.1
    gov.contrib.ubi_center.basic_income.phase_out.household.threshold: 0
    age: 70
    employment_income: 34000
    statutory_sick_pay: 2000
    employee_pension_contributions: 0
    personal_pension_contributions: 0
    employment_expenses: 0
    spousal_maintenance_income: 10000
    income_tax: 0
    national_insurance: 0
    pension_credit: 0
    winter_fuel_payment: 200
    bi_maximum: 10000
    basic_income: 0
  output:
    total_income: 36000
    total_income_charged_to_tax: 36000
    gross_taxable_inputs: 34000
    post_tax_income: 34000
    bi_individual_phaseout: 3400
    bi_household_phaseout: 3400
    winter_fuel_payment_charge: 200
    winter_fuel_payment_eligible: true

