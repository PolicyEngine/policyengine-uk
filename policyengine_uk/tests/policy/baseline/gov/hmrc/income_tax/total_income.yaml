- name: Deprecated WFP eligibility reform tests tax total including statutory_sick_pay
  description: The reform's GBP35000 proxy for ITEPA 2003 s681I reads ITA s23 total income; GBP34000 wages plus GBP2000 statutory pay exceeds it.
  period: 2025
  input:
    gov.dwp.winter_fuel_payment.eligibility.require_benefits: true
    gov.dwp.winter_fuel_payment.eligibility.taxable_income_test.use_maximum_taxable_income: true
    gov.dwp.winter_fuel_payment.eligibility.taxable_income_test.maximum_taxable_income: 35_000
    age: 70
    country: ENGLAND
    employment_income: 34_000
    statutory_sick_pay: 2_000
    social_security_income: 0
    employee_pension_contributions: 0
    personal_pension_contributions: 0
    is_on_winter_fuel_payment_relevant_benefit: false
  output:
    total_income: 36_000
    winter_fuel_payment_eligible: false

