# ITA 2007 s.414(2)(a)-(b): the net gift is not a taxable-income
# deduction; the grossed-up gift extends rate limits.
# https://www.legislation.gov.uk/ukpga/2007/3/section/414
# s.415: a net £800 gift is £1,000 gross at the 20% UK basic rate.
# https://www.legislation.gov.uk/ukpga/2007/3/section/415
# s.58 Step 2: deduct the gross gift from adjusted net income (ANI).
# https://www.legislation.gov.uk/ukpga/2007/3/section/58

- name: Gift Aid gives no income tax relief to a UK basic-rate earner
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [40, 40]
    region: [NORTH_WEST, NORTH_WEST]
    employment_income: [30_000, 30_000]
    gift_aid: [0, 800]
  output:
    gift_aid_grossed_up: [0, 1_000]
    adjusted_net_income: [30_000, 29_000]
    earned_taxable_income: [17_430, 17_430]
    # £17,430 at 20%, with no taxpayer relief on the Gift Aid gift.
    income_tax: [3_486, 3_486]
    uc_income_tax_on_earnings: [3_486, 3_486]
    # UC deducts the tax actually due on earnings, plus £1,394.40 NI.
    uc_individual_earned_income_before_mif: [25_119.60, 25_119.60]

- name: Gift Aid gives £200 relief to a UK higher-rate earner
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [40, 40]
    region: [NORTH_WEST, NORTH_WEST]
    employment_income: [60_000, 60_000]
    gift_aid: [0, 800]
  output:
    earned_taxable_income: [47_430, 47_430]
    # £1,000 moves from 40% to 20% under s.414(2)(b).
    income_tax: [11_432, 11_232]
    uc_income_tax_on_earnings: [11_432, 11_232]
    uc_individual_earned_income_before_mif: [45_357.40, 45_557.40]

- name: Gift Aid gives £250 relief to a UK additional-rate earner
