    income_tax: [53_703, 53_453]
    uc_income_tax_on_earnings: [53_703, 53_453]
    uc_individual_earned_income_before_mif: [91_286.40, 91_536.40]

- name: Gift Aid extends Scottish basic and higher limits
  period: 2026
  absolute_error_margin: 0.02
  input:
    age: [40, 40]
    region: [SCOTLAND, SCOTLAND]
    employment_income: [60_000, 60_000]
    gift_aid: [0, 800]
  output:
    # £1,000 moves from 21% to 20% and £1,000 from 42% to 21%.
    # The Scottish starter/basic boundary is not extended by s.414.
    income_tax: [13_182.05, 12_962.05]

- name: Gift Aid restores £500 of personal allowance at £101000 income
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [40, 40]
    region: [NORTH_WEST, NORTH_WEST]
    employment_income: [101_000, 101_000]
    gift_aid: [0, 800]
  output:
    adjusted_net_income: [101_000, 100_000]
    # ITA 2007 s.58 Step 2 reduces the taper base exactly once.
    personal_allowance: [12_070, 12_570]
    earned_taxable_income: [88_930, 88_430]
    income_tax: [28_032, 27_632]

- name: Gift Aid extends UK limits for dividends above the basic-rate limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [40, 40]
    region: [NORTH_WEST, NORTH_WEST]
    employment_income: [50_000, 50_000]
    dividend_income: [10_000, 10_000]
    gift_aid: [0, 800]
  output:
    earned_taxable_income: [37_430, 37_430]
    # The £500 dividend allowance still occupies the band. The extension
    # moves £770 of taxed dividends from 35.75% to 10.75%: £192.50 relief.
    dividend_income_tax: [3_396.25, 3_203.75]
    income_tax: [10_882.25, 10_689.75]

- name: Gift Aid extends UK limits across savings and dividend slices
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [40, 40]
    region: [NORTH_WEST, NORTH_WEST]
    employment_income: [49_070, 49_070]
    savings_interest_income: [2_000, 2_000]
    dividend_income: [5_000, 5_000]
    gift_aid: [0, 1_600]
  output:
    # £2,000 gross extension moves £800 taxed savings down 20 percentage
    # points and £700 taxed dividends down 25 percentage points.
    savings_allowance: [500, 500]
    savings_income_tax: [460, 300]
    dividend_income_tax: [1_608.75, 1_433.75]
    income_tax: [9_368.75, 9_033.75]

