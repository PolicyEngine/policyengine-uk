- name: A large Gift Aid gift can cross several Scottish bands
  period: 2026
  absolute_error_margin: 0.02
  input:
    age: 40
    region: SCOTLAND
    employment_income: 150_000
    gift_aid: 80_000
  output:
    adjusted_net_income: 50_000
    personal_allowance: 12_570
    # Taxable £137,430 is split at £3,967, £116,956 and £131,092.
    income_tax: 28_982.05

- name: Gift Aid can change the band used for the personal savings allowance
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [40, 40]
    region: [NORTH_WEST, NORTH_WEST]
    employment_income: [50_300, 50_300]
    savings_interest_income: [100, 100]
    gift_aid: [0, 800]
  output:
    # Tax band remains based on all taxable income as in the existing model,
    # with s.414(2)(b)'s extended UK basic-rate limit (ITA 2007 s.12B).
    tax_band: [HIGHER, BASIC]
    savings_allowance: [500, 1_000]
    savings_income_tax: [0, 0]

- name: Gift Aid reduces adjusted net income for the Child Benefit tax charge
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: [40, 40]
    region: [NORTH_WEST, NORTH_WEST]
    employment_income: [62_000, 62_000]
    gift_aid: [0, 800]
    child_benefit: [1_000, 1_000]
    is_higher_earner: [true, true]
  output:
    # ITA 2007 s.58 Step 2 applies beyond the personal allowance taper.
    adjusted_net_income: [62_000, 61_000]
    CB_HITC: [100, 50]

- name: Grossed-up Gift Aid can make adjusted net income negative
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    region: NORTH_WEST
    employment_income: 10_000
    gift_aid: 20_000
    # Capital Gains Tax can cover the tax attributed to a qualifying gift
    # even where the gift exceeds this year's income (ITA 2007 s.423).
    # https://www.legislation.gov.uk/ukpga/2007/3/section/423
    capital_gains: 50_000
  output:
    # ITA 2007 s.58 Step 2 subtracts the gross gift without a floor at nil.
    net_income: 10_000
    gift_aid_grossed_up: 25_000
    adjusted_net_income: -15_000
    personal_allowance: 12_570
    income_tax: 0

- name: Zero Gift Aid preserves the marriage-neutral income tax reform
  period: 2026
  absolute_error_margin: 0.01
  reforms:
    - policyengine_uk.reforms.cps.marriage_tax_reforms.marriage_neutral_it_reform
  input:
    people:
      earner:
        age: 40
        employment_income: 100_000
        gift_aid: 0
        personal_allowance: 12_570
        marriage_allowance: 0
      spouse:
        age: 40
        employment_income: 0
        gift_aid: 0
        personal_allowance: 12_570
        marriage_allowance: 0
    benunits:
      benunit:
        members: [earner, spouse]
        is_married: true
    households:
      household:
        members: [earner, spouse]
        region: NORTH_WEST
  output:
    # The reform pools £100,000 and splits the pre-Gift-Aid income equally.
    net_income: [50_000, 50_000]
    adjusted_net_income: [50_000, 50_000]
    earned_taxable_income: [37_430, 37_430]
    income_tax: [7_486, 7_486]
