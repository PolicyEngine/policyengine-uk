- name: Gift Aid extends Scottish limits where property occupies the higher band
  period: 2026
  absolute_error_margin: 0.02
  input:
    age: [40, 40]
    region: [SCOTLAND, SCOTLAND]
    employment_income: [40_000, 40_000]
    property_income: [20_000, 20_000]
    property_allowance_deduction: [0, 0]
    gift_aid: [0, 800]
  output:
    # Scottish basic-limit relief falls on employment; higher-limit relief
    # falls on property. Their total equals the Scottish earned-only case.
    earned_income_tax: [5_551.07, 5_541.07]
    property_income_tax: [7_630.98, 7_420.98]
    income_tax: [13_182.05, 12_962.05]

