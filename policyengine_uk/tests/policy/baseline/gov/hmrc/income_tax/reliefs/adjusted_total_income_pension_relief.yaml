# Ordinary loss-cap ATI (ITA 2007 s.24A(8)), preserving the model's own earnings base.
# FA 2004 ss.190(3),191(7): only relief at source can give the basic uplift above
# relevant earnings. Existing inputs treat gross personal contributions as RAS
# and reported employee contributions as net pay; no new scheme-input model.
# Primary 2026 control: wages2,000 + dividends250,000 - relievednetpay2,000
# => ATI250,000; cap62,500; ANI187,500. All rates/thresholds are unchanged
# model controls, not a new rate audit. Final dividend tax is:
# (37,700-500)*.1075 + (125,140-37,700)*.3575 + (187,500-125,140)*.3935
# =59,797.46. No eligibility, tax base, relief or final tax is supplied as input.

- name: Net pay within earnings preserves the final tax control
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      taxpayer:
        age: 45
        employment_income_before_lsr: 2000
        dividend_income: 250000
        trading_loss: 200000
        employee_pension_contributions_reported: 2000
        personal_pension_contributions: 0
        pension_contributions_via_salary_sacrifice: 0
        employer_pension_contributions: 0
    benunits:
      family:
        members:
        - taxpayer
    households:
      home:
        members:
        - taxpayer
        region: LONDON
  output: &id001
    income_tax: 59797.46
    employment_income: 2000
    pension_contributions_relief: 2000
    adjusted_total_income: 250000
    income_tax_relief_cap: 62500
    trade_loss_relief_against_general_income: 62500
    net_income: 189500
    adjusted_net_income: 187500
    personal_allowance: 0
    personal_pension_contributions_tax: 0
