# loss_relief holds trade losses brought forward from earlier years (ITA 2007
# s.83). A loss made in the year itself is trading_loss, relieved against
# general income instead (see trade_loss_relief_against_general_income.yaml).

- name: Losses brought forward come off the trade's profits
  period: 2024
  absolute_error_margin: 0
  input:
    self_employment_income: 10_000
    loss_relief: 4_000
    trading_allowance_deduction: 0
  output:
    taxable_self_employment_income: 6_000

- name: Losses brought forward never reduce other income
  period: 2024
  absolute_error_margin: 0
  input:
    self_employment_income: 1_000
    employment_income: 20_000
    loss_relief: 5_000
    trading_allowance_deduction: 0
  output:
    taxable_self_employment_income: 0
    taxable_employment_income: 20_000
    adjusted_net_income: 20_000

- name: Last year's trading loss is not brought forward automatically
  period: 2024
  absolute_error_margin: 0
  input:
    self_employment_income: 10_000
    trading_allowance_deduction: 0
    trading_loss:
      2023: 5_000
      2024: 0
  output:
    loss_relief: 0
    taxable_self_employment_income: 10_000
