    loss_relief:
      2024: 7_000
    self_employment_income:
      2024: 3_000
      2025: 3_000
      2026: 3_000
    trading_allowance_deduction:
      2024: 0
      2025: 0
      2026: 0
  output:
    loss_relief: 1_000
