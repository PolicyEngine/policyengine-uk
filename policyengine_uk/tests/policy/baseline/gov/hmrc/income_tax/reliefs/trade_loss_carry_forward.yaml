- name: A sixteen-year gap preserves nominal unrelieved loss
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    # Isolate trading losses from unrelated historical pension defaults.
    taxable_social_security_income:
      2010: 0
      2011: 0
      2012: 0
      2013: 0
      2014: 0
      2015: 0
      2016: 0
      2017: 0
      2018: 0
      2019: 0
      2020: 0
      2021: 0
      2022: 0
      2023: 0
      2024: 0
      2025: 0
      2026: 0
    employment_income: 0
    self_employment_income:
      2010: 0
      2026: 6_000
    trading_loss:
      2010: 5_000
    trading_allowance_deduction:
      2010: 0
      2026: 0
  output:
    loss_relief: 5_000
    trade_loss_relief_against_general_income: 0
    taxable_self_employment_income: 1_000

