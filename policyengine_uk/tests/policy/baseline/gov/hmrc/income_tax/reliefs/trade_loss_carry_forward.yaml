- name: A loss already relieved against pay is not a new loss next year
  period: 2026
  absolute_error_margin: 0.01
  input:
    employment_income:
      2025: 40_000
      2026: 40_000
    trading_loss:
      2025: 10_000
  output:
    trade_loss_relief_against_general_income: 0
    loss_relief: 0
    net_income: 40_000

- name: Only the loss not used against pay survives later trade profits
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    taxable_social_security_income: 0
    employment_income:
      2023: 2_000
      2024: 0
      2025: 0
      2026: 0
    self_employment_income:
      2023: 0
      2024: 3_000
      2025: 1_000
      2026: 4_000
    trading_loss:
      2023: 7_000
    trading_allowance_deduction:
      2023: 0
      2024: 0
      2025: 0
      2026: 0
  output:
    # 7,000 - 2,000 general relief - 3,000 profits - 1,000 profits.
    loss_relief: 1_000
    trade_loss_relief_against_general_income: 0
    taxable_self_employment_income: 3_000
    net_income: 3_000

- name: Cap-limited Income Tax loss and Class 4 loss have distinct balances
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    taxable_social_security_income: 0
    employment_income:
      2024: 150_000
      2025: 0
    self_employment_income:
      2024: 0
      2025: 40_000
    trading_loss:
      2024: 80_000
    trading_allowance_deduction:
      2024: 0
      2025: 0
  output:
    # The 50,000 s64 deduction against pay does not consume Class 4 stock.
    loss_relief: 30_000
    trade_loss_relief_against_general_income: 0
    taxable_self_employment_income: 10_000
    ni_class_4_losses_brought_forward: 80_000
    ni_class_4_profits: 0

