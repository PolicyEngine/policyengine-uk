# Addendum: final CTC under the inherited annual-rate model contract.
# SI2002/2007reg7@2024: child3455+family545 =4000 annual maximum.
# SI2002/2008reg8@2024: threshold19995, taper41%; SI2002/2006reg4(5): s713 deduction.
# Without PG: 4000-.41*(25000-19995)=1947.95; withPG1200:2439.95; delta492.
# This annual approximation does not certify HMRC's daily-rounding cash award.
# https://www.legislation.gov.uk/uksi/2002/2007/regulation/7/2024-04-06
# https://www.legislation.gov.uk/uksi/2002/2008/regulation/8/2024-04-06
# https://www.legislation.gov.uk/uksi/2002/2006/regulation/4
- name: Case 10, payroll giving increases a continuing claimant's positive annual-model Child Tax Credit.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        hours_worked: 624
        employment_income: 25_000
        payroll_giving: 1_200
        child_tax_credit_reported: 1
      person2:
        age: 8
        date_of_birth: 20160405
    benunits:
      family:
        members: [person1, person2]
        would_claim_uc: false
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
        region: LONDON
  output:
    weekly_hours: [12, 0]
    income_tax: [2_246, 0]
    ni_class_1_employee: [994.40, 0]
    tax_credits_current_year_income: 23_800
    CTC_maximum_rate: 4_000
    working_tax_credit: 0
    child_tax_credit: 2_439.95
    tax_credits: 2_439.95

# Addendum: the positive-net-pay AND current-loss helper rebuild branch.
# FA2004s193(2): 400000-100000PG-20000netpay=280000 statutory total income.
# ITA2007s24A(8): ATI280000+100000PG=380000; cap25%=95000; allowableloss95000.
# FA2004s228ZA: thresholdincome185000; adjustedincome185000+20000+170000-20000=355000.
# Threshold185000 does not exceed200000, so the annual allowance remains60000.
# https://www.legislation.gov.uk/ukpga/2007/3/section/24A
# https://www.legislation.gov.uk/ukpga/2004/12/section/193/2024-04-06
# https://www.legislation.gov.uk/ukpga/2004/12/section/228ZA/2024-04-06
# https://www.legislation.gov.uk/ukpga/2004/12/section/228/2024-04-06
- name: Case 11, payroll giving is added back when net pay and a trading loss rebuild the pension income tests.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 400_000
        payroll_giving: 100_000
        employee_pension_contributions_reported: 20_000
        employer_pension_contributions: 150_000
        defined_benefit_pension_share: 0
        trading_loss: 100_000
    benunits:
      family:
        members: [person1]
        would_claim_uc: false
    households:
      household:
        members: [person1]
        country: ENGLAND
        region: LONDON
  output:
    total_income_charged_to_tax: 280_000
    adjusted_total_income: 380_000
    income_tax_relief_cap: 95_000
    trade_loss_relief_against_general_income: 95_000
    adjusted_net_income: 185_000
    pension_annual_allowance_threshold_income: 185_000
    pension_annual_allowance_adjusted_income: 355_000
    pension_annual_allowance: 60_000
