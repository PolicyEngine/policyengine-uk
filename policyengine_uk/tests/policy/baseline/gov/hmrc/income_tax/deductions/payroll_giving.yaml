# Frozen independent legal oracles for employment-only, actual qualifying
# payroll donations withheld by a PAYE payer (UC reg 55(5)(c); ITEPA s713).
# Amounts use the inherited annual UK fiscal-year representation. They do not
# certify a monthly RTI/PAYE payroll schedule. Primary references:
# https://www.legislation.gov.uk/uksi/2013/376/regulation/55
# https://www.legislation.gov.uk/ukpga/2003/1/section/713
# https://www.legislation.gov.uk/ukpga/2007/3/section/24A
# https://www.gov.uk/payroll-giving
# https://www.gov.uk/government/publications/benefit-and-pension-rates-2024-to-2025/benefit-and-pension-rates-2024-to-2025

- name: Case 1, zero payroll giving retains taxed earnings and positive Universal Credit.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 20_000
        payroll_giving: 0
    benunits:
      family:
        members: [person1]
        would_claim_uc: true
    households:
      household:
        members: [person1]
        country: ENGLAND
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 6_000
  output:
    taxable_employment_income: 20_000
    income_tax: 1_486
    ni_class_1_employee: 594.40
    adjusted_net_income: 20_000
    adjusted_total_income: 20_000
    uc_individual_earned_income_before_mif: 17_919.60
    uc_earned_income: 17_919.60
    universal_credit_pre_benefit_cap: 865.62
    universal_credit: 865.62

