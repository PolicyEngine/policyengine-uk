- name: Case 3, each joint claimant keeps their own donation and tax deductions.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        payroll_giving: 0
      person2:
        age: 38
        employment_income: 10_000
        payroll_giving: 1_000
    benunits:
      family:
        members: [person1, person2]
        # Unmarried cohabitants make a joint UC claim without a spousal tax transfer.
        # ITA 2007 s55C(1)(a): https://www.legislation.gov.uk/ukpga/2007/3/section/55C/2024-04-06
        is_married: false
        would_claim_uc: true
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
        region: LONDON
        tenure_type: RENT_FROM_COUNCIL
        rent: 20_000
  output:
    taxable_employment_income: [40_000, 9_000]
    income_tax: [5_486, 0]
    ni_class_1_employee: [2_194.40, 0]
    adjusted_net_income: [40_000, 9_000]
    adjusted_total_income: [40_000, 10_000]
    uc_individual_earned_income_before_mif: [32_319.60, 9_000]
    uc_earned_income: 41_319.60
    universal_credit_pre_benefit_cap: 4_685.42
    universal_credit: 4_685.42

