        members: [person1]
      benunit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        country: SCOTLAND
      household2:
        members: [person2]
        country: ENGLAND
  output:
    # The allowance covers property: (43,000 - 11,000) x 20% = 6,400.
    income_tax: [6_400, 6_400]
    personal_allowance: [11_000, 11_000]
    earned_taxable_income: [0, 0]
    taxable_property_income_after_allowances: [32_000, 32_000]
    earned_income_tax: [0, 0]
    property_income_tax: [6_400, 6_400]

- name: Case 7, existing Scottish and English routing remains in 2017-18.
  # Pinned-main parameter/routing control, not a new 2017-18 legal audit.
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 43_500
        property_income: 1_500
      person2:
        age: 40
        employment_income: 43_500
        property_income: 1_500
    benunits:
      benunit1:
        members: [person1]
      benunit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        country: SCOTLAND
      household2:
        members: [person2]
        country: ENGLAND
  output:
    # Baseline PA 11,500 leaves pay 32,000 and property 1,500.
    # Scotland: pay 31,500 x 20% + 500 x 40% = 6,500; property 600.
    # England: pay 32,000 x 20% = 6,400; property 1,500 x 20% = 300.
    income_tax: [7_100, 6_700]
    personal_allowance: [11_500, 11_500]
    earned_taxable_income: [32_000, 32_000]
    taxable_property_income_after_allowances: [1_500, 1_500]
    earned_income_tax: [6_500, 6_400]
    property_income_tax: [600, 300]

