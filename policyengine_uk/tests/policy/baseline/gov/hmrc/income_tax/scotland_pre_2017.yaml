- name: Case 10, Scottish and English taxpayers minimise tax on pay and savings in 2016-17.
  # ITA 2007 s. 25(2) requires the allowance allocation giving the least tax.
  # FA 2016 s. 4 inserts ss. 12A and 12B from 2016-17: savings nil rate
  # and a 500 allowance where there is higher-rate but no additional-rate
  # income, using UK bands for Scottish taxpayers too (s. 12B(8)(b)(iv)).
  # https://www.legislation.gov.uk/ukpga/2007/3/section/25/2016-04-06
  # https://www.legislation.gov.uk/ukpga/2016/24/section/4/enacted
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 42_500
        savings_interest_income: 1_500
      person2:
        age: 40
        employment_income: 42_500
        savings_interest_income: 1_500
    benunits:
      benunit1:
        members: [person1]
      benunit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        country: SCOTLAND
      household2:
        members: [person2]
        country: ENGLAND
  output:
    # One minimum: PA 10,500 against pay and 500 against savings leaves
    # pay 32,000 (tax 6,400) and savings 1,000 (500 nil + 500 x 40% = 200).
    # Total 6,600. PA 10,000 against pay and 1,000 against savings also
    # gives 6,600, so the component split is not asserted.
    income_tax: [6_600, 6_600]
    personal_allowance: [11_000, 11_000]
    savings_allowance: [500, 500]
