# Annual labels follow the model's fiscal-year parameter convention:
# 2015 means 2015-16; 2016 means 2016-17.
# FA 2014 Sch. 38 para. 12 and SI 2015/2000 art. 3 start the Scottish rate
# provisions in 2016-17. ITA 2007 s. 11A (2016-04-06), subsections (1)-(3),
# follows the UK bands for non-savings, non-dividend income in that year.
# Parliament's 11 February 2016 resolution sets the Scottish component at 10%.
# HMRC's 2016-17 employer table confirms combined rates of 20%, 40% and 45%,
# a personal allowance of 11,000 and a basic rate limit of 32,000 for both
# Scotland and the rest of the UK.
# https://www.legislation.gov.uk/ukpga/2014/26/schedule/38/paragraph/12
# https://www.legislation.gov.uk/uksi/2015/2000/article/3/made
# https://www.legislation.gov.uk/ukpga/2007/3/section/11A/2016-04-06
# https://www.gov.uk/guidance/rates-and-thresholds-for-employers-2016-to-2017
# For 2015-16, FA 2015 s. 1 sets 20%/40%/45%; FA 2014 s. 2 as amended
# by FA 2015 s. 3 sets the personal allowance at 10,600 and the basic rate
# limit at 31,785. The 31,600 tested here lies below that statutory limit.
# https://www.legislation.gov.uk/ukpga/2015/11/section/1/enacted
# https://www.legislation.gov.uk/ukpga/2014/26/section/2
# https://www.legislation.gov.uk/ukpga/2015/11/section/3/enacted
# Each person is single, age 40, in their own benefit unit and household.
# No pension contributions, gifts, finance costs, savings or dividends.
# property_income supplies net property-business profit. Gross rental
# receipts remain unknown; the baseline gives no additional property
# allowance deduction for a profit above the allowance. These cases do not
# certify the history of the property allowance or expense/election rules.

- name: Case 1, Scottish and English pay uses UK bands in 2015-16.
  period: 2015
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 42_200
      person2:
        age: 40
        employment_income: 42_200
    benunits:
      benunit1:
        members: [person1]
      benunit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        country: SCOTLAND
      household2:
        members: [person2]
        country: ENGLAND
  output:
    # 42,200 - 10,600 = 31,600; 31,600 x 20% = 6,320.
    income_tax: [6_320, 6_320]
    personal_allowance: [10_600, 10_600]
    earned_taxable_income: [31_600, 31_600]
    earned_income_tax: [6_320, 6_320]

- name: Case 2, Scottish and English pay at the UK basic limit in 2016-17.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 43_000
      person2:
        age: 40
        employment_income: 43_000
    benunits:
      benunit1:
        members: [person1]
      benunit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        country: SCOTLAND
      household2:
        members: [person2]
        country: ENGLAND
  output:
    # 43,000 - 11,000 = 32,000; 32,000 x 20% = 6,400.
    income_tax: [6_400, 6_400]
    personal_allowance: [11_000, 11_000]
    earned_taxable_income: [32_000, 32_000]
    earned_income_tax: [6_400, 6_400]

