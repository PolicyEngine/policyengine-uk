    income_tax: [6_400.40, 6_400.40]
    earned_taxable_income: [32_001, 32_001]
    earned_income_tax: [6_400.40, 6_400.40]

- name: Case 4, Scottish and English pay plus property uses UK bands in 2015-16.
  period: 2015
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 30_000
        property_income: 12_200
      person2:
        age: 40
        employment_income: 30_000
        property_income: 12_200
    benunits:
      benunit1:
        members: [person1]
      benunit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        country: SCOTLAND
      household2:
        members: [person2]
        country: ENGLAND
  output:
    # Pay: (30,000 - 10,600) x 20% = 3,880.
    # Property: 12,200 x 20% = 2,440. Total: 31,600 x 20% = 6,320.
    income_tax: [6_320, 6_320]
    personal_allowance: [10_600, 10_600]
    earned_taxable_income: [19_400, 19_400]
    taxable_property_income_after_allowances: [12_200, 12_200]
    earned_income_tax: [3_880, 3_880]
    property_income_tax: [2_440, 2_440]

- name: Case 5, Scottish and English pay plus property uses UK bands in 2016-17.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
