        age: 40
        employment_income: 30_000
        property_income: 13_000
      person2:
        age: 40
        employment_income: 30_000
        property_income: 13_000
    benunits:
      benunit1:
        members: [person1]
      benunit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        country: SCOTLAND
      household2:
        members: [person2]
        country: ENGLAND
  output:
    # Pay: (30,000 - 11,000) x 20% = 3,800.
    # Property: 13,000 x 20% = 2,600. Total: 32,000 x 20% = 6,400.
    income_tax: [6_400, 6_400]
    personal_allowance: [11_000, 11_000]
    earned_taxable_income: [19_000, 19_000]
    taxable_property_income_after_allowances: [13_000, 13_000]
    earned_income_tax: [3_800, 3_800]
    property_income_tax: [2_600, 2_600]

