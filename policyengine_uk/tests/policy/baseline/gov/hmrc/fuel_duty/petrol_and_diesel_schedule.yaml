# Fuel duty on 1,000 litres in each model year. A model year runs from
# 6 April to 5 April, and the dated rates are day-weighted across it:
#   2025-26: 365 days at 52.95p.
#   2026-27: 365 days at 52.95p (Budget 2026 keeps the cut to 1 July 2027).
#   2027-28 (366 days): 86 at 52.95p (6 Apr to 30 Jun 2027), 275 at 60.59p
#            (1 Jul 2027 to 31 Mar 2028) and 5 at 63.21p.
#   2028-29: 360 at 63.21p and 5 at 65.13p.
#   2029-30: 360 at 65.13p and 5 at 67.07p.
#   2030-31: 360 at 67.07p and 5 at 68.61p.
# The 1 July 2027 rate is the OBR's forecast (EFO October 2026, paragraph
# 3.19); later rates are the RPI forecast in petrol_and_diesel.yaml, on the
# OBR's October 2026 RPI forecast.
- name: Fuel duty for 2025-26 is 52.95p a litre all year
  period: 2025
  absolute_error_margin: 0.01
  input:
    petrol_litres: 1_000
    diesel_litres: 0
  output:
    fuel_duty: 529.5
- name: Fuel duty for 2026-27 stays at 52.95p a litre all year
  period: 2026
  absolute_error_margin: 0.01
  input:
    petrol_litres: 1_000
    diesel_litres: 0
  output:
    fuel_duty: 529.5
- name: Fuel duty for 2027-28 carries the 1 July 2027 rise
  period: 2027
  absolute_error_margin: 0.01
  input:
    petrol_litres: 600
    diesel_litres: 400
  output:
    # 1000 * (0.5295 * 86 + 0.6059 * 275 + 0.6321 * 5) / 366
    fuel_duty: 588.3060109289619
- name: Fuel duty for 2028-29
  period: 2028
  absolute_error_margin: 0.01
  input:
    petrol_litres: 1_000
    diesel_litres: 0
  output:
    # 1000 * (0.6321 * 360 + 0.6513 * 5) / 365
    fuel_duty: 632.3630136986301
- name: Fuel duty for 2029-30
  period: 2029
  absolute_error_margin: 0.01
  input:
    petrol_litres: 1_000
    diesel_litres: 0
  output:
    # 1000 * (0.6513 * 360 + 0.6707 * 5) / 365
    fuel_duty: 651.5657534246575
- name: Fuel duty for 2030-31
  period: 2030
  absolute_error_margin: 0.01
  input:
    petrol_litres: 1_000
    diesel_litres: 0
  output:
    # 1000 * (0.6707 * 360 + 0.6861 * 5) / 365
    fuel_duty: 670.9109589041096
- name: Rural relief takes 5p a litre off the 2027-28 rate
  period: 2027
  absolute_error_margin: 0.01
  input:
    petrol_litres: 1_000
    diesel_litres: 0
    in_rural_fuel_duty_relief_area: true
  output:
    # 588.3060109289619 - 1000 * 0.05
    fuel_duty: 538.3060109289619
