# Gas quantities are kilograms. Budget 2026 keeps the 5p-equivalent cut to
# 1 July 2027 (paragraph 6.211; policy costings page 13), so FY2026 is all at
# the cut rates and FY2027 weights are 86/280 days.
# Rural relief only reduces the petrol/diesel component.
- name: No road fuel gas consumption
  period: 2026
  absolute_error_margin: 0.01
  input:
    lpg_kg: 0
    natural_gas_kg: 0
    petrol_litres: 0
    diesel_litres: 0
  output:
    fuel_duty: 0
- name: LPG and natural gas are charged per kilogram
  period: 2025
  absolute_error_margin: 0.01
  input:
    lpg_kg: 1000
    natural_gas_kg: 1000
    petrol_litres: 0
    diesel_litres: 0
  output:
    fuel_duty: 514.5
- name: Rural relief does not apply to road fuel gases
  period: 2025
  absolute_error_margin: 0.01
  input:
    lpg_kg: 1000
    natural_gas_kg: 1000
    petrol_litres: 1000
    diesel_litres: 0
    in_rural_fuel_duty_relief_area: true
  output:
    fuel_duty: 994
- name: Fiscal 2026 gas rates stay at the cut rates all year
  period: 2026
  absolute_error_margin: 0.01
  input:
    lpg_kg: 1000
    natural_gas_kg: 1000
    petrol_litres: 0
    diesel_litres: 0
  output:
    # 1000 * (0.2888 + 0.2257)
    fuel_duty: 514.5
- name: Fiscal 2027 gas rates return to the full rates on 1 July 2027
  period: 2027
  absolute_error_margin: 0.01
  input:
    lpg_kg: 1000
    natural_gas_kg: 1000
    petrol_litres: 0
    diesel_litres: 0
  output:
    # 1000 * (0.2888 * 86 + 0.3161 * 280) / 366
    # + 1000 * (0.2257 * 86 + 0.2470 * 280) / 366
    fuel_duty: 551.6803278688524
