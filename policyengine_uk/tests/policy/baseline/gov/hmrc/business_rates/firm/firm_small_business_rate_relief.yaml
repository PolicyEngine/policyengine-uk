# Small business rate relief taper with E rounded to three decimal places.
# Sch 4ZA para 4(1) LGFA 1988: chargeable amount = gross / E, where
# (SI 2023/1250 reg 3) E = 3,000 / (RV - 12,000) for RV over £12,000 and up to
# £15,000, "calculated to three decimal places only". Relief = gross - gross / E.
# 2026-27 small business multiplier 43.2p. Margin 0.01 for float32 storage.
- name: SBRR taper with E rounded, 2026-27
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_rateable_value: [14_999, 13_500, 12_001, 13_501, 14_900]
  output:
    # 14,999 x 0.432 = 6,479.568; E = 3,000 / 2,999 = 1.000333 -> 1.000;
    #   relief = 6,479.568 - 6,479.568 / 1 = 0 (a linear taper gave 2.16).
    # 13,500 x 0.432 = 5,832; E = 3,000 / 1,500 = 2.000;
    #   relief = 5,832 - 2,916 = 2,916.
    # 12,001 x 0.432 = 5,184.432; E = 3,000 / 1 = 3,000.000;
    #   relief = 5,184.432 - 1.728144 = 5,182.703856.
    # 13,501 x 0.432 = 5,832.432; E = 3,000 / 1,501 = 1.998668 -> 1.999;
    #   relief = 5,832.432 - 2,917.674837 = 2,914.757163
    #   (a linear taper gave 2,914.27).
    # 14,900 x 0.432 = 6,436.8; E = 3,000 / 2,900 = 1.034483 -> 1.034;
    #   relief = 6,436.8 - 6,225.145068 = 211.654932
    #   (a linear taper gave 214.56).
    firm_gross_business_rates: [6_479.568, 5_832, 5_184.432, 5_832.432, 6_436.8]
    firm_small_business_rate_relief: [0, 2_916, 5_182.703856, 2_914.757163, 211.654932]
    firm_business_rates: [6_479.568, 2_916, 1.728144, 2_917.674837, 6_225.145068]
