# Northern Ireland non-domestic rates: net annual value x (regional rate +
# district rate) (Rates (NI) Order 1977 Art 6). Belfast 2026-27: 0.3079 +
# 0.342388 = 0.650288.
- name: Without a district a Northern Ireland firm's rates stay at 0.
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_region: [NORTHERN_IRELAND]
    firm_rateable_value: [30_000]
  output:
    firm_business_rates: [0]

- name: Belfast 2026-27, above the small business bands.
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_region: [NORTHERN_IRELAND]
    firm_northern_ireland_district: [BELFAST]
    firm_rateable_value: [30_000]
  output:
    firm_business_rates_multiplier: [0.650288]
    firm_business_rates: [19_508.64]
    firm_only_tax: [19_508.64]

- name: A district outside Northern Ireland is ignored.
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_region: [WALES]
    firm_northern_ireland_district: [BELFAST]
    firm_rateable_value: [30_000]
  output:
    # The Welsh standard multiplier, 0.502.
    firm_business_rates: [15_060]

