- name: Small business rate relief band edges, Belfast 2026-27.
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_region: [NORTHERN_IRELAND, NORTHERN_IRELAND, NORTHERN_IRELAND, NORTHERN_IRELAND, NORTHERN_IRELAND, NORTHERN_IRELAND]
    firm_northern_ireland_district: [BELFAST, BELFAST, BELFAST, BELFAST, BELFAST, BELFAST]
    firm_rateable_value: [2_000, 2_001, 5_000, 5_001, 15_000, 15_001]
  output:
    # 50% up to 2,000; 25% up to 5,000; 20% up to 15,000; none above.
    firm_business_rates: [650.288, 975.92, 2_438.58, 2_601.67, 7_803.456, 9_754.97]

