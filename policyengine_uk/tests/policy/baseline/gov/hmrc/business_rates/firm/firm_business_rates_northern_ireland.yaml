- name: No small business rate relief above three properties or for industrial property.
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_region: [NORTHERN_IRELAND, NORTHERN_IRELAND, NORTHERN_IRELAND]
    firm_northern_ireland_district: [BELFAST, BELFAST, BELFAST]
    firm_rateable_value: [4_000, 4_000, 4_000]
    firm_n_properties: [3, 4, 1]
    firm_is_industrial_property: [false, false, true]
  output:
    # 4,000 x 0.650288 = 2,601.152; less 25% = 1,950.864.
    firm_business_rates: [1_950.864, 2_601.152, 2_601.152]

