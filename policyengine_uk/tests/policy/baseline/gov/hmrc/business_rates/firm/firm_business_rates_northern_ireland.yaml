- name: Unoccupied property pays half after three months empty, Belfast 2026-27.
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_region: [NORTHERN_IRELAND, NORTHERN_IRELAND, NORTHERN_IRELAND, NORTHERN_IRELAND, NORTHERN_IRELAND]
    firm_northern_ireland_district: [BELFAST, BELFAST, BELFAST, BELFAST, BELFAST]
    firm_rateable_value: [30_000, 30_000, 1_999, 2_000, 30_000]
    firm_property_occupied: [false, false, false, false, false]
    firm_months_empty: [3, 0, 3, 3, 3]
    firm_is_industrial_property: [false, false, false, false, true]
  output:
    # 19,508.64 x 50% = 9,754.32; empty from the start of the year, 9 of
    # 12 months: 7,315.74; below 2,000 is exempt; 2,000 x 0.650288 x 50% =
    # 650.288; industrial is exempt.
    firm_business_rates: [9_754.32, 7_315.74, 0, 650.288, 0]

