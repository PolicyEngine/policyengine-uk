# Small business threshold: RV below £51,000. High-value: RV £500,000 or more.
- name: 2023-24 multipliers, small 49.9p below £51,000 and standard 51.2p from it
  period: 2023
  absolute_error_margin: 0.0001
  input:
    firm_rateable_value: [50_999, 51_000, 500_000]
  output:
    firm_business_rates_multiplier: [0.499, 0.512, 0.512]

