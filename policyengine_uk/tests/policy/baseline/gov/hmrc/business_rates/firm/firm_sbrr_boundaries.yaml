# Small business rate relief boundaries (SI 2017/102 art 3): 100% at RV
# £12,000 or less, tapering linearly to 0% at £15,000. 2026-27 small business
# multiplier 43.2p (BRIL 5/2025 para 2). Margin 0.01 for float32 storage.
- name: SBRR at exactly £12,000, just above, at £13,500 and at £15,000
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_rateable_value: [12_000, 12_001, 13_500, 15_000]
  output:
    # 12,000 x 0.432 = 5,184; share = clip((15,000 - 12,000) / 3,000) = 1
    #   -> relief 5,184, rates 0.
    # 12,001 x 0.432 = 5,184.432; share = 2,999 / 3,000
    #   -> relief 5,184.432 x 2,999 / 3,000 = 5,182.704; rates 1.728.
    # 13,500 x 0.432 = 5,832; share = 1,500 / 3,000 = 0.5 -> relief 2,916.
    # 15,000 x 0.432 = 6,480; share = 0 -> relief 0, rates 6,480.
    firm_gross_business_rates: [5_184, 5_184.432, 5_832, 6_480]
    firm_small_business_rate_relief: [5_184, 5_182.704, 2_916, 0]
    firm_business_rates: [0, 1.728, 2_916, 6_480]
