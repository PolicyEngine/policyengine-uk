# Margins of 0.1 allow for float32 storage of six-figure amounts.
- name: 2026-27 small business rate relief, taper and multiplier switch
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_rateable_value: [10_000, 13_500, 14_000, 15_000, 50_999, 51_000, 500_000]
  output:
    # Gross = RV x multiplier (43.2p below £51,000, 48.0p to £499,999, 50.8p above).
    # 10,000 x 0.432 = 4,320, SBRR 100% -> 0.
    # 13,500 x 0.432 = 5,832, SBRR (15,000 - 13,500) / 3,000 = 50% -> 2,916.
    # 14,000 x 0.432 = 6,048, SBRR 1/3 -> 4,032.
    # 15,000 x 0.432 = 6,480, SBRR 0%.
    # 50,999 x 0.432 = 22,031.568.
    # 51,000 x 0.480 = 24,480.
    # 500,000 x 0.508 = 254,000.
    firm_gross_business_rates: [4_320, 5_832, 6_048, 6_480, 22_031.568, 24_480, 254_000]
    firm_small_business_rate_relief: [4_320, 2_916, 2_016, 0, 0, 0, 0]
    firm_business_rates: [0, 2_916, 4_032, 6_480, 22_031.568, 24_480, 254_000]

- name: 2026-27 RHL against non-RHL property
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_rateable_value: [100_000, 100_000, 13_500]
    firm_is_rhl_property: [false, true, true]
  output:
    # 100,000 x 0.480 = 48,000; 100,000 x 0.430 = 43,000.
    # 13,500 x 0.382 = 5,157, SBRR 50% (RHL thresholds still £12k/£15k) -> 2,578.5.
    firm_business_rates: [48_000, 43_000, 2_578.5]

- name: 2027-28 RHL small business rate relief thresholds of £18,000 and £21,000
  period: 2027
  absolute_error_margin: 0.1
  input:
    firm_rateable_value: [18_000, 19_500, 21_000, 19_500]
    firm_is_rhl_property: [true, true, true, false]
  output:
    # RHL: 18,000 x 0.395 = 7,110, 100% relief -> 0.
    # 19,500 x 0.395 = 7,702.5, relief (21,000 - 19,500) / 3,000 = 50% -> 3,851.25.
    # 21,000 x 0.395 = 8,295, relief 0%.
    # Non-RHL keeps £12k/£15k: 19,500 x 0.447 = 8,716.5, no relief.
    firm_business_rates: [0, 3_851.25, 8_295, 8_716.5]

