- name: 2025-26 RHL relief at 40%, cap of £110,000, after SBRR
  period: 2025
  absolute_error_margin: 0.1
  input:
    firm_rateable_value: [100_000, 1_000_000, 13_500, 100_000]
    firm_is_rhl_property: [true, true, true, false]
  output:
    # 100,000 x 0.555 = 55,500, RHL relief 40% = 22,200 -> 33,300.
    # 1,000,000 x 0.555 = 555,000, 40% = 222,000 capped at 110,000 -> 445,000.
    # 13,500 x 0.499 = 6,736.5, SBRR 50% = 3,368.25, RHL 40% of the remaining
    # 3,368.25 = 1,347.30 -> 2,020.95.
    # Non-RHL: 55,500.
    firm_retail_hospitality_leisure_rate_relief: [22_200, 110_000, 1_347.3, 0]
    firm_business_rates: [33_300, 445_000, 2_020.95, 55_500]

