- name: Empty property, 3 months exempt (6 for industrial), then full rates
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_rateable_value: [100_000, 100_000, 100_000, 100_000, 10_000]
    firm_property_occupied: [false, false, false, false, false]
    firm_is_industrial_property: [false, true, false, false, false]
    firm_months_empty: [0, 0, 3, 2, 0]
  output:
    # Gross 100,000 x 0.480 = 48,000.
    # 3 of 12 months exempt: 12,000 -> 36,000.
    # Industrial, 6 of 12 months exempt: 24,000 -> 24,000.
    # Already empty 3 months: no exemption left -> 48,000.
    # Already empty 2 months: 1 month left, 4,000 -> 44,000.
    # 10,000 x 0.432 = 4,320, no SBRR when empty, 3 months exempt 1,080 -> 3,240.
    firm_empty_property_rates_exemption: [12_000, 24_000, 0, 4_000, 1_080]
    firm_business_rates: [36_000, 24_000, 48_000, 44_000, 3_240]

