# Scotland non-domestic rates. Basic property rate 0.498 (2023-24 to 2025-26),
# 0.481 (2026-27). Supplements above £51,000 up to £100,000 / above £100,000:
# 0.013 / 0.026 (2023-24), 0.047 / 0.061 (2024-25), 0.056 / 0.07 (2025-26),
# 0.054 / 0.067 (2026-27). SBBS single entry: 100% at RV £12,000 or less,
# 100 - 75 x (1 - (15,000 - RV) / 3,000) % to £15,000,
# 25 x (20,000 - RV) / 5,000 % to £20,000. Margin 0.01 for float32 storage.
- name: Scotland poundage bands, 2026-27
  period: 2026
  absolute_error_margin: 0.1
  input:
    firm_region: [SCOTLAND, SCOTLAND, SCOTLAND, SCOTLAND, SCOTLAND]
    firm_rateable_value: [51_000, 51_001, 100_000, 100_001, 1_000_000]
  output:
    # 51,000 x 0.481 = 24,531 (basic property rate).
    # 51,001 x (0.481 + 0.054) = 51,001 x 0.535 = 27,285.535.
    # 100,000 x 0.535 = 53,500.
    # 100,001 x (0.481 + 0.067) = 100,001 x 0.548 = 54,800.548.
    # 1,000,000 x 0.548 = 548,000.
    firm_business_rates_multiplier: [0.481, 0.535, 0.535, 0.548, 0.548]
    firm_business_rates: [24_531, 27_285.535, 53_500, 54_800.548, 548_000]

- name: Scotland higher property rate, 2023-24
  period: 2023
  absolute_error_margin: 0.1
  input:
    firm_region: [SCOTLAND, SCOTLAND]
    firm_rateable_value: [80_000, 1_000_000]
  output:
    # 80,000 x (0.498 + 0.013) = 80,000 x 0.511 = 40,880.
    # 1,000,000 x (0.498 + 0.026) = 524,000.
    firm_business_rates: [40_880, 524_000]

- name: Scotland higher property rate, 2024-25
  period: 2024
  absolute_error_margin: 0.1
  input:
    firm_region: SCOTLAND
    firm_rateable_value: 1_000_000
  output:
    # 1,000,000 x (0.498 + 0.061) = 559,000.
    firm_business_rates: 559_000

- name: Scotland higher property rate, 2025-26
  period: 2025
  absolute_error_margin: 0.1
  input:
    firm_region: SCOTLAND
    firm_rateable_value: 1_000_000
  output:
    # 1,000,000 x (0.498 + 0.07) = 568,000.
