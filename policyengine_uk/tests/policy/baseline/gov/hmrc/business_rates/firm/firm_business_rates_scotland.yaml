- name: Scotland SBBS at its boundaries, 2026-27
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_region: [SCOTLAND, SCOTLAND, SCOTLAND, SCOTLAND, SCOTLAND, SCOTLAND, SCOTLAND, SCOTLAND]
    firm_rateable_value: [12_000, 12_001, 13_500, 15_000, 15_001, 17_500, 19_999, 20_000]
  output:
    # Gross = RV x 0.481.
    # 12,000 -> 5,772; 100% -> rates 0.
    # 12,001 -> 5,772.481; 100 - 75 x (1 - 2,999 / 3,000) = 99.975%
    #   -> relief 5,771.037880, rates 1.443120.
    # 13,500 -> 6,493.5; 100 - 75 x 0.5 = 62.5% -> relief 4,058.4375.
    # 15,000 -> 7,215; 25% -> relief 1,803.75.
    # 15,001 -> 7,215.481; 25 x 4,999 / 5,000 = 24.995%
    #   -> relief 1,803.509476.
    # 17,500 -> 8,417.5; 12.5% -> relief 1,052.1875.
    # 19,999 -> 9,619.519; 0.005% -> relief 0.480976.
    # 20,000 -> 9,620; 0%.
    firm_gross_business_rates: [5_772, 5_772.481, 6_493.5, 7_215, 7_215.481, 8_417.5, 9_619.519, 9_620]
    firm_business_rates_reliefs: [5_772, 5_771.037880, 4_058.4375, 1_803.75, 1_803.509476, 1_052.1875, 0.480976, 0]
    firm_business_rates: [0, 1.443120, 2_435.0625, 5_411.25, 5_411.971524, 7_365.3125, 9_619.038024, 9_620]

- name: Scotland SBBS needs one occupied property
  period: 2025
  absolute_error_margin: 0.01
  input:
    firm_region: [SCOTLAND, SCOTLAND, SCOTLAND]
    firm_rateable_value: [10_000, 10_000, 10_000]
    firm_n_properties: [1, 2, 1]
    firm_property_occupied: [true, true, false]
  output:
    # 10,000 x 0.498 = 4,980. One occupied property: 100% relief.
    # Two properties (multi-entry SBBS not modelled) or unoccupied: none.
    firm_business_rates_reliefs: [4_980, 0, 0]
    firm_business_rates: [0, 4_980, 4_980]
