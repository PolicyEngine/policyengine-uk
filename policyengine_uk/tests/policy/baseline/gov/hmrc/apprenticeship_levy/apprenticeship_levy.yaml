- name: Case 1, apprenticeship levy around the £3m break-even pay bill.
  period: 2025
  input:
    firm_paybill: [3_000_000, 2_000_000, 5_000_000, 5_000_000]
    firm_apprenticeship_levy_allowance_share: [1, 1, 1, 0.5]
  output:
    # 0.5% x 3m = 15,000 - 15,000 = 0; 10,000 - 15,000 floored at 0;
    # 25,000 - 15,000 = 10,000; 25,000 - 7,500 (half share) = 17,500.
    apprenticeship_levy: [0, 0, 10_000, 17_500]

- name: Case 2, no levy before 2017-18.
  period: 2016
  input:
    firm_paybill: [5_000_000]
  output:
    apprenticeship_levy: [0]

- name: Case 3, levy in its first year.
  period: 2017
  input:
    firm_paybill: [4_000_000]
  output:
    # 20,000 - 15,000.
    apprenticeship_levy: [5_000]
