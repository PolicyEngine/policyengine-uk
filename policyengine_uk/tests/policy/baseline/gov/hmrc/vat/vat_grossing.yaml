- name: VAT is grossed up by survey coverage times the household share of liabilities
  period: 2025
  absolute_error_margin: 0.01
  input:
    full_rate_vat_consumption: 10_000
    reduced_rate_vat_consumption: 1_000
  output:
    # (10,000 x 20% + 1,000 x 5%) / (0.67 x 0.7) = 2,050 / 0.469 = 4,371.00,
    # less private school fees' official share of 2025-26 VAT receipts
    # (0.008353), which private_school_vat counts separately.
    vat: 4_334.49
    baseline_vat: 4_334.49

- name: VAT in 2024 is grossed up by the same product as later years
  period: 2024
  absolute_error_margin: 0.01
  input:
    full_rate_vat_consumption: 10_000
    reduced_rate_vat_consumption: 1_000
  output:
    # The deprecated combined factor has one undated value, so 2024 takes the
    # two factors' product too: 2,050 / 0.469
    vat: 4_371.00
    baseline_vat: 4_371.00

- name: With both factors at one, VAT is the statutory liability on recorded consumption
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.simulation.vat.survey_consumption_coverage: 1
    gov.simulation.vat.household_share_of_receipts: 1
    full_rate_vat_consumption: 10_000
    reduced_rate_vat_consumption: 1_000
  output:
    # 2,050 x (1 - 0.008353)
    vat: 2_032.88

- name: The household share alone grosses survey-complete VAT up to receipts
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.simulation.vat.survey_consumption_coverage: 1
    full_rate_vat_consumption: 7_000
    reduced_rate_vat_consumption: 0
  output:
    # 7,000 x 20% / 0.7 x (1 - 0.008353)
    vat: 1_983.29

- name: A reform to the deprecated combined factor still takes effect
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.simulation.microdata_vat_coverage: 0.5
    full_rate_vat_consumption: 10_000
    reduced_rate_vat_consumption: 1_000
  output:
    # 2,050 / 0.5 x (1 - 0.008353)
    vat: 4_065.75
