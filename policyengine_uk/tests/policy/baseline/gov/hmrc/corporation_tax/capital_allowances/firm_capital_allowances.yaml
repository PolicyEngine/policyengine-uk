- name: Case 19, AIA goes to new special-rate plant before used main-rate plant without the special-rate FYA.
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_legal_form: [SOLE_TRADER, COMPANY]
    firm_capex_main_pool_used: [600_000, 600_000]
    firm_capex_special_rate_new: [600_000, 600_000]
  output:
    # Sole trader: AIA 600,000 on special new (else 6% WDA), then 400,000 on
    # main used; 200,000 main pooled, WDA 14% = 28,000. Total 1,028,000.
    # Company: AIA 600,000 on main used, then 400,000 on special new; 50% FYA
    # on 200,000 = 100,000. Total 1,100,000.
    firm_aia_special_rate_new: [600_000, 400_000]
    firm_aia_main_pool_used: [400_000, 600_000]
    firm_special_rate_first_year_allowance: [0, 100_000]
    firm_main_pool_writing_down_allowance: [28_000, 0]
    firm_capital_allowances: [1_028_000, 1_100_000]

