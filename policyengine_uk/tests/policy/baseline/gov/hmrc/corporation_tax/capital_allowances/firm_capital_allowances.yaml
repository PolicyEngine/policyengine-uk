    firm_capex_main_pool_used: [800_000]
  output:
    # Limit 0.5 x 1,000,000 = 500,000; 300,000 pooled; WDA 14% = 42,000.
    firm_annual_investment_allowance: [500_000]
    firm_capital_allowances: [542_000]

