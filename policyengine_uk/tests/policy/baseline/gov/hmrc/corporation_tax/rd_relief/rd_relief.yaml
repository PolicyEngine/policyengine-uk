    firm_is_sme: [true, true]
    firm_qualifying_rd_expenditure: [1_000_000, 1_000_000]
    firm_total_relevant_expenditure: [2_000_000, 2_000_000]
    firm_taxable_trading_profit: [-1_000_000, -1_000_000]
    firm_rdec_paye_nic_cap_supplied: [true, false]
    firm_relevant_paye_nic_liabilities: [200_000, 0]
  output:
    # Cap 20,000 + 3 x 200,000 = 620,000 > 333,500; without the flag no cap: both 333,500.
    firm_rd_payable_credit: [333_500, 333_500]

- name: Case 25, ERIS payable credit cap binds with PAYE and NIC in 2025.
  period: 2025
  absolute_error_margin: 0.01
  input:
