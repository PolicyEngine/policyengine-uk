    firm_rd_surrenderable_loss: [1_860_000, 1_860_000]
    # min(14.5% x 1,860,000 = 269,700, 20,000 + 3 x 50,000 = 170,000); min(269,700, 20,000).
    firm_rd_payable_credit: [170_000, 20_000]

