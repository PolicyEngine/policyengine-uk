  output:
    # Large-company RDEC 13% x 1,000,000 = 130,000; no tax. Notional tax at
    # the 19% main rate: 130,000 x 81% = 105,300.
    firm_rd_expenditure_credit: 130_000
    firm_rdec_excess_payable: 105_300

