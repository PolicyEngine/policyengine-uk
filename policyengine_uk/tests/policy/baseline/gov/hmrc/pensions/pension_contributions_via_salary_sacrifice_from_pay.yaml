- name: A sacrifice within pay is kept in full
  period: 2029
  input:
    employment_income_before_lsr: 40_000
    pension_contributions_via_salary_sacrifice: 5_000
  output:
    pension_contributions_via_salary_sacrifice_from_pay: 5_000

- name: A sacrifice above pay is limited to the pay
  period: 2029
  input:
    employment_income_before_lsr: 10_000
    pension_contributions_via_salary_sacrifice: 30_000
  output:
    pension_contributions_via_salary_sacrifice_from_pay: 10_000

- name: A person without pay sacrifices nothing
  period: 2029
  input:
    pension_contributions_via_salary_sacrifice: 27_000
  output:
    pension_contributions_via_salary_sacrifice_from_pay: 0

- name: Negative pay supports no sacrifice
  period: 2029
  input:
    employment_income_before_lsr: -1_000
    pension_contributions_via_salary_sacrifice: 27_000
  output:
    pension_contributions_via_salary_sacrifice_from_pay: 0

- name: The limit applies before the cap exists, 2028
  period: 2028
  input:
    pension_contributions_via_salary_sacrifice: 27_000
  output:
    pension_contributions_via_salary_sacrifice_from_pay: 0
    pension_contributions_via_salary_sacrifice_adjusted: 0
    salary_sacrifice_returned_to_income: 0
