# FA 2004 s.190(1) caps relief at relevant UK earnings: employment income
# plus trading income (s.189(2)). A self-employment loss is nil trading
# income; it does not reduce employment income and never makes relief
# negative.
# https://www.legislation.gov.uk/ukpga/2004/12/section/189
# https://www.legislation.gov.uk/ukpga/2004/12/section/190

- name: Self-employment loss larger than wages, no contributions
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 11_000
    self_employment_income: -20_000
  output:
    relevant_uk_earnings: 11_000
    # Previously min(11_000 - 20_000, 0) = -9_000, which cut allowances to
    # 3_570 and charged 0.2 * (11_000 - 3_570) = 1_486 of income tax.
    pension_contributions_relief: 0
    allowances: 12_570
    income_tax: 0

- name: Self-employment loss only, with contributions
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    self_employment_income: -5_000
    personal_pension_contributions: 3_000
  output:
    relevant_uk_earnings: 0
    # Previously min(-5_000, 3_000) = -5_000.
    pension_contributions_relief: 0
    allowances: 12_570

- name: Self-employment loss does not reduce the cap on wages
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 60_000
    self_employment_income: -30_000
    personal_pension_contributions: 40_000
  output:
    relevant_uk_earnings: 60_000
    # min(60_000, 40_000); previously min(30_000, 40_000) = 30_000.
    pension_contributions_relief: 40_000
    allowances: 12_570 + 40_000
    # 0.2 * (60_000 - 52_570) = 1_486; previously 0.2 * 17_430 = 3_486.
    income_tax: 1_486

- name: Self-employment loss with net pay contributions
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 20_000
    self_employment_income: -25_000
    employee_pension_contributions_reported: 2_000
  output:
    relevant_uk_earnings: 20_000
    # Previously min(-5_000, 2_000) = -5_000.
    pension_contributions_relief: 2_000
    # 0.2 * (20_000 - 12_570 - 2_000) = 1_086.
    income_tax: 1_086

