- name: Self-employment loss does not narrow the capital gains basic rate band
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 11_000
    self_employment_income: -20_000
    personal_pension_contributions: 1_000
    capital_gains: 50_000
  output:
    pension_contributions_relief: 1_000
    income_tax: 0
    # Gains above the 3_000 exempt amount: 47_000. Basic rate band
    # 37_700 + 1_000 contributions = 38_700, all unused.
    # 0.18 * 38_700 + 0.24 * (47_000 - 38_700) = 6_966 + 1_992 = 8_958.
    # Previously the -9_000 relief shrank the band to 28_700: 9_558.
    capital_gains_tax: 8_958
