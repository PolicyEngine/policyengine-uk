- name: Pension relief
  period: 2020
  absolute_error_margin: 0
  input:
    employment_income: 76000
    personal_pension_contributions: 40000
  output:
    pension_contributions_relief: 40000
- name: Pension relief is not capped at the (tapered) annual allowance
  period: 2020
  absolute_error_margin: 0.01
  input:
    employment_income: 2000000
    personal_pension_contributions: 400000
  output:
    # FA 2004 s. 190: relief up to relevant UK earnings, so all 400,000 is
    # relieved even though the tapered annual allowance is 4,000.
    pension_contributions_relief: 400000
    # The annual allowance charge recovers the relief on the excess:
    # (400,000 - 4,000) at 45% on top of reduced net income of 1,600,000.
    pension_annual_allowance_chargeable_amount: 396000
    personal_pension_contributions_tax: 396000 * 0.45
