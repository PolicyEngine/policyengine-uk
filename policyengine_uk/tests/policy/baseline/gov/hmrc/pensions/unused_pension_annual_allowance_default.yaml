# Unused annual allowance carried forward (FA 2004 s. 228A) where no history
# is supplied. From 2020-21 the default assumes the person's pension input in
# each of the five previous years was this year's (prior_year_input_ratio 1)
# deflated by average earnings growth, the incomes tested for the taper
# likewise, and that they were a scheme member in each year. Each year's
# excess uses the unused allowance of the three years before it, earliest
# first (s. 228A(7)), and the unused allowance of the three years before this
# one is carried forward.
#
# For 2026 the deflators are average earnings growth of 3.73% (2026), 4.12%
# (2025), 5.1% (2024), 6.22% (2023) and 6.14% (2022), from the OBR's October
# 2026 EFO and earlier outturn: 0.964041 for 2025, 0.925894 for 2024,
# 0.880965 for 2023, 0.829378 for 2022 and 0.781400 for 2021. The standard allowance is 40,000 to 2022-23 and 60,000 from 2023-24.
# Every case is a person aged 45 in London with employment income of 100,000.
# Sources: https://www.legislation.gov.uk/ukpga/2004/12/section/228A
# https://www.gov.uk/hmrc-internal-manuals/pensions-tax-manual/ptm055100

- name: Steady saving under the allowance carries forward three years of unused allowance
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 100_000
    employer_pension_contributions: 50_000
  output:
    # Inputs of 44,048.26 (2023), 46,294.72 (2024) and 48,202.06 (2025)
    # leave 15,951.74 + 13,705.28 + 11,797.94 of their 60,000 allowances.
    unused_pension_annual_allowance: 41_454.96
    pension_annual_allowance_chargeable_amount: 0

- name: An excess in a later year uses the earliest unused allowance first
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 100_000
    employer_pension_contributions: 63_000
  output:
    # 2023 input 55,500.81 leaves 4,499.19 unused and 2024 input 58,331.35
    # leaves 1,668.65. 2025 input 60,734.60 exceeds 60,000 by 734.60, which
    # uses 2023's unused allowance (2021 and 2022 have none). 3,764.59 +
    # 1,668.65 = 5,433.25, against 6,167.85 without that ordering.
    unused_pension_annual_allowance: 5_433.25
    # 63,000 - 60,000 is within the 5,433.25 carried forward.
    pension_annual_allowance_chargeable_amount: 0

- name: Saving above the allowance every year leaves nothing to carry forward
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 100_000
    employer_pension_contributions: 70_000
  output:
    # Deflated inputs of 54,698 to 67,483 exceed each year's allowance.
    unused_pension_annual_allowance: 0
    pension_annual_allowance_chargeable_amount: 10_000

- name: A supplied unused allowance overrides the default
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 100_000
    employer_pension_contributions: 70_000
    unused_pension_annual_allowance: 4_000
  output:
    pension_annual_allowance_chargeable_amount: 6_000

- name: No pension input this year means no carry-forward is assumed
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 100_000
  output:
    unused_pension_annual_allowance: 0

- name: A tapered allowance in every earlier year leaves nothing to carry forward
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 400_000
    employer_pension_contributions: 50_000
  output:
    # Adjusted income of 450,000 tapers the allowance to the 10,000 minimum
    # (60,000 - (450,000 - 260,000) / 2 is below it). Deflated, the earlier
    # years' incomes are tapered to their minimums too (4,000 in 2021-22 and
    # 2022-23), all below the deflated inputs.
    pension_annual_allowance: 10_000
    unused_pension_annual_allowance: 0
    pension_annual_allowance_chargeable_amount: 40_000

- name: Before 2020-21 the default is nil
  period: 2019
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 100_000
    employer_pension_contributions: 30_000
  output:
    unused_pension_annual_allowance: 0

- name: A taper that binds only in an earlier year cuts what that year leaves
  period: 2022
  absolute_error_margin: 0.01
  input:
    age: 45
    employment_income: 180_000
    employer_pension_contributions: 20_000
  output:
    # Adjusted income of 200,000 is under 2022-23's taper limit of 240,000.
    # Deflated by earnings growth of 6.14% (2022), 5.9% (2021) and 0.3%
    # (2020), the 2019-20 adjusted income is 177,400.16 and threshold income
    # 159,660.15, over that year's limits of 150,000 and 110,000, so its
    # allowance is 40,000 - floor((177,400.16 - 150,000) / 2) = 26,300, and
    # its input of 17,740.02 leaves 8,559.98. 2020-21 and 2021-22 are under
    # 240,000 and leave 22,206.76 and 21,156.96 of 40,000. Untapered, 2019-20
    # would leave 22,259.98, for 65,623.70 in all.
    pension_annual_allowance: 40_000
    unused_pension_annual_allowance: 51_923.71
