# Actual employer-paid annual SSP/SMP, occupational net-pay member contributions,
# and an already-awarded defined-benefit pension where specified.
# FA 2004 s. 189 and HMRC PTM044100: statutory employment pay is relevant earnings.

- name: SSP final ordinary tax
  period: 2026
  absolute_error_margin: 0.01
  input:
    region: LONDON
    age: 60
    employment_income: 20000
    statutory_sick_pay: 2000
    statutory_maternity_pay: 0
    self_employment_income: 0
    private_pension_income: 20000
    employee_pension_contributions_reported: 22000
    personal_pension_contributions: 0
  output:
    employment_benefits: 2000
    employee_pension_contributions: 22000
    pension_contributions_relief: 22000
    personal_pension_contributions_tax: 0
    income_tax: 1486.0

