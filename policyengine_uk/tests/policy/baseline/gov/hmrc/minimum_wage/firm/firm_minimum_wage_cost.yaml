# Adult rate (top band of gov.hmrc.minimum_wage.non_apprentice), read at
# 30 April: 2016-17 £7.20, 2026-27 £12.71.
# 2026-27: apprenticeship levy 0.5% less a £15,000 allowance; secondary
# threshold 96.153846 x 52 = 5,000 (to the penny); secondary rate 15%;
# auto-enrolment qualifying earnings band £6,240 to £50,270.

- name: Case 1, pay that meets the adult rate, or no low-paid hours, costs nothing.
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_paybill: [500_000, 100_000, 200_000, 200_000]
    firm_low_paid_hours: [10_000, 1_000, 0, 0]
    firm_low_paid_paybill: [130_000, 12_710, 50_000, 0]
  output:
    # 12.71 x 10,000 = 127,100 - 130,000 floored at 0;
    # 12.71 x 1,000 = 12,710, exactly the pay, so 0;
    # zero hours: 12.71 x 0 - 50,000 floored at 0, and 12.71 x 0 - 0 = 0.
    firm_minimum_wage_cost: [0, 0, 0, 0]
    # The paybill is unchanged.
    firm_paybill_after_minimum_wage: [500_000, 100_000, 200_000, 200_000]

- name: Case 2, an underpaid block is topped up to the adult rate.
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_paybill: [400_000]
    firm_low_paid_hours: [10_000]
    firm_low_paid_paybill: [100_000]
  output:
    # 12.71 x 10,000 = 127,100 - 100,000 = 27,100.
    firm_minimum_wage_cost: [27_100]
    # 400,000 + 27,100.
    firm_paybill_after_minimum_wage: [427_100]

- name: Case 3, 2016 uses the April 2016 national living wage, not the October 2015 rate.
  period: 2016
  absolute_error_margin: 0.01
  input:
    firm_paybill: [100_000]
    firm_low_paid_hours: [1_000]
    firm_low_paid_paybill: [6_000]
  output:
    # 7.20 x 1,000 = 7,200 - 6,000 = 1,200. On 1 January 2016 the rate was
    # 6.70, which would give 700.
    firm_minimum_wage_cost: [1_200]

- name: Case 4, the floor lifts the paybill over the levy allowance.
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_paybill: [2_990_000, 2_990_000]
    firm_low_paid_hours: [20_000, 0]
    firm_low_paid_paybill: [234_200, 0]
  output:
    # 12.71 x 20,000 = 254,200 - 234,200 = 20,000; the twin has no cost.
    firm_minimum_wage_cost: [20_000, 0]
    # 2,990,000 + 20,000; 2,990,000 + 0.
    firm_paybill_after_minimum_wage: [3_010_000, 2_990_000]
    # 0.5% x 3,010,000 = 15,050 - 15,000 = 50;
    # 0.5% x 2,990,000 = 14,950 - 15,000 floored at 0.
    apprenticeship_levy: [50, 0]

- name: Case 5, the floor raises the default NIC and auto-enrolment bases.
  period: 2026
  absolute_error_margin: 1
  input:
    firm_paybill: [300_000, 300_000]
    firm_employees: [10, 10]
    firm_low_paid_hours: [20_000, 0]
    firm_low_paid_paybill: [234_200, 0]
  output:
    # Cost 20,000 as in case 4, so the paybill is 320,000 against 300,000.
    firm_paybill_after_minimum_wage: [320_000, 300_000]
    # 320,000 - 10 x 5,000 = 270,000; 300,000 - 50,000 = 250,000.
    firm_class_1_earnings_above_secondary_threshold: [270_000, 250_000]
    # 15% of each.
    firm_employer_ni_before_allowance: [40_500, 37_500]
    # Average pay 32,000 - 6,240 = 25,760 x 10 = 257,600;
    # 30,000 - 6,240 = 23,760 x 10 = 237,600.
    firm_auto_enrolment_qualifying_earnings: [257_600, 237_600]

- name: Case 6, a supplied base above the threshold is unchanged by the floor.
  period: 2026
  absolute_error_margin: 1
  input:
    firm_paybill: [300_000]
    firm_employees: [10]
    firm_low_paid_hours: [20_000]
    firm_low_paid_paybill: [234_200]
    firm_class_1_earnings_above_secondary_threshold: [100_000]
  output:
    # 12.71 x 20,000 = 254,200 - 234,200 = 20,000.
    firm_minimum_wage_cost: [20_000]
    # The supplied 100,000 stands: 15% = 15,000.
    firm_employer_ni_before_allowance: [15_000]

- name: Case 7, with a pay split supplied the extra pay falls in the remaining group.
  period: 2026
  absolute_error_margin: 1
  input:
    firm_paybill: [300_000]
    firm_employees: [10]
    firm_low_paid_hours: [20_000]
    firm_low_paid_paybill: [234_200]
    # Two staff at or below the threshold, paid 6,000 in all.
    firm_employees_below_secondary_threshold: [2]
    firm_paybill_below_secondary_threshold: [6_000]
  output:
    # 12.71 x 20,000 = 254,200 - 234,200 = 20,000.
    firm_minimum_wage_cost: [20_000]
    # (320,000 - 6,000) - 8 x 5,000 = 274,000; 15% = 41,100.
    firm_class_1_earnings_above_secondary_threshold: [274_000]
    firm_employer_ni_before_allowance: [41_100]

- name: Case 8, no rate before October 2010 and negative inputs count as 0.
  period: 2010
  absolute_error_margin: 0.01
  input:
    firm_paybill: [3_100_000]
    firm_low_paid_hours: [10_000]
    firm_low_paid_paybill: [50_000]
  output:
    # The non-apprentice rates start on 1 October 2010; at 30 April 2010
    # the scale is empty, so the cost is 0 and the levy (0 before
    # 2017) is unaffected.
    firm_minimum_wage_cost: [0]
    apprenticeship_levy: [0]

- name: Case 9, a negative low-paid paybill counts as 0.
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_low_paid_hours: [1_000]
    firm_low_paid_paybill: [-5_000]
  output:
    # 12.71 x 1,000 = 12,710 - 0 = 12,710 (not 17,710).
    firm_minimum_wage_cost: [12_710]
