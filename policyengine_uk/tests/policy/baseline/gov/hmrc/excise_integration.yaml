    people:
      person1:
        car_first_registration_date: '2020-05-01'
        car_co2_emissions: 120
      person2:
        car_first_registration_date: '2000-01-01'
        car_engine_size: 1600
    benunits:
      benunit:
        members:
        - person1
        - person2
    households:
      household:
        members:
        - person1
        - person2
