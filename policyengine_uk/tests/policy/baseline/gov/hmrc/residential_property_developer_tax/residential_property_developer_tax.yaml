# Residential property developer tax (Finance Act 2022 Part 2): 4% above the
# 25,000,000 allowance, shared within a group.
- name: The allowance boundary and group share, 2025-26.
  period: 2025
  absolute_error_margin: 0.5
  input:
    firm_legal_form: [COMPANY, COMPANY, COMPANY, COMPANY, COMPANY, SOLE_TRADER]
    firm_rpd_profits: [25_000_000, 25_001_000, 100_000_000, 30_000_000, -5_000_000, 100_000_000]
    firm_rpdt_allowance_share: [1, 1, 1, 0.4, 1, 1]
  output:
    # 0; 4% x 1,000 = 40; 4% x 75,000,000; 4% x (30,000,000 - 10,000,000);
    # a loss pays 0; a sole trader is not a company.
    residential_property_developer_tax: [0, 40, 3_000_000, 800_000, 0, 0]

- name: Before April 2022 there is no RPDT.
  period: 2021
  absolute_error_margin: 0.5
  input:
    firm_rpd_profits: [100_000_000]
  output:
    residential_property_developer_tax: [0]

- name: 2022-23, the first year, and no change to corporation tax.
  period: 2022
  absolute_error_margin: 1
  input:
    firm_rpd_profits: [100_000_000]
    firm_taxable_trading_profit: [100_000_000]
  output:
    residential_property_developer_tax: [3_000_000]
    # 19% main rate in 2022-23; RPDT is not deductible.
    corporation_tax: [19_000_000]
    firm_tax: [22_000_000]
    firm_only_tax: [22_000_000]

- name: The allowance share is clipped to between 0 and 1.
  period: 2025
  absolute_error_margin: 0.5
  input:
    firm_rpd_profits: [100_000_000, 100_000_000]
    firm_rpdt_allowance_share: [-1, 3]
  output:
    # Share 0: 4% x 100m; share 1: 4% x 75m.
    residential_property_developer_tax: [4_000_000, 3_000_000]
