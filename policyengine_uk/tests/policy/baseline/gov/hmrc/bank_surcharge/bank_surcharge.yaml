# Each financial year reads the rate in force on 30 April, so the 6% rate
# from 1 January 2027 first applies in the 2027 label (2027-28).
- name: Case 1, bank surcharge in 2026-27.
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_legal_form: [COMPANY, COMPANY, COMPANY]
    firm_is_bank: [true, true, false]
    firm_taxable_trading_profit: [150_000_000, 80_000_000, 150_000_000]
    firm_capital_allowances: [0, 0, 0]
    firm_rd_additional_deduction: [0, 0, 0]
    firm_rd_expenditure_credit: [0, 0, 0]
  output:
    # 3% x (150m - 100m) = 1.5m; below the allowance and non-banks pay none.
    bank_surcharge: [1_500_000, 0, 0]
    corporation_tax: [37_500_000, 20_000_000, 37_500_000]

- name: Case 2, 6% temporary rate in 2027-28.
  period: 2027
  absolute_error_margin: 0.01
  input:
    firm_legal_form: COMPANY
    firm_is_bank: true
    firm_taxable_trading_profit: 150_000_000
    firm_capital_allowances: 0
    firm_rd_additional_deduction: 0
    firm_rd_expenditure_credit: 0
  output:
    # 6% x 50m = 3m.
    bank_surcharge: 3_000_000

- name: Case 3, back to 3% in 2028-29.
  period: 2028
  absolute_error_margin: 0.01
  input:
    firm_legal_form: COMPANY
    firm_is_bank: true
    firm_taxable_trading_profit: 150_000_000
    firm_capital_allowances: 0
    firm_rd_additional_deduction: 0
    firm_rd_expenditure_credit: 0
  output:
    bank_surcharge: 1_500_000

- name: Case 4, 8% above 25m in 2022-23.
  period: 2022
  absolute_error_margin: 0.01
  input:
    firm_legal_form: COMPANY
    firm_is_bank: true
    firm_taxable_trading_profit: 150_000_000
    firm_capital_allowances: 0
    firm_rd_additional_deduction: 0
    firm_rd_expenditure_credit: 0
  output:
    # 8% x (150m - 25m) = 10m.
    bank_surcharge: 10_000_000

- name: Case 5, partnerships pay no bank surcharge.
  period: 2026
  absolute_error_margin: 0.01
  input:
    firm_legal_form: PARTNERSHIP
    firm_is_bank: true
    firm_taxable_trading_profit: 150_000_000
    firm_capital_allowances: 0
    firm_rd_additional_deduction: 0
    firm_rd_expenditure_credit: 0
  output:
    bank_surcharge: 0
