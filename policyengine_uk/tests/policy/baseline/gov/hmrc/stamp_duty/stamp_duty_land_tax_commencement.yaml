# Purchases from issue #2801 in model years 2015 to 2018. Annual parameters
# sample 30 April, so model year 2015 reads the law on 30 April 2015, and so on.
# Commencement: Finance Act 2018 s. 41(8) (first-time buyers' relief, from 22
# November 2017); Finance Act 2016 s. 128(5) (higher rates for additional
# dwellings, from 1 April 2016); Finance Act 2016 s. 127(12) (non-residential
# rates and the 2% lease rent band, from 17 March 2016). Before those dates:
# Finance Act 2003 s. 55(1B) Table A and s. 55(2) Table B, and Sch 5 para 2(3)
# Table B, each as at 30 April 2015. HMRC charges SDLT on land in Wales until
# 1 April 2018 (s. 48(1)(a) as at 30 April 2017); from then the Welsh Revenue
# Authority charges Land Transaction Tax (WSI 2018/128).

- name: First-time buyer, £300,000, model year 2015, pays the main rates
  # 2% x 125,000 + 5% x 50,000 under s. 55(1B) Table A; Sch 6ZA starts on 22 November 2017 (FA 2018 s. 41(8)).
  period: 2015
  absolute_error_margin: 0.01
  input:
    main_residential_property_purchased: 300_000
    main_residential_property_purchased_is_first_home: true
  output:
    stamp_duty_land_tax: 5_000

- name: First-time buyer, £450,000, model year 2015, pays the main rates
  # 2,500 + 5% x 200,000 under s. 55(1B) Table A.
  period: 2015
  absolute_error_margin: 0.01
  input:
    main_residential_property_purchased: 450_000
    main_residential_property_purchased_is_first_home: true
  output:
    stamp_duty_land_tax: 12_500

