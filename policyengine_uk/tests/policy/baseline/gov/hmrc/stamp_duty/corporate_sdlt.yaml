# Corporate SDLT is shareholding x (residential + non-residential corporate
# SDLT revenue) (gov.hmrc.stamp_duty.statistics). For 2026-27 that revenue is
# HMRC's 2024-25 receipts from non-natural persons uprated with the OBR's
# receipts for each property type (2024-25 outturn from the March 2026 EFO,
# Table 3.7; 2026-27 from the October 2026 EFO, Table 4.7):
#   residential      £1,230m x 11.5985 / 10.380 = £1,374.39m
#   non-residential  £3,260m x  3.4393 /  3.505 = £3,198.88m
#   total                                       = £4,573.27m
# so a shareholding of 1e-6 gives £4,573.27 and 3e-6 gives £13,719.80. The
# model chains the OBR's year-on-year growth rates (six decimals) into an
# index rounded to five, so it lands within £0.10 of these; the margins are
# £0.50. business_rates is set to 0 so the totals isolate SDLT. A £500,000
# purchase that is not a first home pays £15,000 of SDLT (see
# expected_sdlt.yaml).
- name: Corporate SDLT enters household and government taxes once
  period: 2026
  absolute_error_margin: 0.5
  input:
    region: LONDON
    shareholding: 0.000001
    business_rates: 0
    council_tax: 0
    household_owns_tv: false
  output:
    corporate_sdlt: 4_573.27
    expected_sdlt: 0
    corporate_tax_incidence: 4_573.27
    household_tax: 4_573.27
    gov_tax: 4_573.27
    pre_budget_change_household_tax: 4_573.27
- name: Household and corporate SDLT each enter the totals once
  period: 2026
  absolute_error_margin: 0.5
  input:
    region: LONDON
    main_residential_property_purchased: 500_000
    main_residential_property_purchased_is_first_home: false
    shareholding: 0.000001
    business_rates: 0
    council_tax: 0
    household_owns_tv: false
  output:
    expected_sdlt: 15_000
    corporate_sdlt: 4_573.27
    household_tax: 19_573.27
    gov_tax: 19_573.27
    pre_budget_change_household_tax: 19_573.27
- name: Abolishing SDLT removes household and corporate SDLT from the totals
  period: 2026
  absolute_error_margin: 0.5
  input:
    gov.hmrc.stamp_duty.abolish: true
    region: LONDON
    main_residential_property_purchased: 500_000
    main_residential_property_purchased_is_first_home: false
    shareholding: 0.000001
    business_rates: 0
    council_tax: 0
    household_owns_tv: false
  output:
    stamp_duty_land_tax: 0
    expected_sdlt: 0
    corporate_sdlt: 0
    corporate_tax_incidence: 0
    household_tax: 0
    gov_tax: 0
    pre_budget_change_household_tax: 0
- name: Two households, baseline - each household's SDLT counted once
  period: 2026
  absolute_error_margin: 0.5
  input:
    people:
      buyer:
        age: 40
      shareholder:
        age: 60
    benunits:
      benunit_1:
        members: [buyer]
      benunit_2:
        members: [shareholder]
    households:
      household_1:
        members: [buyer]
        region: LONDON
        main_residential_property_purchased: 500_000
        main_residential_property_purchased_is_first_home: false
        shareholding: 0.000001
        business_rates: 0
        council_tax: 0
        household_owns_tv: false
      household_2:
        members: [shareholder]
        region: SCOTLAND
        shareholding: 0.000003
        business_rates: 0
        council_tax: 0
        household_owns_tv: false
  output:
    expected_sdlt: [15_000, 0]
    corporate_sdlt: [4_573.27, 13_719.80]
    household_tax: [19_573.27, 13_719.80]
    gov_tax: [19_573.27, 13_719.80]
- name: Two households, SDLT abolished - no SDLT left in either household's totals
  period: 2026
  absolute_error_margin: 0.5
  input:
    gov.hmrc.stamp_duty.abolish: true
    people:
      buyer:
        age: 40
      shareholder:
        age: 60
    benunits:
      benunit_1:
        members: [buyer]
      benunit_2:
        members: [shareholder]
    households:
      household_1:
        members: [buyer]
        region: LONDON
        main_residential_property_purchased: 500_000
        main_residential_property_purchased_is_first_home: false
        shareholding: 0.000001
        business_rates: 0
        council_tax: 0
        household_owns_tv: false
      household_2:
        members: [shareholder]
        region: SCOTLAND
        shareholding: 0.000003
        business_rates: 0
        council_tax: 0
        household_owns_tv: false
  output:
    expected_sdlt: [0, 0]
    corporate_sdlt: [0, 0]
    household_tax: [0, 0]
    gov_tax: [0, 0]
# Abolition removes SDLT and nothing else. Corporate SDLT reaches shareholders
# wherever they live; business rates, the other corporate tax allocated by
# shareholding, stays.
- name: A Welsh shareholder bears corporate SDLT and business rates, each once
  period: 2026
  absolute_error_margin: 0.5
  input:
    region: WALES
    shareholding: 0.000001
    business_rates: 500
    council_tax: 0
    household_owns_tv: false
  output:
    expected_sdlt: 0
    corporate_sdlt: 4_573.27
    corporate_tax_incidence: 5_073.27
    household_tax: 5_073.27
    gov_tax: 5_073.27
    pre_budget_change_household_tax: 5_073.27
- name: Abolishing SDLT removes the Welsh shareholder's corporate SDLT and keeps business rates
  period: 2026
  absolute_error_margin: 0.5
  input:
    gov.hmrc.stamp_duty.abolish: true
    region: WALES
    shareholding: 0.000001
    business_rates: 500
    council_tax: 0
    household_owns_tv: false
  output:
    expected_sdlt: 0
    corporate_sdlt: 0
    corporate_tax_incidence: 500
    household_tax: 500
    gov_tax: 500
    pre_budget_change_household_tax: 500
