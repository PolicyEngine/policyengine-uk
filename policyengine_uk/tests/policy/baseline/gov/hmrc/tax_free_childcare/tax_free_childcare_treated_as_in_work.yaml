# Reg12(2)(a)/(b) both require the prior-work and account qualifications in
# Reg12(3)/(4). These old signals alone do not establish the explicit status.
# Reg14 deems only the Act2 childcare connection, not Act9/Reg9 paid work.
# https://www.legislation.gov.uk/uksi/2015/448/regulation/12
# https://www.legislation.gov.uk/uksi/2015/448/regulation/14
- name: Reg12 consistency - adoption alone does not establish qualified status
  period: 2024
  input:
    age: 32
    tax_free_childcare_on_adoption_leave: true
    tax_free_childcare_qualifying_temporary_absence: false
  output:
    tax_free_childcare_treated_as_in_work: false
    tax_free_childcare_work_condition: false
    tax_free_childcare_meets_income_requirements: false
