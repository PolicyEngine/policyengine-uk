# SI 2015/448 reg 13(3): a partner paid a reg 13(1)(b) benefit is not in
# qualifying paid work for reg 13(1)(a), so the non-working spouse cannot rely
# on reg 13 when the working one also receives incapacity benefit.
- name: Couple both on incapacity benefit, one working - ineligible under reg 13(3)
  period: 2025
  input:
   people:
     person:
       in_work: true
       incapacity_benefit: 100
     spouse:
       in_work: false
       incapacity_benefit: 100
   benunits:
     benunit:
       members: [person, spouse]
  output:
   tax_free_childcare_work_condition: false

