# SI 2015/448 reg 13(1): a person whose partner is in qualifying paid work is
# regarded as in qualifying paid work while paid or entitled to incapacity
# benefit, severe disablement allowance, carer's allowance, contributory ESA,
# credits for incapacity or limited capability for work, or (from 1 December
# 2022) Scottish carer's assistance, or while on carer's leave (from 6 April
# 2024). Disability Living Allowance, Personal Independence Payment and
# income-related ESA are not on the list.

- name: Couple one working one on Carer's Allowance - eligible under reg 13(1)(b)(iv)
  period: 2025
  input:
    people:
      person:
        in_work: true
      spouse:
        in_work: false
        carers_allowance: 4000
    benunits:
      benunit:
        members: [person, spouse]
  output:
    tax_free_childcare_work_condition: true

