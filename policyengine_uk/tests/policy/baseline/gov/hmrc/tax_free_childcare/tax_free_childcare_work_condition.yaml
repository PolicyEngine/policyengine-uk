# Reg 13(1)(a): a lone parent has no partner in qualifying paid work.
- name: Lone parent on Carer's Allowance, not working - ineligible
  period: 2025
  input:
    people:
      parent:
        age: 30
        is_parent: true
        in_work: false
        carers_allowance: 4_000
      child:
        age: 3
    benunits:
      benunit:
        members: [parent, child]
  output:
    tax_free_childcare_work_condition: [false, false]

# Reg 13(3) excludes a working partner who receives a reg 13(1)(b) benefit, not
# one on carer's leave under reg 13(1)(c): the spouse on Carer's Allowance is
# still regarded as in qualifying paid work.
- name: Working partner on carer's leave does not stop the other partner qualifying under reg 13
  period: 2025
  input:
    people:
      person:
        in_work: true
        tax_free_childcare_on_carers_leave: true
      spouse:
        in_work: false
        carers_allowance: 4_000
    benunits:
      benunit:
        members: [person, spouse]
  output:
    tax_free_childcare_regarded_as_in_paid_work: [false, true]
    tax_free_childcare_work_condition: true

- name: A working lone parent with an 18-year-old and a toddler meets the work condition
  # Default inputs: the 18-year-old is the parent's child, not a partner who
  # would also have to work.
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 80_000
        in_work: true
        incapacity_benefit: 0
      student:
        age: 18
        incapacity_benefit: 0
      toddler:
        age: 3
        incapacity_benefit: 0
    benunits:
      benunit:
        members: [parent, student, toddler]
  output:
    tax_free_childcare_work_condition: [true, false, false]

# Reg 13(3) excludes a working partner who is "paid" a (1)(b) benefit or
# allowance. Maternity allowance overlaps the worker's Carer's Allowance to nil,
# so the worker is entitled to it but not paid it, and still counts as the
# partner in qualifying paid work for the spouse on Carer's Allowance.
- name: Working partner entitled to Carer's Allowance reduced to nil does not stop the other qualifying under reg 13
  period: 2025
  input:
    people:
      worker:
        in_work: true
        care_hours: 35
        maternity_allowance_reported: 5_000
      spouse:
        in_work: false
        carers_allowance: 4_000
    benunits:
      benunit:
        members: [worker, spouse]
    households:
      household:
        members: [worker, spouse]
        country: ENGLAND
  output:
    carers_allowance: [0, 4_000]
    tax_free_childcare_regarded_as_in_paid_work: [false, true]
    tax_free_childcare_work_condition: true

# Reg 13(1)(b)(iv): "paid or entitled to" carer's allowance. Entitlement reduced
# to nil by maternity allowance still regards the carer as in paid work.
- name: Carer entitled to Carer's Allowance reduced to nil is regarded as in paid work under reg 13
  period: 2025
  input:
    people:
      worker:
        in_work: true
      carer:
        in_work: false
        care_hours: 35
        maternity_allowance_reported: 5_000
    benunits:
      benunit:
        members: [worker, carer]
    households:
      household:
        members: [worker, carer]
        country: ENGLAND
  output:
    carers_allowance: [0, 0]
    tax_free_childcare_regarded_as_in_paid_work: [false, true]
    tax_free_childcare_work_condition: true
