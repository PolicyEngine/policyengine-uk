# The work condition applies to the person applying and their partner
# (Childcare Payments Act 2014 s.3(1), s.6, s.9; SI 2015/448 regs 3 and 9):
# the claimant or partner of the benefit unit, aged 16 or over. A child's own
# work does not count, and a benefit unit with no one aged 18 or over is not a
# couple.

- name: A working 17-year-old child does not meet a lone parent's work condition
  period: 2025
  input:
    people:
      parent:
        age: 40
        is_parent: true
        in_work: false
        incapacity_benefit: 0
      teenager:
        age: 17
        in_work: true
        incapacity_benefit: 0
    benunits:
      benunit:
        members: [parent, teenager]
  output:
    tax_free_childcare_work_condition: [false, false]

- name: A non-working 17-year-old lone parent is a single applicant, not a couple
  period: 2025
  input:
    people:
      parent:
        age: 17
        in_work: false
        incapacity_benefit: 0
      baby:
        age: 0
        in_work: false
        incapacity_benefit: 0
    benunits:
      benunit:
        members: [parent, baby]
  output:
    tax_free_childcare_work_condition: [false, false]

- name: A working 17-year-old lone parent meets the work condition
  period: 2025
  input:
    people:
      parent:
        age: 17
        is_parent: true
        in_work: true
        incapacity_benefit: 0
      baby:
        age: 0
        in_work: false
        incapacity_benefit: 0
    benunits:
      benunit:
        members: [parent, baby]
  output:
    tax_free_childcare_work_condition: [true, false]

- name: A couple where only one works is not rescued by an 18-year-old dependant
  period: 2025
  input:
    people:
      parent_1:
        age: 40
        is_parent: true
        in_work: true
        incapacity_benefit: 0
      parent_2:
        age: 40
        is_parent: true
        in_work: false
        incapacity_benefit: 0
      student:
        age: 18
        current_education: UPPER_SECONDARY
        in_work: true
        incapacity_benefit: 0
    benunits:
      benunit:
        members: [parent_1, parent_2, student]
  output:
    tax_free_childcare_work_condition: [false, false, false]

- name: A working lone parent with an 18-year-old and a toddler meets the work condition
  # Default inputs: the 18-year-old is the parent's child, not a partner who
  # would also have to work.
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 80_000
        in_work: true
        incapacity_benefit: 0
      student:
        age: 18
        incapacity_benefit: 0
      toddler:
        age: 3
        incapacity_benefit: 0
    benunits:
      benunit:
        members: [parent, student, toddler]
  output:
    tax_free_childcare_work_condition: [true, false, false]
