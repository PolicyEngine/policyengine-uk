# SI 2015/448 reg 13(2)(b): a person regarded as in paid work under reg 13 has
# expected income equal to the minimum weekly income, so meets the minimum
# income requirement with no earnings. With a £10 minimum wage the threshold is
# 10 x 16 x 13 = £2,080 a declaration period; the earner's £20,000 a year is
# £5,000 a period.
- name: A non-working partner on Carer's Allowance whose partner works meets the income requirement
  period: 2025
  input:
    people:
      earner:
        age: 40
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      carer:
        age: 38
        carers_allowance: 4_000
        adjusted_net_income: 4_000
        minimum_wage: 10
    benunits:
      benunit:
        members: [earner, carer]
  output:
    tax_free_childcare_regarded_as_in_paid_work: [false, true]
    tax_free_childcare_meets_income_requirements: [true, true]

- name: A lone Carer's Allowance recipient with no earnings does not meet the income requirement
  period: 2025
  input:
    people:
      carer:
        age: 38
        carers_allowance: 4_000
        adjusted_net_income: 4_000
        minimum_wage: 10
    benunits:
      benunit:
        members: [carer]
  output:
    tax_free_childcare_regarded_as_in_paid_work: false
    tax_free_childcare_meets_income_requirements: false

# Reg 13 deems work and minimum income only; reg 15's £100,000 adjusted net
# income limit still applies.
- name: A Carer's Allowance recipient over the adjusted net income limit does not meet the income requirement
  period: 2025
  input:
    people:
      earner:
        age: 40
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      carer:
        age: 38
        carers_allowance: 4_000
        adjusted_net_income: 150_000
        minimum_wage: 10
    benunits:
      benunit:
        members: [earner, carer]
  output:
    tax_free_childcare_regarded_as_in_paid_work: [false, true]
    tax_free_childcare_meets_income_requirements: [true, false]

# 2023-24 thresholds use the 1 April 2023 rates (S.I. 2023/354): 16 hours x 13
# weeks at £10.42 (23 or over) is £2,167.36, and at £10.18 (21 or 22) is
# £2,117.44. The April 2022 rates gave £1,976 and £1,909.44.
- name: 2023-24 expected income between the 2022-23 and 2023-24 thresholds, age 30 - ineligible
  period: 2023
  input:
    age: 30
    tax_free_childcare_expected_declaration_period_income: 2_100
  output:
    tax_free_childcare_meets_income_requirements: false

- name: 2023-24 expected income above the 2023-24 threshold, age 30 - eligible
  period: 2023
  input:
    age: 30
    tax_free_childcare_expected_declaration_period_income: 2_200
  output:
    tax_free_childcare_meets_income_requirements: true

- name: 2023-24 expected income between the 2022-23 and 2023-24 thresholds, age 22 - ineligible
  period: 2023
  input:
    age: 22
    tax_free_childcare_expected_declaration_period_income: 2_000
  output:
    tax_free_childcare_meets_income_requirements: false
