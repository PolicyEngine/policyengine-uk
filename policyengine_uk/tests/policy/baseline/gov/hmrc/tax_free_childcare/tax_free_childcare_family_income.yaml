# Applicant and partner income conditions: Childcare Payments Act2014ss3/10;
# SI2015/448regs3/15. Each person is tested against ANI<=GBP100000.
# All parents work for the whole year; no is_parent flag is needed to identify
# an ordinary applicant/couple. The flagged high-income case is a control.
# GBP8000 is the gross qualifying provider bill, giving GBP1600 at20%,
# with all four eligible declaration periods and the default full routing.
# HMRC TFC35300: https://www.gov.uk/hmrc-internal-manuals/tax-free-childcare-technical-manual/tfc35300
# The mixed-home case has two separate ordinary benefit units, not an extra
# adult forced into somebody else's claimant family. No reported UC is forced.
- name: Unflagged applicant over the income limit gets no top-up
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      applicant:
        age: 40
        employment_income: 120000
      child:
        age: 3
        childcare_expenses: 8000
        tax_free_childcare_uses_qualifying_provider: true
    benunits:
      family:
        members: &id001
        - applicant
        - child
    households:
      home:
        members: *id001
        region: LONDON
        tenure_type: OWNED_OUTRIGHT
  output:
    tax_free_childcare_without_universal_credit: &id002
    - 0
    - 0
    tax_free_childcare: *id002
    tax_free_childcare_eligible_without_universal_credit: false
    tax_free_childcare_eligible: false
    is_claimant_or_partner:
    - true
    - false
    adjusted_net_income:
    - 120000
    - 0
    tax_free_childcare_meets_income_requirements:
    - false
    - false
    is_parent:
    - false
    - false
