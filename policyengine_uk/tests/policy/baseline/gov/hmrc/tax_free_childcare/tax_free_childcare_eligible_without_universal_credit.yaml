# Tests for tax_free_childcare_eligible_without_universal_credit
- name: A Universal Credit award ends eligibility, but not eligibility without a claim
  period: 2027
  input:
    tax_free_childcare_qualifying_child: true
    tax_free_childcare_meets_income_requirements: true
    tax_free_childcare_work_condition: true
    universal_credit_pre_benefit_cap: 1_993
  output:
    tax_free_childcare_eligible: false
    tax_free_childcare_eligible_without_universal_credit: true

- name: A tax credit award in force still disqualifies without a Universal Credit claim
  period: 2024
  input:
    tax_free_childcare_qualifying_child: true
    tax_free_childcare_meets_income_requirements: true
    tax_free_childcare_work_condition: true
    child_tax_credit_reported: 1_000
    legacy_benefits_closed: false
  output:
    tax_free_childcare_eligible_without_universal_credit: false

- name: A tax credit award DWP has closed does not disqualify
  period: 2027
  input:
    tax_free_childcare_qualifying_child: true
    tax_free_childcare_meets_income_requirements: true
    tax_free_childcare_work_condition: true
    working_tax_credit_reported: 1_000
    legacy_benefits_closed: true
  output:
    tax_free_childcare_eligible_without_universal_credit: true

- name: The other conditions still apply without a Universal Credit claim
  period: 2027
  input:
    tax_free_childcare_qualifying_child: true
    tax_free_childcare_meets_income_requirements: true
    tax_free_childcare_work_condition: false
  output:
    tax_free_childcare_eligible_without_universal_credit: false

- name: A family that would not claim Tax-Free Childcare is not eligible without a Universal Credit claim
  period: 2027
  input:
    tax_free_childcare_qualifying_child: true
    tax_free_childcare_meets_income_requirements: true
    tax_free_childcare_work_condition: true
    would_claim_tfc: false
  output:
    tax_free_childcare_eligible_without_universal_credit: false
