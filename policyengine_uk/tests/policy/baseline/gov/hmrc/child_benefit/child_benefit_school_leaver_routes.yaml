        is_parent: true
        is_claimant_or_partner: true
      seventeen:
        age: 17
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
      eighteen:
        age: 18
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, seventeen, eighteen]
  output:
    is_qualifying_young_person_for_child_benefit: [false, false, false]
    child_benefit_entitlement: 0

