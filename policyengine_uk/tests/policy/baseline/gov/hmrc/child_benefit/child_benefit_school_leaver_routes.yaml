      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      school_leaver:
        age: 16
        current_education: NOT_IN_EDUCATION
        is_before_child_benefit_terminal_date: true
        weekly_hours: 40
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, school_leaver]
  output:
    # Reg. 4 also applies at 16, and has no remunerative work bar.
    is_child_benefit_payable_for_person: [false, true]
    child_benefit_entitlement: 1_406.60

- name: Case 13, a working school leaver before the terminal date does not take the eldest-child rate from a younger child.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      school_leaver:
        age: 18
        current_education: NOT_IN_EDUCATION
        is_before_child_benefit_terminal_date: true
        weekly_hours: 30
        is_claimant_or_partner: false
      child:
        age: 10
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, school_leaver, child]
  output:
    child_benefit_child_index: [-1, -1, 1]
    # One child at the eldest rate: 27.05 * 52.
    child_benefit_entitlement: 1_406.60

