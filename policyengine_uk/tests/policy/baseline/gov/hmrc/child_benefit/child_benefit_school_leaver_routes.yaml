      benunit:
        members: [parent, school_leaver]
  output:
    is_qualifying_young_person_for_child_benefit: [false, false]
    child_benefit_entitlement: 0
    is_child_or_young_person_for_legacy_benefits: [false, false]
    is_lone_parent: false

- name: Case 5, a 17-year-old and an 18-year-old who have left education are not qualifying young persons by default.
