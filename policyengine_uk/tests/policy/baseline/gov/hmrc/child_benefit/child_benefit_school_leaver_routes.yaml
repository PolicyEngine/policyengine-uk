    is_before_first_september_following_16th_birthday: [false, true]
    receives_income_support_in_own_right: [false, false]
    is_qualifying_young_person_for_child_benefit: [false, true]
    # 27.05 x 52.
    child_benefit: 1_406.60
    # PIP 76.70 x 52 = 3,988.40; Carer's Allowance 86.45 x 52 = 4,495.40;
    # Child Benefit 1,406.60; Household Energy Payment 100; less TV licence
    # 180: 9,810.40.
    household_net_income: 9_810.40

- name: Case 26, a 16-year-old school leaver whose lone parent claims Income Support for the family, and who has none of their own, stays a qualifying young person.
  period: 2018
  absolute_error_margin: 0.01
