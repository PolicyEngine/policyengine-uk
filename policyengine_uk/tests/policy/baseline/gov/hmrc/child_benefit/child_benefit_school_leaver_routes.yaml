    receives_income_support_in_own_right: [true, false, false]
    is_qualifying_young_person_for_child_benefit: [false, false, true]
    is_child_or_young_person_for_legacy_benefits: [false, true, true]
    # A lone parent of a child under 5 with no income: the personal
    # allowance, 73.10 x 52 = 3,801.20.
    income_support: 3_801.20
    # (20.70 + 13.70) x 52 = 1,788.80.
    child_benefit: 1_788.80
    # 3,801.20 + 1,788.80, less TV licence 150.50: 5,439.50.
    household_net_income: 5_439.50

