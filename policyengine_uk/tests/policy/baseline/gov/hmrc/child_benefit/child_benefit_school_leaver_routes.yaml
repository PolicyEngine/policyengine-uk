# Cases 19 to 26: Income Support in the young person's own right (reg.
# 8(2)(a)). receives_income_support_in_own_right reads the person's own
# reported Income Support while DWP pays Income Support
# (gov.dwp.income_support.active) and no reform neutralises income_support.
# A year's period reads that parameter's value on 30 April, so it is true
# for 2025-26 and false from 2026-27 (DWP made the last payments on 31 March
# 2026).
#
# 2018-19 rates: Child Benefit £20.70 a week for the eldest child and £13.70
# for each other child; PIP daily living standard rate £57.30; Carer's
# Allowance £64.60; Income Support personal allowance for a lone parent aged
# 18 or over £73.10; colour TV licence £150.50. The 2018 cases set the
# cost-of-living payment, which DWP first paid in 2022, to zero. In Cases 19
# to 22, 24 and 25 a parent aged 40 on PIP daily living lives with a young
# person who has left education and cares for them 35 hours a week. No
# family claims tax credits or Universal Credit, so Child Benefit is the only
# award the young person's status changes.

- name: Case 19, a 16-year-old school leaver who receives Income Support in their own right is not a qualifying young person (reg. 4, reg. 8(2)(a)).
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
        pip_dl_category: STANDARD
      carer:
        age: 16
        date_of_birth: 20020115
        current_education: NOT_IN_EDUCATION
        care_hours: 35
        income_support_reported: 3_000
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, carer]
        would_claim_uc: false
    households:
      household:
        members: [parent, carer]
        cost_of_living_support_payment: 0
  output:
    # Born 15 January 2002: the reg. 4 period runs to 31 August 2018.
    is_before_first_september_following_16th_birthday: [false, true]
    is_on_income_support: [false, true]
    receives_income_support_in_own_right: [false, true]
    is_qualifying_young_person_for_child_benefit: [false, false]
    is_child_or_young_person_for_legacy_benefits: [false, false]
    child_benefit: 0
    # PIP 57.30 x 52 = 2,979.60; Carer's Allowance 64.60 x 52 = 3,359.20;
    # less TV licence 150.50: 6,188.30. The model calculates Income Support
    # only for the claimant's family, so the 16-year-old's own 3,000 is in no
    # income here.
    household_net_income: 6_188.30

- name: Case 20, the same family without the 16-year-old's Income Support gets Child Benefit for them.
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
        pip_dl_category: STANDARD
      carer:
        age: 16
        date_of_birth: 20020115
        current_education: NOT_IN_EDUCATION
        care_hours: 35
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, carer]
        would_claim_uc: false
    households:
      household:
        members: [parent, carer]
        cost_of_living_support_payment: 0
  output:
    receives_income_support_in_own_right: [false, false]
    is_qualifying_young_person_for_child_benefit: [false, true]
    # 20.70 x 52.
    child_benefit: 1_076.40
    # Case 19's 6,188.30 + 1,076.40 = 7,264.70.
    household_net_income: 7_264.70

- name: Case 21, a 17-year-old in an extension period who receives Income Support in their own right is not a qualifying young person (reg. 5, reg. 8(2)(a)).
