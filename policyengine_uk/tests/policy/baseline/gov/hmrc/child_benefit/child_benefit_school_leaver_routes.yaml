# The Child Benefit qualifying young person conditions for a young person who
# has left education: Child Benefit (General) Regulations 2006 reg. 4 (until
# the 31 August after the 16th birthday), reg. 5 (the 20-week extension
# period for a 16- or 17-year-old), reg. 7 (until the terminal date) and
# reg. 7(3) (no Child Benefit by virtue of reg. 7 in a week of remunerative
# work). Reg. 2(2): a qualifying young person until the last applicable
# condition ceases to be met. Reg. 8: not while receiving a benefit in their
# own right.
#
# Child Benefit in 2026-27: £27.05 a week for the eldest child and £17.90 for
# each other child (gov/hmrc/child_benefit/amount). Housing Benefit and the
# other legacy schemes take their young person from the same definition
# (SSCBA 1992 s.142; HB Regs 2006 reg. 19).

- name: Case 1, a 16-year-old who has left education is a qualifying young person for the year (reg. 4).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      school_leaver:
        age: 16
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, school_leaver]
  output:
    is_qualifying_young_person_for_child_benefit: [false, true]
    is_child_or_qualifying_young_person_for_child_benefit: [false, true]
    is_child_benefit_payable_for_person: [false, true]
    # 27.05 * 52.
    child_benefit_entitlement: 1_406.60
    # The legacy schemes' young person follows Child Benefit.
    is_child_or_young_person_for_legacy_benefits: [false, true]
    is_lone_parent: true

- name: Case 2, a 16-year-old apprentice is a qualifying young person under reg. 4, which has no education condition.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      apprentice:
        age: 16
        current_education: POST_SECONDARY
        is_apprentice: true
        weekly_hours: 30
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, apprentice]
  output:
    is_qualifying_young_person_for_child_benefit: [false, true]
    # Reg. 7(3) bars only Child Benefit payable through reg. 7.
    is_child_benefit_payable_for_person: [false, true]
    child_benefit_entitlement: 1_406.60

- name: Case 3, born 15 September 2009, the 31 August after the 16th birthday is in 2026-27 (reg. 4).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      school_leaver:
        age: 17
        date_of_birth: 20090915
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, school_leaver]
  output:
    is_qualifying_young_person_for_child_benefit: [false, true]
    child_benefit_entitlement: 1_406.60

- name: Case 4, born 31 August 2009, reg. 4 ended on 1 September 2025, before the year.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
