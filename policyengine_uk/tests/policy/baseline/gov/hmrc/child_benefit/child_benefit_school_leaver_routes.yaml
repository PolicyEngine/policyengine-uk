    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
        income_support_reported: 3_000
      child:
        age: 4
        is_claimant_or_partner: false
      school_leaver:
        age: 16
        date_of_birth: 20020115
        current_education: NOT_IN_EDUCATION
        is_claimant_or_partner: false
    benunits:
      benunit:
        members: [parent, child, school_leaver]
        would_claim_uc: false
        # The family takes up no free childcare, so the 4-year-old's
