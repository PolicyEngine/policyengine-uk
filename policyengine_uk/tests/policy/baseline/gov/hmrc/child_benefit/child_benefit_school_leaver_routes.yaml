  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_parent: true
        is_claimant_or_partner: true
      at_school:
        age: 16
        current_education: UPPER_SECONDARY
        is_claimant_or_partner: false
      school_leaver:
        age: 16
