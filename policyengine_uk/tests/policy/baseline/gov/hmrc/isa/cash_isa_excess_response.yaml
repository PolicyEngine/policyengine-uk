# The opt-in response to cash above the cash ISA limit
# (gov.contrib.behavioral_responses.cash_isa_excess): GBP 8,000 above the
# GBP 12,000 limit at the default 3.36% rate earns GBP 268.80 a year.

- name: By default cash above the limit changes no tax
  period: 2027
  input:
    age: 40
    cash_isa_subscriptions: 20_000
  output:
    cash_isa_subscriptions_above_limit: 8_000
    cash_isa_excess_to_stocks_and_shares_isa: 0
    cash_isa_excess_to_taxable_savings: 0
    cash_isa_excess_savings_interest: 0
    taxable_savings_interest_income: 0

- name: Excess held in taxable savings earns taxable interest
  period: 2027
  absolute_error_margin: 0.01
  input:
    gov.contrib.behavioral_responses.cash_isa_excess.taxable_savings_share: 1
    age: 40
    cash_isa_subscriptions: 20_000
    savings_interest_income: 100
  output:
    cash_isa_excess_to_taxable_savings: 8_000
    cash_isa_excess_savings_interest: 268.80
    taxable_savings_interest_income: 368.80

- name: The excess splits between stocks and shares ISAs, taxable savings and other uses
  period: 2027
  absolute_error_margin: 0.01
  input:
    gov.contrib.behavioral_responses.cash_isa_excess.stocks_and_shares_isa_share: 0.5
    gov.contrib.behavioral_responses.cash_isa_excess.taxable_savings_share: 0.3
    age: 40
    cash_isa_subscriptions: 20_000
  output:
    cash_isa_excess_to_stocks_and_shares_isa: 4_000
    cash_isa_excess_to_taxable_savings: 2_400
    cash_isa_excess_savings_interest: 80.64

- name: Cash the annual limit leaves no room for in stocks and shares ISAs goes to taxable savings
  period: 2027
  absolute_error_margin: 0.01
  input:
    gov.hmrc.isa.annual_subscription_limit: 16_000
    gov.contrib.behavioral_responses.cash_isa_excess.stocks_and_shares_isa_share: 1
    age: 40
    # GBP 3,000 above the cash limit; GBP 12,000 cash and GBP 3,000 stocks
    # and shares leave GBP 1,000 of the annual limit.
    cash_isa_subscriptions: 15_000
    stocks_and_shares_isa_subscriptions: 3_000
  output:
    cash_isa_excess_to_stocks_and_shares_isa: 1_000
    cash_isa_excess_to_taxable_savings: 2_000
    cash_isa_excess_savings_interest: 67.20

- name: Nothing moves where no cash limit binds
  period: 2027
  input:
    gov.contrib.behavioral_responses.cash_isa_excess.taxable_savings_share: 1
    age: [40, 70]
    cash_isa_subscriptions: [12_000, 20_000]
  output:
    cash_isa_excess_to_taxable_savings: [0, 0]
    cash_isa_excess_savings_interest: [0, 0]

- name: Nothing moves in fiscal 2026-27, before the cash limit
  period: 2026
  input:
    gov.contrib.behavioral_responses.cash_isa_excess.taxable_savings_share: 1
    age: 40
    cash_isa_subscriptions: 20_000
  output:
    cash_isa_excess_savings_interest: 0
