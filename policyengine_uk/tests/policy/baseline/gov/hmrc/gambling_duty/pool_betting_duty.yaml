- name: Case 1, dutiable non-racing pool receipts use fifteen percent.
  period: 2024
  input:
    pool_betting_net_receipts: 1_000
  output:
    pool_betting_duty: 150 # FA 2014 section 144.
    general_betting_duty: 0

- name: Case 2, general and pool betting bases remain distinct.
  period: 2027
  input:
    pool_betting_net_receipts: 1_000
    horse_and_dog_pool_betting_net_losses: 2_000
  output:
    general_betting_duty: 300
    pool_betting_duty: 150
    gambling_duty: 450
