- name: Case 1, UK horseracing remote fixed odds use the general rate.
  period: 2024
  input:
    remote_uk_horseracing_betting_net_losses: 1_000
  output:
    general_betting_duty: 150 # FA 2014 section 127: 1,000 * 15%.

- name: Case 2, other remote fixed odds use the general rate before April 2027.
  period: 2024
  input:
    remote_other_betting_net_losses: 1_000
  output:
    general_betting_duty: 150

- name: Case 3, licensed-premises self-service terminals use the land-based rate.
  period: 2027
  input:
    land_based_fixed_odds_betting_net_losses: 1_000
  output:
    general_betting_duty: 150 # Excluded from FA 2014 section 127A remote bets.

- name: Case 4, pools wholly related to horse or dog racing enter general betting duty.
  period: 2027
  input:
    horse_and_dog_pool_betting_net_losses: 1_000
  output:
    general_betting_duty: 150
    pool_betting_duty: 0

- name: Case 5, financial spread betting has a separate three percent base.
  period: 2024
  input:
    financial_spread_betting_net_losses: 1_000
  output:
    general_betting_duty: 30 # FA 2014 section 128.

- name: Case 6, other spread betting has a separate ten percent base.
  period: 2024
  input:
    other_spread_betting_net_losses: 1_000
  output:
    general_betting_duty: 100 # FA 2014 section 129.

- name: Case 7, betting exchanges pay duty on commission.
  period: 2024
  input:
    betting_exchange_commission: 1_000
  output:
    general_betting_duty: 150 # FA 2014 section 140, commission rather than stakes.

- name: Case 8, remote fixed odds change during FY2026 with exclusions retained.
  period: 2026
  input:
    remote_other_betting_net_losses: 36_500
    remote_uk_horseracing_betting_net_losses: 36_500
    land_based_fixed_odds_betting_net_losses: 36_500
    horse_and_dog_pool_betting_net_losses: 36_500
  output:
    # FA 2026 section 87: 360 days at 15%, five at 25%; three excluded bases at 15%.
    general_betting_duty: 21_950 # 5,525 + 3 * 5,475.

- name: Case 9, remote fixed odds use twenty-five percent throughout FY2027.
  period: 2027
  input:
    remote_other_betting_net_losses: 36_500
    remote_uk_horseracing_betting_net_losses: 36_500
    land_based_fixed_odds_betting_net_losses: 36_500
    horse_and_dog_pool_betting_net_losses: 36_500
  output:
    general_betting_duty: 25_550 # 9,125 + 3 * 5,475.
