        members: [adult, child]
  output:
    private_school_vat: 2_000

- name: Restoring the exemption removes the charge
  period: 2025
  input:
    gov.hmrc.vat.private_school_fees_exempt: true
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
      child:
        age: 10
        attends_private_school: true
    households:
      household:
        members: [adult, child]
  output:
    private_school_vat: 0

- name: The fees follow a change in the standard rate
  period: 2025
  input:
    gov.hmrc.vat.standard_rate: 0.22
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
      child:
        age: 10
        attends_private_school: true
    households:
      household:
        members: [adult, child]
  output:
    private_school_vat: 2_200

- name: No change from baseline at current law
  period: 2026
  input:
    people:
      adult:
        age: 40
      child:
        age: 10
        attends_private_school: true
    households:
      household:
        members: [adult, child]
  output:
