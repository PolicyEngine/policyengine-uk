# VAT on private school fees. VATA 1994 Sch 9 Group 6 exempted education by
# an eligible body, which included registered independent schools. Finance Act
# 2025 s.47 inserts Sch 9 Part 3, which removes private school education,
# vocational training and closely related board and lodging from the
# exemption, for supplies on or after 1 January 2025 (s.49), so the fees bear
# VAT at the standard rate. The tests fix the mean fee and the share of fees
# that bears VAT so the expected values are exact.

- name: No pupils, no VAT
  period: 2025
  input:
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 25
    households:
      household:
        members: [adult]
  output:
    private_school_vat: 0

- name: Fees were exempt in 2024
  period: 2024
  input:
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
      child:
        age: 10
        attends_private_school: true
    households:
      household:
        members: [adult, child]
  output:
    private_school_vat: 0

- name: Standard rate on one pupil's fees from 2025
  period: 2025
  input:
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
      child:
        age: 10
        attends_private_school: true
    households:
      household:
        members: [adult, child]
  output:
    # 10,000 x 1 x 20%
    private_school_vat: 2_000

- name: Two pupils, three quarters of fees bearing VAT
  period: 2026
  input:
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 0.75
    people:
      adult:
        age: 40
      child1:
        age: 10
        attends_private_school: true
      child2:
        age: 12
        attends_private_school: true
    households:
      household:
        members: [adult, child1, child2]
  output:
    # 2 x 10,000 x 0.75 x 20%
    private_school_vat: 3_000

- name: Only pupils count
  period: 2025
  input:
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
      child1:
        age: 10
        attends_private_school: true
      child2:
        age: 7
        attends_private_school: false
    households:
      household:
        members: [adult, child1, child2]
  output:
    private_school_vat: 2_000

- name: The reform rate at the standard rate does not charge the fees twice
  period: 2025
  input:
    gov.contrib.labour.private_school_vat: 0.2
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
      child:
        age: 10
        attends_private_school: true
    households:
      household:
        members: [adult, child]
  output:
    # max(20%, 20%), not 20% + 20%
    private_school_vat: 2_000

- name: A reform rate below the standard rate leaves the statutory charge
  period: 2025
  input:
    gov.contrib.labour.private_school_vat: 0.1
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
      child:
        age: 10
        attends_private_school: true
    households:
      household:
        members: [adult, child]
  output:
    private_school_vat: 2_000

- name: A reform rate above the standard rate replaces it
  period: 2025
  input:
    gov.contrib.labour.private_school_vat: 0.25
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
      child:
        age: 10
        attends_private_school: true
    households:
      household:
        members: [adult, child]
  output:
    # max(20%, 25%) = 25%
    private_school_vat: 2_500

- name: The reform rate applies while the fees are exempt
  period: 2024
  input:
    gov.contrib.labour.private_school_vat: 0.2
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
      child:
        age: 10
