- name: Household taxes include the change, government taxes the level
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.simulation.private_school_vat.private_school_fees: 10_000
    gov.simulation.private_school_vat.private_school_vat_basis: 1
    people:
      adult:
        age: 40
        capital_gains_tax: 0
        employer_ni_response_capital_incidence: 0
        employer_ni_response_consumer_incidence: 0
        income_tax: 0
        national_insurance: 0
        ni_employer: 0
        student_loan_repayments: 0
      child:
        age: 10
        attends_private_school: true
        capital_gains_tax: 0
        employer_ni_response_capital_incidence: 0
        employer_ni_response_consumer_incidence: 0
        income_tax: 0
        national_insurance: 0
        ni_employer: 0
        student_loan_repayments: 0
    households:
      household:
        members: [adult, child]
        # Every other head of the two totals is zero.
        LVT: 0
        alcohol_duty: 0
        business_rates: 0
        carbon_tax: 0
        consumer_incident_tax_revenue_change: 0
        corporate_incident_tax_revenue_change: 0
        corporate_sdlt: 0
        council_tax: 0
        domestic_rates: 0
        expected_lbtt: 0
        expected_ltt: 0
        expected_sdlt: 0
        fuel_duty: 0
        high_value_council_tax_surcharge: 0
        non_primary_residence_wealth_tax: 0
        tobacco_duty: 0
        tv_licence: 0
        vat: 0
        vat_change: 0
        vehicle_excise_duty: 0
        wealth_tax: 0
  output:
    # The baseline applies baseline policy to this simulation's fee and share, so changing those assumptions is not a tax change.
    private_school_vat: 2_000
    baseline_private_school_vat: 2_000
    private_school_vat_change: 0
    gov_tax: 2_000
    household_tax: 0

