# marginal_tax_rate_on_capital_gains adds £1,000 of gains, or 0.1% of the gains
# where that is larger, and divides the rise in household net income by the rise
# in gains as stored. Gains and net income are float32, whose spacing doubles
# with each power of two (issue #1979). Above £1m a reading is good to a few
# float32 roundings of the household's income, each at most 6e-5 of the step,
# hence the 3e-4 margin; the old fixed £1,000 step was 8e-3 off at £185m.
#
# One adult on £200k of earnings, so every marginal pound of gains is charged at
# the 24% main rate above the basic rate band.

- name: Main rate at £185m of gains, which the £1,000 step read as 24.8%.
  period: 2026
  absolute_error_margin: 0.0003
  input:
    employment_income: 200_000
    capital_gains: 185_000_000
  output:
    marginal_tax_rate_on_capital_gains: 0.24

- name: Main rate at £561m of gains, which the £1,000 step read as 23.2%.
