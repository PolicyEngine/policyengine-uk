- name: Below £1m, half the £1,000 step falls within the annual exempt amount.
  # Gains rise from 2,500 to 3,500 against a 3,000 AEA: 500 x 0.24 / 1,000.
  period: 2026
  absolute_error_margin: 0.00001
  input:
    employment_income: 200_000
    capital_gains: 2_500
  output:
    marginal_tax_rate_on_capital_gains: 0.12

- name: Below £1m, a basic rate taxpayer's gains inside the basic rate band.
  # Taxable income 30,000 - 12,570 = 17,430 leaves 20,270 of the 37,700 band.
  period: 2026
  absolute_error_margin: 0.00001
  input:
    employment_income: 30_000
    capital_gains: 10_000
  output:
    marginal_tax_rate_on_capital_gains: 0.18

- name: Below £1m, half the £1,000 step falls within the basic rate band.
  # 22,770 - 3,000 AEA = 19,770 leaves 500 of the 20,270 band: 500 at 18% and
  # 500 at 24%.
  period: 2026
  absolute_error_margin: 0.00001
  input:
    employment_income: 30_000
    capital_gains: 22_770
  output:
    marginal_tax_rate_on_capital_gains: 0.21

- name: Above £1m the reading averages the rates over the larger step, here across the relief's lifetime limit.
  # 999,800 of 10m gains qualify for Business Asset Disposal Relief. The 10,000
  # step raises them by 0.1% to 1,000,799.80, but the 1m lifetime limit lets
  # only 200 through at the 18% relief rate; the other 9,800 is charged at 24%:
  # (200 x 0.18 + 9,800 x 0.24) / 10,000. The rate at the point itself is
  # 23.4%, the share-weighted rate the £1,000 step read. The gains are given
  # before any response so that the relief gains scale with the step.
  period: 2026
  absolute_error_margin: 0.00001
  input:
    employment_income: 200_000
    capital_gains_before_response: 10_000_000
    capital_gains_badr: 999_800
  output:
    marginal_tax_rate_on_capital_gains: 0.2388
