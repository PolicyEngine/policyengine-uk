# Warm Home Discount (England and Wales). Each case sets every qualifying
# benefit explicitly so that only the named one is received.

- name: Pension Credit recipient in England, 2026-27
  period: 2026
  input:
    people:
      person:
        age: 70
    benunits:
      benunit:
        members: [person]
        pension_credit: 1000
        universal_credit: 0
        housing_benefit: 0
        esa_income: 0
        jsa_income: 0
        income_support: 0
    households:
      household:
        members: [person]
        region: LONDON
  output:
    warm_home_discount: 150

