- name: A single resident adult in Scotland receives the 25% discount
  # Local Government Finance Act 1992 section 79(1), the appropriate percentage being 25 per cent under section 79(3).
  period: 2026
  absolute_error_margin: 0.001
  input:
    people:
      person_1:
        age: 40
    benunits:
      benunit:
        members: [person_1]
    households:
      household:
        members: [person_1]
        region: SCOTLAND
  output:
    council_tax_discount_rate: 0.25

- name: Two resident adults in Scotland receive no discount
  period: 2026
  absolute_error_margin: 0.001
  input:
    people:
      person_1:
        age: 40
      person_2:
        age: 38
    benunits:
      benunit:
        members: [person_1, person_2]
    households:
      household:
        members: [person_1, person_2]
        region: SCOTLAND
  output:
    council_tax_discount_rate: 0

- name: A dwelling with no resident in Scotland receives no discount
  # Section 79(2)(a) was repealed with effect from 1 April 2005 by regulation 2 of the Council Tax (Discount for Unoccupied Dwellings) (Scotland) Regulations 2005, so no discount arises under section 79 merely because a dwelling is unoccupied.
  period: 2026
  absolute_error_margin: 0.001
  input:
    people:
      person_1:
        age: 10
    benunits:
      benunit:
        members: [person_1]
    households:
      household:
        members: [person_1]
        region: SCOTLAND
  output:
    council_tax_discount_rate: 0

- name: A dwelling with no resident in Wales receives twice the appropriate percentage before the 2026 reform
  # Section 11(2)(a) applied to England and Wales alike until 31 March 2026.
  period: 2025
  absolute_error_margin: 0.001
  input:
    people:
      person_1:
        age: 10
    benunits:
      benunit:
        members: [person_1]
    households:
      household:
        members: [person_1]
        region: WALES
  output:
    council_tax_discount_rate: 0.5

- name: A dwelling with no resident in Wales receives no discount after the 2026 reform
  # From 1 April 2026 the Welsh regulations prescribe 50 per cent only where residents are all disregarded (regulation 4) or in the narrow unoccupied cases of regulation 6, so no general no-resident discount arises. Model year 2026 already reflects this: these are annual parameters, so a change dated 1 April 2026 takes effect for the whole of model year 2026, which is why the pre-reform case above is pinned at 2025.
  period: 2026
  absolute_error_margin: 0.001
  input:
    people:
      person_1:
        age: 10
    benunits:
      benunit:
        members: [person_1]
    households:
      household:
        members: [person_1]
        region: WALES
  output:
    council_tax_discount_rate: 0

