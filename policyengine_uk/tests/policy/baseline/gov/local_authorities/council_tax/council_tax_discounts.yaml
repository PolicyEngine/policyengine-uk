- name: A single resident adult in Wales receives the 25% discount
  # Regulation 3 of the Council Tax (Discounts, Disregards and Exemptions) (Wales) Regulations 2026, and section 11(1) before 1 April 2026.
  period: 2026
  absolute_error_margin: 0.001
  input:
    people:
      person_1:
        age: 40
    benunits:
      benunit:
        members: [person_1]
    households:
      household:
        members: [person_1]
        region: WALES
  output:
    council_tax_discount_rate: 0.25

