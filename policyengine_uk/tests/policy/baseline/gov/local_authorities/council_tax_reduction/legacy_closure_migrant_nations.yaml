- name: An English mixed-age WTC migrant has no reg 60A pensioner CTR exemption
  period: 2025
  input:
    people:
      older:
        age: 70
        employment_income: 8_000
        weekly_hours: 30
        working_tax_credit_reported: 2_000
      younger:
        age: 40
    benunits:
      family:
        members: [older, younger]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
        has_mixed_age_couple_pension_credit_saving: true
    households:
      household:
        members: [older, younger]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    legacy_benefits_closed: true
    claims_uc_at_legacy_closure: true
    is_uc_eligible: true
    is_uc_entitled: true
    council_tax_reduction_pensioner: false

