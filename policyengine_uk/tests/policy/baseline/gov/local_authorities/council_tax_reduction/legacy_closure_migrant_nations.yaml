- name: A Scottish pensioner with a non-migrant UC run-on award keeps pensioner CTR
  # An input award without a working-age claimant or reg 60A migration
  # retains the existing approximation for an award awaiting termination,
  # or awarded in error: SSI 2021/249 reg 3(2).
  period: 2025
  input:
    people:
      claimant:
        age: 70
    benunits:
      family:
        members: [claimant]
        universal_credit_pre_benefit_cap: 4_000
    households:
      household:
        members: [claimant]
        country: SCOTLAND
        local_authority: GLASGOW_CITY
        council_tax: 2_000
        savings: 0
  output:
    claims_uc_at_legacy_closure: false
    is_uc_entitled: true
    council_tax_reduction_pensioner: true

