# UC (Transitional Provisions) Regulations 2014 reg 60A waives the upper
# age limit for a single or wholly pension-age couple migrated from WTC.
# England disregards these awards for pensioner CTR from the 2025-26 scheme
# year (SI 2025/39 regs 1(3), 4); Wales from 2026-27 (WSI 2026/13 regs
# 1(3), 4). Scotland has no migrant disregard (SSI 2021/249 reg 3).

- name: A Scottish pension-age WTC migrant uses working-age CTR in 2025
  period: 2025
  input:
    people:
      claimant:
        age: 70
        employment_income: 8_000
        weekly_hours: 30
        working_tax_credit_reported: 2_000
    benunits:
      family:
        members: [claimant]
        would_claim_uc: false
        would_claim_uc_at_legacy_closure: true
    households:
      household:
        members: [claimant]
        country: SCOTLAND
        local_authority: GLASGOW_CITY
        council_tax: 2_000
        savings: 0
  output:
    legacy_benefits_closed: true
    claims_uc_at_legacy_closure: true
    is_uc_eligible: true
    is_uc_entitled: true
    council_tax_reduction_pensioner: false
    council_tax_reduction_pensioner_earnings_disregard: 0

