# HB Regs 2006 reg 74(2), (9); pension-age HB Regs 2006 reg 55(2), (10).
# England CTR SI 2012/2885 Sch 1 para 8(2), (9); Scotland SSI 2021/249
# reg 90(2), (9) and SSI 2012/319 reg 48(2), (9); Wales WSI 2013/3029
# Sch 1 para 3 and Sch 6 para 5. Gross income includes statutory pay and
# maintenance; the listed disability payments are disregarded.
# Hand arithmetic: wages 9,000 + statutory pay 520 = 9,520, just above
# 183/week. Each national scheme bands it on its own 2025-26 scale, below
# the first band's lower edge, so the non-dependant pays the scheme's lowest
# amount: England 5.00 (SI 2025/39), Scotland 5.35 (SSI 2025/24) and Wales
# 6.25 (WSI 2025/59) a week.
# Annual wages and statutory pay can relate to different parts of the year;
# leave days themselves are not remunerative work (HB reg 6(7)).

- name: council_tax_reduction_non_dep_gross_income includes statutory_sick_pay with ENGLAND claimant aged 70
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        is_household_head: true
        social_security_income: 0
        council_tax_reduction_individual_non_dep_deduction_eligible: false
      non_dependant:
        age: 30
        social_security_income: 0
        employment_income: 9_000
        hours_worked: 832 # 16 hours a week
        statutory_sick_pay: 520
        council_tax_reduction_individual_non_dep_deduction_eligible: true
    benunits:
      claimant_family:
        members: [claimant]
        council_tax_reduction_claimant_benunit: true
        would_claim_council_tax_reduction: true
        council_tax_reduction_joint_liability_share: 1
        council_tax_reduction_applicable_income: 0
        council_tax_reduction_applicable_amount: 0
        council_tax_reduction_assessable_capital: 0
      non_dependant_family:
        members: [non_dependant]
        council_tax_reduction_claimant_benunit: false
        would_claim_council_tax_reduction: false
        council_tax_reduction_joint_liability_share: 0
        council_tax_reduction_applicable_income: 0
        council_tax_reduction_applicable_amount: 0
        council_tax_reduction_assessable_capital: 0
    households:
      household:
        members: [claimant, non_dependant]
        country: ENGLAND
        council_tax_reduction_maximum_eligible_liability: 4_000
  output:
    council_tax_reduction_non_dep_gross_income: [0, 9_520]
    council_tax_reduction_individual_non_dep_deduction: [0, 260]
    council_tax_reduction_non_dep_deductions: [260, 0]
    simulated_council_tax_reduction_benunit: [3_740, 0]

