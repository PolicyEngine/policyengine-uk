  # rather than a band. SI 2012/2885 Sch 1 para 8(8)(a) exempts this
  # non-dependant altogether; that exemption remains for #2007.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 30
    council_tax_reduction_individual_non_dep_deduction_eligible: true
    hours_worked: 832
    employment_income: 9000
    iidb: 12000
    social_security_income: 0
    is_on_income_support: true
    is_on_income_based_jsa: false
    is_on_income_related_esa: false
  output:
    council_tax_reduction_individual_non_dep_deduction: 1060.8

