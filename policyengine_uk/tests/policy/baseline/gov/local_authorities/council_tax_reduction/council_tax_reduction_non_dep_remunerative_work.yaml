# England SI 2012/2885 Sch 1 para 8 and reg 10; Scotland SSI 2021/249
# reg 90 and reg 10, SSI 2012/319 reg 48 and reg 6; Wales WSI 2013/3029
# Sch 1 para 3, Sch 6 para 5 and reg 10: income banding requires remunerative
# work. Each scheme's 2026-27 scale: a non-dependant outside remunerative work
# pays the lowest amount (England 5.20, SI 2026/27; Scotland 5.55, SSI
# 2026/56; Wales 6.70, WSI 2026/13), and 403.85/week of income in work falls
# in the band from £279 in England (10.60) and Wales (13.35) and from £286 in
# Scotland (10.95). Family awards, which a single non-dependant's gross income
# would count, are held at zero. English cases give the household a
# pension-age applicant, since England's only national scheme is the
# pension-age one, and the model works out each family's scheme.


- name: ENGLAND council_tax_reduction bands IIDB only from 16 weekly hours (0 weekly hours)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      applicant:
        age: 70
        social_security_income: 0
      non_dependant:
        age: 30
        hours_worked: 0
        employment_income: 0
        iidb: 12000
        social_security_income: 0
        is_on_income_support: false
        is_on_income_based_jsa: false
        is_on_income_related_esa: false
    benunits:
      applicant_unit:
        members: [applicant]
      non_dependant_unit:
        members: [non_dependant]
        universal_credit_pre_benefit_cap: 0
        child_tax_credit: 0
        working_tax_credit: 0
        child_benefit: 0
        income_support: 0
        jsa_income: 0
        esa_income: 0
        pension_credit: 0
    households:
      household:
        members: [applicant, non_dependant]
        country: ENGLAND
  output:
    council_tax_reduction_pensioner: [true, false]
    weekly_hours: [0, 0]
    council_tax_reduction_non_dep_gross_income: [0, 12000]
    council_tax_reduction_individual_non_dep_deduction: [0, 270.40]

