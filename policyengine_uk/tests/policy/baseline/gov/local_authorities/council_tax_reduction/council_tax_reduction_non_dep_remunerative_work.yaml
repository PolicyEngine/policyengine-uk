- name: council_tax_reduction charges no new deduction to a non-dependant on Universal Credit without earnings
  # SI 2012/2885 Sch 1 para 8(8)(c): no deduction for a non-dependant
  # entitled to Universal Credit with no earned income. Universal Credit is
  # not banding income, so the gate leaves the zero.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      non_dependant:
        age: 30
        council_tax_reduction_individual_non_dep_deduction_eligible: true
        hours_worked: 0
        social_security_income: 0
        is_on_income_support: false
        is_on_income_based_jsa: false
        is_on_income_related_esa: false
    benunits:
      non_dependant_unit:
        members: [non_dependant]
        universal_credit: 6_000
    households:
      household:
        members: [non_dependant]
        country: ENGLAND
  output:
    council_tax_reduction_individual_non_dep_deduction: [0]

- name: council_tax_reduction excludes each income-related benefit recipient from remunerative work (Income Support)
