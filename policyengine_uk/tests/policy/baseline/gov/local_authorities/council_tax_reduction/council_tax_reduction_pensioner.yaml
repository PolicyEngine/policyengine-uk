- name: In Wales the cap reaches Council Tax Reduction through Universal Credit income
  # The Welsh formula does not route on pensioner status, but it counts
  # Universal Credit as income. Capping a mixed-age couple's award (cap
  # 22,020 outside London; 30,000 + 3,000 - 22,020 = 10,980) lowers that
  # income and so raises the reduction. Without the cap Universal Credit of
  # 30,000 would take income far above the applicable amount.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 70
      younger:
        age: 50
      child:
        age: 9
    benunits:
      benunit:
        members: [older, younger, child]
        universal_credit_pre_benefit_cap: 30_000
        child_benefit: 3_000
        uc_deductions: 0
    households:
      household:
        members: [older, younger, child]
        country: WALES
        local_authority: CARDIFF
        region: WALES
        council_tax: 2_000
        savings: 0
  output:
    benefit_cap_reduction: 10_980
    universal_credit: 19_020
    council_tax_reduction_applicable_income: 22_020
    council_tax_benefit: 1_582.84
