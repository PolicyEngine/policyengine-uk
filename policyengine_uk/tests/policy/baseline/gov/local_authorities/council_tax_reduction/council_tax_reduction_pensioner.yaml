- name: A Newham mixed-age couple on Universal Credit gets Newham's working-age scheme
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 70
      younger:
        age: 50
    benunits:
      benunit:
        members: [older, younger]
        universal_credit_pre_benefit_cap: 10_000
    households:
      household:
        members: [older, younger]
        country: ENGLAND
        local_authority: NEWHAM
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_household_has_pensioner: false
    council_tax_reduction_scheme_supported: true
    # Newham's scheme on the Universal Credit route. The pensioner scheme
    # would give the full 2,000 (income 10,000 is below the pension-age
    # applicable amount).
    newham_council_tax_reduction: 900.91
    council_tax_benefit: 900.91

- name: Newham's working-age non-dependant deduction applies to a mixed-age couple on UC
  # The couple (the claimant benefit unit, with the oldest member) lives with
  # a working son in his own benefit unit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 70
      younger:
        age: 50
      son:
        age: 30
        employment_income: 30_000
    benunits:
      couple:
        members: [older, younger]
        universal_credit_pre_benefit_cap: 10_000
      son:
        members: [son]
    households:
      household:
        members: [older, younger, son]
        country: ENGLAND
        local_authority: NEWHAM
        council_tax: 2_000
        savings: 0
  output:
    benunit_contains_household_head: [true, false]
    council_tax_reduction_pensioner: [false, false]
    council_tax_reduction_household_has_pensioner: false
    newham_council_tax_reduction_non_dep_deductions: [392.08, 0]
    council_tax_benefit: [508.83, 0]

- name: A pensioner whose only younger adult is a qualifying young person stays a pensioner
  # The model pays this family Universal Credit because is_uc_eligible counts
  # any working-age adult. Universal Credit needs a claimant or partner under
  # the qualifying age, so the award does not count against pensioner status.
  period: 2026
  input:
    people:
      parent:
        age: 70
        is_parent: true
      young_person:
        age: 18
        current_education: UPPER_SECONDARY
    benunits:
      benunit:
        members: [parent, young_person]
        universal_credit_pre_benefit_cap: 10_000
    households:
      household:
        members: [parent, young_person]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    is_uc_entitled: true
    council_tax_reduction_pensioner: true
    council_tax_reduction_household_has_pensioner: true
    council_tax_reduction_scheme_supported: true

