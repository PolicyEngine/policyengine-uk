      benunit:
        members: [older, younger]
        would_claim_uc: false
        jsa_income: 4_000
    households:
      household:
        members: [older, younger]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_pensioner: false
    council_tax_reduction_household_has_pensioner: false
    council_tax_benefit: 700

- name: An English couple over State Pension age is a pensioner couple
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 72
      younger:
        age: 68
    benunits:
      benunit:
        members: [older, younger]
    households:
      household:
        members: [older, younger]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_pensioner: true
    council_tax_reduction_household_has_pensioner: true
    council_tax_reduction_scheme_supported: true

