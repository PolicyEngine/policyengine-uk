- name: Scotland 2021-22, the 2012 scheme's two £15 disregards
  # SSI 2012/303 Sch 4 para 20 (as at 31 March 2022) disregards up to £15 of
  # the allowance and para 48 up to £15 of the family's combined maintenance:
  # 5,200 of each income less 780 each = 8,840. SSI 2012/303 Sch 4 para 3 disregarded tax on
  # this income, which the route does not apply in Scotland; the allowance is
  # below the 12,570 personal allowance, so no tax arises and the case does
  # not depend on it. Applicable amount: lone parent 74.70 (SSI
  # 2021/51 reg 7(a)(i)) + child premium 85.75 (reg 7(b)) = 160.45 a week,
  # 8,343.40 a year. Excess 496.60; award 1,800 - 99.32 = 1,700.68. Tax
  # credits are pinned to nil to isolate the two incomes.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        spousal_maintenance_income: 5_200
        widowed_parents_allowance: 5_200
        council_tax_benefit_reported: 100
      child:
        age: 8
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
        child_tax_credit: 0
        working_tax_credit: 0
    households:
      household:
        members: [parent, child]
        region: SCOTLAND
        country: SCOTLAND
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_devolved_working_age: true
    council_tax_reduction_working_age_passported: false
    council_tax_reduction_working_age_unearned_income: 8_840
    council_tax_reduction_working_age_applicable_amount: 8_343.40
    council_tax_reduction: 1_700.68

