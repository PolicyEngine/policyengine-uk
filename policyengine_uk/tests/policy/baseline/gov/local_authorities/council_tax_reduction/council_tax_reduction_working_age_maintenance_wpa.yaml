        would_claim_uc: false
    households:
      household:
        members: [parent, child]
        region: WALES
        country: WALES
        council_tax: 1_800
        rent: 20_000
        savings: 0
  output:
    council_tax_reduction_working_age_unearned_income: 19_220
    council_tax_reduction_working_age_unearned_income_tax: 0
    council_tax_reduction_working_age_applicable_amount: 10_917.40
    council_tax_reduction_working_age_applicable_income: 19_220
    council_tax_reduction: 139.48

