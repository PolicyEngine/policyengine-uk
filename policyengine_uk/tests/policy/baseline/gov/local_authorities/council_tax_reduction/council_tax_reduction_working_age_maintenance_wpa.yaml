  # private pension, £520 of the allowance, £5,000 of charges (under £175 a
  # week). Earnings 5,000 - 1,300 = 3,700; unearned 3,000 + 520 = 3,520,
  # less 780 = 2,740; less the charges: 3,700 + 2,740 - 5,000 = 1,440. Below
  # the applicable amount, so the maximum reduction is due. If the
