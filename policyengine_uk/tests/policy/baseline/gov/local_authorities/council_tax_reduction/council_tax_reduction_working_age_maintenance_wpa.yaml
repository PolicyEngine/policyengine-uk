- name: Scotland, maintenance and Widowed Parent's Allowance under £15 a week leave nothing counted
  # £10 a week (520 a year) of each. Reg 57(6) disregards all the maintenance
  # (up to £15), so unearned income is the 520 allowance. Reg 57(4) takes up to
  # £15 a week from that total, never below nil: 520 - 520 = 0. No income
  # counts and the maximum reduction is due.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        spousal_maintenance_income: 520
        widowed_parents_allowance: 520
        council_tax_benefit_reported: 100
      child:
        age: 8
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
    households:
      household:
        members: [parent, child]
        region: SCOTLAND
        country: SCOTLAND
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_working_age_unearned_income: 520
    council_tax_reduction_working_age_applicable_income: 0
    council_tax_reduction: 1_800

- name: Scotland, a couple's Widowed Parent's Allowances get a disregard each and their maintenance one
  # Reg 57(4) deducts £15 where an applicant is in receipt of the allowance,
  # reg 36(1) reads references to the applicant in Part 6 as including the
  # partner and, unlike reg 57(6), reg 57(4) does not aggregate payments. The
  # model reads that as a disregard for each recipient. Reg 57(6) aggregates
  # the maintenance for one disregard: 1,040 + 1,040 - 780 = 1,300. Unearned
  # income 2 x 7,800 + 1,300 = 16,900; less 2 x 780 under reg 57(4), 15,340.
  # (A lawful award never reaches a couple: the allowance is not payable
  # while the recipient lives with a partner, SSCBA 1992 s.39A(5)(b). The case
  # pins the per-recipient disregard.) Applicable amount: couple 150.15 +
  # child premium 109.85 = 260.00 a week, 13,520 a year. Excess 1,820; award
  # 1,800 - 364 = 1,436.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 35
        widowed_parents_allowance: 7_800
        spousal_maintenance_income: 1_040
        council_tax_benefit_reported: 100
      partner:
        age: 35
        widowed_parents_allowance: 7_800
        spousal_maintenance_income: 1_040
      child:
        age: 8
    benunits:
      benunit:
        members: [claimant, partner, child]
        would_claim_uc: false
    households:
      household:
        members: [claimant, partner, child]
        region: SCOTLAND
        country: SCOTLAND
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_working_age_unearned_income: 16_900
    council_tax_reduction_working_age_applicable_amount: 13_520
    council_tax_reduction_working_age_applicable_income: 15_340
    council_tax_reduction: 1_436

- name: Wales, with Universal Credit the Universal Credit income figure still applies
  # Sch 6 para 9: income is the Secretary of State's Universal Credit income
  # figure plus the award, which counts both incomes in full with no £15
  # disregards. With no earnings, the award is the maximum amount less the
  # 10,400 of unearned income, so income equals the maximum amount, the
  # applicable amount (Sch 6 para 3): (424.90 standard allowance + 303.94
  # child element) x 12 + 6,000 housing costs = 14,746.08. No excess income,
  # so the maximum reduction is due, as before the fix. Within the
  # applicable income calculation, Welsh Universal Credit claims select the
  # Universal Credit income figure, so the scheme's own unearned income,
  # 2 x (5,200 - 780) = 8,840, does not reach the award.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        spousal_maintenance_income: 5_200
        widowed_parents_allowance: 5_200
        council_tax_benefit_reported: 100
      child:
        age: 8
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: true
    households:
      household:
        members: [parent, child]
        region: WALES
        country: WALES
        council_tax: 1_800
        rent: 6_000
        savings: 0
  output:
    council_tax_reduction_working_age_has_universal_credit: true
    council_tax_reduction_working_age_unearned_income: 8_840
    council_tax_reduction_working_age_applicable_amount: 14_746.08
    council_tax_reduction_working_age_applicable_income: 14_746.08
    council_tax_reduction: 1_800

- name: Scotland, with Universal Credit both incomes count less their disregards
  # Reg 57 applies with or without Universal Credit. Unearned income: 5,200 -
  # 780 of maintenance plus the 5,200 allowance = 9,620. The Universal Credit
  # child element (reg 57(1)(p)), 303.94 x 12 = 3,647.28, is below the award
  # of 14,746.08 - 10,400 = 4,346.08. Reg 57(4) takes 780 from the total:
  # 9,620 + 3,647.28 - 780 = 12,487.28; excess over 10,680.80 is 1,806.48;
  # award 1,800 - 361.30 = 1,438.70. Before the fix only the 3,647.28 counted
  # and the maximum reduction was due.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        spousal_maintenance_income: 5_200
        widowed_parents_allowance: 5_200
        council_tax_benefit_reported: 100
      child:
        age: 8
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: true
    households:
      household:
        members: [parent, child]
        region: SCOTLAND
        country: SCOTLAND
        council_tax: 1_800
        rent: 6_000
        savings: 0
  output:
    council_tax_reduction_working_age_has_universal_credit: true
    council_tax_reduction_working_age_unearned_income: 9_620
    council_tax_reduction_relevant_universal_credit_payments: 3_647.28
    council_tax_reduction_working_age_applicable_income: 12_487.28
    council_tax_reduction: 1_438.70

