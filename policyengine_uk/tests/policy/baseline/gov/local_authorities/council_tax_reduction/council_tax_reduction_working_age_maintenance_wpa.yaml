# Spousal maintenance and Widowed Parent's Allowance on the Scottish and Welsh
# working-age council tax reduction route (#2931). Scotland: SSI 2021/249 reg
# 57(1)(b)(vi), (1)(d), (4) and (6); before April 2022, SSI 2012/303 Sch 4
# paras 20 and 48. Wales: WSI 2013/3029 Sch 6 para 17 and Sch 9 paras 4, 21
# and 49. Maintenance counts less one £15 a week for the family where it
# includes a child or young person. Wales and Scotland before April 2022
# count WPA less £15 a week; from April 2022 Scotland counts it in full and
# takes £15 a week from total unearned income (reg 57(4)). Expected
# values are worked from the 2026-27 weekly amounts times 52, the model's
# weeks in a year: each £15 disregard is 780 a year. Council tax is £1,800 and
# the taper is 20% of annual excess income. Applicable amounts: a Scottish
# lone parent 95.55 + child premium 109.85 = 205.40 a week, 10,680.80 a year
# (reg 35); a Welsh lone parent 101.85 + child 87.88 + family premium 20.22 =
# 209.95 a week, 10,917.40 a year (Sch 7).

- name: Scotland, lone parent's spousal maintenance counts less £15 a week
  # Reg 57(1)(d) and (6): 20,000 - 780 = 19,220. Excess 19,220 - 10,680.80 =
  # 8,539.20; award 1,800 - 0.2 x 8,539.20 = 1,800 - 1,707.84 = 92.16.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        spousal_maintenance_income: 20_000
        council_tax_benefit_reported: 100
      child:
        age: 8
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
    households:
      household:
        members: [parent, child]
        region: SCOTLAND
        country: SCOTLAND
        council_tax: 1_800
        rent: 20_000
        savings: 0
  output:
    council_tax_reduction_devolved_working_age: true
    council_tax_reduction_working_age_unearned_income: 19_220
    council_tax_reduction_working_age_applicable_amount: 10_680.80
    council_tax_reduction_working_age_applicable_income: 19_220
    council_tax_reduction: 92.16

