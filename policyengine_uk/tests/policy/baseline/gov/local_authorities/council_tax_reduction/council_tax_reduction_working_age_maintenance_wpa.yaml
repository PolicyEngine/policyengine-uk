  # date the 19-year-old at school qualifies, so reg 57(6) applies: 10,000 -
  # 780 = 9,220. (Not under 18, so an under-18 test would count all 10,000.)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_claimant_or_partner: true
        spousal_maintenance_income: 10_000
        council_tax_benefit_reported: 100
      student:
        age: 19
        is_claimant_or_partner: false
        current_education: UPPER_SECONDARY
        age_started_or_accepted_current_education_or_training: 17
        is_before_universal_credit_qualifying_young_person_terminal_date: true
    benunits:
      benunit:
        members: [parent, student]
        would_claim_uc: false
    households:
      household:
        members: [parent, student]
        region: SCOTLAND
        country: SCOTLAND
        council_tax: 1_800
        savings: 0
  output:
    is_child_or_young_person_for_council_tax_reduction: [false, true]
    council_tax_reduction_working_age_unearned_income: 9_220

