        spousal_maintenance_income: 15_600
        widowed_parents_allowance: 520
        council_tax_benefit_reported: 100
      child:
        age: 8
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
    households:
      household:
        members: [parent, child]
        region: WALES
        country: WALES
        council_tax: 1_800
        savings: 0
  output:
