  # allowance) and NI 114.40 = 13,851.60. Applicable amount (159.85 couple +
  # 48.15 carer premium) x 52 = 10,816. Income 13,851.60 - 520 + 4,495.40
  # Carer's Allowance = 17,827; excess 7,011; award 1,800 - 1,402.20.
