- name: Wales, tax on a pension does not come off wages
  # Only tax "deducted from those earnings" comes off earnings (Sch 6 para
  # 15(3)(a)); tax on the pension is disregarded from the pension (Sch 9 para
  # 4). Earnings are the lowest slice of income, so the £500 wages bear no tax
  # and the 386 = 0.2 x (14,500 - 12,570) is all on the pension. Income:
  # 500 - 260 (£5 disregard) + 14,000 - 386 = 13,854; applicable amount
  # 101.85 x 52 = 5,296.20; award 1,800 - 0.2 x 8,557.80 = 88.44.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 60
        employment_income: 500
        private_pension_income: 14_000
        council_tax_benefit_reported: 100
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
    households:
      household:
        members: [claimant]
        region: WALES
        country: WALES
        council_tax: 1_800
        savings: 0
  output:
    income_tax: 386
    council_tax_reduction_working_age_earned_income: 500
    council_tax_reduction_working_age_earnings_disregard: 260
    council_tax_reduction_working_age_unearned_income_tax: 386
    council_tax_reduction_working_age_applicable_income: 13_854
    simulated_council_tax_reduction_benunit: 88.44

- name: Wales, pension tax survives when childcare absorbs the wages
  # Lone parent, child aged 3, £10,000 wages at 16 hours, £13,000 pension,
  # £9,000 childcare (under the £175 a week cap). The wages bear no tax; the
  # 2,086 = 0.2 x (23,000 - 12,570) is on the pension. Earnings 10,000 -
  # 1,300 (£25 disregard) - 9,000 childcare = 0 (the £17.10 needs earnings to
  # cover it). Pension 13,000 - 2,086 = 10,914, below the applicable amount
  # (101.85 + 87.88 child + 20.22 family premium) x 52 = 10,917.40, so the
  # award is the full 1,800.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 10_000
        weekly_hours: 16
        private_pension_income: 13_000
        childcare_expenses: 9_000
        council_tax_benefit_reported: 100
      child:
        age: 3
    benunits:
      benunit:
        members: [parent, child]
        would_claim_uc: false
    households:
      household:
        members: [parent, child]
        region: WALES
        country: WALES
        council_tax: 1_800
        savings: 0
  output:
