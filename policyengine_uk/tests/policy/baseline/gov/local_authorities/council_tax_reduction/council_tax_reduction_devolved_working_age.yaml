- name: Wales, couple with a child and no Universal Credit
  # Sch 7: 159.85 couple + 87.88 child + 20.22 family premium = 267.95 a week,
  # 13,933.40 a year. Earnings 20,000 less income tax 1,234 (1,486 less the
  # 252 marriage allowance from the partner's unused personal allowance) and
  # NI 594.40 = 18,171.60. Disregards: £10 (couple) + £17.10 (a 25+ member
  # works 30 hours) = 27.10 a week, 1,409.20 a year. Child Benefit is
  # disregarded (Sch 9 para 66). Income 16,762.40; excess 2,829; award
  # 1,800 - 565.80.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 30
        employment_income: 20_000
        weekly_hours: 30
        council_tax_benefit_reported: 100
      partner:
        age: 30
      child:
        age: 5
    benunits:
      benunit:
        members: [claimant, partner, child]
        would_claim_uc: false
    households:
      household:
        members: [claimant, partner, child]
        region: WALES
        country: WALES
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_working_age_applicable_amount: 13_933.40
    income_tax: [1_234, 0, 0]
    council_tax_reduction_working_age_earned_income: 18_171.60
    council_tax_reduction_working_age_earnings_disregard: 1_409.20
    council_tax_reduction_working_age_applicable_income: 16_762.40
    simulated_council_tax_reduction_benunit: 1_234.20

