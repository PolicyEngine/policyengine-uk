- name: A head who applies alone is a single person, with premiums on her own disability only
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandmother:
        age: 60
        is_household_head: true
        is_disabled_for_benefits: true
        is_severely_disabled_for_benefits: true
      young_mother:
        age: 17
        is_parent: true
        is_household_head: false
        is_disabled_for_benefits: true
        is_carer_for_benefits: true
      young_father:
        age: 17
        is_parent: true
        is_household_head: false
      baby:
        age: 0
        is_household_head: false
    benunits:
      family:
        members: [grandmother, young_mother, young_father, baby]
        claims_all_entitled_benefits: true
        would_claim_uc: false
    households:
      home:
        members: [grandmother, young_mother, young_father, baby]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
        savings: 0
  output:
    # Disability (44.85) and severe disability (86.05) premiums at the single
    # rate: (44.85 + 86.05) * 52. The young mother's disability and caring
    # do not give the grandmother a premium.
    council_tax_reduction_premiums: [6_806.80]
    # Single aged 25 or over, 95.55 * 52 = 4,968.60, plus the premiums.
    council_tax_reduction_applicable_amount: [11_775.40]

- name: A blind grandmother head who applies alone has no non-dependant deduction in Merton
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandmother:
        age: 60
        is_household_head: true
        is_blind: true
      young_mother:
        age: 17
        is_parent: true
        is_household_head: false
      young_father:
        age: 17
        is_parent: true
        is_household_head: false
      baby:
        age: 0
        is_household_head: false
      son:
        age: 30
        is_household_head: false
        employment_income: 30_000
        weekly_hours: 40
    benunits:
      family:
        members: [grandmother, young_mother, young_father, baby]
        claims_all_entitled_benefits: true
        would_claim_uc: false
      son:
        members: [son]
        claims_all_entitled_benefits: false
        would_claim_uc: false
    households:
      home:
        members: [grandmother, young_mother, young_father, baby, son]
        country: ENGLAND
        local_authority: MERTON
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_household_has_pensioner: false
    # The exemption is the applicant's or partner's (SI 2012/2885 Sch 1 para
    # 8(6); the Merton scheme follows it).
    council_tax_reduction_household_has_non_dep_exemption: true
    council_tax_reduction_individual_non_dep_deduction_eligible: [false, false, false, false, true]
    merton_council_tax_reduction_non_dep_deductions: [0, 0]
    merton_council_tax_reduction: [1_800, 0]

- name: The young couple's Universal Credit does not put a grandmother head on Newham's Universal Credit route
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandmother:
        age: 55
        is_household_head: true
      young_mother:
        age: 19
        is_parent: true
        is_household_head: false
      young_father:
        age: 19
        is_parent: true
        is_household_head: false
        employment_income: 30_000
      baby:
        age: 0
        is_household_head: false
    benunits:
      family:
        members: [grandmother, young_mother, young_father, baby]
        claims_all_entitled_benefits: true
        universal_credit: 6_000
        child_benefit: 1_000
    households:
      home:
        members: [grandmother, young_mother, young_father, baby]
        country: ENGLAND
        local_authority: NEWHAM
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_head_applies_alone: [true]
    # The young father's earnings and the couple's award are not hers.
    council_tax_reduction_applicable_income: [0]
    # Single aged 25 or over: 95.55 * 52.
    council_tax_reduction_applicable_amount: [4_968.60]
    # No excess income: 1,800 * 70%. On the Universal Credit route the
    # couple's earnings and award would leave nothing.
    newham_council_tax_reduction: [1_260]

- name: A partner under 18 is not liable, but their income counts in the couple's means test
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 19
        is_household_head: true
        is_benunit_head: false
      partner:
        # The benefit unit's head, so the HBAI fallback does not read the
        # 17-year-old as a dependent child.
        age: 17
        is_household_head: false
        is_benunit_head: true
        employment_income: 10_000
    benunits:
      couple:
        members: [head, partner]
        claims_all_entitled_benefits: true
        would_claim_uc: false
        # The model would otherwise pay Child Benefit for the 17-year-old
        # partner. SI 2006/223 reg 12 bars it while a qualifying young person
        # lives with a partner as a couple, unless that partner is in
        # education or training; that is a separate issue.
        child_benefit: 0
    households:
      home:
        members: [head, partner]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
        savings: 0
  output:
    is_claimant_or_partner: [true, true]
    council_tax_reduction_liable_person: [true, false]
    council_tax_reduction_head_applies_alone: [false]
    is_council_tax_reduction_applicant_or_partner: [true, true]
    # Below the personal allowance and the National Insurance threshold.
    council_tax_reduction_applicable_income: [10_000]
    # Couple aged 18 or over: 150.15 * 52 = 7,807.80.
    council_tax_reduction_applicable_amount: [7_807.80]
    # 1,800 - (10,000 - 7,807.80) * 20%.
    simulated_council_tax_reduction_benunit: [1_361.56]

