# The Council Tax Reduction means test covers the applicant's own income and
# their partner's (SSI 2012/319 regs 14, 21, 23 and 26; SI 2012/2885 Sch 1
# para 11; WSI 2013/3029 Sch 1 para 5 and Sch 6 para 7; SSI 2021/249 reg 36).
# The applicant is the person liable for the council tax. Where that is a
# household head who is not the benefit unit's claimant or partner (here a
# grandmother sharing a benefit unit with a young couple and their baby), the
# means test is the head's own, as a single person; the benefit unit's
# benefits belong to the couple. None of these cases sets applicable income.
#
# Rates for 2026 (parameters): pension-age single personal allowance
# £256/week, working-age single aged 25 or over £95.55/week, couple aged 18
# or over £150.15/week, disability premium (single) £44.85/week, severe
# disability premium (single) £86.05/week; 52 weeks. Scotland, Wales and the
# English pensioner scheme: maximum reduction 100%, withdrawal 20%. Newham:
# maximum 70%, withdrawal 25%. Personal allowance £12,570, basic rate 20%.

- name: A grandmother head with a young couple in her benefit unit and no income of her own gets the full reduction
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandmother:
        age: 80
        is_household_head: true
      young_mother:
        age: 17
        is_parent: true
        is_household_head: false
      young_father:
        age: 17
        is_parent: true
        is_household_head: false
      baby:
        age: 0
        is_household_head: false
    benunits:
      family:
        members: [grandmother, young_mother, young_father, baby]
        claims_all_entitled_benefits: true
        would_claim_uc: false
    households:
      home:
        members: [grandmother, young_mother, young_father, baby]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
        savings: 0
  output:
    is_claimant_or_partner: [false, true, true, false]
    council_tax_reduction_liable_person: [true, false, false, false]
    council_tax_reduction_head_applies_alone: [true]
    is_council_tax_reduction_applicant_or_partner: [true, false, false, false]
    # The couple's Child Benefit for the baby is theirs, not hers.
    council_tax_reduction_applicable_income: [0]
    # A single pensioner: 256 * 52.
    council_tax_reduction_applicable_amount: [13_312]
    simulated_council_tax_reduction_benunit: [1_800]
    council_tax_reduction: 1_800

