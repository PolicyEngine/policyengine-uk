    simulated_council_tax_reduction_benunit: [1_361.56]

- name: A pensioner who is not the applicant or partner does not make a young couple's claim a pensioner's
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandmother:
        age: 70
        is_household_head: false
      mother:
        age: 19
        is_parent: true
        is_household_head: true
      father:
        age: 19
        is_parent: true
        is_household_head: false
      baby:
        age: 0
        is_household_head: false
    benunits:
      family:
        members: [grandmother, mother, father, baby]
        claims_all_entitled_benefits: true
        would_claim_uc: false
    households:
      home:
        members: [grandmother, mother, father, baby]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
        savings: 0
  output:
    # The mother is the head and the couple are the benefit unit's claimant
    # and partner, so they are the applicant and partner.
    council_tax_reduction_head_applies_alone: [false]
    is_council_tax_reduction_applicant_or_partner: [false, true, true, false]
    council_tax_reduction_household_has_pensioner: false
    # A working-age couple aged 18 or over: 150.15 * 52, not the pension-age
    # couple rate.
    council_tax_reduction_applicable_amount: [7_807.80]
