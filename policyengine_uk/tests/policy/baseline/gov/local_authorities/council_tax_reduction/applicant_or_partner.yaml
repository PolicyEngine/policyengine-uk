      young_mother:
        age: 17
        is_parent: true
        is_household_head: false
      young_father:
        age: 17
        is_parent: true
        is_household_head: false
      baby:
        age: 0
        is_household_head: false
    benunits:
      family:
        members: [grandmother, young_mother, young_father, baby]
        claims_all_entitled_benefits: true
        would_claim_uc: false
    households:
      home:
        members: [grandmother, young_mother, young_father, baby]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
        savings: 0
  output:
    is_council_tax_reduction_applicant_or_partner: [true, false, false, false]
    council_tax_reduction_applicable_amount: [13_312]
    # Her pension after tax is far above £13,312, and 20% of the excess is
    # more than the £1,800 council tax.
    simulated_council_tax_reduction_benunit: [0]
    council_tax_reduction: 0

- name: In England a grandmother head's own £20,000 pension is withdrawn at 20% above her allowance
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandmother:
        age: 80
        is_household_head: true
        private_pension_income: 20_000
      young_mother:
        age: 17
        is_parent: true
        is_household_head: false
        employment_income: 10_000
      young_father:
        age: 17
        is_parent: true
        is_household_head: false
      baby:
        age: 0
        is_household_head: false
    benunits:
      family:
        members: [grandmother, young_mother, young_father, baby]
        claims_all_entitled_benefits: true
        would_claim_uc: false
    households:
      home:
        members: [grandmother, young_mother, young_father, baby]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_household_has_pensioner: true
    # Her pension less income tax of (20,000 - 12,570) * 20% = 1,486. The
    # young mother's earnings are not hers.
    council_tax_reduction_applicable_income: [18_514]
    council_tax_reduction_applicable_amount: [13_312]
    # 1,800 - (18,514 - 13,312) * 20%.
    simulated_council_tax_reduction_benunit: [759.60]

