# Historical CTR personal-allowance table component tests.
# The pensioner flag is supplied to isolate the table from age eligibility;
# synthetic under-65 inputs after December 2018 are not real new claims.
# England: SI 2012/2885 Sch 2 para 1 (dated 2016-04-01 and 2018-04-01).
# Scotland: SSI 2012/319 Sch 1 para 2; SSI 2020/413 regs 1 and 13.
# Wales: WSI 2013/3029 Sch 2 para 1; WSI 2022/51 regs 1(3) and 5.
# Rates use 30 April; dated category changes use fiscal-year segments.
# Higher rates remain the existing shared HB parameters. The Scotland 2020
# case supplies its enacted higher rate to isolate this category correction
# from the separate older-rate corrections owned by PR #1925.

- name: Case 1, ENGLAND personal allowance for ages 64 in 2016.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 64
    benunits:
      benunit:
        members: [person1]
        council_tax_reduction_pensioner: true
        pension_age_benefits_premiums: 0
        housing_benefit_eligible: false
    households:
      household:
        members: [person1]
        country: ENGLAND
  output:
    # £155.6 per week * 52.
    council_tax_reduction_applicable_amount: 8091.20
    housing_benefit_applicable_amount: 0

