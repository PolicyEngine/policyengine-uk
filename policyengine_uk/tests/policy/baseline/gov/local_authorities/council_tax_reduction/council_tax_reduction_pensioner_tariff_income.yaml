        country: SCOTLAND
        local_authority: GLASGOW_CITY
        council_tax: 2_000
        savings: 20_000
  output:
    # SSI 2012/319 reg 27(2): (20,000 - 10,000) / 500 = 20; 20 * 1 * 52 =
    # 1,040.
    council_tax_reduction_pensioner_tariff_income: 1_040
    # Reg 40: capital over 16,000, so no reduction.
    council_tax_reduction: 0

