- name: Case 10, England, tariff income reduces an award above the applicable amount.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
        state_pension: 15_000
    benunits:
      benunit:
        members: [pensioner]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 16_000
  output:
    # Income tax: (15,000 - 12,570) * 0.2 = 486. Income 15,000 - 486 + 624
    # = 15,138. Award 2,000 - 0.2 * (15,138 - 13,312) = 1,634.80.
    council_tax_reduction_pensioner_tariff_income: 624
    council_tax_reduction_applicable_income: 15_138
    council_tax_reduction: 1_634.80

