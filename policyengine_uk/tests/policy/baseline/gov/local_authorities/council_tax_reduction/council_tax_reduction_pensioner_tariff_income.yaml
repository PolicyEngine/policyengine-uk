      pensioner:
        age: 90
        state_pension: 12_000
        private_pension_income: 1_500
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 16_000
  output:
    # The same as the savings-credit-only case at 16,000 in
    # council_tax_reduction_pension_credit.yaml: the Secretary of State's
    # income already counts Pension Credit's deemed income from capital.
    in_receipt_of_savings_credit_only: true
    council_tax_reduction_pensioner_tariff_income: 0
    council_tax_reduction_applicable_income: 14_247.02

