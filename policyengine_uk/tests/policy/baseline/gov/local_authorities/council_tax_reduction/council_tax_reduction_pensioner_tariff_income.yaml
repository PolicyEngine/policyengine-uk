# Pensioner tariff income from capital. A pensioner's capital counts as a
# weekly income of £1 for each £500 over £10,000, and £1 for any part of £500:
# England SI 2012/2885 Sch 1 para 37 and Wales WSI 2013/3029 Sch 1 para 31
# (each "not exceeding £16,000"), Scotland SSI 2012/319 reg 27(2), which sets
# no ceiling. Capital over £16,000 ends entitlement (SI 2012/2885 reg 11(2);
# WSI 2013/3029 reg 30; SSI 2012/319 reg 40). Councils disregard a guarantee
# credit recipient's whole capital and income (Sch 1 para 13; Sch 1 para 7;
# reg 24), and on a savings-credit-only award they use the Secretary of
# State's assessment of income (Sch 1 para 14; Sch 1 para 8; reg 25).
#
# Each 72-year-old reached State Pension age before 1 April 2021, so the
# applicable amount is 256.00 * 52 = 13,312. A State Pension of 12,570 is
# within the personal allowance, so it bears no income tax. The council tax is
# 2,000 and the pensioner schemes withdraw 20% of income above the applicable
# amount.

- name: Case 1, England, capital of 10,000 gives no tariff income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
        state_pension: 12_570
    benunits:
      benunit:
        members: [pensioner]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 10_000
  output:
    council_tax_reduction_pensioner_tariff_income: 0
    council_tax_reduction_applicable_income: 12_570

- name: Case 2, England, capital of 10,001 gives 1 a week for the part of 500.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
        state_pension: 12_570
    benunits:
      benunit:
        members: [pensioner]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 10_001
  output:
    council_tax_reduction_pensioner_tariff_income: 1 * 52
    council_tax_reduction_applicable_income: 12_570 + 52

- name: Case 3, England, capital of 16,000 gives 12 a week.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
        state_pension: 12_570
    benunits:
      benunit:
        members: [pensioner]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 16_000
  output:
    # (16,000 - 10,000) / 500 = 12; 12 * 52 = 624.
    council_tax_reduction_pensioner_tariff_income: 624
    council_tax_reduction_applicable_income: 13_194
    # 13,194 is below 13,312, so the whole council tax.
    council_tax_reduction: 2_000

