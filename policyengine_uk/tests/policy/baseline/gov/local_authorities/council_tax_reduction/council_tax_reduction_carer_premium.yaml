# Scottish councils include the carer premium in the working-age council tax
# reduction where the applicant or partner has regular and substantial caring
# responsibilities for a severely disabled person (SSI 2021/249 Sch 1 para
# 5(2)), and the Scottish Ministers count among those responsibilities "an
# award of universal credit which includes the carer element described in
# regulation 29 of the 2013 Regulations" (para 6(1)(c)). No other scheme's
# carer premium has that limb: under the Housing Benefit, English and Welsh
# schedules, DWP and councils test entitlement to Carer's Allowance or Carer
# Support Payment (HB Regs 2006 Sch 3 para 17; WSI 2013/3029 Sch 7 para 14),
# as Scottish councils did for persons under pension age before 1 April 2022
# (SSI 2012/303 Sch 1 para 14). From 1 April 2022 to 31 March
# 2025 an "award of universal credit" included "a universal credit award with
# a value of zero" (reg 4, as amended by SSI 2022/52 reg 3); from 1 April 2025
# it "means an award of universal credit made under Part 1 of the 2012 Act"
# (SSI 2025/24 reg 8), and an income that tapers the award to nil leaves no
# award (Welfare Reform Act 2012 s.5(1)(b); UC Regs 2013 reg 17). An income
# that tapers the amount payable below one penny leaves no award to have a
# value of zero in any year: DWP makes no award or the award ends (UC Claims
# and Payments Regs 2013 reg 32A(1)), and the Scottish Government's policy
# note to SSI 2025/24 confines the earlier words to an award a sanction
# reduces to zero. So the model needs an award of at least one penny in every
# year from 2022-23.
#
# Amounts: carer premium £48.15 a week from 1 April 2026 (SSI 2021/249 Sch 1
# para 5(1), substituted by SSI 2026/56), £46.40 in 2025-26, £45.60 in
# 2024-25 and £38.85 in 2022-23 (para 17, as substituted by SSI 2022/52 reg
# 25(c)(ii); para 5(1) kept £37.70 until SSI 2023/38 amended both from
# 1 April 2023); personal allowance for a single person aged 25 or over
# £95.55 (2026-27) and £77.00 (2022-23); Universal Credit carer element
# £209.34 a month (2026-27), £201.68 (2025-26), £198.31 (2024-25) and £168.81
# (2022-23), standard allowance £424.90, £400.14, £393.45 and £334.91.

- name: The issue's Scottish carer aged 40 with 35 hours and no Carer's Allowance claim gets the carer premium
  # The award includes the carer element, 209.34 x 12 = 2,512.08, so the
  # council includes the carer premium (para 6(1)(c)) and the applicable
  # amount comes to (95.55 + 48.15) x 52 = 7,472.40, not 95.55 x 52 =
  # 4,968.60.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: false
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
  output:
    uc_carer_element: 209.34 * 12
    universal_credit: (424.90 + 209.34) * 12
    receives_uc_carer_element: true
    is_entitled_to_carer_benefit: false
    carer_premium: 0
    council_tax_reduction_carer_premium: 48.15 * 52
    council_tax_reduction_applicable_amount: (95.55 + 48.15) * 52
    council_tax_reduction_working_age_carers: 1
    council_tax_reduction_working_age_adult_premiums: 48.15 * 52

- name: The Scottish carer premium for a carer element starts with the 2021 Regulations on 1 April 2022
  # The model reads model year 2022 (2022-23) at 30 April 2022. Carer element
  # 168.81 x 12 = 2,025.72; carer premium 38.85 x 52 = 2,020.20; applicable
  # amount (77.00 + 38.85) x 52.
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: false
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
  output:
    uc_carer_element: 168.81 * 12
    council_tax_reduction_carer_premium: 38.85 * 52
    council_tax_reduction_applicable_amount: (77.00 + 38.85) * 52
    council_tax_reduction_working_age_carers: 1
    council_tax_reduction_working_age_adult_premiums: 38.85 * 52

- name: Before 1 April 2022 the Scottish scheme for persons under pension age tested Carer's Allowance only
  # Under SSI 2012/303 Sch 1 para 14, councils included the premium for an
  # applicant or partner "entitled to a carer's allowance". The model reads
  # model year 2021 (2021-22) at 30 April 2021, so the carer element, 163.73
  # x 12 = 1,964.76, brings no premium.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: false
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
  output:
    uc_carer_element: 163.73 * 12
    council_tax_reduction_carer_premium: 0
    council_tax_reduction_working_age_carers: 0
    council_tax_reduction_working_age_adult_premiums: 0

- name: The same carer in England gets no carer premium for the carer element
  # In England the model takes the working-age premiums from the Housing
  # Benefit schedule, whose carer premium needs entitlement to Carer's
  # Allowance (HB Regs 2006 Sch 3 para 17(1)).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: false
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: ENGLAND
  output:
    uc_carer_element: 209.34 * 12
    receives_uc_carer_element: true
    council_tax_reduction_carer_premium: 0
    council_tax_reduction_applicable_amount: 95.55 * 52
    council_tax_reduction_working_age_carers: 0

