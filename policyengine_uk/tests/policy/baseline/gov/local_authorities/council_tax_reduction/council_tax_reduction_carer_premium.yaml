  # Welsh councils include the premium for an applicant or partner "entitled
  # to a carer's allowance" (WSI 2013/3029 Sch 7 para 14(1)).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: false
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: WALES
  output:
    uc_carer_element: 209.34 * 12
    receives_uc_carer_element: true
    council_tax_reduction_carer_premium: 0
    council_tax_reduction_applicable_amount: 95.55 * 52
    council_tax_reduction_working_age_carers: 0

- name: A Scottish carer whose income tapers the award to nil has no award and no carer premium
  # With £20,000 of earnings the award comes to nil, which in 2026 leaves no
  # award (Welfare Reform Act 2012 s.5(1)(b); UC Regs 2013 reg 17), and para
  # 6(1)(c) does not apply, though the maximum amount still includes the
  # carer element.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: false
        employment_income: 20_000
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
  output:
    uc_carer_element: 209.34 * 12
    universal_credit: 0
    receives_uc_carer_element: false
    council_tax_reduction_carer_premium: 0
    council_tax_reduction_working_age_carers: 0

- name: In 2024 a Scottish carer whose earnings taper the award to nil has no award and no carer premium
  # The same carer in 2024-25. The maximum amount comes to (393.45 + 198.31)
  # x 12 = 7,101.12, and the taper, 0.55 x 17,942.66 = 9,868.46 on £20,000
  # of earnings less income tax and National Insurance, takes more, so the
  # award comes to nil. Until 31 March 2025 an "award of universal credit"
  # included "a universal credit award with a value of zero" (reg 4), but an
  # income that fails the financial condition leaves no award to have that
  # value (Welfare Reform Act 2012 s.5(1)(b); UC Regs 2013 reg 17), so para
  # 6(1)(c) does not apply: no carer premium, where the model would
  # otherwise include 45.60 x 52 = 2,371.20.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: false
        employment_income: 20_000
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
  output:
    uc_carer_element: 198.31 * 12
    uc_maximum_amount: 7_101.12
    uc_earned_income: 17_942.66
    universal_credit: 0
    receives_uc_carer_element: false
    is_entitled_to_carer_benefit: false
    carer_premium: 0
    council_tax_reduction_carer_premium: 0
    council_tax_reduction_working_age_carers: 0

- name: From 1 April 2025 the same Scottish carer's nil award leaves no award
  # The same carer in 2025-26. The maximum amount comes to (400.14 + 201.68)
  # x 12 = 7,221.84, and the taper again takes more, so the award comes to
  # nil. From 1 April 2025 reg 4 defines an award of universal credit as one
  # "made under Part 1 of the 2012 Act" (SSI 2025/24 reg 8), and an income
  # that tapers it to nil leaves no award, so para 6(1)(c) does not apply: no
  # carer premium. Neither of reg 10A's nil awards (a sanction, or a reclaim
  # under the UC Claims and Payments Regs 2013 reg 32A) arises.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: false
        employment_income: 20_000
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
  output:
    uc_carer_element: 201.68 * 12
    universal_credit: 0
    receives_uc_carer_element: false
    is_entitled_to_carer_benefit: false
    council_tax_reduction_carer_premium: 0
    council_tax_reduction_working_age_carers: 0

- name: A Scottish carer with both Carer Support Payment and the carer element gets one premium
  # The applicant has regular and substantial caring responsibilities under
  # both para 6(1)(a) and (c), and councils include the premium once for an
  # applicant with those responsibilities (para 5(2)): 48.15 x 52 =
  # 2,503.80, not twice that.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: true
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
  output:
    receives_carer_benefit: true
    receives_uc_carer_element: true
    carer_premium: 48.15 * 52
    council_tax_reduction_carer_premium: 48.15 * 52
    council_tax_reduction_working_age_carers: 1

- name: Scottish partners caring for the same person get one premium, whichever holds the carer element
  # Both care 35 hours. The younger receives Carer Support Payment and the
  # joint award includes the carer element for the elder (UC Regs 2013 reg
  # 29(3)). Councils include one premium under para 5(3) and (4), in respect
  # of the one whose award includes the carer element: 48.15 x 52 =
  # 2,503.80.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      elder:
        age: 45
        care_hours: 35
        would_claim_carers_allowance: false
      younger:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: true
    benunits:
      couple:
        members: [elder, younger]
    households:
      household:
        members: [elder, younger]
        country: SCOTLAND
        region: SCOTLAND
  output:
    partners_care_for_same_severely_disabled_person: true
    receives_carer_benefit: [false, true]
    receives_uc_carer_element: [true, false]
    council_tax_reduction_carer_premium: 48.15 * 52
    council_tax_reduction_working_age_carers: 1

- name: Scottish partners caring for different people get a premium each, one on Carer Support Payment and one with the carer element
  # Both care 35 hours, for different people. The younger receives Carer
  # Support Payment, and the award includes a carer element for each (UC Regs
  # 2013 reg 29(2)). Councils include the premium for each (para 5(2)): the
  # elder under para 6(1)(c), the younger under para 6(1)(a), so 2 x 48.15 x
  # 52 = 5,007.60.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      elder:
        age: 45
        care_hours: 35
        would_claim_carers_allowance: false
      younger:
        age: 40
        care_hours: 35
        would_claim_carers_allowance: true
    benunits:
      couple:
        members: [elder, younger]
        partners_care_for_same_severely_disabled_person: false
    households:
      household:
        members: [elder, younger]
        country: SCOTLAND
        region: SCOTLAND
  output:
    is_entitled_to_carer_benefit: [false, true]
    receives_uc_carer_element: [true, true]
    council_tax_reduction_working_age_carers: 2
    council_tax_reduction_working_age_adult_premiums: 2 * 48.15 * 52

- name: A Scottish pensioner's schedule has no carer element limb
  # Under Scotland's pension-age scheme, councils test entitlement to Carer's
  # Allowance or Carer Support Payment (SSI 2012/319 Sch 1 para 10(1)), and
  # the working-age variable keeps the shared premium.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 70
        care_hours: 35
        would_claim_carers_allowance: false
    benunits:
      carer_unit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
  output:
    council_tax_reduction_pensioner: true
    council_tax_reduction_carer_premium: 0
    council_tax_reduction_premiums: 0

- name: A dependant's caring does not raise the Scottish carer premium
  # Councils include the premium where "an applicant or the applicant's
  # partner" has caring responsibilities (para 5(2)). The son receives Carer
  # Support Payment for caring for his grandmother, but councils count only
  # the applicant and partner, so his parent's family gets no carer premium
  # (48.15 x 52 = 2,503.80 if his caring counted).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
      son:
        age: 17
        care_hours: 35
        would_claim_carers_allowance: true
      grandmother:
        age: 80
        aa_category: HIGHER
    benunits:
      family:
        members: [parent, son]
      grandmother_unit:
        members: [grandmother]
    households:
      household:
        members: [parent, son, grandmother]
        country: SCOTLAND
        region: SCOTLAND
  output:
    is_claimant_or_partner: [true, false, true]
    receives_carer_benefit: [false, true, false]
    carer_premium: [0, 0]
    council_tax_reduction_carer_premium: [0, 0]
    council_tax_reduction_working_age_carers: [0, 0]
