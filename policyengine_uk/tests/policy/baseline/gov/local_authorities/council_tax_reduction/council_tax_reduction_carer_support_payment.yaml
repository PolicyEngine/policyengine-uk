  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        private_pension_income: 7_000
        care_hours: 35
    benunits:
      benunit:
        members: [carer]
        would_claim_uc: false
    households:
      household:
        members: [carer]
        country: WALES
        region: WALES
        council_tax: 2_000
        savings: 0
  output:
    carers_allowance: 86.45 * 52
    carer_support_payment: 0
    scottish_carer_supplement: 0
    council_tax_reduction_applicable_income: 7_000 + 86.45 * 52
    council_tax_reduction: 1_195.40

- name: A Scottish carer who does not claim Carer Support Payment has none counted
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        private_pension_income: 7_000
        care_hours: 35
        would_claim_carers_allowance: false
    benunits:
      benunit:
        members: [carer]
        would_claim_uc: false
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
        savings: 0
  output:
    carer_support_payment: 0
    scottish_carer_supplement: 0
    council_tax_reduction_applicable_income: 7_000
    # The caring hours still give the carer premium, and 7,000 is below the
    # applicable amount of 7,472.40.
    council_tax_reduction: 2_000

- name: A working-age carer on contributory ESA above the Carer Support Payment rate has it counted in Council Tax Reduction
  # Contributory ESA (96.15 a week here) is an overlapping benefit, so CSP
  # Regs (SSI 2023/302) reg 16(2)(b) would reduce the CSP given to nil. The
  # model does not yet apply reg 16(2), so it pays and counts 86.45 x 52.
  # SSI 2021/249 reg 57(1)(b) counts CSP "to which the applicant is entitled,
  # subject to any adjustment ... in accordance with Regulations under
  # section 73 of the Social Security Administration Act 1992"; reg 16(2) is
  # made under the Social Security (Scotland) Act 2018, not section 73.
  # Whoever applies reg 16(2) must settle which amount CTR counts and update
  # this case; it fails if CTR income silently drops the CSP. Taxable income,
  # 5,000 + 4,495.40 + 608.40 = 10,103.80, is below the personal allowance
  # either way.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        esa_contrib_reported: 5_000
        care_hours: 35
    benunits:
      benunit:
        members: [carer]
        would_claim_uc: false
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
        savings: 0
  output:
    esa_contrib: 5_000
    income_tax: 0
    # 5,000 + 4,495.40. Leaving the CSP out would give 5,000, below the
    # applicable amount, and a full award of 2,000.
    council_tax_reduction_applicable_income: 5_000 + 86.45 * 52
    council_tax_reduction_applicable_amount: (95.55 + 48.15) * 52
    # 2,000 - 0.2 x (9,495.40 - 7,472.40)
    council_tax_reduction: 1_595.40

- name: Carer Support Payment counts in 2025, before the Scottish Carer Supplement
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        private_pension_income: 7_000
        care_hours: 35
    benunits:
      benunit:
        members: [carer]
        would_claim_uc: false
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
        savings: 0
  output:
    carers_allowance: 0
    carer_support_payment: 83.30 * 52
    scottish_carer_supplement: 0
    council_tax_reduction_applicable_income: 7_000 + 83.30 * 52
    council_tax_reduction_applicable_amount: (92.04 + 46.38) * 52
    # 2,000 - 0.2 x (11,331.60 - 7,197.84) = 1,173.25
    council_tax_reduction: 2_000 - 0.2 * (7_000 + 83.30 * 52 - (92.04 + 46.38) * 52)

- name: In 2024 the Scottish carer is still on Carer's Allowance, which was already counted
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 40
        private_pension_income: 7_000
        care_hours: 35
    benunits:
      benunit:
        members: [carer]
        would_claim_uc: false
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
        savings: 0
  output:
    carers_allowance: 81.90 * 52
    carer_support_payment: 0
    council_tax_reduction_applicable_income: 7_000 + 81.90 * 52
    # 2,000 - 0.2 x (11,258.80 - 7,077.20) = 1,163.68. The award no longer
    # jumps to 2,000 when the carer moves to Carer Support Payment in 2025.
    council_tax_reduction: 2_000 - 0.2 * (7_000 + 81.90 * 52 - (90.50 + 45.60) * 52)

- name: Pension-age Council Tax Reduction counts Carer Support Payment, and the supplement only through tax
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      carer:
        age: 70
        state_pension: 0
        private_pension_income: 14_000
        care_hours: 35
    benunits:
      benunit:
        members: [carer]
    households:
      household:
        members: [carer]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
        savings: 0
  output:
    carer_support_payment: 86.45 * 52
    scottish_carer_supplement: 11.70 * 52
    # Taxable income is 14,000 + 4,495.40 + 608.40 - 12,570 = 6,533.80: the
    # first 3,967 at the Scottish starter rate of 19% and 2,566.80 at 20%.
    # The supplement adds 608.40 x 20% = 121.68 of that tax.
    income_tax: 3_967 * 0.19 + 2_566.80 * 0.20
    # 14,000 + 4,495.40 - 1,267.09: the supplement is not added.
    council_tax_reduction_applicable_income: 14_000 + 86.45 * 52 - 1_267.09
    council_tax_reduction_applicable_amount: (256 + 48.15) * 52
    # Income is above the minimum guarantee of (238 + 48.15) x 52 = 14,879.80.
    guarantee_credit: 0
    # 2,000 - 0.2 x (17,228.31 - 15,815.80)
    council_tax_reduction: 1_717.50

- name: A pension-age couple's Council Tax Reduction counts the partner's Carer Support Payment
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        state_pension: 0
        private_pension_income: 12_000
      partner:
        age: 70
        state_pension: 0
        private_pension_income: 6_500
        care_hours: 35
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
        savings: 0
  output:
    # 86.45 x 52 and 11.70 x 52, for the partner.
    carer_support_payment: [0, 4_495.40]
    scottish_carer_supplement: [0, 608.40]
    # Each is below the personal allowance: 12,000, and 6,500 + 4,495.40 +
    # 608.40 = 11,603.80.
    income_tax: [0, 0]
    council_tax_reduction_applicable_income: 12_000 + 6_500 + 86.45 * 52
    council_tax_reduction_applicable_amount: (383.35 + 48.15) * 52
    # Income is above the minimum guarantee of (363.25 + 48.15) x 52 =
    # 21,392.80.
    guarantee_credit: 0
    # 2,000 - 0.2 x (22,995.40 - 22,438.00)
    council_tax_reduction: 1_888.52

- name: A pension-age carer whose State Pension exceeds the Carer Support Payment rate has it counted in Council Tax Reduction
  # The partner's State Pension (142.31 a week) exceeds the CSP rate, so CSP
  # Regs (SSI 2023/302) reg 16(2)(b) would reduce the CSP given to them to
  # nil. The model does not yet apply reg 16(2), so it pays and counts
  # 86.45 x 52. Whether pension-age CTR should count CSP before or after that
  # reduction is open. SSI 2012/319 reg 27(3) counts a benefit before any
  # deduction other than the reg 27(5) adjustments, and reg 27(5) lists the
  # Overlapping Benefits Regulations 1979 but not reg 16(2). Whoever applies
  # reg 16(2) must settle which amount CTR counts and update this case; it
  # fails if CTR income silently drops the CSP. The figures isolate that
  # choice. The couple is unmarried, so no marriage allowance links the
  # claimant's tax to the partner's income. The partner's taxable income,
  # 7,400 + 4,495.40 + 608.40 = 12,503.80, is below the personal allowance,
  # so the tax is the same whether or not the CSP is paid. Guarantee Credit
  # is nil either way.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        state_pension: 15_000
      partner:
        age: 70
        state_pension: 7_400
        care_hours: 35
    benunits:
      benunit:
        members: [claimant, partner]
        is_married: false
    households:
      household:
        members: [claimant, partner]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
        savings: 0
  output:
    # (15,000 - 12,570) x 19%, all in the Scottish starter band.
    income_tax: [461.70, 0]
    # Income is above the minimum guarantee of (363.25 + 48.15) x 52 =
    # 21,392.80 with or without the CSP: 15,000 + 7,400 - 461.70 = 21,938.30.
    guarantee_credit: 0
    # 15,000 + 7,400 + 86.45 x 52 - 461.70. Leaving the CSP out would give
    # 21,938.30, below the applicable amount, and a full award of 2,000.
    council_tax_reduction_applicable_income: 15_000 + 7_400 + 86.45 * 52 - 461.70
    council_tax_reduction_applicable_amount: (383.35 + 48.15) * 52
    # 2,000 - 0.2 x (26,433.70 - 22,438.00)
    council_tax_reduction: 1_200.86

- name: A pension-age couple below the applicable amount keeps full Council Tax Reduction
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        state_pension: 0
        private_pension_income: 9_000
      partner:
        age: 70
        state_pension: 0
        private_pension_income: 6_500
        care_hours: 35
    benunits:
      benunit:
        members: [claimant, partner]
    households:
      household:
        members: [claimant, partner]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
        savings: 0
  output:
    carer_support_payment: [0, 4_495.4]
    # Guarantee Credit is paid: 21,392.80 - 19,995.40. Pension Credit income
    # counts the Carer Support Payment component.
    guarantee_credit: (363.25 + 48.15) * 52 - (9_000 + 6_500 + 86.45 * 52)
    # A guarantee credit recipient's whole income is disregarded (SSI 2012/319
    # reg 24), so the Carer Support Payment does not reach the means test.
    council_tax_reduction_applicable_income: 0
    council_tax_reduction: 2_000

