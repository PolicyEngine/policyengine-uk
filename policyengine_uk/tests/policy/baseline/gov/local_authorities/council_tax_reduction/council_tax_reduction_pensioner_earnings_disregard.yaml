    council_tax_reduction_pensioner_earnings_disregard: 364

- name: England pensioner lone parent has 25 a week disregarded, not 25 plus 5
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 70
        employment_income: 2_000
        weekly_hours: 10
      child:
        age: 10
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        country: ENGLAND
  output:
    # 25 x 52. Para 8's 5 is not added (as for Housing Benefit, DWP HB
    # guidance BP2 para P2.159). 10 hours meets no work condition.
    council_tax_reduction_pensioner_earnings_disregard: 1_300

- name: England pensioner working 30 hours gets the additional 17.10 a week
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        employment_income: 10_000
        weekly_hours: 30
    benunits:
      benunit:
        members: [pensioner]
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    meets_housing_benefit_additional_earnings_disregard_conditions: true
    # (5 + 17.10) x 52 = 260 + 889.20; net earnings 10,000 >= 1,149.20.
    council_tax_reduction_pensioner_earnings_disregard: 1_149.20

- name: England pensioner working 29 hours does not get the additional disregard
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        employment_income: 10_000
        weekly_hours: 29
    benunits:
      benunit:
        members: [pensioner]
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    meets_housing_benefit_additional_earnings_disregard_conditions: false
    council_tax_reduction_pensioner_earnings_disregard: 260

- name: Net earnings exactly equal to the disregards and 17.10 meet the earnings test
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        employment_income: 1_149.20
        weekly_hours: 30
    benunits:
      benunit:
        members: [pensioner]
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    # Para 10(1): "equal or exceed" 260 + 0 childcare + 889.20 = 1,149.20.
    council_tax_reduction_pensioner_earnings_disregard: 1_149.20

- name: Net earnings a penny short of the disregards and 17.10 fail the earnings test
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        employment_income: 1_149.19
        weekly_hours: 30
    benunits:
      benunit:
        members: [pensioner]
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    council_tax_reduction_pensioner_earnings_disregard: 260

- name: England disabled pensioner working 20 hours gets the additional disregard
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        employment_income: 10_000
        weekly_hours: 20
        is_disabled_for_benefits: true
    benunits:
      benunit:
        members: [pensioner]
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    # Para 10(2)(b)(iv): 16 hours and para 5(1) satisfied. The model gives
    # 5 + 17.10 = 1,149.20 a year; the law gives the para 5(1) 20 in place of
    # the 5, so 1,929.20. The 20 disregards are a known limitation.
    council_tax_reduction_pensioner_earnings_disregard: 1_149.20

