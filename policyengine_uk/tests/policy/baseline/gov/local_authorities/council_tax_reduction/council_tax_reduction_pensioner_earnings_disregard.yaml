# Pensioner Council Tax Reduction earnings disregards.
#
# SI 2012/2885 (England) Sch 4, WSI 2013/3029 (Wales) Sch 3 and SSI 2012/319
# (Scotland) Sch 2 disregard from a pension-age applicant's and partner's net
# earnings £25 a week for a lone parent (para 2), otherwise £5 with no partner
# or £10 with a partner (para 8), plus £17.10 (para 10) where a work condition
# is met and net earnings at least equal the other disregards, the deductible
# childcare charges and £17.10. Scotland read £37.10 for £17.10 from 6 April
# 2020 to 4 April 2021 (SSI 2020/108 reg 3(a)); England and Wales did not.
#
# Every person here is aged 70 (pension age, no employee National Insurance)
# unless stated, and earns less than the personal allowance, so net earnings
# equal gross earnings unless stated. Annual figures are weekly x 52.

- name: England pensioner without earnings has no earnings disregard
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        state_pension: 15_000
    benunits:
      benunit:
        members: [pensioner]
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    council_tax_reduction_pensioner_earnings_disregard: 0

- name: England single pensioner earning 1,000 a year has 5 a week disregarded
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        employment_income: 1_000
    benunits:
      benunit:
        members: [pensioner]
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    housing_benefit_net_earnings: 1_000
    # 5 x 52.
    council_tax_reduction_pensioner_earnings_disregard: 260

- name: England single pensioner earning 3 a week has all 3 disregarded
  period: 2026
  absolute_error_margin: 0.01
