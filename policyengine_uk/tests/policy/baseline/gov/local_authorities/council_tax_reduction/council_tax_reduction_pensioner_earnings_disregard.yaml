- name: England pensioner with State Pension and earnings has 5 a week of earnings disregarded in CTR
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        state_pension: 15_000
        employment_income: 1_000
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 0
  output:
    # (15,000 + 1,000 - 12,570) x 20%.
    income_tax: 686
    guarantee_credit: 0
    in_receipt_of_savings_credit_only: false
    # 1,000 - 686 x 1,000 / 16,000.
    housing_benefit_net_earnings: 957.13
    council_tax_reduction_pensioner_earnings_disregard: 260
    # 15,000 + 1,000 - 686 - 260 (main: 15,314).
    council_tax_reduction_applicable_income: 15_054
    council_tax_reduction_applicable_amount: 13_312
    # 2,000 - 20% x (15,054 - 13,312) (main: 1,599.60).
    council_tax_reduction: 1_651.60
