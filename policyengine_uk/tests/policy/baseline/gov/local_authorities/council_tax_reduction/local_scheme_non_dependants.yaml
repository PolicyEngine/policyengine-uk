# Non-dependant deductions in the English working-age local schemes.
#
# Each council's scheme reproduces the Default Scheme's definition: a
# non-dependant is anyone who normally resides with the applicant other than
# a member of the applicant's family (a partner, or a child or qualifying young
# person the applicant is responsible for), a joint occupier, a commercial
# lodger or a paid carer (para 9; Oxford paras 42 and Annex 1). So an adult in
# the applicant's own benefit unit who is not the claimant, partner, child or
# young person is a non-dependant, and so is each adult in another family.
# Each non-dependant aged 18 or over is banded on their own normal gross weekly
# income and is in remunerative work on their own hours (para 30(1)-(2) and
# para 10); a couple's income is joint and the couple pays one deduction, the
# higher (para 30(3)-(4); Oxford para 44), except that Merton and Kingston
# upon Thames deduct for each member of a couple with a Universal Credit
# award. The benefit-receipt exemptions (para 30(8)) apply to the person on
# the award: a family's award is its claimant's and partner's.
#
# Weekly amounts for 2026-27 (52 weeks a year):
# - Merton (para 30) and Westminster (Appendix A), Oxford (para 43): £5.20 not
#   in remunerative work or under £279; £10.60 from £279; £13.30 from £485;
#   £15.95 from £605.
# - Kingston upon Thames (para 30A): £5.64; £11.50 from £279; £14.43 from
#   £485; £17.31 from £605.
# - Newham (para 30B): £7.54; £14.96 from £183; £18.84 from £316; £22.61 from
#   £394.
# Earnings of £30,000 are £576.92 a week, £20,000 are £384.62 and £12,000 are
# £230.77. The claimant has no income and no capital, so Merton, Kingston
# upon Thames, Westminster and Oxford support 100% of the £1,800 council tax
# and Newham 70% (£1,260), less the deductions.
#
# The claimant and partner flags are set because the model's inference treats
# an adult child as a lone parent's partner.

- name: Merton charges the applicant's own non-dependant son for his own earnings
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        is_household_head: true
        is_claimant_or_partner: true
      son:
        age: 25
        is_claimant_or_partner: false
        employment_income: 30_000
        weekly_hours: 37.5
    benunits:
      benunit:
        members: [parent, son]
        would_claim_uc: false
        claims_all_entitled_benefits: true
    households:
      household:
        members: [parent, son]
        country: ENGLAND
        local_authority: MERTON
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_individual_non_dep_deduction_eligible: [false, true]
    # £13.30 a week on £576.92.
    merton_council_tax_reduction_individual_non_dep_deduction: [0, 691.60]
    merton_council_tax_reduction_non_dep_deductions: 691.60
    council_tax_reduction: 1_108.40

- name: Merton charges a 19-year-old who has left education in the applicant's benefit unit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
