- name: Pensioner Child Benefit exclusion keeps SSP and SMP counted once as earnings
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older: {age: 70, is_parent: true, state_pension: 12000, statutory_sick_pay: 1000}
      partner: {age: 30, is_parent: true, gender: FEMALE, statutory_maternity_pay: 2000}
      baby: {age: 0}
    benunits:
      family:
        members: [older, partner, baby]
        would_claim_pc: false
        would_claim_uc: false
    households:
      home:
        members: [older, partner, baby]
        region: LONDON
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 3000
        savings: 0
  output:
    child_benefit: 1406.60
    council_tax_reduction_pensioner: true
    income_tax: [0, 0, 0]
    council_tax_reduction_pensioner_earnings_disregard: 520
    # Default marriage election removes the otherwise86tax.
    # 12000 + 1000 + 2000 - 0 tax - 10*52 disregard = 14480.
    council_tax_reduction_applicable_income: 14480
    council_tax_reduction: 3000
