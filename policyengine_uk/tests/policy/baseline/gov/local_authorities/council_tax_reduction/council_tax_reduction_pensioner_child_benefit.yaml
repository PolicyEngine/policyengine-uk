# Current GB pensioner income exclusions: England Sch1 para16(1)(j)(vi),
# Wales Sch1 para10(1)(j)(vi), Scotland reg27(1)(j)(vii).
# Model2026: eldest Child Benefit27.05*52=1406.60; aged allowance256*52=13312.
# These genuine claim/takeup inputs use the general rules, not PC overrides.
- name: England pensioner Child Benefit is excluded before the CTR taper
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent: {age: 70, is_parent: true, state_pension: 16000}
      child: {age: 9}
    benunits:
      family:
        members: [parent, child]
        would_claim_pc: false
        would_claim_uc: false
    households:
      home:
        members: [parent, child]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 3000
        savings: 0
  output:
    child_benefit: 1406.60
    income_tax: [686, 0]
    council_tax_reduction_pensioner: true
    in_receipt_of_guarantee_credit: false
    in_receipt_of_savings_credit_only: false
    council_tax_reduction_applicable_income: 15314
    council_tax_reduction_applicable_amount: 13312
    # 3000 - .2*(16000 - 686 - 13312) = 2599.60.
    council_tax_benefit: 2599.60
    council_tax_reduction: 2599.60

