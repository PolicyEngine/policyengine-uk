# Where families share the rent, each jointly liable family claims Council Tax
# Reduction on its own share, and its claim follows its own circumstances:
# - the scheme: a "pensioner" is defined per person and partner (SI 2012/2885
#   reg 3; SI 2012/2886 Sch para 3; SI 2013/3029 reg 3; SSI 2021/249 reg 3;
#   SSI 2012/319 reg 12), so a working-age family takes the working-age rules
#   even if the household head's family is pension-age, and the reverse;
# - the non-dependant exemption: no deduction if "the applicant or [their]
#   partner" is blind or gets a listed disability benefit (SI 2012/2885 Sch 1
#   para 8(6); SI 2012/2886 Sch para 30(6); SI 2013/3029 Sch 1 para 3(6) and
#   Sch 6 para 5(6); SSI 2021/249 reg 90(6); SSI 2012/319 reg 48(6)).
# Each family here claims half of a 1,800 bill: 900.

- name: Oxford, pension-age head and working-age sharer each claim under their own scheme
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        is_household_head: true
      sharer:
        age: 40
    benunits:
      head_family:
        members: [head]
        would_claim_uc: false
        council_tax_reduction_applicable_income: 0
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
        would_claim_uc: false
        # 500 a week.
        council_tax_reduction_applicable_income: 26_000
    households:
      home:
        members: [head, sharer]
        rent: 18_000
        tenure_type: RENT_PRIVATELY
        council_tax: 1_800
        savings: 0
        country: ENGLAND
        local_authority: OXFORD
  output:
    council_tax_reduction_claimant_benunit: [true, true]
    council_tax_reduction_joint_liability_share: [0.5, 0.5]
    council_tax_reduction_pensioner: [true, false]
    council_tax_reduction_scheme_supported: [true, true]
    # Oxford's working-age scheme: 500 a week is in the 75% band, 900 x 75%.
    oxford_council_tax_reduction: [0, 675]
    # The head takes the English pensioner scheme: no income, 900.
    simulated_council_tax_reduction_benunit: [900, 675]
    council_tax_benefit: [900, 675]
    council_tax_reduction: 1_575

- name: Oxford, working-age head and pension-age sharer each claim under their own scheme
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        is_household_head: true
      sharer:
        age: 70
    benunits:
      head_family:
        members: [head]
        would_claim_uc: false
        council_tax_reduction_applicable_income: 26_000
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
        would_claim_uc: false
        council_tax_reduction_applicable_income: 15_000
    households:
      home:
        members: [head, sharer]
        rent: 18_000
        tenure_type: RENT_PRIVATELY
        council_tax: 1_800
        savings: 0
        country: ENGLAND
        local_authority: OXFORD
  output:
    council_tax_reduction_pensioner: [false, true]
    council_tax_reduction_scheme_supported: [true, true]
    oxford_council_tax_reduction: [675, 0]
    # The sharer takes the English pensioner scheme, not Oxford's income
    # bands (which would give 100% at 288 a week): the single pension-age
    # applicable amount is 13,312 a year (256.00 a week x 52), so
    # 900 - 20% x (15,000 - 13,312) = 562.40.
    council_tax_reduction_applicable_amount: [4_968.60, 13_312]
    simulated_council_tax_reduction_benunit: [675, 562.40]
    council_tax_reduction: 1_237.40

- name: Merton, a non-dependant of both claimants is deducted under each claimant's own scheme
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        is_household_head: true
      sharer:
        age: 40
      adult_son:
        age: 25
        employment_income: 30_000
        weekly_hours: 37.5
    benunits:
      head_family:
        members: [head]
        would_claim_uc: false
        council_tax_reduction_applicable_income: 0
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
        would_claim_uc: false
        council_tax_reduction_applicable_income: 0
      son_family:
        members: [adult_son]
        would_claim_uc: false
    households:
      home:
        members: [head, sharer, adult_son]
        rent: 18_000
        tenure_type: RENT_PRIVATELY
        council_tax: 1_800
        savings: 0
        country: ENGLAND
        local_authority: MERTON
  output:
    council_tax_reduction_pensioner: [true, false, false]
    council_tax_reduction_joint_liability_share: [0.5, 0.5, 1]
    council_tax_reduction_individual_non_dep_deduction_eligible: [false, false, true]
    # The son's gross 576.92 a week is in Merton's 485-605 band: 13.30 a week
    # (691.60 a year), whatever the head's age.
    merton_council_tax_reduction_individual_non_dep_deduction: [0, 0, 691.60]
    # The son is a non-dependant of both: each claim bears half of him.
    merton_council_tax_reduction_non_dep_deductions: [345.80, 345.80, 0]
    # The sharer's claim is under Merton's working-age scheme:
    # 900 - 345.80 = 554.20. The head's is under the pensioner scheme, with
    # the national non-dependant amounts.
    merton_council_tax_reduction: [0, 554.20, 0]

