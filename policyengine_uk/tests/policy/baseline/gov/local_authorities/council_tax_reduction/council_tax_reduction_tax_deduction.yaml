    council_tax_reduction_tax_deduction: 13_992

- name: England's pensioner scheme deducts a working-age partner's Class 1 contributions
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        private_pension_income: 20_000
      partner:
        age: 60
        employment_income: 20_000
    benunits:
