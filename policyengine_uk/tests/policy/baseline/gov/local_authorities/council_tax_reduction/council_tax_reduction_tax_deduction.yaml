# Income tax and National Insurance deducted from Council Tax Reduction income.
# - Scotland, working age (SSI 2021/249): reg 50(3)(a) reads "Earnings do not
#   include— (a) any amount deducted from them by way of income tax or
#   primary Class 1 contributions under the 1992 Act". The Scottish Ministers
#   set the same rule with Universal Credit (regs 49(6)(b) and 51(2) step 3)
#   and gave no tax deduction for unearned income (regs 57 to 65). Without
#   Universal Credit, reg 51(9) applies SSI 2012/303 regs 37 and 38, which
#   price the tax and contributions on self-employed profit notionally: the
#   basic rate on chargeable income less only the personal allowance, and
#   Class 4 at the main rate between the lower and upper limits.
# - Pension age: SSI 2012/319 reg 31(12), "In the case of any income taken
#   into account for the purpose of calculating a person's income, any amount
#   payable by way of tax must be disregarded"; SI 2012/2885 Sch 1 para 17(13)
#   and WSI 2013/3029 Sch 1 para 11(13) read the same. Reg 33(2)(a), para
#   19(2)(a) and para 13(2)(a) deduct the income tax and Class 1 deducted from
#   earnings, and reg 37, para 30 and para 24 price self-employed profit
#   notionally, as at working age.
# No provision says how to split one income tax liability. The model follows
# the choice settled for Pension Credit on PolicyEngine/policyengine-uk#2019
# (option (a)): the tax on earnings is the extra tax the earnings cause, with
# the earnings as the top slice of income and self-employed profit beneath
# them. In the pensioner schemes the tax on the other counted income is the
# tax it bears with the uncounted income above it.
#
# 2026-27 rates. Personal allowance 12,570. Scottish bands on taxable non-
# savings income: 19% to 3,967, 20% to 16,956, 21% to 31,092, 42% to 62,430.
# UK basic rate 20% to 37,700, higher rate 40%. Savings: starting rate band
# 5,000 less taxable non-savings income; personal savings allowance 1,000 for
# a basic-rate taxpayer and 500 for a higher-rate one. Class 1 primary
# contributions 8% above 241.73 a week (12,569.96 a year). Class 4 6% from
# 12,570 to 50,270. Each family is a single adult with no Pension Credit or
# Universal Credit unless stated.

- name: Scotland's working-age scheme deducts the tax that pay adds to a pension
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      adult:
        age: 40
        employment_income: 20_000
        private_pension_income: 10_000
    benunits:
      benunit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
  output:
    # Tax with the pay: 30,000 - 12,570 = 17,430 taxable; 3,967 x 19% = 753.73,
    # 12,989 x 20% = 2,597.80 and 474 x 21% = 99.54, so 3,451.07. Tax without
    # the pay: 10,000 is below the personal allowance, so nil. The pay adds
    # 3,451.07. Class 1: (20,000 - 12,569.96) x 8% = 594.40.
    council_tax_reduction_tax_deduction: 4_045.47
    # 20,000 + 10,000 - 4,045.47.
    council_tax_reduction_applicable_income: 25_954.53

- name: Scotland's working-age scheme deducts the savings tax that pay adds
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      adult:
        age: 40
        employment_income: 30_000
        savings_interest_income: 60_000
    benunits:
      benunit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        country: SCOTLAND
        region: SCOTLAND
        council_tax: 2_000
  output:
    # With the pay: non-savings 17,430 taxable, 3,451.07 as above. Savings
    # 60,000 sit above 17,430 in the UK bands: no starting rate; 500 personal
    # savings allowance; 37,700 - 17,430 - 500 = 19,770 x 20% = 3,954; and
    # 60,000 - 20,270 = 39,730 x 40% = 15,892. Total 23,297.07.
    # Without the pay: 60,000 - 12,570 = 47,430 taxable savings; 5,000 at the
    # starting rate and 500 allowance at nil, 32,200 x 20% = 6,440 and
    # 9,730 x 40% = 3,892, so 10,332. The pay adds 12,965.07.
    # Class 1: (30,000 - 12,569.96) x 8% = 1,394.40.
    council_tax_reduction_tax_deduction: 14_359.47
    # The scheme counts the pay alone: 30,000 - 14,359.47.
    council_tax_reduction_applicable_income: 15_640.53

