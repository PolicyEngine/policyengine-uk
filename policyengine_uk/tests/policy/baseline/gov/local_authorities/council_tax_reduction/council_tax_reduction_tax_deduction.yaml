    households:
      household:
        members: [adult]
        country: WALES
        region: WALES
        council_tax: 2_000
  output:
    # The formula leaves this scheme as the legacy means tests have it: the
    # income tax less the tax the interest would bear without the pay
    # (legacy_means_test_deducted_income_tax), and National Insurance.
    # With the pay: non-savings 20,000 - 12,570 = 7,430 taxable, x 20% =
    # 1,486; the interest above it gets no starting rate, a 1,000 personal
    # savings allowance and 19,000 x 20% = 3,800, so 5,286. Without the pay:
    # 20,000 - 12,570 = 7,430 of taxable interest, 5,000 at the starting rate
    # and 1,000 allowance at nil, 1,430 x 20% = 286. 5,286 - 286 = 5,000.
    # Class 1: (20,000 - 12,569.96) x 8% = 594.40.
    legacy_means_test_deducted_income_tax: 5_000
    council_tax_reduction_tax_deduction: 5_594.40
    # The scheme counts the pay but not the interest: 20,000 - 5,594.40.
    council_tax_reduction_applicable_income: 14_405.60

