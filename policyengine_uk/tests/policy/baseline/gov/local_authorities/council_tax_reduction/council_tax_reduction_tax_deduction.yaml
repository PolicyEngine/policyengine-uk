- name: Wales's working-age scheme deducts the tax the legacy means tests deduct
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      adult:
        age: 40
        employment_income: 20_000
        savings_interest_income: 20_000
    benunits:
