        members: [pensioner, partner]
        would_claim_uc: false
    households:
      household:
        members: [pensioner, partner]
        country: ENGLAND
        region: NORTH_WEST
        council_tax: 2_000
  output:
    # Under para 19(2)(a), the council deducts the income tax and primary
    # Class 1 deducted from the partner's pay. T: the pension bears (20,000 -
    # 12,570) x 20% = 1,486 and the pay the same 1,486, so 2,972. Without the
    # pay the partner has no income, and the model transfers 1,260 of
    # Marriage Allowance to the pensioner, whose tax falls to (20,000 -
    # 12,570 - 1,260) x 20% = 1,234: T(E) = 1,234, so the pay adds 2,972 -
    # 1,234 = 1,738. T(E, S, U) = 1,234. Class 1 (20,000 - 12,569.96) x 8% =
    # 594.40. 1,738 + 1,234 + 594.40 = 3,566.40.
    council_tax_reduction_tax_deduction: 3_566.40
    # 40,000 - 3,566.40 - the 10 a week couple's earnings disregard (520).
    council_tax_reduction_applicable_income: 35_913.60

