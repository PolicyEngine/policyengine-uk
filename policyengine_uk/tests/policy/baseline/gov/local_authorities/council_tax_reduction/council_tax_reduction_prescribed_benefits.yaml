- name: A guarantee credit recipient with IIDB has nil Council Tax Reduction income
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        state_pension: 150 * 52
        iidb_reported: 46.78 * 52
    benunits:
      benunit:
        members: [pensioner]
        would_claim_pc: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        region: SOUTH_EAST
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    # 7,800 + 2,432.56 = 10,232.56, or 196.78 a week, below the 238.00
    # minimum guarantee (SPC Regs 2002 reg 15(1) counts IIDB).
    pension_credit_income: (150 + 46.78) * 52
    in_receipt_of_guarantee_credit: true
    # SI 2012/2885 Sch 1 para 13: the whole income is disregarded.
    council_tax_reduction_applicable_income: 0
    council_tax_benefit: 2_000
