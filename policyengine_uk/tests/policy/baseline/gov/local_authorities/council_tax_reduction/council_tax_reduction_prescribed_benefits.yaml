  output:
    income_tax: 0
    # 12,547.60 + 12,162.80
    council_tax_reduction_applicable_income: 241.30 * 52 + 233.90 * 52

- name: IIDB counts as pension-age Council Tax Reduction income in Scotland
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 80
        state_pension: 241.30 * 52
        iidb_reported: 46.78 * 52
    benunits:
      benunit:
        members: [pensioner]
        would_claim_pc: false
    households:
      household:
        members: [pensioner]
        country: SCOTLAND
        region: SCOTLAND
        local_authority: GLASGOW_CITY
        council_tax: 2_000
        savings: 0
  output:
    income_tax: 0
    # 12,547.60 + 2,432.56
    council_tax_reduction_applicable_income: 241.30 * 52 + 46.78 * 52
    council_tax_reduction_applicable_amount: 256.00 * 52
    # 2,000 - 0.2 x (14,980.16 - 13,312.00) = 1,666.37
    council_tax_benefit: 2_000 - 0.2 * ((241.30 + 46.78 - 256.00) * 52)

