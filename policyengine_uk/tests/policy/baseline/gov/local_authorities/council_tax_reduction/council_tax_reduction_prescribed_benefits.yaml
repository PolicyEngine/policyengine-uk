- name: IIDB and IB count as working-age Council Tax Reduction income in Scotland
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 50
        iidb_reported: 46.78 * 52
        incapacity_benefit_reported: 146.60 * 52
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
    households:
      household:
        members: [claimant]
        country: SCOTLAND
        region: SCOTLAND
        local_authority: GLASGOW_CITY
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_pensioner: false
    income_tax: 0
    # 2,432.56 + 7,623.20
    council_tax_reduction_applicable_income: (46.78 + 146.60) * 52
    council_tax_reduction_applicable_amount: 95.55 * 52
    # 2,000 - 0.2 x (10,055.76 - 4,968.60) = 982.57
    council_tax_benefit: 2_000 - 0.2 * ((46.78 + 146.60 - 95.55) * 52)

- name: Taxable IB counts net of income tax under the Westminster scheme
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 55
        incapacity_benefit_reported: 146.60 * 52
        private_pension_income: 10_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: false
    households:
      household:
        members: [claimant]
        country: ENGLAND
        region: LONDON
        local_authority: WESTMINSTER
        council_tax: 2_000
        savings: 0
  output:
    # 0.2 x (7,623.20 + 10,000 - 12,570) = 1,010.64
    income_tax: 0.2 * (146.60 * 52 + 10_000 - 12_570)
    # 17,623.20 - 1,010.64 = 16,612.56
    council_tax_reduction_applicable_income: 146.60 * 52 + 10_000 - 0.2 * (146.60 * 52 + 10_000 - 12_570)

