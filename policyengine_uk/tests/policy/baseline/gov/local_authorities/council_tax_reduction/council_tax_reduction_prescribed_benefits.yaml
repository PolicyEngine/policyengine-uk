# Industrial injuries disablement benefit (IIDB), severe disablement allowance
# (SDA), incapacity benefit (IB) and war pensions in Council Tax Reduction
# income.
#
# Every scheme counts IIDB, SDA and IB:
# - England, pensioners: SI 2012/2885 Sch 1 para 16(1)(j), social security
#   benefits other than those listed; (j)(v) excepts only IIDB's increases
#   under SSCBA 1992 ss.104 and 105.
# - English working-age schemes: gross income (SI 2012/2886 Sch para 54(1))
#   less Sch 8, which disregards none of the three (para 14 disregards
#   "attendance allowance", defined to include the ss.104 and 105 increases).
#   Kingston upon Thames, Merton and Newham copy the default scheme; Oxford's
#   para 24 counts income other than earnings unless its Appendix 5 lists it.
# - Wales: WSI 2013/3029 Sch 1 para 10(1)(j) and Sch 6 para 17(1) with Sch 9.
# - Scotland: SSI 2012/319 reg 27(1)(j) (pension age) and SSI 2021/249 reg
#   57(1)(b)(ix) to (xi) (working age, a closed list).
#
# War pensions and AFCS payments (afcs, war_widows_pension):
# - Scotland counts none of them: SSI 2012/319 reg 31(10) and Sch 3 para 1
#   disregard each payment in full, and SSI 2021/249 reg 57(1) does not name
#   them.
# - England and Wales prescribe a £10 a week disregard (SI 2012/2885 Sch 5
#   para 1; WSI 2013/3029 Sch 4 para 1 and Sch 9 para 20) that councils may
#   exceed (WSI 2013/3029 reg 34(5); LGFA 1992 Sch 1A para 2(11) and
#   s.13A(1)(c)). The model takes the full disregard where it cannot see the
#   council's choice.
# - Of the councils whose schemes the model reads, Westminster disregards war
#   pensions in full and Oxford ignores them for applicants without Universal
#   Credit. Newham's scheme keeps the £10, but its discretionary reduction
#   policy (para 2.1) automatically adds what a full disregard would give.
#   Kingston upon Thames's schedules keep the £10 while its para 36(6) speaks
#   of a full disregard, and Merton's "in full" disregard is "subject to
#   paragraph 40" (a £20 a week limit). The model approximates all of them
#   with the full disregard.
# - Only the applicant's and partner's IIDB, SDA and IB count (SI 2012/2885
#   Sch 1 para 11; SSI 2021/249 reg 36(1)), not a dependant's.
#
# Weekly rates, 2026-27 (SI 2026/148 Sch 1, restating SSCBA 1992 Sch 4):
# disablement pension at 100% 233.90, 50% 116.95, 20% 46.78; long-term
# incapacity benefit 146.60; severe disablement allowance 103.85 plus the
# higher age related addition 15.50, 119.35 in all. Full new State Pension
# 241.30 (SI 2026/148 art 6(1)), 12,547.60 a year, below the 12,570 personal
# allowance. IIDB, SDA and war pensions are not taxed in the model; State
# Pension and IB are. Pension Credit standard minimum guarantee 238.00
# (single). CTR applicable amounts: personal allowance 256.00 for a single
# person who reached pensionable age before 1 April 2021 (SI 2012/2885 Sch 2
# para 1, as uprated by SI 2026/27 reg 6; SSI 2026/56 reg 6 in Scotland), so
# the pensioners with an award asserted below are 80; and 95.55 for a single
# person aged 25 or over in Scotland's working-age scheme (SSI 2026/56 reg
# 14). The reduction is withdrawn at 20% of income above the applicable
# amount. Council tax is 2,000 throughout.

- name: IIDB counts as pension-age Council Tax Reduction income in England
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 80
        state_pension: 241.30 * 52
        iidb_reported: 116.95 * 52
    benunits:
      benunit:
        members: [pensioner]
        would_claim_pc: false
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        region: SOUTH_EAST
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_pensioner: true
    income_tax: 0
    # 12,547.60 + 6,081.40
    council_tax_reduction_applicable_income: 241.30 * 52 + 116.95 * 52
    council_tax_reduction_applicable_amount: 256.00 * 52
    # 2,000 - 0.2 x (18,629.00 - 13,312.00) = 936.60
    council_tax_benefit: 2_000 - 0.2 * ((241.30 + 116.95 - 256.00) * 52)

