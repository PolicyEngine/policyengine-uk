# Outside the Pension Credit, Universal Credit and passported routes, each
# scheme calculates capital at its current market or surrender value less,
# where there would be expenses attributable to the sale, 10 per cent, and
# less the amount of any encumbrance secured on it (SI 2012/2885 Sch 1 para
# 32; SI 2012/2886 Sch para 65; WSI 2013/3029 Sch 1 para 26 and Sch 6 para
# 28; SSI 2012/319 reg 42; SSI 2012/303 reg 46; SSI 2021/249 reg 70(1)).
# Expected values are worked by hand from those provisions.

- name: The household route values mortgaged land less sale expenses and the mortgage
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      applicant:
        age: 40
    benunits:
      benunit:
        members: applicant
        would_claim_uc: false
    households:
      household:
        members: applicant
        country: ENGLAND
        local_authority: MAIDSTONE
        # 50,000 less 10% (5,000) less the 20,000 secured on it = 25,000.
        owned_land: 50_000
        owned_land_secured_debt: 20_000
  output:
    council_tax_reduction_assessable_capital: 25_000

# Each scheme calculates capital outside the United Kingdom at its current
# market or surrender value in that country, or, where that country prohibits
# transferring that value to the United Kingdom, at the price it would realise
# if sold in the United Kingdom to a willing buyer, less, where there would be
# expenses attributable to sale, 10 per cent and the amount of any
# encumbrances secured on it (SI 2012/2885 Sch 1 para 33; SI 2012/2886 Sch
# para 66; WSI 2013/3029 Sch 1 para 27 and Sch 6 para 29; SSI 2012/319 reg
# 43; SSI 2012/303 reg 47; SSI 2021/249 reg 70(2) with reg 70(1)). Other real
# estate, whose location the data don't record, falls under one rule or the
# other, and both take off 10%. The data hold no secured debt for either, so
# the household route counts each at 90% of its value. Each case puts a
# working-age applicant without Universal Credit and a pensioner without
# Pension Credit in households of their own.

- name: England's schemes count overseas property less 10% outside the Pension Credit and Universal Credit routes
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      worker:
        age: 40
      pensioner:
        age: 70
    benunits:
      worker_unit:
        members: worker
        would_claim_uc: false
      pensioner_unit:
        members: pensioner
        would_claim_pc: false
    households:
      worker_home:
        members: worker
        country: ENGLAND
        local_authority: MAIDSTONE
        overseas_property_value: 100_000
      pensioner_home:
        members: pensioner
        country: ENGLAND
        local_authority: MAIDSTONE
        overseas_property_value: 100_000
  output:
    council_tax_reduction_pensioner: [false, true]
    # 100,000 less 10% (10,000) = 90,000.
    council_tax_reduction_assessable_capital: [90_000, 90_000]

- name: England's schemes count other real estate less 10% outside the Pension Credit and Universal Credit routes
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      worker:
        age: 40
      pensioner:
        age: 70
    benunits:
      worker_unit:
        members: worker
        would_claim_uc: false
      pensioner_unit:
        members: pensioner
        would_claim_pc: false
    households:
      worker_home:
        members: worker
        country: ENGLAND
        local_authority: MAIDSTONE
        other_property_value: 50_000
      pensioner_home:
        members: pensioner
        country: ENGLAND
        local_authority: MAIDSTONE
        other_property_value: 50_000
  output:
    council_tax_reduction_pensioner: [false, true]
    # 50,000 less 10% (5,000) = 45,000.
    council_tax_reduction_assessable_capital: [45_000, 45_000]

