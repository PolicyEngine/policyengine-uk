- name: A working-age applicant with a Universal Credit award has overseas and other real estate counted through Universal Credit's capital
  # SI 2012/2886 Sch para 37(6): with an award of Universal Credit, the
  # authority uses the Secretary of State's calculation of capital.
  # uc_assessable_capital counts the overseas property and other real estate
  # less 10% (UC Regs 2013 reg 49(1)): 9,000 + 4,500 = 13,500. Universal
  # Credit counts no land, where the household route would add the 1,000 of
  # land less 10%, 900, and give 14,400. Capital of 13,500 leaves the
  # applicant within the 16,000 limit with an award.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      applicant:
        age: 40
    benunits:
      benunit:
        members: applicant
        would_claim_uc: true
    households:
      household:
        members: applicant
        country: ENGLAND
        local_authority: MAIDSTONE
        overseas_property_value: 10_000
        other_property_value: 5_000
        owned_land: 1_000
  output:
    uc_assessable_capital: 13_500
    council_tax_reduction_universal_credit_award: true
    council_tax_reduction_assessable_capital: 13_500
