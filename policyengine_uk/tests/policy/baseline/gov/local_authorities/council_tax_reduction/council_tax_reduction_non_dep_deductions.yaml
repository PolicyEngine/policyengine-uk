- name: A Pension Credit pensioner living with a working son (issue 1934)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        state_pension: 9_000
      son:
        age: 40
        employment_income: 30_000
        weekly_hours: 37.5
        current_education: NOT_IN_EDUCATION
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
      son_benunit:
        members: [son]
        would_claim_uc: false
    households:
      household:
        members: [pensioner, son]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 0
  output:
    in_receipt_of_guarantee_credit: [true, false]
    # 30,000 / 52 = 576.92 a week, in the 485 band: 13.30 a week, 691.60 a
    # year. On the Housing Benefit scale it was 119.85 a week, which took the
    # whole 2,000.
    council_tax_reduction_non_dep_deductions: [691.60, 0]
    council_tax_reduction: 1_308.40
