# National Council Tax Reduction schemes' own non-dependant deductions:
# England pensioners SI 2012/2885 Sch 1 para 8; Wales WSI 2013/3029 Sch 1
# para 3 and Sch 6 para 5; Scotland SSI 2012/319 reg 48 and SSI 2021/249
# reg 90. 2026-27 weekly sums, with bands including their lower edge:
#   England: under 279 5.20; 279 10.60; 485 13.30; 605 and above 15.95.
#   Wales: under 279 6.70; 279 13.35; 485 16.80; 605 and above 20.05.
#   Scotland: under 286 5.55; 286 10.95; 497 13.90; 614 and above 16.55.
# A non-dependant not in remunerative work (under 16 hours) pays the lowest.
# The applicant is the benefit unit with the household's oldest member, so
# working-age applicants here are 60.

- name: England in remunerative work with no income pays the lowest amount
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
      son:
        age: 40
        current_education: NOT_IN_EDUCATION
        total_income: 0
        weekly_hours: 35
    benunits:
      claimant_unit:
        members: [claimant]
      son_unit:
        members: [son]
        would_claim_uc: false
        income_support: 0
        jsa_income: 0
        esa_income: 0
        pension_credit: 0
    households:
      household:
        members: [claimant, son]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_individual_non_dep_deduction: [0, 270.40]
    council_tax_reduction_non_dep_deductions: [270.40, 0]

