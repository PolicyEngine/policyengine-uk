    people:
      merton:
        age: 30
        armed_forces_independence_payment: 2_000
      kingston:
        age: 30
        armed_forces_independence_payment: 2_000
      newham:
        age: 30
        armed_forces_independence_payment: 2_000
      westminster:
        age: 30
        armed_forces_independence_payment: 2_000
    benunits:
      merton:
        members: [merton]
      kingston:
        members: [kingston]
      newham:
        members: [newham]
      westminster:
        members: [westminster]
    households:
      merton:
        members: [merton]
        country: ENGLAND
        local_authority: MERTON
      kingston:
        members: [kingston]
        country: ENGLAND
        local_authority: KINGSTON_UPON_THAMES
      newham:
        members: [newham]
        country: ENGLAND
        local_authority: NEWHAM
      westminster:
        members: [westminster]
        country: ENGLAND
        local_authority: WESTMINSTER
  output:
    meets_council_tax_reduction_enhanced_disability_premium_condition: [false, false, true, true]
    # 22.00 * 52 = 1,144.00.
    council_tax_reduction_enhanced_disability_premium: [0, 0, 1_144, 1_144]
    enhanced_disability_premium: [1_144, 1_144, 1_144, 1_144]

