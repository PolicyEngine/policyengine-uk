    council_tax_reduction_premiums: 5_618.60

- name: Case 9, AFIP adds no enhanced disability premium to a Merton reduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        armed_forces_independence_payment: 2_000
        private_pension_income: 12_000
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        claims_all_entitled_benefits: true
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: MERTON
        council_tax: 1_800
        savings: 0
  output:
    # The model's legacy premium still counts AFIP for Housing Benefit and
    # Income Support (HB para 15(1)(d)).
    enhanced_disability_premium: 1_144
    # Merton omits AFIP from Sch 3 para 12(1).
    meets_council_tax_reduction_enhanced_disability_premium_condition: false
    council_tax_reduction_enhanced_disability_premium: 0
    # AFIP counts toward the severe disability premium: 86.05 * 52 =
    # 4,474.60.
    council_tax_reduction_premiums: 4_474.60
    # Personal allowance 95.55 * 52 = 4,968.60, plus 4,474.60: 9,443.20.
    council_tax_reduction_applicable_amount: 9_443.20
    # 1,800 - 20% of (12,000 - 9,443.20) = 1,800 - 511.36 = 1,288.64.
    simulated_council_tax_reduction_benunit: 1_288.64

