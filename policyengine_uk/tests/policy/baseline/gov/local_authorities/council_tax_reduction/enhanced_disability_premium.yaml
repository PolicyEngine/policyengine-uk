- name: Case 13, Merton's own list counts standard PIP daily living in 2022.
  # Merton's scheme rules for 2022-23, Sch 3 para 12(1)(c), count the PIP
  # daily living component at either rate. The case pins the 2022-23 energy
  # and cost of living payments at zero, so household net income moves only
  # with the reduction. 2022-23 rates: PIP daily living standard 61.85,
  # personal allowance (25 or over) 77.00, severe disability premium 69.40,
  # disability premium 36.20, enhanced disability premium 17.75.
  period: 2022
  absolute_error_margin: 0.01
  # The claimant receives PIP, so the case sets is_disabled_for_benefits for
  # the disability premium (HB Regs 2006 Sch 3 paras 12(a) and 13(1)(a)(i);
  # Merton's rules Sch 3 paras 9(a) and 10(1)(a)(i)). A pension of 12,500,
  # below the 12,570 personal allowance, keeps the reduction on the taper.
  input:
    people:
      person1:
        age: 30
        pip_dl_category: STANDARD
        is_disabled_for_benefits: true
        private_pension_income: 12_500
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        claims_all_entitled_benefits: true
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: MERTON
        council_tax: 1_800
        savings: 0
        tv_licence: 0
        energy_bills_rebate: 0
        cost_of_living_support_payment: 0
  output:
    # The legacy premium counts the enhanced rate only.
    enhanced_disability_premium: 0
    meets_council_tax_reduction_enhanced_disability_premium_condition: true
    # Merton's list counts the standard PIP daily living rate: 17.75 * 52 = 923.00.
    council_tax_reduction_enhanced_disability_premium: 923
    # Severe disability premium 69.40 * 52 = 3,608.80, disability premium
    # 36.20 * 52 = 1,882.40 and the enhanced disability premium 923.00: 6,414.20.
    council_tax_reduction_premiums: 6_414.20
    # Personal allowance 77.00 * 52 = 4,004.00, plus 6,414.20: 10,418.20.
    council_tax_reduction_applicable_amount: 10_418.20
    # 1,800 - 20% of (12,500 - 10,418.20) = 1,800 - 416.36 = 1,383.64.
    council_tax_reduction: 1_383.64
    # Pension 12,500 + PIP 61.85 * 52 = 3,216.20 + reduction 1,383.64 -
    # council tax 1,800 = 15,299.84.
    household_net_income: 15_299.84

- name: Case 14, Merton's own list counts standard PIP daily living in 2023.
  # Merton's Local Council Tax Support Scheme Rules 2023, Sch 3 para 12(1)(c):
  # PIP daily living "payable at either rate". The case pins the 2023-24 energy
  # and cost of living payments at zero. 2023-24 rates: PIP daily living
  # standard 68.10, personal allowance (25 or over) 84.80, severe disability
  # premium 76.40, disability premium 39.85, enhanced disability premium
  # 19.55.
  period: 2023
  absolute_error_margin: 0.01
  # The claimant receives PIP, so the case sets is_disabled_for_benefits for
  # the disability premium (HB Regs 2006 Sch 3 paras 12(a) and 13(1)(a)(i);
  # Merton's rules Sch 3 paras 9(a) and 10(1)(a)(i)). A pension of 12,500,
  # below the 12,570 personal allowance, keeps the reduction on the taper.
  input:
    people:
      person1:
        age: 30
        pip_dl_category: STANDARD
        is_disabled_for_benefits: true
        private_pension_income: 12_500
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        claims_all_entitled_benefits: true
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: MERTON
        council_tax: 1_800
        savings: 0
        tv_licence: 0
        energy_bills_rebate: 0
        cost_of_living_support_payment: 0
  output:
    # The legacy premium still counts the enhanced rate only.
    enhanced_disability_premium: 0
    meets_council_tax_reduction_enhanced_disability_premium_condition: true
    # 19.55 * 52 = 1,016.60.
    council_tax_reduction_enhanced_disability_premium: 1_016.60
    # Severe disability premium 76.40 * 52 = 3,972.80, disability premium
    # 39.85 * 52 = 2,072.20 and the enhanced disability premium 1,016.60:
    # 7,061.60.
    council_tax_reduction_premiums: 7_061.60
    # Personal allowance 84.80 * 52 = 4,409.60, plus 7,061.60: 11,471.20.
    council_tax_reduction_applicable_amount: 11_471.20
    # 1,800 - 20% of (12,500 - 11,471.20) = 1,800 - 205.76 = 1,594.24.
    council_tax_reduction: 1_594.24
    # Pension 12,500 + PIP 68.10 * 52 = 3,541.20 + reduction 1,594.24 -
    # council tax 1,800 = 15,835.44.
    household_net_income: 15_835.44

- name: Case 15, Merton's own list counts standard PIP daily living and omits AFIP in 2015.
  # Merton's scheme rules for 2015-16, Sch 3 para 12(1)(b), (c), count the DLA
  # care component at the highest rate and the PIP daily living component at
  # either rate, and name no armed forces payment. 2015-16 rates: PIP daily
  # living standard 55.10, personal allowance (25 or over) 73.10, severe
  # disability premium 61.85, disability premium 32.25, enhanced disability
  # premium 15.75. Each claimant receives PIP or AFIP, so the case sets
  # is_disabled_for_benefits for the disability premium. A pension of 10,500,
  # below the 10,600 personal allowance, keeps each reduction on the taper.
  # The case pins the cost of living and energy payments at zero.
  period: 2015
  absolute_error_margin: 0.01
  input:
    people:
      pip:
        age: 30
        pip_dl_category: STANDARD
        is_disabled_for_benefits: true
        private_pension_income: 10_500
      afip:
        age: 30
        armed_forces_independence_payment: 2_000
        is_disabled_for_benefits: true
        private_pension_income: 10_500
    benunits:
      pip:
        members: [pip]
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        claims_all_entitled_benefits: true
      afip:
        members: [afip]
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        claims_all_entitled_benefits: true
    households:
      pip:
        members: [pip]
        country: ENGLAND
        local_authority: MERTON
        council_tax: 1_800
        savings: 0
        tv_licence: 0
        energy_bills_rebate: 0
        cost_of_living_support_payment: 0
      afip:
        members: [afip]
        country: ENGLAND
        local_authority: MERTON
        council_tax: 1_800
        savings: 0
        tv_licence: 0
        energy_bills_rebate: 0
        cost_of_living_support_payment: 0
  output:
    # The legacy premium counts AFIP (HB para 15(1)(d)) but not the standard
    # PIP rate: 15.75 * 52 = 819.00.
    enhanced_disability_premium: [0, 819]
    meets_council_tax_reduction_enhanced_disability_premium_condition: [true, false]
    council_tax_reduction_enhanced_disability_premium: [819, 0]
    # Severe disability premium 61.85 * 52 = 3,216.20 and disability premium
    # 32.25 * 52 = 1,677.00: 4,893.20, plus 819.00 for PIP: 5,712.20.
    council_tax_reduction_premiums: [5_712.20, 4_893.20]
    # Personal allowance 73.10 * 52 = 3,801.20: 9,513.40 and 8,694.40.
    council_tax_reduction_applicable_amount: [9_513.40, 8_694.40]
    # 1,800 - 20% of (10,500 - 9,513.40) = 1,800 - 197.32 = 1,602.68;
    # 1,800 - 20% of (10,500 - 8,694.40) = 1,800 - 361.12 = 1,438.88.
    council_tax_reduction: [1_602.68, 1_438.88]
    # Pension 10,500 + PIP 55.10 * 52 = 2,865.20 + 1,602.68 - 1,800 =
    # 13,167.88. The model leaves AFIP out of household benefits
    # (HOUSEHOLD_BENEFIT_VARIABLES), so 10,500 + 1,438.88 - 1,800 = 10,138.88.
    household_net_income: [13_167.88, 10_138.88]

