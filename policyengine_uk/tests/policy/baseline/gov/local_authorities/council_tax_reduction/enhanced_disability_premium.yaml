        age: 30
        armed_forces_independence_payment: 2_000
      westminster:
        age: 30
        armed_forces_independence_payment: 2_000
    benunits:
      merton:
        members: [merton]
      kingston:
        members: [kingston]
      newham:
        members: [newham]
      westminster:
        members: [westminster]
    households:
      merton:
        members: [merton]
        country: ENGLAND
        local_authority: MERTON
