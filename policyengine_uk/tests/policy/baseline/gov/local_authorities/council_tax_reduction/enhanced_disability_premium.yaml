        savings: 0
        tv_licence: 0
        energy_bills_rebate: 0
        cost_of_living_support_payment: 0
  output:
    # 15.75 * 52 = 819.00.
    enhanced_disability_premium: [0, 819]
    meets_council_tax_reduction_enhanced_disability_premium_condition: [true, false]
    council_tax_reduction_enhanced_disability_premium: [819, 0]
    # 3,216.20 + 1,677.00 = 4,893.20, plus 819.00 for PIP: 5,712.20.
    council_tax_reduction_premiums: [5_712.20, 4_893.20]
    # Plus the personal allowance 3,801.20: 9,513.40 and 8,694.40.
    council_tax_reduction_applicable_amount: [9_513.40, 8_694.40]
    # 1,800 - 20% of (10,500 - 9,513.40) = 1,602.68;
    # 1,800 - 20% of (10,500 - 8,694.40) = 1,438.88.
    council_tax_reduction: [1_602.68, 1_438.88]
    # 10,500 + 2,865.20 + 1,602.68 - 1,800 = 13,167.88;
    # 10,500 + 1,438.88 - 1,800 = 10,138.88, without AFIP as in Case 15.
    household_net_income: [13_167.88, 10_138.88]

- name: Case 17, Westminster's list counts standard PIP daily living and omits AFIP in 2026.
  # 2026-27 rates: PIP daily living standard 76.70, personal allowance (under
  # 25) 75.65, severe disability premium 86.05, disability premium 44.85,
  # enhanced disability premium 22.00. Each claimant, aged 24, takes the lower
  # personal allowance, which keeps each applicable amount below a pension of
  # 12,500, under the 12,570 personal allowance, and each reduction on the
  # taper.
  # The case pins the 2026-27 household energy payment and the earlier
  # payments at zero.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pip:
        age: 24
        pip_dl_category: STANDARD
        is_disabled_for_benefits: true
        private_pension_income: 12_500
      afip:
        age: 24
        armed_forces_independence_payment: 2_000
        is_disabled_for_benefits: true
        private_pension_income: 12_500
    benunits:
      pip:
        members: [pip]
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        claims_all_entitled_benefits: true
      afip:
        members: [afip]
        would_claim_uc: false
        would_claim_IS: false
        would_claim_pc: false
        claims_all_entitled_benefits: true
    households:
      pip:
        members: [pip]
        country: ENGLAND
        local_authority: WESTMINSTER
        council_tax: 1_800
        savings: 0
        tv_licence: 0
        energy_bills_rebate: 0
        cost_of_living_support_payment: 0
        household_energy_payment: 0
      afip:
        members: [afip]
        country: ENGLAND
        local_authority: WESTMINSTER
        council_tax: 1_800
        savings: 0
        tv_licence: 0
        energy_bills_rebate: 0
        cost_of_living_support_payment: 0
        household_energy_payment: 0
  output:
    # 22.00 * 52 = 1,144.00.
    enhanced_disability_premium: [0, 1_144]
    meets_council_tax_reduction_enhanced_disability_premium_condition: [true, false]
    council_tax_reduction_enhanced_disability_premium: [1_144, 0]
    # Severe disability premium 86.05 * 52 = 4,474.60 and disability premium
    # 44.85 * 52 = 2,332.20: 6,806.80, plus 1,144.00 for PIP: 7,950.80.
    council_tax_reduction_premiums: [7_950.80, 6_806.80]
    # Personal allowance 75.65 * 52 = 3,933.80: 11,884.60 and 10,740.60.
    council_tax_reduction_applicable_amount: [11_884.60, 10_740.60]
    # 1,800 - 20% of (12,500 - 11,884.60) = 1,800 - 123.08 = 1,676.92;
    # 1,800 - 20% of (12,500 - 10,740.60) = 1,800 - 351.88 = 1,448.12.
    council_tax_reduction: [1_676.92, 1_448.12]
    # Pension 12,500 + PIP 76.70 * 52 = 3,988.40 + 1,676.92 - 1,800 =
    # 16,365.32; pension 12,500 + 1,448.12 - 1,800 = 12,148.12, without AFIP
    # as in Case 15.
    household_net_income: [16_365.32, 12_148.12]

