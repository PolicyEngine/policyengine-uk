- name: Case 12, the Merton and Newham schemes keep the age limit for an over-age partner.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      merton1:
        age: 60
      merton2:
        age: 70
        pip_dl_category: STANDARD
      newham1:
        age: 60
      newham2:
        age: 70
        armed_forces_independence_payment: 2_000
    benunits:
      merton:
        members: [merton1, merton2]
        jsa_income: 3_000
      newham:
        members: [newham1, newham2]
        jsa_income: 3_000
    households:
      merton:
        members: [merton1, merton2]
        country: ENGLAND
        local_authority: MERTON
      newham:
        members: [newham1, newham2]
        country: ENGLAND
        local_authority: NEWHAM
  output:
    is_couple: [true, true]
    # Income-based Jobseeker's Allowance keeps each couple in the working-age
    # scheme.
    council_tax_reduction_pensioner: [false, false]
    # Para 12(1)(c) and (p): "who has not attained the qualifying age for
    # state pension credit".
    meets_council_tax_reduction_enhanced_disability_premium_condition: [false, false, false, false]
    council_tax_reduction_enhanced_disability_premium: [0, 0]
