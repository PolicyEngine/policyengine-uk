# Enhanced disability premium in working-age Council Tax Reduction.
# Welsh councils count DLA care highest, PIP daily living enhanced or AFIP,
# for an applicant or family member "who has not attained the qualifying age
# for state pension credit" (CTR (Prescribed Requirements) (Wales) Regs 2013
# Sch 7 para 12(1)). Scottish councils count the same benefits for the
# applicant or partner (CTR (Scotland) Regs 2021 Sch 1 para 14(1)), with no
# age limit from 20 June 2022 (S.S.I. 2022/161), and attendance allowance at
# either rate from 1 April 2023 (para 14(1)(g), S.S.I. 2023/38). Merton and
# Kingston upon Thames count DLA care highest and PIP daily living at either
# rate and omit AFIP (Merton's Local Council Tax Support Scheme Rules 2026 and
# Kingston upon Thames's Council Tax Reduction Scheme 2026 - 2027, Sch 3 para
# 12(1)). Newham counts DLA care highest, PIP daily living at either rate and
# AFIP (Newham's Council Tax Reduction Scheme 2026, Sch 3 para 12(1)). In
# Westminster the model applies the Default Scheme's list (S.I. 2012/2886 Sch
# 3 para 12(1)): DLA care highest and PIP daily living at either rate, without
# AFIP. The four London councils keep the qualifying age for State Pension
# Credit as the age limit. The model applies Kingston's list in 2013-14 to
# 2017-18 and from 2023-24. No complete scheme text for 2018-19 to 2022-23
# survives, so for those years the model assumes the Housing Benefit list.
# The other councils' lists apply in every model year. The model reads each
# year's rules at 30 April.
# Unless a case sets `is_disabled_for_benefits`, it keeps its default, false,
# and the model pays no disability premium, although the schemes give one to
# a claimant under the qualifying age who receives these awards (for example
# HB Regs 2006 Sch 3 paras 12(a) and 13(1)(a)(i); Merton's rules Sch 3 paras
# 9(a) and 10(1)(a)(i)). In those cases the totals from
# `council_tax_reduction_premiums` down follow that default, not the schemes.
# 2026-27 amounts: enhanced disability premium £22.00 single, £31.40 couple;
# severe disability premium £86.05 single.

- name: Case 1, Welsh working-age CTR premiums include the premium for enhanced PIP daily living.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        pip_dl_category: ENHANCED
    households:
      household:
        members: [person1]
        country: WALES
        local_authority: CARDIFF
  output:
    council_tax_reduction_pensioner: false
    # 22.00 * 52 = 1,144.00.
    council_tax_reduction_enhanced_disability_premium: 1_144
    # Plus the severe disability premium, 86.05 * 52 = 4,474.60: 5,618.60.
    council_tax_reduction_premiums: 5_618.60

- name: Case 2, Scottish working-age CTR counts attendance allowance at either rate from 2023.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        aa_category: LOWER
    households:
      household:
        members: [person1]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
  output:
    council_tax_reduction_pensioner: false
    # The model's legacy premium does not count attendance allowance.
    enhanced_disability_premium: 0
    # Para 14(1)(g): 22.00 * 52 = 1,144.00.
    meets_council_tax_reduction_enhanced_disability_premium_condition: true
    council_tax_reduction_enhanced_disability_premium: 1_144
    # Severe disability premium 4,474.60 + 1,144.00 = 5,618.60.
    council_tax_reduction_premiums: 5_618.60

- name: Case 3, Scottish working-age CTR does not count attendance allowance in 2022.
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        aa_category: LOWER
    households:
      household:
        members: [person1]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
  output:
    meets_council_tax_reduction_enhanced_disability_premium_condition: false
    council_tax_reduction_enhanced_disability_premium: 0
    # The model pays only the severe disability premium, at the 2022-23
    # single rate £69.40: 69.40 * 52 = 3,608.80.
    council_tax_reduction_premiums: 3_608.80

- name: Case 4, Scottish working-age CTR pays the couple rate for an over-age partner from 2023.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
      person2:
        age: 70
        dla_sc_category: HIGHER
    benunits:
      benunit:
        members: [person1, person2]
        jsa_income: 3_000
    households:
      household:
        members: [person1, person2]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
  output:
    is_couple: true
    # Because the couple receives income-based Jobseeker's Allowance, the
    # model applies the working-age scheme.
    council_tax_reduction_pensioner: false
    # The model's legacy premium applies the age limit.
    enhanced_disability_premium: 0
    # Scottish councils apply no age limit under para 14(1)(b): 31.40 * 52 =
    # 1,632.80.
    council_tax_reduction_enhanced_disability_premium: 1_632.80
    # The model pays no other premium, because only one partner has a severe
    # disability premium qualifying benefit.
    council_tax_reduction_premiums: 1_632.80

