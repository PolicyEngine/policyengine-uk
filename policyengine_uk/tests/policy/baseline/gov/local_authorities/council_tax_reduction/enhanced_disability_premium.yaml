        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
  output:
    is_couple: true
    council_tax_reduction_pensioner: false
    # Para 14(1)(b) as in force on 30 April 2022: "the applicant's partner,
    # who has not attained pensionable age".
    council_tax_reduction_enhanced_disability_premium: 0
    council_tax_reduction_premiums: 0

- name: Case 6, Welsh working-age CTR keeps the age limit for an over-age partner.
