# SSI 2021/249 reg. 7(8), as in force from 1 April 2022, keeps children
# placed with a parent, a person with parental responsibility or an approved
# kinship carer in the applicant's family. SSI 2024/230 regs. 1 and 3 replace
# that provision from 31 October 2024 with an exclusion for foster placements.
# https://www.legislation.gov.uk/ssi/2021/249/regulation/7/2022-04-01
# https://www.legislation.gov.uk/ssi/2024/230/regulation/3/made
# The annual model samples ordinary government parameters on 30 April, so
# annual 2024 keeps the earlier rule and annual 2025 uses the amended rule.
# Parent/parental-responsibility placements leave the existing looked-after
# input false, following its documented Universal Credit input convention.
# UNSPECIFIED preserves the existing input's treatment as a compatibility
# fallback; it does not classify every such child as a foster placement.

- name: Case 1, an approved kinship placement increases a working Scottish applicant's child allowance and reduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        is_household_head: true
        is_claimant_or_partner: true
        employment_income: 10_000
        weekly_hours: 15
      person2:
        age: 8
        is_household_head: false
        is_claimant_or_partner: false
        is_looked_after_by_local_authority: true
        scottish_council_tax_reduction_child_placement: APPROVED_KINSHIP_CARER
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
        would_claim_council_tax_reduction: true
    households:
      household:
        members: [person1, person2]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
  output:
    # Income below the applicable amount gives full liability (reg. 13).
    council_tax_reduction: 1_800
    is_looked_after_child: [false, true]
    is_child_or_young_person_for_council_tax_reduction: [false, true]
    is_council_tax_reduction_lone_parent: true
    council_tax_reduction_pensioner: false
    # SSI 2026/56 reg. 14: 109.85 * 52 for the child and 95.55 * 52
    # for the applicant. The family premium for a new claim is zero.
    council_tax_reduction_working_age_child_amounts: 5_712.20
    council_tax_reduction_working_age_personal_allowance: 4_968.60
    council_tax_reduction_working_age_applicable_amount: 10_680.80
    # Wages fall below the personal allowance and NI primary threshold.
    # Fifteen hours fails the 16-hour additional-disregard work condition.
    income_tax: [0, 0]
    national_insurance: [0, 0]
    # SSI 2021/249 Sch. 3 para. 5: 25 * 52; income = 10,000 - 1,300.
    council_tax_reduction_working_age_earnings_disregard: 1_300
    council_tax_reduction_working_age_applicable_income: 8_700
    council_tax_reduction_non_dep_deductions: 0
    # The Scottish placement input does not change Universal Credit.
    is_child_or_qualifying_young_person_for_universal_credit: [false, false]
    uc_child_index: [-1, -1]
    uc_individual_child_element: [0, 0]
    uc_child_element: 0

- name: Case 2, a foster placement leaves the same Scottish applicant single and tapers the reduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        is_household_head: true
        is_claimant_or_partner: true
        employment_income: 10_000
        weekly_hours: 15
      person2:
        age: 8
        is_household_head: false
        is_claimant_or_partner: false
        is_looked_after_by_local_authority: true
        scottish_council_tax_reduction_child_placement: FOSTER_CARER
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
        would_claim_council_tax_reduction: true
    households:
      household:
        members: [person1, person2]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
  output:
    # Reg. 13: 1,800 - (9,740 - 4,968.60) * 0.20 = 845.72.
    council_tax_reduction: 845.72
    is_child_or_young_person_for_council_tax_reduction: [false, false]
    is_council_tax_reduction_lone_parent: false
    council_tax_reduction_working_age_child_amounts: 0
    # SSI 2026/56 reg. 14: 95.55 * 52 for a single applicant aged 35.
    council_tax_reduction_working_age_personal_allowance: 4_968.60
    council_tax_reduction_working_age_applicable_amount: 4_968.60
    income_tax: [0, 0]
    national_insurance: [0, 0]
    # Sch. 3 para. 11: 5 * 52; income = 10,000 - 260.
    council_tax_reduction_working_age_earnings_disregard: 260
    council_tax_reduction_working_age_applicable_income: 9_740
    council_tax_reduction_non_dep_deductions: 0

- name: Case 3, another looked-after placement counts in Scotland after the foster-only amendment.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        is_household_head: true
        is_claimant_or_partner: true
        employment_income: 10_000
        weekly_hours: 15
      person2:
        age: 8
        is_household_head: false
        is_claimant_or_partner: false
        is_looked_after_by_local_authority: true
        scottish_council_tax_reduction_child_placement: OTHER_LOOKED_AFTER
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: false
        would_claim_council_tax_reduction: true
    households:
      household:
        members: [person1, person2]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
  output:
    # The same arithmetic as Case 1 gives the full reduction.
    council_tax_reduction: 1_800
    is_child_or_young_person_for_council_tax_reduction: [false, true]
    is_council_tax_reduction_lone_parent: true
    # The same arithmetic as Case 1 follows from the same family amounts.
    council_tax_reduction_working_age_child_amounts: 5_712.20
    council_tax_reduction_working_age_applicable_amount: 10_680.80
    council_tax_reduction_working_age_earnings_disregard: 1_300
    council_tax_reduction_working_age_applicable_income: 8_700

