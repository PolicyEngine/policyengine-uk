# #2799. Merton and Kingston upon Thames count "the amount of the award of
# universal credit" (their 2026-27 schemes reproduce SI 2012/2886 Sch para
# 37(3)(a) and (4)), Newham counts "the amount of entitlement to universal
# credit", and Westminster compares the maximum amount "to the actual
# universal credit award plus any other income and earnings received". The
# Secretary of State pays the claimant's debts to third parties out of the
# award (SI 2013/380 Sch 6 para 2(1)), so each council counts the same award
# and grants the same reduction after a debt deduction.
#
# Unless a case says otherwise, each case uses a single claimant aged 35 in
# 2026 who earns 8,000 (under the personal allowance and primary threshold),
# rents from the council at 7,800 a year and owes council tax of 2,600. The
# maximum amount comes to 424.90 x 12 + 7,800 = 12,898.80. With no child and
# no limited capability for work, the claimant gets no work allowance (UC
# Regs 2013 reg 22(1)(b)(i)), so the Secretary of State deducts
# 55% x 8,000 = 4,400 and awards 8,498.80. The councils take the maximum
# amount as the applicable amount, and income exceeds it by
# 8,000 + 8,498.80 - 12,898.80 = 3,600.
# Merton, Kingston upon Thames and Westminster award
# 2,600 - 20% x 3,600 = 1,880; Newham awards 70% x 2,600 - 25% x 3,600 = 920.
# Counting the amount payable after a 600 deduction would give 2,000 and
# 1,070.
#
# The model works in annual amounts. It takes a deduction at DWP's 15% cap as
# 15% x 424.90 x 12 = 764.82 a year. The Secretary of State deducts by
# assessment period and rounds 15% x 424.90 = 63.735 to 63.74 (SI 2013/380 Sch
# 6 para 1(2)), or 764.88 over twelve assessment periods.

- name: Merton counts the Universal Credit award with no deduction
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 35
        employment_income: 8_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
        claims_all_entitled_benefits: true
    households:
      household:
        members: [claimant]
        country: ENGLAND
        region: LONDON
        local_authority: MERTON
        tenure_type: RENT_FROM_COUNCIL
        rent: 7_800
        council_tax: 2_600
        savings: 0
  output:
    uc_maximum_amount: 12_898.80
    uc_income_reduction: 4_400
    uc_deductions: 0
    universal_credit: 8_498.80
    council_tax_reduction: 1_880

