- name: Newham counts the Universal Credit award before a deduction at the cap
  # A third-party deduction demand of 15% of the standard allowance meets the
  # 15% cap: 15% x 424.90 x 12 = 764.82. The amount payable falls to
  # 8,498.80 - 764.82 = 7,733.98; the award stays at 8,498.80 and Newham
  # awards 920. Counting the amount payable would give
  # 70% x 2,600 - 25% x (3,600 - 764.82) = 1,111.21.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 35
        employment_income: 8_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_has_deduction: true
        uc_latent_deduction_rate: 0.15
        uc_deduction_combination: THIRD_PARTY_ONLY
    households:
      household:
        members: [claimant]
        country: ENGLAND
        region: LONDON
        local_authority: NEWHAM
        tenure_type: RENT_FROM_COUNCIL
        rent: 7_800
        council_tax: 2_600
        savings: 0
  output:
    uc_deduction_rate: 0.15
    uc_deductions: 764.82
    universal_credit: 7_733.98
    council_tax_reduction: 920

- name: Merton counts the Universal Credit award after the benefit cap and before a deduction at the cap
  # The Secretary of State reduces the award by 1,200 (entered here) for the
  # benefit cap, to 8,498.80 - 1,200 = 7,298.80 (UC Regs 2013 reg 81(1)). A
  # deduction at the 15% cap, 764.82, leaves 6,533.98 payable. Income exceeds the maximum amount
  # by 8,000 + 7,298.80 - 12,898.80 = 2,400, so Merton awards
  # 2,600 - 20% x 2,400 = 2,120. Counting the amount payable would give
  # 2,272.96, and counting the award before the cap 1,880.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 35
        employment_income: 8_000
    benunits:
      benunit:
        members: [claimant]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_benefit_cap_reduction: 1_200
        uc_has_deduction: true
        uc_latent_deduction_rate: 0.15
        uc_deduction_combination: THIRD_PARTY_ONLY
    households:
      household:
        members: [claimant]
        country: ENGLAND
        region: LONDON
        local_authority: MERTON
        tenure_type: RENT_FROM_COUNCIL
        rent: 7_800
        council_tax: 2_600
        savings: 0
  output:
    uc_benefit_cap_reduction_after_floor: 1_200
    uc_deductions: 764.82
    universal_credit: 6_533.98
    council_tax_reduction: 2_120
