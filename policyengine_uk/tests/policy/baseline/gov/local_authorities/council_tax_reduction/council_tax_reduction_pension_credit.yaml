# Pension Credit recipients under the pensioner council tax reduction schemes.
# Guarantee credit: the whole of the applicant's income and capital is
# disregarded (SI 2012/2885 Sch 1 para 13; WSI 2013/3029 Sch 1 para 7; SSI
# 2012/319 reg 24), so the award is the maximum reduction less non-dependant
# deductions, whatever the income, and the capital limit cannot apply (SI
# 2012/2885 reg 11(3); WSI 2013/3029 reg 30(2)). Savings credit only: the
# Secretary of State's assessment of income and capital is used, adjusted for
# the savings credit payable (SI 2012/2885 Sch 1 para 14; WSI 2013/3029 Sch 1
# para 8; SSI 2012/319 reg 25).
#
# A minimum_guarantee input of 18,500 stands in for an earnings-linked
# guarantee above the 13,312 CTR applicable amount, as on the uk-triple-lock
# central path in 2039-40, where the State Pension figures below come from.

- name: England guarantee credit recipient with income above the applicable amount gets maximum CTR
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        state_pension: 18_712
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
        minimum_guarantee: 18_500
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 0
  output:
    income_tax: 1_228.40
    guarantee_credit: 1_016.40
    in_receipt_of_guarantee_credit: true
    council_tax_reduction_applicable_amount: 13_312
    # Before the disregard: 17,483.60 and a tapered CTR of 1,165.68.
    council_tax_reduction_applicable_income: 0
    council_tax_reduction_assessable_capital: 0
    simulated_council_tax_reduction_benunit: 2_000
    council_tax_reduction: 2_000

