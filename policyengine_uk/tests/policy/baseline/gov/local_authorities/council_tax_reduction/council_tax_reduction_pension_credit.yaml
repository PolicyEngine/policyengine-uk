- name: Non-dependant deductions still apply to a guarantee credit recipient
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        state_pension: 9_000
      son:
        age: 40
        employment_income: 5_000
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
      son_benunit:
        members: [son]
        would_claim_uc: false
    households:
      household:
        members: [pensioner, son]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 0
  output:
    # The son's guarantee_credit is calculated as 7,636 (his earnings less the
    # 5 pound a week SPC Regs Sch VI para 5 disregard), but he is not eligible
    # for Pension Credit, so he is not in receipt of it.
    guarantee_credit: [3_376, 7_636]
    in_receipt_of_guarantee_credit: [true, false]
    council_tax_reduction_applicable_income: [0, 5_000]
    # The national schemes' non-dependant deduction currently uses Housing
    # Benefit amounts (20.40 a week here), not the CTR schedules' own amounts
    # and exemptions (SI 2012/2885 Sch 1 para 8); this pins that the deduction
    # still applies on guarantee credit, not its size.
    council_tax_reduction_non_dep_deductions: [1_060.80, 0]
    # 2,000 - 1,060.80
    simulated_council_tax_reduction_benunit: [939.20, 0]
    council_tax_reduction: 939.20

