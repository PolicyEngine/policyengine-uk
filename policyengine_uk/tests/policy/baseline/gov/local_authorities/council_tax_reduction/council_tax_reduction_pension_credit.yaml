        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 16_000
  output:
    # 2,000 - 0.2 x (14,247.02 - 13,312). The Secretary of State's capital is
    # tested against the limit, which excludes only capital that exceeds
    # 16,000 (SI 2012/2885 Sch 1 para 14(1) and reg 11(2)).
    in_receipt_of_savings_credit_only: true
    savings_credit: 309.02
    council_tax_reduction_assessable_capital: 16_000
    council_tax_reduction_applicable_income: 14_247.02
    council_tax_reduction: 1_813

