  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 90
        state_pension: 12_000
        private_pension_income: 1_500
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 0
  output:
    guarantee_credit: 0
    savings_credit: 558.62
    in_receipt_of_savings_credit_only: true
    pension_credit_income: 13_314
    # 13,314 + 558.62. Before: 13,314 (the savings credit was not counted).
    council_tax_reduction_applicable_income: 13_872.62
    # 2,000 - 0.2 x (13,872.62 - 13,312). Before: 1,999.60.
    council_tax_reduction: 1_887.88

- name: Savings credit only tests the Pension Credit assessment of capital against the limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 90
        state_pension: 12_000
        private_pension_income: 1_500
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 10_000
        other_residential_property_value: 7_000
  output:
    savings_credit: 267.42
    in_receipt_of_savings_credit_only: true
    # Pension Credit counts the second property as capital; household
    # savings alone (10,000) are under the limit. Before: CTR 1,999.60.
    pension_credit_assessable_capital: 17_000
    council_tax_reduction_assessable_capital: 17_000
    council_tax_reduction: 0

- name: The same pensioner not claiming Pension Credit is tested on household savings only
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 90
        state_pension: 12_000
        private_pension_income: 1_500
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
        would_claim_pc: false
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 10_000
        other_residential_property_value: 7_000
  output:
    in_receipt_of_savings_credit_only: false
    # Pensioners without Pension Credit are tested on household savings, a
    # proxy that leaves out the second property the schemes' own capital rules
    # count (SI 2012/2885 Sch 1 Part 6 Chapter 3). So, unlike the claimant
    # above, this pensioner keeps CTR: the gap is in the proxy, not the law.
    council_tax_reduction_assessable_capital: 10_000
    council_tax_reduction_applicable_income: 13_314
    council_tax_reduction: 1_999.60

- name: Capital of exactly 16,000 is within the limit for a pensioner without Pension Credit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        state_pension: 13_000
    benunits:
      benunit:
        members: [pensioner]
        claims_all_entitled_benefits: true
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 16_000
  output:
    # The limit excludes capital that "exceeds" 16,000 (SI 2012/2885 reg 11(2)).
    # The award pins the model's current value: it has no pensioner tariff
    # income from capital (Sch 1 para 37, 624 a year here), a known gap
    # (#1933), so this is not the full legal amount.
    in_receipt_of_guarantee_credit: false
    council_tax_reduction_assessable_capital: 16_000
    council_tax_reduction: 2_000

