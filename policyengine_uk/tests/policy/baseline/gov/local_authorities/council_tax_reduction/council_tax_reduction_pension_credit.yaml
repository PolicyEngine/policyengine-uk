- name: Savings-credit-only Pension Credit capital of exactly 16,000 is within the limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 90
        state_pension: 12_000
        private_pension_income: 1_500
    benunits:
