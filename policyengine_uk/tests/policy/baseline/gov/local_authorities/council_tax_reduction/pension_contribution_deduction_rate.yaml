    council_tax_reduction_net_earnings: [9000, 9000, 9000, 9000, 9000, 9000, 9000, 9000, 9000]
    housing_benefit_net_earnings: [9000, 9000, 9000, 9000, 9000, 9000, 9000, 9000, 9000]
    council_tax_reduction_pensioner_earnings_disregard: [0, 0, 260, 0, 0, 0, 0, 0, 0]

- name: A reform of the Scotland share moves only that scheme's applicable income
  # Model reform, not current law.
  # Scotland, working age: 10,000 - 0.25 x 2,000 = 9,500.
  # Control, England working age outside the modelled councils: 10,000 - 0.5 x 2,000 = 9,000.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.local_authorities.scotland.council_tax_reduction.means_test.pension_contribution_deduction_rate: 0.25
    people:
      scotland:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 2_000
      england_default:
        age: 40
        employment_income: 10_000
        personal_pension_contributions: 2_000
    benunits:
      scotland_family:
        members: [scotland]
        would_claim_uc: false
        would_claim_pc: false
      england_default_family:
        members: [england_default]
        would_claim_uc: false
        would_claim_pc: false
    households:
      scotland_household:
        members: [scotland]
        country: SCOTLAND
      england_default_household:
        members: [england_default]
        country: ENGLAND
  output:
    council_tax_reduction_pension_contribution_deduction_rate: [0.25, 0.5]
    council_tax_reduction_applicable_income: [9500, 9000]
    council_tax_reduction_net_earnings: [9500, 9000]
    council_tax_reduction_pensioner_earnings_disregard: [0, 0]
