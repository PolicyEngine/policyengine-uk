- name: A pensioner's net earnings below the disregard are all disregarded at current law
  # Net earnings are 300 - 0.5 x 200 = 200, below the single pensioner's 260, so
  # the disregard is 200 (SI 2012/2885 Sch 4 para 8(a), capped at net earnings).
  # Applicable income is the State Pension and earnings, 5,300, less 0.5 x 200
  # and the 200 disregard: 5,000. Income tax is nil (5,300 is below the
  # personal allowance).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 70
        employment_income: 300
        personal_pension_contributions: 200
        state_pension: 5_000
    benunits:
      benunit:
        members: [pensioner]
        would_claim_uc: false
        would_claim_pc: false
    households:
      household:
        members: [pensioner]
        country: ENGLAND
  output:
    income_tax: 0
    council_tax_reduction_pension_contribution_deduction_rate: 0.5
    housing_benefit_net_earnings: 200
    council_tax_reduction_net_earnings: 200
    council_tax_reduction_pensioner_earnings_disregard: 200
    council_tax_reduction_applicable_income: 5_000

