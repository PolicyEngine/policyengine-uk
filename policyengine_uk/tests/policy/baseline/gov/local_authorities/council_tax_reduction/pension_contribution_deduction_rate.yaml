# Each Council Tax Reduction scheme deducts its own share of pension
# contributions from earnings, one-half in every scheme modelled:
# - England pensioners: SI 2012/2885 Sch 1 paras 19(2)(b)-(c) and 29;
# - England default scheme: SI 2012/2886 Sch paras 42, 52 and 61;
# - Wales: WSI 2013/3029 Sch 1 paras 13 and 23 and Sch 6 paras 15 and 24;
# - Scotland: SSI 2012/319 regs 33 and 36 and SSI 2021/249 regs 50 and 51(9);
# - Merton, Kingston upon Thames and Newham: their schemes' paras 52 and 61;
# - Oxford: its scheme's para 18 and Annex 5;
# - Westminster: the default scheme, which its scheme says it is based on.
# None refers to Housing Benefit's share, so a reform of one scheme's share
# moves that scheme's families only, and a reform of Housing Benefit's moves
# none of them. The rates below 0.5 are model reforms, not current law.
#
# Every person earns 10,000 a year, below the personal allowance and the
# primary threshold, so no income tax or National Insurance is due, and pays
# 2,000 into a personal pension. Universal Credit and Pension Credit are not
# claimed. Applicable income is 10,000 - rate x 2,000, less the single
# pensioner's 5 a week (260 a year) earnings disregard (SI 2012/2885 Sch 4
# para 8(a)) for the 70-year-old. Net earnings are 10,000 - rate x 2,000.

- name: At current law every scheme deducts half of pension contributions
  period: 2026
  absolute_error_margin: 0.01
  input:
