# The national Council Tax Reduction non-dependant deduction bands normal
# gross weekly income, including investment income, but only for a
# non-dependant in remunerative work (SI 2012/2885 Sch 1 para 8(1)-(2)); one
# not in remunerative work pays the lowest amount whatever their income. The
# England pensioner scheme's 2025-26 scale (SI 2025/39): under £266 a week
# 5.00; £266 10.20; £463 12.80; £577 and above 15.35.

- name: Investment income does not band a non-worker for CTR
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        is_household_head: true
      adult_child:
        age: 30
        other_investment_income: 28_912 # 556 a week, no hours
        current_education: NOT_IN_EDUCATION
    benunits:
      claimant_family:
        members: [claimant]
      adult_child_family:
        members: [adult_child]
        would_claim_uc: false
        universal_credit_pre_benefit_cap: 0
    households:
      household:
        members: [claimant, adult_child]
        council_tax: 2_000
        country: ENGLAND
        local_authority: MAIDSTONE
  output:
    # Not in remunerative work: the lowest amount, 5.00 * 52, as for a
    # non-dependant with no income. Banding the £556 would give 12.80 * 52.
    council_tax_reduction_individual_non_dep_deduction: [0, 260]

- name: A worker's CTR band counts their investment income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        is_household_head: true
      adult_child:
        age: 30
        hours_worked: 1_950 # 37.5 hours a week
        employment_income: 9_517 # just over 183 a week
        other_investment_income: 28_912 # 556 a week
        current_education: NOT_IN_EDUCATION
    benunits:
      claimant_family:
        members: [claimant]
      adult_child_family:
        members: [adult_child]
        would_claim_uc: false
        universal_credit_pre_benefit_cap: 0
    households:
      household:
        members: [claimant, adult_child]
        council_tax: 2_000
        country: ENGLAND
        local_authority: MAIDSTONE
  output:
    # In remunerative work, banded on all gross income, 739.02 a week: the
    # band from £577, 15.35 * 52.
    council_tax_reduction_individual_non_dep_deduction: [0, 798.20]

- name: A pensioner's CTR is cut by the lowest amount for a non-working non-dependant with investment income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        is_household_head: true
      adult_child:
        age: 30
        other_investment_income: 28_912 # 556 a week, no hours
        current_education: NOT_IN_EDUCATION
    benunits:
      claimant_family:
        members: [claimant]
      adult_child_family:
        members: [adult_child]
        would_claim_uc: false
        universal_credit_pre_benefit_cap: 0
    households:
      household:
        members: [claimant, adult_child]
        tenure_type: RENT_FROM_COUNCIL
        rent: 15_000
        council_tax: 2_000
        country: ENGLAND
        local_authority: MAIDSTONE
  output:
    # 5.00 * 52; banding the £556 would give 12.80 * 52 = 665.60.
    council_tax_reduction_non_dep_deductions: [260, 0]
