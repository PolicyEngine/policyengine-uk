# Vahid's calculator probes from PR 1831 review 5514292316. These households
# supply no benefit reports, claimant roles, or take-up inputs.
- name: North West pensioner calculator household retains full CTR without reports
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    region: NORTH_WEST
    rent: 8_000
    tenure_type: RENT_PRIVATELY
    council_tax: 1_800
    employment_income: 0
  output:
    council_tax_benefit_reported: 0
    claims_all_entitled_benefits: true
    would_claim_council_tax_reduction: true
    council_tax_reduction: 1_800

