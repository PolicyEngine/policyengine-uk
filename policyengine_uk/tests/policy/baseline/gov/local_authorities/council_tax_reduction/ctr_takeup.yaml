# Hand-entered households retain the default and explicit take-up rules.
# Survey reporters-only behavior is covered with MOCK data in Python tests.
- name: WALES entitled non-reporting family entered by hand claims CTR by default
  period: 2026
  input:
    age: 35
    country: WALES
    local_authority: CARDIFF
    council_tax: 1800
    savings: 0
    would_claim_uc: false
    claims_all_entitled_benefits: true
  output:
    council_tax_benefit_reported: 0
    would_claim_council_tax_reduction: true
    simulated_council_tax_reduction_benunit: 1800
    council_tax_benefit: 1800
    council_tax_reduction: 1800

- name: WALES entitled non-reporting family under explicit CTR claim
  period: 2026
  input:
    age: 35
    country: WALES
    local_authority: CARDIFF
    council_tax: 1800
    savings: 0
    would_claim_uc: false
    claims_all_entitled_benefits: true
