- name: Case 8, an English pensioner couple with two children get two child amounts.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      older:
        age: 74
        state_pension: 12_000
      younger:
        age: 72
        state_pension: 9_000
      child_1:
        age: 8
      child_2:
        age: 12
    benunits:
      benunit:
        members: [older, younger, child_1, child_2]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [older, younger, child_1, child_2]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    # 2 * 87.88 * 52 = 9,139.52.
    council_tax_reduction_pensioner_child_amounts: 9_139.52
    # (383.35 + 2 * 87.88) * 52 = 19,934.20 + 9,139.52.
    council_tax_reduction_applicable_amount: 29_073.72

- name: Case 9, England's 2024-25 scheme counts two of three children without a Child Tax Credit award.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
      child_1:
        age: 5
      child_2:
        age: 7
      child_3:
        age: 9
    benunits:
      benunit:
        members: [pensioner, child_1, child_2, child_3]
        would_claim_pc: false
        would_claim_uc: false
        would_claim_CTC: false
    households:
      household:
        members: [pensioner, child_1, child_2, child_3]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    # SI 2012/2885 Sch 1 para 6(1)(b) as in force for 2024-25: up to two.
    # 2 * 83.24 * 52 = 8,656.96.
    council_tax_reduction_pensioner_child_amounts: 8_656.96

- name: Case 10, England's 2024-25 scheme counts all three where Child Tax Credit includes all three.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
      child_1:
        age: 5
        is_CTC_child_element_included: true
      child_2:
        age: 7
        is_CTC_child_element_included: true
      child_3:
        age: 9
        is_CTC_child_element_included: true
    benunits:
      benunit:
        members: [pensioner, child_1, child_2, child_3]
        would_claim_pc: false
        would_claim_uc: false
        would_claim_CTC: true
        is_CTC_eligible: true
    households:
      household:
        members: [pensioner, child_1, child_2, child_3]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    # Para 6(1B) and (1C): the award includes the individual element for
    # three, which is more than two. 3 * 83.24 * 52 = 12,985.44.
    council_tax_reduction_pensioner_child_amounts: 12_985.44

