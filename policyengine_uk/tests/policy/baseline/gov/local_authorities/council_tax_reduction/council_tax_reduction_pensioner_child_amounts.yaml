# A pensioner's Council Tax Reduction applicable amount includes an amount for
# each child or young person in the family and, where the scheme still has one,
# a family premium:
#
# - England: SI 2012/2885 Sch 1 para 6(1)(b) and (c), Sch 2 paras 2 and 3.
#   2026-27 child or young person amount 87.88 a week (SI 2026/27); the family
#   premium is nil for reduction weeks beginning after 1 May 2016. From
#   2018-19 to 2024-25 para 6(1)(b) counted up to two children or young
#   persons, or those an award of Child Tax Credit included if more (SI
#   2017/1305 reg 7; removed by SI 2025/39 reg 5(2)).
# - Wales: WSI 2013/3029 Sch 1 para 1(1)(b) and (c), Sch 2 paras 2 and 3.
#   2026-27 amounts 87.88 and a family premium of 20.22.
# - Scotland: SSI 2012/319 reg 20(b), Sch 1 para 3. 2026-27 amount 109.85;
#   the family premium was removed from 1 May 2016 (SSI 2016/81 reg 18).
#
# Each amount runs from birth to the day before the 20th birthday, for a
# Child Benefit qualifying young person. Every person aged 72 or 80 here
# reached State Pension age before 1 April 2021, so the single or lone parent
# personal allowance is 256.00 a week and the couple allowance 383.35 (SI
# 2012/2885 Sch 2 para 1; WSI 2013/3029 Sch 2 para 1; SSI 2012/319 Sch 1
# para 2). Annual amounts are 52 weeks.

- name: Case 1, an English 72-year-old alone gets the personal allowance only.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
        state_pension: 12_570
    benunits:
      benunit:
        members: [pensioner]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_pensioner: true
    council_tax_reduction_pensioner_child_amounts: 0
    council_tax_reduction_pensioner_family_premium: 0
    council_tax_reduction_applicable_amount: 256.00 * 52

- name: Case 2, an English 72-year-old with a ten-year-old gets the child amount but no family premium.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
        state_pension: 12_570
      child:
        age: 10
    benunits:
      benunit:
        members: [pensioner, child]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner, child]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_pensioner: true
    is_child_or_young_person_for_council_tax_reduction: [false, true]
    # 87.88 * 52 = 4,569.76.
    council_tax_reduction_pensioner_child_amounts: 4_569.76
    council_tax_reduction_pensioner_family_premium: 0
    # 13,312 + 4,569.76.
    council_tax_reduction_applicable_amount: 17_881.76

- name: Case 3, an English 72-year-old with a 17-year-old at school gets the young person's amount.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
        state_pension: 12_570
      student:
        age: 17
        current_education: UPPER_SECONDARY
        age_started_or_accepted_current_education_or_training: 16
    benunits:
      benunit:
        members: [pensioner, student]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner, student]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 2_000
        savings: 0
  output:
    is_qualifying_young_person_for_child_benefit: [false, true]
    is_child_or_young_person_for_council_tax_reduction: [false, true]
    council_tax_reduction_pensioner_child_amounts: 87.88 * 52
    council_tax_reduction_applicable_amount: (256.00 + 87.88) * 52

