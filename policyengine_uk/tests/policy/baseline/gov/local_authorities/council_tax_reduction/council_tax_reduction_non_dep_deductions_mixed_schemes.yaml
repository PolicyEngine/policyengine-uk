- name: Scotland, working-age head and pension-age sharer, the partner rule only for the working-age claim
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        is_household_head: true
        current_education: NOT_IN_EDUCATION
      sharer:
        age: 70
        current_education: NOT_IN_EDUCATION
      recipient:
        age: 35
        esa_income_reported: 5_200
        current_education: NOT_IN_EDUCATION
      worker:
        age: 35
        employment_income: 15_600
        hours_worked: 1_560 # 30 a week
        current_education: NOT_IN_EDUCATION
    benunits:
      head_family:
        members: [head]
        would_claim_uc: false
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
        would_claim_uc: false
      couple_family:
        members: [recipient, worker]
        esa_income: 5_200
        would_claim_uc: false
        universal_credit_pre_benefit_cap: 0
    households:
      home:
        members: [head, sharer, recipient, worker]
        country: SCOTLAND
        rent: 12_000
        tenure_type: RENT_PRIVATELY
        council_tax: 2_000
        savings: 0
  output:
    # Working-age head (SSI 2021/249 reg 90(8)(a), reg 4(1)): the worker is
    # the partner of an income-related ESA claimant not on UC, so no
    # deduction. Pension-age sharer (SSI 2012/319 reg 48): only the recipient
    # is exempt; the worker is banded on the couple's 400 a week, 10.95 * 52
    # = 569.40, half each. The person-level flags report the head's scheme.
    council_tax_reduction_non_dep_deductions: [0, 284.70, 0]
    council_tax_reduction_non_dep_deduction_exempt: [false, false, true, true]

