        age: 40
        is_household_head: false
    benunits:
      older_family:
        members: [older_flagged]
        council_tax_reduction_applicable_income: 0
      younger_family:
        members: [younger_flagged]
        council_tax_reduction_applicable_income: 0
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
        council_tax_reduction_applicable_income: 0
    households:
      home:
        members: [older_flagged, younger_flagged, sharer]
        rent: 9_000
        tenure_type: RENT_PRIVATELY
        country: WALES
        local_authority: CARDIFF
        council_tax: 1_800
        savings: 0
  output:
    # Malformed input. The eldest flagged member is the head; the other
    # flagged family neither claims nor counts as jointly liable. (Rent
    # variables read the raw flag, so that family still has a share of the
    # rent.)
    council_tax_reduction_claimant_benunit: [true, false, true]
    council_tax_reduction_joint_liability_share: [0.5, 1, 0.5]
    simulated_council_tax_reduction_benunit: [900, 0, 900]
    council_tax_reduction: 1_800

