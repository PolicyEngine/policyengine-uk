- name: Two working-age adults of the same age in Newham - the other adult is a non-dependant
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      friend:
        age: 40
        is_household_head: false
      householder:
        age: 40
        is_household_head: true
    benunits:
      friend_family:
        members: [friend]
        would_claim_uc: false
        claims_all_entitled_benefits: true
      householder_family:
        members: [householder]
        would_claim_uc: false
        claims_all_entitled_benefits: true
    households:
      home:
        members: [friend, householder]
        country: ENGLAND
        local_authority: NEWHAM
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_claimant_benunit: [false, true]
    # The friend, not in remunerative work: 7.54 a week x 52 = 392.08.
    newham_council_tax_reduction_non_dep_deductions: [0, 392.08]
    # 1,800 x 70% - 392.08 = 867.92, once.
    newham_council_tax_reduction: [0, 867.92]
    council_tax_reduction: 867.92

