- name: A pensioner living in their adult child's home in Scotland is a non-dependant, not the claimant
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 45
        is_household_head: true
      parent:
        age: 80
        is_household_head: false
        council_tax_reduction_individual_non_dep_deduction: 200
    benunits:
      householder_family:
        members: [householder]
        council_tax_reduction_applicable_income: 0
      parent_family:
        members: [parent]
        council_tax_reduction_applicable_income: 0
    households:
      home:
        members: [householder, parent]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
        savings: 0
  output:
    # The eldest adult is not the liable resident; the head is.
    benunit_contains_household_head: [true, false]
    council_tax_reduction_claimant_benunit: [true, false]
    council_tax_reduction_household_has_pensioner: false
    council_tax_reduction_individual_non_dep_deduction_eligible: [false, true]
    council_tax_reduction_non_dep_deductions: [200, 0]
    simulated_council_tax_reduction_benunit: [1_600, 0]
    council_tax_reduction: 1_600

- name: A pensioner in their working-age child's home in England does not put the household on the pensioner scheme
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 45
        is_household_head: true
      parent:
        age: 80
        is_household_head: false
        attendance_allowance: 5_000
    benunits:
      householder_family:
        members: [householder]
        would_claim_uc: false
      parent_family:
        members: [parent]
    households:
      home:
        members: [householder, parent]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 1_800
        savings: 0
  output:
    # The claimant's family is working-age; Maidstone's working-age scheme is
    # not modelled, so no simulated reduction.
    council_tax_reduction_household_has_pensioner: false
    council_tax_reduction_scheme_supported: false
    simulated_council_tax_reduction_benunit: [0, 0]
    # A non-dependant's Attendance Allowance does not exempt the claimant
    # from non-dependant deductions (SI 2012/2885 Sch 1 para 8(6)).
    council_tax_reduction_household_has_non_dep_exemption: false

- name: With two members flagged as head, the eldest flagged member's family claims
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      younger_flagged:
        age: 60
        is_household_head: true
      eldest_unflagged:
        age: 90
        is_household_head: false
      older_flagged:
        age: 70
        is_household_head: true
    benunits:
      younger_family:
        members: [younger_flagged]
      eldest_family:
        members: [eldest_unflagged]
      older_family:
        members: [older_flagged]
    households:
      home:
        members: [younger_flagged, eldest_unflagged, older_flagged]
        country: WALES
        local_authority: CARDIFF
        council_tax: 1_800
  output:
    benunit_contains_household_head: [false, false, true]
    council_tax_reduction_claimant_benunit: [false, false, true]

