# Who claims Council Tax Reduction in a household of several families.
# Only a person liable to pay the council tax is in a class entitled to a
# reduction: England SI 2012/2885 Sch 1 paras 2(a) and 3(a); Wales SI
# 2013/3029 regs 22(a) to 25(a); Scotland SSI 2021/249 reg 13(1) and (3)(a)
# and SSI 2012/319 reg 14(1) and (3)(a). The liable resident is the one with
# the greatest interest in the dwelling (Local Government Finance Act 1992
# s.6 in England and Wales, s.75 in Scotland), not the eldest. The model
# takes the household head (the household reference person, a householder)
# as that person, so the head's family claims and every other adult is a
# non-dependant (SI 2012/2885 reg 9; SI 2013/3029 reg 9; SSI 2021/249 reg 8).
# Joint liability where the rent is shared: joint_liability.yaml.

- name: Two single pensioners of the same age in England - only the head's family claims
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      friend:
        age: 85
        is_household_head: false
        council_tax_reduction_individual_non_dep_deduction: 0
      householder:
        age: 85
        is_household_head: true
    benunits:
      friend_family:
        members: [friend]
        council_tax_reduction_applicable_income: 0
      householder_family:
        members: [householder]
        council_tax_reduction_applicable_income: 0
    households:
      home:
        members: [friend, householder]
        country: ENGLAND
        local_authority: MAIDSTONE
        council_tax: 1_800
        savings: 0
  output:
    benunit_contains_household_head: [false, true]
    council_tax_reduction_claimant_benunit: [false, true]
    council_tax_reduction_individual_non_dep_deduction_eligible: [true, false]
    simulated_council_tax_reduction_benunit: [0, 1_800]
    # One award of the council tax, not two.
    council_tax_reduction: 1_800

- name: Two single pensioners of the same age in Scotland with no head flagged - one family claims
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      first:
        age: 85
        council_tax_reduction_individual_non_dep_deduction: 0
      second:
        age: 85
        council_tax_reduction_individual_non_dep_deduction: 0
    benunits:
      first_family:
        members: [first]
        council_tax_reduction_applicable_income: 0
      second_family:
        members: [second]
        council_tax_reduction_applicable_income: 0
    households:
      home:
        members: [first, second]
        country: SCOTLAND
        local_authority: CITY_OF_EDINBURGH
        council_tax: 1_800
        savings: 0
  output:
    # With no input, the eldest member is the head, ties by order.
    is_household_head: [true, false]
    council_tax_reduction_claimant_benunit: [true, false]
    simulated_council_tax_reduction_benunit: [1_800, 0]
    council_tax_reduction: 1_800

