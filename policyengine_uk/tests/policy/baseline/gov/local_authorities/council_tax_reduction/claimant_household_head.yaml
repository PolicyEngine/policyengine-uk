- name: A sharer with no rent to pay is a claimant, not a non-dependant
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      householder:
        age: 40
        is_household_head: true
      sharer:
        age: 35
        is_household_head: false
    benunits:
      householder_family:
        members: [householder]
        council_tax_reduction_applicable_income: 0
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
        council_tax_reduction_applicable_income: 0
    households:
      home:
        members: [householder, sharer]
        rent: 0
        tenure_type: RENT_PRIVATELY
        country: WALES
        local_authority: CARDIFF
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_claimant_benunit: [true, true]
    council_tax_reduction_joint_liability_share: [0.5, 0.5]
    # Jointly and severally liable people are not non-dependants (SI 2013/3029
    # reg 9(2)(d)), even when no rent is payable.
    council_tax_reduction_individual_non_dep_deduction_eligible: [false, false]
    simulated_council_tax_reduction_benunit: [900, 900]
    council_tax_reduction: 1_800

