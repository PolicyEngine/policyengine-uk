        is_household_head: false
      sharer:
        age: 40
        is_household_head: false
      other_adult:
        age: 30
        is_household_head: false
        council_tax_reduction_individual_non_dep_deduction: 0
    benunits:
      eldest_family:
        members: [eldest]
        council_tax_reduction_applicable_income: 0
      sharer_family:
        members: [sharer]
        liable_for_share_of_household_rent: true
        council_tax_reduction_applicable_income: 0
      other_family:
        members: [other_adult]
        council_tax_reduction_applicable_income: 0
    households:
      home:
        members: [eldest, sharer, other_adult]
        rent: 9_000
        tenure_type: RENT_PRIVATELY
        country: WALES
        local_authority: CARDIFF
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_claimant_benunit: [true, true, false]
    # Two people jointly liable: the head (by the eldest-member fallback) and
    # the sharer. The shares sum to one.
    council_tax_reduction_joint_liability_share: [0.5, 0.5, 1]
    simulated_council_tax_reduction_benunit: [900, 900, 0]
    council_tax_reduction: 1_800

- name: With two members flagged as head and the rent shared, the council tax is still split only among claimants
