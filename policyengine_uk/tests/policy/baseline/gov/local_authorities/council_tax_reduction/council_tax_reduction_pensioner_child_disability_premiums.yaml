        age: 10
        dla_sc_category: HIGHER
    benunits:
      benunit:
        members: [pensioner, child]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner, child]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
