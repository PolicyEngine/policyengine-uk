# Councils add the disabled child premium and the enhanced disability premium
# to a pensioner's Council Tax Reduction applicable amount for each qualifying
# child or young person in the family:
#
# - England: SI 2012/2885 Sch 1 para 6(1)(d), Sch 2 paras 7 and 8, amounts in
#   Sch 2 Part 4 entries (2) and (3). For schemes from 1 April 2023 the
#   Secretary of State added an AFIP limb to para 7 for any child or young
#   person, and to para 8 for a young person (SI 2023/16 regs 1(3) and
#   7(7)-(8)).
# - Wales: WSI 2013/3029 Sch 1 para 1(1)(d), Sch 2 paras 7, 8 and 12. The
#   Welsh Ministers name AFIP for any child or young person in para 7(1)(c),
#   and added it to para 8 for schemes from 1 April 2024 (WSI 2024/56 regs
#   1(3) and 5(d)).
# - Scotland: SSI 2012/319 reg 20(d), Sch 1 paras 8, 9 and 13. The Scottish
#   Ministers name AFIP for a young person only (paras 8(1)(aa) and 9(ba)).
#
# Weekly amounts, the same in all three nations (each schedule's table of
# premium amounts in force on 30 April):
#   year  enhanced disability premium  disabled child premium
#   2015  24.43                        60.06
#   2022  27.44                        68.04
#   2023  30.17                        74.69
#   2024  32.20                        80.01
#   2026  33.99                        84.46
# So in 2026 the two premiums come to 84.46 * 52 = 4,391.92 and 33.99 * 52 =
# 1,767.48 a year, together 118.45 * 52 = 6,159.40.
#
# Each 2026 pensioner is 72, reached State Pension age before 1 April 2021,
# and gets a single or lone parent personal allowance of 256.00 a week (13,312
# a year). Councils add a child or young person amount of 87.88 a week in
# England and Wales and 109.85 in Scotland, and in Wales a family premium of
# 20.22 (the child_or_young_person and family_premium parameters under
# gov.local_authorities.<nation>.council_tax_reduction.pensioners.applicable_amount).
# A young person here is a 17-year-old at school, a Child Benefit qualifying
# young person (SI 2012/2885 reg 2; WSI 2013/3029 reg 2; SSI 2012/319 reg
# 4). The formula multiplies weekly amounts by 52.

- name: Case A0 England, an English pensioner with no child gets no child disability premium.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
        state_pension: 12_570
    benunits:
      benunit:
        members: [pensioner]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_pensioner_child_disability_premiums: 0
    # 256.00 * 52.
    council_tax_reduction_applicable_amount: 13_312

- name: Case A1 England, a ten-year-old with no disability benefit adds no child disability premium.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      pensioner:
        age: 72
        state_pension: 12_570
      child:
        age: 10
    benunits:
      benunit:
        members: [pensioner, child]
        would_claim_pc: false
        would_claim_uc: false
    households:
      household:
        members: [pensioner, child]
        country: ENGLAND
        local_authority: MAIDSTONE
        tenure_type: OWNED_OUTRIGHT
        council_tax: 2_000
        savings: 0
  output:
    council_tax_reduction_pensioner_child_disability_premiums: 0
    council_tax_reduction_premiums: 0
    # (256.00 + 87.88) * 52.
    council_tax_reduction_applicable_amount: 17_881.76

