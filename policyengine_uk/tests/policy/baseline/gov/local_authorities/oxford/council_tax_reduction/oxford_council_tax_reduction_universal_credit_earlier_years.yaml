- name: Before April 2026 Oxford leaves Child Benefit out of a Universal Credit parent's income (2024)
  # Children aged 3 and 5, no housing costs. UC: (393.45 + 2 x 287.92) x 12
  # = 11,631.48 less 55% x (15,839.60 - 673 x 12) = 4,269.98: 7,361.50.
  # Paragraphs 14 to 27 count the Child Benefit of 2,212.60, which Oxford
  # takes off again: 17,139.60 + 7,361.50 = 24,501.10 a year, 471.18 a week:
  # band 1, 100%. Appendix 3 would give 488.73, band 2.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
      person2:
        age: 3
      person3:
        age: 5
    benunits:
      benunit:
        members: [person1, person2, person3]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 0
        uc_deduction_rate: 0
    households:
      household:
        members: [person1, person2, person3]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    universal_credit: 7_361.50
    child_benefit: 2_212.60
    council_tax_reduction_applicable_income: 26_713.70
    oxford_council_tax_reduction: 1_800

