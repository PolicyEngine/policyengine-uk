# Oxford Council Tax Reduction before April 2026.
#
# The model holds Oxford's 2026-27 scheme: its parameters start on 1 April
# 2026 and backdating carries them to earlier years, so earlier years read the
# 2026-27 bands (Part 1 para 9: 100% up to 480.00 a week, 75% to 530.00, 50%
# to 580.00, 25% to 660.00). Appendix 3's income applies from April 2026
# (gov.local_authorities.oxford.council_tax_reduction.universal_credit.
# in_effect). Before then a working-age applicant with a Universal Credit
# award stays on the paragraphs 14 to 27 income, which deducts half of pension
# contributions (para 18), counts the award, leaves out Child Benefit and
# child maintenance, and adds no tariff income from capital. These cases keep
# the results the model gave before PolicyEngine encoded Appendix 3.
#
# The applicant, 35, earns 20,000 and pays 2,600 into an occupational
# pension, or earns 15,600 with no contributions. Income tax 20% above the
# 12,570 personal allowance and National Insurance 8% above the 12,570
# primary threshold in both 2024-25 and 2025-26: on 20,000 less 2,600, tax
# 966 and National Insurance 594.40, so DWP net earned income is 15,839.60
# and the paragraphs 14 to 27 earnings are 20,000 - 966 - 594.40 - 1,300 =
# 17,139.60; on 15,600, tax 606 and National Insurance 242.40, so both are
# 14,751.60. DWP's monthly rates: standard allowance, single 25 or over,
# 393.45 (2024-25) and 400.14 (2025-26); child born on or after 6 April 2017
# 287.92 and 292.81; higher work allowance 673 and 684. Child Benefit a week:
# 25.60 and 16.95 (2024-25), 26.05 and 17.25 (2025-26). Council tax 1,800,
# no capital and no non-dependants.

- name: Before April 2026 Oxford bands a single Universal Credit claimant on the paragraphs 14 to 27 income (2024)
  # UC: 393.45 x 12 + 12,500 housing - 55% x 15,839.60 = 8,509.62.
  # Paragraphs 14 to 27: 17,139.60 + 8,509.62 = 25,649.22 a year, 493.25 a
  # week: band 2, 75% of 1,800. Appendix 3 would give 468.25, band 1.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 12_500
        uc_deduction_rate: 0
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    universal_credit: 8_509.62
    council_tax_reduction_applicable_income: 25_649.22
    oxford_council_tax_reduction: 1_350

