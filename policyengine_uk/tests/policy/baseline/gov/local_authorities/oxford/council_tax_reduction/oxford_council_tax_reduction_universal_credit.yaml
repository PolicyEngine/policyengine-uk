    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    income_tax: 3_366
    national_insurance: 1_554.40
    universal_credit: 0
    council_tax_reduction_applicable_income: 25_779.60
