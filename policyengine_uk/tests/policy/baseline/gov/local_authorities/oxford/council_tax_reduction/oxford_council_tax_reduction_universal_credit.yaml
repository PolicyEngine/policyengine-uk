- name: Oxford counts miscellaneous income once, in DWP's net earned income
  # As the Child Benefit case, with 2,600 of miscellaneous income. The model
  # counts it in DWP's net earned income (uc_individual_earned_income_before_mif;
  # issue 1961 asks whether DWP counts it as unearned income under reg
  # 66(1)(m) instead), so the model leaves it out of Oxford's other income.
  # - Income tax: 20% x (15,600 + 2,600 - 12,570) = 1,126.
  # - National Insurance, on the earnings alone: 8% x (15,600 - 12,570) = 242.40.
  # - DWP net earned income: 15,600 + 2,600 - 1,126 - 242.40 = 16,831.60.
  # UC: maximum amount 424.90 x 12 + 2 x 303.94 x 12 = 12,393.36, higher work
  # allowance 710 x 12 = 8,520, reduction 55% x (16,831.60 - 8,520) =
  # 4,571.38, award 7,821.98. Appendix 3: 16,831.60 + 7,821.98 + 2,337.40
  # Child Benefit = 26,990.98 a year, 519.06 a week: band 2, 75% of 1,800.
  # Counting the 2,600 again as other income would give 29,590.98, 569.06 a
  # week, band 3 (900).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 15_600
        miscellaneous_income: 2_600
      person2:
        age: 5
      person3:
        age: 8
    benunits:
      benunit:
        members: [person1, person2, person3]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 0
        uc_deduction_rate: 0
    households:
      household:
        members: [person1, person2, person3]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    income_tax: [1_126, 0, 0]
    national_insurance: [242.40, 0, 0]
    uc_earned_income_before_work_allowance: 16_831.60
    universal_credit: 7_821.98
    child_benefit: 2_337.40
    oxford_council_tax_reduction_universal_credit_other_income: 2_337.40
    oxford_council_tax_reduction_universal_credit_income: 26_990.98
    oxford_council_tax_reduction: 1_350

