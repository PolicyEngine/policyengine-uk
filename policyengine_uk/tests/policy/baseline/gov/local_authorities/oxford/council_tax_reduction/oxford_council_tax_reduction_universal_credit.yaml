# A carer who receives Carer Support from Social Security Scotland and moves
# to another part of the United Kingdom keeps it for 13 weeks (SSI 2023/302
# reg 42), with the Scottish Carer Supplement for each week of the carer
# support payment (reg 14A). The 2026-27 weekly rates: carer support payment
# 86.45, supplement 11.70. Each case: a lone parent, 35, children 5 and 8, no
# earnings, the carer element in the award (209.34 x 12 = 2,512.08), Child
# Benefit 2,337.40. DWP counts the carer support payment only up to a year of
# Carer's Allowance, 86.45 x 52 = 4,495.40 (reg 66(1)(b)(iiia)), and not the
# supplement, and does not cap an award with a carer element (reg 83(1)(j)).
# Oxford ignores 48.15 x 52 = 2,503.80 of the carer element and counts both
# payments whole, since it ignores the part above Carer's Allowance only in
# Appendix 5, for applicants without Universal Credit.

