  # all 1,977.48 of the lower-rate one, 6,369.40. Appendix 3, with Child
  # Benefit of 2,337.40: 15,839.60 + 2,337.40 + 17,653.78 - 6,369.40 =
  # 29,461.38 a year, 566.57 a week: band 3, 50% of 1,800. One 84.46 a week
  # for the whole award would leave 604.59 a week, band 4.
