  # Housing 10,500. UC: maximum amount 666.97 x 12 + 2 x 209.34 x 12 + 10,500
  # = 23,527.80, no work allowance, reduction 55% x 12,570 = 6,913.50, award
  # 16,614.30. Oxford ignores 48.15 x 52 = 2,503.80 of each carer element
  # (each 2,512.08), 5,007.60 in all. Appendix 3: 12,570 + 16,614.30 -
  # 5,007.60 = 24,176.70 a year, 464.94 a week: band 1, 100% of 1,800. One
  # disregard for the couple would leave 513.09 a week, band 2.
  period: 2026
  absolute_error_margin: 0.01
