  # 1,123.85 = 23,881.59. Other income 2,337.40 + 1,123.85 + 608.40 =
  # 4,069.65. Appendix 3: 23,881.59 - 2,503.80 + 4,069.65 = 25,447.44 a year,
  # 489.37 a week: band 2, 75% of 1,800. Leaving out the supplement would
