# Oxford Council Tax Reduction Scheme 2026 to 2027
# (https://www.oxford.gov.uk/council-tax-reduction/council-tax-reduction-scheme-2026-27).
#
# Part 1 para 9 bands two groups of working-age applicants on weekly income:
# those who do not receive Universal Credit, whose income "is calculated in
# accordance with paragraphs 14-27", and those who do, whose income follows
# Appendix 3. The heading before para 14 says "Paragraphs 14-27, and Annexes 5
# and 6, apply to pensioners, and working-age applicants who do not receive
# Universal Credit". Para 18 deducts "50% of contributions to occupational or
# personal pension schemes" from earnings.
#
# Appendix 3 (page /4): "The income of applicants who receive Universal Credit
# is calculated by adding their net earned income (as provided by DWP) to the
# amount of Universal Credit awarded. Any transitional protection (the
# 'transitional element' of Universal Credit) included in the Universal Credit
# award is ignored. Other (unearned) income is calculated separately on a
# weekly basis." DWP's net earned income deducts "any relievable pension
# contributions made by the person" in full, with income tax and primary Class
# 1 contributions (UC Regs 2013 reg 55(5)(a) and (b)).
#
# Bands, weekly income (Part 1 para 9 and Appendix 3): up to 480.00 100%;
# 480.01 to 530.00 75%; 530.01 to 580.00 50%; 580.01 to 660.00 25%; above
# 660.00 nil. A weekly amount is a fifty-second of the yearly amount.
#
# Common facts: period 2026 (the 2026-27 rates), council tax 1,800, no
# capital, no non-dependants. The applicant, 35, earns 20,000 and pays 2,600
# (50 a week) into an occupational pension, which the model deducts from pay
# before income tax.
# - Income tax: 20% x (20,000 - 2,600 - 12,570) = 966.
# - National Insurance: 8% x (20,000 - 12,570) = 594.40.
# - DWP net earned income (reg 55(5)): 20,000 - 966 - 594.40 - 2,600 = 15,839.60.
# Universal Credit amounts are DWP's 2026-27 monthly rates: standard
# allowance, single 25 or over, 424.90; child (born on or after 6 April
# 2017) 303.94; lower work allowance 427. The taper is 55% (reg 22). Every
# award below sits under the benefit cap outside Greater London (14,753
# single, 22,020 otherwise).

- name: Oxford assesses a Universal Credit claimant on DWP net earned income plus the award
  # UC: maximum amount 424.90 x 12 + 12,500 housing = 17,598.80. No child or
  # limited capability, so no work allowance (reg 22(2)). Reduction 55% x
  # 15,839.60 = 8,711.78. Award 17,598.80 - 8,711.78 = 8,887.02.
  # Appendix 3: 15,839.60 + 8,887.02 = 24,726.62 a year, 475.51 a week:
  # band 1, 100% of 1,800.
  # The paragraphs 14-27 income it replaces deducts half the contributions:
  # 20,000 - 966 - 594.40 - 1,300 + 8,887.02 = 26,026.62, 500.51 a week,
  # which band 2 would reduce to 75% (1,350).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 12_500
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    income_tax: 966
    national_insurance: 594.40
    uc_earned_income_before_work_allowance: 15_839.60
    uc_work_allowance: 0
    universal_credit: 8_887.02
    oxford_council_tax_reduction_universal_credit_income: 24_726.62
    council_tax_reduction_applicable_income: 26_026.62
    oxford_council_tax_reduction: 1_800
    council_tax_reduction: 1_800

- name: A reform of Oxford's pension contribution share leaves a Universal Credit claimant's reduction alone
  # Model reform, not current law. With no share deducted, the paragraphs
  # 14-27 income rises to 20,000 - 966 - 594.40 + 8,887.02 = 27,326.62, but
  # Appendix 3 reads DWP's figure, so the income stays 24,726.62 and the
  # reduction 1,800.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.local_authorities.oxford.council_tax_reduction.means_test.pension_contribution_deduction_rate: 0
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 12_500
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_pension_contribution_deduction_rate: 0
    council_tax_reduction_applicable_income: 27_326.62
    oxford_council_tax_reduction_universal_credit_income: 24_726.62
    oxford_council_tax_reduction: 1_800

- name: A full Oxford pension contribution share leaves a Universal Credit claimant's reduction alone
  # Model reform, not current law. Deducting all the contributions brings the
  # paragraphs 14-27 income down to 24,726.62, the Appendix 3 income, which is
  # unchanged.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.local_authorities.oxford.council_tax_reduction.means_test.pension_contribution_deduction_rate: 1
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 12_500
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_applicable_income: 24_726.62
    oxford_council_tax_reduction_universal_credit_income: 24_726.62
    oxford_council_tax_reduction: 1_800

- name: Oxford still assesses a claimant without Universal Credit under paragraphs 14 to 27
  # Earnings 32,000 and 2,600 contributions, no Universal Credit claim.
  # Income tax 20% x (32,000 - 2,600 - 12,570) = 3,366; National Insurance
  # 8% x (32,000 - 12,570) = 1,554.40. Para 18: 32,000 - 3,366 - 1,554.40 -
  # 50% x 2,600 = 25,779.60 a year, 495.76 a week: band 2, 75% of 1,800.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 32_000
        employee_pension_contributions: 2_600
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        claims_all_entitled_benefits: true
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    income_tax: 3_366
    national_insurance: 1_554.40
    universal_credit: 0
    council_tax_reduction_applicable_income: 25_779.60
    oxford_council_tax_reduction: 1_350

- name: Oxford's pension contribution share still moves a claimant without Universal Credit
  # Model reform, not current law. Deducting all the contributions: 32,000 -
  # 3,366 - 1,554.40 - 2,600 = 24,479.60 a year, 470.76 a week: band 1, 100%.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.local_authorities.oxford.council_tax_reduction.means_test.pension_contribution_deduction_rate: 1
    people:
      person1:
        age: 35
        employment_income: 32_000
        employee_pension_contributions: 2_600
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: false
        claims_all_entitled_benefits: true
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    council_tax_reduction_applicable_income: 24_479.60
    oxford_council_tax_reduction: 1_800

- name: Oxford counts a lone parent's net earned income before the work allowance and no Child Benefit
  # A lone parent with one child aged 5. UC: maximum amount (424.90 + 303.94)
  # x 12 + 7,000 housing = 15,746.08. Lower work allowance 427 x 12 = 5,124
  # (reg 22(2)). Reduction 55% x (15,839.60 - 5,124) = 5,893.58. Award
  # 15,746.08 - 5,893.58 = 9,852.50.
  # Appendix 3 adds net earned income, not earned income less the work
  # allowance, and the award; Child Benefit is not Universal Credit's
  # unearned income: 15,839.60 + 9,852.50 = 25,692.10 a year, 494.08 a week:
  # band 2, 75% of 1,800. Less the work allowance it would be 395.54 a week,
  # band 1.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
      person2:
        age: 5
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 7_000
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    uc_earned_income_before_work_allowance: 15_839.60
    uc_work_allowance: 5_124
    uc_unearned_income: 0
    universal_credit: 9_852.50
    oxford_council_tax_reduction_universal_credit_income: 25_692.10
    oxford_council_tax_reduction: 1_350

- name: Oxford counts a Universal Credit claimant's other income
  # As the first case, with maintenance of 5,200 (100 a week) from a former
  # spouse, which Universal Credit counts as unearned income (reg 66(1)(d))
  # and deducts in full: award 17,598.80 - 8,711.78 - 5,200 = 3,687.02.
  # Appendix 3 counts it weekly with the rest: 15,839.60 + 5,200 + 3,687.02 =
  # 24,726.62 a year, 475.51 a week: band 1, 100%.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
        spousal_maintenance_income: 5_200
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 12_500
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    uc_unearned_income: 5_200
    universal_credit: 3_687.02
    oxford_council_tax_reduction_universal_credit_income: 24_726.62
    oxford_council_tax_reduction: 1_800

# Appendix 3 also ignores "£48.15 of the Universal Credit carer element" and
# "£84.46 of the Universal Credit disabled child element". An award includes
# a carer element for each claimant who cares (UC Regs 2013 reg 29) and a
# disabled child addition for each disabled child (reg 24(2)). The amounts
# are the 2026-27 carer premium and disabled child premium, which Housing
# Benefit gives for each carer and each disabled child (HB Regs 2006 Sch 3
# para 20(7) and (8)), so the model ignores up to each
# amount for each element, taking it off the award but not below nil. DWP's
# 2026-27 monthly amounts: carer 209.34 (48.31 a week); disabled child
# addition, lower rate 164.79 (38.03 a week), higher rate 514.71 (118.78 a
# week).

- name: Oxford ignores 48.15 a week of a Universal Credit carer element
  # As the first case, with the carer element: maximum amount 17,598.80 +
  # 209.34 x 12 = 20,110.88, award 20,110.88 - 8,711.78 = 11,399.10. The
  # element is 48.31 a week, so Oxford ignores 48.15 x 52 = 2,503.80 of it.
  # Appendix 3: 15,839.60 + 11,399.10 - 2,503.80 = 24,734.90 a year, 475.67 a
  # week: band 1, 100% of 1,800. Counting the whole award it would be 523.82
  # a week, band 2.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
        uc_carer_element_included_for_claimant: true
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 12_500
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    uc_carer_element: 2_512.08
    universal_credit: 11_399.10
    oxford_council_tax_reduction_universal_credit_income: 24_734.90
    oxford_council_tax_reduction: 1_800

- name: Oxford's carer element disregard takes the award no lower than nil
  # Housing 2,000: maximum amount 5,098.80 + 2,512.08 + 2,000 = 9,610.88,
  # award 9,610.88 - 8,711.78 = 899.10, less than the 2,503.80 ignored, so
  # the award counts nil. Appendix 3: 15,839.60 a year, 304.61 a week: band
  # 1, 100%.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
        uc_carer_element_included_for_claimant: true
    benunits:
      benunit:
        members: [person1]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 2_000
    households:
      household:
        members: [person1]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    universal_credit: 899.10
    oxford_council_tax_reduction_universal_credit_income: 15_839.60
    oxford_council_tax_reduction: 1_800

- name: Oxford ignores the whole lower-rate disabled child addition
  # As the lone-parent case, with a disabled child: maximum amount 15,746.08
  # + 164.79 x 12 = 17,723.56, award 17,723.56 - 5,893.58 = 11,829.98. The
  # addition, 38.03 a week, is under 84.46, so Oxford ignores all 1,977.48.
  # Appendix 3: 15,839.60 + 11,829.98 - 1,977.48 = 25,692.10 a year, 494.08 a
  # week: band 2, 75% of 1,800. Counting the whole award it would be 532.11 a
  # week, band 3.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
      person2:
        age: 5
        is_disabled_for_benefits: true
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 7_000
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    uc_disability_elements: 1_977.48
    universal_credit: 11_829.98
    oxford_council_tax_reduction_universal_credit_income: 25_692.10
    oxford_council_tax_reduction: 1_350

- name: Oxford ignores 84.46 a week of a higher-rate disabled child addition
  # Maximum amount 15,746.08 + 514.71 x 12 = 21,922.60, award 21,922.60 -
  # 5,893.58 = 16,029.02. The addition is 118.78 a week, so Oxford ignores
  # 84.46 x 52 = 4,391.92 of it. Appendix 3: 15,839.60 + 16,029.02 - 4,391.92 =
  # 27,476.70 a year, 528.40 a week: band 2, 75% of 1,800. Counting the whole
  # award it would be 612.86 a week, band 4.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
      person2:
        age: 5
        is_disabled_for_benefits: true
        meets_uc_higher_disabled_child_condition: true
    benunits:
      benunit:
        members: [person1, person2]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 7_000
    households:
      household:
        members: [person1, person2]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    uc_disability_elements: 6_176.52
    universal_credit: 16_029.02
    oxford_council_tax_reduction_universal_credit_income: 27_476.70
    oxford_council_tax_reduction: 1_350

- name: Oxford ignores part of each disabled child's addition separately
  # A lone parent with two disabled children, aged 5 (higher rate) and 8
  # (lower rate), and 3,000 housing. Maximum amount 424.90 x 12 + 2 x 303.94
  # x 12 + 514.71 x 12 + 164.79 x 12 + 3,000 = 23,547.36, award 23,547.36 -
  # 5,893.58 = 17,653.78. Ignored: 4,391.92 of the higher-rate addition and
  # all 1,977.48 of the lower-rate one, 6,369.40. Appendix 3: 15,839.60 +
  # 17,653.78 - 6,369.40 = 27,123.98 a year, 521.61 a week: band 2, 75% of
  # 1,800. One 84.46 a week for the whole award would leave 559.64 a week,
  # band 3.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 20_000
        employee_pension_contributions: 2_600
      person2:
        age: 5
        is_disabled_for_benefits: true
        meets_uc_higher_disabled_child_condition: true
      person3:
        age: 8
        is_disabled_for_benefits: true
    benunits:
      benunit:
        members: [person1, person2, person3]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 3_000
    households:
      household:
        members: [person1, person2, person3]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    uc_disability_elements: 8_154
    uc_benefit_cap_reduction_after_floor: 0
    universal_credit: 17_653.78
    oxford_council_tax_reduction_universal_credit_income: 27_123.98
    oxford_council_tax_reduction: 1_350
