  # Credit counts it in full (reg 66(1)(d)): award 8,965.98 - 2,600 =
  # 6,365.98. Appendix 3 counts it too: 14,751.60 + 6,365.98 + 2,337.40 +
  # 2,600 = 26,054.98 a year, 501.06 a week: band 2, 75%.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 15_600
        spousal_maintenance_income: 2_600
      person2:
        age: 5
      person3:
        age: 8
    benunits:
      benunit:
        members: [person1, person2, person3]
        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 0
        uc_deduction_rate: 0
    households:
      household:
        members: [person1, person2, person3]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
    universal_credit: 6_365.98
    oxford_council_tax_reduction_universal_credit_other_income: 4_937.40
    oxford_council_tax_reduction_universal_credit_income: 26_054.98
    oxford_council_tax_reduction: 1_350

