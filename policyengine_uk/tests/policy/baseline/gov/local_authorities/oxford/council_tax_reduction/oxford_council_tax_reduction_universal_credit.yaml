- name: A household head who applies alone keeps the income for applicants without Universal Credit
  # A grandmother, 50, heads the household and shares a benefit unit with
  # parents aged 17 and their baby, who claim Universal Credit. The award and
  # the Child Benefit are the couple's, so she applies alone, without an
  # award, under paragraphs 14 to 27 on her own income: a private pension of
  # 27,400 less income tax of 20% x (27,400 - 12,570) = 2,966 is 24,434 a
  # year, 469.88 a week: band 1, 100%. Counting the baby's Child Benefit it
  # would be 496.93 a week, band 2. The couple's award, with no earnings, is
  # the under-25 couple standard allowance 528.34 plus the child element
  # 303.94, 832.28 x 12 = 9,987.36 a year. Her Appendix 3 income, which the
  # model calculates but does not band, leaves out the couple's award and
  # Child Benefit and counts her own pension alone: 27,400.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      grandmother:
        age: 50
        is_household_head: true
        private_pension_income: 27_400
      young_mother:
        age: 17
        is_parent: true
        is_household_head: false
      young_father:
        age: 17
        is_parent: true
        is_household_head: false
      baby:
        age: 0
        is_household_head: false
    benunits:
      family:
        members: [grandmother, young_mother, young_father, baby]
        claims_all_entitled_benefits: true
        would_claim_uc: true
    households:
