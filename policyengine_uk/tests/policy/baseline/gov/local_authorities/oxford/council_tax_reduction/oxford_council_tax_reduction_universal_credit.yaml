        would_claim_uc: true
        claims_all_entitled_benefits: true
        uc_housing_costs_element: 10_100
        uc_deduction_rate: 0
    households:
      household:
        members: [person1, person2, person3]
        country: ENGLAND
        local_authority: OXFORD
        council_tax: 1_800
        savings: 0
  output:
