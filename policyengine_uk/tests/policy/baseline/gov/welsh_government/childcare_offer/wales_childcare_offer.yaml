- name: Maintenance counts towards the £100,000 gross income limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 99_000
        maintenance_income: 5_000
      child:
        age: 3
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        region: WALES
  output:
    # 99,000 + 5,000 = 104,000 > 100,000
    wales_childcare_offer: 0

- name: Pay plus maintenance of exactly £100,000 still qualifies
  period: 2026
  absolute_error_margin: 0.01
