# Paragraph 69: gross income is before salary sacrifice. employment_income is
# cash pay, so salary and bonus sacrifice are added back. The add-back counts
# only people with pay (employment_income_before_lsr), which a Simulation fills
# from employment_income but the YAML runner does not, so the cases set both.
- name: Salary sacrifice counts towards the £100,000 gross income limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 99_000
        employment_income_before_lsr: 99_000
        pension_contributions_via_salary_sacrifice: 2_000
      child:
        age: 3
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        region: WALES
  output:
    pension_contributions_via_salary_sacrifice_from_pay: [2_000, 0]
    # 99,000 + 2,000 = 101,000 > 100,000
    wales_childcare_offer: 0

- name: Bonus sacrifice counts towards the £100,000 gross income limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 99_000
        employment_income_before_lsr: 99_000
        pension_contributions_via_bonus_sacrifice: 2_000
      child:
        age: 3
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        region: WALES
  output:
    pension_contributions_via_salary_sacrifice_from_pay: [2_000, 0]
    # 99,000 + 2,000 = 101,000 > 100,000
    wales_childcare_offer: 0

- name: Pay plus salary sacrifice of exactly £100,000 still qualifies
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 98_000
        employment_income_before_lsr: 98_000
