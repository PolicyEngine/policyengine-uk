# Childcare Offer for Wales: the childcare element, valued at the Welsh
# Government's hourly rate to providers. Sources: Childcare Offer for Wales
# guidance for local authorities, version 8.3 (April 2026), and the Welsh
# Government's rate statements (see the parameters for each).
#
# Term time (39 weeks): 30 hours less 10 hours of nursery education (the
# local authority minimum) = 20 childcare hours. Holidays (9 weeks): 30
# childcare hours. Full use: 20 x 39 + 30 x 9 = 780 + 270 = 1,050 hours.
# Rates: £4.50 (to March 2022), £5.00 (April 2022), £6.40 (7 April 2025),
# £6.67 (6 April 2026). Years are sampled at 30 April.
# Minimum earnings in 2026: 16 hours x £12.71 (National Living Wage) =
# £203.36 a week, or £10,574.72 over 52 weeks.

- name: Working couple in Wales with a 3-year-old gets the full childcare element in 2026
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent1:
        age: 30
        employment_income: 20000
      parent2:
        age: 30
        employment_income: 20000
      child:
        age: 3
    benunits:
      benunit:
        members: [parent1, parent2, child]
    households:
      household:
        members: [parent1, parent2, child]
        region: WALES
  output:
    # 1,050 x 6.67
    wales_childcare_offer: 7_003.50
    wales_childcare_offer_eligible: true

