        age: 3
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        region: WALES
  output:
    # 95,000 + 5,000 = 100,000
    wales_childcare_offer: 7_003.50

- name: £100,000 of wages plus £1 of statutory paternity pay is over the limit, like £100,001 of wages
