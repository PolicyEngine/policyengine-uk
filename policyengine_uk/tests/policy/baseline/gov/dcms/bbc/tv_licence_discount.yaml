- name: Ineligible for any discount.
  period: 2023
  input:
    age: 74
    pension_credit: 0
    is_blind: false
  output:
    tv_licence_discount: 0

- name: Eligible for aged discount only.
  period: 2023
  input:
    age: 75
    pension_credit: 1
    is_blind: false
  output:
    tv_licence_discount: 1

- name: Aged over 75 but ineligible for aged discount.
  period: 2023
  input:
    age: 75
    pension_credit: 0
    is_blind: false
  output:
    tv_licence_discount: 0

- name: Eligible for blind discount only.
  period: 2023
  input:
    age: 74
    pension_credit: 0
    is_blind: true
  output:
    tv_licence_discount: 0.5

- name: Eligible for both aged and blind discounts.
  period: 2023
  input:
    age: 75
    pension_credit: 1
    is_blind: true
  output:
    tv_licence_discount: 1

- name: All aged households qualify before the Pension Credit condition.
  period: 2019
  input:
    age: 75
    pension_credit: 0
    is_blind: false
  output:
    tv_licence_discount: 1

- name: The 2020-21 discount reflects the 1 August transition.
  period: 2020
  absolute_error_margin: 0.000001
  input:
    age: 75
    pension_credit: 0
    is_blind: false
  output:
    tv_licence_discount: 0.3205479452

- name: Pension Credit recipients retain the full 2020-21 discount.
  period: 2020
  input:
    age: 75
    pension_credit: 1
    is_blind: false
  output:
    tv_licence_discount: 1

- name: The Pension Credit condition applies for all of 2021-22.
  period: 2021
  input:
    age: 75
    pension_credit: 0
    is_blind: false
  output:
    tv_licence_discount: 0

- name: Separate benefit units do not combine age and Pension Credit.
  period: 2023
  input:
    people:
      older_person:
        age: 75
      pension_credit_recipient:
        age: 70
    benunits:
      older_person_benunit:
        members: [older_person]
        pension_credit: 0
      recipient_benunit:
        members: [pension_credit_recipient]
        pension_credit: 1
    households:
      household:
        members: [older_person, pension_credit_recipient]
  output:
    tv_licence_discount: 0

- name: Partners combine age and Pension Credit within one benefit unit.
  period: 2023
  input:
    people:
      older_partner:
        age: 75
      pension_credit_recipient:
        age: 70
    benunits:
      couple:
        members: [older_partner, pension_credit_recipient]
        pension_credit: 1
    households:
      household:
        members: [older_partner, pension_credit_recipient]
  output:
    tv_licence_discount: 1
