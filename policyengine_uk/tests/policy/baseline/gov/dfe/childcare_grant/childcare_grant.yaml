- name: Childcare Grant is incompatible with WTC childcare element
  period: 2025
  input:
    people:
      student:
        age: 22
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
        employment_income: 10_000
        hours_worked: 1_040
        working_tax_credit_reported: 1
      child:
        age: 5
        childcare_expenses: 6_000
    benunits:
      benunit:
        members: ["student", "child"]
        # Tax credits closed in 2025; keep the award to test the overlap.
        legacy_benefits_closed: false
    households:
      household:
        members: ["student", "child"]
        country: ENGLAND
  output:
    WTC_childcare_element: [4_200]
    childcare_grant_eligible: [false, false]
    childcare_grant: [0, 0]

# Reg. 45 funds eligible dependent children's care. Adult costs and a child's
# costs outside the age/SEN rule do not enlarge the grant.
- name: Case 15, only eligible child costs enter the grant.
  period: 2025
  input:
    people:
      person1:
        age: 24
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
        childcare_expenses: 7_000
      person2:
        age: 4
        childcare_expenses: 5_000
      person3:
        age: 16
        childcare_expenses: 9_000
    benunits:
      benunit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        country: ENGLAND
  output:
    childcare_grant_child_eligible: [false, true, false]
    childcare_grant_eligible_children: 1
    childcare_grant: [4_250, 0, 0] # 0.85 * 5,000

# Reg. 47(5) prevents two full awards for the same children. The annual model
# assigns the family total to the eldest eligible student; that recipient
# selection is a convention, not a statutory eldest-parent rule.
- name: Case 16, two eligible students receive one family grant.
  period: 2025
  input:
    people:
      person1:
        age: 24
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      person2:
        age: 22
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      person3:
        age: 4
        childcare_expenses: 5_000
    benunits:
      benunit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        country: ENGLAND
  output:
    childcare_grant_eligible: [true, true, false]
    childcare_grant: [4_250, 0, 0]

- name: Case 17, reordered members preserve the one-payment convention.
  period: 2025
  input:
    people:
      person1:
        age: 22
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      person2:
        age: 24
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      person3:
        age: 4
        childcare_expenses: 5_000
    benunits:
      benunit:
        members: [person3, person2, person1]
    households:
      household:
        members: [person3, person2, person1]
        country: ENGLAND
  output:
    childcare_grant_eligible: [true, true, false]
    childcare_grant: [0, 4_250, 0]

