# Childcare Grant, Education (Student Support) Regulations 2011 regs 45 and 47:
# https://www.legislation.gov.uk/uksi/2011/1986/regulation/45
# https://www.legislation.gov.uk/uksi/2011/1986/regulation/47
# SFE 2025-26 rates: 85% of eligible children's costs, capped at GBP199.62
# weekly for one child and GBP342.24 for two or more children.
# https://www.gov.uk/childcare-grant/what-youll-get
# These annual-model tests use 52 weeks: GBP10,380.24 and GBP17,796.48.
# Expense inputs belong to the children receiving the care, not the student.

- name: Childcare Grant reimburses 85 percent below one-child cap
  period: 2025
  input:
    people:
      student:
        age: 21
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      child:
        age: 4
        childcare_expenses: 5_000
    benunits:
      benunit:
        members: ["student", "child"]
    households:
      household:
        members: ["student", "child"]
        country: ENGLAND
  output:
    childcare_grant_eligible: [true, false]
    childcare_grant: [4_250, 0]

- name: Childcare Grant is capped at the one-child weekly maximum
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      student:
        age: 20
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      child:
        age: 3
        childcare_expenses: 20_000
    benunits:
      benunit:
        members: ["student", "child"]
    households:
      household:
        members: ["student", "child"]
        country: ENGLAND
  output:
    childcare_grant: [10_380.24, 0]

# One combined family cap applies to asymmetric child costs (20,000 + 5,000),
# rather than a separate one-child cap for each child.
- name: Childcare Grant uses the two-or-more-children cap
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      student:
        age: 23
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      child_1:
        age: 6
        childcare_expenses: 20_000
      child_2:
        age: 8
        childcare_expenses: 5_000
    benunits:
      benunit:
        members: ["student", "child_1", "child_2"]
    households:
      household:
        members: ["student", "child_1", "child_2"]
        country: ENGLAND
  output:
    childcare_grant: [17_796.48, 0, 0]

