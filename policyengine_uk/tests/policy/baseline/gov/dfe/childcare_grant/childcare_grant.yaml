      person1:
        age: 24
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      person2:
        age: 4
        childcare_expenses: 5_000
      person3:
        age: 21
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      person4:
        age: 6
        childcare_expenses: 2_000
    benunits:
      benunit1:
        members: [person1, person2]
      benunit2:
