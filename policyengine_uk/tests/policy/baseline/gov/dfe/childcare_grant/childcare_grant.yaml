        members: [person1, person2, person3, person4]
        country: ENGLAND
  output:
    childcare_grant_eligible: [true, false, true, false]
    childcare_grant_eligible_children: [1, 1]
    childcare_grant: [4_250, 0, 1_700, 0]

# A negative input does not represent eligible spending and cannot offset
# another child's positive childcare costs. This is an input-domain floor.
- name: Case 21, negative costs cannot reduce another child's eligible costs.
  period: 2025
  input:
    people:
      person1:
        age: 24
        is_parent: true
        current_education: TERTIARY
        childcare_grant_full_time_student: true
      person2:
        age: 4
        childcare_expenses: 5_000
      person3:
        age: 6
        childcare_expenses: -1_000
    benunits:
      benunit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        country: ENGLAND
  output:
    childcare_grant_eligible_children: 2
    childcare_grant: [4_250, 0, 0]
