# The example table on docs/book/programs/gov/dfe/universal-childcare-entitlement.ipynb.
# The year 2024 has terms beginning 1 April 2024, 1 September 2024 and
# 1 January 2025. Universal hours start with the term after the third birthday
# (SI 2014/2147 reg 3) and stop when the child starts reception, in the
# September after the fourth birthday. Each term carries 570 / 3 = 190 hours
# at the 2024-25 rate for the child's age band (£5.88 at 3 and over).
# Age is the child's age on 6 October 2024, as date_of_birth requires.
- name: A 2-year-old born 1 January 2022 has no universal term
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      child:
        age: 2
        date_of_birth: 20220101
    benunits:
      benunit:
        members: [child]
    households:
      household:
        members: [child]
        country: ENGLAND
  output:
    universal_childcare_entitlement_eligible: false
    universal_childcare_entitlement: 0

