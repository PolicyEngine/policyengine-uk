- name: Case 8, first base hours are allocated once within genuine working parent hours.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 2
    date_of_birth: 20231007
    country: ENGLAND
    targeted_childcare_entitlement_eligible: true
    extended_childcare_entitlement_eligible: true
    would_claim_universal_childcare: false
    would_claim_targeted_childcare: false
  output:
    # 380 working hours in each term, at £8.90, £8.90 and £6.61.
    extended_childcare_entitlement_total_per_child: 9_275.80
    targeted_childcare_entitlement: 3_382
    universal_childcare_entitlement: 1_255.90
    extended_childcare_entitlement_per_child: 4_637.90

