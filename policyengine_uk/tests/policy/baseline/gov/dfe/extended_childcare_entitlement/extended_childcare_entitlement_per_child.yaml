- name: Adults get nothing
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      parent:
        age: 30
      child:
        age: 3
        # Deliberate synthetic birthday: universal provision starts on
        # 1 April, retaining this fixture's full-570-hour assumption.
        date_of_birth: 20230331
    benunits:
      benunit:
        members: [parent, child]
        extended_childcare_entitlement_eligible: true
  output:
    # The adult gets zero; the child's 1,140 funded hours include 570
    # universal hours, leaving 570 * £6.61 in the working-parent top-up.
    universal_childcare_entitlement: [0, 3_767.70]
    targeted_childcare_entitlement: [0, 0]
    extended_childcare_entitlement_per_child: [0, 3_767.70]
    extended_childcare_entitlement: 3_767.70

# The same overlap through the targeted eligibility formula itself: Income
# Support is a qualifying benefit, and eligibility for the working parent
# entitlement no longer switches the targeted hours off.
- name: Income Support family has targeted first hours in the two common terms
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 2
    benunits:
      benunit:
        members: [child]
        income_support: 1_000
        extended_childcare_entitlement_eligible: true
    households:
      household:
        members: [child]
        country: ENGLAND
  output:
    targeted_childcare_entitlement_eligible: true
    targeted_childcare_entitlement: 3_382.00
    extended_childcare_entitlement_per_child: 7_957.20
    is_child_receiving_targeted_childcare: true
    is_child_receiving_extended_childcare: true

