# Each child's working parent hours are the part of its funded hours above the
# universal (3-4) or targeted (2) hours: Childcare Act 2016 s.1(6)(a), and DfE's
# statutory guidance (April 2026) para A1.11 for a 2-year-old eligible for both.
# Rates per hour: 2025 £8.53 (age 2); 2026 £12.04 (under 2),
# £8.90 (age 2) and £6.61 (3-4).
- name: A 2-year-old eligible for both gets 15 targeted plus 15 working parent hours
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 2
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
        targeted_childcare_entitlement_eligible: true
  output:
    # 570 x 8.90 each
    targeted_childcare_entitlement: 5073.00
    extended_childcare_entitlement_per_child: 5073.00
    extended_childcare_entitlement: 5073.00

- name: Before September 2025 a 2-year-old eligible for both gets the targeted 15 hours
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 2
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
        targeted_childcare_entitlement_eligible: true
  output:
    # The working parent total (15 hours at 1 January 2025) is no more than
    # the targeted 570 hours: 570 x 8.53 targeted, nothing on top.
    targeted_childcare_entitlement: 4862.10
    extended_childcare_entitlement_per_child: 0

- name: A 1-year-old has no universal or targeted hours to come off
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 1
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
  output:
    # 30 x 38 x 12.04
    extended_childcare_entitlement_per_child: 13725.60

# SI 2022/1134 reg 27(1)(a): working parent hours start with the first
# 1 January, 1 April or 1 September after the child is nine months old, each
# term a third of the year.
- name: A baby nine months old by 1 January gets the spring term's hours
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 0
        date_of_birth: 20260315
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
  output:
    # Nine months on 15 December 2026: a third of 30 x 38 x 12.04.
    extended_childcare_entitlement_per_child: 4575.20
    is_child_receiving_extended_childcare: true

- name: A baby nine months old by 1 September gets two terms' hours
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 0
        date_of_birth: 20251115
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
  output:
    # Nine months on 15 August 2026.
    extended_childcare_entitlement_per_child: 9150.40

- name: A 1-year-old nine months old after 1 April misses the summer term
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 1
        date_of_birth: 20250720
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
  output:
    # Nine months on 20 April 2026.
    extended_childcare_entitlement_per_child: 9150.40

# Until April 2024 the minimum age was three (reg 13(2)(a) as made). A
# standalone universal claim runs all year; the working parent hours top it up
# to 30 a week only in the terms after the third birthday. Rate: £5.88 (3-4).
- name: A 3-year-old qualifying from September keeps a full year of universal hours
  period: 2023
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 3
        date_of_birth: 20200801
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
  output:
    # 570 x 5.88, then 15 more hours a week in two of the three terms.
    universal_childcare_entitlement: 3351.60
    extended_childcare_entitlement_per_child: 2234.40

- name: Without standalone take-up such a child's universal hours come only in those terms
  period: 2023
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 3
        date_of_birth: 20200801
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
        would_claim_universal_childcare: false
  output:
    # Two thirds of 570 x 5.88 in each programme.
    universal_childcare_entitlement: 2234.40
    extended_childcare_entitlement_per_child: 2234.40

- name: Working parent participation funds universal first even with false standalone take-up
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 3
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
        would_claim_universal_childcare: false
  output:
    # 15 x 38 x 6.61 in each programme, preserving all 30 funded hours.
    universal_childcare_entitlement_eligible: true
    universal_childcare_entitlement: 3767.70
    extended_childcare_entitlement_per_child: 3767.70
    is_child_receiving_universal_childcare: true
    is_child_receiving_extended_childcare: true

- name: Below 15 hours all working parent usage is universal despite false standalone take-up
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 3
        max_free_entitlement_hours_used: 10
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
        would_claim_universal_childcare: false
  output:
    # 10 x 38 x 6.61; the unpaid standalone floor is not added.
    universal_childcare_entitlement: 2511.80
    extended_childcare_entitlement_per_child: 0
    is_child_receiving_universal_childcare: true
    is_child_receiving_extended_childcare: false

- name: False universal take-up with a ten-hour family cap keeps the ten funded hours
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 4
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
        maximum_extended_childcare_hours_usage: 10
        would_claim_universal_childcare: false
  output:
    universal_childcare_entitlement: 2511.80
    extended_childcare_entitlement_per_child: 0

- name: Legal universal eligibility alone does not create take-up
  period: 2026
  input:
    people:
      child:
        age: 3
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: false
        would_claim_universal_childcare: false
  output:
    universal_childcare_entitlement_eligible: true
    universal_childcare_entitlement: 0
    extended_childcare_entitlement_per_child: 0

- name: Targeted first funding applies despite false standalone targeted take-up
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 2
    benunits:
      benunit:
        members: [child]
        income_support: 1_000
        extended_childcare_entitlement_eligible: true
        would_claim_targeted_childcare: false
  output:
    targeted_childcare_entitlement_eligible: true
    # 15 x 38 x 8.90 in each programme (DfE A1.11).
    targeted_childcare_entitlement: 5073.00
    extended_childcare_entitlement_per_child: 5073.00
    is_child_receiving_targeted_childcare: true
    is_child_receiving_extended_childcare: true

- name: Below 15 hours all working parent usage is targeted despite false standalone take-up
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 2
        max_free_entitlement_hours_used: 10
    benunits:
      benunit:
        members: [child]
        income_support: 1_000
        extended_childcare_entitlement_eligible: true
        would_claim_targeted_childcare: false
  output:
    # 10 x 38 x 8.90, with no unfunded floor subtracted.
    targeted_childcare_entitlement: 3382.00
    extended_childcare_entitlement_per_child: 0
    is_child_receiving_targeted_childcare: true
    is_child_receiving_extended_childcare: false

- name: Before the 30-hour expansion working parent participation is entirely targeted
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 2
    benunits:
      benunit:
        members: [child]
        income_support: 1_000
        extended_childcare_entitlement_eligible: true
        would_claim_targeted_childcare: false
  output:
    targeted_childcare_entitlement: 4862.10
    extended_childcare_entitlement_per_child: 0

- name: Legal targeted eligibility alone does not create take-up
  period: 2026
  input:
    people:
      child:
        age: 2
    benunits:
      benunit:
        members: [child]
        income_support: 1_000
        extended_childcare_entitlement_eligible: false
        would_claim_targeted_childcare: false
  output:
    targeted_childcare_entitlement_eligible: true
    targeted_childcare_entitlement: 0
    extended_childcare_entitlement_per_child: 0

- name: Nothing for a child in a family that is not eligible
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 1
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: false
  output:
    extended_childcare_entitlement_per_child: 0

- name: Adults get nothing
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      parent:
        age: 30
      child:
        age: 3
    benunits:
      benunit:
        members: [parent, child]
        extended_childcare_entitlement_eligible: true
  output:
    # (1,140 - 570) x 6.61 for the child only
    extended_childcare_entitlement_per_child: [0, 3767.70]
    extended_childcare_entitlement: 3767.70

# The same overlap through the targeted eligibility formula itself: Income
# Support is a qualifying benefit, and eligibility for the working parent
# entitlement no longer switches the targeted hours off.
- name: Income Support family eligible for both keeps the targeted hours and gets 15 on top
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 2
    benunits:
      benunit:
        members: [child]
        income_support: 1_000
        extended_childcare_entitlement_eligible: true
    households:
      household:
        members: [child]
        country: ENGLAND
  output:
    targeted_childcare_entitlement_eligible: true
    # 570 x 8.90 each
    targeted_childcare_entitlement: 5073.00
    extended_childcare_entitlement_per_child: 5073.00
    is_child_receiving_targeted_childcare: true
    is_child_receiving_extended_childcare: true

- name: Income Support family eligible for both before September 2025 gets the targeted 15 hours
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child:
        age: 2
    benunits:
      benunit:
        members: [child]
        income_support: 1_000
        extended_childcare_entitlement_eligible: true
    households:
      household:
        members: [child]
        country: ENGLAND
  output:
    targeted_childcare_entitlement_eligible: true
    # 570 x 8.53 targeted; the 15-hour working parent total adds nothing.
    targeted_childcare_entitlement: 4862.10
    extended_childcare_entitlement_per_child: 0
    is_child_receiving_targeted_childcare: true
    is_child_receiving_extended_childcare: false
