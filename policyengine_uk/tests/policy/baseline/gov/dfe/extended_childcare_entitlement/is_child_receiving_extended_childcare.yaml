# A whole-age three-year-old starts universal provision in September. Even
# below 15 weekly hours it may receive working-parent-only hours in April.
# A supplied family amount (extended_childcare_entitlement as an input) with no
# working parent hours calculated for any child counts for every qualifying
# child of an eligible age, as before; a supplied zero means nobody receives it.
- name: Child age 2 with positive entitlement - eligible
  period: 2025
  input:
    person:
      age: 2
    benunit:
      members: [person]
      extended_childcare_entitlement: 3000
  output:
    is_child_receiving_extended_childcare: true

- name: Child age 4 with positive entitlement - eligible
  period: 2025
  input:
    person:
      age: 4
    benunit:
      members: [person]
      extended_childcare_entitlement: 5000
  output:
    is_child_receiving_extended_childcare: true

- name: Child age 3 with zero entitlement - ineligible
  period: 2025
  input:
    person:
      age: 3
    benunit:
      members: [person]
      extended_childcare_entitlement: 0
  output:
    is_child_receiving_extended_childcare: false

- name: Child age 5 with positive entitlement - ineligible due to age
  period: 2025
  input:
    person:
      age: 5
    benunit:
      members: [person]
      extended_childcare_entitlement: 4000
  output:
    is_child_receiving_extended_childcare: false

- name: Child age 0 with positive entitlement - ineligible due to age
  period: 2025
  input:
    person:
      age: 0
    benunit:
      members: [person]
      extended_childcare_entitlement: 2000
  output:
    is_child_receiving_extended_childcare: false

- name: Child age 0.75 with positive entitlement - eligible (2025 parameter)
  period: 2025
  input:
    person:
      age: 0.75
    benunit:
      members: [person]
      extended_childcare_entitlement: 1500
  output:
    is_child_receiving_extended_childcare: true

- name: A supplied family amount of zero means nobody receives it
  period: 2026
  input:
    person:
      age: 3
    benunit:
      members: [person]
      extended_childcare_entitlement_eligible: true
      extended_childcare_entitlement: 0
  output:
    is_child_receiving_extended_childcare: false

# A child is receiving the working parent entitlement when it gets working
# parent hours beyond any universal or targeted hours in the same terms.
# Universal provision begins after the third birthday, so a transition year
# can include working-parent-only hours before its first universal term.
- name: Child age 2 in an eligible family is receiving
  period: 2025
  input:
    person:
      age: 2
    benunit:
      members: [person]
      extended_childcare_entitlement_eligible: true
  output:
    is_child_receiving_extended_childcare: true

- name: Child age 4 in an eligible family using 30 hours is receiving
  period: 2025
  input:
    person:
      age: 4
    benunit:
      members: [person]
      extended_childcare_entitlement_eligible: true
  output:
    is_child_receiving_extended_childcare: true
    is_child_receiving_universal_childcare: true

- name: Child age 3 using 10 hours receives working hours before universal starts
  period: 2025
  input:
    person:
      age: 3
    benunit:
      members: [person]
      extended_childcare_entitlement_eligible: true
      maximum_extended_childcare_hours_usage: 10
  output:
    is_child_receiving_extended_childcare: true
    is_child_receiving_universal_childcare: true

- name: Child age 3 in a family that is not eligible
  period: 2025
  input:
    person:
      age: 3
    benunit:
      members: [person]
      extended_childcare_entitlement_eligible: false
  output:
    is_child_receiving_extended_childcare: false

- name: Child age 5 in an eligible family - ineligible due to age
  period: 2025
  input:
    person:
      age: 5
    benunit:
      members: [person]
      extended_childcare_entitlement_eligible: true
  output:
    is_child_receiving_extended_childcare: false

- name: Child age 0 in an eligible family - ineligible due to age
  period: 2025
  input:
    person:
      age: 0
    benunit:
      members: [person]
      extended_childcare_entitlement_eligible: true
  output:
    is_child_receiving_extended_childcare: false

- name: Child age 0.75 in an eligible family - eligible (2025 parameter)
  period: 2025
  input:
    person:
      age: 0.75
    benunit:
      members: [person]
      extended_childcare_entitlement_eligible: true
  output:
    is_child_receiving_extended_childcare: true

- name: Each child is counted on its own hours, not its sibling's
  period: 2026
  input:
    people:
      child1:
        age: 1
      child2:
        age: 3
    benunits:
      benunit1:
        members: [child1, child2]
        extended_childcare_entitlement_eligible: true
        maximum_extended_childcare_hours_usage: 10
  output:
    is_child_receiving_extended_childcare: [true, true]
    is_child_receiving_universal_childcare: [false, true]

# Benefit units of different sizes, so person-level and benefit unit-level
# arrays differ in length: each child is still judged on its own family.
- name: Children in two families of different sizes are each judged on their own family
  period: 2026
  input:
    people:
      child1:
        age: 1
      child2:
        age: 3
      child3:
        age: 4
    benunits:
      benunit1:
        members: [child1, child2]
        extended_childcare_entitlement_eligible: true
        maximum_extended_childcare_hours_usage: 10
      benunit2:
        members: [child3]
        extended_childcare_entitlement_eligible: true
        maximum_extended_childcare_hours_usage: 30
    households:
      household1:
        members: [child1, child2]
      household2:
        members: [child3]
  output:
    is_child_receiving_extended_childcare: [true, true, true]

- name: A supplied family amount counts for each qualifying child, not an older sibling
  period: 2026
  input:
    people:
      child1:
        age: 3
      child2:
        age: 6
    benunits:
      benunit1:
        members: [child1, child2]
        extended_childcare_entitlement: 3000
  output:
    # No parent is in the benefit unit, so no working parent hours are
    # calculated for either child; the supplied amount goes to the
    # 3-year-old, and the 6-year-old is of compulsory school age.
    is_child_receiving_extended_childcare: [true, false]
