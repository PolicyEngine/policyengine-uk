# The final example table on
# docs/book/programs/gov/dfe/extended-childcare-entitlement.ipynb: a working
# family in 2024, 30 hours a week used, no targeted hours. The year 2024 has
# terms beginning 1 April 2024, 1 September 2024 and 1 January 2025, each with
# a third of 38 weeks. Age is the child's age on 6 October 2024, as
# date_of_birth requires. Rates: £8.28 (age 2) and £5.88 (3 and over).
# extended_childcare_entitlement_per_child holds the working-parent hours
# above the universal hours.
- name: A 2-year-old born 1 January 2022 gets 15 working-parent hours in all three terms
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      child:
        age: 2
        date_of_birth: 20220101
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
        targeted_childcare_entitlement_eligible: false
    households:
      household:
        members: [child]
        country: ENGLAND
  output:
    extended_childcare_entitlement_term_share: 1
    universal_childcare_entitlement: 0
    extended_childcare_entitlement_per_child: 4_719.60

