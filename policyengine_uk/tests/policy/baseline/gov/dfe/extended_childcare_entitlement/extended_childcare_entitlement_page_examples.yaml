# Universal hours start in September, so the summer term's 30 hours are all
# working-parent hours at the age-2 rate: 30 x 38 / 3 x £8.28 = £3,146.40,
# plus 15 x 38 / 3 x £5.88 = £1,117.20 in each later term.
- name: A 3-year-old born 1 April 2021 gets universal hours in two terms only
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      child:
        age: 3
        date_of_birth: 20210401
    benunits:
      benunit:
        members: [child]
        extended_childcare_entitlement_eligible: true
        targeted_childcare_entitlement_eligible: false
    households:
      household:
        members: [child]
        country: ENGLAND
  output:
    universal_childcare_entitlement: 2_234.40
    extended_childcare_entitlement_per_child: 5_380.80
