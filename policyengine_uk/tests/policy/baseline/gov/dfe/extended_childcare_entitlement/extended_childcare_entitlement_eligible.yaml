# The income conditions apply to the parent and the parent's partner
# (Childcare Act 2016 s.1(2)(d); SI 2022/1134 regs 14, 15 and 18), not to an
# older child still at school.
- name: Eligible - an 18-year-old at school does not have to meet the income test
  period: 2025
  input:
    households:
      household1:
        members: [parent1, parent2, student, child1]
        country: ENGLAND
    people:
      parent1:
        age: 35
        is_parent: true
        extended_childcare_entitlement_meets_income_requirements: true
        extended_childcare_entitlement_work_condition: true
      parent2:
        age: 35
        is_parent: true
        extended_childcare_entitlement_meets_income_requirements: true
        extended_childcare_entitlement_work_condition: false
      student:
        age: 18
        current_education: UPPER_SECONDARY
        extended_childcare_entitlement_meets_income_requirements: false
        extended_childcare_entitlement_work_condition: false
      child1:
        age: 3
        extended_childcare_entitlement_work_condition: false
    benunits:
      benunit1:
        members: [parent1, parent2, student, child1]
  output:
    extended_childcare_entitlement_eligible: true

- name: Not eligible - a 17-year-old parent must meet the income test
  period: 2025
  input:
    households:
      household1:
        members: [parent1, child1]
        country: ENGLAND
    people:
      parent1:
        age: 17
        is_parent: true
        extended_childcare_entitlement_meets_income_requirements: false
        extended_childcare_entitlement_work_condition: true
      child1:
        age: 1
        extended_childcare_entitlement_work_condition: false
    benunits:
      benunit1:
        members: [parent1, child1]
  output:
    extended_childcare_entitlement_eligible: false
