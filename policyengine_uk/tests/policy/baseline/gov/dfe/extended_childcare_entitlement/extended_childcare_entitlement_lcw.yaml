# SI 2022/1134 regs 14(4)(b)(i)-(ii) and 15(4)(a)-(b) separately admit
# LCW and LCWRA. The LCW-only parent can occupy either adult position.
# Modern role cases use 2025, after SI 2023/276's 30 March 2023 amendment.
# https://www.legislation.gov.uk/uksi/2022/1134/regulation/14
# https://www.legislation.gov.uk/uksi/2022/1134/regulation/15
# The earner receives 20,000 / 4 = 5,000 per quarter, above the reg 18
# minimum of 10 x 16 x 13 = 2,080, with ANI below 100,000.
# Other listed benefits/credits are absent. Booleans have no error margin.
# Calendar2022 samples30April2022: SI2016/1257reg9(1)(b)(viii)'s LCWRA list.
# Calendar2023 samples30April2023, after both 1December2022 and30March2023.
# These annual controls do not assert a monthly/December entitlement.
# https://www.legislation.gov.uk/uksi/2016/1257/regulation/9/made

- name: Case 1, LCW-only first parent qualifies with a working partner in 2025.
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_parent: true
        employment_income: 0
        adjusted_net_income: 0
        minimum_wage: 10
        uc_limited_capability_for_work: true
        uc_limited_capability_for_WRA: false
        is_entitled_to_carer_benefit: false
        receives_uc_carer_element: false
        receives_limited_capability_for_work_credits: false
        esa_contrib: 0
        incapacity_benefit: 0
        sda: 0
      person2:
        age: 38
        is_parent: true
        employment_income: 20000
        adjusted_net_income: 20000
        minimum_wage: 10
        uc_limited_capability_for_work: false
        uc_limited_capability_for_WRA: false
        is_entitled_to_carer_benefit: false
        receives_uc_carer_element: false
        receives_limited_capability_for_work_credits: false
        esa_contrib: 0
        incapacity_benefit: 0
        sda: 0
      person3:
        age: 4
    benunits:
      benunit:
        members:
        - person1
        - person2
        - person3
        would_claim_extended_childcare: true
    households:
      household:
        members:
        - person1
        - person2
        - person3
        country: ENGLAND
  output:
    extended_childcare_entitlement_limited_capability_or_specified_benefit:
    - true
    - false
    - false
    extended_childcare_entitlement_work_condition:
    - true
    - true
    - false
    extended_childcare_entitlement_eligible: true
