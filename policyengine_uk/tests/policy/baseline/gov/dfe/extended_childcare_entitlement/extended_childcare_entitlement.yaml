# extended_childcare_entitlement is the working parent hours above the universal
# (3-4) and targeted (2) hours each child also gets: Childcare Act 2016 s.1(6)(a)
# counts those hours towards the 30. Every child here is in England (the default)
# and claims the universal entitlement (the default), so a 3- or 4-year-old's
# universal 570 hours a year come off the 1,140 the parameter gives. Rates per
# hour: 2025 £8.53 (age 2) and £6.12 (3-4); 2026 £8.90 (age 2) and
# £6.61 (3-4).
- name: 3-year-old gets the 15 working parent hours above the universal 15
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 3
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: true
  output:
    # (1,140 - 570) x 6.12
    extended_childcare_entitlement: 3488.40
    universal_childcare_entitlement: 3488.40

- name: Eligible for 15 hours - 2 year old (evaluated at Jan 1, 2025 before Sept expansion)
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 2  # Age 2 gets 15 hours when evaluated at Jan 1, 2025
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: true
  output:
    # 15 x 38 x 8.53; no targeted hours, so nothing comes off.
    extended_childcare_entitlement: 4862.10

- name: Not eligible (one condition not met)
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      child1:
        age: 2
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: false
  output:
    extended_childcare_entitlement: 0  # Not eligible

- name: Eligible for mixed hours - Family with multiple children
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 2  # 15 hours at Jan 1, 2025
      child2:
        age: 3  # 30 hours, 15 of them universal
    benunits:
      benunit1:
        members: [child1, child2]
        extended_childcare_entitlement_eligible: true
  output:
    # 570 x 8.53 + (1,140 - 570) x 6.12
    extended_childcare_entitlement: 8350.50

- name: Not eligible - Family with multiple children but conditions not met
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      child1:
        age: 2
      child2:
        age: 3
    benunits:
      benunit1:
        members: [child1, child2]
        extended_childcare_entitlement_eligible: false
  output:
    extended_childcare_entitlement: 0  # Not eligible

- name: Eligible with one working parent and one disabled parent
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 2  # 15 hours at Jan 1, 2025
      child2:
        age: 3  # 30 hours, 15 of them universal
      child3:
        age: 3  # 30 hours, 15 of them universal
    benunits:
      benunit1:
        members: [child1, child2, child3]
        family_type: COUPLE_WITH_CHILDREN
        extended_childcare_entitlement_eligible: true
  output:
    # 570 x 8.53 + 2 x (1,140 - 570) x 6.12
    extended_childcare_entitlement: 11838.90

- name: No expenses for zero hours
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      child1:
        age: 3
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: false
  output:
    extended_childcare_entitlement: 0  # Not eligible

- name: Child using fewer hours than maximum entitlement
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 3
        max_free_entitlement_hours_used: 20
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: true
  output:
    # (20 x 38 - 570) x 6.12: 190 working parent hours on top of the
    # universal 570.
    extended_childcare_entitlement: 1162.80
    universal_childcare_entitlement: 3488.40

- name: Child using fewer hours than maximum entitlement - multiple children
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 2  # Can get 15 hours at Jan 1, 2025, but only using 10
        max_free_entitlement_hours_used: 10
      child2:
        age: 3  # Uses 15 hours, all of them universal
        max_free_entitlement_hours_used: 15
    benunits:
      benunit1:
        members: [child1, child2]
        extended_childcare_entitlement_eligible: true
  output:
    # 10 x 38 x 8.53 + max(0, 15 x 38 - 570) x 6.12
    extended_childcare_entitlement: 3241.40

- name: Benefit unit maximum hours cap applied
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 3
        max_free_entitlement_hours_used: 30
      child2:
        age: 3
        max_free_entitlement_hours_used: 30
    benunits:
      benunit1:
        members: [child1, child2]
        extended_childcare_entitlement_eligible: true
        maximum_extended_childcare_hours_usage: 40
  output:
    # The cap applies to each child: 2 x (1,140 - 570) x 6.12
    extended_childcare_entitlement: 6976.80

- name: A family cap below the universal hours leaves the universal hours whole
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 3
        max_free_entitlement_hours_used: 30
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: true
        maximum_extended_childcare_hours_usage: 10
  output:
    # 10 x 38 = 380 hours is under the universal 570, so no working parent
    # hours, and the universal 570 stay.
    extended_childcare_entitlement: 0
    universal_childcare_entitlement: 3488.40

- name: A family cap above 15 adds the hours between 15 and the cap
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 3
        max_free_entitlement_hours_used: 30
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: true
        maximum_extended_childcare_hours_usage: 18
  output:
    # (18 x 38 - 570) x 6.12
    extended_childcare_entitlement: 697.68

- name: Benefit unit without maximum hours cap applied with 3 years old child
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 3
        max_free_entitlement_hours_used: 15
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: true
        maximum_extended_childcare_hours_usage: 18
  output:
    # The child uses 15 hours, all of them universal.
    extended_childcare_entitlement: 0
    universal_childcare_entitlement: 3488.40

- name: Eligible for 30 hours - 2 year old after September 2025 expansion
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 2  # Age 2 gets 30 hours from September 2025 onwards
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: true
  output:
    # 30 x 38 x 8.90; no targeted hours.
    extended_childcare_entitlement: 10146.00

- name: Eligible for 30 hours - Family with multiple 2-year-olds after expansion
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 2  # 30 hours after September 2025
      child2:
        age: 3  # 30 hours, 15 of them universal
    benunits:
      benunit1:
        members: [child1, child2]
        extended_childcare_entitlement_eligible: true
  output:
    # 1,140 x 8.90 + (1,140 - 570) x 6.61
    extended_childcare_entitlement: 13913.70

# SI 2022/1134 reg 13(2)(b): a child looked after by a local authority is not a
# qualifying child, so only the other three-year-old's working parent hours
# count (the same £3,435.39 as the single three-year-old above). The
# looked-after child keeps the universal hours.
- name: A looked-after child's hours do not count
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 3
        is_looked_after_by_local_authority: true
      child2:
        age: 3
    benunits:
      benunit1:
        members: [child1, child2]
        extended_childcare_entitlement_eligible: true
  output:
    extended_childcare_entitlement: 3488.40
    universal_childcare_entitlement: [3488.40, 3488.40]
