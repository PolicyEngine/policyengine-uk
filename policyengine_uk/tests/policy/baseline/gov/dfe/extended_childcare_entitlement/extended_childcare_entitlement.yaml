# Whole-age fallback birthdays are 6 April: base provision begins in September,
# so April working-parent hours have no universal base to subtract. Each term
# is valued at its qualifying age band within the same annual funding table.
# Working-parent hours above base provision are allocated within each common
# term (Childcare Act 2016 s.1(6)(a)). The 2025 annual hours schedule is kept;
# the funding-year rates are £11.54/£8.53/£6.12 by qualifying age band, and
# the corresponding 2026 rates are £12.04/£8.90/£6.61.
- name: A 3-year-old gets summer working hours and two universal top-ups
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 3
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: true
  output:
    extended_childcare_entitlement: 5_567.00
    universal_childcare_entitlement: 2_325.60

- name: Eligible for 15 hours - 2 year old (evaluated at Jan 1, 2025 before Sept expansion)
  period: 2025
  absolute_error_margin: 0.05
  input:
    people:
      child1:
        age: 2  # Age 2 gets 15 hours when evaluated at Jan 1, 2025
    benunits:
      benunit1:
        members: [child1]
        extended_childcare_entitlement_eligible: true
  output:
    extended_childcare_entitlement: 5_434.00

