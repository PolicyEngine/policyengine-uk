# Each parent and partner must meet SI 2022/1134 reg 14(3)/15(3): qualifying
# paid work, meaning expected income over three months of at least
# 16 hours x minimum wage x 13 weeks (reg 18), and adjusted net income of no
# more than £100,000. Or they must meet reg 14(4)/15(4) instead: limited
# capability for work or a specified benefit (reg 11A), with a partner who meets
# reg 14(3)/15(3).
#
# These tests set minimum_wage to £10, so the reg 18 threshold is
# 10 x 16 x 13 = £2,080 a quarter, or £8,320 a year. The £20,000 earners below
# have £5,000 a quarter and adjusted net income of £20,000, so they meet
# reg 14(3)/15(3).
- name: Lone parent working - meets the condition
  period: 2025
  input:
    people:
      parent:
        age: 35
        is_parent: true
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      child:
        age: 4
    benunits:
      benunit:
        members: [parent, child]
  output:
    extended_childcare_entitlement_work_condition: [true, false]

- name: Couple with children both working - both meet the condition
  period: 2025
  input:
    people:
      parent1:
        age: 40
        is_parent: true
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      parent2:
        age: 38
        is_parent: true
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      child:
        age: 4
    benunits:
      benunit:
        members: [parent1, parent2, child]
  output:
    extended_childcare_entitlement_work_condition: [true, true, false]

# Reg 15(4)(c) and 11A(1)(a): the partner on Carer's Allowance has no earnings,
# so fails the reg 18 minimum income, but needs neither the work nor the income
# condition because the other parent meets reg 14(3).
- name: One parent working, the other on Carer's Allowance - both meet the condition
  period: 2025
  input:
    people:
      parent1:
        age: 40
        is_parent: true
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      parent2:
        age: 38
        is_parent: true
        carers_allowance: 4_000
        minimum_wage: 10
      child:
        age: 4
    benunits:
      benunit:
        members: [parent1, parent2, child]
  output:
    extended_childcare_entitlement_work_condition: [true, true, false]

# Reg 11A(1)(c): the Universal Credit carer element, meaning an award of
# Universal Credit that includes it (reg 14(5)(a) as made). It belongs to the
# carer.
- name: One parent working, the other the carer on a UC award with the carer element - both meet the condition
  period: 2025
  input:
    people:
      parent1:
        age: 40
        is_parent: true
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      parent2:
        age: 38
        is_parent: true
        is_carer_for_benefits: true
        minimum_wage: 10
      child:
        age: 4
    benunits:
      benunit:
        members: [parent1, parent2, child]
        universal_credit: 3_000
        uc_carer_element: 2_400
  output:
    receives_uc_carer_element: [false, true, false]
    extended_childcare_entitlement_work_condition: [true, true, false]

# The earner is the carer, so the carer element does not make the non-working
# partner a person entitled to a specified benefit.
- name: The earner is the carer on the UC award - the non-working partner does not meet the condition
  period: 2025
  input:
    people:
      parent1:
        age: 40
        is_parent: true
        is_carer_for_benefits: true
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      parent2:
        age: 38
        is_parent: true
        minimum_wage: 10
      child:
        age: 4
    benunits:
      benunit:
        members: [parent1, parent2, child]
        universal_credit: 3_000
        uc_carer_element: 2_400
  output:
    receives_uc_carer_element: [true, false, false]
    extended_childcare_entitlement_work_condition: [true, false, false]

# Without a Universal Credit award there is no carer element to be entitled to.
- name: A carer with no UC award - does not meet the condition through the carer element
  period: 2025
  input:
    people:
      parent1:
        age: 40
        is_parent: true
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      parent2:
        age: 38
        is_parent: true
        is_carer_for_benefits: true
        minimum_wage: 10
      child:
        age: 4
    benunits:
      benunit:
        members: [parent1, parent2, child]
        universal_credit: 0
        uc_carer_element: 2_400
  output:
    receives_uc_carer_element: [false, false, false]
    extended_childcare_entitlement_work_condition: [true, false, false]

# Reg 11A(1)(e): employment and support allowance under WRA 2007 s.1, which
