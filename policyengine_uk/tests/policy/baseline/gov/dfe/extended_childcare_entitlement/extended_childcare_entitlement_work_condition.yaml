  input:
    people:
      parent1:
        age: 40
        is_parent: true
        employment_income: 20_000
        adjusted_net_income: 20_000
        minimum_wage: 10
      parent2:
        age: 38
        is_parent: true
        minimum_wage: 10
      child:
        age: 4
    benunits:
      benunit:
        members: [parent1, parent2, child]
        esa_income: 3_000
  output:
    extended_childcare_entitlement_work_condition: [true, true, false]

