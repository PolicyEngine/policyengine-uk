# The earner's adjusted net income of £120,000 exceeds the reg 14(3)(c)(i)
# limit, so the earner fails reg 14(3), and the carer has no partner meeting it.
- name: Earner above the income limit, partner on Carer's Allowance - neither meets the condition
  period: 2025
  input:
    people:
      parent1:
        age: 40
        is_parent: true
        employment_income: 120_000
        adjusted_net_income: 120_000
        minimum_wage: 10
      parent2:
        age: 38
        is_parent: true
        carers_allowance: 4_000
        minimum_wage: 10
      child:
        age: 4
    benunits:
      benunit:
        members: [parent1, parent2, child]
  output:
    extended_childcare_entitlement_work_condition: [false, false, false]

# The condition applies to the claimant and partner whether or not they have a
