# A dependent child has no age limit for Parents' Learning Allowance
# (Education (Student Support) Regulations 2011 regs 42 and 46): a student whose
# only dependant is an 18-year-old still at school has a dependent child.
- name: Parents' Learning Allowance counts an 18-year-old dependant at school
  period: 2025
  input:
    people:
      student:
        age: 40
        is_parent: true
        parents_learning_allowance_course_eligible: true
        parents_learning_allowance_household_income: 0
      teenager:
        age: 18
        current_education: UPPER_SECONDARY
    benunits:
      benunit:
        members: ["student", "teenager"]
    households:
      household:
        members: ["student", "teenager"]
        country: ENGLAND
  output:
    parents_learning_allowance_dependent_children: 1
    parents_learning_allowance_eligible: [true, false]
    parents_learning_allowance: [2_024, 0]
