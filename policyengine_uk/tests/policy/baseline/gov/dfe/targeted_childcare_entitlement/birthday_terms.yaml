- name: Case 9, a new targeted term uses the same band as its working parent hours.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 1
    date_of_birth: 20241007
    country: ENGLAND
    targeted_childcare_entitlement_eligible: true
    extended_childcare_entitlement_eligible: true
    would_claim_targeted_childcare: false
  output:
    # April/September use the under-two proxy, January the targeted band.
    extended_childcare_entitlement_total_per_child: 12_532.40
    targeted_childcare_entitlement: 1_691
    extended_childcare_entitlement_per_child: 10_841.40

- name: Case 10, targeted and working parent starts share the same two terms in 2024.
  period: 2024
  absolute_error_margin: 0.01
  input:
    age: 2
    date_of_birth: 20220406
    country: ENGLAND
    targeted_childcare_entitlement_eligible: true
    extended_childcare_entitlement_eligible: true
    would_claim_targeted_childcare: false
  output:
    # Two common terms * 190 hours * the unchanged 2024 £8.28 proxy.
    targeted_childcare_entitlement: 3_146.40
    extended_childcare_entitlement_total_per_child: 3_146.40
    extended_childcare_entitlement_per_child: 0
