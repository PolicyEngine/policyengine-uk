# DfE guidance effective 1 April 2026, A1.2 and A1.4; SI 2014/2147 reg 3.
# https://www.gov.uk/government/publications/early-education-and-childcare--2/early-education-and-childcare-valid-from-1-april-2026
# https://www.legislation.gov.uk/uksi/2014/2147/regulation/3
# The existing annual proxy values 190 targeted hours per funded term at
# £8.90 in 2026. It is not a provider fee or a claim about actual term lengths.

- name: Case 1, a late second birthday starts targeted hours in January.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 1
    date_of_birth: 20241007
    country: ENGLAND
    targeted_childcare_entitlement_eligible: true
    extended_childcare_entitlement_eligible: false
  output:
    targeted_childcare_entitlement: 1_691
    universal_childcare_entitlement: 0

