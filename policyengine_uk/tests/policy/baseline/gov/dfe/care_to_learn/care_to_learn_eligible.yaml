- name: Care to Learn - Fully eligible person
  period: 2024
  input:
    people:
      parent:
        age: 19
        is_parent: true
        current_education: UPPER_SECONDARY
        is_apprentice: false
      child:
        age: 2
    benunits:
      benunit:
        members: ["parent", "child"]
    households:
      household:
        members: ["parent", "child"]
        country: ENGLAND
  output:
    care_to_learn_eligible: [true, false]

