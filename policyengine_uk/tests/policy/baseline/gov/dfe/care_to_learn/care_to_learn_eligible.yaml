# The young parent must receive Child Benefit for the child they claim for
# (ESFA conditions of grant), so the parent can never count as their own child.
- name: Care to Learn - A 17-year-old parent with no child in the benefit unit
  period: 2024
  input:
    people:
      parent:
        age: 17
        is_parent: true
        current_education: UPPER_SECONDARY
        is_apprentice: false
    benunits:
      benunit:
        members: ["parent"]
    households:
      household:
        members: ["parent"]
        country: ENGLAND
  output:
    care_to_learn_eligible: false

- name: Care to Learn - A 17-year-old parent with a baby
  period: 2024
  input:
    people:
      parent:
        age: 17
        is_parent: true
        current_education: UPPER_SECONDARY
        is_apprentice: false
      baby:
        age: 0
    benunits:
      benunit:
        members: ["parent", "baby"]
    households:
      household:
        members: ["parent", "baby"]
        country: ENGLAND
  output:
    care_to_learn_eligible: [true, false]
