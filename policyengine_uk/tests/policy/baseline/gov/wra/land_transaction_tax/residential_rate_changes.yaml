# Literal marginal-band sums from WSI 2022/1027 reg 7 and WSI 2024/1311 reg 6.
# Annual parameters sample 30 April; these are not dated/protected-contract cases.
- name: Main purchase retains the April 2022 table
  period: 2022
  input:
    age: 45
    region: WALES
    main_residential_property_purchased: 300_000
    additional_residential_property_purchased: 0
    non_residential_property_purchased: 0
    rent: 0
    cumulative_residential_rent: 0
    non_residential_rent: 0
    cumulative_non_residential_rent: 0
  output:
    land_transaction_tax: 4_950

