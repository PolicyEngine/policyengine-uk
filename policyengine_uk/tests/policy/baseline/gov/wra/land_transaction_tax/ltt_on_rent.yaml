# LTT on lease rent. Table 4 of the Schedule to SI 2018/128 (non-residential
# and mixed leases), as substituted by SI 2020/1618 regulation 6(4) for
# effective dates on or after 22 December 2020:
#   NRL zero rate band: not more than £225,000, 0%
#   first band: more than £225,000 but not more than £2,000,000, 1%
#   second band: more than £2,000,000, 2%
# As made, the zero rate band ran to £150,000. Model years are fiscal years,
# with parameters read at 30 April, so 2019 is 2019-20 (£150,000) and 2025 is
# 2025-26 (£225,000).
# No tax is chargeable on residential lease rent: Land Transaction Tax and
# Anti-avoidance of Devolved Taxes (Wales) Act 2017 schedule 6 paragraph 27(1).

- name: Case 1, non-residential lease rent above £2 million in 2025-26.
  period: 2025
  absolute_error_margin: 0.01
  input:
    country: WALES
    non_residential_rent: 2_100_000
  output:
    # 1% x (2,000,000 - 225,000) + 2% x (2,100,000 - 2,000,000)
    # = 17,750 + 2,000 = 19,750
    ltt_on_non_residential_property_rent: 19_750
    ltt_on_rent: 19_750
    land_transaction_tax: 19_750

- name: Case 2, non-residential lease rent just above £2 million.
  period: 2025
  absolute_error_margin: 0.01
  input:
    country: WALES
    non_residential_rent: 2_000_100
  output:
    # 1% x (2,000,000 - 225,000) + 2% x 100 = 17,750 + 2 = 17,752
    ltt_on_non_residential_property_rent: 17_752

- name: Case 3, non-residential lease rent in 2019-20 under the table as made.
  period: 2019
  absolute_error_margin: 0.01
  input:
    country: WALES
    non_residential_rent: 2_100_000
  output:
    # 1% x (2,000,000 - 150,000) + 2% x 100,000 = 18,500 + 2,000 = 20,500
    ltt_on_non_residential_property_rent: 20_500

- name: Case 4, residential lease rent is not charged.
  period: 2025
  absolute_error_margin: 0.01
  input:
    country: WALES
    cumulative_residential_rent: 2_000_000
    rent: 200_000
  output:
    # Schedule 6 paragraph 27(1). Charged, the rent bands would give
    # 2% x 200,000 = 4,000.
    ltt_on_residential_property_rent: 0
    ltt_on_rent: 0
    land_transaction_tax: 0

- name: Case 5, residential and non-residential rent together.
  period: 2025
  absolute_error_margin: 0.01
  input:
    country: WALES
    rent: 300_000
    non_residential_rent: 2_100_000
  output:
    ltt_on_residential_property_rent: 0
    ltt_on_rent: 19_750
