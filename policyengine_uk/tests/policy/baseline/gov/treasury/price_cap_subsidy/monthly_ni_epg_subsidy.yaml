  output:
    ni_epg_subsidy_calculable: false
    monthly_ni_epg_subsidy: 0
    monthly_epg_subsidy: 0

- name: Case 15, a negative or insufficient supplied bill leaves relief uncomputed.
  period: 2023-04
  input:
    country:
      2023: [NORTHERN_IRELAND, NORTHERN_IRELAND]
    electricity_consumption_kwh: [1_000, 1_000]
    gas_consumption_kwh: [2_000, 2_000]
    ni_epg_full_rate_applies: [true, true]
    monthly_domestic_energy_consumption: [-1, 94.24]
  output:
    # Full consumer relief is 94.24275; the second supplied bill is below it.
    ni_epg_subsidy_calculable: [false, false]
    monthly_ni_epg_subsidy: [0, 0]
    monthly_epg_subsidy: [0, 0]

- name: Case 16, a March assertion does not establish April full-rate applicability.
  period: 2023
  input:
    country: NORTHERN_IRELAND
    electricity_consumption_kwh:
      2023-03: 1_000
      2023-04: 1_000
    gas_consumption_kwh:
      2023-03: 2_000
      2023-04: 2_000
    ni_epg_full_rate_applies:
      2023-03: true
    monthly_domestic_energy_consumption:
      2023-03: 500
      2023-04: 500
  output:
    # Omit a case margin for boolean coverage; the runner's default 0.001
    # also checks the positive currency value more tightly than one penny.
    ni_epg_subsidy_calculable:
      2023-03: true
      2023-04: false
    monthly_ni_epg_subsidy:
      2023-03: 224.64435
      2023-04: 0
    monthly_epg_subsidy:
      2023-03: 224.64435
      2023-04: 0

- name: Case 17, supplied absent and zero-use households keep distinct coverage states.
  period: 2023-04
  input:
    people:
      person1: {}
      person2: {}
      person3: {}
    benunits:
      benunit1:
        members: [person1]
      benunit2:
        members: [person2]
      benunit3:
        members: [person3]
    households:
      household1:
        members: [person1]
        country:
          2023: NORTHERN_IRELAND
        electricity_consumption_kwh: 1_000
        gas_consumption_kwh: 2_000
        ni_epg_full_rate_applies: true
        monthly_domestic_energy_consumption: 500
      household2:
        members: [person2]
        country:
          2023: NORTHERN_IRELAND
        gas_consumption_kwh: 2_000
        ni_epg_full_rate_applies: true
        monthly_domestic_energy_consumption: 500
      household3:
        members: [person3]
        country:
          2023: NORTHERN_IRELAND
        electricity_consumption_kwh: 0
        gas_consumption_kwh: 0
  output:
    # Same default 0.001 currency tolerance as Case 16; booleans stay exact.
    ni_epg_subsidy_calculable: [true, false, true]
    monthly_ni_epg_subsidy: [94.24275, 0, 0]
    monthly_epg_subsidy: [94.24275, 0, 0]

- name: Case 18, a bill above full consumer relief supports a positive calculation.
  period: 2023-04
  input:
    country:
      2023: NORTHERN_IRELAND
    electricity_consumption_kwh: 1_000
    gas_consumption_kwh: 2_000
    ni_epg_full_rate_applies: true
    monthly_domestic_energy_consumption: 94.25
  output:
    # Case 15 checks 94.24 below D; here 94.25 exceeds D = 94.24275.
    ni_epg_subsidy_calculable: true
    monthly_ni_epg_subsidy: 94.24275
    monthly_epg_subsidy: 94.24275
    monthly_epg_consumption_level: 0.00725
