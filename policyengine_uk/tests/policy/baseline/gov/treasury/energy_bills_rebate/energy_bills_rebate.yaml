- name: Case 1, a household in band C receives both 2022 rebates.
  period: 2022
  input:
    council_tax: 150
    council_tax_band: C
  output:
    energy_bills_rebate: 349

- name: Case 2, a household in band G receives only the energy credit.
  period: 2022
  input:
    council_tax_band: G
  output:
    energy_bills_rebate: 199

# HBAI income. DWP's HBAI classifies the Energy Bills Support Scheme (£600 in
# Northern Ireland) and the £150 Council Tax Rebate as miscellaneous income
# (HBAI quality and methodology report FYE 2023, "Treatment of cost of living
# and wider support schemes"), so both reach HBAI household net income.
# Each household below has no other income, does not claim Universal Credit
# and has no council tax to pay, so its HBAI income is the rebate alone. The
# Great Britain credit is £66 in October and November 2022 and £67 a month
# from December 2022 to March 2023, summed by calendar year (£199 and £201).
# DWP's HBAI counts all £400 in 2022-23; the model keeps the calendar-year
# sum, as in household net income (docs: cost-of-living-payments.md).

- name: Case 3, a band C household's 2022 rebates are HBAI income.
  period: 2022
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        council_tax_band: C
        council_tax: 0
  output:
    ebr_council_tax_rebate: 150
    ebr_energy_bills_credit: 199
    hbai_household_net_income: 150 + 199

- name: Case 4, in 2023 only the credit's remaining instalments are paid, and counted.
  period: 2023
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        council_tax_band: C
        council_tax: 0
  output:
    ebr_council_tax_rebate: 0
    energy_bills_rebate: 201
    hbai_household_net_income: 201

- name: Case 5, Northern Ireland's January 2023 credit is HBAI income.
  period: 2023
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        country: NORTHERN_IRELAND
        council_tax: 0
  output:
    energy_bills_rebate: 400
    hbai_household_net_income: 400

- name: Case 6, the rebates are miscellaneous income, not HBAI state support.
