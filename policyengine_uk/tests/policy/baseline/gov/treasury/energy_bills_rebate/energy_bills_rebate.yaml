- name: Case 1, a household in band C receives both 2022 rebates.
  period: 2022
  input:
    council_tax: 150
    council_tax_band: C
  output:
    energy_bills_rebate: 349

- name: Case 2, a household in band G receives only the energy credit.
  period: 2022
  input:
    council_tax_band: G
  output:
    energy_bills_rebate: 199

# HBAI income. DWP's HBAI classifies the Energy Bills Support Scheme (£600 in
# Northern Ireland) and the £150 Council Tax Rebate as miscellaneous income
# (HBAI quality and methodology report FYE 2023, "Treatment of cost of living
# and wider support schemes"), so both reach HBAI household net income.
# Each household below has no other income, does not claim Universal Credit
# and has no council tax to pay, so its HBAI income is the rebate alone. The
# Great Britain credit is £66 in October and November 2022 and £67 a month
# from December 2022 to March 2023. energy_bills_rebate sums it by calendar
# year (£199 and £201); HBAI counts it by financial year, all £400 in
# 2022-23, through hbai_energy_bills_rebate.

- name: Case 3, a band C household's 2022-23 rebates are HBAI income in full.
  period: 2022
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        council_tax_band: C
        council_tax: 0
  output:
    ebr_council_tax_rebate: 150
    ebr_energy_bills_credit: 199
    hbai_energy_bills_rebate: 150 + 400
    hbai_household_net_income: 150 + 400

- name: Case 4, the January to March 2023 instalments belong to 2022-23, not 2023-24.
  period: 2023
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        council_tax_band: C
        council_tax: 0
  output:
    ebr_council_tax_rebate: 0
    energy_bills_rebate: 201
    hbai_energy_bills_rebate: 0
    hbai_household_net_income: 0

# Northern Ireland's £400 credit is one payment in January 2023. Band E
# keeps out the Council Tax Rebate, which the model pays by band in every
# nation.
- name: Case 5, Northern Ireland's January 2023 credit is 2022-23 HBAI income.
  period: 2022
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        region: NORTHERN_IRELAND
        council_tax_band: E
        council_tax: 0
  output:
    energy_bills_rebate: 0
    hbai_energy_bills_rebate: 400
    hbai_household_net_income: 400

- name: Case 6, in 2023 Northern Ireland's credit counts by calendar year but not in HBAI.
  period: 2023
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        region: NORTHERN_IRELAND
        council_tax_band: E
        council_tax: 0
  output:
    energy_bills_rebate: 400
    hbai_energy_bills_rebate: 0
    hbai_household_net_income: 0

- name: Case 7, the rebates are miscellaneous income, not HBAI state support.
  period: 2022
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        council_tax_band: A
        council_tax: 0
  output:
    hbai_energy_bills_rebate: 550
    hbai_benefits: 0

# The financial year's nation picks the scheme for all its months, even
# where the household's nation differs in the next model year (or isn't set
# for it: country, unlike region, does not carry over to the next year).
- name: Case 8, Northern Ireland given for 2022 only still gets its January 2023 credit.
  period: 2022
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        country: NORTHERN_IRELAND
        council_tax_band: E
        council_tax: 0
  output:
    hbai_energy_bills_rebate: 400

- name: Case 9, a move to Northern Ireland in 2023-24 leaves 2022-23 on the Great Britain scheme.
  period: 2022
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        country:
          2022: ENGLAND
          2023: NORTHERN_IRELAND
        council_tax_band: E
        council_tax: 0
  output:
    ebr_energy_bills_credit: 199
    hbai_energy_bills_rebate: 400

- name: Case 10, a move from Northern Ireland in 2023-24 leaves 2022-23 on Northern Ireland's scheme.
  period: 2022
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
    households:
      household:
        members: [adult]
        country:
          2022: NORTHERN_IRELAND
          2023: ENGLAND
        council_tax_band: E
        council_tax: 0
  output:
    ebr_energy_bills_credit: 0
    hbai_energy_bills_rebate: 400
