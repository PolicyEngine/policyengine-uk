# The model works out Council Tax Reduction itself in the cases below. Each
# household has one working-age adult, no income and a band F bill; it claims
# the reduction unless a case says otherwise.
- name: A Scottish band F household's simulated Council Tax Reduction qualifies it.
  period: 2022
  input:
    people:
      adult:
        age: 40
    benunits:
      unit:
        members: [adult]
        would_claim_uc: false
        would_claim_council_tax_reduction: true
    households:
      household:
        members: [adult]
        country: SCOTLAND
        council_tax_band: F
        council_tax: 2400
  output:
    ebr_council_tax_rebate: 150
    energy_bills_rebate: 349

