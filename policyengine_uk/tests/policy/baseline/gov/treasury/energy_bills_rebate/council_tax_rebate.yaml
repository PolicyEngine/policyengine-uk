# The test reads the same year as the payment, and the household's nation in
# that year.
- name: Council Tax Reduction in another year doesn't qualify a household out of band.
  period: 2022
  input:
    country: SCOTLAND
    council_tax_band: F
    council_tax_reduction:
      2021: 500
      2022: 0
      2023: 500
  output:
    ebr_council_tax_rebate: 0

