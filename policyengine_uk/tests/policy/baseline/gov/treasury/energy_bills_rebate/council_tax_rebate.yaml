# The rebate was a one-off in 2022-23: the guidance set 30 September 2022 as
# the deadline for the payments the government would reconcile (billing
# authority guidance, paragraph 7). The model pays nothing in 2023-24 or
# before 2022-23.
- name: No rebate in 2023-24, in any band.
  period: 2023
  input:
    council_tax_band:
      - A
      - D
      - E
  output:
    ebr_council_tax_rebate:
      - 0
      - 0
      - 0

- name: No rebate in 2021-22.
  period: 2021
  input:
    council_tax_band: A
  output:
    ebr_council_tax_rebate: 0

# England's Council Tax Rebate applied to England only (billing authority
# guidance, paragraph 2); Scotland and Wales paid their own £150 awards to
# bands A to D. Northern Ireland levies domestic rates, not council tax, and
# had no Council Tax Rebate, so a Northern Ireland household gets none in any
# band, including the default band D.
- name: Each Great Britain nation pays the rebate in bands A to D.
  period: 2022
  input:
    council_tax_band:
      - A
      - D
      - A
      - D
      - A
      - D
    country:
      - ENGLAND
      - ENGLAND
      - SCOTLAND
      - SCOTLAND
      - WALES
      - WALES
  output:
    ebr_council_tax_rebate:
      - 150
      - 150
      - 150
      - 150
      - 150
      - 150

- name: Northern Ireland households get no rebate, in any band.
  period: 2022
  input:
    council_tax_band:
      - A
      - B
      - C
      - D
      - E
      - I
    country:
      - NORTHERN_IRELAND
      - NORTHERN_IRELAND
      - NORTHERN_IRELAND
      - NORTHERN_IRELAND
      - NORTHERN_IRELAND
      - NORTHERN_IRELAND
  output:
    ebr_council_tax_rebate:
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0

- name: A Northern Ireland household on the default band gets no rebate.
  period: 2022
  input:
    country: NORTHERN_IRELAND
  output:
    council_tax_band: D
    ebr_council_tax_rebate: 0

# The rebate follows the household's nation in 2022, whatever it is in 2023.
- name: A household in England in 2022 gets the rebate, though it moves to Northern Ireland in 2023.
  period: 2022
  input:
    council_tax_band: A
    country:
      2022: ENGLAND
      2023: NORTHERN_IRELAND
  output:
    ebr_council_tax_rebate: 150

- name: A household in Northern Ireland in 2022 gets no rebate, though it moves to England in 2023.
  period: 2022
  input:
    council_tax_band: A
    country:
      2022: NORTHERN_IRELAND
      2023: ENGLAND
  output:
    ebr_council_tax_rebate: 0
