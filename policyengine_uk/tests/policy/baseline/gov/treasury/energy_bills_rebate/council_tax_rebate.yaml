# band (Local Government Finance Circular 2/2022, paragraphs 6, 10 and 12;
# Welsh guide, conditions A and B). England's Council Tax Rebate went by band
# alone (billing authority guidance, paragraph 11). Each row below gives the
# band and the year's Council Tax Reduction.
- name: Scotland pays bands A to D, and any band with Council Tax Reduction.
  period: 2022
