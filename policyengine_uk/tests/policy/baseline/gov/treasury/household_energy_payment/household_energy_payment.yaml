# Household Energy Payment (Budget 2026, paragraph 6.24): £100 for
# households in council tax bands A to D in England, delivered from
# January 2027, so in model year 2026 (6 April 2026 to 5 April 2027).

- name: Band A household in England gets £100 in 2026-27
  period: 2026
  absolute_error_margin: 0
  input:
    region: NORTH_EAST
    council_tax_band: A
  output:
    household_energy_payment: 100

- name: Band D household in England gets £100 in 2026-27
  period: 2026
  absolute_error_margin: 0
  input:
    region: LONDON
    council_tax_band: D
  output:
    household_energy_payment: 100

- name: Band E household in England gets nothing
  period: 2026
  absolute_error_margin: 0
  input:
    region: SOUTH_EAST
    council_tax_band: E
  output:
    household_energy_payment: 0

- name: Band H household in England gets nothing
  period: 2026
  absolute_error_margin: 0
  input:
    region: LONDON
    council_tax_band: H
  output:
    household_energy_payment: 0

- name: Band B household in Wales gets nothing
  period: 2026
  absolute_error_margin: 0
  input:
    region: WALES
    council_tax_band: B
  output:
    household_energy_payment: 0

- name: Band B household in Scotland gets nothing
  period: 2026
  absolute_error_margin: 0
  input:
    region: SCOTLAND
    council_tax_band: B
  output:
    household_energy_payment: 0

- name: Household in Northern Ireland gets nothing
  period: 2026
  absolute_error_margin: 0
  input:
    region: NORTHERN_IRELAND
  output:
    household_energy_payment: 0

- name: No payment in 2025-26
  period: 2025
  absolute_error_margin: 0
  input:
    region: NORTH_WEST
    council_tax_band: A
  output:
    household_energy_payment: 0

- name: No payment in 2027-28
  period: 2027
  absolute_error_margin: 0
  input:
    region: NORTH_WEST
    council_tax_band: A
  output:
    household_energy_payment: 0

- name: The payment counts in household benefits and government spending
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      adult:
        age: 40
        # Earnings high enough to rule out means-tested benefits.
        employment_income: 100_000
    households:
      household:
        members: [adult]
        region: EAST_MIDLANDS
        council_tax_band: C
  output:
    household_energy_payment: 100
    household_benefits: 100
    gov_spending: 100
