# The cases below set every qualifying benefit and tax credit, and the Winter
# Fuel Payment, as inputs: with none set, the model computes Universal Credit
# for a working-age adult with no income and Pension Credit for a pensioner
# with none. Each means-tested and disability amount comes from the Social
# Security (Additional Payments) Acts 2022 and 2023. Under the 2022 Act the
# Secretary of State and HMRC pay £326 for 25 May 2022 and £324 for a second
# qualifying day no later than 31 October 2022 (section 1(1), (2) and (4)),
# £650 in all, which the model pays in model year 2022 (6 April 2022 to 5 April
# 2023). Under the 2023 Act they pay £301, £300 and £299 (section 1(1) and
# (2)), £900 in all, which the model pays in model year 2023. Under section
# 5(1) of each Act the Secretary of State pays £150 to each individual with a
# listed disability benefit. Neither Act covers the £300 pensioner payment:
# pensioners/amount.yaml takes it from the May 2022 package announcement and
# DWP's 2023-24 guidance.

- name: 2021 a household qualifying for every strand gets no Cost of Living Payment
  # Model year 2021 runs from 6 April 2021 to 5 April 2022, before the 2022
  # Act's first qualifying day (25 May 2022), and the pensioner amount starts
  # in 2022. The pensioner, on Pension Credit and Attendance Allowance, the
  # parent, on Child Tax Credit alone, and the household, with a Winter Fuel
  # Payment, qualify in 2022 (next case) but get nothing in 2021.
  period: 2021
  input:
    people:
      pensioner:
        age: 70
        attendance_allowance: 3_000
      parent:
        age: 35
      child:
        age: 5
    benunits:
      pensioner_unit:
        members: [pensioner]
        universal_credit: 0
        pension_credit: 1_000
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
      parent_unit:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 2_000
        working_tax_credit: 0
    households:
      household:
        members: [pensioner, parent, child]
        winter_fuel_allowance: 200
  output:
    cost_of_living_means_tested_payment: [0, 0]
    cost_of_living_disability_payment: [0, 0, 0]
    cost_of_living_support_payment: 0

- name: 2022 a household qualifying for every strand gets all three payments
  # The pensioner unit has Pension Credit, listed in section 1(3)(b), so the
  # Secretary of State pays it £326 + £324 = £650 (section 1(1)). The parent
  # unit has Child Tax Credit of £2,000, at least £26 (section 2(2)), and no
  # listed benefit, so HMRC pays it £650 (section 1(2)). The pensioner has
  # Attendance Allowance, listed in section 5(2)(c): £150. The formula adds
  # the £300 pensioner amount. Total: £650 + £650 + £150 + £300 = £1,750.
  period: 2022
  input:
    people:
      pensioner:
        age: 70
        attendance_allowance: 3_000
      parent:
        age: 35
      child:
        age: 5
    benunits:
      pensioner_unit:
        members: [pensioner]
        universal_credit: 0
        pension_credit: 1_000
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
      parent_unit:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 2_000
        working_tax_credit: 0
    households:
      household:
        members: [pensioner, parent, child]
        winter_fuel_allowance: 200
  output:
    cost_of_living_means_tested_payment: [650, 650]
    cost_of_living_disability_payment: [150, 0, 0]
    cost_of_living_support_payment: 1_750

- name: 2022 a benefit unit on Housing Benefit alone gets no means-tested payment
  # Parliament left Housing Benefit out of the list in section 1(3) (Universal
  # Credit, Pension Credit, income-based JSA, income-related ESA and Income
  # Support), and the unit has no tax credit, so neither the Secretary of
  # State (section 1(1)) nor HMRC (section 1(2)) pays it.
  period: 2022
  input:
    people:
      tenant:
        age: 40
    benunits:
      tenant_unit:
        members: [tenant]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        housing_benefit: 3_000
        child_tax_credit: 0
        working_tax_credit: 0
    households:
      household:
        members: [tenant]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 0
    cost_of_living_support_payment: 0

- name: 2023 a benefit unit on Housing Benefit alone gets no means-tested payment
  # Parliament left Housing Benefit out of section 1(3) of the 2023 Act too.
  # With no minimum award in 2023-24, any tax credit payment would qualify the
  # unit (section 3(1)), but it has none, so neither the Secretary of State
  # nor HMRC pays it.
  period: 2023
  input:
    people:
      tenant:
        age: 40
    benunits:
      tenant_unit:
        members: [tenant]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        housing_benefit: 3_000
        child_tax_credit: 0
        working_tax_credit: 0
    households:
      household:
        members: [tenant]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 0
    cost_of_living_support_payment: 0

- name: 2022 a benefit unit on £26 of Child Tax Credit alone gets the means-tested payment
  # A yearly award of £26 meets section 2(2)'s "at least £26" for 2022-23, and
  # the unit has no listed benefit, so HMRC pays £326 + £324 = £650
  # (section 1(2)).
  period: 2022
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    benunits:
      family:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 26
        working_tax_credit: 0
    households:
      household:
        members: [parent, child]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 650
    cost_of_living_support_payment: 650

