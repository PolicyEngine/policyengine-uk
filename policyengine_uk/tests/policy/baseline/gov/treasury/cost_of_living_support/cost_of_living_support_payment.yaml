    cost_of_living_support_payment: 0

- name: 2022 a benefit unit on £20 of each tax credit gets nothing
  # Under section 2(2) the award of "the credit in question" must come to at
  # least £26. Neither £20 award does, so the unit has a qualifying
  # entitlement to neither credit, although the two together come to £40.
  period: 2022
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    benunits:
      family:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 20
        working_tax_credit: 20
    households:
      household:
        members: [parent, child]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 0
    cost_of_living_support_payment: 0

