# The cases below set every qualifying benefit and tax credit, and the Winter
# Fuel Payment, as inputs: with none set, the model computes Universal Credit
# for a working-age adult with no income and Pension Credit for a pensioner
# with none. Each expected value comes from the Social Security (Additional
# Payments) Acts 2022 and 2023. Under the 2022 Act the Secretary of State and
# HMRC pay £326 and £324 for qualifying days from 25 May 2022 to 31 October
# 2022 (section 1(1), (2) and (4)), £650 in all, which the model pays in model
# year 2022 (6 April 2022 to 5 April 2023). Under the 2023 Act they pay £301,
# £300 and £299 (section 1(1) and (2)), £900 in all, which the model pays in
# model year 2023. Under section 5(1) of each Act the Secretary of State pays
# £150 to each individual with a listed disability benefit.

- name: 2021 pays no Cost of Living Payment in any strand
  # Model year 2021 runs from 6 April 2021 to 5 April 2022, before the 2022
  # Act's first qualifying day (25 May 2022), and the pensioner amount starts
  # in 2022. The pensioner, on Pension Credit and Attendance Allowance, the
  # parent, on Child Tax Credit alone, and the household, with a Winter Fuel
  # Payment, qualify in 2022 (next case) but get nothing in 2021.
  period: 2021
  input:
    people:
      pensioner:
        age: 70
        attendance_allowance: 3_000
      parent:
        age: 35
      child:
        age: 5
    benunits:
      pensioner_unit:
        members: [pensioner]
        universal_credit: 0
        pension_credit: 1_000
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
      parent_unit:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 2_000
        working_tax_credit: 0
    households:
      household:
        members: [pensioner, parent, child]
        winter_fuel_allowance: 200
  output:
    cost_of_living_means_tested_payment: [0, 0]
    cost_of_living_disability_payment: [0, 0, 0]
    cost_of_living_support_payment: 0

- name: 2022 pays every strand to the household that 2021 pays nothing
  # The pensioner unit has Pension Credit, listed in section 1(3)(b), so the
  # Secretary of State pays it £326 + £324 = £650 (section 1(1)). The parent
  # unit has Child Tax Credit of £2,000, at least £26 (section 2(2)), and no
  # listed benefit, so HMRC pays it £650 (section 1(2)). The pensioner has
  # Attendance Allowance, listed in section 5(2)(c): £150. The pensioner
  # amount adds £300. Total: £650 + £650 + £150 + £300 = £1,750.
  period: 2022
  input:
    people:
      pensioner:
        age: 70
        attendance_allowance: 3_000
      parent:
        age: 35
      child:
        age: 5
    benunits:
      pensioner_unit:
        members: [pensioner]
        universal_credit: 0
        pension_credit: 1_000
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
      parent_unit:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 2_000
        working_tax_credit: 0
    households:
      household:
        members: [pensioner, parent, child]
        winter_fuel_allowance: 200
  output:
    cost_of_living_means_tested_payment: [650, 650]
    cost_of_living_disability_payment: [150, 0, 0]
    cost_of_living_support_payment: 1_750

- name: 2022 Housing Benefit alone gets no means-tested payment
  # Parliament left Housing Benefit out of the list in section 1(3) (Universal
  # Credit, Pension Credit, income-based JSA, income-related ESA and Income
  # Support), and the unit has no tax credit, so neither the Secretary of
  # State (section 1(1)) nor HMRC (section 1(2)) pays it.
  period: 2022
  input:
    people:
      tenant:
        age: 40
    benunits:
      tenant_unit:
        members: [tenant]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        housing_benefit: 3_000
        child_tax_credit: 0
        working_tax_credit: 0
    households:
      household:
        members: [tenant]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 0
    cost_of_living_support_payment: 0

- name: 2022 Child Tax Credit alone at the £26 minimum gets the means-tested payment
  # A yearly award of £26 meets section 2(2)'s "at least £26" for 2022-23, and
  # the unit has no listed benefit, so HMRC pays £326 + £324 = £650
  # (section 1(2)).
  period: 2022
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    benunits:
      family:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 26
        working_tax_credit: 0
    households:
      household:
        members: [parent, child]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 650
    cost_of_living_support_payment: 650

- name: 2022 Child Tax Credit alone just under the £26 minimum gets nothing
  # A yearly award of £25.99 falls short of section 2(2)'s £26, so the unit
  # has no qualifying entitlement and HMRC pays nothing.
  period: 2022
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    benunits:
      family:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 25.99
        working_tax_credit: 0
    households:
      household:
        members: [parent, child]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 0
    cost_of_living_support_payment: 0

- name: 2022 Child Tax Credit and Working Tax Credit each under £26 get nothing
  # Under section 2(2) the award of "the credit in question" must come to at
  # least £26. Neither £20 award does, so the unit has a qualifying
  # entitlement to neither credit, although the two together come to £40.
  period: 2022
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    benunits:
      family:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 20
        working_tax_credit: 20
    households:
      household:
        members: [parent, child]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 0
    cost_of_living_support_payment: 0

- name: 2023 a small Child Tax Credit award alone gets the means-tested payment
  # Parliament set no minimum award in section 3(1) of the 2023 Act: any
  # payment of the credit counts. With no listed benefit, HMRC pays £301 +
  # £300 + £299 = £900 (section 1(2)).
  period: 2023
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    benunits:
      family:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 10
        working_tax_credit: 0
    households:
      household:
        members: [parent, child]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 900
    cost_of_living_support_payment: 900

- name: 2022 Universal Credit with tax credits gets one means-tested payment
  # The unit has Universal Credit, so the Secretary of State pays it £650
  # under section 1(1). HMRC pays tax credit recipients under section 1(2)
  # only where they have no listed benefit, so it adds nothing.
  period: 2022
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    benunits:
      family:
        members: [parent, child]
        universal_credit: 1_000
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 2_000
        working_tax_credit: 500
    households:
      household:
        members: [parent, child]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 650
    cost_of_living_support_payment: 650

- name: 2023 two qualifying benefit units in one household get two means-tested payments
  # A person means an individual or a couple (section 1(9) of the 2023 Act).
  # The adult son on Universal Credit and his parents on Pension Credit count
  # as two persons, so the Secretary of State pays each £900 (section 1(1)).
  # The pensioner amount adds £300: £900 + £900 + £300 = £2,100.
  period: 2023
  input:
    people:
      son:
        age: 30
      mother:
        age: 70
      father:
        age: 72
    benunits:
      son_unit:
        members: [son]
        universal_credit: 1_000
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
      parents_unit:
        members: [mother, father]
        universal_credit: 0
        pension_credit: 2_000
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
    households:
      household:
        members: [son, mother, father]
        winter_fuel_allowance: 300
  output:
    cost_of_living_means_tested_payment: [900, 900]
    cost_of_living_disability_payment: [0, 0, 0]
    cost_of_living_support_payment: 2_100

- name: 2022 two people on PIP get two disability payments
  # Under section 5(1) the Secretary of State pays £150 to each individual
  # with a disability benefit on the list in section 5(2), which includes PIP
  # (paragraph (b)). A couple both on PIP gets £150 + £150 = £300, although
  # the couple counts as one person for the means-tested payment.
  period: 2022
  input:
    people:
      first_partner:
        age: 45
        pip: 4_000
      second_partner:
        age: 47
        pip: 2_000
    benunits:
      couple:
        members: [first_partner, second_partner]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
    households:
      household:
        members: [first_partner, second_partner]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 0
    cost_of_living_disability_payment: [150, 150]
    cost_of_living_support_payment: 300
