    cost_of_living_support_payment: 650

- name: 2023 a benefit unit on a small Child Tax Credit award alone gets the means-tested payment
  # Parliament set no minimum award in section 3(1) of the 2023 Act: any
  # payment of the credit counts. With no listed benefit, HMRC pays £301 +
  # £300 + £299 = £900 (section 1(2)).
  period: 2023
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    benunits:
      family:
        members: [parent, child]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 10
        working_tax_credit: 0
    households:
      household:
        members: [parent, child]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 900
    cost_of_living_support_payment: 900

- name: 2022 a benefit unit on Universal Credit and tax credits gets one means-tested payment
  # The unit has Universal Credit, so the Secretary of State pays it £650
  # under section 1(1). HMRC pays tax credit recipients under section 1(2)
  # only where they have no listed benefit, so HMRC pays this unit nothing.
  period: 2022
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    benunits:
      family:
        members: [parent, child]
        universal_credit: 1_000
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 2_000
        working_tax_credit: 500
    households:
      household:
        members: [parent, child]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 650
    cost_of_living_support_payment: 650

- name: 2023 two qualifying benefit units in one household get two means-tested payments
  # A person means an individual or a couple (section 1(9) of the 2023 Act).
  # The adult son on Universal Credit and his parents on Pension Credit count
  # as two persons, so the Secretary of State pays each £900 (section 1(1)).
  # The formula adds the £300 pensioner amount: £900 + £900 + £300 = £2,100.
  period: 2023
  input:
    people:
      son:
        age: 30
      mother:
        age: 70
      father:
        age: 72
    benunits:
      son_unit:
        members: [son]
        universal_credit: 1_000
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
      parents_unit:
        members: [mother, father]
        universal_credit: 0
        pension_credit: 2_000
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
    households:
      household:
        members: [son, mother, father]
        winter_fuel_allowance: 300
  output:
    cost_of_living_means_tested_payment: [900, 900]
    cost_of_living_disability_payment: [0, 0, 0]
    cost_of_living_support_payment: 2_100

- name: 2022 two people on PIP get two disability payments
  # Under section 5(1) the Secretary of State pays £150 to each individual
  # with a listed disability benefit, and Parliament listed PIP in section
  # 5(2)(b). A couple both on PIP gets £150 + £150 = £300, although the couple
  # counts as one person for the means-tested payment.
  period: 2022
  input:
    people:
      first_partner:
        age: 45
        pip: 4_000
      second_partner:
        age: 47
        pip: 2_000
    benunits:
      couple:
        members: [first_partner, second_partner]
        universal_credit: 0
        pension_credit: 0
        jsa_income: 0
        esa_income: 0
        income_support: 0
        child_tax_credit: 0
        working_tax_credit: 0
    households:
      household:
        members: [first_partner, second_partner]
        winter_fuel_allowance: 0
  output:
    cost_of_living_means_tested_payment: 0
    cost_of_living_disability_payment: [150, 150]
    cost_of_living_support_payment: 300
