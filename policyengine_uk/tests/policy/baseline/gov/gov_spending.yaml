# Government spending counts every benefit that government pays a household.
# The Scottish Child Payment, Healthy Start vouchers and the Two Child Limit
# Payment were in household_benefits but not in gov_spending, so gov_balance
# left out their cost.
#
# 2026-27 rates: UC standard allowance 424.90 a month (single, 25 or over) and
# child element 303.94 a month; Child Benefit 27.05 a week for the eldest
# child; Scottish Child Payment 28.20 a week.

- name: Scottish Child Payment and Healthy Start vouchers are government spending
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      child:
        age: 3
        # An amount the household reports; the model does not calculate it.
        healthy_start_vouchers: 221
    benunits:
      benunit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        region: SCOTLAND
  output:
    # 28.20 x 52.
    scottish_child_payment: [0, 1_466.40]
    # 424.90 x 12 + 303.94 x 12.
    universal_credit: 8_746.08
    # 27.05 x 52.
    child_benefit: 1_406.60
    # 8,746.08 + 1,406.60 + 1,466.40 + 221.
    household_benefits: 11_840.08
    # The same four payments. Before this fix 10,152.68: without the
    # Scottish Child Payment and the vouchers.
    gov_spending: 11_840.08

- name: The Two Child Limit Payment is government spending when a reform turns it on
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.social_security_scotland.two_child_limit_payment.in_effect: true
    people:
      parent:
        age: 30
      child_1:
        age: 5
        uc_is_child_limit_affected: false
      child_2:
        age: 3
        uc_is_child_limit_affected: false
      child_3:
        age: 1
        uc_is_child_limit_affected: true
    benunits:
      benunit:
        members: [parent, child_1, child_2, child_3]
        # Entered directly, so that only the payments under test are computed.
        universal_credit: 0
        child_benefit: 0
    households:
      household:
        members: [parent, child_1, child_2, child_3]
        region: SCOTLAND
  output:
    # The UC child element for the one affected child: 292.81 x 12.
    two_child_limit_payment: 3_513.72
    # No Universal Credit, so no Scottish Child Payment.
    scottish_child_payment: [0, 0, 0, 0]
    household_benefits: 3_513.72
    # Before this fix 0.
    gov_spending: 3_513.72
