- name: The AHC absolute threshold is the weekly parameter times 52, unequivalised; poverty_line_ahc is the same line scaled by the equivalisation factor
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 60% of the FYE 2025 AHC median (HBAI table 2.4ts): 373.89 a week in 2024.
    poverty_threshold_ahc: 19_442.3
    # A single adult's AHC equivalisation factor is 0.58.
    poverty_line_ahc: 11_276.5

- name: A single adult on 5,000 of earnings is below the AHC absolute line
  period: 2024
  input:
    people:
      person:
        age: 40
        employment_income: 5_000
    households:
      household:
        members: [person]
        rent: 0
        council_tax: 0
  output:
    in_poverty_ahc: true

- name: A single adult on 30,000 of earnings is above the AHC absolute line
  period: 2024
  input:
    people:
      person:
        age: 40
        employment_income: 30_000
    households:
      household:
        members: [person]
        rent: 0
        council_tax: 0
  output:
    in_poverty_ahc: false

- name: FYE 2022 (2021) is the first year on the FYE 2025 AHC reference, carried back by HBAI's AHC deflator
  period: 2021
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 373.8864 x AHCYRDEF 113.9 / 135.7 = 313.82 a week.
    poverty_threshold_ahc: 16_318.6

- name: FYE 2016 (2015) is the FYE 2011 AHC line in FYE 2016 prices, not its FYE 2011 value
  period: 2015
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 60% of HBAI's FYE 2011 AHC median in FYE 2016 prices: 237.43 a week.
    poverty_threshold_ahc: 12_346.36

