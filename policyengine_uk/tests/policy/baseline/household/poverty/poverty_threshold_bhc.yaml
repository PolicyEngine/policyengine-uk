- name: The BHC absolute threshold is the weekly parameter times 52, unequivalised; poverty_line_bhc is the same line scaled by the equivalisation factor
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 60% of the FYE 2025 BHC median (HBAI table 2.4ts): 431.69 a week in 2024.
    poverty_threshold_bhc: 22_447.9
    # A single adult's BHC equivalisation factor is 0.67. HBAI table 2.4ts
    # gives 289.23 a week for a single person (15,040 a year).
    poverty_line_bhc: 15_040.1
    poverty_line: 15_040.1

- name: FYE 2022 (2021) is the first year on the FYE 2025 BHC reference, carried back by HBAI's BHC deflator
  period: 2021
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 431.6886 x BHCYRDEF 113.1 / 137.1 = 356.12 a week.
    poverty_threshold_bhc: 18_518.2

- name: FYE 2016 (2015) is the FYE 2011 BHC line in FYE 2016 prices, not its FYE 2011 value
  period: 2015
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 60% of HBAI's FYE 2011 BHC median in FYE 2016 prices: 278.01 a week.
    poverty_threshold_bhc: 14_456.52

- name: FYE 2018 (2017) is the FYE 2011 BHC line in FYE 2018 prices, not its FYE 2011 value
  period: 2017
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 60% of HBAI's FYE 2011 BHC median in FYE 2018 prices: 288.01 a week.
    poverty_threshold_bhc: 14_976.52

- name: FYE 2021 (2020) keeps the FYE 2011 BHC reference
  period: 2020
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 60% of HBAI's FYE 2011 BHC median in FYE 2021 prices: 301.34 a week.
    poverty_threshold_bhc: 15_669.68

- name: A single adult on 12,000 of earnings is below the BHC absolute line in 2024
  period: 2024
  input:
    people:
      person:
        age: 40
        employment_income: 12_000
    households:
      household:
        members: [person]
        rent: 0
        council_tax: 0
  output:
    in_poverty_bhc: true

- name: A single adult on 30,000 of earnings is above the BHC absolute line in 2024
  period: 2024
  input:
    people:
      person:
        age: 40
        employment_income: 30_000
    households:
      household:
        members: [person]
        rent: 0
        council_tax: 0
  output:
    in_poverty_bhc: false
