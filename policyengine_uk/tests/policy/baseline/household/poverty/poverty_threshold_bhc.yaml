- name: The BHC absolute threshold is the weekly parameter times 52, unequivalised; poverty_line_bhc is the same line scaled by the equivalisation factor
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 60% of the FYE 2025 BHC median of 719 a week: 431.40 a week in 2024.
    poverty_threshold_bhc: 22_432.8
    # A single adult's BHC equivalisation factor is 0.67.
    poverty_line_bhc: 15_030.0
    poverty_line: 15_030.0

- name: FYE 2022 (2021) is the first year on the FYE 2025 BHC reference, carried back by HBAI's BHC deflator
  period: 2021
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 431.40 x 113.100 / 137.133 = 355.79 a week.
    poverty_threshold_bhc: 18_501.1

- name: FYE 2021 (2020) keeps the FYE 2011 BHC reference
  period: 2020
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 40
    households:
      household:
        members: [person]
  output:
    # 305.70 a week.
    poverty_threshold_bhc: 15_896.4

- name: A single adult on 12,000 of earnings is below the BHC absolute line in 2024
  period: 2024
  input:
    people:
      person:
        age: 40
        employment_income: 12_000
    households:
      household:
        members: [person]
        rent: 0
        council_tax: 0
  output:
    in_poverty_bhc: true

- name: A single adult on 30,000 of earnings is above the BHC absolute line in 2024
  period: 2024
  input:
    people:
      person:
        age: 40
        employment_income: 30_000
    households:
      household:
        members: [person]
        rent: 0
        council_tax: 0
  output:
    in_poverty_bhc: false
