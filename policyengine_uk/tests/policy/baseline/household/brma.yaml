# A household with no BRMA input is placed in its region's BRMA with the most
# entries in the LHA list of rents (REGION_DEFAULT_BRMA in
# variables/household/BRMA.py). Each BRMA_LHA_rate below is the model's rate
# for the same household with that BRMA input explicitly, so the default and
# the explicit input must agree. A single 40-year-old private renter is in LHA
# category B (one bedroom).

- name: London household without a BRMA gets Inner South East London
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    region: LONDON
    tenure_type: RENT_PRIVATELY
    rent: 12_000
  output:
    brma: INNER_SOUTH_EAST_LONDON
    LHA_category: B
    BRMA_LHA_rate: 16_750.24

- name: Scottish household without a BRMA gets Aberdeen and Shire
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    region: SCOTLAND
    tenure_type: RENT_PRIVATELY
    rent: 12_000
  output:
    brma: ABERDEEN_AND_SHIRE
    LHA_category: B
    BRMA_LHA_rate: 6_408.48

- name: Welsh household without a BRMA gets Cardiff
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    region: WALES
    tenure_type: RENT_PRIVATELY
    rent: 12_000
  output:
    brma: CARDIFF
    LHA_category: B
    BRMA_LHA_rate: 6_918.60

- name: Northern Ireland household without a BRMA gets Belfast
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    region: NORTHERN_IRELAND
    tenure_type: RENT_PRIVATELY
    rent: 12_000
  output:
    brma: BELFAST
    LHA_category: B
    BRMA_LHA_rate: 5_702.32

- name: An input BRMA overrides the region default
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    region: SCOTLAND
    brma: LOTHIAN
    tenure_type: RENT_PRIVATELY
    rent: 12_000
  output:
    brma: LOTHIAN
    BRMA_LHA_rate: 8_375.12

- name: An input BRMA outside the household's region is still used
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    region: LONDON
    brma: MAIDSTONE
    tenure_type: RENT_PRIVATELY
    rent: 12_000
  output:
    brma: MAIDSTONE
    BRMA_LHA_rate: 9_467.64

- name: Unknown region keeps Maidstone
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    region: UNKNOWN
    tenure_type: RENT_PRIVATELY
    rent: 12_000
  output:
    brma: MAIDSTONE
    BRMA_LHA_rate: 9_467.64

- name: Every region without a BRMA gets its default
  period: 2025
  input:
    people:
      p1: {age: 40}
      p2: {age: 40}
      p3: {age: 40}
      p4: {age: 40}
      p5: {age: 40}
      p6: {age: 40}
      p7: {age: 40}
      p8: {age: 40}
      p9: {age: 40}
      p10: {age: 40}
      p11: {age: 40}
      p12: {age: 40}
      p13: {age: 40}
    households:
      h1: {members: [p1], region: NORTH_EAST}
      h2: {members: [p2], region: NORTH_WEST}
      h3: {members: [p3], region: YORKSHIRE}
      h4: {members: [p4], region: EAST_MIDLANDS}
      h5: {members: [p5], region: WEST_MIDLANDS}
      h6: {members: [p6], region: EAST_OF_ENGLAND}
      h7: {members: [p7], region: LONDON}
      h8: {members: [p8], region: SOUTH_EAST}
      h9: {members: [p9], region: SOUTH_WEST}
      h10: {members: [p10], region: WALES}
      h11: {members: [p11], region: SCOTLAND}
      h12: {members: [p12], region: NORTHERN_IRELAND}
      h13: {members: [p13], region: UNKNOWN}
  output:
    brma:
      - TYNESIDE
      - CENTRAL_GREATER_MANCHESTER
      - SHEFFIELD
      - LEICESTER
      - BIRMINGHAM
      - PETERBOROUGH
      - INNER_SOUTH_EAST_LONDON
      - SOUTHAMPTON
      - BRISTOL
      - CARDIFF
      - ABERDEEN_AND_SHIRE
      - BELFAST
      - MAIDSTONE
