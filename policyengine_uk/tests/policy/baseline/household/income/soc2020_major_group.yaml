# soc2020_major_group is a person input with no formula: a dataset supplies the
# SOC 2020 major group (1 to 9) of each person's main or last job, and 0 means
# none or unknown.

- name: A supplied major group is read back unchanged
  period: 2026
  input:
    age: 40
    employment_status: FT_EMPLOYED
    soc2020_major_group: 2
  output:
    soc2020_major_group: 2

- name: A retired person keeps the major group of their last job
  period: 2026
  input:
    age: 70
    employment_status: RETIRED
    soc2020_major_group: 9
  output:
    soc2020_major_group: 9

- name: A person without a supplied major group reads 0
  period: 2026
  input:
    age: 40
  output:
    soc2020_major_group: 0
