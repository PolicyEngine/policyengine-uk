# ONS UK administrative lookups, 7 May 2026 and 31 December 2020 V2.
# See issue #2800 source evidence; council labels are exact ONS matches.
# Source: Office for National Statistics licensed under the Open Government Licence v.3.0
- name: Case 1, Edinburgh council infers Scotland without a region input.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
    benunits:
      benunit:
        members: [person1]
    households:
      household:
        members: [person1]
        local_authority: CITY_OF_EDINBURGH
  output:
    region: SCOTLAND
    country: SCOTLAND
    pays_scottish_income_tax: true
    sdlt_liable: false
    lbtt_liable: true
    ltt_liable: false

