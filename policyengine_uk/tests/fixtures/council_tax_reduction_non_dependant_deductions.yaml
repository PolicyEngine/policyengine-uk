# Council Tax Reduction non-dependant deductions as enacted, weekly, for the
# financial year starting 1 April of each year, from each year's amending
# instrument (source) and the point-in-time text of the scheme provision on
# legislation.gov.uk. Bands include their lower edge; the first amount is
# para (1)(b), the last para (1)(a). Wales: WSI 2012/3144 (2013-14), then WSI
# 2013/3029 Sch 1 para 3 and Sch 6 para 5 (identical scales). Scotland: SSI
# 2012/319 reg 48, SSI 2012/303 reg 67 and SSI 2021/249 reg 90 (identical).

