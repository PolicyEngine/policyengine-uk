  - id: scottish_income_tax
    name: Scottish income tax
    full_name: Scottish Income Tax Rates
    category: Taxes
    agency: Revenue Scotland
    status: complete
    coverage: Scotland
    verified_start_year: 2019
    notes: Devolved tax bands applied via income tax system

  - id: lbtt
    name: LBTT
    full_name: Land and Buildings Transaction Tax
    category: Taxes
    agency: Revenue Scotland
    status: complete
    coverage: Scotland
    variable: land_and_buildings_transaction_tax
    parameter_prefix: gov.revenue_scotland.lbtt
    verified_start_year: 2022

  - id: scottish_child_payment
    name: Scottish Child Payment
    full_name: Scottish Child Payment
    category: Benefits
    agency: Social Security Scotland
    status: complete
    coverage: Scotland
    variable: scottish_child_payment
    budget: benefit
    parameter_prefix: gov.social_security_scotland.scottish_child_payment
    verified_start_year: 2022

  - id: pawhp
    name: Pension Age Winter Heating Payment
    full_name: Pension Age Winter Heating Payment
    category: Benefits
    agency: Social Security Scotland
    status: complete
    coverage: Scotland
    variable: pension_age_winter_heating_payment
    parameter_prefix: gov.social_security_scotland.pawhp
    verified_start_year: 2024
    notes: Replaced the Winter Fuel Payment in Scotland from winter 2024-25. From winter 2025-26 recovered by the winter fuel payment charge (income tax) above £35,000 of total income

# Budget terms that no programme entry above carries. The coverage list
# (`programs`) leaves these out: some measure part of a listed programme,
# some a programme the list doesn't carry yet, some no programme. `kind`
# says which; see the header.
budget_terms:
  # --- Taxes ---
  - variable: expected_sdlt
    name: Stamp Duty Land Tax on household purchases
    budget: tax
    kind: programme_measure
    program: stamp_duty_land_tax
    group: property_transaction_taxes

  - variable: expected_ltt
    name: Land Transaction Tax on household purchases
    budget: tax
    kind: programme
    group: property_transaction_taxes
    notes: Welsh Revenue Authority's tax on property purchases in Wales. Not yet in the coverage list.

  - variable: expected_lbtt
    name: Land and Buildings Transaction Tax on household purchases
    budget: tax
    kind: programme_measure
    program: lbtt
    group: property_transaction_taxes

  - variable: corporate_sdlt
    name: Stamp Duty Land Tax paid by companies
    budget: tax
    kind: programme_measure
    program: stamp_duty_land_tax
    group: property_transaction_taxes
    notes: Stamp Duty Land Tax that companies pay; the model shares it across households by shareholding.

  - variable: high_value_council_tax_surcharge
    name: High Value Council Tax Surcharge
    budget: tax
    kind: programme
    group: council_tax
    budget_dropped_when: gov.contrib.abolish_council_tax
    notes: Not yet in the coverage list.

  - variable: domestic_rates
    name: Domestic rates
    budget: tax
    kind: programme
    notes: Northern Ireland's domestic rates. Not yet in the coverage list.

  - variable: wealth_tax
    name: Wealth tax
    budget: tax
    kind: reform_measure
    notes: A hypothetical tax, zero unless a reform sets its rates.

  - variable: non_primary_residence_wealth_tax
    name: Wealth tax excluding the main residence
