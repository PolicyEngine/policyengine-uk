# Modelled policies metadata for PolicyEngine UK
# This is the single source of truth for program coverage information.
# Served via the /uk/metadata API as modelled_policies.
# Consumed by policyengine-model to render the model coverage page.
#
# The file also defines the budget totals. household_tax and
# household_benefits add the variables flagged with `budget`, in the order
# `budget_order` gives; policyengine_uk.programs reads them and
# budget_programs() returns them with their labels.
#
# Budget fields, on `programs` and `budget_terms` entries:
#   budget               tax or benefit: household_tax (tax) or
#                        household_benefits (benefit) adds the entry's
#                        `variable`. Leave it off entries outside the totals.
#   group                optional key shared by terms that move together,
#                        such as the childcare entitlements.
#   budget_dropped_when  optional path of a boolean parameter; the total
#                        leaves the term out while the parameter is true.
#   budget_uprating      benefit terms only: which of
#                        gov.contrib.benefit_uprating's `all` and `non_sp`
#                        scale the term. A benefit term without it takes
#                        both.
#
# `budget_terms` lists the terms that no `programs` entry carries. They stay
# out of the coverage list, and each has a `kind`:
#   programme_measure  the amount the totals count for the `programs` entry
#                      that `program` names, or for one part of it
#   programme          a programme the coverage list does not carry yet; it
#                      has no coverage or verified-year fields until someone
#                      confirms them and moves it into `programs`
#   reform_measure     not a programme: a hypothetical tax or benefit, or a
#                      change from baseline; it stays zero until a reform
#                      sets it, and `program` may name the programme it
#                      changes
#   public_service     not a programme: public services in kind, at their
#                      cost to government
#
# The loader refuses a misspelt field whose name starts with `budget`, and
# any `budget_terms` field outside the ones above and `name` and `notes`.

programs:
  # --- HMRC programs ---
  - id: lifetime_isa
    name: Lifetime ISA
    full_name: Lifetime Individual Savings Account bonus and withdrawal charge
    category: Savings
    agency: HMRC
    status: partial
    coverage: UK
    variable: lifetime_isa_bonus
    parameter_prefix: gov.hmrc.isa.lifetime
    verified_start_year: 2017
    notes: Annual qualifying-payment bonus and gross-withdrawal charge, including individual first-home conditions and the 20% charge for purchases above the price cap from 29 October 2026 (fiscal 2027-28 in the model). Assumes valid account opening and transaction qualification; does not update balances. Late-March 2020 withdrawals are outside the annual timing resolution.

  - id: isa_cash_interest_charge
    name: Non-cash ISA cash-interest charge
    full_name: Final charge on cash interest in stocks-and-shares and innovative finance ISAs
    category: Taxes
    agency: HMRC
    status: partial
    coverage: UK
    variable: isa_cash_interest_flat_rate_charge
    budget: tax
    parameter_prefix: gov.hmrc.isa.cash_interest_charge
    verified_start_year: 2027
    notes: Separate final manager charge at the savings basic rate from 6 April 2027. Requires the cash-interest component as an input; subscription-limit compliance is not modelled.

  - id: isa_subscription_limits
    name: ISA subscription limits
    full_name: Individual Savings Account annual and cash subscription limits
    category: Savings
    agency: HMRC
    status: partial
    coverage: UK
    variable: isa_subscriptions_above_limit
    verified_start_year: 2015
    notes: The annual limit (gov.hmrc.isa.annual_subscription_limit), and a cash limit for people under an age at the end of the tax year (gov.hmrc.isa.cash) that current law leaves unset, as Budget 2026 retains £20,000 for cash; a reform can restore SI 2026/1018's £12,000 for under-65s. Reports subscriptions above each limit from per-person subscription inputs, not where they go. Innovative finance and Junior ISAs are not modelled.

