    kind: reform_measure
    notes: A hypothetical tax, zero unless a reform sets its rates.

  - variable: LVT
    name: Land value tax
    budget: tax
    kind: reform_measure
    notes: A hypothetical tax, zero unless a reform sets its rates.

  - variable: carbon_tax
    name: Carbon tax
    budget: tax
    kind: reform_measure
    notes: A hypothetical tax, zero unless a reform sets its rates.

  - variable: vat_change
    name: Change in VAT
    budget: tax
    kind: reform_measure
    program: vat
    group: vat
    notes: VAT less baseline VAT. The totals count this change, not the VAT level (`vat`).

  - variable: private_school_vat_change
    name: Change in private school VAT
    budget: tax
    kind: reform_measure
    program: vat
    group: vat
    notes: Private school VAT less its baseline.

  - variable: corporate_incident_tax_revenue_change
    name: Unspecified tax change borne by capital
    budget: tax
    kind: reform_measure
    notes: A lump-sum revenue change that a reform sets; the model shares it across households by shareholding.

  - variable: consumer_incident_tax_revenue_change
    name: Unspecified tax change borne by consumers
    budget: tax
    kind: reform_measure
    notes: A lump-sum revenue change that a reform sets; the model shares it across households by consumption.

  - variable: employer_ni_response_capital_incidence
    name: Employer National Insurance change borne by capital
    budget: tax
    kind: reform_measure
    group: employer_ni_incidence
    notes: The share of a change in employer National Insurance that falls on capital. The totals count this change, not employer National Insurance (`ni_employer`).

  - variable: employer_ni_response_consumer_incidence
    name: Employer National Insurance change borne by consumers
    budget: tax
    kind: reform_measure
    group: employer_ni_incidence
    notes: The share of a change in employer National Insurance that falls on consumers through prices.

  - variable: student_loan_repayments
    name: Student loan repayments
    budget: tax
    kind: programme_measure
    program: student_loans

  # --- Benefits ---
