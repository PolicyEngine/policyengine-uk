description: Smallest yearly award of a qualifying tax credit that qualifies a benefit unit for the means-tested Cost of Living Payment through the tax credit route. Under section 2(2) of the Social Security (Additional Payments) Act 2022, HMRC pays in 2022-23 only where the payment, award or expected award of the credit in question for the tax year comes to at least £26. Parliament set no such minimum in section 3(1) of the Social Security (Additional Payments) Act 2023. The model holds yearly amounts, so the formula compares each credit's yearly award with this amount.
values:
  2022-01-01: 26
  2023-01-01: 0
metadata:
  unit: currency-GBP
  period: year
  label: Minimum tax credit award for the means-tested Cost-of-Living Payment
