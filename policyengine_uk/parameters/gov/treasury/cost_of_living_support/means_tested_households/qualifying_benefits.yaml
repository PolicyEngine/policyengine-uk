description: Means-tested benefits that qualify a benefit unit for the means-tested Cost of Living Payment. The list follows section 1(3) of the Social Security (Additional Payments) Act 2022 and of the Social Security (Additional Payments) Act 2023, which name Universal Credit, Pension Credit, income-based Jobseeker's Allowance, income-related Employment and Support Allowance and Income Support. Neither Act lists Housing Benefit.
