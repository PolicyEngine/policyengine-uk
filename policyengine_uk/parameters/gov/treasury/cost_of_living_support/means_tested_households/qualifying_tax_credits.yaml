description: Tax credits that qualify a benefit unit for the means-tested Cost of Living Payment when it gets none of the qualifying benefits. Under section 1(2) of the Social Security (Additional Payments) Act 2022 and of the Social Security (Additional Payments) Act 2023, HMRC pays a person with a qualifying entitlement to Child Tax Credit or Working Tax Credit but not to a qualifying benefit.
