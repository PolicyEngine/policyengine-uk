description: Yearly total of the means-tested Cost of Living Payments to each benefit unit on a qualifying benefit or tax credit. Parliament set £326 and £324 in the Social Security (Additional Payments) Act 2022, £650 in all, and £301, £300 and £299 in the Social Security (Additional Payments) Act 2023, £900 in all. The model pays the 2022 Act's amounts in 2022-23 and the 2023 Act's in 2023-24, and the amount reads zero before 2022 and from 2024.
values:
  0001-01-01: 0
  2022-01-01: 650
  2023-01-01: 900
  2024-01-01: 0
