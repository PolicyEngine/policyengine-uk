description: Disability Cost of Living Payment to each person on a qualifying disability benefit. Parliament set £150 in section 5(1) of both the Social Security (Additional Payments) Act 2022 and the Social Security (Additional Payments) Act 2023. The model pays it in 2022-23 and 2023-24, and the amount reads zero before 2022 and from 2024.
values:
  0001-01-01: 0
  2022-01-01: 150
  2023-01-01: 150
  2024-01-01: 0
