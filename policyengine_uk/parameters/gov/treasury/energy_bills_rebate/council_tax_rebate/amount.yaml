description: Council Tax rebate paid to households in qualifying Council Tax bands under the Energy Bills Rebate.
# A one-off £150 per household in 2022-23. Eligibility was fixed at the end of
# 1 April 2022, and billing authorities had to make every payment by
# 30 September 2022 (billing authority guidance, paragraphs 7, 14 and 19).
# 2023-24 had no rebate.
