description: Share of households receiving a qualifying benefit other than Pension Credit in England and Wales that receive the Warm Home Discount rebate. The Department for Energy Security and Net Zero bases this on delivery experience of the scheme, where around 70% of recipients of other means-tested benefits become rebate recipients. The impact assessment tests 60% and 80% as low and high sensitivities.
values:
  2025-04-01: 0.7
