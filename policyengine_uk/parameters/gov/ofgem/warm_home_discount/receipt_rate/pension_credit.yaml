description: Share of households receiving Pension Credit in England and Wales that receive the Warm Home Discount rebate. The Department for Energy Security and Net Zero bases this on delivery experience of the scheme, where around 85% of Pension Credit recipients become rebate recipients. The model applies it to every household where any benefit unit receives Pension Credit.
values:
  2025-04-01: 0.85
