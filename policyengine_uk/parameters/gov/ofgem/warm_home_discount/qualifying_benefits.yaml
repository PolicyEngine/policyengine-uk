description: Means-tested benefits whose receipt by a member of the household qualifies it for the Warm Home Discount in England and Wales. The Secretary of State sets them in the eligibility statement for each scheme year. In 2025-26, Core Group 1 covered Pension Credit Guarantee Credit and Core Group 2 the other benefits listed, including Pension Credit Savings Credit, so any Pension Credit qualifies. From 2026-27 a single core group covers both elements of Pension Credit. Before 2025-26, the low-income group also had to pass a high-cost-to-heat test on property data, which the model doesn't encode, so the list is empty and the model doesn't calculate the rebate for those years.
