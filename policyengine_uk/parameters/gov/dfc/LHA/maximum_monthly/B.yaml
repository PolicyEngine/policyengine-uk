description: Maximum monthly Local Housing Allowance for category B dwellings (one bedroom, exclusive use) in Northern Ireland, used for Universal Credit. It works as gov.dwp.LHA.maximum_monthly.B does for Great Britain, but follows the Northern Ireland Housing Executive's determinations under Northern Ireland regulations. The values match the Great Britain maximum.
