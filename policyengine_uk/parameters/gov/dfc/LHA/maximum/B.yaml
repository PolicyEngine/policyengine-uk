description: Maximum weekly Local Housing Allowance for category B dwellings (one bedroom, exclusive use) in Northern Ireland, used for Housing Benefit. It works as gov.dwp.LHA.maximum.B does for Great Britain, but follows the Northern Ireland Housing Executive's determinations under Northern Ireland regulations. The values match the Great Britain maximum.
