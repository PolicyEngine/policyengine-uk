description: National single bus fare cap that the published local bus fares index already
  reflects. It follows gov.dft.bus.fares.cap up to the last published quarter of
  gov.dft.bus.local_bus_fares_index and holds the cap then in force after it. The model adds
  the effect of any difference between the two schedules, so the scheduled 2027 GBP 2 cap and
  its end in 2028 enter the baseline, and a reform of fares.cap adds its own effect. Leave
  this schedule unchanged in reforms; extend it when a newly published quarter is added to
  the index.
values:
  0001-01-01: .inf
  2023-01-01: 2
  2025-01-01: 3
