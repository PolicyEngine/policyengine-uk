description: The Department for Education designates these programs as qualifying benefits for the targeted childcare entitlement eligibility (the 2-year-old entitlement) in England. The child's parent must be entitled to one, so income-based JSA and income-related ESA count only as the claimant's or partner's award, and Pension Credit counts only as receipt of a guarantee credit, which needs the qualifying age and a claim, rather than the guarantee credit amount, which is computed whether or not the family claims.
