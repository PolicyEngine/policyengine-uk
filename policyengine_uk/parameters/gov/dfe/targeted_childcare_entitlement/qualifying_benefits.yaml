description: The Department for Education designates these programs as qualifying benefits for the targeted childcare entitlement eligibility (the 2-year-old entitlement) in England. A parent qualifies through Pension Credit only when entitled to its guaranteed element, which needs the qualifying age and a claim, so that entry is receipt of a guarantee credit rather than the guarantee credit amount, which is computed whether or not the family claims.
