description: >-
  Hours a week at the National Minimum Wage that set the weekly earnings limit
  of Employment and Support Allowance permitted work from 11 April 2011.
  Regulation 45(4) makes work done for less than the exempt work hours limit
  exempt work where the claimant's earnings in any week do not exceed this many
  times the National Minimum Wage, which regulation 2(1) defines as the rate in
  regulation 11 of the National Minimum Wage Regulations 1999, now the national
  living wage. Regulation 45(9A) rounds the result up to the next 50p.
