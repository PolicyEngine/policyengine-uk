description: Fixed weekly earnings limit of Employment and Support Allowance permitted work before 11 April 2011. Work done for less than the exempt work hours limit, for which a claimant's earnings in any week did not exceed this amount, was exempt work. From 11 April 2011 the limit is a number of hours a week at the National Minimum Wage instead.
