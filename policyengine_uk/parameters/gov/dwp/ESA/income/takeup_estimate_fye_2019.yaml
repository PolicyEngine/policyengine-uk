description: Published joint Income Support and income-related Employment and Support Allowance caseload take-up estimate for FYE 2019, for eligible families in private households in Great Britain. The point estimate is 90%, with a 95% sampling confidence interval of 89–92%; it is not an ESA-only or expenditure estimate. This unused fixed-vintage observation becomes available on publication, 29 October 2020, which is not policy commencement. Later retrieval still refers to FYE 2019 and does not set current or future participation or a Northern Ireland rate.
