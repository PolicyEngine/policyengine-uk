description: >
  Share of the current market or surrender value deducted from income-related
  ESA capital where there would be expenses attributable to sale. It is a flat
  10% whatever the actual costs, taken from the gross value before any
  encumbrance secured on the asset is deducted.
values:
  2008-10-27: 0.1
