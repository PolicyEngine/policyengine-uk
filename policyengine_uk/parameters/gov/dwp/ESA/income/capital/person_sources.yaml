description: >
  Person-level model variables counted as income-related Employment and
  Support Allowance capital of the person's own benefit unit. They are summed
  over the benefit unit's members, so they need none of the household proxy
  that the household `sources` use. `lifetime_isa_countable_capital` is a
  Lifetime ISA at its surrender value: regulation 113 values capital at its
  current market or surrender value, and DMG 52665 counts a Lifetime ISA at
  75% of its value under 60 and in full from 60.
