description: >-
  Whether old style income-related Employment and Support Allowance awards are
  still payable (1) or abolished (0). The Welfare Reform Act 2012 abolition of
  income-related ESA came into force for every remaining award on 1 July 2026
  in Great Britain and 1 October 2026 in Northern Ireland, except awards saved
  for an appointee (esa_income_appointee_saving). A contributory allowance in
  the same award continues as new style ESA. Annual formulas read parameters
  once, at the start of the model year, after fiscal-year conversion.
  Parameters normally sample 30 April, but these numeric flags use
  fiscal_year_blend to take the day-weighted average from 6 April to 5 April,
  so 2026-27 carries 86 of its 365 days in Great Britain and 178 in Northern
  Ireland. In a Simulation reform dictionary a bare year overrides the whole
  fiscal year, while a key dated inside the year (for example 2026-07-01)
  leaves that model year's value unchanged. Use whole-year values or a date
  range for annual reform scenarios.
great_britain:
  description: Whether old style income-related Employment and Support Allowance awards are still payable in Great Britain. SI 2025/1148 art. 3A brought section 33(1)(b) of the Welfare Reform Act 2012 into force for them on 1 July 2026.
  values:
    2008-10-27: 1
    2026-07-01: 0
  metadata:
    label: Income-related ESA awards payable in Great Britain
    unit: /1
    period: year
    fiscal_year_blend: true
    reference:
      - title: SI 2025/1148 art. 3A (inserted by SI 2026/409 art. 2(4))
        href: https://www.legislation.gov.uk/uksi/2025/1148/article/3A
      - title: SI 2026/409, The Welfare Reform Act 2012 (Commencement No. 35) (Abolition of Benefits) (Amendment) Order 2026
        href: https://www.legislation.gov.uk/uksi/2026/409/made
      - title: SI 2013/983 art. 4(1) (the amending provisions)
        href: https://www.legislation.gov.uk/uksi/2013/983/article/4
      - title: Welfare Reform Act 2012 s. 33(1)(b)
        href: https://www.legislation.gov.uk/ukpga/2012/5/section/33
northern_ireland:
  description: Whether old style income-related Employment and Support Allowance awards are still payable in Northern Ireland. SR 2025/176 art. 3A brought Article 39(1)(b) of the Welfare Reform (Northern Ireland) Order 2015 into operation for them on 1 October 2026.
  values:
