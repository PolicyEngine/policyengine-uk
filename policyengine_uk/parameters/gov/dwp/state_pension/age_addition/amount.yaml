description: The Department for Work and Pensions adds this weekly amount, the age addition, to the retirement pension of a person over the age of 80. Up-rating Orders leave it out of the annual uprating, so it has stayed at 25p.
values:
  1992-07-01: 0.25
metadata:
  period: week
  unit: currency-GBP
  label: State Pension age addition
  reference:
