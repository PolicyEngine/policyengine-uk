      href: https://www.legislation.gov.uk/ukpga/1992/4/schedule/4
    - title: Social Security Benefits Up-rating Order 2026 art 3(2)(a) (the age addition is not increased)
      href: https://www.legislation.gov.uk/uksi/2026/148/article/3/made
