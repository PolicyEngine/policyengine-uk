description: >
  Benefits whose receipt at the rate named meets the qualifying-benefit
  condition of the legacy enhanced disability premium for a claimant or
  partner: the care component of disability living allowance at the highest
  rate, the daily living component of personal independence payment at the
  enhanced rate, and armed forces independence payment. Each programme adds its
  own conditions, such as the age limit. The Regulations also list the Scottish
  equivalents (child disability payment and Scottish adult disability living
  allowance care components at the highest rate, adult disability payment
  daily living component at the enhanced rate), which are not separate model
  variables. The 8 April 2013 date is Great Britain's: S.I. 2013/388 added the
  PIP daily living component and S.I. 2013/591 added armed forces independence
  payment. This list applies in Great Britain; the
  enhanced_qualifying_benefits_northern_ireland parameter holds Northern
  Ireland's separate commencement dates. Like other parameters, the model reads
  the list as at 30 April of each year from 2015 and does not prorate a change
  made during a year.
