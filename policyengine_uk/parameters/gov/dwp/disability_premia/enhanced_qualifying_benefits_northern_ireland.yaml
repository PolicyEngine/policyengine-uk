description: >
  Awards that meet the qualifying-benefit condition of the legacy enhanced
  disability premium for a claimant or partner in Northern Ireland. The care
  component of disability living allowance at the highest rate qualifies. S.I.
  2013/3021 added armed forces independence payment from 24 December 2013, and
  S.R. 2016/228 added the daily living component of personal independence
  payment at the enhanced rate from 20 June 2016, to the Northern Ireland
  Income Support, Jobseeker's Allowance, Housing Benefit and Employment and
  Support Allowance regulations. The model reads the list as at 30 April of
  each year from 2015 and does not prorate a change made during a year, so it
  adds the daily living component from 2017. The first value's date follows
  the Great Britain list rather than the commencement of S.R. 2006/405 on 20
  November 2006.
