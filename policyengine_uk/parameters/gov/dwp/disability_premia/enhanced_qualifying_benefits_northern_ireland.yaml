description: >
  Benefits whose receipt at the rate named meets the qualifying-benefit
  condition of the legacy enhanced disability premium for a claimant or
  partner in Northern Ireland. The care component of disability living
  allowance at the highest rate qualifies. Armed forces independence payment
  was added from 24 December 2013 by S.I. 2013/3021, and the personal
  independence payment daily living component at the enhanced rate from 20
  June 2016 by S.R. 2016/228, in the Northern Ireland Income Support,
  Jobseeker's Allowance, Housing Benefit and Employment and Support Allowance
  regulations. Like other parameters, the model reads the list
  as at 30 April of each year from 2015 and does not prorate a change made
  during a year, so it adds the daily living component from 2017. The initial
  value date follows the Great Britain list, not the commencement of S.R.
  2006/405 on 20 November 2006.
