description: >
  Benefits whose receipt makes a claimant or partner severely disabled for the
  legacy severe disability premium, and whose receipt by a non-dependant means
  that non-dependant is ignored in the premium's residence condition. The
  Regulations list attendance allowance (either rate), the care component of
  disability living allowance at the highest or middle rate, the daily living
  component of personal independence payment at either rate, armed forces
  independence payment, and the Scottish equivalents. The Scottish benefits
  are not separate model variables, and the lists differ slightly between
  instruments. The 8 April 2013 date is Great Britain's: S.I. 2013/388 added
  the PIP daily living component and S.I. 2013/591 added armed forces
  independence payment. This list applies in Great Britain; the
  severe_qualifying_benefits_northern_ireland parameter holds Northern
  Ireland's separate commencement dates. The model selects the list using
  household country. Like other parameters, it reads the list as at 30 April
  of each year from 2015 and at 1 January before that, and does not prorate a
  change made during a year.
