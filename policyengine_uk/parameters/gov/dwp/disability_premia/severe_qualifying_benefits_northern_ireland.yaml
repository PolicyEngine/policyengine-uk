description: >
  Benefits whose receipt qualifies a claimant or partner for the legacy severe
  disability premium, or exempts a non-dependant from its residence condition,
  in Northern Ireland. Attendance allowance at either rate and the disability
  living allowance care component at the middle or highest rate qualify.
  Armed forces independence payment was added from 24 December 2013 by
  S.I. 2013/3021, and the personal independence payment daily living component
  at either rate from 20 June 2016 by S.R. 2016/228. The amendments cover the
  Northern Ireland Income Support, Jobseeker's Allowance, Housing Benefit and
  Employment and Support Allowance regulations. Like other parameters, the model
  reads the list as at 30 April of each year from 2015 and at 1 January before
  that, and does not prorate a change made during a year. The initial value
  date follows the shared model baseline, not the commencement of S.R.
  2006/405 on 20 November 2006. Northern Ireland historical coverage before
  that commencement has not been verified.
