description: >
  Statutory payments that Universal Credit treats as employed earnings.
  Regulation 55(4) of the Universal Credit Regulations 2013 says "The following
  benefits are to be treated as employed earnings— (a) statutory sick pay; (b)
  statutory maternity pay; (c) ... statutory paternity pay; (d) ...; (e)
  statutory adoption pay; ... (f) statutory shared parental pay; ... (g)
  statutory parental bereavement pay; and (h) statutory neonatal care pay."
  The deductions in regulation 55(5) (tax, primary Class 1 and relievable
  pension contributions) apply to them as to other employed earnings.
  Sub-paragraph (f) was inserted from 31 December 2014, (g) from 6 April 2020
  and (h) from 6 April 2025. Sub-paragraph (d), additional statutory paternity
  pay, was omitted from 5 April 2015; the model holds ordinary and additional
  statutory paternity pay in one variable.
