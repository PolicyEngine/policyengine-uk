description: >
  Ordinary cash ISA balances are separate from savings and are included at
  their accessible cash value, without a generic cash sale-cost deduction.
  Household financial proxies for Universal Credit: savings and share-like
  financial wealth. `share_like_capital` is `corporate_wealth` as supplied, or
  the sum of its itemised components (`directly_held_shares`,
  `unit_and_investment_trusts`, `stocks_and_shares_isa`) where they exceed it
  beyond float32 rounding, so a household given only the components has them
  counted and no holding counts twice. A nonnegative benunit_reported_capital
  replaces these financial proxies and covered person-level sources, including
  a Lifetime ISA. Each benefit unit's complete uc_reported_capital override,
  otherwise its observed financial total, reduces this financial pool.
  Subtracting complete overrides retains the inherited allocation convention.
  An override precedes regulation 77 company substitution and includes its
  claimant's and partner's holdings: consume at least their disregarded
  holdings after applying one household share_like_capital budget without
  removing them again from the pool. First clip each person's holding to [0,
  max(0, share_like_capital)], with positive infinity mapped to the upper
  bound and negative infinity to zero. If total bounded holdings exceed
  nonnegative share_like_capital, scale each person's bounded holding
  proportionally before override floors and separate pool deductions. This is
  a defensive rule for inconsistent inputs, not a statutory determination;
  regulation 77 substitution in the owner's own assessment is unchanged. The
  residual is allocated by claimant/partner counts to benefit units with
  neither a financial observation nor a complete override, including units
  that do not receive UC. This allocation is an assumption about unobserved
  ownership, not a statutory rule. Countable property is valued and shared
  independently through property_sources across ALL claimant/partner adults,
  with complete-override units consuming their shares. Main-home property and
  the named private_pension_wealth input are excluded under Schedule 10
  paragraphs 1 and 10. For missing-report households, the legacy
  corporate_wealth proxy, and so share_like_capital, can still contain non-DB
  pension wealth that is not separately identified and removed. Asset-specific
  Schedule 10 disregards within these broad financial classes are not
  separately observed.
  `overseas_property_value` covers overseas land and property, and
  `other_property_value` covers other real estate with unspecified
  geography and type. These broad household categories cannot identify
  individual beneficial ownership or additional statutory disregards.
  No separate secured-debt input is available for either category. They use
  the separate property_sources route, independently of financial reports.
