description: >
  Proportion deducted from current property market value where sale entails
  expenses, before subtracting secured encumbrances (regulation 49). Broad
  household property inputs are assumed to incur sale expenses. Cash financial
  proxies do not receive this deduction.
values:
  2013-04-29: 0.1
