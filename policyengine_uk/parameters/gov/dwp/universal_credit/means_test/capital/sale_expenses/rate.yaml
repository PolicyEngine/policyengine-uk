description: >
  Share of the current market or surrender value deducted from Universal
  Credit capital where there would be expenses attributable to sale. The
  deduction is a flat 10% whatever the actual costs, taken before any
  encumbrance secured on the asset.
values:
  2013-04-29: 0.1
