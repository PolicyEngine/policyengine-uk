description: >
  Capital sources whose sale would incur expenses, so that Universal Credit
  values them at 90% of market value. Costs of sale normally arise where an
  agent, broker, auctioneer, solicitor or accountant is needed, and real
  property always has them (ADM H1606), so `owned_land`,
  `other_residential_property_value` and `non_residential_property_value` are
  listed. `savings` is not listed: a bank or building society account is
  valued at its balance, and the costs of withdrawing money are not costs of
  sale (ADM H1604-H1607 and H1675). `corporate_wealth` is listed because
  shares are valued less 10% for the costs of selling them (ADM H1665). It is
  a mixed variable, though: it also holds unit trusts, which have no costs of
  sale (ADM H1674), stocks and shares ISAs and employee share options, and
  datasets built before private pension wealth was split out also fold non-
  defined-benefit pension wealth into it, which is not capital at all. The
  deduction reaches all of these until the data separate them. Sources not
  counted as Universal Credit capital are ignored.
