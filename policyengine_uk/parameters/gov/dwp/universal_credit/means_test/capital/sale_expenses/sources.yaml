description: >
  Capital sources whose sale would incur expenses, so that Universal Credit
  values them at 90% of market value. Costs of sale normally arise where an
  agent, broker, auctioneer, solicitor or accountant is needed, and real
  property always has them (ADM H1606), so `owned_land`,
  `other_residential_property_value` and `non_residential_property_value` are
  listed. `savings` is not listed: a bank or building society account is
  valued at its balance, and the costs of withdrawing money are not costs of
  sale (ADM H1604-H1607 and H1675). `directly_held_shares` is listed because
  shares are valued less 10% for the costs of selling them (ADM H1665).
  `unit_and_investment_trusts` is deliberately not listed: a unit trust is
  valued at its bid price and has no costs of sale, because the person
  withdraws from the manager, even if they use a stockbroker (ADM
  H1673-H1674). Investment trusts are not named in the guidance and, as listed
  company shares, arguably take the 10%, but the Wealth and Assets Survey asks
  about unit and investment trusts in one question, so the whole bucket is
  treated as having no costs of sale. That approximation counts investment
  trusts at full value; HMRC ISA statistics (table 9.6) put investment trusts
  at about 7% to 8% of the pooled funds held in stocks and shares ISAs (8.2% at 5 April
  2022, 6.9% at 5 April 2025). `stocks_and_shares_isa` is deliberately not listed
  either: an ISA is valued at what the person would get by withdrawing it, and
  no ISA paragraph applies the 10% (ADM H1656-H1658).
  `unitemised_corporate_wealth` is listed so that datasets which do not
  itemise `corporate_wealth` keep its previous flat treatment: there it equals
  `corporate_wealth`, which mixes shares with unit trusts, stocks and shares
  ISAs and employee share options, and, on datasets built before private
  pension wealth was split out, non-defined-benefit pension wealth, which is
  not capital at all. The deduction reaches all of these until the data
  separate them. Sources not counted as Universal Credit capital are ignored.
