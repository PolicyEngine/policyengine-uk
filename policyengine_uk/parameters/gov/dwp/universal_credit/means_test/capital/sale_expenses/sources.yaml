description: >
  Capital sources whose sale would incur expenses, so that Universal Credit
  values them at 90% of market value. Real property always has costs of sale
  (ADM H1606, citing R(IS) 21/93), so `owned_land`,
  `other_residential_property_value` and `non_residential_property_value` are
  listed. `savings` is not listed: the 10% applies only where selling needs
  an agent, broker, solicitor or accountant (ADM H1604-H1605), the costs of
  withdrawing money from a building society are not costs of sale (H1607),
  and an account is valued at its balance (H1675). `corporate_wealth` is
  listed because quoted shares are valued less 10% for costs of sale (H1665).
  It also holds unit trusts, which have no costs of sale (H1674), and stocks
  and shares ISAs, which the guidance values at their withdrawal value
  (H1656); the dataset does not separate these, so the deduction also
  reaches them. Sources not counted as Universal Credit capital are ignored.
