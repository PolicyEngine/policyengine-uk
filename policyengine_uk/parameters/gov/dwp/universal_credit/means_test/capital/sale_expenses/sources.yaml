description: >
  Universal Credit financial capital sources (capital.sources) whose sale
  would incur expenses, so that they are valued at 90% of market value.
  `share_like_capital` is listed because shares are valued less 10% for the
  costs of selling them (ADM H1665). It is a mixed variable, though: it also
  holds unit trusts, which have no costs of sale (H1674), stocks and shares
  ISAs, valued at their withdrawal value (H1656), and employee share options,
  and datasets built before private pension wealth was split out also fold
  non-defined-benefit pension wealth into it, which is not capital at all. The
  deduction reaches all of these until the data separate them. `savings` is
  not listed: the 10% applies where selling normally needs an agent, broker,
  solicitor or accountant (H1604-H1605), the costs of withdrawing money are
  not costs of sale (H1607), and an account is valued at its balance (H1675).
  Existing domestic property is valued through property_sources with the same rate,
  and real property always has costs of sale (H1606).
  `share_like_capital` retains the supplied `corporate_wealth` aggregate or
  the larger itemised-share total beyond float32 rounding, without adding
  both. Its sale-expense treatment therefore also applies to the combined
  share-component fallback, retaining the broad-asset limitations above.
  `overseas_property_value` covers overseas land and property, and
  `other_property_value` covers other real estate with unspecified
  geography and type. Both use the real-property sale-expense treatment
  when counted. These broad household sources cannot identify individual
  beneficial ownership or every statutory disregard; no separate secured
  debt is available for either category.
