description: >
  Universal Credit financial capital sources (capital.sources) whose sale
  would incur expenses, so that they are valued at 90% of market value.
  `share_like_capital_with_sale_expenses` is listed: the part of share-like
  capital whose sale incurs expenses, namely directly held shares, valued less
  10% for the costs of selling them (ADM H1665), and all of `corporate_wealth`
  on datasets that do not itemise it (which then still folds in unit trusts,
  ISAs and, on datasets built before private pension wealth was split out,
  non-defined-benefit pension wealth). Unit and investment trusts and stocks
  and shares ISAs are valued without the deduction;
  `gov.dwp.share_like_capital.without_sale_expenses` lists them, with the
  guidance and the approximation for investment trusts, which the survey
  cannot separate from unit trusts. `savings` is not listed: the 10% applies
  where selling normally needs an agent, broker, solicitor or accountant
  (H1604-H1605), the costs of withdrawing money are not costs of sale (H1607),
  and an account is valued at its balance (H1675). Countable property is
  valued through property_sources with the same rate, and real property always
  has costs of sale (H1606).
