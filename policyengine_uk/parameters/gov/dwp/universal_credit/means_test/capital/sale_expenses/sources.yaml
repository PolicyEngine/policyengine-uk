description: >
  Universal Credit financial capital sources (capital.sources) whose sale
  would incur expenses, so that they are valued at 90% of market value.
  `share_like_capital` (`corporate_wealth`, or its itemised components where
  they exceed it) is listed because shares are valued less 10% for the costs
  of selling them (ADM H1665). It is a mixed variable, though: it also holds
  unit trusts, which have no costs of sale (H1674), stocks and shares ISAs,
  valued at their withdrawal value (H1656), and employee share options, and
  datasets built before private pension wealth was split out also fold
  non-defined-benefit pension wealth into it, which is not capital at all. The
  deduction reaches all of these until the data separate them. `savings` is
  not listed: the 10% applies where selling normally needs an agent, broker,
  solicitor or accountant (H1604-H1605), the costs of withdrawing money are
  not costs of sale (H1607), and an account is valued at its balance (H1675).
  Countable property is valued through property_sources with the same rate,
  and real property always has costs of sale (H1606).
