description: >
  Person-level model variables counted as Universal Credit capital of the
  person's own benefit unit. The formulas sum these sources over the benefit
  unit's claimant and partner (`is_uc_claimant`) and exclude dependants: DWP
  tests the claimant's, or the joint claimants' combined, capital under
  section 5 of the Welfare Reform Act 2012. `lifetime_isa_countable_capital`
  values a Lifetime ISA at its surrender value: DWP values capital at its
  current market or surrender value under regulation 49(1), and ADM H1659
  counts a Lifetime ISA at 75% of its value under 60 and in full from 60.
  Lifetime ISAs exist from 6 April 2017, and the formulas count them from
  then. A nonnegative `benunit_reported_capital` replaces these financial
  sources for its unit, so the formula counts no ISA twice, and a complete
  `uc_reported_capital` override replaces them together with property and the
  household financial proxy, before the regulation 77 company substitution.
  `cash_isa_countable_capital` and `stocks_and_shares_isa_countable_capital`
  hold a member's cash and stocks and shares ISA balances, bounded by the
  household total. The account investor beneficially owns an ordinary ISA's
  investments, and the named child owns a junior ISA's investments (Individual
  Savings Account Regulations 1998 reg. 4(6)(a) and reg. 2B(c)). Where no unit
  reports capital, the formula subtracts each bounded ISA balance from its
  household source and counts it in the holder's unit. For a reporting UC
  unit, the formula leaves its claimant's and partner's ISAs in the pool and
  subtracts the report. When a household's balances exceed its total, the
  model scales them to sum to the total exactly, rounding each share down or
  up to a whole float32 step of the total. When a reform removes a household
  source from `sources`, the formulas exclude the corresponding ISA person
  source. With household totals alone, the formulas leave the whole total in
  the pool. The ISA Regulations came into force for all other purposes on 6
  April 1999 (reg. 1).
