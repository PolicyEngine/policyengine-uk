description: >
  Person-level model variables counted as Universal Credit capital of the
  person's own benefit unit. They are summed over the benefit unit's claimant
  and partner (`is_uc_claimant`), so they need none of the household proxy
  that the household `sources` use, and a dependant's holding is left out:
  section 5 of the Welfare Reform Act 2012 tests the claimant's, or the joint
  claimants' combined, capital. `lifetime_isa_countable_capital` is a
  Lifetime ISA at its surrender value: regulation 49(1) values capital at its
  current market or surrender value, and ADM H1659 counts a Lifetime ISA at
  75% of its value under 60 and in full from 60. Lifetime ISAs exist from 6
  April 2017, and the list is empty before then.
