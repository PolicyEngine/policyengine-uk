description: >-
  Weekly hours behind the amount that a joint claimant subject to no
  work-related requirements, for a reason other than their earnings, adds to
  the couple threshold for the Universal Credit minimum income floor.
  Regulation 90(3)(a) makes the couple threshold "the sum of their individual
  thresholds", and regulation 90(2) sets an individual threshold only for a
  claimant who would otherwise be in the work-focused interview or work
  preparation group (16 hours) or the all work-related requirements group (the
  expected hours). It sets none for a claimant with limited capability for
  work-related activity, a carer, the responsible carer of a child under 1 or
  a claimant over State Pension Credit qualifying age, and neither the Advice
  for Decision Making nor DWP's guidance on the floor gives one. The model
  follows the text: such a partner adds nothing.
values:
  2013-04-29: 0
