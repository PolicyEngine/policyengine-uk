description: Whether the amount for National Insurance that converts the Universal Credit minimum income floor to a net amount is the Class 2 and Class 4 contributions due on self-employed profits equal to the threshold, rather than the primary Class 1 contributions due on pay equal to it. The regulations leave the amount to the Secretary of State. DWP describes the floor as what an employed person would earn at the minimum wage after tax and National Insurance, so the model uses Class 1; DWP's 2017 guidance on applying the floor deducted Class 2 and Class 4 instead.
values:
