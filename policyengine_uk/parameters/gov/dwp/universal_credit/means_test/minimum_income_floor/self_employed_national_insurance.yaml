description: >-
  Whether the amount for National Insurance that converts the Universal Credit
  minimum income floor to a net amount is the Class 2 and Class 4 contributions
  due on self-employed profits equal to the threshold, rather than the primary
  Class 1 contributions due on pay equal to it. The regulations leave the amount
  to the Secretary of State. DWP's 2017 guidance on applying the floor deducts
  Class 2 and Class 4, and DWP's own figures match that basis (the ADM example of
  946 a month in 2015-16, to the pound; a floor set on a claimant's award at
  1,144.15 a month in 2019-20; and 1,642.72 a month that DWP supplied for
  2025-26). DWP's quick guide describes the floor as what an employed person
  would earn after tax and National Insurance, which false models instead.
values:
  2013-04-29: true
