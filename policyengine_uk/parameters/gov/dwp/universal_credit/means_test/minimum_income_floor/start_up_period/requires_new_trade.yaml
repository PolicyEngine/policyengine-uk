description: >-
  Whether a Universal Credit start-up period, in which the minimum income
  floor does not apply, requires the claimant to have begun their trade in the
  12 months before the assessment period in which they are found to be in
  gainful self-employment. Until 22 September 2020 regulation 63(1)(a)
  required that. From 23 September 2020 it requires instead that the floor has
  not previously applied to the claimant for the trade, so a claimant with an
  established trade has a start-up period when they are first found to be in
  gainful self-employment, for example after moving into the all work-related
  requirements group.
values:
  2013-04-29: true
  2020-09-23: false
metadata:
  unit: bool
  label: Universal Credit start-up period requires a new trade
  reference:
