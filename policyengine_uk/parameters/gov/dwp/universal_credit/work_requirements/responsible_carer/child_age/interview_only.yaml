description: >-
  Age below which a child aged at least 1 puts their responsible carer in the
  Universal Credit group subject to the work-focused interview requirement
  only. The Act as passed covered a child "aged at least 1 and ... under a
  prescribed age", prescribed as 5 and then, from 28 April 2014, as 3. Since 3
  April 2017 the Act covers a child "who is aged 1".
values:
  2013-04-29: 5
  2014-04-28: 3
  2017-04-03: 2
metadata:
  unit: year
  label: Universal Credit responsible carer work-focused interview only child age limit
