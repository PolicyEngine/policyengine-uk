description: >-
  Expected weekly hours DWP uses for the responsible carer of a child who has
  reached compulsory school age and is under 13. The regulation leaves the
  number to the Secretary of State ("compatible with the child's normal school
  hours"). DWP's stated expectation was 25 hours. For the minimum income
  floor it became a maximum of 30 hours for lead carers found gainfully
  self-employed from 31 January 2024, and DWP began raising existing floors to
  it from February 2025, the date used here. Work coaches can set fewer hours
  for a claimant's circumstances; the model uses the maximum.
values:
  2013-04-29: 25
  2025-02-01: 30
