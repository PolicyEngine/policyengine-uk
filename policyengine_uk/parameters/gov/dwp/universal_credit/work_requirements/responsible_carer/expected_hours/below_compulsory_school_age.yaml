description: >-
  Expected weekly hours DWP uses for the responsible carer of a child who has
  not yet reached compulsory school age. The regulation leaves the number to
  the Secretary of State ("compatible with those caring responsibilities").
  Until 3 April 2017 one rule covered every child under 13 (25 hours), though
  the responsible carer of a child under 5 was not then in the all
  work-related requirements group. DWP's stated expectation from 3 April 2017
  was 16 hours for a child aged 3 or 4. For the minimum income floor it became
  a maximum of 30 hours for lead carers found gainfully self-employed from 31
  January 2024, and DWP began raising existing floors to it from February
  2025, the date used here. Work coaches can set fewer hours for a claimant's
  circumstances; the model uses the maximum.
values:
  2013-04-29: 25
  2017-04-03: 16
  2025-02-01: 30
