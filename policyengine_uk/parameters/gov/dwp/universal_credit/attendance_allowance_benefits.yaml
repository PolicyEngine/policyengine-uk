description: Benefits that count as attendance allowance under the Universal Credit Regulations, so that a person who receives any of them is in receipt of attendance allowance for Universal Credit. The list covers heads (a) and (f) of the definition. The model holds no separate amount for heads (b), (d) and (e), so it cannot list them.
values:
