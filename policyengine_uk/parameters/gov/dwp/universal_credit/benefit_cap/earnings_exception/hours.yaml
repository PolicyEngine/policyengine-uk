description: >-
  Weekly hours at the national living wage that set the earnings threshold of
  the Universal Credit benefit cap's earnings exception. Regulation 82(1)(a)
  lifts the cap where the claimant's earned income, or a couple's combined
  earned income, is at least the pay for these hours at the hourly rate in
  regulation 4 of the National Minimum Wage Regulations, converted to a monthly
  amount by multiplying by 52 and dividing by 12. Fractions of a pound in that
  monthly amount are disregarded (regulation 6(1A)(za)). Before 1 April 2017 the
  threshold was a fixed monthly amount instead.
values:
  2017-04-01: 16
