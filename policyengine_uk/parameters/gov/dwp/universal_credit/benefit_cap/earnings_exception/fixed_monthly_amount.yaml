description: >-
  Fixed monthly earnings threshold of the Universal Credit benefit cap's
  earnings exception before 1 April 2017. Regulation 82(1)(a) as made lifted
  the cap where the claimant's earned income, or a couple's combined earned
  income, was at least this amount. From 1 April 2017 the threshold is the pay
  for a number of hours a week at the national living wage instead.
values:
