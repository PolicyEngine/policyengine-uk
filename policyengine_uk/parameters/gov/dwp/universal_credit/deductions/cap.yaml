description: Maximum total deductions from a Universal Credit award, as a fraction of the standard allowance (the Fair Repayment Rate from 30 April 2025), set by Schedule 6 of SI 2013/380. Last resort deductions (e.g. child maintenance under the Fair Repayment Rate) may exceed this cap. History announced at fiscal events - 40% to 30% from October 2019 (Budget 2018), to 25% from April 2021 (announced Budget 2020) - and consolidated in the amended Schedule 6.
values:
  2015-04-01: 0.4
  2019-10-01: 0.3
  2021-04-01: 0.25
  2025-04-30: 0.15
