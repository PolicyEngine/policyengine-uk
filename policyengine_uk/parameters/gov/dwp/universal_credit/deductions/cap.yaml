description: Maximum total deductions from a Universal Credit award, as a fraction of the standard allowance (the Fair Repayment Rate from 30 April 2025). Child maintenance is a last resort deduction and may exceed this cap.
values:
  2015-04-01: 0.4
  2019-10-01: 0.3
  2021-04-01: 0.25
  2025-04-30: 0.15
