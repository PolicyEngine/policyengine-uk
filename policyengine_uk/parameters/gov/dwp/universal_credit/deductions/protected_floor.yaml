description: Protected minimum floor in Universal Credit, as a fraction of the standard allowance. Deductions and benefit cap reductions combined cannot reduce the award below this floor (where the pre-reduction award reaches it). Zero means no floor. JRF's protected minimum floor proposal corresponds to 0.85.
