description: Whether a child or qualifying young person with the adoption or non-parental caring arrangements exception gets the Universal Credit child element whatever their place and is left out of the order of children the limit counts. Before 28 November 2018 these exceptions, like the others, applied only to a third or later child, who kept their place in the order.
