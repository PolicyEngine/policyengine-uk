description: >
  Whether employed earnings under the intermediaries rules take the person out
  of Universal Credit's company owner rule only when they derive from the
  person's main employment. As made, any such earnings did; from 28 November
  2018 only those derived from activities that are the person's main
  employment do.
  Annual simulations use the rule in force at the start of each tax year, so
  the 2018-19 tax year uses the earlier rule throughout.
