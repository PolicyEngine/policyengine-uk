description: Benefits that count as a relevant benefit for the Winter Fuel Payment. A person on one receives the full amount whoever they live with, and the partner of the person paid is not entitled. For the 2024 qualifying week only, a relevant benefit (or a tax credit award of at least £26) was also a condition of entitlement.
values:
  2000-01-01:
    value:
      - is_on_pension_credit
      - is_on_income_based_jsa
      - is_on_income_related_esa
    reference:
      - title: The Social Fund Winter Fuel Payment Regulations 2000, reg. 2(1)(ii) and 3(1)(a)(i) (as in force for the 2023 qualifying week)
        href: https://www.legislation.gov.uk/uksi/2000/729/regulation/2/2023-09-18
  # Dated 1 January so that the year's value is the one for its September
  # qualifying week; SI 2024/869 came into force on 16 September 2024.
  2024-01-01:
    value:
      - is_on_income_support
      - is_on_income_based_jsa
      - is_on_pension_credit
      - is_on_income_related_esa
      - is_on_universal_credit
      - is_on_tax_credits
    reference:
      - title: The Social Fund Winter Fuel Payment Regulations 2024, reg. 2(2)(b) and 2(4) "relevant benefit"
        href: https://www.legislation.gov.uk/uksi/2024/869/regulation/2/made
  # SI 2025/969 came into force on 15 September 2025.
  2025-01-01:
    value:
      - is_on_income_support
      - is_on_income_based_jsa
      - is_on_pension_credit
      - is_on_income_related_esa
      - is_on_universal_credit
    reference:
      - title: The Social Fund Winter Fuel Payment Regulations 2025, reg. 1(3) "relevant benefit"
        href: https://www.legislation.gov.uk/uksi/2025/969/regulation/1/made
