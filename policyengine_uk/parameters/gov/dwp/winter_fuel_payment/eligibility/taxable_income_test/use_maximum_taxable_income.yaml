description: When this is true, households in England or Wales with pensioners earning under the maximum taxable income are eligible for the Winter Fuel Payment. This stands in for the winter fuel payment charge on people with total income over £35,000 (ITEPA 2003 s.681I, from 2025-26).
values:
  2000-01-01: false
  2025-01-01: true
metadata:
  unit: bool
  label: WFA maximum taxable income eligibility
  reference:
