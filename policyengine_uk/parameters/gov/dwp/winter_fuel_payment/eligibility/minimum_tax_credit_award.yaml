description: Smallest award of child tax credit or working tax credit that counts towards the Winter Fuel Payment. Tax credits counted only for the 2024 qualifying week; infinity means they do not count.
values:
  2000-01-01:
    value: .inf
    reference:
      - title: The Social Fund Winter Fuel Payment Regulations 2000, reg. 2(1)(ii) (as in force for the 2023 qualifying week)
        href: https://www.legislation.gov.uk/uksi/2000/729/regulation/2/2023-09-18
  # Dated 1 January so that the year's value is the one for its September
  # qualifying week; SI 2024/869 came into force on 16 September 2024.
  2024-01-01:
    value: 26
    reference:
      - title: The Social Fund Winter Fuel Payment Regulations 2024, reg. 2(2)(b)(ii)
        href: https://www.legislation.gov.uk/uksi/2024/869/regulation/2/made
      - title: The Social Fund Winter Fuel Payment Regulations (Northern Ireland) 2024, reg. 2(2)(b)(ii)
        href: https://www.legislation.gov.uk/nisr/2024/160/regulation/2/made
  2025-01-01:
    value: .inf
    reference:
      - title: The Social Fund Winter Fuel Payment Regulations 2025, reg. 1(3) "relevant benefit"
        href: https://www.legislation.gov.uk/uksi/2025/969/regulation/1/made
metadata:
  unit: currency-GBP
  label: Winter Fuel Payment minimum tax credit award
