description: Winter Fuel Payment for a person aged 80 or over who is not on a relevant benefit and lives with another person entitled to a payment, none of whom has reached 80. The 2024 regulations had no shared amounts; only people on a relevant benefit (or tax credits) were entitled that winter, so this amount does not arise for it.
values:
  2000-01-01: 200
metadata:
  unit: currency-GBP
  label: Winter Fuel Payment shared amount 80 and over, living with under 80
  reference:
