description: Winter Fuel Payment for a person under 80 who is not on a relevant benefit and lives with another person entitled to a payment. The 2024 regulations had no shared amounts; only people on a relevant benefit (or tax credits) were entitled that winter, so this amount does not arise for it.
values:
  2000-01-01: 100
