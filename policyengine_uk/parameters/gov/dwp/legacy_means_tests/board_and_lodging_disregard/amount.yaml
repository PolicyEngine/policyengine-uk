values:
  # Income Support Schedule 9 para. 20 has disregarded £20 and half the
  # excess since 9 April 1990 (SI 1990/547), restated in its current words
  # from 11 April 1994 (SI 1994/527). As made it disregarded £35 of the weekly
  # charge where the claimant was employed in providing board and lodging;
  # that rule is not modelled.
  1990-04-09: 20
