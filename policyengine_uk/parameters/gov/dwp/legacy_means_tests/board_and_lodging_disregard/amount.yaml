description: >
  Weekly amount disregarded in full from the payments a claimant receives for
  board and lodging accommodation provided in their home, for each person
  provided with it. Payments above this amount are disregarded in part (see the
  excess rate). Income Support, income-based Jobseeker's Allowance,
  income-related Employment and Support Allowance, Housing Benefit, Pension
  Credit and the council tax reduction schemes use it.
