description: >
  Weekly amount disregarded from the rent a claimant over the qualifying age
  for State Pension Credit receives from a person who occupies part of a
  property the claimant lives in, under an agreement to pay rent; rent below
  this amount is disregarded in full. Pension Credit and pension-age Housing
  Benefit use it, and the pensioner council tax reduction schemes in England,
  Wales and Scotland copy it. Before Pension Credit began on 6 October 2003
  there was no separate pension-age amount; Income Support, including for
  claimants over 60, disregarded £4 (Schedule 9 paragraph 19 as made).
