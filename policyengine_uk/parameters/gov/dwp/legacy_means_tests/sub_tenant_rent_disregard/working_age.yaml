description: >
  Weekly amount disregarded from the rent a working-age claimant receives from
  a person who occupies part of the claimant's home under a contractual
  liability to pay for it, other than board and lodging; rent below this
  amount is disregarded in full. Income Support, income-based Jobseeker's
  Allowance, income-related Employment and Support Allowance and working-age
  Housing Benefit use it, and the working-age council tax reduction schemes
  in Wales and the English default scheme copy it. Before April 2008 the
  disregard was £4 plus a further amount where the payment included heating;
  the heating amount is not modelled.
