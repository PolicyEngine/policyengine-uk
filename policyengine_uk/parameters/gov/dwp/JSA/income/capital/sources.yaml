description: >
  The formulas count ordinary accessible cash ISAs separately from savings,
  at their cash value, without a generic cash sale-cost deduction.
  Where the data tie a cash ISA or stocks and shares ISA balance to a member,
  the formulas count it through `person_sources` in the holder's own benefit
  unit and subtract it from `cash_isa` or `share_like_capital` before they
  allocate the rest.
  Model variables currently mapped to countable income-based Jobseeker's
  Allowance capital. The Jobseeker's Allowance Regulations 1996 treat capital
  as assessable unless it is disregarded under Schedule 8. The current
  mappings are `savings` for liquid capital, `owned_land` for land held
  directly, the share-like sources, `other_residential_property_value` for
  residential property other than the home, and
  `non_residential_property_value` for other land and premises.
  `share_like_capital` is `corporate_wealth` as supplied, or the sum of its
  itemised components (`directly_held_shares`, `unit_and_investment_trusts`,
  `stocks_and_shares_isa`) where they exceed it beyond float32 rounding (see
  `share_like_capital`), so a household given only the components has them
  counted and no holding counts twice. `main_residence_value` is excluded
  because Schedule 8 paragraph 1 disregards premises occupied as the
  claimant's home. `private_pension_wealth` is excluded because Schedule 8
  paragraphs 28 and 29 disregard the value of the right to receive an
  occupational or personal pension and the value of funds held under a
  personal pension scheme. Other Schedule 8 disregards, the higher
  residential-care capital disregard, and the separate child-capital disregard
  are not yet modeled because the current dataset does not isolate those
  states or asset holdings. For capital whose owner the data do not identify,
  the model allocates the full household remainder to benunits with a
  reported income-based JSA award and falls back to claimant and partner
  shares when nobody in the household reports such an award. That
  allocation is a data approximation, not a legislated ownership rule.
  `overseas_property_value` covers overseas land and property, and
  `other_property_value` covers other real estate with unspecified
  geography and type. These broad household categories cannot identify
  individual beneficial ownership or additional statutory disregards.
  No separate secured-debt input is available for either category.
