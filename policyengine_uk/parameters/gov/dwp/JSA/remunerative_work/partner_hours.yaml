description: Income-based Jobseeker's Allowance treats a claimant's partner as engaged in remunerative work at this many weekly hours of paid work or more. A member of a joint-claim couple whose partner works fewer hours than this, but 16 or more, may claim alone, so this limit decides whether a couple can have an award.
values:
