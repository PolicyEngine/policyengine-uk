description: >
  Benefit-unit awards whose receipt qualifies the benefit unit for the higher
  Pension Credit earnings disregard (Sch. VI para. 4(1)(a)(vii), employment
  and support allowance, from 27 October 2008). The claimant's or partner's
  income-related employment and support allowance is held on the benefit unit
  (claimant_or_partner_esa_income); an award another member of the benefit
  unit claims in their own right does not count. Contributory employment and
  support allowance is a person-level benefit in `disability_benefits`.
