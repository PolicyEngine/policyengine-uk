description: >
  Benefit-unit awards whose receipt qualifies the benefit unit for the higher
  Pension Credit earnings disregard (Sch. VI para. 4(1)(a)(vii), employment
  and support allowance, from 27 October 2008). The model holds income-related
  employment and support allowance on the benefit unit, as the claimant's
  award; contributory employment and support allowance is a person-level
  benefit in `disability_benefits`.
