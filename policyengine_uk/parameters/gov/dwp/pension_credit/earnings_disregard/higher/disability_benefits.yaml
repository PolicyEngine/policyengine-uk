description: >
  Person-level benefits whose receipt by the claimant or partner qualifies the
  benefit unit for the higher Pension Credit earnings disregard (Sch. VI para.
  4(1)(a)). Income-related employment and support allowance, a benefit-unit
  award, is in `disability_benefit_unit_benefits`.
  `incapacity_benefit` stands for long-term incapacity benefit (para.
  4(1)(a)(i)); the model does not separate the short-term rates. Not modelled:
  the war pensions mobility supplement (v), the working tax credit disability
  elements (vi), pension age disability payment (iiia, from 21 October 2024),
  Scottish adult disability living allowance (iva, from 21 March 2025) and
  adult disability payment (viiia, from 21 March 2022), which have no separate
  variables.
