description: Latest date of birth, written as a YYYYMMDD number, of the older member of a mixed-age couple for the couple to keep Pension Credit under the SI 2019/37 article 4 saving. The older member must have reached the qualifying age for State Pension Credit by 14 May 2019; a woman born on or before 5 February 1954 reached it on 6 May 2019, and one born on 6 February 1954 on 6 July 2019 (Pensions Act 1995 Sch 4 para 1, table 2).
values:
