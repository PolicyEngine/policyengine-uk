description: >
  PolicyEngine approximation of Pension Credit capital sources that count
  toward deemed income from capital, excluding the claimant's main home.
  `private_pension_wealth` is excluded because Schedule V paragraphs 22 and 23
  (Part I) disregard the value of the right to receive income from an
  occupational or personal pension scheme or under a retirement annuity
  contract; the notional income rule for undrawn money purchase pots
  (regulation 18) is not modelled. `share_like_capital` is `corporate_wealth`
  as supplied, or the sum of its itemised components (`directly_held_shares`,
  `unit_and_investment_trusts`, `stocks_and_shares_isa`) where that is larger,
  so a household given only the components has them counted and no holding
  counts twice.
