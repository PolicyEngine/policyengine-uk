description: >
  Share of the current market or surrender value deducted from Pension Credit
  capital where there would be expenses attributable to sale. It is a flat 10%
  whatever the actual costs, taken from the gross value before any encumbrance
  secured on the asset is deducted. Before 1 October 2007 the same deduction
  sat in reg. 19(a)(i) alongside a separate valuation for National Savings
  Certificates; SI 2007/2618 substituted the regulation in its current form.
values:
  2003-10-06: 0.1
