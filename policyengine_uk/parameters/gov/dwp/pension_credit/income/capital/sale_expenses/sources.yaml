description: >
  Capital sources whose sale would incur expenses, so that Pension Credit
  values them at 90% of market value. Costs of sale normally arise where an
  agent, broker, auctioneer, solicitor or accountant is needed, and real
  property always has them (DMG 84714), so `owned_land`,
  `other_residential_property_value` and `non_residential_property_value` are
  listed. `savings` is not listed: a bank or building society account is
  valued at its balance, and the costs of withdrawing money are not costs of
  sale (DMG 84712-84715 and 84731). `share_like_capital_with_sale_expenses` is
  listed: the part of share-like capital whose sale incurs expenses, namely
  directly held shares, valued less 10% for selling costs (DMG 84763), and all
  of `corporate_wealth` on datasets that do not itemise it. Unit and
  investment trusts and stocks and shares ISAs are valued without the
  deduction; `gov.dwp.share_like_capital.without_sale_expenses` lists them,
  with the guidance and the approximation for investment trusts, which the
  survey cannot separate from unit trusts. Sources not counted as Pension
  Credit capital are ignored.
