description: >
  Person-level model variables counted as Pension Credit capital of the
  person's own benefit unit. They are summed over the benefit unit's members,
  so they need none of the household proxy that the household `sources` use.
  `lifetime_isa_countable_capital` is a Lifetime ISA at its surrender value:
  regulation 19 values capital at its current market or surrender value, and
  DMG 84751 counts a Lifetime ISA at 75% of its value under 60 and in full
  from 60, so a claimant's own Lifetime ISA counts in full.
