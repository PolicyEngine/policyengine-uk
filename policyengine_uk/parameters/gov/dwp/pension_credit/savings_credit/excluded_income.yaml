    title: The State Pension Credit Regulations 2002 reg. 9
  unit: list
values:
  2002-01-01:
  # Reg. 9(c) and (g).
  - jsa_contrib
  - esa_contrib
  # Reg. 9(a), (b), (d) and (e).
