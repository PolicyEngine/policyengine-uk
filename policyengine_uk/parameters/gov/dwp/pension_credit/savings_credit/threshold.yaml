description: >-
  Income threshold at which Savings Credit is eligible. Values after the last
  enacted rate are derived so that the earnings-projected standard minimum
  guarantee and the CPI-projected maximum Savings Credit remain consistent
  with the statutory 60% formula; they are not enacted future rates. Forecast
  thresholds and protected pension-age Housing Benefit allowances follow the
  reformed guarantee and maximum as uprated, as on main, unless their own
  base-year value is reformed. The live phase-in rate determines the threshold;
  a zero rate keeps the preceding threshold and pays no Savings Credit.
