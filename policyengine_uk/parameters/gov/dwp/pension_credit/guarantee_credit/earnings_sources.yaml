description: >-
  Pension Credit counts these sources as earnings of the claimant and partner.
  Statutory sick, maternity and paternity pay are earnings of an employed earner
  (reg. 17A(2)(h) and (i)), not social security benefits (reg. 15(1)(o) to (q)).
  Statutory adoption, shared parental, parental bereavement and neonatal care
  pay are earnings too (reg. 17A(2)(j), (ib), (ic) and (id)) but have no
  variables, so they are not counted. Employment income must exclude any
  statutory payment entered separately.
