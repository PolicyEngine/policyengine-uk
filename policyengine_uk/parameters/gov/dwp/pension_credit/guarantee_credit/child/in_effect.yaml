description: Whether the Pension Credit minimum guarantee includes the Schedule IIA additional amount for a child or qualifying young person.
values:
  2003-10-06: false
  # SI 2018/676 reg 2(2)(c) and (4) added reg 6(6)(d) and Schedule IIA from
  # 1 February 2019. Before then, support for a pensioner's child came through
  # Child Tax Credit.
  2019-02-01: true
