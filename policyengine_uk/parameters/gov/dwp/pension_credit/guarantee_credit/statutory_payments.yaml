description: >-
  Statutory payments that Pension Credit counts as earnings of an employed
  earner (reg. 17A(2)(h) and (i)), not as social security benefits (reg.
  15(1)(o) to (q)). Statutory adoption, shared parental, parental bereavement
  and neonatal care pay are earnings too (reg. 17A(2)(j), (ib), (ic) and (id))
  but have no variables, so they are not listed. Employment income must
  exclude any statutory payment entered separately.
metadata:
  label: Pension Credit statutory payments counted as earnings
  reference:
  - title: The State Pension Credit Regulations 2002 reg. 17A(2)(h) to (j)
    href: https://www.legislation.gov.uk/uksi/2002/1792/regulation/17A
  - title: The State Pension Credit Regulations 2002 reg. 15(1)(o) to (r)
    href: https://www.legislation.gov.uk/uksi/2002/1792/regulation/15
  unit: list
