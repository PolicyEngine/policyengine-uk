description: Income sources included in income used to determine Pension Credit entitlement.
metadata:
  label: Pension Credit income sources
  propagate_metadata_to_children: true
  reference:
  - href: https://www.legislation.gov.uk/ukpga/2002/16/section/15
    title: State Pension Credit Act 2002 s. 15(1)
  - href: https://www.legislation.gov.uk/uksi/2002/1792/regulation/15
    title: State Pension Credit Regulations 2002 reg. 15
  - href: https://www.legislation.gov.uk/uksi/2026/246/article/17/made
    title: SI 2026/246 art. 17 (Scottish Carer Supplement excepted from reg. 15(1))
  - href: https://www.legislation.gov.uk/uksi/2002/1792/schedule/IV/paragraph/18
    title: State Pension Credit Regulations 2002 Schedule IV para. 18 (actual income from capital disregarded)
  unit: list
values:
  2002-01-01:
  - pension_credit_earnings
  - working_tax_credit
  - state_pension
  - private_pension_income
  # Rent from other property is actual income from capital, disregarded by
  # Schedule IV para. 18; the property counts through deemed income. Rent for
  # part of the claimant's home is reg. 15(5)(i) income, less the Schedule IV
  # para. 9 disregard.
  - legacy_benefits_home_letting_income
  - pension_credit_deemed_income
  - esa_contrib
  - jsa_contrib
  # Reg. 15(1) prescribes all social security benefits except those it lists;
  # neither of these is listed. carer_support_payment is the Carer Support
  # Payment component only: reg. 15(1)(ri) excepts the Scottish Carer
  # Supplement, which is a separate variable.
  - carers_allowance
  - carer_support_payment
