description: >
  Capital sources included in the Income Support capital test.
  `private_pension_wealth` is excluded because Schedule 10 paragraphs 23 and
  23A disregard the value of the right to receive an occupational or personal
  pension and the value of funds held under a personal pension scheme.
  `directly_held_shares`, `unit_and_investment_trusts` and `stocks_and_shares_isa` hold the share-like assets the means tests value separately, and `unitemised_corporate_wealth` holds any part of `corporate_wealth` a dataset does not itemise into them: all of it on datasets without the components, and nil on datasets that build `corporate_wealth` as their exact sum. `corporate_wealth` itself is not listed, so no holding counts twice.
