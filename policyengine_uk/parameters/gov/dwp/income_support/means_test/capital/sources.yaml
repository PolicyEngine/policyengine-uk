description: >
  Ordinary cash ISA balances are separate from savings and are included at
  their accessible cash value, without a generic cash sale-cost deduction.
  Capital sources included in the Income Support capital test.
  `private_pension_wealth` is excluded because Schedule 10 paragraphs 23 and
  23A disregard the value of the right to receive an occupational or personal
  pension and the value of funds held under a personal pension scheme.
  `share_like_capital` is `corporate_wealth` as supplied, or the sum of its
  itemised components (`directly_held_shares`, `unit_and_investment_trusts`,
  `stocks_and_shares_isa`) where they exceed it beyond float32 rounding (see
  `share_like_capital`), so a household given only the components has them
  counted and no holding counts twice.
