description: >
  Whether a fraction of a penny in an Income Support capital calculation is
  disregarded (true) rather than rounded to the nearest penny (false). A
  fraction of a penny is treated as a penny only where that is to the
  claimant's advantage, and is otherwise disregarded; for capital that means
  rounding down. The Northern Ireland regulation disregards any fraction of
  a penny in capital.
values:
  2010-01-01: true
metadata:
  label: Income Support capital rounded down to the penny
  period: year
  unit: bool
  reference:
    - title: The Income Support (General) Regulations 1987 reg. 27
      href: https://www.legislation.gov.uk/uksi/1987/1967/regulation/27
    - title: The Income Support (General) Regulations (Northern Ireland) 1987 reg. 27
      href: https://www.legislation.gov.uk/nisr/1987/459/regulation/27
