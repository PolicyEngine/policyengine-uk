description: The following amount is provided for individuals under the Housing Benefit non-dependent deduction, based on normal weekly gross income.

# Bands and amounts from DWP Benefit and pension rates (gov.uk) for each year,
# as set in the Housing Benefit Regulations 2006 reg 74 by each year's
# Social Security Benefits Up-rating Order (bands unchanged in 2021-22: SI
# 2021/162 art 24(3)).
# Deduction amounts rise by September CPI. Income bands follow earnings in
# practice; retain their previous lagged calendar-year CPI projection as a
# placeholder until the earnings-linked uprating model covers them.
# SI 2018/281 art 1(2)(h): the 2018 rates commence on 2 April for
# weekly rents (1 April for other rent periods). This weekly scale uses
# 2 April; both dates precede the fiscal-year sample at 30 April.
