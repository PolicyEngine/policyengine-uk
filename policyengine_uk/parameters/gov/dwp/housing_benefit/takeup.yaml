description: Share of eligible Housing Benefit recipients that participate. Not used by
  the model. Data-built simulations default to positive reported Housing Benefit claims
  only (d1455 following d1390). Hand-entered households use positive reported Housing
  Benefit or their per-benefit-unit claims_all_entitled_benefits flag. Direct take-up
  inputs override either default. Pension-age families can make new claims;
  working-age families only continue existing awards.
