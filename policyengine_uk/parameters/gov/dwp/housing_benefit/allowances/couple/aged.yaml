description: Personal allowance for Housing Benefit for a couple where one or both members attained State Pension age before 1 April 2021 (and, before that date, every couple with a member over State Pension age).
values:
  # 2020-21 to 2026-27: DWP Benefit and pension rates (gov.uk), each
  # year's rate as listed in that year's publication.
  2015-04-01: 270.6
  2020-04-01: 280.85
  2021-04-01: 286.05
  2022-04-06: 294.9
  2023-04-01: 324.7
  2024-04-01: 352
  2025-04-01: 366
  2026-04-01: 383.35

metadata:
  period: week
  unit: currency-GBP
  label: Housing Benefit couple pension-age personal allowance
  # Not uprated by September CPI: the pension-age personal allowances rose 4.75%
  # in April 2026 (£244.40 to £256.00 single), when September CPI was 3.8%, and
  # 2.3% in April 2017, when it was 1.0% (Benefit and pension rates 2026 to
  # 2027, 2017 to 2018). Keeps the lagged calendar-year CPI projection it had
  # through gov.benefit_uprating_cpi until its own basis is modelled.
  uprating: gov.economic_assumptions.indices.obr.lagged_cpi
