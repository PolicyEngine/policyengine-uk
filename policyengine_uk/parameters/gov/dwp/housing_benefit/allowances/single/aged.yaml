metadata:
  period: week
  unit: currency-GBP
  label: Housing Benefit single pension-age personal allowance
  # Not uprated by September CPI: the pension-age personal allowances rose 4.75%
  # in April 2026 (£244.40 to £256.00 single), when September CPI was 3.8%, and
  # 2.3% in April 2017, when it was 1.0% (Benefit and pension rates 2026 to
  # 2027, 2017 to 2018). Keeps the lagged calendar-year CPI projection it had
  # through gov.benefit_uprating_cpi until its own basis is modelled.
  uprating: gov.economic_assumptions.indices.obr.lagged_cpi
  reference:
    - title: The Housing Benefit (Persons who have attained the qualifying age for state pension credit) Regulations 2006 (SI 2006/214), Schedule 3, paragraph 1(1)(b)
      href: https://www.legislation.gov.uk/uksi/2006/214/schedule/3
    - title: The Housing Benefit (Persons who have attained the qualifying age for state pension credit) Regulations (Northern Ireland) 2006 (SR 2006/406), Schedule 4, paragraph 1 (the same amounts)
      href: https://www.legislation.gov.uk/nisr/2006/406/schedule/4
    - title: Benefit and pension rates 2024 to 2025 - Policy paper
      href: https://www.gov.uk/government/publications/benefit-and-pension-rates-2024-to-2025/benefit-and-pension-rates-2024-to-2025
    - title: Benefit and pension rates 2020 to 2021 (DWP, gov.uk)
      href: https://www.gov.uk/government/publications/benefit-and-pension-rates-2020-to-2021/benefit-and-pension-rates-2020-to-2021
    - title: Benefit and pension rates 2025 to 2026 (DWP, gov.uk)
      href: https://www.gov.uk/government/publications/benefit-and-pension-rates-2025-to-2026/benefit-and-pension-rates-2025-to-2026
    - title: Benefit and pension rates 2026 to 2027 (DWP, gov.uk)
      href: https://www.gov.uk/government/publications/benefit-and-pension-rates-2026-to-2027/proposed-benefit-and-pension-rates-2026-to-2027
    - title: The Social Security Benefits Up-rating Order 2025 (SI 2025/295)
      href: https://www.legislation.gov.uk/uksi/2025/295/contents/made
    - title: The Social Security Benefits Up-rating Order 2026 (SI 2026/148)
