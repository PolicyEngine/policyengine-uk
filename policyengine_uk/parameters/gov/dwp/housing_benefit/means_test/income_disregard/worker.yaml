description: Housing Benefit increases the earnings disregard by this weekly amount (the additional earnings disregard) where the claimant meets one of its work conditions and their net earnings at least equal the other earnings disregards, the deductible childcare charges and this amount.
values:
  2010-04-01: 17.1
  # The Social Security (Coronavirus) (Further Measures) Regulations 2020
  # reg. 5 (NI: S.R. 2020/53 reg. 5) read £37.10 for £17.10 from 6 April 2020
  # until the end of 4 April 2021.
  2020-04-06: 37.1
  2021-04-05: 17.1
