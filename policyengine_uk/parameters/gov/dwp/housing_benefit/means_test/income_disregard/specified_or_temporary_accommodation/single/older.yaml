description: Housing Benefit disregards this much of the weekly net earnings of a single claimant (no partner, not a lone parent) who has reached the older age threshold, where the claimant lives in specified or temporary accommodation and the claimant or partner is an employed or self-employed earner.
values:
  # Schedule 4 paragraph 18 (NI: Schedule 5 paragraph 18) has effect from 5
  # October 2026: SI 2026/753 reg. 2(4), as substituted by SI 2026/978 reg.
  # 2(2), and NI SR 2026/157 reg. 2(4). There was no such disregard before.
  # Neither instrument uprates the sums. Preserve the legal date so awards
  # can be calculated separately before/after commencement, including the
  # earnings cap and additional-disregard test, then combined over the year.
  2006-03-06: 0
  2026-10-05: 77.73
metadata:
  preserve_calendar_dates: true
  period: week
  unit: currency-GBP
  label: Housing benefit specified or temporary accommodation earnings disregard, single claimant aged 25 or over
