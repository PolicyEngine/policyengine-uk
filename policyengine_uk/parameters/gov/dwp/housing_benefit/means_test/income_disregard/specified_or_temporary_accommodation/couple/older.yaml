description: Housing Benefit disregards this much of the weekly net earnings of a couple one of whom has reached the older age threshold, where the claimant lives in specified or temporary accommodation and the claimant or partner is an employed or self-employed earner.
values:
  # Schedule 4 paragraph 18 (NI: Schedule 5 paragraph 18) has effect from 5
  # October 2026: SI 2026/753 reg. 2(4), as substituted by SI 2026/978 reg.
  # 2(2), and NI SR 2026/157 reg. 2(4). There was no such disregard before.
  # Neither instrument uprates the sums. The model reads each fiscal year at
  # 30 April, so 2026 (2026-27) has no paragraph 18 disregard although it
  # applied from 5 October 2026 (183 of the year's 365 days); 2027 onwards
  # has the full amounts. fiscal_year_blend is not used: half of an amount
  # for the whole year is not the full amount for half the year, because
  # the disregard is capped at net earnings and counts in the £17.10 test.
  2006-03-06: 0
  2026-10-05: 119.7
