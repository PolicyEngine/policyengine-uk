description: >
  Share of the current market or surrender value deducted from Housing Benefit
  capital where there would be expenses attributable to sale. It is a flat 10%
  whatever the actual costs, taken from the gross value before any encumbrance
  secured on the asset is deducted. Before 1 October 2007 the same deduction
  sat in reg. 47(a)(i) (reg. 45(a)(i) at pension age) alongside a separate
  valuation for National Savings Certificates; SI 2007/2618 substituted the
  regulation in its current form.
values:
  2006-04-10: 0.1
