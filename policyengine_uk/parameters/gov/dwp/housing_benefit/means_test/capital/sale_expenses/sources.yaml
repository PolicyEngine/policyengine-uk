description: >
  Capital sources whose sale would incur expenses, so that Housing Benefit
  values them at 90% of market value. Land and property always have costs of
  sale. Shares are sold through a broker, so `corporate_wealth` is listed; it
  also holds unit trusts, which have no costs of sale, but the dataset does
  not separate them. `savings` is not listed because a bank or building
  society account is valued at its balance and withdrawing money is not a sale
  (HBGM W1.430, W1.530-W1.531, P1.430 and P1.530-P1.531). Sources not counted
  as Housing Benefit capital are ignored.
metadata:
