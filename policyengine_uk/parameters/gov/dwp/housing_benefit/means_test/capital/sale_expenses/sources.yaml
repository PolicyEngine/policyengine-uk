description: >
  Capital sources whose sale would incur expenses, so that Housing Benefit
  values them at 90% of market value. Costs of sale normally arise where an
  agent, broker, auctioneer, solicitor or accountant is needed, and real
  property always has them (R(IS) 21/93, as DMG 29622 applies it; HBGM W1.430
  states the general 10% rule), so `owned_land`,
  `other_residential_property_value` and `non_residential_property_value` are
  listed. `savings` is not listed: a bank or building society account is
  valued at its balance, and the costs of withdrawing money are not costs of
  sale (HBGM BW1 Annex F and BP1 F2.03). `directly_held_shares` is listed
  because shares are valued less 10% for selling costs (HBGM W1.513 and
  P1.513). `unit_and_investment_trusts` is deliberately not listed: unit trust
  holdings are valued at the bid price, which already takes account of the
  selling expenses, and the 10% is not deducted even if they could be sold
  through a bank or stockbroker (HBGM W1.530-W1.531 and P1.530-P1.531).
  Investment trusts are not named in the guidance and, as listed company
  shares, arguably take the 10%, but the Wealth and Assets Survey asks about
  unit and investment trusts in one question, so the whole bucket is treated
  as having no costs of sale. That approximation counts investment trusts at
  full value; HMRC ISA statistics (table 9.6) put investment trusts at about 7%
  to 8% of the pooled funds held in stocks and shares ISAs (8.2% at 5 April
  2022, 6.9% at 5 April 2025). `stocks_and_shares_isa` is deliberately not listed either: the HB
  guidance manual has no ISA paragraph, and the DWP guidance on the parallel
  Income Support and JSA rule values an ISA at what the person would get by
  withdrawing it, with no ISA paragraph applying the 10% (DMG 29662-29664).
  `unitemised_corporate_wealth` is listed so that datasets which do not
  itemise `corporate_wealth` keep its previous flat treatment: there it equals
  `corporate_wealth`, which mixes shares with unit trusts, stocks and shares
  ISAs and employee share options, and, on datasets built before private
  pension wealth was split out, non-defined-benefit pension wealth, which is
  not capital at all. The deduction reaches all of these until the data
  separate them. Sources not counted as Housing Benefit capital are ignored.
