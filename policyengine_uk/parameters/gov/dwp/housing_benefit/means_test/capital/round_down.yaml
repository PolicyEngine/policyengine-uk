description: >
  Whether a fraction of a penny in a Housing Benefit capital calculation is
  disregarded (true) rather than rounded to the nearest penny (false). Any
  amount determined under the regulations may, if appropriate, be rounded to
  the nearest whole penny, disregarding less than half a penny and treating
  half a penny or more as a penny. That is the regulations' only rounding
  rule, and the model applies it.
values:
  2006-04-10: false
metadata:
  label: Housing Benefit capital rounded down to the penny
