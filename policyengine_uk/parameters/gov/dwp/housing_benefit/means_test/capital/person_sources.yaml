description: >
  Person-level model variables counted as Housing Benefit capital of the
  person's own benefit unit. They are summed over the benefit unit's claimant
  and partner (`is_claimant_or_partner`), so they need none of the household
  proxy that the household `sources` use, and a dependant's holding is left
  out: regulation 45 says the capital of a child or young person in the
  claimant's family is not the claimant's. `lifetime_isa_countable_capital` is
  a Lifetime ISA at its surrender value: regulation 47 (regulation 45 of the
  pension-age regulations) values capital at its current market or surrender
  value, in the words of the DWP benefits' regulations, for which DWP guidance
  counts a Lifetime ISA at 75% of its value under 60 and in full from 60.
  Lifetime ISAs exist from 6 April 2017, and the list counts them from then.
  `cash_isa_countable_capital` and `stocks_and_shares_isa_countable_capital`
  are a member's cash and stocks and shares ISA balances. An ISA has one
  holder, who owns its investments beneficially (Individual Savings Account
  Regulations 1998 reg. 4(1B)(c) and (6)(a)), and a child holds their own
  junior ISA (reg. 2B). Each counts only while `sources` lists the household
  source that already holds it (`cash_isa`, `share_like_capital`), and the
  household pool then leaves it out of that source, so it counts once, in its
  holder's own benefit unit, and a list without the household source counts
  neither. Household data with no balances keep the whole household total in
  the pool. ISAs exist from 6 April 1999 (reg. 1).
