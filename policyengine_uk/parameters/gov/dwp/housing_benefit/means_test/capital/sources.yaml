description: >
  Model variables currently mapped to countable Housing Benefit capital.
  The Housing Benefit Regulations 2006 treat the whole of a claimant's capital
  as assessable unless it is disregarded under Schedule 6. The current mappings
  are `savings` for liquid capital, `owned_land` for land held directly,
  the share-like sources,
  `other_residential_property_value` for residential property other than the
  home, and `non_residential_property_value` for other land and premises. `directly_held_shares`, `unit_and_investment_trusts` and `stocks_and_shares_isa` hold the share-like assets the means tests value separately, and `unitemised_corporate_wealth` holds any part of `corporate_wealth` a dataset does not itemise into them: all of it on datasets without the components, and nil on datasets that build `corporate_wealth` as their exact sum. `corporate_wealth` itself is not listed, so no holding counts twice.
  `main_residence_value` is excluded because Schedule 6 paragraph 1 disregards
  premises occupied as the claimant's home. `private_pension_wealth` is
  excluded because Schedule 6 paragraphs 31 and 32 disregard the value of the
  right to receive an occupational or personal pension and the value of funds
  held under a personal pension scheme (paragraph 24 of Schedule 6 to the
  pension-age regulations and paragraphs 32 and 33 of Schedule 7 to the
  Northern Ireland regulations make the same disregard). Datasets built before
  private pension wealth was split out of `corporate_wealth` still carry it
  inside `unitemised_corporate_wealth`. Other Schedule 6 disregards within these broad
  asset classes are not yet split out separately. Because the
  dataset only provides household-level capital stocks, the model allocates
  them across benunits using an adult-share proxy.
