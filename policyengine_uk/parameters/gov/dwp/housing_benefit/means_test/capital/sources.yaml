description: >
  Model variables currently mapped to countable Housing Benefit capital. The
  Housing Benefit Regulations 2006 treat the whole of a claimant's capital as
  assessable unless it is disregarded under Schedule 6. The current mappings
  are `savings` for liquid capital, `owned_land` for land held directly, the
  share-like sources, `other_residential_property_value` for residential
  property other than the home, and `non_residential_property_value` for other
  land and premises. `share_like_capital_with_sale_expenses` and `share_like_capital_without_sale_expenses` split `share_like_capital`, which is `corporate_wealth` as supplied,
  or the sum of its itemised components (`directly_held_shares`,
  `unit_and_investment_trusts`, `stocks_and_shares_isa`) where they exceed it
  beyond float32 rounding (see `share_like_capital`), so a household given
  only the components has them counted and no holding counts twice.
  `main_residence_value` is excluded because Schedule 6 paragraph 1 disregards
  premises occupied as the claimant's home (paragraph 26 of Schedule 6 to the
  pension-age regulations). `private_pension_wealth` is excluded because
  Schedule 6 paragraphs 31 and 32 disregard the value of the right to receive
  an occupational or personal pension and the value of funds held under a
  personal pension scheme (paragraph 24 of Schedule 6 to the pension-age
  regulations and paragraphs 32 and 33 of Schedule 7 to the Northern Ireland
  regulations make the same disregard). Datasets built before private pension
  wealth was split out of `corporate_wealth` still carry it inside
  `share_like_capital`. Other Schedule 6 disregards within these broad asset
  classes are not yet split out separately. Because the dataset only provides
  household-level capital stocks, the model allocates them across benunits
  using an adult-share proxy.
