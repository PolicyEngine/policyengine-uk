description: Addition to the Child Tax Credit family element where any child is under the age of one year.
values:
  # CTC Regs 2002 reg 7(3) as made: the family element was £1,090 "in a case
  # where any of the children referred to in paragraph (2)(b) above is under the
  # age of one year" and £545 "in any other case", so the addition is £545.
  # SI 2011/1035 reg 2(2) replaced reg 7(3) with a single £545 from 6 April 2011.
  2003-04-06: 545
  2011-04-06: 0
metadata:
