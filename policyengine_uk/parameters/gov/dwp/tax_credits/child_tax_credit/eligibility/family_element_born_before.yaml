description: The Child Tax Credit family element is included only where the claimant is responsible for a child or qualifying young person born before this date, written as a YYYYMMDD number.
values:
  # In force from 6 April 2017: Tax Credits Act 2002 s.9(2)(a) as amended by the
  # Welfare Reform and Work Act 2016 s.13(2)(a), and CTC Regs 2002 reg 7(2)(a) as
  # amended by SI 2017/387 reg 4(b). Every child or qualifying young person in an
  # earlier tax year was born before this date, so it changes nothing before
  # 2017-18.
  0001-01-01: 20170406
