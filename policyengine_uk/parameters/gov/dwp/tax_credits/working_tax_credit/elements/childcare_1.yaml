      href: https://www.legislation.gov.uk/uksi/2002/2005/regulation/20
    - title: The Housing Benefit Regulations 2006, regulation 27(3)(a) (the same limit for Housing Benefit)
      href: https://www.legislation.gov.uk/uksi/2006/213/regulation/27
    - title: The Social Security Benefits Up-rating Order 2025 (SI 2025/295), article 23(2) (£175 remains unchanged)
      href: https://www.legislation.gov.uk/uksi/2025/295/article/23/made
    - title: The Social Security Benefits Up-rating Order 2026 (SI 2026/148), article 23(2) (£175 remains unchanged)
      href: https://www.legislation.gov.uk/uksi/2026/148/article/23/made
