description: Working Tax Credit childcare element for one child.
values:
  # A fixed weekly limit, not uprated: each year's Up-rating Order leaves the
  # Housing Benefit limit (HB Regs reg 27(3)) at £175, and it applied to the
  # Working Tax Credit childcare element until tax credits ended in April 2025.
  2002-08-01: 135
  2005-04-06: 175
metadata:
  period: week
  label: Working Tax Credit childcare element one child amount
  unit: currency-GBP
  reference:
