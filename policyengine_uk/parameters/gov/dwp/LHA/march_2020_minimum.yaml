description: While this parameter is true, a newly determined Local Housing Allowance rate cannot fall below the rate determined on 31 March 2020 for the same Broad Rental Market Area and category. The minimum applies to determinations made from 31 January 2024, so it first affects the April 2024 rates.
values:
  2015-01-01: false
  2024-01-31:
    value: true
