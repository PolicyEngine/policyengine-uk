description: Disability benefits a member of a couple must receive to be a member of a couple who cannot share a bedroom in the LHA size criteria. Attendance allowance counted only at the higher rate until 27 January 2025. The law also lists the Scottish devolved equivalents (child disability payment, adult disability payment, Scottish adult disability living allowance, pension age disability payment), which the model has no variables for.
values:
  2017-04-01:
    - receives_higher_rate_attendance_allowance
    - armed_forces_independence_payment
    - dla_sc_middle_plus
    - pip_dl
  2025-01-27:
    - attendance_allowance
    - armed_forces_independence_payment
    - dla_sc_middle_plus
    - pip_dl
