description: Disability benefits whose receipt makes a renter under 35 an excepted person, so DWP does not apply the Universal Credit shared accommodation rate. For attendance allowance the model reads uc_receives_attendance_allowance, which counts armed forces independence payment. The model has no variables for the three Scottish heads of paragraph 29(5).
values:
  2013-04-29:
    - uc_receives_attendance_allowance
    - dla_sc_middle_plus
    - pip_dl
metadata:
  unit: list
  label: Universal Credit shared accommodation rate disability exceptions
  reference:
    - title: Universal Credit Regulations 2013 Sch 4 para 29(5)
      href: https://www.legislation.gov.uk/uksi/2013/376/schedule/4/paragraph/29
    - title: Universal Credit Regulations 2013 reg 2 ("attendance allowance" includes armed forces independence payment)
      href: https://www.legislation.gov.uk/uksi/2013/376/regulation/2
