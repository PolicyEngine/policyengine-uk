description: >
  Benefits whose receipt makes a person severely disabled for Carer's
  Allowance, so that a carer benefit may be paid for caring for them:
  attendance allowance, the care component of disability living allowance at
  the highest or middle rate, the daily living component of personal
  independence payment and armed forces independence payment. The Scottish
  equivalents are not separate model variables, and the constant attendance
  allowances prescribed by regulation 3 of the Invalid Care Allowance
  Regulations are not modelled.
metadata:
