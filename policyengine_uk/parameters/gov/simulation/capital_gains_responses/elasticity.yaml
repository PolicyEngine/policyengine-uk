description: Elasticity of capital gains realisations with respect to the capital gains retention rate, the share of a marginal pound of gains kept after tax. A reform scales each person's realised gains by ((1 - t1) / (1 - t0)) to the power of this elasticity, where t0 and t1 are their baseline and reform marginal rates on gains, both measured at their gains before any response. PolicyEngine's central assumption is 1.0, the value Advani, Lonsdale and Summers (2024) use for the medium-term (five-year) effect of their reform package, with 0.5 and 2.0, the range they consider, as sensitivities. They reach 1.0 from a starting point of about 1.5 by adjusting for their package's base changes (removing the uplift at death, charging gains on emigration) and for income no longer shifted into gains, and expect a reform without those base changes to have a higher elasticity, and so lower revenue. So for a reform to rates alone, where PolicyEngine also adds no income tax back, their reasoning points to a value above 1.0, and the default overstates what a rate rise raises. Responses soon after a reform can be larger still, so a first-year score is likely to understate the response. Adopting 1.0 does not reproduce their revenue estimates. The value applies in every period; its start date is the start of the model's timeline, not a change in law. For a static costing, set this and mtr_elasticity to 0, with separate_badr_elasticity false.
values:
  2000-01-01: 1.0
