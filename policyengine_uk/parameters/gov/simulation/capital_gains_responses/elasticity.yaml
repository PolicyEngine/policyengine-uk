description: Elasticity of capital gains realisations with respect to the capital gains retention rate, the share of a marginal pound of gains kept after tax. A reform scales each person's realised gains by ((1 - t1) / (1 - t0)) to the power of this elasticity, where t0 and t1 are their baseline and reform marginal rates on gains, both measured at their gains before any response. PolicyEngine's central assumption is 1.0, the value Advani, Lonsdale and Summers (2024) use for the medium term, with 0.5 and 2.0, the range they consider, as sensitivities. Their 1.0 is for a package that also reforms the base, removing the uplift at death, and includes an adjustment for shifting between tax bases, so it is a modelling assumption rather than an estimate for every reform to rates alone, and adopting it does not reproduce their revenue estimates. The value applies in every period; its start date is the start of the model's timeline, not a change in law. For a static costing, set this and mtr_elasticity to 0, with separate_badr_elasticity false.
values:
  2000-01-01: 1.0
