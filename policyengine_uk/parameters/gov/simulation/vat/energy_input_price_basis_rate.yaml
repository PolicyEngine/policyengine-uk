description: VAT rate included in the prices used to value the electricity_consumption and gas_consumption inputs. Energy-bill VAT is charged on those inputs net of this rate, so the VAT-exclusive base stays fixed when a reform changes a statutory VAT rate. This describes the input data, not policy; change it only if the inputs are repriced on a different VAT basis.
metadata:
  unit: /1
  period: year
  economy: false
  label: VAT rate included in energy input prices
  derivation: >-
    policyengine-uk has no default dataset, so the price basis of the
    electricity and gas inputs belongs to the data build. Both builds price
    them including VAT at 5%. Microcosm UK values them at DESNZ Quarterly
    Energy Prices average domestic prices paid including fixed costs (standard
    electricity table 2.2.4 and gas table 2.3.4, all payment methods, FY2024-25
    in the 2024-25 release). The legacy Enhanced FRS (policyengine-uk-data)
    values NEED kWh at Ofgem Q2 2026 price cap unit rates, which include VAT.
    The VAT-exclusive base is therefore the input divided by 1.05 on either
    build. Reading the statutory reduced rate here instead would make a
    reform to that rate reprice the inputs (PolicyEngine/policyengine-uk#2189,
    review finding C1).
  reference:
    - title: DESNZ, Annual domestic energy price statistics (Quarterly Energy Prices tables 2.2.4 and 2.3.4, prices include VAT)
      href: https://www.gov.uk/government/statistical-data-sets/annual-domestic-energy-price-statistics
    - title: VAT Act 1994, Schedule 7A, Group 1 (reduced rate on domestic fuel and power)
      href: https://www.legislation.gov.uk/ukpga/1994/23/schedule/7A
values:
  2000-01-01: 0.05
