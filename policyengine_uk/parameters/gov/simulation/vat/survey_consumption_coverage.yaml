description: Share of household VAT liability captured by consumption in the microdata. Household VAT computed from survey consumption is divided by this share and by the household share of VAT liabilities to match receipts.
metadata:
  unit: /1
  period: year
  economy: false
  derivation: >-
    Pre-scaling VAT (standard rate times full_rate_vat_consumption plus reduced
    rate times reduced_rate_vat_consumption) on the certified Microcosm UK
    2024-25 national release (policyengine/populace-uk-private, revision
    f9d1922c) is £80.5bn in 2024. OBR VAT receipts for 2024-25 (outturn, March
    2026 EFO table 3.8) are £171.0bn. 80.5 / 171.0 = 0.471 for the product of
    the two factors; divided by the household share of 0.7 gives 0.67. The
    HMRC ready reckoner gives a consistent level: £8.8bn for one percentage
    point on the standard rate in 2026-27 implies a product of 0.48 on the same
    data. On Enhanced FRS 2024-25 the same calculation gives 0.65, so this
    value overstates VAT on that dataset by about 38%. Re-derive when the
    default dataset changes, with docs/engineering/vat-coverage.md.
  reference:
    - title: OBR, Economic and fiscal outlook March 2026, detailed forecast tables, receipts, table 3.8
      href: https://obr.uk/efo/economic-and-fiscal-outlook-march-2026/
    - title: HMRC, Direct effects of illustrative tax changes bulletin (June 2025)
      href: https://www.gov.uk/government/statistics/direct-effects-of-illustrative-tax-changes/direct-effects-of-illustrative-tax-changes-bulletin-january-2025
values:
  2010-01-01: 0.67
