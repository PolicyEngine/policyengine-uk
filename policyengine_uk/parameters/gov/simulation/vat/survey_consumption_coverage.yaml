description: Share of household VAT liability captured by consumption in the microdata. Household VAT computed from survey consumption is divided by this share and by the household share of VAT liabilities to match receipts.
metadata:
  unit: /1
  period: year
  economy: false
  derivation: >-
    Calibrated to the certified Microcosm UK 2024-25 national release only
    (policyengine/populace-uk-private, tag
    microcosm-uk-2024-25-national-20261002T230158Z-5c6b3f68, revision
    f9d1922c). Pre-scaling VAT (standard rate times full_rate_vat_consumption
    plus reduced rate times reduced_rate_vat_consumption) on that release is
    0.20 x £396.15bn + 0.05 x £25.02bn = £80.48bn in 2024. OBR VAT receipts
    for 2024-25 (outturn, March 2026 EFO table 3.8, cash basis) are £170.994bn.
    80.48 / 170.994 = 0.471 for the product of the two factors; divided by the
    household share of 0.7 gives 0.67. Across 2024-25 to 2026-27 the product is
    0.459 to 0.471, and the HMRC ready reckoner (£8.8bn for one point on the
    standard rate in 2026-27) implies 0.481, so the coverage lies between 0.655
    and 0.688. On Enhanced FRS 2024-25 the same calculation gives a coverage of
    0.927 (policyengine-uk-data 1.56.16) or 0.967 (1.58.0), so this value puts
    VAT on that dataset 38% or 44% above 2024-25 receipts. Re-derive when the
    dataset it should match changes, with docs/engineering/vat-coverage.md,
    which lists the inputs, file hashes and per-dataset results.
  reference:
    - title: OBR, Economic and fiscal outlook March 2026, detailed forecast tables, receipts, table 3.8
      href: https://obr.uk/efo/economic-and-fiscal-outlook-march-2026/
    - title: HMRC, Direct effects of illustrative tax changes bulletin (June 2025)
      href: https://www.gov.uk/government/statistics/direct-effects-of-illustrative-tax-changes/direct-effects-of-illustrative-tax-changes-bulletin-january-2025
values:
  2010-01-01: 0.67
