description: First calendar year supported by the model's price index for real incomes after housing costs.
values:
  0000-01-01: 2022
metadata:
  unit: year
  period: year
  economy: false
  label: First modeled year for after housing costs prices
  documentation: |
    The model stores after housing costs price growth from 2022. Comparisons
    using either an earlier base year or an earlier income year use ordinary
    Consumer Price Index values on both dates. The official ONS exclusion
    series extends back to 1996; this setting records the model's coverage,
    not the official series' first year or a legal commencement date.
