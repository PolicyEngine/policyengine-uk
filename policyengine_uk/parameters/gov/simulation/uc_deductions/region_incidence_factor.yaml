description: Regional deduction incidence relative to the national rate. Derived from all 633 constituency rows of Table 6 of the DWP deductions supplementary tables (February 2026), with region labels forward-filled from the table's first-row-per-region layout; each region's share is the household-weighted mean (deducting households divided by implied UC households, from counts and rounded proportions), divided by the national share computed the same way (0.464). Observed February 2026 and applied to all model years as a constancy assumption. Unknown region and Northern Ireland (administered separately, absent from the GB statistics) use the national rate by assumption.
