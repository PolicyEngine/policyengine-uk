description: >-
  Pension input amount in each previous tax year as a share of this year's,
  after average earnings growth, used to estimate unused annual allowance
  carried forward where data has no pension history. The estimate looks back
  five years: the three whose unused allowance is carried forward and the two
  before them, whose unused allowance an excess in those three uses first.
# Finance Act 2004 s. 228A carries forward the annual allowance that the
# pension input amount left unused in each of the three previous tax years in
# which the individual was a member of a registered pension scheme, earliest
# year first. Surveys record this year's contributions only. With a ratio of
# 1, each previous year's input is this year's deflated by average earnings
# growth, as for a member saving the same share of pay each year, and the
# income tested for that year's taper is deflated the same way. A ratio of 0
# assumes no input in those years, the most allowance there could be to
# carry forward. HMRC publishes no count of carry-forward use: Self Assessment
# reports only the excess over the allowance once it is applied. So 1 is a
# convention, not an estimate from statistics. With smooth earnings growth it
# leaves almost nothing to carry forward for anyone over this year's
# allowance, while real excesses are often lumpy (a defined-benefit promotion,
# a one-off contribution), so it probably understates carry forward.
values:
  2004-04-06: 1
