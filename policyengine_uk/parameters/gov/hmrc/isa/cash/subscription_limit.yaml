description: >
  Limit on a person's subscriptions in the tax year to cash ISAs while they are
  under the cash ISA full limit age at the end of the year. Cash has had no
  limit of its own since 1 July 2014, so cash subscriptions count only towards
  the annual subscription limit. SI 2026/1018 regulation 6 sets £12,000 from 6
  April 2027 for people aged 64 or under, but Budget 2026 retains the £20,000
  limit for all savers, with secondary legislation to be laid in November
  2026, so cash keeps no limit of its own here. Set this to 12,000 to model the
  lower limit.
