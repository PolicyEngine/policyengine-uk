description: >
  Limit on a person's subscriptions in the tax year to cash ISAs while they are
  under the cash ISA full limit age at the end of the year. Cash has had no
  limit of its own since 1 July 2014, so until 6 April 2027 cash subscriptions
  count only towards the annual subscription limit.
values:
  2017-04-06: .inf
  2027-04-06: 12000
