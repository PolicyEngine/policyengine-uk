description: >
  Share of the amount withdrawn from a Lifetime ISA that is charged when the
  withdrawal is not exempt, that is, when it is made before the charge-free age
  and not towards a first home or with a terminal illness.
values:
  2017-04-06: 0.25
  2020-03-06: 0.2
  2021-04-06: 0.25
