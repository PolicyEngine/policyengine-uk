description: >
  Limit on a person's total subscriptions in the tax year to ISAs other than
  Junior ISAs: cash, stocks-and-shares, innovative finance and new Lifetime ISA
  payments together. It was £15,000 from 1 July 2014 and £15,240 from 6 April
  2015. The annual model reads it from 2015-16; 2014-15 and earlier years, with
  their lower limits and cash sub-limits, are not modelled.
values:
  2014-07-01: 15000
  2015-04-06: 15240
  2017-04-06: 20000
