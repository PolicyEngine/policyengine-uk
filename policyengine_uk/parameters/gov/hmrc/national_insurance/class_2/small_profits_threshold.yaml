description: Small profits threshold for Class 2 National Insurance contributions under section 11(4) of the Social Security Contributions and Benefits Act 1992. Before 2022-23 self-employed earners with profits at or above it were liable for Class 2; in 2022-23 and 2023-24 profits from this threshold up to the lower profits threshold were treated as paid.
