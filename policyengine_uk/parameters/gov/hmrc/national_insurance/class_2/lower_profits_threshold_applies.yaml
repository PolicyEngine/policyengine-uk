description: Class 2 National Insurance liability starts above the lower profits threshold rather than at the small profits threshold. In 2022-23 and 2023-24 profits from the small profits threshold up to the lower profits threshold were treated as paid. Compulsory Class 2 ended on 6 April 2024; the switch stays on so that a reform restoring a Class 2 rate uses the 2023-24 rule.
