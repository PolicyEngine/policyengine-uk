    rate:
      description: The main National Insurance rate paid between the Lower and Upper Profits Limits for self-employed profits.
      values:
        2015-04-06:
          value: 0.09
          metadata:
            reference:
              - title: National Insurance Contributions Act 2011 s 2(1)(a) (main Class 4 percentage of 9% from 6 April 2011)
                href: https://www.legislation.gov.uk/ukpga/2011/3/section/2/enacted
              - title: Social Security Contributions and Benefits Act 1992 s 15(3ZA)(a) (as at 6 April 2015)
                href: https://www.legislation.gov.uk/ukpga/1992/4/section/15/2015-04-06
        # Class 4 is charged on the year's profits, so 2022-23 has one rate for the
        # whole tax year. The Health and Social Care Levy (Repeal) Act 2022 replaced
        # the 10.25% that the Health and Social Care Levy Act 2021 s 5(2) had set.
        2022-04-06:
          value: 0.0973
          metadata:
            reference:
              - title: Health and Social Care Levy (Repeal) Act 2022 s 2(2)(a) (main Class 4 percentage of 9.73% for the tax year 2022-23)
                href: https://www.legislation.gov.uk/ukpga/2022/43/section/2
        2023-04-06:
          value: 0.09
          metadata:
            reference:
              - title: Social Security Contributions and Benefits Act 1992 s 15(3ZA)(a) (as at 6 April 2023)
                href: https://www.legislation.gov.uk/ukpga/1992/4/section/15/2023-04-06
        2024-04-06:
          value: 0.06
          metadata:
            reference:
              - title: National Insurance Contributions (Reduction in Rates) Act 2024 ss 1(3)(a) and 3(1)
                href: https://www.legislation.gov.uk/ukpga/2024/5/section/1/enacted
              - title: Social Security Contributions and Benefits Act 1992 s 15(3ZA)(a) (as at 6 April 2024)
                href: https://www.legislation.gov.uk/ukpga/1992/4/section/15/2024-04-06
