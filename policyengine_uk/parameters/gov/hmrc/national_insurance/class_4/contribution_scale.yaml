  - threshold:
      description: The Upper Profits Limit is the threshold at which self-employed earners pay the additional Class 4 National Insurance rate.
      # Legal status: £50,270 is the standing figure in SSCBA 1992 s.15(3)(b), which
      # stays until altered by order under SSAA 1992 s.141. Budget 2025 commits to
      # keeping it until April 2031. From 2031-32 (the tax year after the last value
      # below) the model keeps the limit equal to the higher rate threshold
      # (personal allowance plus basic rate limit)
      # (policyengine_uk/parameters/gov/hmrc/create_threshold_indexation.py). The
      # government has kept the UPL in line with the higher rate threshold, which
      # Income Tax Act 2007 ss21 and 57 index by September CPI from 2031-32, and
      # says the UPL will be uprated by September CPI after 2030-31 (Explanatory
      # Memorandum to SI 2026/231 paras 5.1 and 5.25). That is announced policy, not
      # law; keeping it equal to the higher rate threshold, round-ups included, is a
      # modelling assumption consistent with it. The file has no uprating.
      values:
        2015-04-06:
          value: 42_385
          metadata:
            reference:
              - title: The Social Security (Contributions) (Re-rating and National Insurance Funds Payments) Order 2015 art 3(b)
                href: https://www.legislation.gov.uk/uksi/2015/588/article/3/made
