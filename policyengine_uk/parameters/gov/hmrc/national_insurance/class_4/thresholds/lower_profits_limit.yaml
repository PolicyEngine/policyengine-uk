description: The Lower Profits Limit is the threshold at which self-employed earners pay the main Class 4 National Insurance rate.
# Legal status: £12,570 is the standing figure in SSCBA 1992 s.15(3)(a), which
# stays until altered by order under SSAA 1992 s.141. Budget 2025 commits to
# keeping it until April 2031. From 2031-32 (the tax year after the last value
# below) the model keeps the limit equal to the personal allowance
# (policyengine_uk/parameters/gov/hmrc/create_threshold_indexation.py). The
# government keeps the LPL aligned with the personal allowance, which Income
# Tax Act 2007 s57 indexes by September CPI from 2031-32, and says the LPL
# will be uprated by September CPI after 2030-31 (Explanatory Memorandum to
# SI 2026/231 para 5.1). This is announced policy, not law, and the file has
# no uprating.
