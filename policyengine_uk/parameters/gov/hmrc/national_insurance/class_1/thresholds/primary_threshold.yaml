description: The Primary Threshold is the lower bound for the main rate of Class 1 National Insurance.
# From 6 July 2022 the model stores the annual earnings period threshold
# divided by 52 (12,570 / 52, rounded to 241.73), as SI 2001/1004 reg 11(3)(c)
# does for periods of whole weeks; 52 weeks give £12,569.96. The weekly amount
# in reg 10(c) is £242.
# Legal status: SI 2001/1004 reg 10 sets the amounts for 2026-27 only. The
# 2027-28 to 2030-31 values are announced policy (Autumn Statement 2022 and
# Budget 2025), to be set in each year's rates, limits and thresholds
# regulations.
# From 2031-32 (the tax year after the last value below) the model keeps the
# threshold at the personal allowance over 52, to the penny, as for 241.73
# (policyengine_uk/parameters/gov/hmrc/create_threshold_indexation.py). The
# government has kept the PT aligned with the personal allowance, which Income
# Tax Act 2007 s57 indexes by September CPI from 2031-32, and says the PT will
# be uprated by September CPI after 2030-31 (Explanatory Memorandum to SI
# 2026/231 para 5.1). That is announced policy, not law; keeping it equal to
# the allowance, round-up included, is a modelling assumption consistent with
# it. The file has no uprating.
