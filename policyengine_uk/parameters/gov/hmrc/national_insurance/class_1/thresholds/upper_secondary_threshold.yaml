description: Upper secondary threshold for the under-21 group, up to which the age-related secondary percentage of 0% applies to an earner under 21.
# The threshold has equalled the upper earnings limit (UEL) in every year since
# it was introduced. From 2021-22 the model stores the annual earnings period
# amount divided by 52 (50,270 / 52, rounded to 966.73), as for the UEL; reg
# 10 states £967 a week and reg 11(3B) £50,270 for an annual earnings period.
# Legal status: SI 2001/1004 reg 10 sets the amount for 2026-27 only. The
# 2027-28 to 2030-31 values are announced policy: HMRC's Budget 2025 note says
# the UST and AUST "will remain aligned to the National Insurance
# contributions UEL at £967 per week up until the 2030 to 2031 tax year".
# From 2031-32 the model keeps the threshold equal to the UEL
# (policyengine_uk/parameters/gov/hmrc/create_threshold_indexation.py), a
# modelling assumption consistent with that alignment. The file has no
# uprating.
