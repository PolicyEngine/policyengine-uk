description: Class 1 employer marginal contribution schedule.
metadata:
  label: Class 1 employer marginal contribution schedule
  threshold_unit: currency-GBP
  rate_unit: /1
brackets:
  - threshold:
      values:
        0001-01-01: 0
      metadata:
        household: false
        economy: false
        unit: currency-GBP
        period: week
    rate:
      values:
        0001-01-01: 0
      metadata:
        household: false
        economy: false
        unit: /1
  - threshold:
      description: Secondary threshold for National Insurance.
      metadata:
        label: NI secondary threshold
        period: week
        reference:
        - https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/882271/Table-a4.pdf
        - https://www.gov.uk/government/publications/rates-and-allowances-national-insurance-contributions/rates-and-allowances-national-insurance-contributions
        unit: currency-GBP
      # From 2025-26 the value is the annual £5,000 in SI 2001/1004 reg 11(3A)(b)
      # divided by 52 (96.153846 = 5,000 / 52), so that the model's 52-week
      # annualisation gives £5,000. This is the convention reg 11(3)(c) and
      # 11(2A)(c) use for the primary threshold and upper earnings limit, which the
      # model also stores as annual / 52. The rounded weekly figure in reg 10(d) is
      # £96, which would annualise to £4,992 (#1967). Before 2025-26 the weekly
      # figure times 52 equals the annual one (for example £175 x 52 = £9,100).
      # Legal status: SI 2001/1004 reg 10 sets the amounts for 2026-27 only. The
      # 2027-28 to 2030-31 values are announced policy (Autumn Budget 2024 and
      # Budget 2025), to be set in each year's rates, limits and thresholds
      # regulations.
      # From 2031-32 (the tax year after the last value below) the model raises the
      # threshold each year by September CPI of the previous year, unrounded
      # (policyengine_uk/parameters/gov/hmrc/create_threshold_indexation.py). The
      # Autumn Budget 2024 note said the threshold "will be increased in line with
      # Consumer Prices Index (CPI)" after its freeze; nothing later sets the rule,
      # so this is a modelling assumption, and the file has no uprating.
      values:
        # £155 was the primary threshold in 2015-16 and 2016-17 (reg 10(c)), not the
        # secondary threshold (#2178).
        2015-04-06:
          value: 156
          metadata:
            reference:
              - title: The Social Security (Contributions) Regulations 2001 reg 10(d) (£156 a week), as at 6 April 2015
                href: https://www.legislation.gov.uk/uksi/2001/1004/regulation/10/2015-04-06
              - title: The Social Security (Contributions) Regulations 2001 reg 11(3A)(b) (£8,112 where the earnings period is a year), as at 6 April 2015
                href: https://www.legislation.gov.uk/uksi/2001/1004/regulation/11/2015-04-06
        2016-04-06:
          value: 156
          metadata:
            reference:
              - title: The Social Security (Contributions) Regulations 2001 reg 10(d) (£156 a week), as at 6 April 2016
                href: https://www.legislation.gov.uk/uksi/2001/1004/regulation/10/2016-04-06
              - title: The Social Security (Contributions) Regulations 2001 reg 11(3A)(b) (£8,112 where the earnings period is a year), as at 6 April 2016
                href: https://www.legislation.gov.uk/uksi/2001/1004/regulation/11/2016-04-06
        2017-04-06: 157
        2018-04-06: 162
        2019-04-06: 166
        2020-04-06: 169
        2021-04-06: 170
        2022-04-06:
          metadata:
            reference:
            - href: https://www.legislation.gov.uk/uksi/2022/232/regulation/6/made#regulation-6-2-a
              title: The Social Security (Contributions) (Rates, Limits and Thresholds Amendments
                and National Insurance Funds Payments) Regulations 2022(6)
          value: 175
        2024-01-01: 175
        2025-04-06:
          value: 96.153846
          metadata:
            reference:
              - title: National Insurance Contributions (Secondary Class 1 Contributions) Act 2025 s.2
                href: https://www.legislation.gov.uk/ukpga/2025/11/section/2
              - title: The Social Security (Contributions) Regulations 2001 reg 11(3A)(b) (£5,000 where the earnings period is a year)
                href: https://www.legislation.gov.uk/uksi/2001/1004/regulation/11
        2026-04-06:
          value: 96.153846
          metadata:
            reference:
              - title: The Social Security (Contributions) Regulations 2001 reg 10(d) and reg 11(3A), for 2026-27 (reg 10's tax year set by SI 2026/231 reg 5(2)(a))
                href: https://www.legislation.gov.uk/uksi/2001/1004/regulation/11/2026-04-06
              - title: SI 2026/231 reg 5
                href: https://www.legislation.gov.uk/uksi/2026/231/regulation/5/made
        2027-04-06:
          value: 96.153846
          metadata:
            reference:
              - title: "HMRC: Changes to the Class 1 National Insurance Contributions Secondary Threshold, the Secondary Class 1 National Insurance contributions rate, and the Employment Allowance from 6 April 2025 (Autumn Budget 2024)"
                href: https://www.gov.uk/government/publications/changes-to-the-class-1-national-insurance-contributions-secondary-threshold-the-secondary-class-1-national-insurance-contributions-rate-and-the-empl/changes-to-the-class-1-national-insurance-contributions-secondary-threshold-the-secondary-class-1-national-insurance-contributions-rate-and-the-empl
        2028-04-06:
          value: 96.153846
          metadata:
            reference:
              - title: Budget 2025 (HC 1492) para 4.112
                href: https://assets.publishing.service.gov.uk/media/6929b353345e31ab14ecf735/E03444720_Budget_2025_Web_Accessible.pdf#page=113
              - title: Explanatory Memorandum to SI 2026/231 para 5.26
                href: https://www.legislation.gov.uk/uksi/2026/231/pdfs/uksiem_20260231_en_001.pdf
        2029-04-06:
          value: 96.153846
          metadata:
            reference:
              - title: Budget 2025 (HC 1492) para 4.112
                href: https://assets.publishing.service.gov.uk/media/6929b353345e31ab14ecf735/E03444720_Budget_2025_Web_Accessible.pdf#page=113
              - title: Explanatory Memorandum to SI 2026/231 para 5.26
                href: https://www.legislation.gov.uk/uksi/2026/231/pdfs/uksiem_20260231_en_001.pdf
        2030-04-06:
          value: 96.153846
          metadata:
            reference:
              - title: Budget 2025 (HC 1492) para 4.112
                href: https://assets.publishing.service.gov.uk/media/6929b353345e31ab14ecf735/E03444720_Budget_2025_Web_Accessible.pdf#page=113
              - title: Explanatory Memorandum to SI 2026/231 para 5.26
                href: https://www.legislation.gov.uk/uksi/2026/231/pdfs/uksiem_20260231_en_001.pdf
    rate:
      description: National Insurance contribution rate by employers on earnings above the
        Secondary Threshold.
      metadata:
        label: NI employer rate
        propagate_metadata_to_children: true
        unit: /1
        # Annual values are the rate at 30 April of each tax year, as for the
        # employee main rate (no fiscal_year_blend). For 2022-23 that is the levy
        # rate of 15.05%, although earnings paid from 6 November 2022 were charged
        # at 13.8%; see #1807 for the choice between sampling and averaging.
      values:
        2015-04-01:
          value: 0.138
          metadata:
            reference:
              - title: National Insurance rates and thresholds
                href: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/882271/Table-a4.pdf
        2022-04-06:
          value: 0.1505
          metadata:
            reference:
              - title: Health and Social Care Levy Act 2021 s.5(2)(b)
                href: https://www.legislation.gov.uk/ukpga/2021/28/section/5/enacted
        2022-11-06:
          value: 0.138
          metadata:
            reference:
              - title: Health and Social Care Levy (Repeal) Act 2022 s.2(1)
                href: https://www.legislation.gov.uk/ukpga/2022/43/section/2/enacted
        2025-01-01:
          value: 0.15
          metadata:
            reference:
              - title: National Insurance Contributions (Secondary Class 1 Contributions) Act 2025 s.1
                href: https://www.legislation.gov.uk/ukpga/2025/11/section/1
