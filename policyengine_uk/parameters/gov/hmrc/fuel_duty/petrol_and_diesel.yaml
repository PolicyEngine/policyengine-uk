description: The UK levies fuel duty on petrol and diesel at this rate per litre.
# Each value takes effect on the date it is keyed to; the schedule is not
# annualised here. `fiscal_year_blend` day-weights it across each UK fiscal
# year (6 April to 5 April) when parameters are converted to annual values,
# so a model year carries every rate in force during it in proportion to its
# days. Time of day is not modelled: a 6pm change counts from the start of
# its day.
