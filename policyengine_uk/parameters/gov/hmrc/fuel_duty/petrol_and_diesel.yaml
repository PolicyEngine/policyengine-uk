metadata:
  unit: currency-GBP
  label: Fuel duty rate (petrol and diesel)
  fiscal_year_blend: true
  # After 2031-04-01, each 1 April applies the previous calendar year's RPI
  # growth: the ratio of the index on 1 January of that year to the index a
  # year earlier.
  uprating:
    parameter: gov.economic_assumptions.indices.obr.rpi
    at_defined_interval:
      start: "0001-01-01"
      end: "0002-01-01"
      enactment: "0003-04-01"
    rounding:
      type: nearest
      interval: 0.0001
  reference:
    - title: Hydrocarbon Oil Duties Act 1979, section 6
      href: https://www.legislation.gov.uk/ukpga/1979/5/section/6
