metadata:
  unit: currency-GBP
  period: year
  label: fuel duty rate on natural gas per kilogram
  reference:
  - title: Hydrocarbon Oil Duties Act 1979, section 8
    href: https://www.legislation.gov.uk/ukpga/1979/5/section/8
  - title: SI 2026/164, as amended by SI 2026/555 (cut continued to 31 December 2026)
    href: https://www.legislation.gov.uk/uksi/2026/164
  - title: Budget 2026, paragraph 6.211, and policy costings page 13 (proportionate cut to other fuels to 1 July 2027; not yet law)
    href: https://assets.publishing.service.gov.uk/media/6ae1883fe4367e5c8b0467df/AB26_Policy_Costing.pdf#page=13
  - title: HMRC, Amended Fuel Duty rates 2026 to 2027 (22 May 2026)
    href: https://www.gov.uk/government/publications/amended-fuel-duty-rates-for-2026-to-2027/amended-fuel-duty-rates-2026-to-2027
  fiscal_year_blend: true
  # After 2031-04-01, each 1 April applies the previous calendar year's RPI
  # growth.
  uprating:
    parameter: gov.economic_assumptions.indices.obr.rpi
    at_defined_interval:
      start: "0001-01-01"
      end: "0002-01-01"
      enactment: "0003-04-01"
    rounding:
      type: nearest
      interval: 0.0001
