description: A person whose finished plastic packaging components reach this many tonnes in 12 months is liable to register for plastic packaging tax, and only registered or liable persons are charged.
# The tax is not charged before 2022-04-01 (its rate is 0), so the threshold
# states a zero before then.
values:
  0000-01-01: 0
  2022-04-01: 10
metadata:
  unit: /1
  period: year
  label: Plastic packaging tax registration threshold (tonnes)
  reference:
    - title: Finance Act 2021 s.55
      href: https://www.legislation.gov.uk/ukpga/2021/26/section/55
    - title: Finance Act 2021 s.43(2A)
      href: https://www.legislation.gov.uk/ukpga/2021/26/section/43
