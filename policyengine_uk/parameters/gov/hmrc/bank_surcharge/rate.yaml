description: Bank corporation tax surcharge rate charged on a banking company's surcharge profits above its surcharge allowance. Dates are the legal start dates; each year label is the day-weighted average over 6 April to 5 April, which approximates the apportionment of an accounting period that straddles a change (1 January 2016, 1 January 2027).
