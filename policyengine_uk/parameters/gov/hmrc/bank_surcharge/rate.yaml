description: Bank corporation tax surcharge rate charged on a banking company's surcharge profits above its surcharge allowance. Dates are the legal start dates; for each financial year label the model reads the value in force on 30 April, so a mid-year change (1 January 2016, 1 January 2027) takes effect from the next year label rather than being apportioned.
