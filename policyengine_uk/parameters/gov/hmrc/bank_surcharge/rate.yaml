metadata:
  unit: /1
  period: year
  label: Bank surcharge rate
  # Commencement provisions split an accounting period that straddles a rate
  # change in two and apportion profits between the parts by time (for
  # example Finance Act 2022 s. 6(4)-(6) with Corporation Tax Act 2010
  # s. 1172). Day-weighting over the fiscal year approximates that for a firm
  # with an April to March year, as for the annual investment allowance
  # limit. The window runs from 6 April, so a change dated 1 April (2023,
  # 2028) puts 5 days at the new rate into the previous year label.
  fiscal_year_blend: true
  reference:
    - title: Corporation Tax Act 2010 s. 269DA
      href: https://www.legislation.gov.uk/ukpga/2010/4/section/269DA
