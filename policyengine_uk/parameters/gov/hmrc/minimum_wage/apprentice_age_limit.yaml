description: Apprentices below this age qualify for the apprentice minimum wage regardless of how long they have been in their apprenticeship.
# The under-19 rule took effect on 1 October 2010. Values begin with the
# model's minimum wage rate history on 1 October 2012.
values:
  2012-10-01: 19
