description: Minimum wage rate for apprentices.
# The apprenticeship rate applies to an apprentice who is under 19 or in the
# first 12 months of the apprenticeship (NMW Regulations 2015 reg. 5). Rates
# take effect on the commencement date of each amending S.I.: on 1 October
# until 2016, then on 1 April from 2017.
