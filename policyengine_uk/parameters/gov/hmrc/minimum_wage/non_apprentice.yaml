description: Minimum wage rate for non-apprentices by age.

# The thresholds are every age boundary the law has used since October 2012
# (18, 21, 23 and 25), giving the bands under 18, 18 to 20, 21 to 22, 23 to 24
# and 25 or over. The thresholds do not change. Where the law groups adjacent
# bands, they carry the same rate.
#
# - Until 31 March 2016 one adult rate applied from age 21 (NMW Regulations
#   1999 reg. 11, then NMW Regulations 2015 reg. 4(1)(a)).
# - From 1 April 2016 the national living wage (NMW Regulations 2015 reg. 4)
#   applied from age 25, and reg. 4A(1)(a) set a lower rate for ages 21 to 24
#   (S.I. 2016/68 reg. 3).
# - From 1 April 2021 the national living wage applied from age 23
#   (S.I. 2021/329 reg. 2(3)(b)), leaving reg. 4A(1)(a) for ages 21 and 22.
# - From 1 April 2024 it applies from age 21, and reg. 4A(1)(a) is omitted
#   (S.I. 2024/432 reg. 2(3)(a)).
#
# Rates take effect on the commencement date of each amending S.I. Until
# October 2015 all rate changes took effect on 1 October. The national living
# wage has changed each 1 April since 2016; the other rates changed on
# 1 October 2016 and each 1 April from 2017.

