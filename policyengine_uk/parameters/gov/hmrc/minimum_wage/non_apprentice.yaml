description: Minimum wage rate for non-apprentices by age.

# The thresholds are every age boundary the law has used since October 2010
# (18, 21, 23 and 25), giving the bands under 18, 18 to 20, 21 to 22, 23 to 24
# and 25 or over. The thresholds do not change. Where the law groups adjacent
# bands, they carry the same rate.
#
# - From 1 October 2010 the adult rate applied from age 21, not 22 (NMW
#   Regulations 1999 reg. 13(1) as substituted by S.I. 2010/1901 reg. 5).
# - Until 31 March 2016 one adult rate applied from age 21 (NMW Regulations
#   1999 reg. 11, then NMW Regulations 2015 reg. 4(1)(a)).
# - From 1 April 2016 the national living wage (NMW Regulations 2015 reg. 4)
#   applied from age 25, and reg. 4A(1)(a) set a lower rate for ages 21 to 24
#   (S.I. 2016/68 reg. 3).
# - From 1 April 2021 the national living wage applied from age 23
#   (S.I. 2021/329 reg. 2(3)(b)), leaving reg. 4A(1)(a) for ages 21 and 22.
# - From 1 April 2024 it applies from age 21, and reg. 4A(1)(a) is omitted
#   (S.I. 2024/432 reg. 2(3)(a)).
#
# Rates take effect on the commencement date of each amending S.I. Until
# October 2015 all rate changes took effect on 1 October. The national living
# wage has changed each 1 April since 2016; the other rates changed on
# 1 October 2016 and each 1 April from 2017. The 1 April 2027 rates are the
# ones Budget 2026 announced (paragraph 6.128); the amending S.I. is not yet
# made.
#
# Rates after the last one set here are a projection, not law. Each is the
# last rate set times the growth since then in
# gov.economic_assumptions.indices.obr.national_living_wage, rounded to the
# nearest penny (the rounding is not repeated each year). To the end of the
# EFO that index follows the OBR's own forecast of the national living wage
# (detailed economy tables, Table 1.13), so the projected national living
# wage is the OBR's estimate to the penny: £13.51, £13.85, £14.23 and £14.62
# from April 2028 to April 2031 (October 2026 EFO). HM Treasury costed the
# Budget 2026 Carer's Allowance taper on these projections. After the EFO the
# index grows with average earnings: the Low Pay Commission remit 2026 says
# two-thirds of median hourly earnings "should continue to be the key
# reference point for future rates" of the national living wage.
#
# The index is dated 1 January, so before annualisation a projected rate
# starts on 1 January. Each year's figure is read at 30 April, the rate for
# the fiscal year that starts that April. Like the model's other indices, this
# one ends in 2039, so projected rates hold flat from 2040.
#
# The younger bands' projection is an assumption: each grows from its own
# last rate by the same index, so it keeps its ratio to the national living
# wage to the penny. The Government "remains committed to" aligning the 18 to
# 20 rate with the national living wage, at a pace the Low Pay Commission sets
# (remit 2026), which this does not model.
#
# A rate added to this file takes precedence, and the projection continues
# from it. A reform does not: a rate a reform sets for some years is not
# projected forward, so an open-ended reform holds its rate flat while the
# baseline rises.

