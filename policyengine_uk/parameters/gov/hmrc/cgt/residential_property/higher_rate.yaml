description: Capital gains tax rate on UK residential property gains of higher or additional rate taxpayers, and on gains above the unused basic rate band. Finance Act 2016 s. 83 kept residential property at 28% when the main higher rate fell to 20%; Finance (No. 2) Act 2024 s. 6 cut it to 24% for disposals from 6 April 2024. It did not change on 30 October 2024, so the fiscal-year value is not blended.
