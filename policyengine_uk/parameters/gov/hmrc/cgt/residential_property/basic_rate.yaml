description: Capital gains tax rate on UK residential property gains that fall within the taxpayer's unused basic rate band. Finance Act 2016 s. 83 kept residential property at 18% when the main basic rate fell to 10%, and the 30 October 2024 main-rate rise did not touch it, so the fiscal-year value is not blended.
