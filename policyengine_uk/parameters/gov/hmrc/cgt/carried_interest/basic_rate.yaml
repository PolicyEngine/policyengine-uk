description: Capital gains tax rate on carried interest gains that fall within the taxpayer's unused basic rate band. Finance Act 2016 s. 83 kept carried interest at 18% when the main basic rate fell to 10%. Finance Act 2025 s. 12 charges all carried interest arising from 6 April 2025 at a flat 32% outside the basic rate band, so from that date this equals the higher rate. Carried interest moves into the income tax framework from 6 April 2026, which the model does not represent; the 32% rate stands in for it.
