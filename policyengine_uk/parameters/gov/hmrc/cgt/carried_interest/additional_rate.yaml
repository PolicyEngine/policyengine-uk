description: Capital gains tax rate on carried interest gains that the model places above the income tax higher rate limit. Capital gains tax has no separate additional rate, so this equals carried_interest.higher_rate at every date; the parameter exists so that a reform can mirror the income tax additional-rate band on carried interest in the same way gov.hmrc.cgt.additional_rate allows for other gains.
values:
  2015-01-01:
    value: 0.28
    reference:
      - title: Finance Act 2016 s. 83
        href: https://www.legislation.gov.uk/ukpga/2016/24/section/83
  2025-04-06:
    value: 0.32
    reference:
      - title: Finance Act 2025 s. 12
        href: https://www.legislation.gov.uk/ukpga/2025/8/section/12
