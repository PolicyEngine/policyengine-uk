description: Capital gains tax rate on carried interest gains of higher or additional rate taxpayers, and on gains above the unused basic rate band. Finance Act 2016 s. 83 kept carried interest at 28% when the main higher rate fell to 20%, and the 30 October 2024 rise did not touch it. Finance Act 2025 s. 12 charges all carried interest arising from 6 April 2025 at a flat 32%. Carried interest moves into the income tax framework from 6 April 2026, which the model does not represent; the 32% rate stands in for it.
