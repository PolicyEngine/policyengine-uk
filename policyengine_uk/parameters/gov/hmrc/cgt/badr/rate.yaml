description: Capital gains tax rate on gains qualifying for Business Asset Disposal Relief or Investors' Relief, charged on qualifying gains up to the lifetime limit whatever the taxpayer's income tax band. The rate rose from 10% to 14% for disposals from 6 April 2025 and to 18% from 6 April 2026; it did not change on 30 October 2024, so the fiscal-year value is not blended.
