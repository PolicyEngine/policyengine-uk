description: Lifetime limit on gains qualifying for Business Asset Disposal Relief. The model applies it to the year's qualifying gains as if none of the limit had been used in earlier years, and charges gains above it at the main rates. Investors' Relief kept a separate £10 million limit until 30 October 2024 (Finance Act 2025 s. 10); the merged capital_gains_badr input does not distinguish the two reliefs, so the BADR limit applies to both.
