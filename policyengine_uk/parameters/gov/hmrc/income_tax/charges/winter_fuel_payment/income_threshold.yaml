        href: https://www.legislation.gov.uk/ukpga/2003/1/section/681I
      - title: Income Tax (Earnings and Pensions) Act 2003, s. 681J (alteration of income limit by Treasury order)
        href: https://www.legislation.gov.uk/ukpga/2026/11/schedule/10
