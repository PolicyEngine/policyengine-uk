description: Total income up to which the full Pension Tax Allowance applies, the full annual value of the new State Pension for the tax year. The allowance tapers away above it.
values:
  # 52 weeks at £250.70. The explainer: "From the tax year beginning
  # 6 April 2027, the full annual value of the new State Pension will
  # increase to £13,036.40", worked out as the full new State Pension
  # receivable from 6 April 2027 to 5 April 2028.
  2027-04-06: 13_036.40
metadata:
  unit: currency-GBP
  period: year
  label: Pension Tax Allowance State Pension threshold
  # "For tax years 2028-29 and 2029-30, the value of the Pension Tax
  # Allowance will be uprated in line with the full annual value of the new
  # State Pension." The new State Pension is projected with the triple lock
  # index, so this follows it in the baseline. Uprating by the pension's own
  # amount would divide by zero under a reform that sets it to nil, so a
  # reform to the new State Pension rate leaves this threshold alone unless
  # the threshold is reformed with it.
  uprating: gov.economic_assumptions.indices.triple_lock
  reference:
    - title: HM Treasury, Pension Tax Allowance explainer, section 1 and FAQ
      href: https://www.gov.uk/government/publications/pension-tax-allowance-explainer/pension-tax-allowance-explainer
