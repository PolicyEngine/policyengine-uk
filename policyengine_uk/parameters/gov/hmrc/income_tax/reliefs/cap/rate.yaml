description: Reliefs against general income listed in ITA 2007 s.24A, such as trade loss relief, are limited to the greater of a fixed amount and this share of adjusted total income.
values:
  # No cap before 2013-14: the fixed amount is infinite then.
  0000-01-01: 0
  2013-04-06: 0.25
