description: Appropriate percentage for a company car with a CO2 emissions figure of 0, the share of the car's price taxed each year as its benefit.
# The tax year 2030-31 keeps 2029-30's 9%. Budget 2026 announced 10% for
# 2030-31, to be legislated in Finance Bill 2026-27; the
# company_car_tax_rise_2030 scenario applies it.
