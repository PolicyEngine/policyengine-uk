description: Appropriate percentage under ITEPA 2003 s. 139A for a company car first registered on or after 6 April 2020 with a CO2 emissions figure of 75 g/km, before the rise for each step of emissions above it, while s. 139A is in effect. The maximum appropriate percentage is unchanged.
