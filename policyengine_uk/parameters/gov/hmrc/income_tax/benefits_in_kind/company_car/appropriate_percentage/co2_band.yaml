description: Appropriate percentage for a company car with a CO2 emissions figure of 51 to 74 g/km, by that figure rounded down to a whole number.
# Finance Act 2025 s. 5 merges the 65-69 and 70-74 bands into one 65-74 band
# from 2028-29, so the last two brackets have the same amount from then.
# For 2020-21 and 2021-22 these are the rates for cars first registered
# before 6 April 2020; registered_from_6_april_2020 holds the s. 139A rates.
# The tax year 2030-31 keeps 2029-30's rates. Budget 2026 announced one
# point more in every band; the company_car_tax_rise_2030 scenario applies it.
metadata:
  type: single_amount
  threshold_unit: g/km
  amount_unit: /1
  period: year
  label: Company car appropriate percentage by CO2 emissions, 51 to 74 g/km
  reference:
    - title: Income Tax (Earnings and Pensions) Act 2003 s. 139(1) and (2)(a)
      href: https://www.legislation.gov.uk/ukpga/2003/1/section/139
    - title: Finance (No. 2) Act 2017 s. 2(2) (tax years 2020-21 to 2024-25)
      href: https://www.legislation.gov.uk/ukpga/2017/32/section/2/enacted
    - title: Finance Act 2023 s. 11 (tax years 2025-26, 2026-27 and 2027-28)
      href: https://www.legislation.gov.uk/ukpga/2023/1/section/11/enacted
    - title: Finance Act 2025 s. 5(2) (tax year 2028-29)
      href: https://www.legislation.gov.uk/ukpga/2025/8/section/5/enacted
    - title: Finance Act 2025 s. 6(2) (tax year 2029-30 and subsequent tax years)
      href: https://www.legislation.gov.uk/ukpga/2025/8/section/6/enacted
    - title: "HMRC 480 Appendix 2: appropriate percentages for 2020-21 to 2026-27"
      href: https://www.gov.uk/guidance/company-car-benefit-the-appropriate-percentage-480-appendix-2
brackets:
  # 51 to 54 g/km.
  - threshold:
      2020-04-06: 51
    amount:
      2020-04-06: 0.15
      2025-04-06: 0.16
      2026-04-06: 0.17
      2027-04-06: 0.18
      2028-04-06: 0.19
      2029-04-06: 0.20
  # 55 to 59 g/km.
  - threshold:
      2020-04-06: 55
    amount:
      2020-04-06: 0.16
      2025-04-06: 0.17
      2026-04-06: 0.18
      2027-04-06: 0.19
      2028-04-06: 0.20
      2029-04-06: 0.21
  # 60 to 64 g/km.
  - threshold:
      2020-04-06: 60
    amount:
      2020-04-06: 0.17
      2025-04-06: 0.18
      2026-04-06: 0.19
      2027-04-06: 0.20
      2028-04-06: 0.21
      2029-04-06: 0.22
  # 65 to 69 g/km.
  - threshold:
      2020-04-06: 65
    amount:
      2020-04-06: 0.18
      2025-04-06: 0.19
      2026-04-06: 0.20
      2027-04-06: 0.21
      2028-04-06: 0.22
      2029-04-06: 0.23
  # 70 to 74 g/km. In 2027-28 Finance Act 2023 s. 11(7) keeps it at 21%,
  # level with 65-69 g/km and with the 75 g/km rate.
  - threshold:
      2020-04-06: 70
    amount:
      2020-04-06: 0.19
      2025-04-06: 0.20
      2026-04-06: 0.21
      2027-04-06: 0.21
      2028-04-06: 0.22
      2029-04-06: 0.23
