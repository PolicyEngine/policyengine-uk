description: Amount of trading allowance, which relieves trading receipts in place of deducting actual expenses.
values:
  2005-04-01:
    value: 0
    reference:
      - title: Finance (No. 2) Act 2017 Sch. 3 para. 13 (allowance has effect from 2017-18)
        href: https://www.legislation.gov.uk/ukpga/2017/32/schedule/3/paragraph/13
  2017-04-06:
    value: 1_000
    reference:
      - title: Income Tax (Trading and Other Income) Act 2005 s. 783AD
        href: https://www.legislation.gov.uk/ukpga/2005/5/section/783AD
      - title: Finance (No. 2) Act 2017 Sch. 3
        href: https://www.legislation.gov.uk/ukpga/2017/32/schedule/3
  # Budget 2026 raises the allowance to £3,000 from 6 April 2027, to be
  # legislated in Finance Bill 2026-27. The s. 783AD amount also relieves
  # miscellaneous income (s. 783AB); the model applies it to trading income
  # and to Chapter 8 miscellaneous income (income_not_otherwise_charged).
  2027-04-06:
    value: 3_000
    reference:
      - title: Budget 2026, paragraph 6.254 (Increase Trading Allowance)
        href: https://assets.publishing.service.gov.uk/media/6ae1ec57bdb574cf1c9b3f12/E03668986_HMT_Budget_2026_ELAY__2_.pdf#page=142
      - title: Budget 2026 policy costings, page 23 (from 6 April 2027)
        href: https://assets.publishing.service.gov.uk/media/6ae1883fe4367e5c8b0467df/AB26_Policy_Costing.pdf#page=23
      - title: Budget 2026, Table 6.1, item 15
        href: https://assets.publishing.service.gov.uk/media/6ae187a2779378370fd80a9a/Table_6.1_and_6.2_Budget_2026_Policy_Decisions.xlsx
