description: Rates for Scottish Income Tax.
# Each year's Scottish rate resolution sets these rates and limits for that
# tax year only (Scotland Act 1998 s. 80C(3)). The comment on each dated value
# names the motion and paragraph. The resolutions state the limits as taxable
# income, above the personal allowance, and this file holds them as stated.
# gov.scot's tables add the standard personal allowance to the same limits.
# The Scottish Budget 2026-27 announces higher, advanced and top threshold
# freezes through 2028-29. These future values model announced policy;
# Scottish rates and bands are still subject to annual rate resolutions.
# CPI uprating after 2028-29 is the existing model projection, not a Budget
# commitment to subsequent indexation.
