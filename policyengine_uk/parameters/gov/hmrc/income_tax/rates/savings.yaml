description: Savings income tax rates. From April 2027, savings income is taxed at rates 4pp higher than the standard UK rates (2pp from Budget 2025 and 2pp from Budget 2026), across the UK.
metadata:
  label: Savings Income Tax rates
  unit: /1
  reference:
    - title: OBR Economic and Fiscal Outlook November 2025
      href: https://obr.uk/efo/economic-and-fiscal-outlook-november-2025/
    - title: Budget 2026, paragraph 6.247
      href: https://assets.publishing.service.gov.uk/media/6ae1ec57bdb574cf1c9b3f12/E03668986_HMT_Budget_2026_ELAY__2_.pdf#page=142
basic:
  description: The basic rate of tax on savings income.
  metadata:
    label: Savings basic rate
    unit: /1
  values:
    2015-04-06: 0.20
    # Budget 2025 set 22% from 6 April 2027; Budget 2026 adds a further
    # 2 percentage points from the same date, applying across the UK.
    2027-04-06:
      value: 0.24
      metadata:
        reference:
          - title: Budget 2026, paragraph 6.247
            href: https://assets.publishing.service.gov.uk/media/6ae1ec57bdb574cf1c9b3f12/E03668986_HMT_Budget_2026_ELAY__2_.pdf#page=142
          - title: Budget 2026 policy costings, page 75 (from 6 April 2027)
            href: https://assets.publishing.service.gov.uk/media/6ae1883fe4367e5c8b0467df/AB26_Policy_Costing.pdf#page=75
          - title: Budget 2026, Table 6.1, item 62
            href: https://assets.publishing.service.gov.uk/media/6ae187a2779378370fd80a9a/Table_6.1_and_6.2_Budget_2026_Policy_Decisions.xlsx
          - title: OBR Economic and Fiscal Outlook November 2025 (Budget 2025's first 2 points)
            href: https://obr.uk/efo/economic-and-fiscal-outlook-november-2025/
