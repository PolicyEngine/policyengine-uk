  period: year
  label: Savings starter rate phase-out rate
  description: >-
    Under custom phase-out reforms, the savings nil-rate slice starts above
    both the reformed starting-rate limit and the actual starting-rate slice.
    This stacking preserves the full savings allowance and is a model
    convention for hypothetical reforms; current law has no phase-out knob.
