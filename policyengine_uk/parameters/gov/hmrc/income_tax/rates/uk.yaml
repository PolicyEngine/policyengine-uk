brackets:
- rate:
    description: The basic rate is the first of three tax brackets on all income,
      after allowances are deducted
    metadata:
      label: Basic rate
      reference:
      - href: https://www.legislation.gov.uk/ukpga/2022/3/section/2/enacted
        title: Finance Act 2022 s. 2 (a)
      unit: /1
    values:
      2015-04-01: 0.2
  threshold:
    description: The starting threshold for the basic rate, after allowances.
    metadata:
      reference:
      - title: Income Tax Act 2007, s. 6 (1)(b)
        href: https://www.legislation.gov.uk/ukpga/2007/3/section/6
    values:
      2015-04-05: 0
- rate:
    description: The higher rate is the middle tax bracket on earned income.
    metadata:
      label: Higher rate
      reference:
      - href: https://www.legislation.gov.uk/ukpga/2022/3/section/2/enacted
        title: Finance Act 2022 s. 2 (b)
      unit: /1
    values:
      2015-04-05: 0.4
  threshold:
    description: The lower threshold for the higher rate of income tax (and therefore
      the upper threshold of the basic rate)
    # The basic rate limit. Income Tax Act 2007 s21 indexes it by September CPI,
    # rounding the result up to a multiple of £100. Finance Act 2021 s5(1) and
    # (3)(a), as amended by Finance Act 2023 s5 and Finance Act 2026 s10, fixes
    # it at £37,700 and disapplies s21 for 2022-23 to 2030-31. From the tax year
    # after the last value below (2031-32),
    # policyengine_uk/parameters/gov/hmrc/create_threshold_indexation.py applies
    # s21 year by year, so this threshold has no uprating.
    metadata:
      label: Higher rate threshold
      period: year
      reference:
      - href: https://www.legislation.gov.uk/ukpga/2021/26/section/5
        title: Finance Act 2021 s. 5 (1)
      - href: https://www.legislation.gov.uk/ukpga/2007/3/section/21
        title: Income Tax Act 2007 s. 21 (indexation)
      unit: currency-GBP
    values:
      2015-04-05: 32000
      2017-04-01: 33500
      2018-04-01: 34500
      2019-04-01: 37500
      2020-04-01: 37500
      2021-04-01:
        value: 37700
        metadata:
          reference:
            - title: The Income Tax (Indexation) Order 2021 art 2
              href: https://www.legislation.gov.uk/uksi/2021/111/article/2/made
      2027-04-01:
        value: 37700
        metadata:
          reference:
            - title: Finance Act 2021 s. 5 (1), as amended by Finance Act 2023 s. 5 (2)
              href: https://www.legislation.gov.uk/ukpga/2023/1/section/5/enacted
      2030-04-01:
        value: 37700
        metadata:
          reference:
            - title: Finance Act 2021 s. 5 (1), as amended by Finance Act 2026 s. 10 (2)
              href: https://www.legislation.gov.uk/ukpga/2026/11/section/10
- rate:
    description: The additional rate is the highest tax bracket, with no upper bound
    metadata:
      label: Additional rate
      reference:
      - href: https://www.legislation.gov.uk/ukpga/2022/3/section/2/enacted
        title: Finance Act 2022 s. 2 (c)
      tests:
      - decreases_net_income: true
        period: 2022
      unit: /1
    values:
      2015-04-05: 0.45
  threshold:
    description: The lower threshold for the additional rate
    metadata:
      label: Additional rate threshold
      period: year
      reference:
      - href: https://www.legislation.gov.uk/ukpga/2022/3/section/2/enacted
        title: Finance Act 2022 s. 2
      unit: currency-GBP
    values:
      2015-04-05: 150_000
      2023-01-01:
        value: 125_140
        reference:
          - title: Finance Act 2023 s. 6 (4)
            href: https://www.legislation.gov.uk/ukpga/2023/1/section/6/enacted
      2030-04-01:
        value: 125_140
        metadata:
          reference:
            - title: OBR Economic and Fiscal Outlook November 2025
              href: https://obr.uk/efo/economic-and-fiscal-outlook-november-2025/
- rate:
    description: An extra tax bracket.
    metadata:
      label: Extra tax bracket rate
      unit: /1
    values:
      2015-04-05: 0.45
  threshold:
    description: The lower threshold for the extra bracket rate.
    metadata:
      label: Extra tax bracket threshold
      period: year
      unit: currency-GBP
    values:
      2015-04-05: 10_000_000
description: Income Tax scale.
metadata:
  label: Income Tax main rates
  rate_unit: /1
  reference:
  - href: https://www.legislation.gov.uk/ukpga/2022/3/section/2/enacted
    title: Finance Act 2022 s. 2
  threshold_period: year
  threshold_unit: currency-GBP
  type: marginal_rate
