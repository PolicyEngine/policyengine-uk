description: Charges to Income Tax added at Step 7 of the Income Tax calculation, after the tax reductions, so tax reductions do not offset them. The winter fuel payment charge is also a Step 7 amount, added separately in income_tax after income_tax_before_winter_fuel_payment_charge to avoid the cycle through benefit means tests. This list holds the other modelled Step 7 charges; it does not cover every provision in section 30.
metadata:
