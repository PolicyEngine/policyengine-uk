description: Whether the merged research and development scheme applies. From accounting periods beginning on 1 April 2024 a company claims the merged R&D expenditure credit unless it is a loss-making R&D intensive SME, which claims enhanced R&D intensive support instead; before then every SME claimed under the SME scheme and large companies claimed the R&D expenditure credit.
