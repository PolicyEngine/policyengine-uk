description: Payable research and development tax credit for a loss-making R&D intensive small or medium-sized enterprise, as a share of its surrenderable loss. From April 2024 it is the enhanced R&D intensive support credit under section 1058(1)(a) of the Corporation Tax Act 2009. Before April 2023 there was no separate intensive rate, so the general SME rate is repeated.
values:
  2015-04-01:
    value: 0.145
    metadata:
      reference:
        - title: Corporation Tax Act 2009 s 1058(1)(a) as at 1 April 2020 (14.5% for every loss-making SME)
          href: https://www.legislation.gov.uk/ukpga/2009/4/section/1058/2020-04-01
  2023-04-01:
    value: 0.145
    metadata:
      reference:
        - title: Finance Act 2024 Sch 1 para 21(1) and (2) (14.5% for an R&D intensive SME, as if the cut to 10% had not been made, for periods ending on or after 1 April 2023)
          href: https://www.legislation.gov.uk/ukpga/2024/3/schedule/1/paragraph/21
  2024-04-01:
    value: 0.145
    metadata:
      reference:
        - title: Corporation Tax Act 2009 s 1058(1)(a) (14.5% of the Chapter 2 surrenderable loss)
          href: https://www.legislation.gov.uk/ukpga/2009/4/section/1058
