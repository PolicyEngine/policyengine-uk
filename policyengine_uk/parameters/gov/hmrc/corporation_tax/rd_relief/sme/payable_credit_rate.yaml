description: Payable research and development tax credit for a loss-making small or medium-sized enterprise that is not R&D intensive, as a share of its surrenderable loss, under section 1058(1)(a) of the Corporation Tax Act 2009. From April 2024 such a company claims the merged scheme credit instead, so the rate no longer applies.
