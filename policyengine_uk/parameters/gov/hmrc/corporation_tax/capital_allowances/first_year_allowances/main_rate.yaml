description: First-year allowance rate under section 45U of the Capital Allowances Act 2001 on new and unused main-rate plant and machinery that full expensing does not cover, as a share of the expenditure. Companies and unincorporated businesses can claim it, including for plant bought for leasing; cars and second-hand assets are excluded.
