metadata:
  unit: /1
  period: year
  label: Main-rate first-year allowance rate
  # The rate applies to expenditure incurred on or after 1 January, but the
  # model gives each April to March year the rate in force on 30 April, its
  # usual fiscal-year sample: 0 in 2025, 40% in 2026 and 50% from 2027. The
  # first quarter of each calendar year at the new rate is not modelled.
  # Day-weighting is avoided because spend under the first-year allowance
  # leaves the pool for the year, so a blended rate would misstate the pool.
  reference:
    - title: Capital Allowances Act 2001 s 45U
      href: https://www.legislation.gov.uk/ukpga/2001/2/section/45U
    - title: HMRC policy paper, Capital allowances - new first year allowance and reducing main rate writing down allowances (Budget 2025)
      href: https://www.gov.uk/government/publications/new-first-year-allowance-and-main-rate-of-writing-down-allowances/capital-allowances-new-first-year-allowance-and-reducing-main-rate-writing-down-allowances
