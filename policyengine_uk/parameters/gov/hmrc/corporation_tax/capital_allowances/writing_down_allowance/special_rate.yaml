          href: https://www.legislation.gov.uk/ukpga/2019/1/section/31
  2019-04-01:
    value: 0.06
    metadata:
      reference:
        - title: Finance Act 2019 s 31(2) and (8)(a) (8% to 6% for chargeable periods beginning on or after 1 April 2019 for corporation tax)
          href: https://www.legislation.gov.uk/ukpga/2019/1/section/31
        - title: Capital Allowances Act 2001 s 104D(1)
          href: https://www.legislation.gov.uk/ukpga/2001/2/section/104D
