description: Main rate of corporation tax charged on a company's taxable total profits. From the financial year 2023 it applies in full only where augmented profits exceed the upper limit; before then it was the single rate on all non-ring-fence profits. Values are dated from the 1 April start of each financial year and cover the financial year 2015 onwards.
values:
