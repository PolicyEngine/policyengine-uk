metadata:
  type: single_amount
  threshold_unit: currency-GBP
  amount_unit: currency-GBP
  # Not uprated by September CPI: the surcharge is not an amount in the Social
  # Security Administration Act 1992 s150 review. Keeps the lagged calendar-year
  # CPI projection it had through gov.benefit_uprating_cpi until its own basis
  # is modelled.
  uprating: gov.economic_assumptions.indices.obr.lagged_cpi
  label: High Value Council Tax Surcharge
  reference:
