description: High Value Council Tax Surcharge on owners of residential property in England worth £2 million or more in 2026 prices.

brackets:
  - threshold:
      2028-01-01: 0
    amount:
      2028-01-01: 0
  - threshold:
      2028-01-01: 2_000_000
    amount:
      2028-01-01: 2_500
  - threshold:
      2028-01-01: 2_500_000
