description: Business rates relief for occupied pubs and live music venues in England, as a share of the rates bill left after other reliefs.
# 15% for 2026-27; Budget 2026 raises it to 35% for 2027-28 and 2028-29
# (BRIL 8/2026 Annex para 6(a)). Nothing yet sets the relief from 2029-30, so
# it is 0 from 2029-04-01. Social clubs are covered from 2027-28 but are not
# separately flagged here.
values:
  2023-04-01: 0
  2026-04-01:
    value: 0.15
