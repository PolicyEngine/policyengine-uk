description: Mandatory charitable rate relief in England, as a share of the rates bill, for property occupied by a charity and used wholly or mainly for charitable purposes.
# The ratepayer pays one fifth of the bill. Private schools in England are
# excluded (Sch 4ZA para 2(3)); not modelled.
