description: Mandatory charitable rate relief in England, Wales and Scotland, as a share of the rates bill, for property occupied by a charity and used wholly or mainly for charitable purposes.
# The ratepayer pays one fifth of the bill in England, Wales and Scotland.
# Private and independent schools are excluded (England Sch 4ZA para 2(3),
# Wales para 2A, Scotland 1962 Act s.4(9)); not modelled.
values:
  # From 1 April 1990 the charge was A x B / (C x 5), one fifth of the full
  # bill (LGFA 1988 s.43(5)-(6) as enacted). Schedule 4ZA para 2 restates the
  # same one-fifth formula from 1 April 2024 (Non-Domestic Rating Act 2023).
  1990-04-01:
    value: 0.8
    metadata:
      reference:
        - title: Local Government Finance Act 1988 s.43(5) and (6), as enacted (chargeable amount A x B / (C x 5) for a charity)
          href: https://www.legislation.gov.uk/ukpga/1988/41/section/43/enacted
