description: For qualifying retail, hospitality and leisure (RHL) properties, small business rate relief tapers linearly from 100% at the RHL full relief threshold to 0% at this rateable value in England.
# Raised to £21,000 from 1 April 2027 "until 31/3/29" (BRIL 8/2026 Annex
# para 5(b)); the 2029-04-01 value restores the general threshold.
values:
  2017-04-01: 15_000
  2027-04-01: 21_000
  2029-04-01: 15_000
