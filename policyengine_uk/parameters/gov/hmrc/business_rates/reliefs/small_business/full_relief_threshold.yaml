description: Properties with rateable value at or below this amount get 100% small business rate relief in England, other than qualifying retail, hospitality and leisure (RHL) properties.
values:
  2017-04-01: 12_000
metadata:
  label: Small business rate relief full relief threshold
  unit: currency-GBP
  period: year
  reference:
    - title: Local Government Finance Act 1988 Schedule 4ZA para 4 (small business rate relief, conditions prescribed by the Secretary of State)
      href: https://www.legislation.gov.uk/ukpga/1988/41/schedule/4ZA
    - title: The Non-Domestic Rating (Reliefs, Thresholds and Amendment) (England) Order 2017 art 3 (full relief at £12,000 or less, tapered relief above £12,000 and up to £15,000, from 1 April 2017)
      href: https://www.legislation.gov.uk/uksi/2017/102/article/3/made
    - title: GOV.UK, Small business rate relief (100% at £12,000 or less, tapering to 0% at £15,000; 50% at £13,500)
      href: https://www.gov.uk/apply-for-business-rate-relief/small-business-rate-relief
