description: Retail, hospitality and leisure (RHL) relief in England, as a share of the rates bill left after mandatory reliefs.
# Earlier schemes (before 2023-24) are not encoded; the model backdates the
# 2023-24 value to those years. The relief ended on 31 March 2026,
# when the RHL multipliers replaced it.
