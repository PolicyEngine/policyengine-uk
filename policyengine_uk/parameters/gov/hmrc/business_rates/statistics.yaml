  # A Northern Ireland rate bill is the regional rate, made by the Department
  # of Finance, plus the council's district rate, levied "as if they were
  # items of a single rate" (Rates (Northern Ireland) Order 1977, art 9(1)).
  # This series counts payments of both, as allocated to non-domestic
  # ratepayer accounts by 31 March (mixed domestic and non-domestic
  # properties included). Of the £1.59bn of rates that Land & Property
  # Services paid into the NI Consolidated Fund in 2024-25, councils received
  # £0.81bn as district rates (Public Income and Expenditure Account
  # 2024-25, note 6).
  # The OBR's "Northern Ireland business rates" line that projects this series
  # is about half its level, £382m against £741m in 2024-25, and appears to
  # cover the regional rate only, though the OBR's tables do not define it:
  # - ONS records NI regional non-domestic rates (central government, £327m
  #   in 2024-25) and district non-domestic rates (local government, £378m)
  #   separately (Country and regional public sector finances, financial year
  #   ending 2025).
  # - Splitting each council's 2024-25 payments by its regional (29.02p) and
  #   district (25.57p to 38.22p) poundages estimates the regional part at
  #   £364m. This is an estimate, not a published split.
  # We found no published forecast of NI district non-domestic rates, so the
  # district part is assumed to grow with the OBR's regional line.
  NORTHERN_IRELAND:
    description: >-
      Non-domestic rates paid against ratepayer accounts by the end of the
      rating year, Northern Ireland, regional and district rates together.
      The series starts in 2020-21 (a rates-holiday year), and 2015-16 to
      2019-20 take that value.
    values:
      2020-01-01: 380_876_615
      2021-01-01: 446_688_825
      2022-01-01: 609_651_544
      2023-01-01: 702_804_905
      2024-01-01: 741_337_437
      2025-01-01: 766_153_718
    metadata:
      unit: currency-GBP
      label: Business rates paid, Northern Ireland
      uprating: gov.economic_assumptions.indices.obr.business_rates.northern_ireland
      reference:
        - title: Land & Property Services (OpenDataNI), Rates paid by District Council and Sector, "Non-Domestic Rates collected by District Council" (2020-21 to 2025-26)
          href: https://www.opendatani.gov.uk/dataset/rates-paid-by-district-council-and-sector
