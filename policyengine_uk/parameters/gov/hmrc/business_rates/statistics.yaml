description: Business rates (non-domestic rates) statistics.
metadata:
  economy: false
  propagate_metadata_to_children: true
# Non-domestic rates paid in each nation, on the headline outturn measure each
# government publishes:
# - England and Wales: the local rating lists, which councils bill and
#   collect for the retention scheme or national pool (after reliefs), plus
#   the central rating lists (mostly extensive holdings of industries that
#   span several authorities), whose rates are paid to the Secretary of State
#   or the Welsh Government instead.
# - Scotland: the contributable amount, councils' nominal contribution to the
#   national non-domestic rates pool.
# - Northern Ireland: non-domestic rates paid to Land & Property Services,
#   which levies the regional rate and each council's district rate as one
#   bill.
# business_rates allocates all of it by shareholding, a modelling convention
# that applies to every ratepayer on the lists, including, on the Welsh
# central list in 2024-25, Network Rail (£10.5m) and Dwr Cymru (£17.0m) of
# £104.7m.
# Dates are the first calendar year of each fiscal year (2025-01-01 =
# 2025-26). The latest year of each series is provisional where the source
# says so. The England, Scotland and Wales series sum to £32.69bn in 2024-25,
# against £32.38bn on the OBR's Business rates line (cash basis, March 2026
# EFO, receipts Table 3.8), and to £31.06bn in 2023-24, against £29.60bn
# (March 2025 EFO): England's local-list income is an accounting measure,
# the OBR line cash.
#
# After its latest outturn year each series is projected by uprating with the
# OBR's receipts forecast: England, Scotland and Wales with the OBR's
# "Business rates" line, Northern Ireland with its "Northern Ireland business
# rates" line (gov.economic_assumptions.yoy_growth.obr.business_rates), which
# appears to cover the regional rate only (see NORTHERN_IRELAND below). The
# economic-assumption indices run to 2039, so every series is flat in cash
# terms from 2039-40.
