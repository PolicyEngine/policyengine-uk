description: Business rates (non-domestic rates) statistics.
metadata:
  economy: false
  propagate_metadata_to_children: true
# Non-domestic rates in each nation, on the headline outturn measure each
# government publishes. For England, Scotland and Wales that is the amount
# councils collect after reliefs for the retention scheme or national pool;
# for Northern Ireland it is the non-domestic rates Land & Property Services
# received in the rating year. Dates are the first calendar year of each
# fiscal year (2025-01-01 = 2025-26). The latest year of each series is
# provisional where the source says so.
#
# After its latest outturn year each series is projected by uprating with the
# OBR's receipts forecast: England, Scotland and Wales with the OBR's
# "Business rates" line, and Northern Ireland with its "Northern Ireland
# business rates" line (gov.economic_assumptions.yoy_growth.obr.business_rates).
revenue:
  description: Total revenue raised by business rates.
  ENGLAND:
    description: Non-domestic rating income from the business rates retention scheme, England.
