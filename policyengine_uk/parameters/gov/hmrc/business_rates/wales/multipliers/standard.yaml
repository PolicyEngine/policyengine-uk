description: Non-domestic rating multiplier for Wales; from 2026-27 the standard multiplier, paid by properties that pay neither the retail nor the higher multiplier.
# Before 2026-27 one multiplier applied to every property in Wales.
values:
  2023-04-01: 0.535
  2024-04-01: 0.562
  2025-04-01: 0.568
  2026-04-01: 0.502
metadata:
  label: Wales standard non-domestic rating multiplier
  unit: /1
  period: year
