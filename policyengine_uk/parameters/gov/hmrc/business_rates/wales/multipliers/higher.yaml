description: Higher non-domestic rating multiplier in Wales, for properties with rateable value above the higher multiplier threshold.
# Before 2026-27 this equals the single Welsh multiplier, and the threshold
# is infinite, so it has no effect. From 1 April 2027 WSI 2026/133 raises
# it to 1.042 times the standard multiplier; 2027-28 values are not set yet
# and the 2026-27 value carries forward.
values:
  2023-04-01: 0.535
  2024-04-01: 0.562
  2025-04-01: 0.568
  2026-04-01: 0.515
metadata:
  label: Wales higher non-domestic rating multiplier
  unit: /1
  period: year
  reference:
    - title: Welsh Government written statement, Non-domestic rates support 2026-27 (higher multiplier 0.515)
      href: https://gov.wales/written-statement-non-domestic-rates-support-2026-27
    - title: Business Wales, Non-domestic rates multipliers 2026-27 (higher multiplier 0.515 above £100,000)
      href: https://businesswales.gov.wales/non-domestic-rates-multipliers
    - title: The Non-Domestic Rating (Value of Differential Multipliers) (Wales) Regulations 2026 (WSI 2026/39), reg 2 (higher multiplier 1.026 times the standard)
      href: https://www.legislation.gov.uk/wsi/2026/39/made
