description: The UK levies General Betting Duty at this rate on qualifying remote fixed-odds bets other than bets wholly related to UK horse racing. The new remote rate excludes pool, spread and on-course bets and qualifying licensed-premises self-service betting terminals.
values:
  '2014-12-01': 0.15
  '2027-04-01': 0.25
