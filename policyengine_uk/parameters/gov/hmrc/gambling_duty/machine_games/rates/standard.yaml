description: The UK levies Machine Games Duty at this rate on dutiable net takings from machines outside the lower-rate class on which every dutiable game costs at most GBP 5, and, from 1 April 2027, at most GBP 1 with a maximum prize of at most GBP 100.
values:
  '2013-02-01': 0.2
