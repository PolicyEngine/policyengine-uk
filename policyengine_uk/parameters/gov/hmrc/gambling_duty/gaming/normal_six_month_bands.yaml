description: The UK applies these marginal Gaming Duty rates to gross gaming yield from registered casino premises in a normal six-month accounting period, with thresholds measured over that six-month period. This operator catalogue excludes unregistered gaming and alternative-period adjustments. Household calculations do not use it, so changing these bands leaves household casino duty unchanged; see household.consumption.gambling.casino_effective_rate.
