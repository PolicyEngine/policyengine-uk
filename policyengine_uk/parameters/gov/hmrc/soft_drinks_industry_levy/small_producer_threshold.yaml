description: A producer whose chargeable soft drinks, with those of connected persons, do not exceed this many litres in a year is a small producer and pays no soft drinks industry levy.
# The levy is not charged before 2018-04-06 (its rate is 0), so the threshold
# states a zero before then.
values:
  0000-01-01: 0
  2018-04-06: 1_000_000
metadata:
  unit: /1
  period: year
  label: Soft drinks industry levy small producer threshold (litres)
  reference:
    - title: Finance Act 2017 s.37
      href: https://www.legislation.gov.uk/ukpga/2017/10/section/37
    - title: Finance Act 2017 s.38
      href: https://www.legislation.gov.uk/ukpga/2017/10/section/38
