description: Assumed minimum share of Child Benefit recovered by the High Income
  Child Benefit Charge at which a registered, opted-out family continues to forgo
  payment. The default of one assumes opt-outs persist only while fully charged.
  This is a behavioural modelling assumption, not a statutory eligibility rule.
  Microcosm selects fully charged families first and can use the taper for any
  remaining opt-out target; this threshold does not reproduce that fallback draw.
values:
  0001-01-01: 1
