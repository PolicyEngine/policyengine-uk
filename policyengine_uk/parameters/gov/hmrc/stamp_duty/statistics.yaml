description: Stamp Duty Land Tax statistics (England and Northern Ireland).
metadata:
  economy: false
  propagate_metadata_to_children: true
# HMRC's buyer-type tables split SDLT transactions at £40,000 or above between
# individuals (household) and other buyers (corporate): non-natural persons
# such as companies, partnerships and collective investment schemes. Receipts
# and values are in £ (published in £m, rounded to the nearest £5m); 2024-25
# figures are from the edition published in December 2025 and corrected in
# March 2026 (the correction does not touch Tables 8a or 8b). Dates are the
# first calendar year of each fiscal year (2024-01-01 = 2024-25).
#
# Revenue after 2024-25 is projected by uprating: each revenue series grows
# with the OBR's receipts for its property type
# (gov.economic_assumptions.yoy_growth.obr.stamp_duty_land_tax), holding each
# buyer type's 2024-25 share of that property type's receipts. The OBR's
# 2024-25 outturn equals HMRC's all-buyer totals here (£10,380m residential,
# £3,505m non-residential), so the projection is that share times the OBR
# forecast. Holding the 2024-25 shares means the projection ignores later
# policy or market changes that fall unevenly on buyer types. Transactions
# and values are outturn only. corporate_sdlt allocates the corporate receipts
# to UK households by shareholding, a modelling convention: HMRC's "other
# buyers" are all non-natural persons, including partnerships and collective
# investment schemes as well as companies.
