description: Maximum value for a first-property purchase to receive the Stamp Duty relief for first-time buyers. Increasing this value will underestimate the number of claims for FTBR, as the model will not add new claims.
values:
  2018-03-15: 500_000
  2020-07-08:
    value: 0
    metadata:
      note: The Stamp Duty Land Tax (Temporary Relief) Act 2020 omits the relief for the initial temporary relief period, so no purchase qualifies and first-time buyers pay the main rates.
      reference:
        - title: Stamp Duty Land Tax (Temporary Relief) Act 2020 s. 1(1), (5)
          href: https://www.legislation.gov.uk/ukpga/2020/15/section/1
  2021-07-01:
    value: 500_000
    metadata:
      reference:
        - title: Stamp Duty Land Tax (Temporary Relief) Act 2020 s. 1(1)(b), as amended by Finance Act 2021 s. 87(2)(a)
          href: https://www.legislation.gov.uk/ukpga/2020/15/section/1
        - title: Finance Act 2003 schedule 6ZA(1)(3)
          href: https://www.legislation.gov.uk/ukpga/2003/14/schedule/6ZA
  2022-09-23: 625_000
  2025-04-01: 500_000
metadata:
