description: Whether HMRC charges an ordinary residential purchase one percentage of the whole price, using the band the price falls in. When false, HMRC charges each band's rate on the slice of the price in that band.
values:
  0000-01-01: false
  2003-12-01: true
  2014-12-04: false
metadata:
  unit: bool
  label: Stamp Duty on residential purchases charged on the whole price
