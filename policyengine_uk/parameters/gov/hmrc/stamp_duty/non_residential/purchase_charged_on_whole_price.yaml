          href: https://www.legislation.gov.uk/ukpga/2003/14/section/55/2015-04-30
  2016-03-17:
    value: false
    metadata:
      reference:
        - title: Finance Act 2016 s. 127(12)
          href: https://www.legislation.gov.uk/ukpga/2016/24/section/127/enacted
