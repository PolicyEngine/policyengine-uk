description: A VAT-registered business may cancel its registration when the value of its taxable supplies (excluding VAT) in the next 12 months is expected to be no more than this threshold.
values:
  2010-04-01: 68_000
  2011-04-01: 71_000
  2012-04-01: 75_000
  2013-04-01: 77_000
  2014-04-01: 79_000
  2015-04-01: 80_000
  2016-04-01: 81_000
  2017-04-01: 83_000
  2024-04-01: 88_000
metadata:
  unit: currency-GBP
  period: year
  label: VAT deregistration threshold
  reference:
