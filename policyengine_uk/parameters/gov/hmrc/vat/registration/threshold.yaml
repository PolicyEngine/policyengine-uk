description: A business must register for VAT when the value of its taxable supplies (standard-, reduced- and zero-rated, excluding VAT) over the previous 12 months exceeds this threshold.
values:
  2010-04-01: 70_000
  2011-04-01: 73_000
  2012-04-01: 77_000
  2013-04-01: 79_000
  2014-04-01: 81_000
  2015-04-01: 82_000
  2016-04-01: 83_000
  2017-04-01: 85_000
  2024-04-01: 90_000
