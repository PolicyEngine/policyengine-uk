metadata:
  unit: /1
  period: year
  label: VAT rate on domestic electricity, Great Britain
  reference:
    - title: Value Added Tax Act 1994, Schedule 7A, Group 1
      href: https://www.legislation.gov.uk/ukpga/1994/23/schedule/7A
    - title: The Value Added Tax (Supplies of Domestic Electricity) Order 2026 (SI 2026/987)
      href: https://www.legislation.gov.uk/uksi/2026/987/contents/made
  # Liability follows the date the electricity is consumed (Revenue and
  # Customs Brief 10 (2026)). Day-weighting the fiscal year assumes equal
  # daily use: FY 2026-27 has 178 days at 5% and 187 at 0%, and FY 2027-28
  # has 86 days at 0% and 280 at 5%.
  fiscal_year_blend: true
