          href: https://www.legislation.gov.uk/uksi/2026/987/contents/made
        - title: HMRC Revenue and Customs Brief 10 (2026)
          href: https://www.gov.uk/government/publications/revenue-and-customs-brief-10-2026-temporary-zero-rate-of-vat-for-domestic-electricity-in-great-britain/temporary-zero-rate-of-vat-for-domestic-electricity-in-great-britain
  # SI 2026/987 ends the zero rate on 31 March 2027. Budget 2026 extends it
