  label: Domestic fuel and power share of household spending
  reference:
    - title: ONS Consumer trends, 04.5 Electricity, gas and other fuels, current prices, not seasonally adjusted (ADFX), release of 30 September 2026
      href: https://www.ons.gov.uk/economy/nationalaccounts/satelliteaccounts/timeseries/adfx/ct
    - title: ONS, Household final consumption expenditure, domestic concept, current prices (ABQI)
      href: https://www.ons.gov.uk/economy/nationalaccounts/satelliteaccounts/timeseries/abqi/ukea
    - title: OBR, VAT ("Around 2.5 per cent of expenditure is taxed at this reduced rate")
      href: https://obr.uk/forecasts-in-depth/tax-by-tax-spend-by-spend/vat/
  # ADFX / ABQI by calendar year. From 2006 the share is 2.49% or more,
  # against the OBR's 2.5% reduced-rate share, so domestic fuel and power
  # accounts for all of it to within rounding and the non-energy remainder
  # (children's car seats, smoking-cessation products and similar) is too
  # small to separate from published totals.
