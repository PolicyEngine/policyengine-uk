description: Under the VAT partial exemption simplified de minimis test, all input tax is recoverable where total input tax less input tax used exclusively for taxable supplies averages no more than this amount a month, and exempt supplies are within the exempt supplies share.
values:
  2010-04-01: 625
metadata:
  label: VAT partial exemption simplified de minimis monthly limit
  unit: currency-GBP
  period: month
