description: Flat rate percentage for the "any other activity not listed elsewhere" business category of the VAT flat rate scheme, used when a firm's sector rate is not supplied.
values:
  # Regulation 55K's table was substituted from 4 January 2011 (SI 2010/2940
  # reg 4), with the 20% standard rate; later 2020-21 amendments changed only
  # temporary hospitality rows. Earlier values for this row are not encoded,
  # so the model applies 12% before 2011.
  2011-01-04:
    value: 0.12
