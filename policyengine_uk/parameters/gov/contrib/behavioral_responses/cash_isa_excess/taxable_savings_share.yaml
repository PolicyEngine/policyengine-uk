description: >
  Share of cash ISA subscriptions above the person's cash limit that they hold
  in taxable savings instead, where the interest is taxed. What neither this
  nor the stocks-and-shares ISA share covers goes to other uses, such as
  spending, pensions or repaying debt, which the model does not follow. It is
  zero by default, as neither HMRC nor the OBR has published a split.
values:
  2000-01-01: 0
