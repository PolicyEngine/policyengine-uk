description: >
  Share of cash ISA subscriptions above the person's cash limit that they pay
  into stocks-and-shares ISAs instead, as far as the annual subscription limit
  leaves room; any part it leaves no room for is held in taxable savings. The
  money is taken to be invested: uninvested cash in a stocks-and-shares ISA
  would pay the charge on non-cash ISA cash interest, which this does not add.
  It is zero by default, as neither HMRC nor the OBR has published a split.
values:
  2000-01-01: 0
