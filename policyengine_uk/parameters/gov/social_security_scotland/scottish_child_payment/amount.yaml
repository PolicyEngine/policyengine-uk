description: Weekly amount of Scottish Child Payment per eligible child.
values:
  0001-01-01: 0
  2021-02-15: 10
  2022-04-01: 20
  2022-11-14: 25
  2024-04-01: 26.70
  2025-04-01: 27.15
  2026-04-01: 28.20
  # Project from the last published rate. The January 2026 SFC forecasts
  # for 2027-30 predate the September 2026 CPI outturn and are superseded
  # here by the September-CPI projection, not treated as announced rates.
metadata:
  unit: currency-GBP
  period: week
  label: Scottish Child Payment weekly amount
  # September CPI and nearest-5p rounding follow Scottish Ministers' current
  # policy; s86A leaves the choice of relevant prices to Ministers.
  # Apply each year's rise to the previous rounded rate each April.
  uprating:
    parameter: gov.benefit_uprating_cpi
    at_defined_interval:
      start: "0001-01-01"
      end: "0002-01-01"
      enactment: "0002-04-01"
    rounding:
      type: nearest
      interval: 0.05
  reference:
    - title: Social Security (Scotland) Act 2018, section 86A (relevant prices chosen by Scottish Ministers)
      href: https://www.legislation.gov.uk/asp/2018/9/section/86A
    - title: Social Security Assistance in Scotland - up-rating for inflation 2026-2027, sections 2 and 3 (September CPI and nearest 5p)
      href: https://www.gov.scot/publications/social-security-assistance-scotland-up-rating-inflation-2026-27/pages/3/
    - title: The Scottish Child Payment Regulations 2020, Regulation 20
      href: https://www.legislation.gov.uk/ssi/2020/351/regulation/20
    - title: Scottish Government - Scottish Child Payment
      href: https://www.gov.scot/policies/social-security/scottish-child-payment/
