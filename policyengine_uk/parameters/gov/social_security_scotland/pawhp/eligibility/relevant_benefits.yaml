      - is_on_universal_credit
    reference:
      - title: The Social Security (Miscellaneous Amendment) (Scotland) Regulations 2025 (SSI 2025/195), reg. 9(2)
        href: https://www.legislation.gov.uk/ssi/2025/195/regulation/9/made
      - title: The Winter Heating Assistance (Pension Age) (Scotland) Regulations 2024 (SSI 2024/351), reg. 2 "relevant benefit" and reg. 2A (as amended)
