  2024-01-01:
    value: true
    reference:
      - title: The Winter Heating Assistance (Pension Age) (Scotland) Regulations 2024 (SSI 2024/351), reg. 5(a)(ii) and 7 (as made)
        href: https://www.legislation.gov.uk/ssi/2024/351/regulation/7/made
  # SSI 2025/282 came into force on 11 October 2025 and applies to the
  # qualifying week in September 2025 (its reg. 17 keeps the 2024 week on
  # the regulations as made).
  2025-01-01:
    value: false
    reference:
      - title: The Winter Heating Assistance (Pension Age) (Scotland) Amendment Regulations 2025 (SSI 2025/282), reg. 4, 5 and 17
        href: https://www.legislation.gov.uk/ssi/2025/282/made
