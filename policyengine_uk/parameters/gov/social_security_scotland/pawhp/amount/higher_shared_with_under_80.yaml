description: Pension Age Winter Heating Payment for an individual aged 80 or over who is not entitled to a relevant benefit and lives with another entitled individual, none of whom has reached 80. Applies from the 2025 qualifying week.
values:
  # SSI 2025/282 came into force on 11 October 2025 and applies to the
  # qualifying week in September 2025.
  2025-01-01:
    value: 203.40
    reference:
      - title: The Winter Heating Assistance (Pension Age) (Scotland) Amendment Regulations 2025 (SSI 2025/282), reg. 9 (new reg. 10(6)(b))
        href: https://www.legislation.gov.uk/ssi/2025/282/regulation/9/made
  2026-04-01:
    value: 211.15
    reference:
      - title: The Social Security (Up-rating) (Miscellaneous Amendments) (Scotland) Regulations 2026 (SSI 2026/170), reg. 15(3)(f)
        href: https://www.legislation.gov.uk/ssi/2026/170/regulation/15/made
metadata:
  unit: currency-GBP
  label: PAWHP shared amount 80 and over, living with under 80
  # September CPI and nearest-5p rounding follow Scottish Ministers' current
  # policy; s86A leaves the choice of relevant prices to Ministers.
  # Apply each year's rise to the previous rounded rate each April.
  uprating:
    parameter: gov.benefit_uprating_cpi
    at_defined_interval:
      start: "0001-01-01"
      end: "0002-01-01"
      enactment: "0002-04-01"
    rounding:
      type: nearest
      interval: 0.05
  reference:
    - title: Social Security (Scotland) Act 2018, section 86A (relevant prices chosen by Scottish Ministers)
      href: https://www.legislation.gov.uk/asp/2018/9/section/86A
    - title: Social Security Assistance in Scotland - up-rating for inflation 2026-2027, sections 2 and 3 (September CPI and nearest 5p)
      href: https://www.gov.scot/publications/social-security-assistance-scotland-up-rating-inflation-2026-27/pages/3/
