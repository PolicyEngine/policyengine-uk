        href: https://www.legislation.gov.uk/ssi/2025/282/regulation/9/made
  2026-04-01:
    value: 211.15
    reference:
      - title: The Social Security (Up-rating) (Miscellaneous Amendments) (Scotland) Regulations 2026 (SSI 2026/170), reg. 15(3)(f)
        href: https://www.legislation.gov.uk/ssi/2026/170/regulation/15/made
