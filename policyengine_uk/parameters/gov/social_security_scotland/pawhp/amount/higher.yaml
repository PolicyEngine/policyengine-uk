description: Pension Age Winter Heating Payment for an individual aged 80 or over, or entitled to a relevant benefit with a partner aged 80 or over, unless (from the 2025 qualifying week) they are not entitled to a relevant benefit and live with another entitled individual.
values:
  2024-01-01:
    value: 300
    reference:
      - title: The Winter Heating Assistance (Pension Age) (Scotland) Regulations 2024 (SSI 2024/351), reg. 10(a) and (b) (as made)
        href: https://www.legislation.gov.uk/ssi/2024/351/regulation/10/made
  2025-04-01:
    value: 305.10
    reference:
      - title: The Social Security (Up-rating) (Miscellaneous Amendments) (Scotland) Regulations 2025 (SSI 2025/100), reg. 15(a) and (b)
        href: https://www.legislation.gov.uk/ssi/2025/100/regulation/15/made
      - title: The Winter Heating Assistance (Pension Age) (Scotland) Amendment Regulations 2025 (SSI 2025/282), reg. 9 (new reg. 10(4)(a) and (6)(a))
        href: https://www.legislation.gov.uk/ssi/2025/282/regulation/9/made
  2026-04-01:
    value: 316.70
    reference:
      - title: The Social Security (Up-rating) (Miscellaneous Amendments) (Scotland) Regulations 2026 (SSI 2026/170), reg. 15(3)(a) and (e)
        href: https://www.legislation.gov.uk/ssi/2026/170/regulation/15/made
metadata:
  unit: currency-GBP
  label: PAWHP higher (80+) amount
  # September CPI and nearest-5p rounding follow Scottish Ministers' current
  # policy; s86A leaves the choice of relevant prices to Ministers.
  # Apply each year's rise to the previous rounded rate each April.
  uprating:
    parameter: gov.benefit_uprating_cpi
    at_defined_interval:
      start: "0001-01-01"
      end: "0002-01-01"
      enactment: "0002-04-01"
    rounding:
      type: nearest
      interval: 0.05
  reference:
    - title: Social Security (Scotland) Act 2018, section 86A (relevant prices chosen by Scottish Ministers)
      href: https://www.legislation.gov.uk/asp/2018/9/section/86A
    - title: Social Security Assistance in Scotland - up-rating for inflation 2026-2027, sections 2 and 3 (September CPI and nearest 5p)
      href: https://www.gov.scot/publications/social-security-assistance-scotland-up-rating-inflation-2026-27/pages/3/
