    - title: Social Security (Scotland) Act 2018 s. 86B (duty to uprate assistance)
      href: https://www.legislation.gov.uk/asp/2018/9/section/86B
    - title: Social Security Assistance in Scotland - up-rating for inflation in 2026-27, section 2.1 (12 months to September CPI, rounded to the nearest five pence)
      href: https://www.gov.scot/publications/social-security-assistance-scotland-up-rating-inflation-2026-27/pages/3/
