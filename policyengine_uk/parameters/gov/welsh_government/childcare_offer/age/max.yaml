description: The Childcare Offer for Wales funds childcare for children younger than this age.
metadata:
  unit: year
  period: year
  label: Childcare Offer for Wales maximum child age
  reference:
    - title: Welsh Government, Childcare Offer for Wales guidance for local authorities, version 8.3 (April 2026), paragraphs 48, 49 and 54
      href: https://www.gov.wales/sites/default/files/publications/2026-04/childcare-offer-for-wales-guidance-for-local-authorities-april-2026-english_0.pdf
values:
  # The child must be aged 3 or 4 (para 48) and stops qualifying on becoming
  # eligible for a full-time school place, usually the September after the
  # fourth birthday (para 54). The annual model counts a child until age 5.
  2019-08-01: 5
