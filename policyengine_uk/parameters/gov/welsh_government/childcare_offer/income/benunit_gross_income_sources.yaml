description: The Childcare Offer for Wales counts these benefit-unit benefits towards each parent's gross income for its £100,000 limit, shared equally between the claimant and any partner.
metadata:
  unit: list
  period: year
  label: Childcare Offer for Wales benefit-unit gross income sources
  reference:
    - title: Welsh Government, The Childcare Offer for Wales, Assessing parents' income to determine eligibility for the Offer, version 1 (July 2020), questions 8 and 9
      href: https://www.gov.wales/sites/default/files/publications/2023-04/atisn17333doc1.pdf#page=7
values:
  # Question 9 counts all unearned income. These benefits are paid to the
  # benefit unit, not to one parent, while the limit applies per parent; the
  # model shares each equally between the claimant and any partner, so a lone
  # parent counts all of it. None of them reads the Childcare Offer, so
  # counting them creates no dependency cycle.
  2019-08-01:
    - child_benefit
    - universal_credit
    - child_tax_credit
    - working_tax_credit
    - housing_benefit
    - income_support
    - pension_credit
    - esa_income
    - jsa_income
