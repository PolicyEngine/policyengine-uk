description: >
  Household capital counted for the council tax reduction capital limit and
  tariff income, outside the Pension Credit and Universal Credit routes. Every
  scheme counts the whole of the applicant's capital unless a schedule
  disregards it, including land and property other than the home: the
  prescribed requirements for pensioners in England (Schedule 1 paragraph
  31(1)) and Wales (Schedule 1 paragraph 25(1)), the Welsh working-age rules
  (Schedule 6 paragraph 26(1)), the English default scheme (paragraph 63(1)),
  the Scottish pension-age scheme (regulation 41(1)) and the Scottish
  working-age schemes (SSI 2012/303 regulation 43(1) to 31 March 2022, then
  SSI 2021/249 regulations 67 and 69). `main_residence_value` is left out
  because the home is disregarded. `corporate_wealth` is also left out for
  now: in the data it is mostly imputed pension wealth, which the schemes
  disregard, and it cannot yet be separated (issue 1936). Land and property
  are valued less sale expenses (`sale_expenses`).
