description: >
  Share of the current market or surrender value deducted from council tax
  reduction capital where there would be expenses attributable to sale. It is
  a flat 10% whatever the actual costs. The amount of any encumbrance secured
  on the asset is also deducted, but the data cannot identify debt secured on
  property other than the home, so that deduction is not modelled.
values:
  2013-04-01: 0.1
