description: >
  Share of the current market or surrender value deducted from council tax
  reduction capital where there would be expenses attributable to sale. It is
  a flat 10% whatever the actual costs, taken from the market value before
  any encumbrance secured on the asset is deducted (DMG 29624). The
  encumbrance is then deducted where an asset-specific secured-debt input
  exists (other residential and non-residential property); those inputs
  default to nil because the survey does not record them.
values:
  2013-04-01: 0.1
