description: >
  Council tax reduction capital sources whose sale would incur expenses, so
  that they are valued at 90% of market value. Real property always has costs
  of sale (R(IS) 21/93, as DMG 29622 applies it to the identically worded
  Income Support rule), so `owned_land`, `other_residential_property_value`
  and `non_residential_property_value` are listed. `savings` is not: a bank or
  building society account is valued at its balance, and the costs of
  withdrawing money are not costs of sale (HBGM BW1 Annex F and BP1 F2.03,
  on the same words in the Housing Benefit regulations).
