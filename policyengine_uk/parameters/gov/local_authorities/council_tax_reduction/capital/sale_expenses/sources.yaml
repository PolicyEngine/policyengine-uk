description: >
  Council tax reduction capital sources whose sale would incur expenses, so
  that they are valued at 90% of market value. Real property always has costs
  of sale (R(IS) 21/93, as DMG 29622 applies it to the identically worded
  Income Support rule), so `owned_land`, `other_residential_property_value`,
  `non_residential_property_value`, `overseas_property_value` and
  `other_property_value` are listed. `savings` is not: a bank or
  building society account is valued at its balance, and the costs of
  withdrawing money, such as travel to a building society, are not costs of
  sale (DMG 29623, on the identically worded Income Support rule). Under each
  scheme's rule for capital outside the United Kingdom, councils take the same
  10%, where there would be expenses attributable to sale, and any encumbrance
  secured on the capital off its value under either limb: each rule puts both
  deductions after its two limbs, and SSI 2021/249 applies regulation 70(1) to
  the value regulation 70(2) gives. The data hold no secured debt for overseas
  or other property, so the formula takes only the 10% off them.
