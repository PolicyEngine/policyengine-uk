description: >
  Household capital counted for the council tax reduction capital limit and
  tariff income, outside the Pension Credit routes. Every scheme counts the
  whole of the applicant's capital unless a schedule disregards it, including
  land and property other than the home: the prescribed requirements for
  pensioners in England (Schedule 1 paragraph 31(1)), Wales (Schedule 1) and
  Scotland (regulation 40 onwards), the English default scheme for working
  age and the Welsh and Scottish working-age schemes. `main_residence_value`
  is left out because the home is disregarded. `corporate_wealth` is also left
  out for now: in the data it is mostly imputed pension wealth, which the
  schemes disregard, and it cannot yet be separated (issue 1936).
