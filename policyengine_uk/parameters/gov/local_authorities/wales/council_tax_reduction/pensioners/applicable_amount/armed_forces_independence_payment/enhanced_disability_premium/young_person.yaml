description: Councils in Wales count a young person (a Child Benefit qualifying young person) in a pensioner's family for the enhanced disability premium under the Welsh Council Tax Reduction prescribed requirements when an armed forces independence payment (AFIP) is payable for them, if this is true.
values:
  2015-04-01:
    value: true
    reference:
      - title: WSI 2013/3029 Sch. 2 para. 7(1)(c), as in force on 30 April 2015
        href: https://www.legislation.gov.uk/wsi/2013/3029/schedule/2/2015-04-30
