description: Wales Council Tax Reduction deducts this weekly amount for each non-dependant aged 18 or over, by the non-dependant's normal gross weekly income if they are in remunerative work; a non-dependant not in remunerative work pays the lowest amount.

# Sums from paragraph 3 of Schedule 1 (pensioners) and paragraph 5 of Schedule
# 6 (persons who are not pensioners) to the Council Tax Reduction Schemes and
# Prescribed Requirements (Wales) Regulations 2013 (WSI 2013/3029); for
# 2013-14, the same paragraphs of WSI 2012/3144, as substituted for each
# financial year by the amending instruments in the references. Each year's
# sums apply from 1 April.
# 2016-17: the English text sets the first band at £194; the Welsh text has
# £195 (WSI 2017/46 reg. 3(a)(iii)-(v) replaced both).
