description: >
  Other (unearned) income that Oxford City Council counts, with DWP's net
  earned income and the Universal Credit awarded, for a working-age applicant
  who receives Universal Credit. In Appendix 3 the council lists the income it
  ignores and takes "All other unearned income" into account; it applies its
  Appendix 5 disregards, Child Benefit and child maintenance among them, only
  to applicants who "do not receive Universal Credit". The list leaves out the
  income Oxford City Council ignores in Appendix 3 (Attendance Allowance,
  Disability Living Allowance, Personal Independence Payment, Discretionary
  Housing Payments, Housing Benefit, discretionary council tax reductions and
  payments from sub-tenants and boarders). It also leaves out savings
  interest, dividends and rent, which the council treats as capital (Part 1
  para 30 and Annex 7). DWP deems Universal Credit's assumed yield from
  capital (uc_tariff_income) and nobody receives it, so it stays out, and so
  does Oxford City Council's own assumed income from capital, which the
  council adds only under paragraphs 14 to 27 (para 15). DWP counts
  statutory sick, maternity and paternity pay in its net earned income (UC
  Regs 2013 reg 55(4)), and the model counts miscellaneous income there too
  (uc_individual_earned_income_before_mif), so the list leaves them out.
  Oxford City Council names some one-off payments as capital in Appendix 6:
  the first month's Bereavement Support Payment, Government payments to help
  with the cost of living, such as the Household Energy Payment, and payments
  for a personal injury. The list leaves those out. It counts bsp and afcs
  whole, because bsp_reported and afcs_reported hold the regular payments a
  person reports; if a situation enters a lump sum in either input, the model
  counts it as income.
metadata:
  economy: false
  label: Oxford Council Tax Reduction Universal Credit applicant other income sources
  period: year
  unit: list
  reference:
    - title: Oxford City Council Council Tax Reduction Scheme 2026 to 2027, Appendix 3 (other unearned income, the income ignored), Appendix 5 (applies to applicants who do not receive Universal Credit) and Appendix 6 (capital ignored)
      href: https://www.oxford.gov.uk/council-tax-reduction/council-tax-reduction-scheme-2026-27/4
    - title: Oxford City Council Council Tax Reduction Scheme 2026 to 2027, Annex 7 (Oxford City Council treats income derived from capital as capital)
      href: https://www.oxford.gov.uk/council-tax-reduction/council-tax-reduction-scheme-2026-27/3
    - title: Oxford City Council Council Tax Reduction Scheme 2026 to 2027, Part 1 paras 15 and 30
      href: https://www.oxford.gov.uk/council-tax-reduction/council-tax-reduction-scheme-2026-27
    - title: The Universal Credit Regulations 2013 reg. 66(1)
      href: https://www.legislation.gov.uk/uksi/2013/376/regulation/66
    - title: The Carer's Assistance (Carer Support Payment) (Scotland) Regulations 2023 reg. 14A (Scottish Carer Supplement for each award week of Carer Support Payment)
      href: https://www.legislation.gov.uk/ssi/2023/302/regulation/14A
    - title: The Carer's Assistance (Carer Support Payment) (Scotland) Regulations 2023 reg. 42 (13 weeks of Carer Support after a move to another part of the United Kingdom)
      href: https://www.legislation.gov.uk/ssi/2023/302/regulation/42
values:
  2026-04-01:
    # Oxford City Council applies its Appendix 5 Child Benefit and child
    # maintenance disregards only to applicants without Universal Credit, and
    # does not list either in Appendix 3.
    - child_benefit
    - maintenance_income
    # The receipts DWP counts as Universal Credit unearned income (reg 66(1)):
    # all of gov.dwp.universal_credit.means_test.income_definitions.unearned
    # except uc_tariff_income. Oxford City Council gives no £15 disregard for
    # spousal maintenance or Widowed Parent's Allowance in Appendix 3; it gives
    # its Appendix 5 ones only to applicants without Universal Credit.
    - spousal_maintenance_income
    - private_pension_income
    - state_pension
    - carers_allowance
    # The whole carer support payment, not the part DWP counts under reg
    # 66(1)(b)(iiia): Oxford City Council ignores the part above Carer's
    # Allowance only in Appendix 5.
    - carer_support_payment
    # Social Security Scotland pays the supplement for each week it pays the
    # carer support payment (SSI 2023/302 reg 14A), including the 13 weeks
    # after a carer moves to another part of the United Kingdom (reg 42). DWP
    # does not count it, and Oxford City Council does not ignore it.
    - scottish_carer_supplement
    - jsa_contrib
    - esa_contrib
    - maternity_allowance
    - iidb
    - widowed_parents_allowance
    - incapacity_benefit
    - sda
    # Unearned income DWP leaves out of reg 66 and Oxford City Council does
    # not ignore in Appendix 3. The council ignores war pensions, Armed Forces
    # Independence Payment and Healthy Start in Appendix 5, which it applies
    # only to applicants without Universal Credit. bsp and afcs hold regular
    # payments; the council treats the first month's Bereavement Support
    # Payment and personal injury payments as capital (Appendix 6).
    - bsp
    - afcs
    - war_widows_pension
    - armed_forces_independence_payment
    - ssmg
    - healthy_start_vouchers
    - private_transfer_income
    # Not miscellaneous_income: the model already counts it in DWP's net
    # earned income. DWP lists miscellaneous income as unearned income (reg
    # 66(1)(m)); if the model moves it there (issue 1961), DWP will take it
    # off the award pound for pound and this list must count it again.
    # DWP replaces these awards with Universal Credit, so a claimant receives
    # none of them. The list names them so that no receipt escapes "All other
    # unearned income".
    - income_support
    - claimant_or_partner_jsa_income
    - claimant_or_partner_esa_income
    - tax_credits
    - pension_credit
