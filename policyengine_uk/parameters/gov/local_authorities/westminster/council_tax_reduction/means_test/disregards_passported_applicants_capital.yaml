description: >
  Whether the Westminster council tax reduction scheme for people under
  pension age disregards the whole capital of an applicant on Income Support,
  income-based Jobseeker's Allowance or income-related Employment and Support
  Allowance. The council's working-age scheme mirrors the Council Tax
  Reduction Schemes (Default Scheme) (England) Regulations 2012 with uprated
  amounts and a war pension disregard (cabinet report, 15 December 2025, para.
  4.22), so it keeps the default scheme's disregard of the whole capital of an
  applicant on Income Support, income-based Jobseeker's Allowance or income-
  related Employment and Support Allowance (the default scheme's Schedule 10
  paragraph 8). The council's full scheme text is not published, so this is
  inferred from that statement.
