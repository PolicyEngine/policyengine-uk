description: >
  The model counts the care component of disability living allowance at the
  highest rate and the daily living component of personal independence
  payment at either rate, for the applicant or a member of the applicant's
  family, towards the enhanced disability premium in Westminster City
  Council's working-age Council Tax Support scheme. It omits armed forces
  independence payment, and counts each award only for a person under the
  qualifying age for State Pension Credit. This is the Default Scheme's list
  (S.I. 2012/2886 Sch 3 para 12). The council has approved the same scheme,
  based on the Default Scheme Regulations, since 2013/14, and its Cabinet
  says from December 2020 that the council's local scheme mirrors those
  Regulations. The model cites no full Westminster scheme text.
  The model reads the list as at 30 April of each year.
