description: >
  If this is true, the model applies the London Borough of Merton's own list
  (qualifying_benefits) to the enhanced disability premium in its working-age
  Council Tax Support scheme; otherwise it applies the Housing Benefit
  condition there (receives_enhanced_disability_premium_qualifying_benefit),
  under the same age limit. The council's scheme rules for 2023-24 are the
  earliest text the model cites for its list, so the model applies the
  Housing Benefit condition in Merton before 2023-24.
metadata:
  label: Merton Council Tax Support enhanced disability premium own list in effect
  period: year
  unit: bool
  reference:
    - title: The London Borough of Merton Local Council Tax Support Scheme Rules 2023, Sch. 3 para. 12(1)(b), (c)
      href: https://www.merton.gov.uk/system/files/Council%20Tax%20Reduction%20Scheme%20L%20B%20Merton%202023-24_0.pdf
    - title: The Housing Benefit Regulations 2006 Sch. 3 para. 15(1)(b), (c), (d)
      href: https://www.legislation.gov.uk/uksi/2006/213/schedule/3/paragraph/15
values:
  2013-04-01: false
  2023-04-01: true
