description: >
  The London Borough of Merton counts the care component of disability living
  allowance at the highest rate and the daily living component of personal
  independence payment at either rate, for the applicant or a member of the
  applicant's family, towards the enhanced disability premium in its
  working-age Council Tax Support scheme. It omits armed forces independence
  payment, and counts each award only for a person under the qualifying age
  for State Pension Credit. The council sets this list in its scheme rules for
  2013-14, 2014-15, 2015-16, 2020-21, 2021-22, 2022-23, 2023-24, 2025-26 and
  2026-27, and links its 2023 rules as its 2024-25 scheme. In its Cabinet and
  Council reports for 2017/18 to 2020/21 the council says it continued the
  same scheme through 2019/20, so the model also applies the list from
  2016-17 to 2019-20, for which it cites no scheme text. The model reads the
  list as at 30 April of each year.
