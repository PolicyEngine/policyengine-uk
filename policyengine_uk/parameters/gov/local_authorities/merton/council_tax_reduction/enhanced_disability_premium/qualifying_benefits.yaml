description: >
  The London Borough of Merton counts the care component of disability living
  allowance at the highest rate and the daily living component of personal
  independence payment at either rate, for the applicant or a member of the
  applicant's family, toward the enhanced disability premium in its
  working-age Council Tax Support scheme. It omits armed forces independence
  payment, and counts each award only for a person under the qualifying age
  for State Pension Credit. The council's scheme rules for 2023-24, 2025-26 and
  2026-27 set this list, and the model applies it from 2023-24
  (qualifying_benefits_in_effect). The model reads the list as at 30 April of
  each year.
