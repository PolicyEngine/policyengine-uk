description: >
  Whether the Merton council tax reduction scheme for people under pension age
  disregards the whole capital of an applicant on Income Support, income-based
  Jobseeker's Allowance or income-related Employment and Support Allowance.
  The council's 2026-27 scheme disregards the whole capital of an applicant on
  Income Support, income-based Jobseeker's Allowance or income-related
  Employment and Support Allowance (Schedule 10 paragraph 8), as the default
  scheme does.
