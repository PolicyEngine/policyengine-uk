description: >
  The Royal Borough of Kingston upon Thames counts the care component of
  disability living allowance at the highest rate and the daily living
  component of personal independence payment at either rate, for the applicant
  or a member of the applicant's family, towards the enhanced disability
  premium in its working-age Council Tax Reduction scheme. It omits armed
  forces independence payment, and counts each award only for a person under
  the qualifying age for State Pension Credit. The council made its scheme
  from 1 April 2013 by adopting the Default Scheme, whose Sch 3 para 12 sets
  this list; kept the scheme apart from uprating for 2014-15, 2015-16 and
  2016-17; and revised other provisions from April 2016 and April 2017. Its
  truncated 2021-22 and 2022-23 scheme copies show the qualifying benefit
  list but stop before the age condition. It keeps the same para 12 in its
  scheme texts for 2023 to 2026-27. In its 2021-22, 2022-23 and 2023 texts
  the council cites no revision of its own after December 2015. In its 2023
  text the Energy Bills Rebate disregard it adds from 1 April 2022, which
  the Secretary of State requires of every scheme from 2022-23 (S.I.
  2022/127 reg 3), leaves para 12 alone; the council lists no Council Tax
  Reduction decision in its decision
  registers for 2017 to 2026 (though it leaves some Council resolutions out
  of them); and in its 2023-24 budget report it says the scheme "remains
  unchanged". The model applies the list in 2013-14 to 2017-18 and from
  2023-24. It keeps the Housing Benefit list in 2018-19 to 2022-23 because
  no complete scheme text for those years survives. The model reads the
  list as at 30 April of each year.
