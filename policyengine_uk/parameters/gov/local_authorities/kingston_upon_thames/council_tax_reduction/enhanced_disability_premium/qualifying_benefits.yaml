description: >
  Awards to the applicant or a member of the applicant's family that meet the
  enhanced disability premium condition of Kingston upon Thames's working-age
  Council Tax Reduction scheme: the care component of disability living
  allowance at the highest rate and the daily living component of personal
  independence payment at either rate. The scheme names no armed forces
  independence payment. Each award counts only for a person under the
  qualifying age for State Pension Credit. The model reads the list as at 30
  April of each year and backdates it to 2015.
