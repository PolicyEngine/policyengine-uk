description: >
  If this is true, the model applies Kingston upon Thames's own qualifying
  benefit list for the enhanced disability premium in its working-age
  Council Tax Reduction scheme. The model applies that list in 2013-14 to
  2017-18 and from 2023-24. It keeps the Housing Benefit list in 2018-19 to
  2022-23 because no complete scheme text for those years survives. The model
  reads this parameter as at 30 April of each year, like the qualifying
  benefit list.
