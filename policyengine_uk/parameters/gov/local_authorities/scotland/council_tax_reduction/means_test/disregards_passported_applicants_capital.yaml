description: >
  Whether the Scottish council tax reduction scheme for people under pension
  age disregards the whole capital of an applicant on Income Support,
  income-based Jobseeker's Allowance or income-related Employment and Support
  Allowance. The Council Tax Reduction (Scotland) Regulations 2012 did
  (Schedule 5 paragraph 7). The Council Tax Reduction (Scotland) Regulations
  2021, in force from 1 April 2022, have no such disregard in Schedule 4:
  regulation 13(11) treats a qualifying income-related benefit claimant as
  meeting the income conditions, and regulation 13(1) still applies the
  capital limit.
metadata:
  label: Scotland working-age council tax reduction disregards passported applicants' capital
