description: >
  Whether the Scottish working-age council tax reduction scheme takes the £15
  weekly Widowed Parent's Allowance disregard from the
  applicant's total weekly unearned income, rather than from the allowance.
  The Council Tax Reduction (Scotland) Regulations 2012 disregarded £15 of
  the allowance (Schedule 4 paragraph 20). The Council Tax Reduction
  (Scotland) Regulations 2021, in force from 1 April 2022, disregard £15 from
  the applicant's weekly unearned income where the applicant receives it
  (regulation 57(4)).
