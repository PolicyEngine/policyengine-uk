description: >
  Whether the Scottish council tax reduction scheme for people under pension
  age takes the capital of an applicant with an award of Universal Credit
  from the Secretary of State's calculation for that award. The Council Tax
  Reduction (Scotland) Regulations 2012 did (regulation 26(4) as made;
  regulation 26(6) after SSI 2018/69 substituted the regulation). The Council Tax Reduction (Scotland) Regulations 2021, in force
  from 1 April 2022, have no such rule: the authority calculates every
  applicant's capital itself (regulations 66 to 70).
metadata:
