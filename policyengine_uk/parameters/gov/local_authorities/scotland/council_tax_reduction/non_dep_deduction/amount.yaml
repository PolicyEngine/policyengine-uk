description: Scotland Council Tax Reduction deducts this weekly amount for each non-dependant aged 18 or over, by the non-dependant's normal gross weekly income if they are in remunerative work; a non-dependant not in remunerative work pays the lowest amount.

# Sums from regulation 48 of the Council Tax Reduction (State Pension Credit)
# (Scotland) Regulations 2012 (SSI 2012/319) and, for people under pension
# age, regulation 67 of SSI 2012/303 to 2021-22 and regulation 90 of the
# Council Tax Reduction (Scotland) Regulations 2021 (SSI 2021/249) from
# 2022-23, as substituted for each financial year by the amending instruments
# in the references. Each year's sums apply from 1 April.
