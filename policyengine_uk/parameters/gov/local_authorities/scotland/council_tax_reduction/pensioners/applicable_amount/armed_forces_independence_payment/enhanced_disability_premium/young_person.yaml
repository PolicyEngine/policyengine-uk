description: Councils in Scotland count a young person (a Child Benefit qualifying young person) in a pensioner's family for the enhanced disability premium under the Council Tax Reduction (State Pension Credit) (Scotland) Regulations 2012 when an armed forces independence payment (AFIP) is payable for them, if this is true.
values:
  2013-06-11:
    value: true
    reference:
      - title: SSI 2013/142 regs. 1 and 12(7)(c), inserting SSI 2012/319 Sch. 1 para. 8(1)(aa) from 11 June 2013, as the text in force on 30 April 2015 notes
        href: https://www.legislation.gov.uk/ssi/2013/142/made
