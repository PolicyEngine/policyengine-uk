description: Weekly amount of the enhanced disability premium for each child or young person in the applicant's family who meets the condition in Sch. 1 para. 8, in the applicable amount of a pensioner under the Council Tax Reduction (State Pension Credit) (Scotland) Regulations 2012. The amounts equal the Housing Benefit amounts in every year from 2015-16 to 2026-27.
