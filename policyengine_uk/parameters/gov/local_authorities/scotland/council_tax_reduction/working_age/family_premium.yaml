description: Weekly family premium for a working-age applicant whose family includes a child or young person under the Scottish council tax reduction scheme. It was removed for new claims from 1 May 2016; families with an unbroken claim since then keep it as a transitional family premium, which the model does not track, so the model gives it to no one after that date.
