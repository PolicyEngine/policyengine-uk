description: Scotland's working-age Council Tax Reduction scheme pays the carer premium to an applicant or partner whose award of Universal Credit includes the carer element if this is true, and only on entitlement to Carer's Allowance or Carer Support Payment otherwise.
values:
  2013-04-01: false
  2022-04-01: true
