description: >
  Benefits whose receipt by the applicant or partner meets the enhanced
  disability premium condition of Scotland's working-age Council Tax Reduction
  scheme: the care component of disability living allowance at the highest
  rate, the daily living component of personal independence payment at the
  enhanced rate and armed forces independence payment, and from 1 April 2023
  attendance allowance at either rate (S.S.I. 2023/38). The scheme also lists
  Scottish benefits (child disability payment, adult disability payment,
  pension age disability payment and Scottish adult disability living
  allowance), which are not separate model variables. Armed forces
  independence payment was added to the 2012 scheme from 11 June 2013 (S.S.I.
  2013/142). Like other parameters, the model reads the list as at 30 April of
  each year from 2015.
