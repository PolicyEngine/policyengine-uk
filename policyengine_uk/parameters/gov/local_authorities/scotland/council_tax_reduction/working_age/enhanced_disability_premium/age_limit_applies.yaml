description: >
  Scotland's working-age Council Tax Reduction scheme pays the enhanced
  disability premium only for an applicant or partner under the qualifying
  age for State Pension Credit if this is true. The 2012 scheme had this limit
  until 31 March 2022. The 2021 scheme limited it to those under pensionable
  age, which the model reads as the same qualifying age (the two have agreed
  for everyone since 2019-20), until S.S.I. 2022/161 removed the limit from
  20 June 2022. Like other parameters,
  the model reads this as at 30 April of each year from 2015, so the limit
  applies in 2022 and not from 2023.
metadata:
