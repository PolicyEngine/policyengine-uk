description: Tariff income treated as arising from a working-age applicant's capital under the Scottish council tax reduction scheme.
threshold:
  description: Capital above which a working-age applicant is treated as having tariff income.
  values:
    2013-04-01: 6_000
  metadata:
    label: Scotland working-age CTR tariff income threshold
    unit: currency-GBP
    period: year
    reference:
      - title: The Council Tax Reduction (Scotland) Regulations 2021 reg. 63(1)(b)
        href: https://www.legislation.gov.uk/ssi/2021/249/regulation/63
step:
  description: Size of each capital step, or part of one, above the threshold that yields the weekly tariff income amount.
  values:
    2013-04-01: 250
  metadata:
    label: Scotland working-age CTR tariff income capital step
    unit: currency-GBP
    period: year
    reference:
      - title: The Council Tax Reduction (Scotland) Regulations 2021 reg. 63(1)(b)
        href: https://www.legislation.gov.uk/ssi/2021/249/regulation/63
amount:
  description: Weekly tariff income for each capital step, or part of one, above the threshold.
  values:
    2013-04-01: 1
  metadata:
    label: Scotland working-age CTR weekly tariff income per step
    unit: currency-GBP
    period: week
    reference:
      - title: The Council Tax Reduction (Scotland) Regulations 2021 reg. 63(1)(b)
        href: https://www.legislation.gov.uk/ssi/2021/249/regulation/63
metadata:
  label: Scotland working-age CTR tariff income
