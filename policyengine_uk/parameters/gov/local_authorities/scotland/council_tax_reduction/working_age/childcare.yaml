description: Weekly caps on the relevant childcare charges deducted from a working-age applicant's income
  under the Scottish council tax reduction scheme.
maximum_one_child:
  description: Weekly cap on relevant childcare charges for an applicant without Universal Credit whose
    family has one child with charges.
  values:
    2013-04-01: 175
  metadata:
    label: Scotland working-age CTR childcare cap, one child
    unit: currency-GBP
    period: week
    reference:
    - title: The Council Tax Reduction (Scotland) Regulations 2021 reg. 38(4)(a)
      href: https://www.legislation.gov.uk/ssi/2021/249/regulation/38
maximum_two_or_more_children:
  description: Weekly cap on relevant childcare charges for an applicant without Universal Credit whose
    family has more than one child with charges.
  values:
