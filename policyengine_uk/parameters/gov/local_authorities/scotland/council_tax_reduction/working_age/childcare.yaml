universal_credit_costs_covered:
  description: Share of childcare costs that the Universal Credit childcare costs element covers. Relevant
    childcare charges of an applicant with Universal Credit are the childcare costs element divided by
    this share.
  values:
    2013-04-01: 0.85
  metadata:
    label: Scotland working-age CTR UC childcare costs element share
    unit: /1
    period: year
    reference:
    - title: The Council Tax Reduction (Scotland) Regulations 2021 reg. 78(3)
      href: https://www.legislation.gov.uk/ssi/2021/249/regulation/78
metadata:
