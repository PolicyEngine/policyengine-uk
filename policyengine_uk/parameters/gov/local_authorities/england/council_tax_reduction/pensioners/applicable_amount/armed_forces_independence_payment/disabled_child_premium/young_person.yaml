description: Councils in England count a young person (a Child Benefit qualifying young person) in a pensioner's family for the disabled child premium under the England Council Tax Reduction prescribed requirements when an armed forces independence payment (AFIP) is payable for them, if this is true.
values:
  2015-04-01:
    value: false
    reference:
      - title: SI 2012/2885 Sch. 2 para. 8, as in force on 30 April 2015, which has no AFIP limb; nor has the text in force on 30 April 2022
        href: https://www.legislation.gov.uk/uksi/2012/2885/schedule/2/2015-04-30
  2023-04-01:
    value: true
    reference:
      - title: The Council Tax Reduction Schemes (Prescribed Requirements) (England) (Amendment) Regulations 2023 (SI 2023/16) regs. 1(3) and 7(8), inserting Sch. 2 para. 8(e) for schemes for financial years from 1 April 2023
        href: https://www.legislation.gov.uk/uksi/2023/16/made
metadata:
  unit: bool
  period: year
  label: England Council Tax Reduction pensioner disabled child premium AFIP route for a young person
  reference:
    - title: The Council Tax Reduction Schemes (Prescribed Requirements) (England) Regulations 2012 Sch. 2 paras. 7 and 8
      href: https://www.legislation.gov.uk/uksi/2012/2885/schedule/2
