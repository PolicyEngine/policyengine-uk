description: Weekly amount of the disabled child premium for each child or young person in the applicant's family who meets the condition in Sch. 2 para. 8, in the applicable amount of a pensioner under the England Council Tax Reduction prescribed requirements. The amounts equal the Housing Benefit amounts in every year from 2015-16 to 2026-27.
