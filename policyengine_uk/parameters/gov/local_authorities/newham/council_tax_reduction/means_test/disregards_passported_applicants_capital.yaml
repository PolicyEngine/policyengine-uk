description: >
  Whether the Newham council tax reduction scheme for people under pension age
  disregards the whole capital of an applicant on Income Support, income-based
  Jobseeker's Allowance or income-related Employment and Support Allowance.
  The council's 2026 scheme omits the default scheme's disregard of the whole
  capital of an applicant on Income Support, income-based Jobseeker's
  Allowance or income-related Employment and Support Allowance: Schedule 10
  paragraphs 8 and 9 are left blank, so that capital is tested against the
  limit.
metadata:
