description: >
  The London Borough of Newham counts the care component of disability living
  allowance at the highest rate and the daily living component of personal
  independence payment at either rate, for the applicant or a member of the
  applicant's family, toward the enhanced disability premium in its
  working-age Council Tax Reduction scheme, and from 1 April 2014 armed forces
  independence payment. It counts each award only for a person under the
  qualifying age for State Pension Credit. Its scheme texts from 2022 also
  count the care component of child disability payment at the highest rate,
  for which the model has no separate variable. The council's texts for 2013,
  2014, 2017, 2022, 2023 and 2026 set these lists. For the years between, the
  council's budget reports and its 2024-25 Council Tax booklet say that the
  scheme stays unchanged or that the council changed other provisions, except
  for 2018-19, and the texts on either side keep the same para 12. The model
  reads the list as at 30 April of each year.
