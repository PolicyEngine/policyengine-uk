description: The appropriate percentage for council tax discounts in Wales, applied where there is one resident who is not disregarded. Until 31 March 2026 this was the appropriate percentage in section 11(3) of the Local Government Finance Act 1992, which then applied to England and Wales alike. From 1 April 2026 section 11 is England-only and the Welsh discount is prescribed by regulations under section 11E; regulation 3 of the 2026 Regulations prescribes the same 25 per cent, so the value is continuous.
