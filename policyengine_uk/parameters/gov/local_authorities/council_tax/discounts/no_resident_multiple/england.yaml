description: The multiple of the appropriate percentage discounted where a chargeable dwelling in England has no resident. Section 11(2)(a) of the Local Government Finance Act 1992 gives twice the appropriate percentage, so this is 2 and the familiar 50 per cent is derived rather than printed.
