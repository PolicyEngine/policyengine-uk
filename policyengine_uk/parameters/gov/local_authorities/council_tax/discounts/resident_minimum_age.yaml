description: Minimum age at which an individual counts as a resident for the council tax discounts. The Local Government Finance Act 1992 defines a resident as an individual aged 18 or over who has their sole or main residence in the dwelling, in section 6(5) for England and Wales (Part I) and section 99(1) for Scotland (Part II).
