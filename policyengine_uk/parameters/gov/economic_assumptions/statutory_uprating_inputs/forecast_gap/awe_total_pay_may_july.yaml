description: Forecast difference between May-July earnings growth and calendar-year earnings growth, added to calendar-year growth in years without a published May-July figure.
values:
  # No gap applies to published years.
  2010-07-01: 0
  # OBR EFO March 2026: Q2 average earnings growth on a year earlier (economy Table 1.6) minus calendar-year growth in yoy_growth.yaml.
  2025-07-01: 0.00259
  2026-07-01: 0.00274
  2027-07-01: 0.00027
  2028-07-01: -0.00021
  2029-07-01: -0.00015
  2030-07-01: -0.00011
  # After the EFO horizon: no gap, so the forecast is calendar-year growth.
  2031-07-01: 0
metadata:
  unit: /1
  label: May-July earnings forecast gap to calendar-year earnings
  preserve_calendar_dates: true
  documentation: |
    The OBR does not forecast the ONS AWE series. Its average earnings
    measure is wages and salaries per employee from the national accounts,
    forecast by quarter; the gap is its Q2 (April to June) growth, the
    quarter nearest May to July, minus the calendar-year growth stored in
    yoy_growth.yaml, so that stored growth plus the gap is the OBR's Q2
    figure. In the EFOs from November 2023 to March 2026, every OBR
    triple-lock forecast equals the highest of this Q2 growth, Q3 CPI and
    2.5%. policyengine_uk/utils/import_obr_forecasts.py regenerates the gaps
    with each EFO (or with --gaps-only after editing yoy_growth.yaml). The
    gap is zero after the EFO horizon, where the May-July forecast falls back
    to calendar-year growth.
  reference:
    - title: OBR EFO March 2026 (detailed forecast tables, economy, Table 1.6)
      href: https://obr.uk/efo/economic-and-fiscal-outlook-march-2026/
