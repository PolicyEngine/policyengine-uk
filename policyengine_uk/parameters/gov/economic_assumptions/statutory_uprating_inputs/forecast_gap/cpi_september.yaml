description: Forecast difference between September CPI inflation and calendar-year CPI inflation, added to calendar-year growth in years without a published September figure.
values:
  # No gap applies to published years.
  2010-09-01: 0
  # OBR EFO March 2026: September CPI (receipts Table 3.19) minus calendar-year CPI (economy Table 1.7).
  2025-09-01: 0.00438
  2026-09-01: -0.00185
  2027-09-01: 0.00103
  2028-09-01: 0.00053
  2029-09-01: 0.00028
  # OBR EFO March 2026: Q3 CPI 12-month rate minus calendar-year CPI inflation (economy Table 1.7).
  2030-09-01: 0
  # After the EFO horizon: no gap, so the forecast is calendar-year growth.
  2031-09-01: 0
metadata:
  unit: /1
  label: September CPI forecast gap to calendar-year CPI
  preserve_calendar_dates: true
  documentation: |
    The OBR publishes September CPI forecasts in its receipts tables, as
    the CPI used to uprate tax thresholds. Where that row stops before the
    end of the forecast, the gap uses the quarter containing September (Q3
    CPI, economy Table 1.7). Both come from the same Economic and Fiscal
    Outlook as the calendar-year series, and are regenerated by
    policyengine_uk/utils/import_obr_forecasts.py. The gap is zero after the
    EFO horizon, where the September forecast falls back to calendar-year CPI.
  reference:
    - title: OBR EFO March 2026 (detailed forecast tables, economy, Table 1.7)
      href: https://obr.uk/efo/economic-and-fiscal-outlook-march-2026/
    - title: OBR EFO March 2026 (detailed forecast tables, receipts, Table 3.19)
      href: https://obr.uk/efo/economic-and-fiscal-outlook-march-2026/
