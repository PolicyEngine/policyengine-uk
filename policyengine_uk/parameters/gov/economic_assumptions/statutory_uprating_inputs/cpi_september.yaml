description: CPI 12-month rate in September, the price input to the April uprating of the State Pension and most benefits the following year.
values:
  # Outturn: ONS D7G7, as published. ONS does not amend published CPI
  # (its last revisions were in 2000 and 2006), so these are the figures
  # each review used. Store the published rate: rates derived from the
  # 1dp index (D7BT) round differently in some years.
  2010-09-01: 0.031
  2011-09-01: 0.052
  2012-09-01: 0.022
  2013-09-01: 0.027
  2014-09-01: 0.012
  2015-09-01: -0.001
  2016-09-01: 0.010
  2017-09-01: 0.030
  2018-09-01: 0.024
  2019-09-01: 0.017
  2020-09-01: 0.005
  2021-09-01: 0.031
  2022-09-01: 0.101
  2023-09-01: 0.067
  2024-09-01: 0.017
  2025-09-01: 0.038
  # Not yet published. From here the value is calendar-year CPI growth
  # (yoy_growth.obr.consumer_price_index) plus forecast_gap.cpi_september.
  2026-09-01: null
metadata:
  unit: /1
  label: September CPI inflation
  preserve_calendar_dates: true
  reference:
    - title: ONS D7G7, CPI annual rate, all items
