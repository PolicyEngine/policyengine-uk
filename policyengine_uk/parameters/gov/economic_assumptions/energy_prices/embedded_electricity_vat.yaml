description: VAT rates on domestic electricity that the published ONS prices and the OBR utilities forecast include. The energy price indices divide them out, so the indices price electricity at the energy input VAT basis rate. This describes the source data, not policy; a reform to VAT is a change to gov.hmrc.vat, not to this.
great_britain:
  description: VAT rate on domestic electricity in Great Britain included in the ONS prices and the OBR forecast.
  metadata:
    unit: /1
    label: VAT rate in published electricity prices, Great Britain
    period: month
    reference:
      - title: The Value Added Tax (Supplies of Domestic Electricity) Order 2026 (SI 2026/987), article 3
        href: https://www.legislation.gov.uk/uksi/2026/987/contents/made
      - title: Budget 2026 policy costings, page 12 (zero rate from 1 October 2026 until 1 July 2027)
        href: https://assets.publishing.service.gov.uk/media/6ae1883fe4367e5c8b0467df/AB26_Policy_Costing.pdf#page=12
      - title: OBR, Economic and fiscal outlook, October 2026, paragraph 3.10 (the VAT cut is in the inflation forecast)
        href: https://obr.uk/efo/economic-and-fiscal-outlook-october-2026/
  values:
    1997-09-01: 0.05
    2026-10-01: 0
    2027-07-01: 0.05
northern_ireland:
  description: VAT rate on domestic electricity in Northern Ireland included in the ONS prices and the OBR forecast.
  metadata:
    unit: /1
    label: VAT rate in published electricity prices, Northern Ireland
    period: month
    reference:
      - title: Budget 2026, paragraph 6.210 (the Budget expects the extended relief to apply UK-wide from April 2027)
        href: https://assets.publishing.service.gov.uk/media/6ae1ec57bdb574cf1c9b3f12/E03668986_HMT_Budget_2026_ELAY__2_.pdf#page=138
      - title: Budget 2026 policy costings, page 12 (until 1 July 2027)
        href: https://assets.publishing.service.gov.uk/media/6ae1883fe4367e5c8b0467df/AB26_Policy_Costing.pdf#page=12
  values:
    1997-09-01: 0.05
    2027-04-01: 0
    2027-07-01: 0.05
northern_ireland_share:
  description: Northern Ireland's share of UK domestic electricity consumption, which weights the two VAT rates into the UK rate in the published prices. The 2024 share, used for every year; it only matters while the rates differ.
  metadata:
    unit: /1
    label: Northern Ireland share of UK domestic electricity consumption
    period: year
    reference:
      - title: DESNZ, Subnational electricity consumption statistics 2005 to 2024 (2024, Great Britain, all domestic consumption 97,503.6 GWh)
        href: https://www.gov.uk/government/statistics/regional-and-local-authority-electricity-consumption-statistics
      - title: DESNZ, Northern Ireland subnational electricity consumption 2009 to 2024 (2024, all domestic consumption 2,695.7 GWh)
        href: https://www.gov.uk/government/statistics/sub-national-electricity-consumption-statistics-in-northern-ireland
  values:
    2015-01-01: 0.0269
