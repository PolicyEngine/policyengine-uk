# OBR Economic Projections
#
# Data sources by horizon:
# - 2009-2025: OBR outturn data from detailed forecast tables. 2025 is the
#   outturn in the latest Economic and Fiscal Outlook (EFO, October 2026).
# - 2026-2031: OBR forecast from the October 2026 EFO. Values come from the
#   EFO economy supplementary tables — RPI/CPI/CPIH from Table 1.7, average
#   earnings from Table 1.6.
#   Exceptions are documented on each series: mortgage_interest 2030 is
#   carried over from the November 2025 EFO, consumer_price_index_ahc is
#   derived rather than published by the OBR, and social_rent forecasts
#   apply the England social rent cap.
# - 2032-2073: OBR long-run equilibrium assumptions, taken from the OBR
#   Fiscal Risks and Sustainability report and the long-run RPI-CPI wedge
#   methodology. Steady-state values:
#     * consumer_price_index: 2.00%  (Bank of England target)
#     * rpi:                  2.39%  (CPI + 0.39pp long-run wedge)
#     * cpih:                 2.39%  (CPI + 0.39pp housing-costs wedge,
#                                     converges with RPI once RPI adopts
#                                     CPIH methodology from Feb 2030 per ONS)
#     * average_earnings:     3.83%  (productivity growth + CPI)
#
# How the 2032+ series are constructed:
# - CPI is at its 2% target in the EFO's 2031 forecast and is held flat.
# - RPI and CPIH move in equal steps, rounded to 4 decimals, from the EFO's
#   2031 forecast (2.18%) to 2.39% in 2035. Average earnings move the same
#   way from the EFO's 2031 forecast (2.60%) to 3.83% in 2036. The rates
#   then hold flat through 2073-01-01.
# - These intermediate rates are model assumptions beyond the EFO horizon.
#   Review them when a new EFO is released. The helper module below creates
#   cumulative indices from these rates, not the convergence paths themselves:
#   `policyengine_uk/parameters/gov/economic_assumptions/create_economic_assumption_indices.py`
#   refreshes downstream indices from these growth rates.
#
# References:
#   https://obr.uk/efo/                                  (latest EFO)
#   https://obr.uk/frltp/                                (Fiscal risks and
#                                                          long-term projections)
#   https://obr.uk/box/the-long-run-difference-between-rpi-and-cpi-inflation/
#   https://www.bankofengland.co.uk/monetary-policy/inflation

metadata:
  # Each value is the growth over a calendar year, dated 1 January, and
  # processing reads it there, so a bare-year reform key names the calendar
  # year (policyengine_uk/utils/dated_reforms.py).
  calendar_year_series: true

