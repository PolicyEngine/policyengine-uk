      2025-01-01: 0.0265
      # Forecast (2026-2031): derived by policyengine_uk/utils/create_ahc_deflator.py
      # from OBR CPI and rent forecasts and Ofwat water bills (see documentation).
      2026-01-01: 0.0304
      2027-01-01: 0.0341
      2028-01-01: 0.0200
      2029-01-01: 0.0202
      2030-01-01: 0.0193
      2031-01-01: 0.0189
    metadata:
      unit: /1
      label: After housing costs consumer price index growth
      documentation: |
        CPI excluding rents, maintenance and repairs, and water charges, the
        price index DWP uses to deflate after-housing-costs incomes in HBAI.
        The OBR does not publish it. Outturn is the ONS ad hoc series. Forecast
        growth is OBR calendar-year CPI growth with rents (OBR actual rents
        growth), water (Ofwat average bills) and maintenance and repair
        (assumed to grow with CPI) removed using ONS CPI item weights:
        other = (CPI - w_rent x rent - w_water x water - w_repair x CPI) / w_other,
        with weights rolled forward each year by relative price growth.
        policyengine_uk/utils/create_ahc_deflator.py computes it, and
        policyengine_uk/tests/test_ahc_deflator.py checks the stored values
        against it. Rerun the script after changing CPI, rent or water bill
        growth.
      reference:
        - title: ONS ad hoc 3582, CPI series excluding rents, maintenance repairs and water charges, February 2007 to June 2026
          href: https://www.ons.gov.uk/economy/inflationandpriceindices/adhocs/3582consumerpriceindicesseriesexcludingrentsmaintenancerepairsandwaterchargesfebruary2007tojune2026
        - title: OBR EFO October 2026 (detailed forecast tables, economy, Table 1.7), CPI and actual rents inputs
          href: https://obr.uk/efo/economic-and-fiscal-outlook-october-2026/
        - title: ONS CPI weights
          href: https://www.ons.gov.uk/economy/inflationandpriceindices/datasets/consumerpriceinflationupdatingweightsannexatablesw1tow3

