ofwat:
  water_bills:
    description: Water and sewerage bills year-on-year growth.
    # Growth in the average household water and sewerage bill in England and
    # Wales. Each value is the charging year starting in April, so 2025-01-01
    # holds 2025-26.
    # - 2022-2024: nominal growth in Ofwat's average bill, from the real
    #   bills and CPIH in policyengine_uk/utils/water/forecast_water_bills.py.
    # - 2025 (2025-26): 27%, the increase Ofwat reports for 2025-26 in its
    #   29 January 2026 statement. It replaces the 26% forecast in Ofwat's
    #   30 January 2025 statement.
    # - 2026 (2026-27): 5.4%, the national average from Water UK's 28 January
    #   2026 company charges (GBP 639, up GBP 33), confirmed by Ofwat the next day.
    # - 2027-2029: projections from forecast_water_bills.py. Ofwat's PR24 final
    #   determinations (19 December 2024) take the average water and
    #   wastewater company bill from GBP 440 in 2024-25 to GBP 597 in 2029-30
    #   before inflation (pr24_final_determination_bills.csv). The real growth
    #   already realised in 2025-26 and 2026-27 (the values above, less CPIH)
    #   is taken out, the rest is spread evenly over the three years, and CPIH
    #   from obr.cpih is added back, using calendar year t-1 for charging year
    #   t because Ofwat indexes to the previous November's CPIH.
    values:
      2022-01-01: 0.052
      2023-01-01: 0.092
      2024-01-01: 0.044
      2025-01-01: 0.27
      2026-01-01: 0.054
      2027-01-01: 0.062
      2028-01-01: 0.062
      2029-01-01: 0.050
    metadata:
      unit: /1
      label: Water bills growth
      reference:
        - title: Ofwat, "Ofwat responds to water sector average bill figures" (29 January 2026)
          href: https://www.ofwat.gov.uk/ofwat-responds-to-water-sector-average-bill-figures/
        - title: Water UK, "Record investment as average household water bills rise £33 a year from April" (28 January 2026)
          href: https://www.water.org.uk/news-views-publications/news/record-investment-average-household-water-bills-rise-ps33-year-april
