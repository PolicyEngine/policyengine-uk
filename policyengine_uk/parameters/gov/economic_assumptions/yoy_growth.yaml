finance_ni:
  domestic_rates:
    description: Growth in the average Northern Ireland domestic rates bill (regional rate plus district rate), used to project the domestic_rates dataset input.
    # A Northern Ireland household's rates bill is its capital value times
    # the regional rate plus its council's district rate, levied "as if they
    # were items of a single rate" (Rates (Northern Ireland) Order 1977,
    # arts 6, 7 and 9). Domestic capital values are still those of the
    # 1 January 2005 valuation list, so the bill grows with the two
    # poundages. Each year below is the growth in the combined domestic
    # poundage across the 11 councils, weighted by each council's domestic
    # rates paid in the previous year (LPS; the 2020-21 figures stand in for
    # 2019-20, the first year not published). It is a national average: it
    # does not reproduce any one council's bill or changes in reliefs.
    #
    # Neither OBR March 2026 line covers the whole bill, and OBR labels
    # neither as regional or district; the attribution here is inferred.
    # Expenditure Table 4.1 holds "NI domestic rates" at £0.494bn in every
    # year to 2030-31 inside its council tax total, and ONS classes district
    # domestic rates with council tax, so it appears to be the district
    # rates. Receipts Table 3.2 "Northern Ireland domestic rates" (in "Other
    # taxes") appears to be the regional rate: ONS classes the regional
    # domestic rate as a central government tax, and with Table 3.2's NI
    # business rates line it sums to £0.914bn in 2026-27, against DoF's
    # "just over £900million" from the regional rate that year. Receipts
    # growth is not bill growth either: Table 3.2 grows 2.0% in 2026-27, a
    # year whose domestic regional rate rose 5.0%.
    values:
      # Outturn: published poundages. Regional rate 0.4574p in 2019-20 to
      # 2022-23, then 0.4848p, 0.5042p, 0.5294p and 0.5559p (2026-27). The
      # district figures are each council's district growth, bill-weighted.
      2020-01-01: 0.0148 # regional 0%, district +3.36%
      2021-01-01: 0.0066 # regional 0%, district +1.43%
      2022-01-01: 0.0132 # regional 0%, district +2.90%
      2023-01-01: 0.0630 # regional +6.0%, district +6.68%
      2024-01-01: 0.0491 # regional +4.0%, district +5.91%
      2025-01-01: 0.0474 # regional +5.0%, district +4.46%
      2026-01-01: 0.0433 # regional +5.0%, district +3.58%
      # Projection (an assumption, not enacted policy): 2026-27 growth held.
      # The Finance Minister's 2026-29/30 draft Budget proposals (6 January
      # 2026, published before Executive agreement; no final Budget found by
      # October 2026) assume the domestic regional rate rises 5% a year to
      # 2028-29. No published Northern Ireland-wide district rate forecast
      # was found, so district growth is assumed to stay at its 2026-27
      # rate. Regional 5% plus district 3.58% gives 4.34% to 4.36% a year as
      # the regional share drifts up, within 0.03pp of the value held.
      # 2029-30 onward extrapolates beyond the draft Budget's resource
      # period (to 2028-29).
      2027-01-01: 0.0433
      2028-01-01: 0.0433
      2029-01-01: 0.0433
      2030-01-01: 0.0433
    metadata:
      unit: /1
      label: Northern Ireland domestic rates bill growth
      reference:
        - title: Department of Finance, Rate poundages 2024-25 to 2026-27 (domestic regional and district rates by council)
          href: https://www.finance-ni.gov.uk/articles/rate-poundages
        - title: Department of Finance, Rate poundages 2019-20 to 2023-24 (archived 6 July 2023)
          href: https://web.archive.org/web/20230706151829/https://www.finance-ni.gov.uk/articles/rate-poundages
        - title: Land & Property Services, Domestic rates collected by district council 2020-21 to 2025-26
          href: https://www.data.gov.uk/dataset/30535a44-0a05-4bff-98cf-001301a6b4d6/rates-paid-by-district-council-and-sector
        - title: Rates (Regional Rates) Order (Northern Ireland) 2026, art 3(2) (domestic regional rate 0.5559p, 2026-27)
          href: https://www.legislation.gov.uk/nisr/2026/19/made
        - title: Rates (Regional Rates) Order (Northern Ireland) 2025, art 3(2) (0.5294p, 2025-26)
          href: https://www.legislation.gov.uk/nisr/2025/27/made
        - title: Rates (Regional Rates) Order (Northern Ireland) 2024, art 3(2) (0.5042p, 2024-25)
          href: https://www.legislation.gov.uk/nisr/2024/28/made
        - title: Regional Rates (Northern Ireland) Regulations 2023, reg 2(3) (0.4848p, 2023-24)
          href: https://www.legislation.gov.uk/uksi/2023/198/made
        - title: Department of Finance, Proposed draft Budget 2026-29/30, written ministerial statement (domestic regional rate +5% a year)
          href: https://www.niassembly.gov.uk/assembly-business/official-report/written-ministerial-statements/department-of-finance-proposed-draft-budget-2026-2930/
        - title: Rates (Northern Ireland) Order 1977, arts 6, 7 and 9
          href: https://www.legislation.gov.uk/nisi/1977/2157/article/9
        - title: ONS, Country and regional public sector finances methodology guide, sections 29 and 30
          href: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicsectorfinance/methodologies/countryandregionalpublicsectorfinancesmethodologyguide

