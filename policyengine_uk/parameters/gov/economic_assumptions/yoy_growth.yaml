  # (uprate_council_tax, #2067). The fiscal year starting in year t is stored
  # at t-01-01, as growth over the year before, rounded to 4 decimals.
  #
  # 2025 is the October 2026 EFO's 2025-26 receipts outturn over the March
  # 2026 EFO's 2024-25 outturn, and 2026-2031 are its receipts forecasts
