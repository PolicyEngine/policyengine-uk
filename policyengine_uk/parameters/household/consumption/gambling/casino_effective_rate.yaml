description: The model attributes household casino Gaming Duty at this empirical fraction of supplied dutiable casino yield. It divides HMRC UK cash Gaming Duty receipts of GBP 165.397 million by provisional Gambling Commission GB casino game yield of GBP 702.36095883367 million for April 2024 to March 2025, rounded to six fractional decimals and held constant after model year 2024. Geography, receipt timing and model-year differences remain unresolved; review and refresh are tracked at https://github.com/PolicyEngine/policyengine-uk/issues/2587.
values:
  '2024-01-01': 0.235487
