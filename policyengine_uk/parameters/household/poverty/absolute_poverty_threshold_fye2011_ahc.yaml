description: Absolute poverty threshold on the FYE 2011 reference line for equivalised household net income, after housing costs, in every year.
values:
  # 60% of the FYE 2011 AHC median held constant in real terms, HBAI's
  # absolute low-income line until its March 2026 release. FYE 2011 to FYE
  # 2021 match absolute_poverty_threshold_bhc, which keeps this line for
  # those years: 60% of DWP's published FYE 2011 median in each year's
  # prices (UK Data Service SN 5828), to the penny. Unlike that parameter,
  # these values do not move when HBAI rebases more years to FYE 2025.
  2010-01-01: 214.9
  2011-01-01: 224.15
  2012-01-01: 230.08
  2013-01-01: 235.29
  2014-01-01: 237.43
  2015-01-01: 237.43
  2016-01-01: 239.8
  2017-01-01: 247.15
  2018-01-01: 253.08
  2019-01-01: 257.59
  2020-01-01: 259.01
  # FYE 2022 to FYE 2025: 60% of the FYE 2011 median in that year's prices
  # in table 1.2b of the HBAI edition for that year, to the penny:
  # 450.2696 (FYE 2022 edition), 498.4987 (FYE 2023), 526.5664 (FYE 2024)
  # and 536.4494 (FYE 2025). Each is the FYE 2011 median, 358.16, times HBAI's
  # annual AHC deflator for the year over its FYE 2011 value of 90.6:
  # 113.9, 126.1, 133.2 and 135.7. Later years uprate by headline OBR CPI,
  # an approximation: HBAI would use its own CPI variant, which the OBR
  # does not forecast.
  2021-01-01: 270.16
  2022-01-01: 299.10
  2023-01-01: 315.94
  2024-01-01: 321.87
