description: Absolute poverty threshold on the FYE 2011 reference line for equivalised household net income, before housing costs, in every year.
values:
  # 60% of the FYE 2011 BHC median held constant in real terms, HBAI's
  # absolute low-income line until its March 2026 release. FYE 2011 to FYE
  # 2021 match absolute_poverty_threshold_bhc, which keeps this line for
  # those years: 60% of DWP's published FYE 2011 median in each year's
  # prices (UK Data Service SN 5828), to the penny. Unlike that parameter,
  # these values do not move when HBAI rebases more years to FYE 2025.
  2010-01-01: 251.35
  2011-01-01: 261.9
  2012-01-01: 268.84
  2013-01-01: 274.95
  2014-01-01: 277.73
  2015-01-01: 278.01
  2016-01-01: 280.51
  2017-01-01: 288.01
  2018-01-01: 294.95
  2019-01-01: 300.23
  2020-01-01: 301.34
  # FYE 2022 to FYE 2025: 60% of the FYE 2011 median in that year's prices
  # in table 1.2b of the HBAI edition for that year, to the penny:
  # 523.5220 (FYE 2022 edition), 578.1423 (FYE 2023), 616.5617 (FYE 2024)
  # and 634.6141 (FYE 2025). Each is the FYE 2011 median, 418.91, times HBAI's
  # annual BHC deflator for the year over its FYE 2011 value of 90.5:
  # 113.1, 124.9, 133.2 and 137.1. Later years uprate by headline OBR CPI,
  # an approximation: HBAI would use its own CPI variant, which the OBR
  # does not forecast.
  2021-01-01: 314.11
  2022-01-01: 346.89
  2023-01-01: 369.94
  2024-01-01: 380.77
