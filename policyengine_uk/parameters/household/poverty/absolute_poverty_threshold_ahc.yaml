description: Absolute poverty threshold for equivalised household net income, after housing costs.
values:
  # FYE 2011 reference year, which HBAI keeps for years before FYE 2022: 60%
  # of the FYE 2011 AHC median held constant in real terms. Each value is 60%
  # of DWP's published FYE 2011 absolute median in that year's prices (UK Data
  # Service SN 5828), to the penny. That series is the FYE 2011 median, 358.16
  # a week (first published as 359 and revised back to FYE 2011 in the FYE
  # 2020 edition), times the ratio of HBAI's annual AHC deflator for the year
  # to its FYE 2011 value. The annual deflator is the April-to-March mean of
  # the monthly ONS CPI excluding rents, maintenance repairs and water
  # charges, rounded to one decimal place, and HBAI has not revised it for
  # these years: 90.6 (FYE 2011), 94.5, 97.0, 99.2, 100.1, 100.1, 101.1,
  # 104.2, 106.7, 108.6 and 109.2 (FYE 2021). The deflator, and so the line,
  # is flat from FYE 2015 to FYE 2016. HBAI's March 2027 release is due to
  # move FYE 2019 to FYE 2021 to the FYE 2025 reference.
  2010-01-01: 214.9
  2011-01-01: 224.15
  2012-01-01: 230.08
  2013-01-01: 235.29
  2014-01-01: 237.43
  2015-01-01: 237.43
  2016-01-01: 239.8
  2017-01-01: 247.15
  2018-01-01: 253.08
  2019-01-01: 257.59
  2020-01-01: 259.01
  # FYE 2025 reference year: 60% of the FYE 2025 AHC median, 373.8864 a
  # week in HBAI table 2.4ts (the median is 623.14; the report rounds it to
  # 623). HBAI applies it from FYE 2022, the first year with administrative
  # data linking. FYE 2022 to FYE 2024 carry the FYE 2025 line back by HBAI's
  # annual AHC deflator AHCYRDEF: the financial-year average of the ONS CPI
  # excluding rents, maintenance repairs and water charges (ad hoc 2863),
  # rounded to 1 decimal place (HBAI variables guide, Deflators sheet): 113.9
  # (FYE 2022), 126.1 (FYE 2023), 133.2 (FYE 2024) and 135.7 (FYE 2025), so
  # 373.8864 x AHCYRDEF / 135.7. Later years uprate by headline OBR CPI, an
  # approximation: HBAI would use its own CPI variants, which the OBR does
  # not forecast.
  2021-01-01: 313.82
  2022-01-01: 347.44
  2023-01-01: 367.00
  2024-01-01: 373.89
