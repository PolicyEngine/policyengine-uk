description: Absolute poverty threshold for equivalised household net income, after housing costs.
values:
  # FYE 2011 reference year: 60% of the FYE 2011 AHC median (359 a week).
  # HBAI keeps this reference for years before FYE 2022.
  2010-01-01: 215.4
  2020-01-01: 261.92
  # FYE 2025 reference year: 60% of the FYE 2025 AHC median (623 a week),
  # which HBAI applies from FYE 2022, the first year with administrative
  # data linking. FYE 2022 to FYE 2024 carry the FYE 2025 line back by
  # financial-year averages of HBAI's AHC deflator (ONS CPI excluding rents,
  # maintenance repairs and water charges, ad hoc 2863): 373.80 x index(FY)
  # / index(FYE 2025), where the FY averages are 113.850 (FYE 2022), 126.050
  # (FYE 2023), 133.217 (FYE 2024) and 135.675 (FYE 2025). Later years uprate
  # by OBR CPI.
  2021-01-01: 313.67
  2022-01-01: 347.28
  2023-01-01: 367.03
  2024-01-01: 373.80
