description: Absolute poverty threshold for equivalised household net income, before housing costs.
values:
  # FYE 2011 reference year: 60% of the FYE 2011 BHC median (419 a week).
  # HBAI keeps this reference for years before FYE 2022.
  2010-01-01: 251.4
  2020-01-01: 305.7
  # FYE 2025 reference year: 60% of the FYE 2025 BHC median (719 a week),
  # which HBAI applies from FYE 2022, the first year with administrative
  # data linking. FYE 2022 to FYE 2024 carry the FYE 2025 line back by
  # financial-year averages of HBAI's BHC deflator (ONS experimental CPI
  # including mortgage interest payments, ground rent and dwelling
  # insurance, ad hoc 2863): 431.40 x index(FY) / index(FYE 2025), where the
  # FY averages are 113.100 (FYE 2022), 124.875 (FYE 2023), 133.208 (FYE
  # 2024) and 137.133 (FYE 2025). Later years uprate by OBR CPI.
  2021-01-01: 355.79
  2022-01-01: 392.84
  2023-01-01: 419.05
  2024-01-01: 431.40
metadata:
