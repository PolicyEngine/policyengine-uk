description: Absolute poverty threshold for equivalised household net income, before housing costs.
values:
  # FYE 2011 reference year: 60% of the FYE 2011 BHC median (419 a week).
  # HBAI keeps this reference for years before FYE 2022.
  2010-01-01: 251.4
  2020-01-01: 305.7
  # FYE 2025 reference year: 60% of the FYE 2025 BHC median, 431.6886 a
  # week in HBAI table 2.4ts (the median is 719.48; the report rounds it to
  # 719). HBAI applies it from FYE 2022, the first year with administrative
  # data linking. FYE 2022 to FYE 2024 carry the FYE 2025 line back by HBAI's
  # annual BHC deflator BHCYRDEF: the financial-year average of the ONS
  # experimental CPI including mortgage interest payments, ground rent and
  # dwelling insurance (ad hoc 2863), rounded to 1 decimal place (HBAI
  # variables guide, Deflators sheet): 113.1 (FYE 2022), 124.9 (FYE 2023),
  # 133.2 (FYE 2024) and 137.1 (FYE 2025), so 431.6886 x BHCYRDEF / 137.1.
  # These ratios reproduce the deflator implied by HBAI table 1.2a. Later
  # years uprate by headline OBR CPI, an approximation: HBAI would use its
  # own CPI variants, which the OBR does not forecast.
  2021-01-01: 356.12
  2022-01-01: 393.27
  2023-01-01: 419.41
  2024-01-01: 431.69
